<div id="global-alert" class="global-alert hidden">
    <p id="global-alert-message"></p>
    <button id="global-alert-close" class="alert-close-btn">&times;</button>
</div>

<div id="planner-page" class="page-view">
    <section class="data-source-container">
        <input type="url" id="config-url-input" placeholder="URL del tuo file config.json...">
        <button id="load-config-btn" class="btn btn-primary"></button>
        <button id="share-config-btn" class="btn-view" title="Condividi Configurazione">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"></path></svg>
        </button>
        <span id="info-icon" title="Mostra formato JSON richiesto">ℹ️</span>
    </section>
    <section class="view-container">
        <header class="calendar-header">
            <button id="prev-week-btn" class="btn btn-secondary">&lt;</button>
            <h2 id="week-title"></h2>
            <button id="next-week-btn" class="btn btn-secondary">&gt;</button>
        </header>
         <div class="planner-controls-wrapper">
            <div class="view-switcher">
                <button id="view-calendar-btn" class="btn-view active" title="Vista Calendario">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"></path></svg>
                </button>
                <button id="view-log-btn" class="btn-view" title="Vista Registro">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"></path></svg>
                </button>
            </div>
            <div class="planner-actions">
              <button id="copy-week-btn" class="btn btn-secondary"></button>
              <button id="reset-btn" class="btn btn-secondary"></button>
            </div>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
        <div id="log-view" class="log-view hidden"></div>
    </section>
</div>
