<div id="debriefing-page" class="page-view hidden">
    <h3 id="debriefing-title"></h3>
    <div id="debriefing-stats-container">
        <h4 id="debriefing-stats-title"></h4>
        <div id="debriefing-stats">
            </div>
    </div>
    <div id="debriefing-summary">
        </div>

    <div id="debriefing-feedback" class="debriefing-card">
        <div class="form-group">
            <label id="debriefing-rpe-label" for="rpe-input"></label>
            <input type="number" id="rpe-input" name="rpe" min="1" max="10" placeholder="1-10">
        </div>
        <button id="save-rpe-btn" class="btn btn-secondary"></button>
    </div>

    <button id="back-to-planner-btn" class="btn btn-primary"></button>
</div>
