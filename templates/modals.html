<div id="manual-workout-modal" class="modal-overlay modal-hidden">
    <div class="modal-content">
        <div class="modal-header">
          <h3 id="manual-workout-modal-title"></h3>
          <button class="modal-close-btn" data-target="manual-workout-modal"></button>
        </div>
        <div class="modal-body">
            <form id="manual-workout-form" class="structured-form">
                <div class="form-group">
                    <label id="manual-workout-name-label" for="manual-workout-name"></label>
                    <input type="text" id="manual-workout-name" name="name" required>
                </div>
                <div class="form-group">
                    <label id="manual-workout-duration-label" for="manual-workout-duration"></label>
                    <input type="text" id="manual-workout-duration" name="duration">
                </div>
                <div class="form-group">
                    <label id="manual-workout-distance-label" for="manual-workout-distance"></label>
                    <input type="number" id="manual-workout-distance" name="distance" min="0" step="0.1">
                </div>
                <div class="form-group">
                    <label id="manual-workout-fc-avg-label" for="manual-workout-fc-avg"></label>
                    <input type="number" id="manual-workout-fc-avg" name="fc_avg" min="0">
                </div>
                <div class="form-group">
                    <label id="manual-workout-fc-max-label" for="manual-workout-fc-max"></label>
                    <input type="number" id="manual-workout-fc-max" name="fc_max" min="0">
                </div>
                <div class="form-group full-width">
                    <label id="manual-workout-notes-label" for="manual-workout-notes"></label>
                    <textarea id="manual-workout-notes" name="notes" rows="3"></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="submit" form="manual-workout-form" class="btn btn-primary" id="manual-workout-save-btn"></button>
        </div>
    </div>
</div>

<div id="meal-editor-modal" class="modal-overlay modal-hidden">
  <div class="modal-content modal-content-large">
      <div class="modal-header">
        <h3 id="meal-editor-title"></h3>
        <button class="modal-close-btn" data-target="meal-editor-modal"></button>
      </div>
      <div id="meal-editor-body" class="modal-body">
          <form id="meal-editor-form">
              <div class="meal-editor-form-grid">
                  <div class="form-group">
                      <label for="meal-edit-id">ID Pasto (univoco)</label>
                      <input type="text" id="meal-edit-id" name="id" required>
                  </div>
                  <div class="form-group">
                      <label for="meal-edit-nomePasto">Nome Pasto</label>
                      <input type="text" id="meal-edit-nomePasto" name="nomePasto" required>
                  </div>
              </div>
              <div class="form-group">
                  <label>Tipo Pasto (seleziona uno o più)</label>
                  <div id="meal-edit-tipoPasto-container" class="checkbox-group"></div>
              </div>
              <div class="meal-editor-ingredients-header">
                <h4>Ingredienti</h4>
                <button type="button" id="meal-add-ingredient-btn" class="btn btn-secondary">Aggiungi</button>
              </div>
              <div id="meal-editor-ingredients-list" class="day-editor-list"></div>
              <div class="meal-editor-footer">
                <p id="meal-editor-totals" class="meal-editor-totals"></p>
              </div>
          </form>
      </div>
      <div class="modal-footer">
          <button type="submit" form="meal-editor-form" id="meal-editor-save-btn" class="btn btn-primary"></button>
      </div>
  </div>
 </div>
