<div id="trainer-page" class="page-view hidden">
    <header class="trainer-header">
        <button id="trainer-back-btn" class="btn btn-secondary">Indietro</button>
        <h2 id="trainer-title">Allenamento</h2>
        <button id="trainer-end-btn" class="btn btn-danger">Termina</button>
    </header>
    <div class="trainer-body">
        <div class="exercise-info-container">
            <h3 id="current-exercise-name"></h3>
            <p id="current-exercise-details"></p>
        </div>

        <div id="trainer-display-modes">

            <div id="mode-tempo-guided" class="hidden">
                <div class="timer-ring-container">
                    <div id="tempo-phase-name" class="timer-ring-display"></div>
                </div>
            </div>

            <div id="mode-static-hold" class="hidden">
                <div class="timer-ring-container">
                    <div id="static-hold-timer" class="timer-ring-display"></div>
                </div>
            </div>

            <div id="mode-manual-reps" class="hidden">
                <div class="manual-rep-counter-container">
                    <p>Ripetizioni Eseguite:</p>
                    <div id="manual-rep-count" class="manual-rep-counter"></div>
                </div>
            </div>
        </div>

        <div id="trainer-main-controls" class="trainer-controls">
            </div>

        <div class="upcoming-exercises-container">
            <h4>A seguire:</h4>
            <ul id="upcoming-exercises-list" class="upcoming-exercises-list">
            </ul>
        </div>
    </div>
</div>
