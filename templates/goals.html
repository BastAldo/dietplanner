<div id="goals-page" class="page-view hidden">
    <h3 id="goals-title"></h3>
    <form id="goals-form" class="goals-form">
        <div class="form-group">
            <label id="goal-calories-label" for="goal-calories"></label>
            <input type="number" id="goal-calories" name="avg_calories" min="0">
        </div>
        <div class="form-group">
            <label id="goal-workouts-label" for="goal-workouts"></label>
            <input type="number" id="goal-workouts" name="num_workouts" min="0">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="goals-save-btn"></button>
        </div>
    </form>
</div>
