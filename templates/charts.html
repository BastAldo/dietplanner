<div id="charts-page" class="page-view hidden">
    <h3 id="charts-title">Dashboard Grafici</h3>

    <div class="charts-controls">
        <button id="charts-prev-btn" class="btn btn-secondary" title="Periodo Precedente">&lt;</button>
        <div id="date-range" style="font-weight: bold; text-align: center; min-width: 150px;"></div>
        <div id="charts-range-filter" class="range-filter">
            <button class="btn btn-secondary range-filter-btn" data-range="7">7G</button>
            <button class="btn btn-secondary range-filter-btn active" data-range="30">30G</button>
            <button class="btn btn-secondary range-filter-btn" data-range="90">90G</button>
            <button class="btn btn-secondary range-filter-btn" data-range="365">Anno</button>
            <button class="btn btn-secondary range-filter-btn" data-range="all">Sempre</button>
        </div>
        <button id="charts-next-btn" class="btn btn-secondary" title="Periodo Successivo">&gt;</button>
    </div>

    <div id="charts-summary-stats" class="charts-summary-stats"></div>

    <div id="charts-container" class="charts-container">
        <div class="chart-card">
            <div class="chart-header">
                <h4 id="biometrics-chart-title">Andamento Dati Biometrici</h4>
            </div>
            <div class="chart-header-controls" id="biometric-selector"></div>
            <div class="chart-canvas-container">
              <canvas id="biometrics-chart-canvas"></canvas>
              <p id="biometrics-chart-placeholder" class="placeholder-text hidden"></p>
            </div>
        </div>
        <div class="chart-card">
            <div class="chart-header">
                <h4 id="velocity-chart-title">Trend del Peso</h4>
            </div>
            <div class="chart-canvas-container">
              <canvas id="velocity-chart-canvas"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <div class="chart-header">
                <h4 id="planner-chart-title">Riepilogo Calorie Settimanali</h4>
                <div class="chart-header-controls">
                    <div class="chart-type-switcher">
                        <button class="btn-chart-type active" data-type="bar">Barre</button>
                        <button class="btn-chart-type" data-type="line">Linee</button>
                    </div>
                    <button class="btn-expand-chart" data-chart-id="planner" title="Espandi Grafico"></button>
                </div>
            </div>
            <div class="chart-canvas-container">
              <canvas id="planner-chart-canvas"></canvas>
            </div>
        </div>
        <div class="chart-card">
            <div class="chart-header">
                <h4 id="correlation-chart-title">Correlazione Peso e Calorie</h4>
            </div>
            <div class="chart-canvas-container">
              <canvas id="correlation-chart-canvas"></canvas>
            </div>
        </div>
    </div>
</div>
