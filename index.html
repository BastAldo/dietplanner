<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocollo Dinamico</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="src/main.js" type="module" defer></script>
</head>
<body>
    <header><h1>🗓️ Protocollo Dinamico</h1></header>
    <section class="data-source-container">
        <input type="url" id="config-url-input" placeholder="URL del tuo file config.json...">
        <button id="load-config-btn" class="btn btn-primary">Carica</button>
        <span id="info-icon" title="Mostra formato JSON richiesto">ℹ️</span>
    </section>
    <main class="main-container">
        <section id="calendar-view" class="calendar-container">
            <h2>Piano Settimanale</h2>
            <div id="calendar-grid" class="calendar-grid"></div>
        </section>
        <aside class="library-container">
            <div class="library-header">
                <h2>📚 Libreria Pasti</h2>
                <div id="filter-container" class="filter-container">
                    <button class="filter-btn is-active" data-filter="all">Tutti</button>
                    <button class="filter-btn" data-filter="Pranzo">Pranzo</button>
                    <button class="filter-btn" data-filter="Cena">Cena</button>
                </div>
            </div>
            <div id="meal-library" class="meal-library"><p>Carica una configurazione per iniziare.</p></div>
        </aside>
    </main>
    <footer>
        <button id="reset-btn" class="btn btn-secondary">Reset</button>
        <button id="print-btn" class="btn btn-primary">Stampa 🖨️</button>
    </footer>
    
    <div id="info-modal" class="modal-overlay modal-hidden"> </div>
    <div id="notification-modal" class="modal-overlay modal-hidden"> </div>

    <div id="selection-modal" class="modal-overlay modal-hidden">
        <div class="modal-content">
            <button class="modal-close-btn" data-target="selection-modal">&times;</button>
            <h3 id="selection-modal-title">Scegli un pasto</h3>
            <div id="selection-modal-list" class="selection-list"></div>
        </div>
    </div>
</body>
</html>
