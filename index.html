<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1d">
    <title>NutriPlan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="src/main.js" type="module" defer></script>
</head>
<body>

    <header class="app-header">
        <div class="app-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zM8.293 16.707l1.414-1.414L12 17.586l2.293-2.293 1.414 1.414L12 20.414l-3.707-3.707zM12 3.586l2.293 2.293-1.414 1.414L12 5l-2.293 2.293-1.414-1.414L12 3.586z"></path></svg>
            <h1 id="main-title">NutriPlan</h1>
        </div>
    </header>

    <div id="app-container">
        <section class="data-source-container">
            <input type="url" id="config-url-input" placeholder="URL del tuo file config.json...">
            <button id="load-config-btn" class="btn btn-primary"></button>
            <span id="info-icon" title="Mostra formato JSON richiesto">ℹ️</span>
        </section>

        <main class="main-container">
            <section class="view-container">
                <header class="calendar-header">
                    <button id="prev-week-btn" class="btn btn-secondary">&lt;</button>
                    <h2 id="week-title"></h2>
                    <button id="next-week-btn" class="btn btn-secondary">&gt;</button>
                </header>
                <div class="calendar-controls">
                  <div class="view-switcher">
                      <button id="view-calendar-btn" class="btn-view active" title="Vista Calendario">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M7 11h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm-8 4h2v2H7v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zM5 22h14c1.103 0 2-.897 2-2V6c0-1.103-.897-2-2-2h-2V2h-2v2H9V2H7v2H5c-1.103 0-2 .897-2 2v14c0 1.103.897 2 2 2zM5 6h14v2H5V6z"></path></svg>
                      </button>
                      <button id="view-log-btn" class="btn-view" title="Vista Registro">
                          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"></path></svg>
                      </button>
                  </div>
                  <button id="copy-week-btn" class="btn btn-secondary">Copia Precedente</button>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
                <div id="log-view" class="log-view hidden"></div>
            </section>
        </main>

        <footer class="app-footer">
            <button id="reset-btn" class="btn btn-secondary"></button>
        </footer>
    </div>

    <div id="info-modal" class="modal-overlay modal-hidden">
        <div class="modal-content">
            <div class="modal-header">
              <h3 id="info-modal-title"></h3>
              <button class="modal-close-btn" data-target="info-modal">&times;</button>
            </div>
            <div class="modal-body">
                <p id="info-modal-desc"></p>
                <pre><code id="info-modal-json-example"></code></pre>
            </div>
        </div>
    </div>

    <div id="notification-modal" class="modal-overlay modal-hidden">
      <div class="modal-content notification-box">
        <div class="modal-body">
          <p id="notification-message"></p>
        </div>
        <button class="modal-close-btn" data-target="notification-modal">&times;</button>
      </div>
    </div>

    <div id="selection-modal" class="modal-overlay modal-hidden">
        <div class="modal-content">
            <div class="modal-header">
              <h3 id="selection-modal-title"></h3>
              <button class="modal-close-btn" data-target="selection-modal">&times;</button>
            </div>
            <div id="selection-modal-list" class="modal-body selection-list"></div>
        </div>
    </div>

    <div id="day-editor-modal" class="modal-overlay modal-hidden">
      <div class="modal-content">
          <div class="modal-header">
            <h3 id="day-editor-title"></h3>
            <button class="modal-close-btn" data-target="day-editor-modal">&times;</button>
          </div>
          <div id="day-editor-body" class="modal-body day-editor-list"></div>
      </div>
    </div>

</body>
</html>
