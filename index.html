<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1d">
    <title>HealtyPro</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/planner.css">
    <link rel="stylesheet" href="styles/progress.css">
    <link rel="stylesheet" href="styles/modals.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="src/main.js" type="module" defer></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

                <h1 id="main-title"></h1>
            </div>
            <nav id="main-nav" class="main-nav">
                <button id="nav-planner" class="btn-nav">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" width="24" height="24">

                    </svg>
                    <span></span>
                </button>
                <button id="nav-progress" class="btn-nav">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="currentColor" width="24" height="24">
                        <path d="M135.2 117.4C140.6 108.3 151.7 104 163.2 104h185.6c11.5 0 22.6 4.3 30.1 13.4l1.3 .2zM320 224c0-26.5-21.5-48-48-48s-48 21.5-48 48s21.5 48 48 48s48-21.5 48-48zm-48-80c53 0 96 43 96 96s-43 96-96 96s-96-43-96-96s43-96 96-96zm-160 0c53 0 96 43 96 96s-43 96-96 96s-96-43-96-96s43-96 96-96zM480 224c0 26.5-21.5 48-48 48s-48-21.5-48-48s21.5-48 48-48s48 21.5 48 48zM96 368c0 8.8 7.2 16 16 16H400c8.8 0 16-7.2 16-16s-7.2-16-16-16H112c-8.8 0-16 7.2-16 16z"/>
                    </svg>
                    <span></span>
                </button>
                <button id="nav-profile" class="btn-nav">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" width="24" height="24">
                        <path d="M224 256c70.7 0 128-57.3 128-128S294.7 0 224 0S96 57.3 96 128s57.3 128 128 128zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512H418.3c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304H178.3z"/>

                    <span></span>
                </button>
            </nav>
        </div>
    </header>

    <main id="app-container">
        </main>

    <footer class="app-footer">
        <button id="restore-btn" class="btn btn-secondary"></button>
        <button id="backup-btn" class="btn btn-secondary"></button>
    </footer>

    <div id="modal-container">
        </div>
</body>
</html>
