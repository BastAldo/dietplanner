<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1d">
    <title>HealtyPro</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/planner.css">
    <link rel="stylesheet" href="styles/progress.css">
    <link rel="stylesheet" href="styles/modals.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="icon.svg">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <script src="src/main.js" type="module" defer></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <header class="app-header">
        <div class="header-content">
            <div class="app-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zM8.293 16.707l1.414-1.414L12 17.586l2.293-2.293 1.414 1.414L12 20.414l-3.707-3.707zM12 3.586l2.293 2.293-1.414 1.414L12 5l-2.293 2.293-1.414-1.414L12 3.586z"></path></svg>
                <h1 id="main-title"></h1>
            </div>
            <nav id="main-nav" class="main-nav">
                <button id="nav-planner" class="btn-nav">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"></path></svg>
                    <span></span>
                </button>
                <button id="nav-progress" class="btn-nav">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm2.293 13.293-3 3-1.586-1.586L11 15.414l-1.293-1.293-1.414 1.414 2.293 2.293L12 19.121l3.707-3.707-1.414-1.414L13 15.414l1.293-1.293zM12 4c-2.022 0-3.834.7-5.263 2.05A7.954 7.954 0 0 0 4 12c0 1.831.624 3.533 1.737 4.95C7.166 18.3 8.978 19 11 19v-2c-1.299 0-2.45-.418-3.344-1.28C6.773 14.849 6.232 13.488 6 12H4c.232-2.488 1.773-4.151 2.656-5.02C8.549 5.25 10.299 5 12 5c2.313 0 4.295 1.433 5 3h2c-.705-2.567-3.687-4-7-4z"></path></svg>
                    <span></span>
                </button>
                <button id="nav-profile" class="btn-nav">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3zm9 11v-1a7 7 0 0 0-7-7h-4a7 7 0 0 0-7 7v1h2v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1z"></path></svg>
                    <span></span>
                </button>
            </nav>
        </div>
    </header>

    <main id="app-container">
        </main>

    <footer class="app-footer">
        <button id="restore-btn" class="btn btn-secondary"></button>
        <button id="backup-btn" class="btn btn-secondary"></button>
    </footer>

    <div id="modal-container">
        </div>
</body>
</html>
