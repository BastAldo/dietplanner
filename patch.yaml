commit_message: "refactor(trainer): Implement robust, sequential workout execution engine"
rationale: |
  This patch performs a critical refactoring of the Trainer's execution engine to resolve persistent race conditions and UI glitches. The previous architecture incorrectly conflated the animation loop (`requestAnimationFrame`) with the business logic loop (processing the command queue), leading to synchronization failures.

  The new architecture, based on a correct separation of concerns, implements the "Director-Animator" model:

  1.  **The "Director" - A Master Execution Loop (`runWorkoutLoop` in `trainer.js`):**
      * A new `async` function now serves as the single source of truth for the workout's progression.
      * It iterates through the command queue (`fullExecutionQueue`) in a simple, sequential `for...of` loop.
      * It acts as an orchestrator: for each command, it calls a specialized function (`speak`, `runTimerAnimation`, etc.) and **`await`s its completion** before proceeding to the next command.
      * This completely eliminates race conditions, as there is only one logical thread of execution. `pause/resume` is also handled cleanly within this loop.

  2.  **The "Animator" - A Specialized, Promise-Based Timer (`runTimerAnimation` in `animation.js`):**
      * The `animation.js` module has been refactored. Its sole responsibility is now to render timed animations.
      * The new `runTimerAnimation` function accepts a duration, starts a `requestAnimationFrame` loop (`tick`) purely for drawing, and returns a `Promise`.
      * The `tick` function is now simple: it just updates the UI based on elapsed time. It no longer contains any business logic.
      * Once the duration has elapsed, the animation loop is stopped, and the `Promise` is resolved, signaling completion to the "Director".

  3.  **UI Rendering Fix (`TrainerComponent.js`):**
      * A fix was also included to prevent the accumulation of CSS classes on the timer display. The `render` function now cleans up old state classes before applying new ones, ensuring a consistent and correct visual representation at every step.

  This refactoring makes the trainer engine robust, predictable, and easier to debug. It ensures all commands, including the final audio cue, are executed in the correct sequence and for their full duration, solving all previously reported issues.
