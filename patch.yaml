commit_message: "fix(ui): Ripristina i label nei modal e refattorizza i form per usare UI_TEXT"
rationale: |
  Questo commit risolve un bug critico per cui le etichette (label) in tutti i modal di modifica (es. Ingredienti, Esercizi) erano invisibili. L'audit ha rivelato che ciò era dovuto a una regola CSS troppo generica.

  Inoltre, come da `docs/02_ARCHITECTURE.md` (principio Data-Driven), questo commit completa un refactoring per centralizzare tutte le etichette dei form in `src/config/uiText.js`, rimuovendo le stringhe hardcoded.

  Modifiche apportate:

  1.  **`styles/modals.css`**: La regola CSS `.modal-body .form-group label { display: none; }` è stata resa specifica solo per il modale di conferma (`#confirm-modal .modal-body .form-group label`). Questo risolve il bug visivo e ripristina la visibilità di tutte le etichette negli altri modal.

  2.  **`src/config/forms.js`**:
      * `PROFILE_FIELDS` e `INGREDIENT_FIELDS` sono stati aggiornati. Le etichette hardcoded (es. "Nome") sono state sostituite con chiavi di internazionalizzazione (es. "PROFILE_FIELD_FIRSTNAME"), allineandosi alla convenzione già usata da `EXERCISE_FIELDS`.

  3.  **`src/config/uiText.js`**:
      * Sono state aggiunte tutte le nuove chiavi (es. `PROFILE_FIELD_FIRSTNAME`, `INGREDIENT_FIELD_ID`, `INGREDIENT_FIELD_KCAL`, ecc.) con le loro stringhe italiane corrispondenti.

  4.  **`src/ui/modals/ingredientEditorModal.js`**:
      * La funzione `openIngredientEditorModal` è stata aggiornata. Ora cerca il testo del label in `UI_TEXT` (usando `UI_TEXT[field.label] || field.label`) prima di stamparlo, uniformandosi alla logica di `exerciseEditorModal.js`.

  5.  **`src/ui/pageRenderers.js`**:
      * La funzione `renderProfilePage` è stata aggiornata in modo simile. Ora risolve le etichette e le legende dei fieldset tramite `UI_TEXT`, completando il refactoring.
