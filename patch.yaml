commit_message: "feat(calculator): Aggiunge il calcolo delle calorie per ingredienti a pezzo"
rationale: |
  Questo commit estende il sistema di calcolo calorico per risolvere il problema degli ingredienti misurati in "pezzi" (es. "1 banana") che precedentemente risultavano avere zero calorie.

  La modifica principale consiste nell'introduzione di un nuovo campo opzionale, `g_per_pezzo`, nello schema del file `ingredienti.json`. Questo campo permette di definire il peso medio in grammi per un singolo pezzo di un ingrediente.

  Le modifiche apportate sono:
  1.  **Aggiornamento del `calorieCalculator.js`**: La logica di calcolo è stata potenziata. Ora, se un ingrediente in un pasto è definito tramite `quantita_pezzi`, il calcolatore cercherà il campo `g_per_pezzo` nel file `ingredienti.json`. Se lo trova, calcolerà le calorie corrette moltiplicando il numero di pezzi per il peso per pezzo e per le calorie per grammo. In assenza di questo dato, le calorie rimarranno zero, mantenendo la retrocompatibilità.
  2.  **Miglioramento della Flessibilità**: Questa modifica rende il sistema di calcolo più robusto e flessibile, consentendo di gestire correttamente un'ampia varietà di ingredienti senza dover modificare il codice dell'applicazione. La logica rimane centralizzata nel calcolatore e i dati di peso rimangono, correttamente, nel file di configurazione degli ingredienti.

  Per abilitare il calcolo per la banana, l'utente dovrà aggiornare la corrispondente voce in `ingredienti.json` come segue:
  `{ "id": "banana", "nome": "Banana", "kcal_per_100g": 89, "g_per_pezzo": 120 }`
patches:
  - file: src/core/calorieCalculator.js
    content: |
      function getIngredientById(id, ingredients) {
        return ingredients.find(ing => ing.id === id);
      }

      function calculateIngredientCaloriesRange(ingredientItem, ingredientData) {
        if (!ingredientData || typeof ingredientData.kcal_per_100g !== 'number') return { min: 0, max: 0 };

        const kcalPerGram = ingredientData.kcal_per_100g / 100;
        let min = 0, max = 0;

        if (ingredientItem.quantita_g) {
          min = max = kcalPerGram * ingredientItem.quantita_g;
        } else if (ingredientItem.quantita_g_min && ingredientItem.quantita_g_max) {
          min = kcalPerGram * ingredientItem.quantita_g_min;
          max = kcalPerGram * ingredientItem.quantita_g_max;
        } else if (ingredientItem.quantita_g_min) {
          min = max = kcalPerGram * ingredientItem.quantita_g_min;
        } else if (ingredientItem.quantita_pezzi && typeof ingredientData.g_per_pezzo === 'number') {
          const totalGrams = ingredientItem.quantita_pezzi * ingredientData.g_per_pezzo;
          min = max = kcalPerGram * totalGrams;
        }
        
        return { min, max };
      }


      export function processMealsWithCalories(meals, ingredients) {
        if (!meals || !ingredients) return [];

        return meals.map(meal => {
          let totalMinCalories = 0;
          let totalMaxCalories = 0;

          if (meal.ingredienti && Array.isArray(meal.ingredienti)) {
            meal.ingredienti.forEach(item => {
              const ingredientData = getIngredientById(item.id, ingredients);
              if (ingredientData) {
                const range = calculateIngredientCaloriesRange(item, ingredientData);
                totalMinCalories += range.min;
                totalMaxCalories += range.max;
              }
            });
          }

          return {
            ...meal,
            calories_min: Math.round(totalMinCalories),
            calories_max: Math.round(totalMaxCalories)
          };
        });
      }
commands:
  - "echo 'Calcolatore aggiornato. Aggiungi g_per_pezzo ai tuoi ingredienti per abilitare il calcolo.'"