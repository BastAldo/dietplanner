commit_message: "refactor(ui): Decompone il file monolitico interactions.js per feature"
rationale: |
  Questo commit prosegue il processo di refactoring architetturale, smantellando il file monolitico `src/ui/interactions.js`. Precedentemente, questo file gestiva tutti gli event listener dell'applicazione, creando un forte accoppiamento tra feature non correlate e riducendo la manutenibilità.

  La logica è stata ora separata in moduli più piccoli e coesi, raggruppati per feature:
  1.  **Creazione della directory `src/ui/interactions/`**: Contiene i nuovi moduli specializzati.
  2.  **`plannerInteractions.js`**: Gestisce tutte le interazioni della vista Planner.
  3.  **`progressInteractions.js`**: Gestisce le interazioni della pagina Progressi (dati biometrici).
  4.  **`profileInteractions.js`**: Gestisce le interazioni del profilo utente.
  5.  **`globalInteractions.js`**: Gestisce gli eventi per elementi persistenti come l'header, il footer e i modali.
  6.  **Orchestrazione in `main.js`**: Il file `main.js` è stato aggiornato per importare e chiamare le funzioni di inizializzazione da ciascuno dei nuovi moduli, agendo ora da orchestratore principale per la registrazione degli eventi.
  7.  **Rimozione del File Monolitico**: Il vecchio `src/ui/interactions.js` è stato eliminato.
  8.  **Aggiornamento del Service Worker**: Il file `sw.js` è stato aggiornato per includere i nuovi moduli e rimuovere il riferimento a quello vecchio, garantendo il funzionamento offline.

  Questa modifica migliora notevolmente la struttura del codice, rendendola più modulare, leggibile e facile da estendere.
