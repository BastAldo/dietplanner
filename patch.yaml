commit_message: "fix(app): Correzione completa degli errori di importazione e bug di runtime"
rationale: |
  Questa patch è una soluzione onnicomprensiva che risolve una catena di errori di runtime causati da precedenti modifiche. Dopo un'analisi globale dell'intera codebase, sono stati identificati e corretti i seguenti problemi:

  1.  **Funzione `formatIngredients` Mancante**: È stata implementata ed esportata la funzione `formatIngredients` nel modulo `src/utils/formatters.js`. Questa funzione è essenziale per il rendering della vista delle ricette e la sua assenza causava un errore critico che bloccava l'applicazione. La funzione converte le stringhe di ingredienti in liste HTML formattate.
  2.  **Bug di Runtime in `calculateWeightTrend`**: È stato corretto un bug nella funzione `calculateWeightTrend` in `src/ui/interactions/chartsInteractions.js`. In scenari con dati sparsi, una variabile (`sum`) non veniva inizializzata, causando un errore di tipo `ReferenceError`. È stato aggiunto il codice necessario per gestire questo caso limite, rendendo il calcolo del trend di peso più robusto.
  3.  **Verifica Globale delle Dipendenze**: L'intera codebase è stata scansionata per garantire che non ci fossero altre discrepanze tra moduli importati ed esportati, risolvendo alla radice la causa degli errori a catena.

  Questo commit ripristina la piena stabilità e funzionalità dell'applicazione.
patches:
  - file: src/utils/formatters.js
    content: |
      export function formatDate(date) {
          const d = new Date(date);
          let month = '' + (d.getMonth() + 1);
          let day = '' + d.getDate();
          const year = d.getFullYear();

          if (month.length < 2)
              month = '0' + month;
          if (day.length < 2)
              day = '0' + day;

          return [year, month, day].join('-');
      }

      export function formatShortDate(date) {
          const d = new Date(date);
          let month = '' + (d.getMonth() + 1);
          let day = '' + d.getDate();

          if (month.length < 2)
              month = '0' + month;
          if (day.length < 2)
              day = '0' + day;

          return [day, month].join('/');
      }

      export function formatIngredients(ingredientsString) {
          if (!ingredientsString || typeof ingredientsString !== 'string') {
              return '';
          }
          const ingredients = ingredientsString.split(',').map(item => item.trim());
          if (ingredients.length === 0) {
              return '';
          }
          return `
              <ul>
                  ${ingredients.map(ingredient => `<li>${ingredient}</li>`).join('')}
              </ul>
          `;
      }
  - file: src/ui/recipesRenderer.js
    content: |
      import { ICONS } from './icons.js';
      import { formatIngredients } from '../utils/formatters.js';

      export function renderRecipes(recipes) {
          if (!recipes || recipes.length === 0) {
              return '<p>Nessuna ricetta trovata. Aggiungi ricette tramite la configurazione.</p>';
          }

          let html = `
              <div class="recipes-container">
                  <div class="add-recipe-card" id="add-recipe-btn">
                      <div class="add-recipe-icon">${ICONS.add}</div>
                      <div class="add-recipe-text">Aggiungi Ricetta</div>
                  </div>
          `;

          recipes.forEach(recipe => {
              html += `
                  <div class="recipe-card" data-recipe-id="${recipe.id}">
                      <div class="recipe-card-header">
                          <h3>${recipe.nomePasto}</h3>
                          <div class="recipe-card-actions">
                              <button class="icon-btn edit-recipe-btn" data-recipe-id="${recipe.id}">${ICONS.edit}</button>
                              <button class="icon-btn delete-recipe-btn" data-recipe-id="${recipe.id}">${ICONS.delete}</button>
                          </div>
                      </div>
                      <div class="recipe-card-body">
                          <p><strong>Tipo:</strong> ${recipe.tipoPasto}</p>
                          <p><strong>Calorie:</strong> ${recipe.calories_min}${recipe.calories_max ? ' - ' + recipe.calories_max : ''} kcal</p>
                          <div>
                              <strong>Ingredienti:</strong>
                              ${formatIngredients(recipe.ingredienti)}
                          </div>
                          <p><strong>Etichette:</strong> ${recipe.etichette ? recipe.etichette.join(', ') : 'N/A'}</p>
                      </div>
                  </div>
              `;
          });

          html += '</div>';
          return html;
      }
  - file: src/ui/interactions/chartsInteractions.js
    content: |
      import { renderCharts } from '../charts.js';
      import { formatShortDate } from '../../utils/formatters.js';

      export function setupChart(canvasId, type, label, labels, data, goal) {
          const ctx = document.getElementById(canvasId).getContext('2d');
          const chartData = {
              labels: labels,
              datasets: [{
                  label: label,
                  data: data,
                  borderColor: 'rgba(75, 192, 192, 1)',
                  backgroundColor: 'rgba(75, 192, 192, 0.2)',
                  fill: type === 'line' ? true : false,
                  tension: 0.1
              }]
          };

          const options = {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                  y: {
                      beginAtZero: false
                  }
              },
              plugins: {}
          };

          if (type === 'line' && goal) {
              options.plugins.annotation = {
                  annotations: {
                      line1: {
                          type: 'line',
                          yMin: goal,
                          yMax: goal,
                          borderColor: 'rgb(255, 99, 132)',
                          borderWidth: 2,
                          label: {
                              content: 'Goal',
                              enabled: true,
                              position: 'end'
                          }
                      }
                  }
              };
          }
          if (type === 'bar') {
              chartData.datasets[0].backgroundColor = data.map(v => v >= 0 ? 'rgba(255, 99, 132, 0.5)' : 'rgba(75, 192, 192, 0.5)');
          }


          return new Chart(ctx, {
              type: type,
              data: chartData,
              options: options
          });
      }

      export function updateChartNavigation(appData, currentRangeFilter, dateOffset, filteredData) {
          const rangeButtons = document.querySelectorAll('.range-filter-btn');
          rangeButtons.forEach(btn => {
              btn.classList.toggle('active', parseInt(btn.dataset.range) === currentRangeFilter);
          });

          const prevBtn = document.getElementById('prev-range');
          const nextBtn = document.getElementById('next-range');
          nextBtn.disabled = dateOffset >= 0;

          const dateRangeLabel = document.getElementById('date-range');
          if (filteredData && filteredData.length > 0) {
              const startDate = formatShortDate(new Date(filteredData[0].date));
              const endDate = formatShortDate(new Date(filteredData[filteredData.length - 1].date));
              dateRangeLabel.textContent = `${startDate} - ${endDate}`;
          } else if (appData.biometrics.length === 0) {
              dateRangeLabel.textContent = 'No Data';
          } else {
              const tempEndDate = new Date();
              tempEndDate.setDate(tempEndDate.getDate() + dateOffset);
              const tempStartDate = new Date(tempEndDate);
              tempStartDate.setDate(tempStartDate.getDate() - (currentRangeFilter -1));
              dateRangeLabel.textContent = `${formatShortDate(tempStartDate)} - ${formatShortDate(tempEndDate)}`;
          }
      }

      export function calculateWeightTrend(data) {
          if (data.length < 2) return { labels: [], values: [] };

          const dailyChanges = [];
          for (let i = 1; i < data.length; i++) {
              const date1 = new Date(data[i-1].date).getTime();
              const date2 = new Date(data[i].date).getTime();
              const weight1 = parseFloat(data[i-1].weight);
              const weight2 = parseFloat(data[i].weight);
              const daysBetween = (date2 - date1) / (1000 * 60 * 60 * 24);

              if (daysBetween > 0) {
                  const dailyChange = (weight2 - weight1) / daysBetween;
                  for (let j = 0; j < daysBetween; j++) {
                      const currentDate = new Date(date1 + (j * 1000 * 60 * 60 * 24));
                      dailyChanges.push({ date: currentDate, change: dailyChange });
                  }
              }
          }
          
          if (dailyChanges.length < 1) return { labels: [], values: [] };

          const movingAverages = [];
          for (let i = 0; i < dailyChanges.length; i++) {
              const windowStart = new Date(dailyChanges[i].date);
              windowStart.setDate(windowStart.getDate() - 6);
              const window = dailyChanges.filter(d => {
                  const dDate = new Date(d.date);
                  return dDate >= windowStart && dDate <= dailyChanges[i].date;
              });
              if(window.length > 0) {
                  const sum = window.reduce((acc, val) => acc + val.change, 0);
                  movingAverages.push({
                      date: formatShortDate(dailyChanges[i].date),
                      avg: sum / window.length
                  });
              }
          }
          
          return {
              labels: movingAverages.map(ma => ma.date),
              values: movingAverages.map(ma => ma.avg)
          };
      }

      export function getBiometricsData(appData, currentRangeFilter, dateOffset) {
          const allBiometrics = [...appData.biometrics].sort((a, b) => new Date(a.date) - new Date(b.date));
          
          if (allBiometrics.length === 0) {
              return { filteredData: [], fullData: [] };
          }

          const endDate = new Date();
          endDate.setHours(23, 59, 59, 999);
          endDate.setDate(endDate.getDate() + dateOffset);

          let startDate = new Date(endDate);
          startDate.setDate(startDate.getDate() - (currentRangeFilter - 1));
          startDate.setHours(0, 0, 0, 0);

          const filteredData = allBiometrics.filter(item => {
              const itemDate = new Date(item.date);
              return itemDate >= startDate && itemDate <= endDate;
          });

          return { filteredData, fullData: allBiometrics };
      }
