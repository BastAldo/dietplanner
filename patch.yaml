commit_message: "refactor(trainer): Riprogetta la Vista Trainer con un'architettura a componente"
rationale: |
  Questo commit esegue una riprogettazione fondamentale della Vista Trainer per risolvere i bug `TypeError: Cannot set properties of null` e migliorare la stabilità generale, come da piano approvato. L'approccio imperativo precedente è stato sostituito da un'architettura a componente incapsulato.

  Le modifiche principali sono:

  1.  **Creazione di `TrainerComponent` (`src/ui/components/TrainerComponent.js`):**
      * È stato creato un nuovo componente che gestisce l'intero ciclo di vita della Vista Trainer.
      * **Incapsulamento del DOM:** Il costruttore del componente esegue una query per tutti gli elementi HTML necessari una sola volta e li memorizza come proprietà dell'istanza. Questo elimina completamente gli errori di riferimento a `null` causati da race condition.
      * **Gestione degli Eventi Robusta:** Il metodo `mount` imposta tutti i listener di eventi una sola volta, utilizzando la delegazione di eventi per i controlli. Questo risolve il problema dei listener duplicati o persi durante i re-render.
      * **Rendering Dichiarativo:** Il metodo `render(state)` è ora l'unica porta d'ingresso per gli aggiornamenti della UI. Riceve lo stato completo e aggiorna il DOM in modo dichiarativo, rendendo il flusso dei dati chiaro e prevedibile.
      * **Pulizia delle Risorse:** Il metodo `destroy` è stato aggiunto per rimuovere i listener di eventi, garantendo che non ci siano memory leak quando l'utente lascia la vista.

  2.  **Semplificazione del Controller (`src/ui/trainerRenderer.js`):**
      * Il `trainerRenderer` è stato trasformato in un controller leggero. Il suo unico scopo è creare, gestire e distruggere l'istanza del `TrainerComponent`.
      * Ascolta l'evento `workoutStateChange` e passa il nuovo stato al metodo `render` del componente.

  3.  **Aggiornamento del Flusso Principale (`src/ui/renderer.js`):**
      * Il renderer principale ora chiama `initializeTrainerController` quando si passa alla vista 'trainer' e `destroyTrainerController` quando la si lascia, gestendo correttamente il ciclo di vita del nuovo componente.

  Questa riprogettazione non si limita a correggere i bug, ma migliora significativamente la qualità del codice, la manutenibilità e la robustezza della funzionalità più complessa dell'applicazione.
