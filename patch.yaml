commit_message: "fix(trainer): Final refactor of animation engine to ensure sequential execution"
rationale: |
  This patch provides the definitive fix for the Trainer's execution logic, resolving an issue where the animation would process all non-timed events in a single frame and then stall. This was caused by an overly aggressive `while` loop introduced in a previous fix attempt.

  **Problem Analysis:**
  The `tick` function contained a `while` loop that would synchronously iterate through and execute all non-timed events (`speech`, `audio`) in the `executionQueue`. This had two critical side effects:
  1.  All audio and speech cues for the entire set would fire in a single instant.
  2.  The loop would stop after the last non-timed command, but the logic did not correctly advance to the next state (e.g., calling `completeSet()`). This left the trainer stuck on the last timed `movement` phase of the final repetition.

  **Architectural Solution:**
  The animation engine (`src/core/trainer/animation.js`) has been refactored to a more robust, single-threaded model that correctly handles both timed and asynchronous non-timed events sequentially.

  1.  **Elimination of the `while` loop:** The problematic loop has been removed from the `tick` function.
  2.  **Introduction of `processCurrentPhase`:** A new `async` function, `processCurrentPhase`, is now the sole orchestrator for executing non-timed events. It uses a lock (`isProcessing`) to prevent re-entrant calls.
  3.  **Sequential Execution Guarantee:** `processCurrentPhase` executes a single non-timed command. Crucially, it advances the `currentPhaseIndex` *only after* the command (including awaited speech) is complete. It then immediately calls itself to process the next command in the queue until it encounters a timed `movement` phase.
  4.  **Clear Separation of Concerns:**
      * `tick` is now responsible *only* for handling the passage of time for `movement` phases.
      * When a `movement` phase ends, `tick` calls `processCurrentPhase` to handle what comes next.
      * `processCurrentPhase` handles all `speech` and `audio` events and then yields control back to `tick` when it's time for another `movement`.

  This new architecture ensures that exactly one command is processed at a time, fully respects `await`ed asynchronous operations, and guarantees a stable, predictable, and correct execution flow for the entire workout.
patches:
  - file: src/core/trainer/animation.js
    content: |
      import { getWorkoutState, updateState } from './state.js';
      import { advanceToNextSet } from './machine.js';
      import { completeSet } from '../trainer.js';
      import { playTick, playStartCue, playStopCue, speak } from '../../utils/audioFeedback.js';
      import { log } from '../../utils/logger.js';

      let animationFrameId = null;
      let lastTickTimestamp = 0;
      let isProcessing = false; // Lock to prevent re-entrant processing

      async function processCurrentPhase() {
        if (isProcessing) return;
        const state = getWorkoutState();
        if (state.status !== 'running') return;

        const { executionQueue, currentPhaseIndex } = state;
        const phase = executionQueue[currentPhaseIndex];

        if (!phase) {
          completeSet();
          return;
        }

        // If the phase is timed, stop processing and let tick() handle it
        if (phase.type === 'movement') {
          return;
        }

        isProcessing = true;
        log('Trainer-Animation', `Handling phase:`, phase);
        
        if (state.isAudioEnabled) {
            if (phase.type === 'audio') {
                if (phase.cue === 'tick') playTick();
                else if (phase.cue === 'start') playStartCue();
                else if (phase.cue === 'stop') playStopCue();
            } else if (phase.type === 'speech') {
                if (phase.await) {
                    await speak(phase.text);
                } else {
                    speak(phase.text);
                }
            }
        }
        
        // Check status again, as it might have changed during an awaited speech
        if (getWorkoutState().status === 'running') {
            const newIndex = getWorkoutState().currentPhaseIndex + 1;
            updateState({ 
              currentPhaseIndex: newIndex,
              currentRep: getWorkoutState().executionQueue[newIndex]?.rep || getWorkoutState().currentRep,
            });
            isProcessing = false;
            // Immediately process the next phase if it's also not a timed event
            await processCurrentPhase();
        } else {
            isProcessing = false;
        }
      }


      function tick(timestamp) {
        if (lastTickTimestamp === 0) {
          lastTickTimestamp = timestamp;
        }
        const deltaTime = timestamp - lastTickTimestamp;
        lastTickTimestamp = timestamp;

        const state = getWorkoutState();
        if (state.status !== 'running' && state.status !== 'resting') {
          stopAnimation();
          return;
        }

        if (state.status === 'running') {
          if (state.executionMode === 'tempo_guided') {
            const { executionQueue, currentPhaseIndex } = state;
            const currentPhase = executionQueue[currentPhaseIndex];

            if (!currentPhase) {
              completeSet();
              stopAnimation();
              return;
            }

            if (currentPhase.type === 'movement') {
              const newPhaseTimeElapsed = state.phaseTimeElapsed + deltaTime;
              if (newPhaseTimeElapsed >= currentPhase.duration_ms) {
                updateState({ currentPhaseIndex: currentPhaseIndex + 1, phaseTimeElapsed: 0 });
                processCurrentPhase(); // Process what comes after the movement
              } else {
                updateState({ phaseTimeElapsed: newPhaseTimeElapsed });
              }
            } else {
              // Non-timed events are handled by processCurrentPhase, which is called
              // either after a movement or at the start.
            }

          } else if (state.executionMode === 'static_hold') {
            const newSetTimeRemaining = state.setTimeRemaining - deltaTime;
            if (newSetTimeRemaining <= 0) {
              if (state.isAudioEnabled) playStopCue();
              completeSet();
            } else {
              updateState({ setTimeRemaining: newSetTimeRemaining });
            }
          }
        } else if (state.status === 'resting') {
          const newRestTimeRemaining = state.restTimeRemaining - deltaTime;
          if (newRestTimeRemaining <= 0) {
            advanceToNextSet();
          } else {
            updateState({ restTimeRemaining: newRestTimeRemaining });
          }
        }

        document.dispatchEvent(new CustomEvent('workoutStateChange'));
        animationFrameId = requestAnimationFrame(tick);
      }


      export function startAnimation() {
        if (animationFrameId) return;
        lastTickTimestamp = 0;
        // Initial call to start processing non-timed events at the beginning of the queue
        processCurrentPhase();
        animationFrameId = requestAnimationFrame(tick);
      }

      export function stopAnimation() {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        isProcessing = false; // Reset lock on stop
      }
commands:
  - "echo 'Trainer animation engine definitively fixed. Sequential execution is now guaranteed.'"