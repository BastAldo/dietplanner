commit_message: "refactor(ui): Riprogetta il flusso di avvio del workout e corregge il layout del Trainer"
rationale: |
  Questo commit introduce un significativo miglioramento dell'esperienza utente e corregge diversi problemi di layout, basandosi sul feedback dettagliato.

  Le modifiche principali sono:
  1.  **Flusso di Avvio Workout Semplificato**: Il pulsante "Avvia Allenamento" è stato spostato dal modale "Editor del Giorno" direttamente sulla card del giorno nella vista calendario. Questo rende l'azione principale più accessibile, riducendo i click necessari per iniziare una sessione. La logica di rendering e interazione è stata aggiornata di conseguenza.
  2.  **Layout Header Trainer Corretto (Mobile)**: In `styles/trainer.css`, l'header della vista trainer è stato corretto per centrare correttamente il titolo ed evitare che si sovrapponga ai pulsanti su schermi piccoli.
  3.  **Spaziatura Trainer Ottimizzata**: Lo spazio verticale nella vista Trainer è stato ridistribuito. È stato aggiunto un margine sopra le informazioni dell'esercizio, e il contenitore principale ora usa `justify-content: space-between` per eliminare lo spazio vuoto in fondo alla pagina, rendendo tutti i controlli visibili senza scroll.
  4.  **Correzione Dimensione Timer Ring**: Il raggio dell'SVG del timer in `TrainerComponent.js` è stato aumentato per corrispondere alle dimensioni del suo contenitore CSS. Questo risolve il problema del ring che appariva troppo piccolo e del testo (es. "RECUPERO") che andava a capo.
  5.  **Risoluzione Layout Shift**: Il "salto" del layout nella vista Trainer quando appariva o scompariva il contatore delle ripetizioni è stato risolto. Invece di svuotare il contenuto dell'elemento, ora viene applicata una classe CSS che imposta `visibility: hidden`, preservando lo spazio occupato ed eliminando il fastidioso spostamento degli elementi.
