commit_message: "refactor(arch): Centralizza la logica di modifica degli esercizi nel core"
rationale: |
  Questo commit prosegue il refactoring architetturale iniziato in precedenza, applicando lo stesso pattern di centralizzazione della logica di business al modale di modifica degli esercizi.

  1. **Logica Spostata nel Core (`state.js`)**: Tutta la logica per trovare e aggiornare gli esercizi, sia quelli pianificati che quelli registrati nello storico, è stata estratta dai componenti UI e centralizzata in `src/core/state.js`. Sono state create nuove funzioni "selettore" (`getExerciseForPlanner`, `getExerciseFromHistory`) per recuperare i dati e sono state rafforzate le funzioni esistenti per il salvataggio (`updateExerciseInstanceInWorkout`, `updateExerciseSetsInHistory`), che ora agiscono come unici punti di modifica dello stato.

  2. **Componenti UI Semplificati**: Di conseguenza, i componenti dell'interfaccia utente sono stati notevolmente semplificati.
      - I "chiamanti" (`plannerInteractions.js` e `workoutEditorModal.js`) ora hanno la responsabilità di recuperare i dati tramite i nuovi selettori prima di invocare il modale.
      - Il modale di modifica (`exerciseEditorModal.js`) è stato trasformato in un componente puramente presentazionale. Adesso riceve un oggetto esercizio già pronto e una funzione di callback per il salvataggio, senza più contenere logica di business complessa.

  Questo refactoring migliora drasticamente la separazione delle responsabilità (SoC), aumenta la manutenibilità del codice e rende l'architettura generale dell'applicazione più robusta, coerente e facile da estendere in futuro.
patches:
  - file: src/core/state.js
    content: |
      import { LOCAL_STORAGE_KEY_PLAN, LOCAL_STORAGE_KEY_URL, MEAL_TYPES, LOCAL_STORAGE_KEY_BIOMETRICS, LOCAL_STORAGE_KEY_PROFILE, LOCAL_STORAGE_KEY_WORKOUTS, WORKOUT_SLOT_ID, LOCAL_STORAGE_KEY_WORKOUT_HISTORY, LOCAL_STORAGE_KEY_GOALS } from '../utils/constants.js';
      import { processMealsWithCalories } from './calorieCalculator.js';
      import { resetWorkoutState } from './trainer.js';
      import { log } from '../utils/logger.js';

      let state = {
        rules: [],
        masterMealList: [],
        masterWorkoutList: [],
        weeklyPlan: {},
        weeklyWorkouts: {},
        workoutHistory: {},
        biometricData: [],
        userProfile: {},
        userGoals: {},
        configUrl: '',
        recipeBaseUrl: '',
        focusedDate: new Date(),
        currentView: 'planner', // 'planner', 'log', 'progress', 'charts', 'recipes', 'profile', 'trainer', 'debriefing', 'goals'
        debugMode: false,
        lastWorkoutSummary: null,
      };

      const notify = () => document.dispatchEvent(new CustomEvent('stateChange'));
      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);

      const getWeekStartDate = (date) => {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
      };

      export const getState = () => ({ ...state });

      export function getMealsForType(mealType) {
        return state.masterMealList.filter(meal => {
          if (meal.tipoPasto === 'Tutti') return true;
          if (Array.isArray(meal.tipoPasto)) {
            return meal.tipoPasto.includes(mealType);
          }
          return meal.tipoPasto === mealType;
        });
      }

      export function getExerciseForPlanner(slotId, instanceId) {
        const workoutList = state.weeklyWorkouts[slotId] || [];
        return workoutList.find(ex => ex.instanceId === parseFloat(instanceId));
      }

      export function getExerciseFromHistory(date, startTime, instanceId) {
        const workout = state.workoutHistory[date]?.find(w => w.startTime === startTime);
        if (!workout) return null;
        return workout.exercises.find(ex => ex.instanceId === instanceId);
      }

      export function toggleDebugMode() {
        state.debugMode = !state.debugMode;
        console.log(`%cDebug mode is now ${state.debugMode ? 'ON' : 'OFF'}`, 'color: white; background-color: #ef5350; padding: 4px; border-radius: 4px;');
      }

      export function setPlannerConfig(config, url) {
        log('State', 'Setting new planner config', { url });
        state.rules = config.rules || [];
        const ingredients = config.ingredienti || [];
        const meals = config.meals || [];
        state.masterWorkoutList = config.esercizi || [];

        // Calcola calorie e popola la master list
        state.masterMealList = processMealsWithCalories(meals, ingredients);

        // Deriva e imposta la recipeBaseUrl
        if (url) {
            const baseUrl = new URL(url);
            const recipePath = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf('/')) + '/ricette/';
            state.recipeBaseUrl = `${baseUrl.origin}${recipePath}`;
        } else {
            state.recipeBaseUrl = '';
        }

        notify();
      }

      export function setConfigUrl(url) {
        log('State', 'Setting new config URL', { url });
        state.configUrl = url;
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, url);
        notify();
      }

      export function saveStateToLocalStorage() {
        log('State', 'Saving all application state to localStorage');
        localStorage.setItem(LOCAL_STORAGE_KEY_PLAN, JSON.stringify(state.weeklyPlan));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUTS, JSON.stringify(state.weeklyWorkouts));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUT_HISTORY, JSON.stringify(state.workoutHistory));
        localStorage.setItem(LOCAL_STORAGE_KEY_BIOMETRICS, JSON.stringify(state.biometricData));
        localStorage.setItem(LOCAL_STORAGE_KEY_PROFILE, JSON.stringify(state.userProfile));
        localStorage.setItem(LOCAL_STORAGE_KEY_GOALS, JSON.stringify(state.userGoals));
      }

      export function loadStateFromLocalStorage() {
        log('State', 'Loading all application state from localStorage');
        const plan = localStorage.getItem(LOCAL_STORAGE_KEY_PLAN);
        const workouts = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUTS);
        const history = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUT_HISTORY);
        const url = localStorage.getItem(LOCAL_STORAGE_KEY_URL);
        const biometrics = localStorage.getItem(LOCAL_STORAGE_KEY_BIOMETRICS);
        const profile = localStorage.getItem(LOCAL_STORAGE_KEY_PROFILE);
        const goals = localStorage.getItem(LOCAL_STORAGE_KEY_GOALS);

        if (plan) { try { state.weeklyPlan = JSON.parse(plan); } catch (e) { console.error("Error parsing weeklyPlan", e); state.weeklyPlan = {}; } }
        if (workouts) { try { state.weeklyWorkouts = JSON.parse(workouts); } catch (e) { console.error("Error parsing weeklyWorkouts", e); state.weeklyWorkouts = {}; } }
        if (history) { try { state.workoutHistory = JSON.parse(history); } catch (e) { console.error("Error parsing workoutHistory", e); state.workoutHistory = {}; } }
        if (url) { state.configUrl = url; }
        if (biometrics) { try { state.biometricData = JSON.parse(biometrics); } catch (e) { console.error("Error parsing biometricData", e); state.biometricData = []; } }
        if (profile) { try { state.userProfile = JSON.parse(profile); } catch (e) { console.error("Error parsing userProfile", e); state.userProfile = {}; } }
        if (goals) { try { state.userGoals = JSON.parse(goals); } catch (e) { console.error("Error parsing userGoals", e); state.userGoals = {}; } }
      }

      export function setAppState(backupData) {
        log('State', 'Restoring application state from backup');
        state.weeklyPlan = backupData.weeklyPlan || {};
        state.weeklyWorkouts = backupData.weeklyWorkouts || {};
        state.workoutHistory = backupData.workoutHistory || {};
        state.configUrl = backupData.configUrl || '';
        state.biometricData = backupData.biometricData || [];
        state.userProfile = backupData.userProfile || {};
        state.userGoals = backupData.userGoals || {};
        saveStateToLocalStorage();
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, state.configUrl);
        notify();
      }

      export function saveUserProfile(profile) {
        log('State', 'Saving user profile', { profile });
        state.userProfile = profile;
        saveStateToLocalStorage();
        notify();
      }

      export function saveUserGoals(goals) {
          log('State', 'Saving user goals', { goals });
          state.userGoals = goals;
          saveStateToLocalStorage();
          notify();
      }

      export function addOrUpdateBiometricEntry(entry) {
        log('State', 'Adding or updating biometric entry', { entry });
        const index = state.biometricData.findIndex(e => e.date === entry.date);
        if (index > -1) {
          state.biometricData[index] = entry;
        } else {
          state.biometricData.push(entry);
        }
        state.biometricData.sort((a, b) => new Date(b.date) - new Date(a.date));
        saveStateToLocalStorage();
        notify();
      }

      export function deleteBiometricEntry(date) {
        log('State', 'Deleting biometric entry', { date });
        state.biometricData = state.biometricData.filter(e => e.date !== date);
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyPlan(slotId, mealId) {
        log('State', 'Updating weekly plan', { slotId, mealId });
        if (mealId) {
          const meal = state.masterMealList.find(m => m.id === mealId);
          if (meal) {
            state.weeklyPlan[slotId] = { ...meal };
          }
        } else {
          delete state.weeklyPlan[slotId];
        }
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyWorkout(slotId, exerciseId, instanceId = null) {
        log('State', 'Updating weekly workout', { slotId, exerciseId, instanceId });
          if (!state.weeklyWorkouts[slotId]) {
              state.weeklyWorkouts[slotId] = [];
          }

          if (exerciseId) { // Add an exercise
              const exercise = state.masterWorkoutList.find(ex => ex.id === exerciseId);
              if (exercise) {
                  const newExerciseInstance = {
                      ...exercise,
                      instanceId: Date.now() + Math.random()
                  };
                  state.weeklyWorkouts[slotId].push(newExerciseInstance);
              }
          } else if (instanceId) { // Remove an exercise
              state.weeklyWorkouts[slotId] = state.weeklyWorkouts[slotId].filter(ex => ex.instanceId !== instanceId);
              if (state.weeklyWorkouts[slotId].length === 0) {
                  delete state.weeklyWorkouts[slotId];
              }
          }
          saveStateToLocalStorage();
          notify();
      }

      export function updateExerciseInstanceInWorkout(slotId, instanceId, newValues) {
        log('State', 'Updating exercise instance in planner', { slotId, instanceId, newValues });
          if (!state.weeklyWorkouts[slotId]) return;

          const workoutList = state.weeklyWorkouts[slotId];
          const exerciseIndex = workoutList.findIndex(ex => ex.instanceId === instanceId);

          if (exerciseIndex > -1) {
              const updatedExercise = { ...workoutList[exerciseIndex], ...newValues };
              if (newValues.defaultTempo) {
                  updatedExercise.defaultTempo = { ...workoutList[exerciseIndex].defaultTempo, ...newValues.defaultTempo };
              }
              workoutList[exerciseIndex] = updatedExercise;
              saveStateToLocalStorage();
              notify();
          }
      }

      export function reorderWorkoutExercises(slotId, oldIndex, newIndex) {
        log('State', 'Reordering workout exercises', { slotId, oldIndex, newIndex });
          if (!state.weeklyWorkouts[slotId] || oldIndex === newIndex) return;
          const workoutList = state.weeklyWorkouts[slotId];
          const [movedItem] = workoutList.splice(oldIndex, 1);
          workoutList.splice(newIndex, 0, movedItem);
          saveStateToLocalStorage();
          notify();
      }

      export function resetCurrentWeek() {
        log('State', 'Resetting current week');
        const weekStart = getWeekStartDate(state.focusedDate);
        for (let i = 0; i < 7; i++) {
            const date = new Date(weekStart);
            date.setDate(date.getDate() + i);
            const isoDate = toISODateString(date);
            MEAL_TYPES.forEach(mealType => {
                const slotId = `${isoDate}-${mealType}`;
                if (state.weeklyPlan[slotId]) {
                    delete state.weeklyPlan[slotId];
                }
            });
            const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
            if (state.weeklyWorkouts[workoutSlotId]) {
                delete state.weeklyWorkouts[slotId];
            }
        }
        state.workoutHistory = {};
        saveStateToLocalStorage();
        notify();
      }

      export function navigateWeek(direction) {
        log('State', 'Navigating week', { direction });
        const newDate = new Date(state.focusedDate);
        newDate.setDate(newDate.getDate() + (direction * 7));
        state.focusedDate = newDate;
        notify();
      }

      export function setView(view) {
        log('State', 'Setting new view', { newView: view, oldView: state.currentView });
        if (['planner', 'log', 'progress', 'profile', 'charts', 'recipes', 'trainer', 'debriefing', 'goals'].includes(view)) {
          state.currentView = view;
          notify();
        }
      }

      export function setLastWorkoutSummary(summary) {
        log('State', 'Setting last workout summary');
        state.lastWorkoutSummary = summary;
        notify();
      }

      export function addWorkoutToHistory(summary) {
        log('State', 'Adding structured workout to history', { date: summary.date });
        if (summary && summary.date) {
            if (!state.workoutHistory[summary.date]) {
                state.workoutHistory[summary.date] = [];
            }
            state.workoutHistory[summary.date].push({ ...summary, type: 'structured' });
            saveStateToLocalStorage();
            notify();
        }
      }

      export function addManualWorkoutToHistory(date, activityData) {
          log('State', 'Adding manual workout to history', { date, activityData });
          if (!state.workoutHistory[date]) {
              state.workoutHistory[date] = [];
          }
          const manualWorkout = {
              type: 'manual',
              date: date,
              startTime: Date.now(),
              ...activityData
          };
          state.workoutHistory[date].push(manualWorkout);
          saveStateToLocalStorage();
          notify();
      }

      export function deleteWorkoutFromHistory(date, startTime) {
          log('State', 'Deleting workout from history', { date, startTime });
          if (state.workoutHistory[date]) {
              state.workoutHistory[date] = state.workoutHistory[date].filter(workout => workout.startTime !== startTime);
              if (state.workoutHistory[date].length === 0) {
                  delete state.workoutHistory[date];
              }
              saveStateToLocalStorage();
              notify();
          }
      }

      export function updateWorkoutInHistory(date, startTime, updates) {
          log('State', 'Updating workout in history', { date, startTime, updates });
          if (state.workoutHistory[date]) {
              const workoutIndex = state.workoutHistory[date].findIndex(w => w.startTime === startTime);
              if (workoutIndex > -1) {
                  state.workoutHistory[date][workoutIndex] = {
                      ...state.workoutHistory[date][workoutIndex],
                      ...updates
                  };
                  saveStateToLocalStorage();
                  notify();
              }
          }
      }

      export function updateExerciseSetsInHistory(date, startTime, exerciseInstanceId, newSetsData) {
        log('State', 'Updating exercise sets in history', { date, startTime, exerciseInstanceId });
        if (!state.workoutHistory[date]) return;

        const workoutIndex = state.workoutHistory[date].findIndex(w => w.startTime === startTime);
        if (workoutIndex === -1) return;

        const workout = state.workoutHistory[date][workoutIndex];
        const exerciseIndex = workout.exercises.findIndex(ex => ex.instanceId === exerciseInstanceId);
        if (exerciseIndex === -1) return;

        // Update sets data for the specific exercise
        workout.exercises[exerciseIndex].setsData = newSetsData;

        // Recalculate tonnage for the exercise
        const exerciseTonnage = newSetsData.reduce((acc, set) => acc + ((set.reps || 0) * (set.weight || 0)), 0);
        workout.exercises[exerciseIndex].tonnage = exerciseTonnage;

        // Recalculate total tonnage for the entire workout
        workout.totalTonnage = workout.exercises.reduce((acc, ex) => acc + (ex.tonnage || 0), 0);

        saveStateToLocalStorage();
        notify();
      }


      export function copyPreviousWeek() {
        log('State', 'Copying previous week');
        const currentWeekStart = getWeekStartDate(state.focusedDate);
        const prevWeekStart = new Date(currentWeekStart);
        prevWeekStart.setDate(prevWeekStart.getDate() - 7);

        for (let i = 0; i < 7; i++) {
          const sourceDate = new Date(prevWeekStart);
          sourceDate.setDate(sourceDate.getDate() + i);
          const sourceISO = toISODateString(sourceDate);

          const destDate = new Date(currentWeekStart);
          destDate.setDate(destDate.getDate() + i);
          const destISO = toISODateString(destDate);

          MEAL_TYPES.forEach(mealType => {
            const sourceSlotId = `${sourceISO}-${mealType}`;
            const destSlotId = `${destISO}-${mealType}`;
            const mealObject = state.weeklyPlan[sourceSlotId];

            if (mealObject) {
              state.weeklyPlan[destSlotId] = { ...mealObject };
            } else {
              delete state.weeklyPlan[destSlotId];
            }
          });

          const sourceWorkoutSlot = `${sourceISO}-${WORKOUT_SLOT_ID}`;
          const destWorkoutSlot = `${destISO}-${WORKOUT_SLOT_ID}`;
          const workoutList = state.weeklyWorkouts[sourceWorkoutSlot];
          if (workoutList && Array.isArray(workoutList)) {
              state.weeklyWorkouts[destWorkoutSlot] = JSON.parse(JSON.stringify(workoutList));
          } else {
              delete state.weeklyWorkouts[destWorkoutSlot];
          }
        }
        saveStateToLocalStorage();
        notify();
      }
  - file: src/ui/interactions/plannerInteractions.js
    content: |
      import {
        resetCurrentWeek, setPlannerConfig, setConfigUrl, navigateWeek, setView,
        copyPreviousWeek, getState, deleteWorkoutFromHistory, getExerciseFromHistory
      } from '../../core/state.js';
      import { initializeWorkout } from '../../core/trainer.js';
      import { fetchAndParseConfig } from '../../api/configService.js';
      import { showNotification } from '../notifications.js';
      import { openDayEditorModal, showConfirmModal, showRecipeModal, openExerciseEditorModal } from '../modals.js';
      import { WORKOUT_SLOT_ID } from '../../utils/constants.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';

      async function handleLoadConfig() {
        log('Interactions', 'Handling config load button click');
        const url = document.getElementById('config-url-input').value.trim();
        if (!url) { showNotification(UI_TEXT.CONFIG_URL_EMPTY_ERROR, 'error'); return; }
        setConfigUrl(url);
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config, url);
          showNotification(UI_TEXT.CONFIG_LOAD_SUCCESS, 'success');
        } catch (error) { showNotification(error.message, 'error'); }
      }

      function handleCalendarClick(e) {
        const startBtn = e.target.closest('.btn-start-workout-day');
        if (startBtn) {
            const isoDate = startBtn.dataset.date;
            log('Interactions', 'Start workout button clicked from calendar', { date: isoDate });
            const globalState = getState();
            const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
            const exercisesForWorkout = globalState.weeklyWorkouts[workoutSlotId];
            initializeWorkout(exercisesForWorkout, isoDate);
            setView('trainer');
            return;
        }

        const dayCell = e.target.closest('.day-cell');
        if (dayCell) {
          log('Interactions', 'Calendar cell clicked', { date: dayCell.dataset.date });
          openDayEditorModal(dayCell.dataset.date);
        }
      }

      function handleRecipeClick(e) {
        const recipeItem = e.target.closest('.recipe-list-item');
        if (recipeItem) {
          const state = getState();
          const meal = state.masterMealList.find(m => m.id === recipeItem.dataset.mealId);
          if (meal) {
            log('Interactions', 'Recipe list item clicked', { mealId: meal.id });
            showRecipeModal(meal);
          }
        }
      }

      function handleLogViewClick(e) {
        const btnRecipe = e.target.closest('.btn-view-recipe');
        if (btnRecipe) {
          const state = getState();
          const meal = state.masterMealList.find(m => m.id === btnRecipe.dataset.mealId);
          if (meal) {
            log('Interactions', 'Recipe button in log view clicked', { mealId: meal.id });
            showRecipeModal(meal);
          }
          return;
        }

        const btnDeleteWorkout = e.target.closest('.btn-delete-workout');
        if (btnDeleteWorkout) {
          const { date, starttime } = btnDeleteWorkout.dataset;
          log('Interactions', 'Delete workout button clicked', { date, starttime });
          showConfirmModal(
            UI_TEXT.DELETE_WORKOUT_CONFIRM_TITLE,
            UI_TEXT.DELETE_WORKOUT_CONFIRM_MSG,
            () => {
              deleteWorkoutFromHistory(date, parseInt(starttime));
              showNotification(UI_TEXT.DELETE_WORKOUT_SUCCESS, 'info');
            },
            'danger'
          );
          return;
        }

        const btnEditExercise = e.target.closest('.btn-edit-logged-exercise');
        if(btnEditExercise) {
          const { date, starttime, instanceid } = btnEditExercise.dataset;
          log('Interactions', 'Edit logged exercise button clicked', { date, starttime, instanceid });
          const exercise = getExerciseFromHistory(date, parseInt(starttime, 10), parseFloat(instanceid));
          if (exercise) {
            openExerciseEditorModal({
              context: 'history',
              exercise,
              date,
              startTime: parseInt(starttime, 10)
            });
          }
          return;
        }
      }

      function handleCopyWeek() {
        log('Interactions', 'Copy week button clicked');
        showConfirmModal(
          UI_TEXT.COPY_WEEK_CONFIRM_TITLE, UI_TEXT.COPY_WEEK_CONFIRM_MSG,
          () => { copyPreviousWeek(); showNotification(UI_TEXT.COPY_WEEK_SUCCESS, 'success'); }, 'primary'
        );
      }

      function handleResetWeek() {
        log('Interactions', 'Reset week button clicked');
        showConfirmModal(
          UI_TEXT.RESET_WEEK_CONFIRM_TITLE, UI_TEXT.RESET_WEEK_CONFIRM_MSG,
          () => { resetCurrentWeek(); showNotification(UI_TEXT.RESET_WEEK_SUCCESS, 'info'); }, 'danger'
        );
      }

      export function initializePlannerListeners() {
        document.getElementById('load-config-btn').addEventListener('click', handleLoadConfig);
        document.getElementById('calendar-grid').addEventListener('click', handleCalendarClick);
        document.getElementById('log-view').addEventListener('click', handleLogViewClick);
        document.getElementById('recipes-page').addEventListener('click', handleRecipeClick);
        document.getElementById('prev-week-btn').addEventListener('click', () => navigateWeek(-1));
        document.getElementById('next-week-btn').addEventListener('click', () => navigateWeek(1));
        document.getElementById('view-calendar-btn').addEventListener('click', () => setView('planner'));
        document.getElementById('view-log-btn').addEventListener('click', () => setView('log'));
        document.getElementById('copy-week-btn').addEventListener('click', handleCopyWeek);
        document.getElementById('reset-btn').addEventListener('click', handleResetWeek);
      }
  - file: src/ui/modals/exerciseEditorModal.js
    content: |
      import { updateExerciseInstanceInWorkout, updateExerciseSetsInHistory } from '../../core/state.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';
      import { openWorkoutEditorModal } from './workoutEditorModal.js';
      import { showNotification } from '../notifications.js';

      function renderPlannerForm(body, exercise) {
        body.innerHTML = `
          <form id="exercise-editor-form">
            <div class="form-group sets-group">
              <label for="ex-edit-sets">Serie</label>
              <input type="number" id="ex-edit-sets" name="sets" min="1" value="${exercise.defaultSets}">
            </div>
            <div class="form-group reps-group" style="display: ${exercise.type === 'reps' ? 'flex' : 'none'};">
              <label for="ex-edit-reps">Ripetizioni</label>
              <input type="number" id="ex-edit-reps" name="reps" min="1" value="${exercise.defaultReps || ''}">
            </div>
            <div class="form-group duration-group" style="display: ${exercise.type === 'time' ? 'flex' : 'none'};">
              <label for="ex-edit-duration">Durata (s)</label>
              <input type="number" id="ex-edit-duration" name="duration" min="1" value="${exercise.defaultDuration || ''}">
            </div>
            <div class="form-group rest-group">
              <label for="ex-edit-rest">Riposo (s)</label>
              <input type="number" id="ex-edit-rest" name="rest" min="0" value="${exercise.defaultRest}">
            </div>
            <div class="form-group weight-group">
              <label for="ex-edit-weight" id="ex-edit-weight-label">${UI_TEXT.EXERCISE_WEIGHT_LABEL}</label>
              <input type="number" id="ex-edit-weight" name="weight" min="0" step="0.5" value="${exercise.defaultWeight || 0}">
            </div>
            <div class="tempo-group" style="display: ${exercise.defaultTempo ? 'grid' : 'none'};">
              <div class="form-group">
                <label for="ex-edit-tempo-up">Salita (s)</label>
                <input type="number" id="ex-edit-tempo-up" name="tempo_up" min="0" step="0.5" value="${exercise.defaultTempo?.up || 0}">
              </div>
              <div class="form-group">
                <label for="ex-edit-tempo-hold" id="ex-edit-tempo-hold-label">${UI_TEXT.EXERCISE_TEMPO_HOLD_LABEL}</label>
                <input type="number" id="ex-edit-tempo-hold" name="tempo_hold" min="0" step="0.5" value="${exercise.defaultTempo?.hold || 0}">
              </div>
              <div class="form-group">
                <label for="ex-edit-tempo-down">Discesa (s)</label>
                <input type="number" id="ex-edit-tempo-down" name="tempo_down" min="0" step="0.5" value="${exercise.defaultTempo?.down || 0}">
              </div>
            </div>
          </form>
        `;
      }

      function renderLogForm(body, exercise) {
        const showWeight = exercise.defaultWeight || exercise.setsData.some(s => s.weight > 0);
        let formHTML = `<form id="logged-exercise-form" class="structured-form">`;
        formHTML += exercise.setsData.map((set, index) => {
            const weightInput = showWeight ? `
                <div class="form-group">
                    <label for="set-weight-${index}">${UI_TEXT.LOGGED_EXERCISE_WEIGHT_LABEL}</label>
                    <input type="number" id="set-weight-${index}" name="weight_${index}" value="${set.weight || 0}" min="0" step="0.1">
                </div>
            ` : '';
            return `
                <div class="set-editor-row">
                    <span class="set-editor-label">${UI_TEXT.LOGGED_EXERCISE_SET_LABEL} ${index + 1}</span>
                    <div class="form-group">
                        <label for="set-reps-${index}">${UI_TEXT.LOGGED_EXERCISE_REPS_LABEL}</label>
                        <input type="number" id="set-reps-${index}" name="reps_${index}" value="${set.reps || 0}" min="0">
                    </div>
                    ${weightInput}
                </div>
            `;
        }).join('');
        formHTML += '</form>';
        body.innerHTML = formHTML;
      }

      export function openExerciseEditorModal(config) {
        const { context, exercise, date, startTime, slotId, returnIsoDate } = config;
        log('Modals', 'Opening exercise editor modal', { config });

        const modal = document.getElementById('exercise-editor-modal');
        const body = modal.querySelector('#exercise-editor-body');
        const saveBtn = modal.querySelector('#exercise-editor-save-btn');
        let form;
        let saveHandler;

        if (context === 'history') {
            modal.querySelector('#exercise-editor-title').textContent = `${UI_TEXT.LOGGED_EXERCISE_EDITOR_TITLE}: ${exercise.name}`;
            saveBtn.textContent = UI_TEXT.LOGGED_EXERCISE_SAVE_BTN;
            renderLogForm(body, exercise);
            form = body.querySelector('#logged-exercise-form');

            saveHandler = (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const newSetsData = [...exercise.setsData].map((set, index) => ({
                    ...set,
                    reps: parseInt(formData.get(`reps_${index}`), 10) || 0,
                    weight: parseFloat(formData.get(`weight_${index}`)) || 0,
                }));

                updateExerciseSetsInHistory(date, startTime, exercise.instanceId, newSetsData);
                showNotification(UI_TEXT.WORKOUT_LOG_SAVE_SUCCESS, 'success');
                modal.classList.add('modal-hidden');
            };

        } else if (context === 'planner') {
            modal.querySelector('#exercise-editor-title').textContent = `${UI_TEXT.EXERCISE_EDITOR_TITLE}: ${exercise.name}`;
            saveBtn.textContent = UI_TEXT.EXERCISE_SAVE_BTN;
            renderPlannerForm(body, exercise);
            form = body.querySelector('#exercise-editor-form');

            saveHandler = (e) => {
                e.preventDefault();
                const newValues = {
                    defaultSets: parseInt(form.elements.sets.value),
                    defaultRest: parseInt(form.elements.rest.value),
                    defaultWeight: parseFloat(form.elements.weight.value)
                };
                if (exercise.type === 'reps') {
                    newValues.defaultReps = parseInt(form.elements.reps.value);
                } else {
                    newValues.defaultDuration = parseInt(form.elements.duration.value);
                }
                if (exercise.defaultTempo) {
                    newValues.defaultTempo = {
                        up: parseInt(form.elements.tempo_up.value),
                        hold: parseInt(form.elements.tempo_hold.value),
                        down: parseInt(form.elements.tempo_down.value)
                    };
                }
                updateExerciseInstanceInWorkout(slotId, exercise.instanceId, newValues);
                modal.classList.add('modal-hidden');
                openWorkoutEditorModal(returnIsoDate);
            };
        }

        saveBtn.replaceWith(saveBtn.cloneNode(true));
        document.getElementById('exercise-editor-save-btn').addEventListener('click', saveHandler, { once: true });
        modal.classList.remove('modal-hidden');
      }
  - file: src/ui/modals/workoutEditorModal.js
    content: |
      import { getState, updateWeeklyWorkout, reorderWorkoutExercises, getExerciseForPlanner } from '../../core/state.js';
      import { WORKOUT_SLOT_ID } from '../../utils/constants.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { renderIcon } from '../icons.js';
      import { log } from '../../utils/logger.js';
      import { openWorkoutSelectionModal } from './selectionModal.js';
      import { openExerciseEditorModal } from './exerciseEditorModal.js';

      let sortableInstance = null;

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function formatExerciseDetails(exercise) {
        const sets = exercise.defaultSets;
        const rest = exercise.defaultRest;
        let details;

        if (exercise.type === 'reps') {
            const reps = exercise.defaultReps;
            details = `${sets} x ${reps} | Riposo: ${rest}s`;
        } else if (exercise.type === 'time') {
            const duration = exercise.defaultDuration;
            details = `${sets} x ${duration}s | Riposo: ${rest}s`;
        }

        if (exercise.defaultTempo) {
            const { up, hold, down } = exercise.defaultTempo;
            details += ` | Tempo: ${up}-${hold}-${down}`;
        }
        return details;
      }

      export function openWorkoutEditorModal(isoDate) {
        log('Modals', 'Opening workout editor modal', { isoDate });
        const state = getState();
        const modal = document.getElementById('workout-editor-modal');
        modal.querySelector('#workout-editor-title').textContent = `${UI_TEXT.WORKOUT_EDITOR_TITLE} - ${formatFullDate(isoDate)}`;
        const body = modal.querySelector('#workout-editor-body');
        const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
        const plannedWorkoutList = state.weeklyWorkouts[workoutSlotId] || [];

        let exercisesHTML = plannedWorkoutList.map(exercise => {
            const exerciseDetails = formatExerciseDetails(exercise);
            return `<div class="meal-details draggable-item" data-instance-id="${exercise.instanceId}">
                        <div class="drag-handle">${renderIcon('DRAG_HANDLE', { width: 18, height: 18 })}</div>
                        <div class="exercise-info">
                            <span class="meal-details__name">${exercise.name}</span>
                            <span class="exercise-details-summary">${exerciseDetails}</span>
                        </div>
                        <div class="meal-actions">
                            <button class="btn-edit-exercise" title="Modifica" data-slot-id="${workoutSlotId}" data-instance-id="${exercise.instanceId}">${renderIcon('EDIT', { width: 16, height: 16 })}</button>
                            <button class="btn-remove-exercise" title="Rimuovi" data-slot-id="${workoutSlotId}" data-instance-id="${exercise.instanceId}">${renderIcon('TRASH', { width: 16, height: 16 })}</button>
                        </div>
                    </div>`;
        }).join('');

        const addExerciseButton = `<button class="btn-add-exercise" data-slot-id="${workoutSlotId}">${UI_TEXT.ADD_EXERCISE_BTN}</button>`;
        body.innerHTML = `<div class="day-editor-list workout-editor-list">${exercisesHTML}</div>${addExerciseButton}`;

        const listContainer = body.querySelector('.workout-editor-list');

        if (sortableInstance) {
            sortableInstance.destroy();
        }
        sortableInstance = new Sortable(listContainer, {
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            onEnd: function(evt) {
                reorderWorkoutExercises(workoutSlotId, evt.oldIndex, evt.newIndex);
            }
        });

        body.onclick = e => {
            const btnAddExercise = e.target.closest('.btn-add-exercise');
            const btnRemoveExercise = e.target.closest('.btn-remove-exercise');
            const btnEditExercise = e.target.closest('.btn-edit-exercise');

            if (btnAddExercise) {
                modal.classList.add('modal-hidden');
                openWorkoutSelectionModal(btnAddExercise.dataset.slotId, isoDate);
            } else if (btnRemoveExercise) {
                updateWeeklyWorkout(btnRemoveExercise.dataset.slotId, null, parseFloat(btnRemoveExercise.dataset.instanceId));
                openWorkoutEditorModal(isoDate); // Refresh this modal
            } else if (btnEditExercise) {
                const slotId = btnEditExercise.dataset.slotId;
                const instanceId = btnEditExercise.dataset.instanceId;
                const exercise = getExerciseForPlanner(slotId, instanceId);
                if (exercise) {
                  openExerciseEditorModal({
                    context: 'planner',
                    exercise,
                    slotId,
                    returnIsoDate: isoDate
                  });
                }
            }
        };

        modal.classList.remove('modal-hidden');
      }