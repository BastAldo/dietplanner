commit_message: "fix(trainer): Risolve il TypeError con una gestione robusta del ciclo di vita"
rationale: |
  Questo commit implementa una soluzione definitiva e strutturale al `TypeError` che si verificava nella vista Trainer. L'errore era causato da una gestione inadeguata del ciclo di vita del componente, che lasciava il ciclo di animazione (`tick`) attivo in background anche dopo aver lasciato la vista, portando a tentativi di aggiornare elementi del DOM non più esistenti.

  Seguendo la nuova filosofia di un "componente effimero", sono state apportate le seguenti modifiche:

  1.  **Centralizzazione della Distruzione del Componente (`src/ui/trainerRenderer.js`):**
      * La responsabilità di fermare il ciclo di animazione (`cancelAnimationFrame`) è stata spostata e centralizzata all'interno della funzione `destroyTrainerController`. Ora, quando il controller viene distrutto, è garantito al 100% che anche il suo `tick` si fermi, eliminando la causa principale della race condition.

  2.  **Semplificazione della Gestione dello Stato (`src/core/state.js`, `src/core/trainer.js`):**
      * La chiamata a `resetWorkoutState` è stata rimossa dalla funzione `setView` per evitare logiche duplicate e disaccoppiare la gestione dello stato dalla gestione degli effetti collaterali (animazioni).
      * Di conseguenza, `trainer.js` è stato pulito dalla gestione diretta dell' `animationFrameId`, che ora è di competenza esclusiva del suo renderer.

  3.  **Aggiunta di una Guardia di Sicurezza (`src/ui/components/TrainerComponent.js`):**
      * È stato introdotto un controllo di esistenza degli elementi del DOM (`if (!this.ringText) return;`) all'inizio del metodo `render`. Questa guardia previene il crash in qualsiasi circostanza imprevista, rendendo il componente più resiliente.

  Questo approccio risolve il bug alla radice, garantendo che il componente Trainer venga sempre inizializzato e distrutto in modo pulito e prevedibile.
