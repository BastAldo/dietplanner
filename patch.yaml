commit_message: "fix(trainer): Ensure full state isolation and fix UI inconsistencies"
rationale: |
  This patch delivers a definitive fix for a set of critical bugs in the trainer module, including inconsistent termination behavior, corrupted audio cues on subsequent runs, and UI style deviations. The root cause was found to be a state mutation issue where the workout execution engine was modifying the original command template instead of an instance.

  **Problem Analysis & Implemented Solution:**

  1.  **State Corruption (Termination & Audio Bugs):**
      * **Problem:** The `queueBuilder.js` was using a shallow copy of the `TEMPO_GUIDED_FLOW` template. During the first workout, the `runWorkoutLoop` would add a `.text` property to the phase objects, directly mutating the original template in memory. On subsequent workout initializations, the builder would find this "dirty" template and fail to correctly resolve `text_key` properties for the new context, leading to incorrect audio cues and an unstable state that caused the termination logic to fail.
      * **Solution 1 (State Isolation):** The `interpretTemplate` function in `src/core/trainer/queueBuilder.js` has been modified to operate on a deep copy of the template. It now uses `JSON.parse(JSON.stringify(template))` to ensure that each workout execution starts with a pristine, un-mutated command flow, completely isolating workout states from each other.
      * **Solution 2 (Robust Reset):** As a secondary safeguard, the `resetState` function in `src/core/trainer/state.js` has been refactored. Instead of reassigning the module's `workoutState` variable (which can be fragile), it now mutates the existing object by using `Object.assign` and explicitly clearing arrays. This ensures that any external references to the state object are correctly updated, guaranteeing a truly clean slate between sessions.

  2.  **UI Style Inconsistency (Timer Style Bug):**
      * **Problem:** The flashing text (`.flashing`) inside the timer ring was using `--secondary-color` (teal), which was inconsistent with the `--primary-color` (purple) used for the ring itself during active phases, violating the `docs/03_STYLE_GUIDE.md`.
      * **Solution:** The `.flashing` class in `styles/trainer.css` has been updated to use `fill: var(--primary-color);`, aligning the entire component's active state with the primary brand color for a cohesive user experience.

  These targeted fixes resolve all reported issues by addressing their root causes, resulting in a stable, predictable, and visually polished trainer module.
