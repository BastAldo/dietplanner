    content: |
      import { saveUserProfile } from '../../core/state.js';
      import { showNotification } from '../notifications.js';
      import { UI_TEXT } from '../../utils/constants.js';
      import { log } from '../../utils/logger.js';

      function handleProfileForm(e) {
        e.preventDefault();
        log('Interactions', 'Profile form submitted');
        const formData = new FormData(e.target);
        const profile = {};
        for (let [key, value] of formData.entries()) { profile[key] = value; }
        saveUserProfile(profile);
        showNotification(UI_TEXT.PROFILE_SAVE_SUCCESS, 'success');
      }

      export function initializeProfileListeners() {
        document.getElementById('profile-form').addEventListener('submit', handleProfileForm);
      }
  - file: src/ui/interactions/progressInteractions.js
    content: |
      import { getState, addOrUpdateBiometricEntry, deleteBiometricEntry } from '../../core/state.js';
      import { calculateBMR } from '../../core/calculations.js';
      import { showNotification } from '../notifications.js';
      import { showConfirmModal } from '../modals.js';
      import { UI_TEXT } from '../../utils/constants.js';
      import { log } from '../../utils/logger.js';

      function handleBiometricsForm(e) {
        e.preventDefault();
        log('Interactions', 'Biometrics form submitted');
        const formData = new FormData(e.target);
        const entry = {};
        for (let [key, value] of formData.entries()) { entry[key] = value; }
        addOrUpdateBiometricEntry(entry);
        showNotification(UI_TEXT.BIOMETRICS_SAVE_SUCCESS, 'success');
        e.target.reset();
        document.getElementById('bio-date').value = new Date().toISOString().slice(0, 10);
      }

      function handleBiometricsListClick(e) {
        const btnMenu = e.target.closest('.btn-actions-menu');
        if (btnMenu) {
            log('Interactions', 'Biometrics actions menu toggled');
            const dropdown = btnMenu.nextElementSibling;
            const allDropdowns = document.querySelectorAll('.actions-dropdown');
            allDropdowns.forEach(d => { if (d !== dropdown) d.classList.remove('show'); });
            dropdown.classList.toggle('show');
            return;
        }

        const btnEdit = e.target.closest('.btn-edit-biometrics');
        if (btnEdit) {
            const date = btnEdit.dataset.date;
            log('Interactions', 'Edit biometrics button clicked', { date });
            const entry = getState().biometricData.find(e => e.date === date);
            if (entry) {
                const form = document.getElementById('biometrics-form');
                for (const key in entry) {
                    if (form.elements[key]) { form.elements[key].value = entry[key]; }
                }
                form.scrollIntoView({ behavior: 'smooth' });
            }
            const dropdown = btnEdit.closest('.actions-dropdown');
            if (dropdown) dropdown.classList.remove('show');
            return;
        }

        const btnDelete = e.target.closest('.btn-delete-biometrics');
        if (btnDelete) {
            const date = btnDelete.dataset.date;
            log('Interactions', 'Delete biometrics button clicked', { date });
            showConfirmModal(
                UI_TEXT.BIOMETRICS_DELETE_CONFIRM_TITLE, UI_TEXT.BIOMETRICS_DELETE_CONFIRM_MSG,
                () => { deleteBiometricEntry(date); showNotification(UI_TEXT.BIOMETRICS_DELETE_SUCCESS, 'info'); }, 'danger'
            );
            const dropdown = btnDelete.closest('.actions-dropdown');
            if (dropdown) dropdown.classList.remove('show');
            return;
        }

        if (!e.target.closest('.biometrics-actions')) {
            document.querySelectorAll('.actions-dropdown').forEach(d => d.classList.remove('show'));
        }
      }

      function handleWeightInputChange(e) {
        const weight = e.target.value;
        const { userProfile } = getState();
        const bmrField = document.getElementById('bio-basalMetabolism');
        const bmr = calculateBMR(userProfile, weight);
        if (bmr !== null) {
          bmrField.value = bmr;
        } else {
          bmrField.value = '';
          bmrField.placeholder = UI_TEXT.BIOMETRICS_BMR_PLACEHOLDER;
        }
      }

      export function initializeProgressListeners() {
        document.getElementById('biometrics-form').addEventListener('submit', handleBiometricsForm);
        const progressPage = document.getElementById('progress-page');
        progressPage.addEventListener('click', handleBiometricsListClick);
        progressPage.addEventListener('input', e => {
          if (e.target.id === 'bio-weight') { handleWeightInputChange(e); }
        });

        // Close dropdown if clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.biometrics-actions')) {
                document.querySelectorAll('.actions-dropdown').forEach(d => d.classList.remove('show'));
            }
        });
      }
  - file: src/main.js
    content: |
      import { loadStateFromLocalStorage, getState, setPlannerConfig, setConfigUrl, toggleDebugMode } from './core/state.js';
      import { renderApp, populateInitialText } from './ui/renderer.js';
      import { showConfirmModal } from './ui/modals.js';
      import { initializeGlobalListeners } from './ui/interactions/globalInteractions.js';
      import { initializePlannerListeners } from './ui/interactions/plannerInteractions.js';
      import { initializeProgressListeners } from './ui/interactions/progressInteractions.js';
      import { initializeProfileListeners } from './ui/interactions/profileInteractions.js';
      import { loadViews } from './ui/viewLoader.js';
      import { DEFAULT_CONFIG_URL } from './utils/constants.js';
      import { fetchAndParseConfig } from './api/configService.js';
      import { showNotification } from './ui/notifications.js';
      import { UI_TEXT } from './utils/constants.js';

      async function loadConfig(url) {
        if (!url) {
          setPlannerConfig({}, url); // Clear master list if no URL
          return;
        };
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config, url);
          showNotification(UI_TEXT.CONFIG_LOAD_SUCCESS, 'success');
        } catch (error) {
          showNotification(error.message, 'error');
          setPlannerConfig({}, url); // Clear master list on error
        }
      }

      function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/dietplanner/sw.js')
              .then(registration => console.log('ServiceWorker registration successful'))
              .catch(err => console.log('ServiceWorker registration failed: ', err));
          });
        }
      }

      async function init() {
        await loadViews();
        document.addEventListener('stateChange', renderApp);
        
        loadStateFromLocalStorage();
        let initialState = getState();
        document.getElementById('config-url-input').value = initialState.configUrl || DEFAULT_CONFIG_URL;

        populateInitialText();
        
        // Initialize all event listeners from modular files
        initializeGlobalListeners();
        initializePlannerListeners();
        initializeProgressListeners();
        initializeProfileListeners();

        renderApp(); // Initial render with local data

        // Expose debug mode toggle to the window
        window.toggleDebugMode = toggleDebugMode;

        const urlParams = new URLSearchParams(window.location.search);
        const configUrlFromParam = urlParams.get('configUrl');

        if (configUrlFromParam) {
          const decodedUrl = decodeURIComponent(configUrlFromParam);
          initialState = getState(); // Get fresh state
          if (decodedUrl !== initialState.configUrl) {
            showConfirmModal(
              UI_TEXT.LOAD_SHARED_CONFIG_TITLE,
              UI_TEXT.LOAD_SHARED_CONFIG_MSG,
              () => {
                setConfigUrl(decodedUrl);
                document.getElementById('config-url-input').value = decodedUrl;
                loadConfig(decodedUrl);
              },
              'primary'
            );
          } else {
            await loadConfig(initialState.configUrl);
          }
        } else {
          await loadConfig(initialState.configUrl);
        }
        
        registerServiceWorker();
      }

      document.addEventListener('DOMContentLoaded', init);
  - file: sw.js
    content: |
      const CACHE_NAME = 'healtypro-v12';
      const APP_SHELL_FILES = [
        '.',
        'index.html',
        'styles/base.css',
        'styles/planner.css',
        'styles/progress.css',
        'styles/modals.css',
        'styles/charts.css',
        'styles/recipes.css',
        'styles/trainer.css',
        'templates/planner.html',
        'templates/progress.html',
        'templates/profile.html',
        'templates/charts.html',
        'templates/recipes.html',
        'templates/modals.html',
        'templates/trainer.html',
        'src/main.js',
        'src/api/configService.js',
        'src/core/state.js',
        'src/core/calculations.js',
        'src/core/validation.js',
        'src/core/trainer.js',
        'src/core/trainer/state.js',
        'src/core/trainer/queueBuilder.js',
        'src/core/trainer/machine.js',
        'src/core/trainer/animation.js',
        'src/ui/interactions/globalInteractions.js',
        'src/ui/interactions/plannerInteractions.js',
        'src/ui/interactions/profileInteractions.js',
        'src/ui/interactions/progressInteractions.js',
        'src/ui/notifications.js',
        'src/ui/renderer.js',
        'src/ui/modals.js',
        'src/ui/modals/confirmModal.js',
        'src/ui/modals/dayEditorModal.js',
        'src/ui/modals/exerciseEditorModal.js',
        'src/ui/modals/recipeModal.js',
        'src/ui/modals/selectionModal.js',
        'src/ui/modals/workoutEditorModal.js',
        'src/ui/plannerRenderer.js',
        'src/ui/pageRenderers.js',
        'src/ui/recipesRenderer.js',
        'src/ui/charts.js',
        'src/ui/viewLoader.js',
        'src/ui/icons.js',
        'src/ui/trainerRenderer.js',
        'src/ui/components/TrainerComponent.js',
        'src/utils/constants.js',
        'src/utils/formatters.js',
        'src/utils/logger.js',
        'icons/icon-192x192.png',
        'icons/icon-512x512.png',
        'screenshots/screen_desktop.png',
        'screenshots/screen_mobile.png'
      ];

      self.addEventListener('install', (event) => {
        event.waitUntil(
          caches.open(CACHE_NAME)
            .then((cache) => {
              console.log('Opened cache and caching app shell');
              return cache.addAll(APP_SHELL_FILES);
            })
        );
      });

      self.addEventListener('activate', (event) => {
        event.waitUntil(
          caches.keys().then((cacheNames) => {
            return Promise.all(
              cacheNames.filter((cacheName) => {
                return cacheName !== CACHE_NAME;
              }).map(cacheName => caches.delete(cacheName))
            );
          })
        );
      });

      self.addEventListener('fetch', (event) => {
        if (event.request.url.startsWith(self.location.origin)) {
          event.respondWith(
            caches.match(event.request)
              .then((response) => {
                return response || fetch(event.request);
              })
          );
        } else {
          event.respondWith(fetch(event.request));
        }
      });
