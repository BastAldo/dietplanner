commit_message: "refactor(UI): Ridisegna il modale di conferma per supportare pulsanti multipli e corregge il flusso di uscita dal trainer"
rationale: |
  Questa patch risolve un'importante regressione funzionale e di usabilità nel flusso di terminazione dell'allenamento e migliora l'architettura dei componenti modali.

  **1. Refactoring Architettonico del `confirmModal`:**
  * **Problema:** Il componente `showConfirmModal` era rigido, progettato per soli due pulsanti (conferma/annulla). Questo ha impedito la corretta implementazione di un'interfaccia a tre opzioni (Salva/Scarta/Annulla), portando a una logica a cascata fragile e a bug funzionali.
  * **Soluzione:**
      * Il componente è stato completamente refattorizzato. Ora `showConfirmModal` in `src/ui/modals/confirmModal.js` accetta un array di oggetti `buttons`, dove ogni oggetto definisce `text`, `className`, e `callback`.
      * Il template `templates/modals.html` è stato aggiornato per avere un footer dinamico che viene popolato programmaticamente.
      * Questo rende il `confirmModal` un componente altamente riutilizzabile e flessibile, capace di gestire qualsiasi numero di azioni.
      * Tutte le chiamate esistenti a `showConfirmModal` nell'applicazione (`globalInteractions.js`, `plannerInteractions.js`, `progressInteractions.js`) sono state aggiornate per utilizzare la nuova firma, garantendo la retrocompatibilità.

  **2. Implementazione del Flusso di Uscita Corretto nel Trainer:**
  * **Problema:** Il flusso per terminare un allenamento era confuso, non funzionante e mancava di un'opzione chiara per annullare l'azione.
  * **Soluzione:**
      * Sfruttando il nuovo `confirmModal`, il metodo `_handleEndWorkoutFlow` in `src/ui/components/TrainerComponent.js` è stato riscritto da zero.
      * Ora, una singola chiamata al modale presenta all'utente le tre opzioni chiare e dirette come richiesto: "Salva e Termina", "Scarta Allenamento" e "Annulla".
      * Ogni pulsante è collegato alla sua azione corretta (`endWorkout`, `discardWorkout`, o semplicemente la chiusura del modale), risolvendo il bug funzionale e migliorando drasticamente l'esperienza utente.
patches:
  - file: src/ui/modals/confirmModal.js
    content: |
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';

      export function showConfirmModal(options) {
        const {
          title,
          message,
          buttons = [], // Default to an empty array
          // The following are fallbacks for the old API signature
          onConfirm,
          onCancel,
          type = 'secondary',
          confirmText = UI_TEXT.CONFIRM_MODAL_CONFIRM_BTN,
          cancelText = UI_TEXT.CONFIRM_MODAL_CANCEL_BTN,
        } = options;

        log('Modals', 'Showing confirm modal', { title });
        const confirmModal = document.getElementById('confirm-modal');
        confirmModal.querySelector('#confirm-modal-title').textContent = title;
        confirmModal.querySelector('#confirm-modal-message').textContent = message;
        const footer = confirmModal.querySelector('.modal-footer');
        footer.innerHTML = ''; // Clear previous buttons

        let buttonConfigs = buttons;

        // Handle backward compatibility for old 2-button calls
        if (buttonConfigs.length === 0 && onConfirm) {
          buttonConfigs.push({
            text: confirmText,
            className: `btn btn-${type}`,
            callback: onConfirm
          });
          buttonConfigs.push({
            text: cancelText,
            className: 'btn btn-secondary',
            callback: onCancel
          });
        }

        const cleanup = () => {
          confirmModal.classList.add('modal-hidden');
        };

        buttonConfigs.forEach(btnConfig => {
          const button = document.createElement('button');
          button.textContent = btnConfig.text;
          button.className = btnConfig.className || 'btn btn-secondary';
          button.addEventListener('click', () => {
            if (btnConfig.callback) {
              btnConfig.callback();
            }
            cleanup();
          }, { once: true });
          footer.appendChild(button);
        });

        // Add a default cancel button if the user only provides one button via the old API
        // This is a safety measure to ensure modals can always be closed.
        if (buttons.length === 0 && onConfirm && !onCancel && buttonConfigs.length === 1) {
            const cancelButton = document.createElement('button');
            cancelButton.textContent = UI_TEXT.CONFIRM_MODAL_CANCEL_BTN;
            cancelButton.className = 'btn btn-secondary';
            cancelButton.addEventListener('click', cleanup, { once: true });
            footer.appendChild(cancelButton);
        }

        confirmModal.classList.remove('modal-hidden');
      }
