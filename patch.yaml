commit_message: "feat(Features): Implementa log strutturato, metriche avanzate, audio e obiettivi"
rationale: |
  Questo commit introduce un'importante suite di funzionalità per trasformare HealtyPro in uno strumento di tracking del benessere più completo, risolvendo al contempo un bug critico nel logging manuale.

  1.  **Bug Fix e Log Strutturato**: È stato corretto un `TypeError` nel modale di log manuale. Il sistema è stato completamente rinnovato, sostituendo un campo di testo generico con campi numerici strutturati (`Distanza`, `FC Media`, `FC Massima`) e un campo `Note`. Questo permette una registrazione dei dati più precisa e apre la porta ad analisi future.

  2.  **Metriche di Allenamento Avanzate**:
      * **Calorie Bruciate (METs)**: Integrata la logica per il calcolo del dispendio calorico basato sul valore MET degli esercizi, il peso dell'utente e la durata. Il risultato è visibile nel debriefing e nel log.
      * **Tonnellaggio (Volume)**: Aggiunto il calcolo del tonnellaggio (Serie x Reps x Peso) per gli esercizi di forza, una metrica fondamentale per il tracciamento del sovraccarico progressivo.
      * **Sforzo Percepito (RPE)**: L'utente può ora registrare lo sforzo percepito (RPE) al termine di ogni allenamento.

  3.  **Feedback Audio nel Trainer**: Implementato feedback sonori nella vista Trainer tramite la Web Audio API nativa. Segnali acustici marcano l'inizio e la fine delle fasi di esercizio e recupero, rendendo l'esperienza più immersiva. È stato aggiunto un controllo per attivare/disattivare l'audio.

  4.  **Sistema di Obiettivi Settimanali**: Creata una nuova pagina "Obiettivi" dove l'utente può definire target settimanali per calorie e allenamenti. Il widget di riepilogo nella pagina Planner ora mostra i progressi verso questi obiettivi, introducendo un elemento motivazionale.
