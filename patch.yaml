commit_message: "fix(charts): Risolve l'errore fatale aggiungendo l'adattatore per le date a Chart.js"
rationale: |
  Questa patch risolve l'errore critico `This method is not implemented: Check that a complete date adapter is provided`, che impediva il rendering di qualsiasi grafico basato sul tempo e causava errori a cascata come `Canvas is already in use`.

  **Causa Radice:**
  La libreria `Chart.js` (dalla versione 3 in poi) richiede un "adattatore" esplicito per poter interpretare e formattare gli assi temporali (`type: 'time'`). Il file `index.html` caricava la libreria `Chart.js` ma non forniva questo adattatore necessario, causando un crash durante l'inizializzazione del grafico biometrico.

  **Soluzione Implementata:**
  1.  **Aggiunta delle Dipendenze in `index.html`**: Sono stati aggiunti due tag `<script>` nel file `index.html`, caricati da un CDN affidabile, immediatamente dopo l'inclusione di `Chart.js`:
      - La libreria per la gestione delle date `date-fns`.
      - L'adattatore ufficiale `chartjs-adapter-date-fns`, che funge da ponte tra `Chart.js` e `date-fns`.

  Questo intervento è la soluzione definitiva e corretta, in quanto fornisce a `Chart.js` le dipendenze richieste dal suo ecosistema per funzionare correttamente. Risolvendo questo errore fondamentale, si risolvono anche tutti gli errori secondari che ne derivavano, rendendo l'applicazione finalmente stabile e pienamente funzionante.
