commit_message: "fix(trainer): Corregge il flusso di fine allenamento e la logica di debriefing"
rationale: |
  Questo commit risolve due bug critici nel flusso di completamento dell'allenamento che causavano un'esperienza utente incoerente.

  1.  **Completamento Naturale**: In precedenza, al termine naturale dell'ultimo esercizio, l'applicazione reindirizzava l'utente direttamente al planner, saltando la vista di debriefing. Questo era causato da una logica di navigazione errata nel ciclo di animazione (`src/core/trainer/animation.js`). La correzione disaccoppia la logica di animazione da quella di navigazione. Ora, la macchina a stati (`machine.js`) emette un evento `workoutFinished` al termine dell'allenamento, che viene catturato dal modulo `trainer.js` per orchestrare correttamente la transizione alla vista di debriefing.

  2.  **Logica di Debriefing**: La logica per determinare se un esercizio fosse "completato" o "incompleto" nella vista di debriefing era imprecisa. Non gestiva correttamente la differenza tra un allenamento terminato manualmente e uno completato naturalmente. La funzione `renderDebriefingPage` in `src/ui/pageRenderers.js` è stata aggiornata con una logica più robusta che calcola accuratamente le serie completate per ogni esercizio in base allo stato finale salvato, garantendo che il riepilogo sia sempre corretto.
