    content: |
      /* --- TRAINER VIEW STYLES --- */
      #trainer-page {
          height: calc(100vh - 60px);
          display: flex;
          flex-direction: column;
          background-color: var(--bg-color);
          color: var(--text-color);
      }

      .trainer-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          background-color: var(--card-color);
          border-bottom: 1px solid var(--border-color);
          flex-shrink: 0;
          gap: 1rem;
          position: relative;
      }

      .trainer-header h2 {
          font-size: 1.25rem;
          color: var(--primary-color);
          flex-grow: 1;
          text-align: center;
      }

      .trainer-header-controls {
          position: absolute;
          right: 1rem;
          display: flex;
          gap: 0.5rem;
      }

      #audio-toggle-btn {
          background: none;
          border: none;
          color: var(--text-color-muted);
          cursor: pointer;
          padding: 0.5rem;
      }

      #audio-toggle-btn.active {
          color: var(--primary-color);
      }

      .trainer-body {
          flex-grow: 1;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          text-align: center;
          position: relative;
          overflow-y: auto;
      }

      .exercise-info-container {
          margin-top: 1rem;
          margin-bottom: 1rem;
      }

      #current-exercise-name {
          font-size: 2rem;
          font-weight: bold;
      }

      #current-exercise-details {
          font-size: 1.25rem;
          color: var(--text-color-muted);
          margin-bottom: 0.5rem;
      }

      #current-rep-display {
        font-size: 1rem;
        color: var(--secondary-color);
        font-weight: bold;
        min-height: 1.2em;
      }

      #current-rep-display.hidden-rep {
        visibility: hidden;
      }

      #upcoming-exercise-display {
        font-size: 0.9rem;
        color: var(--text-color-muted);
        margin-top: 0.75rem;
        font-style: italic;
      }

      #upcoming-exercise-display strong {
        color: var(--text-color);
        font-style: normal;
      }

      #trainer-display-modes {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-grow: 1;
          min-height: 280px;
      }

      .timer-ring-container {
          width: 280px;
          height: 280px;
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          margin: 1rem 0;
      }

      .timer-ring-display {
          font-size: 2.2rem;
          font-weight: bold;
          fill: var(--text-color);
          text-transform: uppercase;
          text-anchor: middle;
          transition: font-size 0.2s ease;
      }

      .timer-ring-display.is-timer {
          font-size: 4rem;
          font-family: 'Courier New', Courier, monospace;
          text-transform: none;
      }

      .timer-ring-display.is-rep-count {
          font-size: 6rem;
          text-transform: none;
      }

      .timer-ring-bg {
          fill: none;
          stroke: var(--card-color);
          stroke-width: 12;
      }

      .timer-ring-progress {
          fill: none;
          stroke: var(--primary-color);
          stroke-width: 12;
          stroke-linecap: round;
          transform: rotate(-90deg);
          transform-origin: 50% 50%;
          transition: stroke-dashoffset 0.1s linear;
      }

      .timer-ring-progress.phase-up { stroke: var(--success-color); }
      .timer-ring-progress.phase-hold { stroke: var(--warning-color); }
      .timer-ring-progress.phase-down { stroke: var(--danger-color); }

      @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .flashing {
        animation: flash 1.4s infinite;
        fill: var(--secondary-color);
      }

      .trainer-controls {
          display: flex;
          gap: 1rem;
          justify-content: center;
          align-items: center;
          margin-top: 1rem;
          height: 80px;
          width: 100%;
          padding-bottom: 1rem;
      }

      .btn-large {
          padding: 1rem 2rem;
          font-size: 1.25rem;
      }
