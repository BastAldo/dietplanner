commit_message: "feat(debug): Aggiunge una modalità di debug per il troubleshooting del Trainer"
rationale: |
  In risposta al bug persistente che blocca il componente Trainer al secondo avvio, questo commit introduce un sistema di logging controllabile per facilitare il troubleshooting. Non tenta di risolvere il bug direttamente, ma fornisce gli strumenti necessari per diagnosticarlo con precisione.

  Le modifiche principali sono:

  1.  **Creazione di un Logger (`src/utils/logger.js`):**
      * È stato creato un nuovo modulo centralizzato per la gestione dei log. Questo modulo esporta una funzione `log` che scrive messaggi in console solo se la modalità di debug è attiva.

  2.  **Introduzione della `debugMode` (`src/core/state.js`, `src/main.js`):**
      * È stato aggiunto un nuovo flag `debugMode` allo stato globale dell'applicazione, inizializzato a `false`.
      * È stata creata una funzione `toggleDebugMode()` per attivare o disattivare questa modalità. Per facilitare l'uso, questa funzione è stata esposta globalmente (`window.toggleDebugMode`) e può essere chiamata direttamente dalla console del browser.

  3.  **Integrazione dei Log Strategici:**
      * Sono state inserite chiamate alla nuova funzione `log` in tutti i punti chiave del ciclo di vita del componente Trainer:
          * In `renderer.js`, per tracciare quando il sistema decide di creare o distruggere il componente.
          * In `trainerRenderer.js`, per confermare l'esecuzione delle funzioni di inizializzazione e distruzione.
          * In `trainer.js`, per monitorare lo stato prima e dopo un reset e all'avvio dell'allenamento.
          * In `TrainerComponent.js`, per registrare gli eventi di click sui controlli principali.

  Questo sistema ci permetterà di avere una visione chiara e dettagliata del flusso di esecuzione e di identificare con esattezza il punto in cui la logica si interrompe.
