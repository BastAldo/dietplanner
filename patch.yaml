      const CACHE_NAME = 'healtypro-v17';
      const APP_SHELL_FILES = [
        '.',
        'index.html',
        'styles/base.css',
        'styles/planner.css',
        'styles/progress.css',
        'styles/modals.css',
        'styles/charts.css',
