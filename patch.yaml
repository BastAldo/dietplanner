commit_message: "feat(UX/Tracking): Aggiunge log strutturato, feedback audio e metriche avanzate"
rationale: |
  Questo commit introduce un'importante suite di funzionalità, come da nostra discussione, per trasformare HealtyPro in uno strumento di tracking del benessere più completo, immersivo e basato sui dati.

  1.  **Log di Attività Manuale Strutturato**: Il sistema di logging manuale è stato completamente rinnovato. Il precedente campo di testo generico è stato sostituito da campi numerici strutturati (`Distanza`, `FC Media`, `FC Massima`) e un campo `Note`. Questo permette una registrazione dei dati più precisa e apre la porta ad analisi future. La UI del log è stata aggiornata per visualizzare questi dati in modo pulito.

  2.  **Feedback Audio nel Trainer**: È stata implementata una delle funzionalità più richieste: feedback sonori nella vista Trainer. Utilizzando la Web Audio API nativa per mantenere l'applicazione leggera, ora vengono riprodotti dei segnali acustici per marcare l'inizio e la fine delle fasi di esercizio e recupero. Questo rende l'esperienza di allenamento più immersiva, permettendo all'utente di concentrarsi sul movimento anziché sullo schermo. È stato aggiunto un controllo per attivare/disattivare l'audio.

  3.  **Calcolo Calorie Bruciate (METs)**: È stata integrata la logica per il calcolo del dispendio calorico basato sul valore MET degli esercizi. Il risultato è ora visibile sia nella schermata di debriefing sia nel riepilogo dell'allenamento nella vista Log, fornendo un quadro completo del bilancio energetico.

  4.  **Miglioramenti UI Aggiuntivi**:
      * **Tonnellaggio (Volume)**: È stato aggiunto il calcolo del tonnellaggio (Serie x Reps x Peso) per gli esercizi di forza, una metrica fondamentale per il tracciamento del sovraccarico progressivo. Per abilitarlo, è stato aggiunto un campo "Peso" nell'editor dell'esercizio.
      * **Sforzo Percepito (RPE)**: L'utente può ora registrare lo sforzo percepito (RPE) al termine di ogni allenamento. Questo dato qualitativo è cruciale per monitorare la fatica.
      * **Obiettivi Settimanali**: È stata creata una nuova pagina "Obiettivi" e integrata nel flusso dell'app, dove l'utente può definire target settimanali per calorie e allenamenti. Il widget di riepilogo ora mostra i progressi verso questi obiettivi.
