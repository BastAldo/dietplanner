commit_message: "fix(trainer): Garantisce un flusso di allenamento continuo e corregge il timer di recupero"
rationale: |
  Questo commit risolve due bug critici nel flusso logico del trainer che impedivano un'esperienza utente fluida e corretta.

  **1. Correzione del Blocco dell'Allenamento tra Esercizi:**
  - **Problema**: L'allenamento si interrompeva tra esercizi con modalità di esecuzione diverse perché lo stato veniva erroneamente impostato su `'idle'`, richiedendo un intervento manuale (pausa/riprendi) per proseguire.
  - **Soluzione**: È stata refattorizzata la macchina a stati in `src/core/trainer/machine.js`. La funzione `advanceToNextSet` ora gestisce la transizione tra esercizi in modo proattivo. Al completamento dell'ultima serie, invece di fermarsi, la funzione prepara e avvia direttamente il primo set dell'esercizio successivo. Questo elimina lo stato intermedio `'idle'` e garantisce che l'allenamento proceda senza interruzioni, come previsto.

  **2. Correzione del Timer di Recupero in Modalità `manual_reps`:**
  - **Problema**: In modalità `manual_reps`, dopo aver registrato l'ultima ripetizione, il timer di recupero non si avviava perché il ciclo di animazione non veniva attivato.
  - **Soluzione**: È stata modificata la funzione `incrementManualRep` in `src/core/trainer.js`. Ora, quando l'ultima ripetizione viene registrata e lo stato passa a `'resting'`, viene aggiunta una chiamata esplicita a `startAnimation()`. Questo assicura che il ciclo di animazione parta immediatamente per gestire il conto alla rovescia del tempo di riposo, ripristinando la funzionalità corretta.

  Queste modifiche rendono il trainer significativamente più robusto e affidabile, offrendo un'esperienza di allenamento continua e senza interruzioni impreviste.
