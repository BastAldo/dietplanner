commit_message: "feat(trainer): Implementa il ciclo del timer e il rendering dinamico"
rationale: |
  Questo commit introduce il "motore" dinamico della Vista Trainer, rendendola interattiva e funzionale per la modalità `tempo_guided`.

  Le modifiche principali sono:

  1.  **Logica del Timer e Macchina a Stati (`src/core/trainer.js`):**
      * È stato introdotto un `setInterval` che agisce come ciclo principale ("battito cardiaco") per l'allenamento, garantendo aggiornamenti costanti dello stato.
      * È stata implementata la funzione `buildExecutionQueueForCurrentSet` che, come da specifiche in `docs/02_ARCHITECTURE.md`, "pre-compila" la sequenza delle 6 fasi per ogni ripetizione della serie corrente.
      * La macchina a stati ora gestisce attivamente le transizioni tra `idle`, `running`, `paused`, e il passaggio da una fase all'altra, consumando la `executionQueue`.
      * Ogni cambiamento di stato ora emette un evento `workoutStateChange` per notificare all'interfaccia utente la necessità di un aggiornamento.

  2.  **Rendering Dinamico e Anello SVG (`src/ui/trainerRenderer.js`):**
      * Il renderer ora crea dinamicamente un anello SVG all'interno del `timer-ring-container`, completo di sfondo e arco di progresso.
      * È stata implementata la funzione `updateTimerRing` che anima l'arco di progresso manipolando `stroke-dashoffset` per rappresentare visivamente il tempo che passa.
      * Il modulo si mette in ascolto dell'evento `workoutStateChange` e, quando lo riceve, la funzione `renderTrainerView` aggiorna in tempo reale tutti gli elementi della UI: il testo della fase, l'animazione dell'anello e i contatori di serie/ripetizioni.

  3.  **Controlli Utente (`templates/trainer.html`, `src/ui/trainerRenderer.js`):**
      * È stato aggiunto un pulsante "Avvia" alla vista.
      * Sono stati implementati i gestori di eventi per i pulsanti "Avvia", "Pausa", "Indietro" e "Termina", che ora sono collegati alle funzioni corrispondenti nel modulo `trainer.js` (`startWorkout`, `pauseWorkout`, etc.), rendendo l'interfaccia completamente interattiva.

  Con questo aggiornamento, la modalità `tempo_guided` della Vista Trainer è ora pienamente operativa: l'utente può avviare un allenamento ed essere guidato visivamente e testualmente attraverso ogni fase di ogni ripetizione.
patches:
  - file: src/core/trainer.js
    content: |
      import { setView } from './state.js';

      let workoutState = {
        exerciseQueue: [],
        currentExerciseIndex: -1,
        status: 'idle', // idle, running, paused, resting, finished
        currentSet: 0,
        currentRep: 0,
        executionQueue: [],
        currentPhaseIndex: -1,
        phaseTimeElapsed: 0,
        totalTimeElapsed: 0,
      };

      let timerInterval = null;
      const TICK_RATE_MS = 50; // Aggiorna 20 volte al secondo per un'animazione fluida

      function buildExecutionQueueForCurrentSet() {
        const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
        if (!currentExercise) return [];

        const queue = [];
        const reps = currentExercise.defaultReps;
        const tempo = currentExercise.defaultTempo;

        for (let i = 0; i < reps; i++) {
          if (tempo) {
            queue.push({ name: 'pre-up', rep: i + 1, duration: 700 });
            queue.push({ name: 'up', rep: i + 1, duration: tempo.up * 1000 });
            queue.push({ name: 'pre-hold', rep: i + 1, duration: 700 });
            queue.push({ name: 'hold', rep: i + 1, duration: tempo.hold * 1000 });
            queue.push({ name: 'pre-down', rep: i + 1, duration: 700 });
            queue.push({ name: 'down', rep: i + 1, duration: tempo.down * 1000 });
          }
        }
        return queue;
      }

      function tick() {
        if (workoutState.status !== 'running') return;

        workoutState.phaseTimeElapsed += TICK_RATE_MS;
        workoutState.totalTimeElapsed += TICK_RATE_MS;

        const currentPhase = workoutState.executionQueue[workoutState.currentPhaseIndex];
        if (!currentPhase) {
          // Fine della serie o errore
          pauseWorkout(); // Metti in pausa per sicurezza
          return;
        }

        if (workoutState.phaseTimeElapsed >= currentPhase.duration) {
          // Passa alla fase successiva
          workoutState.currentPhaseIndex++;
          workoutState.phaseTimeElapsed = 0;

          const nextPhase = workoutState.executionQueue[workoutState.currentPhaseIndex];
          if (nextPhase) {
            workoutState.currentRep = nextPhase.rep;
          } else {
            // Serie completata
            // Qui andrà la logica per il riposo e la serie successiva
            workoutState.status = 'resting';
            console.log("Serie completata, inizio riposo...");
          }
        }
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function getWorkoutState() {
        return workoutState;
      }

      export function initializeWorkout(plannedExercises) {
        if (!plannedExercises || plannedExercises.length === 0) {
          console.error("Tentativo di inizializzare un allenamento senza esercizi.");
          return;
        }
        clearInterval(timerInterval);
        timerInterval = null;

        workoutState = {
          exerciseQueue: JSON.parse(JSON.stringify(plannedExercises)),
          currentExerciseIndex: 0,
          status: 'idle',
          currentSet: 1,
          currentRep: 1,
          executionQueue: [],
          currentPhaseIndex: -1,
          phaseTimeElapsed: 0,
          totalTimeElapsed: 0,
        };
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function startWorkout() {
        if (workoutState.status === 'idle') {
          workoutState.status = 'running';
          workoutState.executionQueue = buildExecutionQueueForCurrentSet();
          workoutState.currentPhaseIndex = 0;
          workoutState.phaseTimeElapsed = 0;
          workoutState.currentRep = 1;
          timerInterval = setInterval(tick, TICK_RATE_MS);
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function pauseWorkout() {
        if (workoutState.status === 'running' || workoutState.status === 'resting') {
          const oldStatus = workoutState.status;
          workoutState.status = 'paused';
          workoutState.prePauseStatus = oldStatus; // Salva lo stato precedente
          clearInterval(timerInterval);
          timerInterval = null;
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function resumeWorkout() {
        if (workoutState.status === 'paused') {
          workoutState.status = workoutState.prePauseStatus || 'running';
          if (!timerInterval) {
            timerInterval = setInterval(tick, TICK_RATE_MS);
          }
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function endWorkout() {
        workoutState.status = 'finished';
        clearInterval(timerInterval);
        timerInterval = null;
        setView('planner'); // Torna al planner
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }
  - file: src/ui/renderer.js
    content: |
      import { getState } from '../core/state.js';
      import { renderPlannerPage } from './plannerRenderer.js';
      import { renderBiometricsPage, renderProfilePage, renderChartsPage } from './pageRenderers.js';
      import { renderRecipesPage } from './recipesRenderer.js';
      import { renderTrainerView, initializeTrainerUI } from './trainerRenderer.js';
      import { UI_TEXT } from '../utils/constants.js';
      import { renderIcon } from './icons.js';

      function populateIcons() {
          document.querySelector('.app-title').insertAdjacentHTML('afterbegin', renderIcon('APP_LOGO', { width: 24, height: 24 }));
          document.getElementById('nav-planner').insertAdjacentHTML('afterbegin', renderIcon('PLANNER'));
          document.getElementById('nav-progress').insertAdjacentHTML('afterbegin', renderIcon('WEIGHT_SCALE'));
          document.getElementById('nav-charts').insertAdjacentHTML('afterbegin', renderIcon('BAR_CHART'));
          document.getElementById('nav-recipes').insertAdjacentHTML('afterbegin', renderIcon('BOOK'));
          document.getElementById('nav-profile').insertAdjacentHTML('afterbegin', renderIcon('PROFILE'));
          document.getElementById('share-config-btn').innerHTML = renderIcon('SHARE');
          document.getElementById('info-icon').innerHTML = renderIcon('INFO');
          document.getElementById('view-calendar-btn').innerHTML = renderIcon('PLANNER');
          document.getElementById('view-log-btn').innerHTML = renderIcon('LOG_VIEW');
          document.getElementById('global-alert-close').innerHTML = renderIcon('CLOSE', { width: 24, height: 24, classes: 'alert-icon' });
          
          document.querySelectorAll('.modal-close-btn').forEach(btn => {
              btn.innerHTML = renderIcon('CLOSE');
          });
      }

      export function populateInitialText() {
        document.title = UI_TEXT.MAIN_TITLE;
        document.getElementById('main-title').textContent = UI_TEXT.MAIN_TITLE;
        document.querySelector('#nav-planner span').textContent = UI_TEXT.NAV_PLANNER;
        document.querySelector('#nav-progress span').textContent = UI_TEXT.NAV_PROGRESS;
        document.querySelector('#nav-charts span').textContent = UI_TEXT.NAV_CHARTS;
        document.querySelector('#nav-recipes span').textContent = UI_TEXT.NAV_RECIPES;
        document.querySelector('#nav-profile span').textContent = UI_TEXT.NAV_PROFILE;
        document.getElementById('load-config-btn').textContent = UI_TEXT.LOAD_BUTTON;
        document.getElementById('reset-btn').textContent = UI_TEXT.RESET_BUTTON;
        document.getElementById('copy-week-btn').textContent = UI_TEXT.COPY_WEEK_BTN;
        document.getElementById('backup-btn').textContent = UI_TEXT.BACKUP_BTN;
        document.getElementById('restore-btn').textContent = UI_TEXT.RESTORE_BTN;
        document.getElementById('info-modal-title').textContent = UI_TEXT.INFO_MODAL_TITLE;
        document.getElementById('info-modal-desc').textContent = UI_TEXT.INFO_MODAL_DESC;
        document.getElementById('info-modal-json-example').textContent = UI_TEXT.INFO_MODAL_EXAMPLE_JSON;
        document.getElementById('biometrics-title').textContent = UI_TEXT.BIOMETRICS_FORM_TITLE;
        document.getElementById('biometrics-history-title').textContent = UI_TEXT.BIOMETRICS_HISTORY_TITLE;
        document.getElementById('profile-title').textContent = UI_TEXT.PROFILE_FORM_TITLE;
        document.getElementById('charts-title').textContent = UI_TEXT.CHARTS_TITLE;
        document.getElementById('planner-chart-title').textContent = UI_TEXT.PLANNER_CHART_TITLE;
        document.getElementById('biometrics-chart-title').textContent = UI_TEXT.BIOMETRICS_CHART_TITLE;
        document.getElementById('recipes-title').textContent = UI_TEXT.RECIPES_TITLE;
        populateIcons();
      }

      export function renderApp() {
        const state = getState();
        const plannerPage = document.getElementById('planner-page');
        const progressPage = document.getElementById('progress-page');
        const chartsPage = document.getElementById('charts-page');
        const recipesPage = document.getElementById('recipes-page');
        const profilePage = document.getElementById('profile-page');
        const trainerPage = document.getElementById('trainer-page');

        const navPlannerBtn = document.getElementById('nav-planner');
        const navProgressBtn = document.getElementById('nav-progress');
        const navChartsBtn = document.getElementById('nav-charts');
        const navRecipesBtn = document.getElementById('nav-recipes');
        const navProfileBtn = document.getElementById('nav-profile');

        [plannerPage, progressPage, chartsPage, recipesPage, profilePage, trainerPage].forEach(p => p.classList.add('hidden'));
        [navPlannerBtn, navProgressBtn, navChartsBtn, navRecipesBtn, navProfileBtn].forEach(b => b.classList.remove('active'));

        if (state.currentView === 'planner' || state.currentView === 'log') {
          plannerPage.classList.remove('hidden');
          navPlannerBtn.classList.add('active');
          renderPlannerPage(state);
        } else if (state.currentView === 'progress') {
          progressPage.classList.remove('hidden');
          navProgressBtn.classList.add('active');
          renderBiometricsPage(state);
        } else if (state.currentView === 'charts') {
          chartsPage.classList.remove('hidden');
          navChartsBtn.classList.add('active');
          renderChartsPage(state);
        } else if (state.currentView === 'recipes') {
          recipesPage.classList.remove('hidden');
          navRecipesBtn.classList.add('active');
          renderRecipesPage(state);
        } else if (state.currentView === 'profile') {
          profilePage.classList.remove('hidden');
          navProfileBtn.classList.add('active');
          renderProfilePage(state);
        } else if (state.currentView === 'trainer') {
          trainerPage.classList.remove('hidden');
          initializeTrainerUI(); // Assicura che l'UI sia pronta
          renderTrainerView(); // Disegna lo stato attuale
        }

        const urlInput = document.getElementById('config-url-input');
        if (document.activeElement !== urlInput) urlInput.value = state.configUrl;
      }
  - file: src/ui/trainerRenderer.js
    content: |
      import { getWorkoutState, startWorkout, pauseWorkout, resumeWorkout, endWorkout } from '../core/trainer.js';
      import { setView } from '../core/state.js';

      let ringProgress, ringText;
      const RING_RADIUS = 80;
      const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

      function createTimerRing(container) {
          if (container.querySelector('svg')) return; // Già creato
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('width', '200');
          svg.setAttribute('height', '200');
          svg.setAttribute('viewBox', '0 0 200 200');

          const backgroundCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          backgroundCircle.setAttribute('cx', '100');
          backgroundCircle.setAttribute('cy', '100');
          backgroundCircle.setAttribute('r', RING_RADIUS);
          backgroundCircle.setAttribute('class', 'timer-ring-bg');

          const progressCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          progressCircle.setAttribute('cx', '100');
          progressCircle.setAttribute('cy', '100');
          progressCircle.setAttribute('r', RING_RADIUS);
          progressCircle.setAttribute('class', 'timer-ring-progress');
          progressCircle.style.strokeDasharray = RING_CIRCUMFERENCE;
          progressCircle.style.strokeDashoffset = RING_CIRCUMFERENCE;

          svg.appendChild(backgroundCircle);
          svg.appendChild(progressCircle);
          container.prepend(svg);
          ringProgress = progressCircle;
      }

      function updateTimerRing(percent) {
        if (!ringProgress) return;
        const offset = RING_CIRCUMFERENCE - (percent / 100) * RING_CIRCUMFERENCE;
        ringProgress.style.strokeDashoffset = offset;
      }

      function formatExerciseDetails(exercise, set) {
        if (!exercise) return '';
        const sets = exercise.defaultSets;
        let details = `Serie ${set} di ${sets}`;
        if (exercise.type === 'reps') {
          const reps = exercise.defaultReps;
          details += ` | ${reps} Ripetizioni`;
        } else if (exercise.type === 'time') {
          const duration = exercise.defaultDuration;
          details += ` | ${duration}s`;
        }
        return details;
      }

      function renderPhase(state) {
        const { executionQueue, currentPhaseIndex, phaseTimeElapsed } = state;
        const phase = executionQueue[currentPhaseIndex];
        if (!phase) return;

        const phaseNameDisplay = phase.name.replace('pre-', '').toUpperCase();
        const isPrePhase = phase.name.startsWith('pre-');

        ringText.textContent = phaseNameDisplay;
        ringText.classList.toggle('flashing', isPrePhase);

        const progressPercent = (phaseTimeElapsed / phase.duration) * 100;
        updateTimerRing(progressPercent);
      }

      export function renderTrainerView() {
        const state = getWorkoutState();
        const { exerciseQueue, currentExerciseIndex, status, currentSet, currentRep } = state;

        if (status === 'idle' && currentExerciseIndex < 0) return;

        const currentExercise = exerciseQueue[currentExerciseIndex];
        document.getElementById('current-exercise-name').textContent = currentExercise.name;
        document.getElementById('current-exercise-details').textContent = formatExerciseDetails(currentExercise, currentSet);
        document.getElementById('current-rep-display').textContent = `Rip. ${currentRep}`;


        const upcomingList = document.getElementById('upcoming-exercises-list');
        upcomingList.innerHTML = '';
        exerciseQueue.slice(currentExerciseIndex + 1).forEach(ex => {
          const li = document.createElement('li');
          li.textContent = ex.name;
          upcomingList.appendChild(li);
        });

        const controlsContainer = document.getElementById('trainer-main-controls');
        if (status === 'idle') {
          controlsContainer.innerHTML = `<button id="trainer-start-btn" class="btn btn-primary btn-large">AVVIA</button>`;
        } else if (status === 'running' || status === 'resting') {
          controlsContainer.innerHTML = `<button id="trainer-pause-btn" class="btn btn-secondary btn-large">PAUSA</button>`;
        } else if (status === 'paused') {
          controlsContainer.innerHTML = `<button id="trainer-resume-btn" class="btn btn-primary btn-large">RIPRENDI</button>`;
        }

        const modeTempoContainer = document.getElementById('mode-tempo-guided');
        // Aggiungere logica per altre modalità qui
        modeTempoContainer.classList.remove('hidden');

        if (status === 'running') {
            renderPhase(state);
        }
      }

      export function initializeTrainerUI() {
          document.removeEventListener('workoutStateChange', renderTrainerView);
          document.addEventListener('workoutStateChange', renderTrainerView);

          const ringContainer = document.getElementById('timer-ring-container');
          createTimerRing(ringContainer);
          ringText = document.getElementById('tempo-phase-name');

          document.getElementById('trainer-page').addEventListener('click', (e) => {
              if (e.target.id === 'trainer-start-btn') startWorkout();
              if (e.target.id === 'trainer-pause-btn') pauseWorkout();
              if (e.target.id === 'trainer-resume-btn') resumeWorkout();
              if (e.target.id === 'trainer-end-btn') endWorkout();
              if (e.target.id === 'trainer-back-btn') setView('planner');
          });
      }
  - file: styles/trainer.css
    content: |
      /* --- TRAINER VIEW STYLES --- */
      #trainer-page {
          height: calc(100vh - 60px);
          display: flex;
          flex-direction: column;
          background-color: var(--bg-color);
          color: var(--text-color);
      }

      .trainer-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          background-color: var(--card-color);
          border-bottom: 1px solid var(--border-color);
          flex-shrink: 0;
      }

      .trainer-header h2 {
          font-size: 1.25rem;
          color: var(--primary-color);
      }

      .trainer-body {
          flex-grow: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          padding: 1rem;
          text-align: center;
          position: relative;
      }

      .exercise-info-container {
          margin-bottom: 1rem;
      }

      .current-exercise-name {
          font-size: 2rem;
          font-weight: bold;
      }

      .current-exercise-details {
          font-size: 1.25rem;
          color: var(--text-color-muted);
          margin-bottom: 0.5rem;
      }
      
      #current-rep-display {
        font-size: 1rem;
        color: var(--secondary-color);
        font-weight: bold;
      }

      .timer-ring-container {
          width: 250px;
          height: 250px;
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          margin: 1rem 0;
      }

      .timer-ring-display {
          font-size: 3rem;
          font-weight: bold;
          color: var(--text-color);
          text-transform: uppercase;
      }

      .timer-ring-bg {
          fill: none;
          stroke: var(--card-color);
          stroke-width: 10;
      }

      .timer-ring-progress {
          fill: none;
          stroke: var(--primary-color);
          stroke-width: 10;
          stroke-linecap: round;
          transform: rotate(-90deg);
          transform-origin: 50% 50%;
          transition: stroke-dashoffset 0.1s linear;
      }

      @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .flashing {
        animation: flash 1.4s infinite;
        color: var(--secondary-color);
      }

      .trainer-controls {
          display: flex;
          gap: 1rem;
          justify-content: center;
          align-items: center;
          margin-top: 1rem;
      }

      .btn-large {
          padding: 1rem 2rem;
          font-size: 1.25rem;
      }

      .upcoming-exercises-container {
          position: absolute;
          bottom: 1rem;
          left: 50%;
          transform: translateX(-50%);
          width: 90%;
          max-width: 400px;
      }

      .upcoming-exercises-list {
          list-style: none;
          padding: 0;
          margin: 0;
          color: var(--text-color-muted);
      }

      .upcoming-exercises-list li {
          padding: 0.25rem 0;
      }
  - file: templates/trainer.html
    content: |
      <div id="trainer-page" class="page-view hidden">
          <header class="trainer-header">
              <button id="trainer-back-btn" class="btn btn-secondary">Indietro</button>
              <h2 id="trainer-title">Allenamento</h2>
              <button id="trainer-end-btn" class="btn btn-danger">Termina</button>
          </header>
          <div class="trainer-body">
              <div class="exercise-info-container">
                  <h3 id="current-exercise-name"></h3>
                  <p id="current-exercise-details"></p>
                  <p id="current-rep-display"></p>
              </div>

              <div id="trainer-display-modes">
                  <div id="mode-tempo-guided">
                      <div id="timer-ring-container" class="timer-ring-container">
                          <div id="tempo-phase-name" class="timer-ring-display"></div>
                      </div>
                  </div>
              </div>

              <div id="trainer-main-controls" class="trainer-controls">
              </div>

              <div class="upcoming-exercises-container">
                  <h4>A seguire:</h4>
                  <ul id="upcoming-exercises-list" class="upcoming-exercises-list">
                  </ul>
              </div>
          </div>
      </div>
