commit_message: "feat(charts): Aggiunge navigazione temporale e stima obiettivo peso"
rationale: |
  Questo commit introduce importanti miglioramenti funzionali e di usabilità alla dashboard dei grafici, in risposta diretta al feedback dell'utente. Le modifiche rendono i dati più stabili, contestualizzati e orientati all'azione.

  1.  **Nuova Funzionalità: Navigazione Temporale**: È stata implementata la richiesta di poter "scorrere" nel tempo la finestra di visualizzazione dei dati. Sono stati aggiunti i pulsanti "<" e ">" che permettono all'utente di spostare il range di visualizzazione selezionato (es. "ultimi 30 giorni") indietro nel passato, settimana per settimana. Questo offre una flessibilità di analisi senza precedenti, consentendo di esaminare periodi storici specifici.

  2.  **Nuova Funzionalità: Stima Raggiungimento Obiettivo**: Nel pannello delle statistiche di riepilogo è stata aggiunta una nuova metrica di grande valore motivazionale: la stima di quante settimane mancano per raggiungere l'obiettivo di peso. Questo calcolo si basa sulla velocità di variazione media reale e fornisce un feedback concreto sui progressi.

  3.  **Miglioramento Algoritmo Variazione Peso**: Il calcolo della "variazione media settimanale" è stato reso molto più robusto e affidabile. Invece di basarsi solo su due punti (creando stime volatili), ora l'algoritmo esegue una regressione lineare sulle ultime 7 misurazioni disponibili nel periodo selezionato. Questo produce una linea di tendenza stabile che smussa le fluttuazioni giornaliere e riflette l'andamento reale in modo molto più accurato.
