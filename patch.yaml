  - file: src/api/configService.js
    content: |
      import { UI_TEXT } from '../config/uiText.js';

      async function fetchJson(url) {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`${UI_TEXT.API_FETCH_ERROR} ${url}: ${response.status}`);
          return response.json();
      }

      export async function fetchAndParseConfig(mealsUrl) {
          if (!mealsUrl) throw new Error(UI_TEXT.CONFIG_URL_EMPTY_ERROR);

          try {
              const mealsConfig = await fetchJson(mealsUrl);
              if (!mealsConfig.meals || !Array.isArray(mealsConfig.meals)) {
                  throw new Error(UI_TEXT.API_INVALID_MEALS_FILE);
              }

              const baseUrl = new URL(mealsUrl);
              const basePath = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf('/'));

              const ingredientsUrl = `${baseUrl.origin}${basePath}/ingredienti.json`;
              const ingredientsConfig = await fetchJson(ingredientsUrl);
              if (!ingredientsConfig.ingredienti || !Array.isArray(ingredientsConfig.ingredienti)) {
                  throw new Error(UI_TEXT.API_INVALID_INGREDIENTS_FILE);
              }

              let exercises = [];
              try {
                  const exercisesUrl = `${baseUrl.origin}${basePath}/esercizi.json`;
                  const exercisesConfig = await fetchJson(exercisesUrl);
                  if (exercisesConfig.esercizi && Array.isArray(exercisesConfig.esercizi)) {
                      exercises = exercisesConfig.esercizi;
                  }
              } catch (e) {
                  console.warn(UI_TEXT.API_EXERCISES_FILE_WARN);
              }

              return {
                  rules: mealsConfig.rules || [],
                  meals: mealsConfig.meals,
                  ingredienti: ingredientsConfig.ingredienti,
                  esercizi: exercises
              };

          } catch (error) {
              console.error("Fallimento nel caricamento della configurazione:", error);
              throw new Error(UI_TEXT.API_CONFIG_LOAD_FAIL);
          }
      }
  - file: src/ui/charts.js
    content: |
      import { MEAL_TYPES, DAYS, WEEK_STARTS_ON_MONDAY } from '../utils/constants.js';
      import { BIOMETRIC_FIELDS } from '../config/forms.js';
      import { UI_TEXT } from '../config/uiText.js';

      let plannerChartInstance = null;
      let biometricsChartInstance = null;
      let currentPlannerChartType = 'bar';

      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function getChartColors() {
          const style = getComputedStyle(document.documentElement);
          return {
              primary: style.getPropertyValue('--primary-color').trim(),
              secondary: style.getPropertyValue('--secondary-color').trim(),
              textColor: style.getPropertyValue('--text-color').trim(),
              borderColor: style.getPropertyValue('--border-color').trim(),
              danger: style.getPropertyValue('--danger-color').trim(),
              success: style.getPropertyValue('--success-color').trim(),
              warning: style.getPropertyValue('--warning-color').trim()
          };
      }

      function calculateWeeklyCalorieData(state) {
        const weekStart = getWeekStartDate(state.focusedDate);
        const weeklyData = { labels: [], calories: [] };

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          weeklyData.labels.push(DAYS[i]);

          let dailyMin = 0, dailyMax = 0;
          MEAL_TYPES.forEach(type => {
            const meal = state.weeklyPlan[`${isoDate}-${type}`];
            if (meal && typeof meal.calories_min === 'number') {
              const minCals = Number(meal.calories_min) || 0;
              const maxCals = Number(meal.calories_max) || minCals;
              dailyMin += minCals;
              dailyMax += maxCals;
            }
          });
          weeklyData.calories.push([dailyMin, dailyMax]);
        }
        return weeklyData;
      }

      function renderPlannerChart(state) {
        const weeklyData = calculateWeeklyCalorieData(state);
        const colors = getChartColors();
        const isLineChart = currentPlannerChartType === 'line';
        
        const datasets = isLineChart ?
        [{
            label: UI_TEXT.CHART_KCAL_MIN_LABEL,
            data: weeklyData.calories.map(c => c[0]),
            borderColor: colors.secondary,
            fill: false,
            tension: 0.1
        },{
            label: UI_TEXT.CHART_KCAL_MAX_LABEL,
            data: weeklyData.calories.map(c => c[1]),
            borderColor: colors.primary,
            fill: '-1',
            backgroundColor: colors.primary + '33',
            tension: 0.1
        }]
        :
        [{
            label: UI_TEXT.CHART_KCAL_RANGE_LABEL,
            data: weeklyData.calories,
            backgroundColor: colors.primary,
            borderColor: colors.secondary
        }];
        
        const ctx = document.getElementById('planner-chart-canvas').getContext('2d');
        plannerChartInstance = new Chart(ctx, {
          type: currentPlannerChartType,
          data: {
            labels: weeklyData.labels,
            datasets: datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                ticks: { color: colors.textColor },
                grid: { color: colors.borderColor }
              },
              x: {
                ticks: { color: colors.textColor },
                grid: { display: false }
              }
            },
            plugins: {
              legend: {
                display: isLineChart,
                labels: { color: colors.textColor }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    if (isLineChart) {
                      return `${context.dataset.label}: ${context.parsed.y}`;
                    }
                    const value = context.raw;
                    if (value[0] === value[1]) {
                      return `${UI_TEXT.KCAL_LABEL}: ${value[0]}`;
                    }
                    return `${UI_TEXT.KCAL_LABEL}: ${value[0]} - ${value[1]}`;
                  }
                }
              }
            }
          }
        });
      }

      function getBiometricsData(state) {
        const data = [...state.biometricData].sort((a, b) => new Date(a.date) - new Date(b.date));
        const labels = data.map(entry => new Date(entry.date).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }));
        
        const datasets = {};
        const numericFields = BIOMETRIC_FIELDS.filter(f => f.type === 'number' && f.id !== 'basalMetabolism' && f.id !== 'bmi');

        numericFields.forEach(field => {
            datasets[field.id] = {
                label: field.label,
                data: data.map(entry => entry[field.id] || null)
            };
        });

        return { labels, datasets };
      }

      function renderBiometricsChart(state) {
        const { labels, datasets } = getBiometricsData(state);
        const colors = getChartColors();
        const colorCycle = [colors.primary, colors.secondary, colors.success, colors.warning, colors.danger];
        
        const chartDatasets = Object.values(datasets)
            .map((dataset, index) => ({
                label: dataset.label,
                data: dataset.data,
                fill: false,
                borderColor: colorCycle[index % colorCycle.length],
                tension: 0.1,
                pointBackgroundColor: colorCycle[index % colorCycle.length],
                pointRadius: 4
            }))
            .filter(d => d.data.some(val => val !== null));

        const ctx = document.getElementById('biometrics-chart-canvas').getContext('2d');

        biometricsChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: chartDatasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                ticks: { color: colors.textColor },
                grid: { color: colors.borderColor }
              },
              x: {
                ticks: { color: colors.textColor },
                grid: { display: false }
              }
            },
            plugins: {
              legend: {
                display: true,
                labels: { color: colors.textColor }
              }
            }
          }
        });
      }

      function handleChartTypeChange(event, state) {
          const type = event.target.dataset.type;
          if (type && type !== currentPlannerChartType) {
              currentPlannerChartType = type;
              document.querySelectorAll('.btn-chart-type').forEach(btn => {
                  btn.classList.toggle('active', btn.dataset.type === type);
              });
              if (plannerChartInstance) {
                plannerChartInstance.destroy();
              }
              renderPlannerChart(state);
          }
      }

      export function renderCharts(state) {
          if (plannerChartInstance) {
              plannerChartInstance.destroy();
          }
          if (biometricsChartInstance) {
              biometricsChartInstance.destroy();
          }

          renderPlannerChart(state);
          renderBiometricsChart(state);

          const switcher = document.querySelector('.chart-type-switcher');
          const boundHandler = (e) => handleChartTypeChange(e, state);
          switcher.replaceWith(switcher.cloneNode(true));
          document.querySelector('.chart-type-switcher').addEventListener('click', boundHandler);
      }
  - file: src/ui/pageRenderers.js
    content: |
      import { calculateBMR } from '../core/calculations.js';
      import { BIOMETRIC_FIELDS, PROFILE_FIELDS } from '../config/forms.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { renderCharts } from './charts.js';

      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }

      function formatReadableDate(isoDate) {
          const date = new Date(isoDate);
          return date.toLocaleDateString('it-IT', {
              weekday: 'long',
              year: 'numeric',
              month: 'long',
              day: 'numeric'
          });
      }

      export function renderBiometricsPage(state) {
        const form = document.getElementById('biometrics-form');
        const listContainer = document.getElementById('biometrics-list');

        form.innerHTML = `${BIOMETRIC_FIELDS.map(field => `<div class="form-group"><label for="bio-${field.id}">${field.label}</label>${field.type === 'textarea' ? `<textarea id="bio-${field.id}" name="${field.id}"></textarea>` : `<input type="${field.type}" id="bio-${field.id}" name="${field.id}" ${field.props || ''} ${field.id === 'date' ? `value="${toISODateString(new Date())}"` : ''}>`}</div>`).join('')}<div class="form-actions"><button type="submit" class="btn btn-primary">${UI_TEXT.BIOMETRICS_SAVE_BTN}</button><button type="reset" class="btn btn-secondary">${UI_TEXT.BIOMETRICS_CLEAR_BTN}</button></div>`;

        if (state.biometricData.length > 0) {
            listContainer.innerHTML = state.biometricData.map(entry => {
                const fieldsHTML = BIOMETRIC_FIELDS.filter(field => field.id !== 'date' && entry[field.id])
                    .map(field => `
                        <div class="biometric-card__item ${field.id === 'notes' ? 'biometric-card__notes' : ''}">
                            <span class="biometric-card__label">${field.label}</span>
                            <span class="biometric-card__value">${entry[field.id]}</span>
                        </div>
                    `).join('');

                return `
                    <div class="biometric-card" data-date="${entry.date}">
                        <div class="biometric-card__header">
                            <span class="biometric-card__date">${formatReadableDate(entry.date)}</span>
                            <div class="biometrics-actions">
                                <button class="btn-actions-menu" data-date="${entry.date}" title="${UI_TEXT.BIOMETRICS_ACTIONS_TITLE}">
                                    ${renderIcon('KEBAB_MENU', { width: 24, height: 24 })}
                                </button>
                                <div class="actions-dropdown">
                                    <button class="btn-edit-biometrics" data-date="${entry.date}">${UI_TEXT.BIOMETRICS_EDIT_BTN}</button>
                                    <button class="btn-delete-biometrics delete" data-date="${entry.date}">${UI_TEXT.BIOMETRICS_DELETE_BTN}</button>
                                </div>
                            </div>
                        </div>
                        <div class="biometric-card__body">
                            ${fieldsHTML}
                        </div>
                    </div>`;
            }).join('');
        } else {
            listContainer.innerHTML = `<p class="placeholder-text">${UI_TEXT.BIOMETRICS_EMPTY_LIST}</p>`;
        }

        const weightInput = form.elements.weight;
        const bmrInput = form.elements.basalMetabolism;
        const weightForCalc = weightInput.value || (state.biometricData.length > 0 ? state.biometricData[0].weight : null);

        const bmr = calculateBMR(state.userProfile, weightForCalc);
        if (bmr !== null) {
          bmrInput.value = bmr;
        } else {
          bmrInput.placeholder = UI_TEXT.BIOMETRICS_BMR_PLACEHOLDER;
        }
      }

      export function renderProfilePage(state) {
        const form = document.getElementById('profile-form');
        form.innerHTML = `${PROFILE_FIELDS.map(field => `<div class="form-group">${field.type === 'radio' ? `<fieldset><legend>${field.label}</legend>${field.options.map(opt => `<label><input type="radio" name="${field.id}" value="${opt.value}" ${state.userProfile[field.id] === opt.value ? 'checked' : ''}> ${opt.label}</label>`).join('')}</fieldset>` : `<label for="prof-${field.id}">${field.label}</label><input type="${field.type}" id="prof-${field.id}" name="${field.id}" value="${state.userProfile[field.id] || ''}" ${field.props || ''}>`}</div>`).join('')}<div class="form-actions"><button type="submit" class="btn btn-primary">${UI_TEXT.PROFILE_SAVE_BTN}</button></div>`;
      }

      export function renderChartsPage(state) {
          const placeholder = document.getElementById('biometrics-chart-placeholder');
          const canvas = document.getElementById('biometrics-chart-canvas');
          if (state.biometricData.length < 2) {
              placeholder.textContent = UI_TEXT.BIOMETRICS_CHART_EMPTY;
              placeholder.classList.remove('hidden');
              canvas.classList.add('hidden');
          } else {
              placeholder.classList.add('hidden');
              canvas.classList.remove('hidden');
          }
          renderCharts(state);
      }
