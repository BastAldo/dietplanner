      import { loadStateFromLocalStorage, getState, setPlannerConfig, setConfigUrl, toggleDebugMode } from './core/state.js';
      import { renderApp, populateInitialText } from './ui/renderer.js';
      import { showConfirmModal } from './ui/modals.js';
      import { initializeEventListeners } from './ui/interactions.js';
      import { loadViews } from './ui/viewLoader.js';
      import { DEFAULT_CONFIG_URL } from './utils/constants.js';
      import { fetchAndParseConfig } from './api/configService.js';
      import { showNotification } from './ui/notifications.js';
      import { UI_TEXT } from './utils/constants.js';

      async function loadConfig(url) {
        if (!url) {
          setPlannerConfig({}, url); // Clear master list if no URL
          return;
        };
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config, url);
          showNotification(UI_TEXT.CONFIG_LOAD_SUCCESS, 'success');
        } catch (error) {
          showNotification(error.message, 'error');
          setPlannerConfig({}, url); // Clear master list on error
        }
      }

      function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/dietplanner/sw.js')
              .then(registration => console.log('ServiceWorker registration successful'))
              .catch(err => console.log('ServiceWorker registration failed: ', err));
          });
        }
      }

      async function init() {
        await loadViews();
        document.addEventListener('stateChange', renderApp);
        
        loadStateFromLocalStorage();
        let initialState = getState();
        document.getElementById('config-url-input').value = initialState.configUrl || DEFAULT_CONFIG_URL;

        populateInitialText();
        initializeEventListeners();
        renderApp(); // Initial render with local data

        // Expose debug mode toggle to the window
        window.toggleDebugMode = toggleDebugMode;

        const urlParams = new URLSearchParams(window.location.search);
        const configUrlFromParam = urlParams.get('configUrl');

        if (configUrlFromParam) {
          const decodedUrl = decodeURIComponent(configUrlFromParam);
          initialState = getState(); // Get fresh state
          if (decodedUrl !== initialState.configUrl) {
            showConfirmModal(
              UI_TEXT.LOAD_SHARED_CONFIG_TITLE,
              UI_TEXT.LOAD_SHARED_CONFIG_MSG,
              () => {
                setConfigUrl(decodedUrl);
                document.getElementById('config-url-input').value = decodedUrl;
                loadConfig(decodedUrl);
              },
              'primary'
            );
          } else {
            await loadConfig(initialState.configUrl);
          }
        } else {
          await loadConfig(initialState.configUrl);
        }
        
        registerServiceWorker();
      }

      document.addEventListener('DOMContentLoaded', init);
  - file: src/ui/renderer.js
    content: |
      import { getState } from '../core/state.js';
      import { renderPlannerPage } from './plannerRenderer.js';
      import { renderBiometricsPage, renderProfilePage, renderChartsPage } from './pageRenderers.js';
      import { renderRecipesPage } from './recipesRenderer.js';
      import { initializeTrainerController, destroyTrainerController } from './trainerRenderer.js';
      import { UI_TEXT } from '../utils/constants.js';
      import { renderIcon } from './icons.js';
      import { log } from '../utils/logger.js';

      let isTrainerActive = false;

      function populateIcons() {
          document.querySelector('.app-title').insertAdjacentHTML('afterbegin', renderIcon('APP_LOGO', { width: 24, height: 24 }));
          document.getElementById('nav-planner').insertAdjacentHTML('afterbegin', renderIcon('PLANNER'));
          document.getElementById('nav-progress').insertAdjacentHTML('afterbegin', renderIcon('WEIGHT_SCALE'));
          document.getElementById('nav-charts').insertAdjacentHTML('afterbegin', renderIcon('BAR_CHART'));
          document.getElementById('nav-recipes').insertAdjacentHTML('afterbegin', renderIcon('BOOK'));
          document.getElementById('nav-profile').insertAdjacentHTML('afterbegin', renderIcon('PROFILE'));
          document.getElementById('share-config-btn').innerHTML = renderIcon('SHARE');
          document.getElementById('info-icon').innerHTML = renderIcon('INFO');
          document.getElementById('view-calendar-btn').innerHTML = renderIcon('PLANNER');
          document.getElementById('view-log-btn').innerHTML = renderIcon('LOG_VIEW');
          document.getElementById('global-alert-close').innerHTML = renderIcon('CLOSE', { width: 24, height: 24, classes: 'alert-icon' });
          
          document.querySelectorAll('.modal-close-btn').forEach(btn => {
              btn.innerHTML = renderIcon('CLOSE');
          });
      }

      export function populateInitialText() {
        document.title = UI_TEXT.MAIN_TITLE;
        document.getElementById('main-title').textContent = UI_TEXT.MAIN_TITLE;
        document.querySelector('#nav-planner span').textContent = UI_TEXT.NAV_PLANNER;
        document.querySelector('#nav-progress span').textContent = UI_TEXT.NAV_PROGRESS;
        document.querySelector('#nav-charts span').textContent = UI_TEXT.NAV_CHARTS;
        document.querySelector('#nav-recipes span').textContent = UI_TEXT.NAV_RECIPES;
        document.querySelector('#nav-profile span').textContent = UI_TEXT.NAV_PROFILE;
        document.getElementById('load-config-btn').textContent = UI_TEXT.LOAD_BUTTON;
        document.getElementById('reset-btn').textContent = UI_TEXT.RESET_BUTTON;
        document.getElementById('copy-week-btn').textContent = UI_TEXT.COPY_WEEK_BTN;
        document.getElementById('backup-btn').textContent = UI_TEXT.BACKUP_BTN;
        document.getElementById('restore-btn').textContent = UI_TEXT.RESTORE_BTN;
        document.getElementById('info-modal-title').textContent = UI_TEXT.INFO_MODAL_TITLE;
        document.getElementById('info-modal-desc').textContent = UI_TEXT.INFO_MODAL_DESC;
        document.getElementById('info-modal-json-example').textContent = UI_TEXT.INFO_MODAL_EXAMPLE_JSON;
        document.getElementById('biometrics-title').textContent = UI_TEXT.BIOMETRICS_FORM_TITLE;
        document.getElementById('biometrics-history-title').textContent = UI_TEXT.BIOMETRICS_HISTORY_TITLE;
        document.getElementById('profile-title').textContent = UI_TEXT.PROFILE_FORM_TITLE;
        document.getElementById('charts-title').textContent = UI_TEXT.CHARTS_TITLE;
        document.getElementById('planner-chart-title').textContent = UI_TEXT.PLANNER_CHART_TITLE;
        document.getElementById('biometrics-chart-title').textContent = UI_TEXT.BIOMETRICS_CHART_TITLE;
        document.getElementById('recipes-title').textContent = UI_TEXT.RECIPES_TITLE;
        populateIcons();
      }

      export function renderApp() {
        const state = getState();
        const plannerPage = document.getElementById('planner-page');
        const progressPage = document.getElementById('progress-page');
        const chartsPage = document.getElementById('charts-page');
        const recipesPage = document.getElementById('recipes-page');
        const profilePage = document.getElementById('profile-page');
        const trainerPage = document.getElementById('trainer-page');

        const navPlannerBtn = document.getElementById('nav-planner');
        const navProgressBtn = document.getElementById('nav-progress');
        const navChartsBtn = document.getElementById('nav-charts');
        const navRecipesBtn = document.getElementById('nav-recipes');
        const navProfileBtn = document.getElementById('nav-profile');

        log('Renderer', 'Render triggered. Current view:', state.currentView, 'isTrainerActive:', isTrainerActive);

        // Gestione del ciclo di vita del TrainerComponent
        if (state.currentView !== 'trainer' && isTrainerActive) {
            log('Renderer', 'View is not trainer, destroying trainer controller...');
            destroyTrainerController();
            isTrainerActive = false;
        }

        [plannerPage, progressPage, chartsPage, recipesPage, profilePage, trainerPage].forEach(p => p.classList.add('hidden'));
        [navPlannerBtn, navProgressBtn, navChartsBtn, navRecipesBtn, navProfileBtn].forEach(b => b.classList.remove('active'));

        if (state.currentView === 'planner' || state.currentView === 'log') {
          plannerPage.classList.remove('hidden');
          navPlannerBtn.classList.add('active');
          renderPlannerPage(state);
        } else if (state.currentView === 'progress') {
          progressPage.classList.remove('hidden');
          navProgressBtn.classList.add('active');
          renderBiometricsPage(state);
        } else if (state.currentView === 'charts') {
          chartsPage.classList.remove('hidden');
          navChartsBtn.classList.add('active');
          renderChartsPage(state);
        } else if (state.currentView === 'recipes') {
          recipesPage.classList.remove('hidden');
          navRecipesBtn.classList.add('active');
          renderRecipesPage(state);
        } else if (state.currentView === 'profile') {
          profilePage.classList.remove('hidden');
          navProfileBtn.classList.add('active');
          renderProfilePage(state);
        } else if (state.currentView === 'trainer') {
          trainerPage.classList.remove('hidden');
          log('Renderer', 'View is trainer, checking if trainer is active...');
          if (!isTrainerActive) {
            log('Renderer', 'Trainer is not active, initializing trainer controller...');
            initializeTrainerController();
            isTrainerActive = true;
          }
        }

        const urlInput = document.getElementById('config-url-input');
        if (document.activeElement !== urlInput) urlInput.value = state.configUrl;
      }
  - file: src/ui/trainerRenderer.js
    content: |
      import { getWorkoutState, resetWorkoutState } from '../core/trainer.js';
      import { TrainerComponent } from './components/TrainerComponent.js';
      import { log } from '../utils/logger.js';

      let trainerComponent = null;

      function handleWorkoutStateChange() {
          if (trainerComponent) {
              trainerComponent.render(getWorkoutState());
          }
      }

      export function initializeTrainerController() {
          log('TrainerRenderer', 'Initializing TrainerComponent...');
          const container = document.getElementById('trainer-page');
          if (container && !trainerComponent) {
              trainerComponent = new TrainerComponent(container);
              trainerComponent.mount();
              document.addEventListener('workoutStateChange', handleWorkoutStateChange);
              handleWorkoutStateChange();
              log('TrainerRenderer', 'TrainerComponent initialized.');
          }
      }

      export function destroyTrainerController() {
          log('TrainerRenderer', 'Destroying TrainerComponent...');
          if (trainerComponent) {
              trainerComponent.destroy();
              trainerComponent = null;
          }
          document.removeEventListener('workoutStateChange', handleWorkoutStateChange);
          resetWorkoutState();
          log('TrainerRenderer', 'TrainerComponent destroyed.');
      }
  - file: src/core/trainer.js
    content: |
      import { setView } from './state.js';
      import { log } from '../utils/logger.js';

      const initialWorkoutState = {
        exerciseQueue: [],
        currentExerciseIndex: -1,
        status: 'idle', // idle, running, paused, resting, finished
        prePauseStatus: '',
        currentSet: 0,
        currentRep: 0,
        executionQueue: [],
        currentPhaseIndex: -1,
        phaseTimeElapsed: 0,
        restTimeRemaining: 0,
      };

      let workoutState = { ...initialWorkoutState };
      let animationFrameId = null;
      let lastTickTimestamp = 0;

      function buildExecutionQueueForCurrentSet() {
        const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
        if (!currentExercise || currentExercise.type !== 'reps') return [];

        const queue = [];
        const reps = currentExercise.defaultReps;
        const tempo = currentExercise.defaultTempo;

        for (let i = 0; i < reps; i++) {
          if (tempo) {
            queue.push({ name: 'pre-up', rep: i + 1, duration: 700 });
            queue.push({ name: 'up', rep: i + 1, duration: tempo.up * 1000 });
            queue.push({ name: 'pre-hold', rep: i + 1, duration: 700 });
            queue.push({ name: 'hold', rep: i + 1, duration: tempo.hold * 1000 });
            queue.push({ name: 'pre-down', rep: i + 1, duration: 700 });
            queue.push({ name: 'down', rep: i + 1, duration: tempo.down * 1000 });
          }
        }
        return queue;
      }

      function advanceToNextSet() {
        workoutState.currentSet++;
        const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
        if (workoutState.currentSet > currentExercise.defaultSets) {
          advanceToNextExercise();
        } else {
          workoutState.status = 'running';
          workoutState.executionQueue = buildExecutionQueueForCurrentSet();
          workoutState.currentPhaseIndex = 0;
          workoutState.phaseTimeElapsed = 0;
          workoutState.currentRep = 1;
        }
      }

      function advanceToNextExercise() {
        workoutState.currentExerciseIndex++;
        if (workoutState.currentExerciseIndex >= workoutState.exerciseQueue.length) {
          endWorkout();
        } else {
          workoutState.status = 'idle';
          workoutState.currentSet = 1;
          workoutState.currentRep = 1;
          workoutState.executionQueue = [];
          workoutState.currentPhaseIndex = -1;
        }
      }

      function tick(timestamp) {
        if (lastTickTimestamp === 0) {
          lastTickTimestamp = timestamp;
        }
        const deltaTime = timestamp - lastTickTimestamp;
        lastTickTimestamp = timestamp;

        if (workoutState.status === 'running') {
          workoutState.phaseTimeElapsed += deltaTime;
          const currentPhase = workoutState.executionQueue[workoutState.currentPhaseIndex];

          if (workoutState.phaseTimeElapsed >= currentPhase.duration) {
            workoutState.currentPhaseIndex++;
            workoutState.phaseTimeElapsed = 0;
            const nextPhase = workoutState.executionQueue[workoutState.currentPhaseIndex];
            if (nextPhase) {
              workoutState.currentRep = nextPhase.rep;
            } else {
              const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
              workoutState.status = 'resting';
              workoutState.restTimeRemaining = currentExercise.defaultRest * 1000;
            }
          }
        } else if (workoutState.status === 'resting') {
          workoutState.restTimeRemaining -= deltaTime;
          if (workoutState.restTimeRemaining <= 0) {
            advanceToNextSet();
          }
        }
        
        document.dispatchEvent(new CustomEvent('workoutStateChange'));

        if (workoutState.status !== 'paused' && workoutState.status !== 'idle' && workoutState.status !== 'finished') {
          animationFrameId = requestAnimationFrame(tick);
        }
      }

      export function getWorkoutState() {
        return workoutState;
      }

      export function resetWorkoutState() {
        log('Trainer', 'Resetting workout state. Current state:', JSON.parse(JSON.stringify(workoutState)));
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        workoutState = { ...initialWorkoutState };
        log('Trainer', 'Workout state has been reset.', JSON.parse(JSON.stringify(workoutState)));
      }

      export function initializeWorkout(plannedExercises) {
        if (!plannedExercises || plannedExercises.length === 0) {
          return;
        }
        resetWorkoutState();

        workoutState = {
          ...initialWorkoutState,
          exerciseQueue: JSON.parse(JSON.stringify(plannedExercises)),
          currentExerciseIndex: 0,
          currentSet: 1,
          currentRep: 1,
        };
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function startWorkout() {
        log('Trainer', 'Attempting to start workout. Current status:', workoutState.status);
        if (workoutState.status === 'idle') {
          workoutState.status = 'running';
          workoutState.executionQueue = buildExecutionQueueForCurrentSet();
          workoutState.currentPhaseIndex = 0;
          workoutState.phaseTimeElapsed = 0;
          workoutState.currentRep = 1;
          lastTickTimestamp = 0;
          animationFrameId = requestAnimationFrame(tick);
          log('Trainer', 'Workout started. New status:', workoutState.status);
        }
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function pauseWorkout() {
        if (workoutState.status === 'running' || workoutState.status === 'resting') {
          workoutState.prePauseStatus = workoutState.status;
          workoutState.status = 'paused';
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function resumeWorkout() {
        if (workoutState.status === 'paused') {
          workoutState.status = workoutState.prePauseStatus;
          workoutState.prePauseStatus = '';
          lastTickTimestamp = 0;
          animationFrameId = requestAnimationFrame(tick);
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function endWorkout() {
        workoutState.status = 'finished';
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
        setView('planner');
      }
