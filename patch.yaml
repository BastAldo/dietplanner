commit_message: "fix(trainer): Prevent workout duplication by correctly removing event listeners"
rationale: |
  This patch addresses a critical bug where completed workouts were being saved multiple times, resulting in duplicate entries in the log view. The user correctly identified that state was persisting incorrectly between workout sessions.

  **Root Cause Analysis:**
  The `workoutFinished` event listener was being added with the `{ once: true }` option in `initializeWorkout`. However, the corresponding `removeEventListener` call in `resetWorkoutState` did not include this option, causing the removal to fail silently. This led to an accumulation of listeners every time a workout was started and then cancelled by navigating back. When a workout was finally completed, all accumulated listeners would fire simultaneously, each saving a copy of the workout summary.

  **Fix Implementation:**

  1.  **`src/core/trainer.js`**: The `removeEventListener` call within `resetWorkoutState` has been updated to include `{ once: true }`. This ensures that any lingering listener from a previously abandoned session is correctly removed before a new one is added.

  2.  **`src/ui/trainerRenderer.js`**: A call to `resetWorkoutState` has been added to the `destroyTrainerController` function. This provides an additional layer of robustness, ensuring that both the workout state and its associated listeners are properly cleaned up whenever the user navigates away from the trainer view, effectively preventing any state leakage.
patches:
  - file: src/core/trainer.js
    content: |
      import { setView, setLastWorkoutSummary, addWorkoutToHistory, getState as getGlobalState } from './state.js';
      import { log } from '../utils/logger.js';
      import { getWorkoutState as getState, resetState, updateState } from './trainer/state.js';
      import { startAnimation, stopAnimation } from './trainer/animation.js';
      import { buildExecutionQueueForCurrentSet } from './trainer/queueBuilder.js';
      import { advanceToNextSet } from './trainer/machine.js';
      import { calculateWorkoutCalories } from './calculations.js';
      import { speak, playStartCue } from '../utils/audioFeedback.js';
      import { UI_TEXT } from '../config/uiText.js';

      export { getState as getWorkoutState };

      export function resetWorkoutState() {
        log('Trainer', 'Resetting workout state.');
        document.removeEventListener('workoutFinished', handleWorkoutFinished, { once: true });
        stopAnimation();
        resetState();
      }

      function handleWorkoutFinished() {
        endWorkout();
      }

      export function initializeWorkout(plannedExercises, isoDate) {
        if (!plannedExercises || plannedExercises.length === 0) {
          return;
        }
        resetWorkoutState();
        const firstExercise = plannedExercises[0];
        const initialState = {
          workoutDate: isoDate,
          exerciseQueue: JSON.parse(JSON.stringify(plannedExercises)),
          currentExerciseIndex: 0,
          currentSet: 1,
          currentRep: 1,
          executionMode: firstExercise.execution_mode || 'tempo_guided',
          startTime: Date.now(),
          phaseStartTime: 0,
          restStartTime: 0,
          setsData: []
        };
        updateState(initialState);
        document.addEventListener('workoutFinished', handleWorkoutFinished, { once: true });
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function completeSet() {
        const state = getState();
        const currentExercise = state.exerciseQueue[state.currentExerciseIndex];
        const setData = {
            exerciseId: currentExercise.instanceId,
            set: state.currentSet,
            duration: Date.now() - state.phaseStartTime,
            rest: currentExercise.defaultRest,
            weight: currentExercise.defaultWeight || 0
        };

        if (state.executionMode === 'manual_reps') {
            setData.reps = state.manualRepCount;
        } else if (state.executionMode === 'tempo_guided') {
            setData.reps = currentExercise.defaultReps;
        }

        const newSetsData = [...state.setsData, setData];
        updateState({
            setsData: newSetsData,
            status: 'resting',
            restStartTime: Date.now(),
            restTimeRemaining: currentExercise.defaultRest * 1000
        });
      }

      export function startWorkout() {
        const state = getState();
        log('Interactions', 'Start workout button clicked from calendar', { date: state.workoutDate });
        if (state.status !== 'idle') return;

        let startState = { status: 'running', phaseStartTime: Date.now() };

        if (state.isAudioEnabled) {
          playStartCue();
          const firstExerciseName = state.exerciseQueue[0].name;
          speak(`${UI_TEXT.VOICE_GUIDE_NOW_STARTING} ${firstExerciseName}`);
        }

        if (state.executionMode === 'tempo_guided') {
            startState.executionQueue = buildExecutionQueueForCurrentSet();
            startState.currentPhaseIndex = 0;
            startState.phaseTimeElapsed = 0;
            startState.currentRep = 1;
        } else if (state.executionMode === 'static_hold') {
            const currentExercise = state.exerciseQueue[state.currentExerciseIndex];
            startState.setTimeRemaining = currentExercise.defaultDuration * 1000;
        } else if (state.executionMode === 'manual_reps') {
            startState.manualRepCount = 0;
        }

        updateState(startState);
        startAnimation();
        log('Trainer', 'Workout started. New state:', getState());
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function pauseWorkout() {
        const state = getState();
        if (state.status === 'running' || state.status === 'resting') {
          updateState({
            prePauseStatus: state.status,
            status: 'paused',
          });
          stopAnimation();
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function resumeWorkout() {
        const state = getState();
        if (state.status === 'paused') {
          const status = state.prePauseStatus;
          const newState = { status, prePauseStatus: '' };
          if (status === 'running') newState.phaseStartTime = Date.now() - state.phaseTimeElapsed;
          if (status === 'resting') newState.restStartTime = Date.now() - (state.exerciseQueue[state.currentExerciseIndex].defaultRest * 1000 - state.restTimeRemaining);

          updateState(newState);
          startAnimation();
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function incrementManualRep() {
          const state = getState();
          if (state.status === 'running' && state.executionMode === 'manual_reps') {
              const newRepCount = state.manualRepCount + 1;
              updateState({ manualRepCount: newRepCount });

              const currentExercise = state.exerciseQueue[state.currentExerciseIndex];
              const targetReps = currentExercise.defaultReps;

              if (targetReps && newRepCount >= targetReps) {
                  completeSet();
                  startAnimation();
              }
              document.dispatchEvent(new CustomEvent('workoutStateChange'));
          }
      }

      function createWorkoutSummary(finalState) {
          const totalTime = Date.now() - finalState.startTime;
          let totalTonnage = 0;

          const exercisesWithDetails = finalState.exerciseQueue.map(exercise => {
              const setsForThisExercise = finalState.setsData.filter(d => d.exerciseId === exercise.instanceId);
              const setsCompleted = setsForThisExercise.length;
              const totalExerciseTime = setsForThisExercise.reduce((acc, set) => acc + (set.duration || 0), 0);
              const exerciseTonnage = setsForThisExercise.reduce((acc, set) => acc + ((set.reps || 0) * (set.weight || 0)), 0);
              totalTonnage += exerciseTonnage;

              return {
                  ...exercise,
                  setsCompleted: setsCompleted,
                  setsData: setsForThisExercise,
                  totalTime: totalExerciseTime,
                  tonnage: exerciseTonnage
              };
          });

          const totalSets = exercisesWithDetails.reduce((acc, ex) => acc + ex.setsCompleted, 0);
          const totalExerciseTime = exercisesWithDetails.reduce((acc, ex) => acc + ex.totalTime, 0);
          const totalRestTime = finalState.setsData.reduce((acc, set) => acc + (set.rest || 0) * 1000, 0);

          const summary = {
              date: finalState.workoutDate,
              totalTime,
              totalSets,
              totalExerciseTime,
              totalRestTime,
              totalTonnage,
              exercises: exercisesWithDetails,
              startTime: finalState.startTime,
              totalCaloriesBurned: 0
          };

          const globalState = getGlobalState();
          const latestWeight = globalState.biometricData.length > 0 ? globalState.biometricData[0].weight : null;
          if (latestWeight) {
            summary.totalCaloriesBurned = calculateWorkoutCalories(summary, latestWeight);
          }

          return summary;
      }

      export function endWorkout() {
        const finalState = getState();
        if (finalState.startTime === 0 || finalState.status === 'finished') {
            log('Trainer', 'Workout ended prematurely or already finished, not saving summary.');
            if (finalState.status !== 'finished') setView('planner');
            return;
        }
        const summary = createWorkoutSummary(finalState);
        setLastWorkoutSummary(summary);
        addWorkoutToHistory(summary);

        updateState({ status: 'finished' });
        stopAnimation();
        setView('debriefing');
      }
  - file: src/ui/trainerRenderer.js
    content: |
      import { getWorkoutState, resetWorkoutState } from '../core/trainer.js';
      import { TrainerComponent } from './components/TrainerComponent.js';
      import { log } from '../utils/logger.js';

      let trainerComponent = null;

      function handleWorkoutStateChange() {
          if (trainerComponent) {
              trainerComponent.render(getWorkoutState());
          }
      }

      export function initializeTrainerController() {
          log('TrainerRenderer', 'Initializing TrainerComponent...');
          const container = document.getElementById('trainer-page');
          if (container && !trainerComponent) {
              trainerComponent = new TrainerComponent(container);
              trainerComponent.mount();
              document.addEventListener('workoutStateChange', handleWorkoutStateChange);
              handleWorkoutStateChange();
              log('TrainerRenderer', 'TrainerComponent initialized.');
          }
      }

      export function destroyTrainerController() {
          log('TrainerRenderer', 'Destroying TrainerComponent...');
          if (trainerComponent) {
              trainerComponent.destroy();
              trainerComponent = null;
          }
          document.removeEventListener('workoutStateChange', handleWorkoutStateChange);
          resetWorkoutState(); // <-- Ensure state is reset when leaving the view
          log('TrainerRenderer', 'TrainerComponent destroyed.');
      }