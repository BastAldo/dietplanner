commit_message: "refactor(trainer): Migliora UI logging e sposta pulsante conferma"
rationale: |
  Questo commit implementa i miglioramenti dell'interfaccia utente richiesti per la modalità "logging" del trainer, basati sul feedback dell'utente.

  1.  **Spostamento Pulsante Azione (`templates/trainer.html`, `src/ui/components/TrainerComponent.js`):**
      * Il pulsante "CONFERMA SET" (`#trainer-confirm-set-btn`) è stato spostato dal contenitore dei dati (`#trainer-logging-controls`) al contenitore delle azioni principali (`#trainer-main-controls`).
      * Questo crea un'esperienza utente più coerente, poiché tutte le azioni principali (Avvia, Pausa, Riprendi, Conferma) ora occupano lo stesso slot nella parte inferiore dello schermo.
      * `TrainerComponent.js` è stato aggiornato per riflettere questo spostamento e gestisce correttamente la visibilità dei pulsanti (mostrando "CONFERMA SET" solo durante le fasi di `logging`).

  2.  **Miglioramento Layout Input (`styles/trainer.css`):**
      * I box di input per "Peso" e "Reps" all'interno dell'anello sono stati rimpiccioliti (`max-width: 100px`) e centrati, come richiesto, poiché non necessitano di essere a larghezza piena.
      * Il contenitore `#trainer-logging-controls` (ora solo input e checkbox) è stato riposizionato verticalmente per adattarsi meglio al centro dell'anello.

  3.  **Stile Checkbox Personalizzato (`styles/trainer.css`):**
      * La checkbox nativa "A Cedimento" è stata sostituita con uno slider/toggle personalizzato via CSS.
      * La nuova checkbox aderisce alla palette di colori (`--primary-color`, `--card-color`) definita nella `docs/03_STYLE_GUIDE.md`, eliminando l'incoerenza stilistica.
