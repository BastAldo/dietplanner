commit_message: "fix(trainer): Implement event-driven set completion and robust rendering"
rationale: |
  This patch addresses a critical `TypeError` and underlying architectural flaws in the Trainer module's execution engine, as per the approved deep analysis. The fix transitions the engine to a more robust, event-driven model for handling the lifecycle of a set.

  **Problem Resolution:**

  1.  **Root Cause of TypeError:** The crash was caused by the final `speech` command in the execution queue lacking a `context` object, which the `TrainerComponent`'s render function tried to access. While a simple guard could fix the crash, it wouldn't address the core architectural issues.

  2.  **Architectural Flaw - Incorrect Data Collection Timing:** The previous implementation collected set data *after* the rest period, which is logically incorrect. Set metrics (like duration) must be captured the instant the work phase concludes.

  3.  **Architectural Flaw - Ambiguous Flow Control:** The queue lacked an explicit event to signify the end of a set's work phase, forcing the animation engine to infer it, which led to timing errors.

  **Implemented Solution:**

  1.  **New `set_completed` Event (`trainerFlows.js`):** A new, explicit event type, `set_completed`, has been introduced. It replaces the ambiguous final `audio` cue in the `TEMPO_GUIDED_FLOW`, providing a clear, declarative signal that the set's work is finished.

  2.  **Corrected Queue Logic (`queueBuilder.js`):** The queue builder now constructs the flow in the correct logical order: **Work Phases -> `set_completed` -> `rest`**. This ensures that data collection happens before the rest period begins. The `TypeError` is also definitively fixed by adding a valid `context` to the final "Workout Completed" speech command.

  3.  **Event-Driven Animation (`animation.js`):** The animation engine's `tick` function now specifically handles the `set_completed` event. Upon encountering it, it immediately calls `collectSetData()` from `trainer.js` (ensuring correct timing) and then advances the queue to the next phase (which will be the `rest` phase).

  4.  **Robust Rendering (`TrainerComponent.js`):** As a defensive measure, a guard has been added to the `render` function. It now checks for the existence of `currentPhase` and `currentPhase.context` before attempting to access their properties, making the UI component more resilient to unexpected queue states.

  This comprehensive fix not only resolves the immediate bug but also significantly improves the architectural integrity of the Trainer engine, making it more reliable, predictable, and easier to maintain.
