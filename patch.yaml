commit_message: "feat(importer): Aggiunge il calcolo del BMR e l'importazione del profilo utente da CSV"
rationale: |
  Questo commit potenzia significativamente la funzionalità di importazione da CSV, risolvendo un problema e aggiungendo una nuova feature intelligente.

  1. **Aggiunto Calcolo del Metabolismo Basale (BMR)**: È stato risolto un bug per cui il valore del Metabolismo Basale non veniva calcolato e visualizzato per i record importati da CSV. La logica di interazione in `progressInteractions.js` è stata aggiornata per orchestrare questo calcolo: dopo il parsing del file, invoca la funzione `calculateBMR` per ogni nuova misurazione, arricchendo i dati con il valore del BMR prima di salvarli. Questo assicura che i dati importati siano completi e coerenti con quelli inseriti manualmente.

  2. **Importazione Dati Profilo Utente**: Il parser in `importer.js` è stato migliorato per leggere anche i dati anagrafici dell'utente (sesso, data di nascita, statura) presenti nell'intestazione del file CSV. Se il profilo utente dell'applicazione è vuoto al momento dell'importazione, il sistema ora chiede all'utente se desidera popolarlo automaticamente con i dati trovati nel file, velocizzando la configurazione iniziale dell'app.
