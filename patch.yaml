commit_message: "feat: Initialise project structure and implement MVP core"
rationale: |
  This commit establishes the complete file structure and core functionality for the "Protocollo Dinamico" application, as defined in the approved architectural documents.

  Key implementations include:
  - **HTML Structure:** The main layout for the calendar and meal library.
  - **CSS Foundation:** Base styles, layout, and the defined color palette using CSS variables.
  - **Modular JavaScript:** A clean, separated file structure for API services, state management, core logic, and UI rendering.
  - **Data Flow:** Initial logic for fetching and parsing the master meal list from a CSV file.
  - **State Management:** A simple, centralized state object with localStorage persistence.
  - **UI Rendering:** Functions to dynamically build the calendar and meal library from the application state.
  - **Core Interaction Logic:** Placeholders and structure for handling drag-and-drop events and button clicks.

  This foundational setup allows for the sequential implementation of detailed interaction logic and validation rules in subsequent steps.
