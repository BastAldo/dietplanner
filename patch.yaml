commit_message: "refactor(ui): Sostituisce tutte le icone dell'app con SVG da Font Awesome"
rationale: |
  Questa patch esegue una migrazione completa di tutte le icone dell'applicazione, sostituendo gli SVG personalizzati con le loro controparti SVG da Font Awesome.

  Questa decisione strategica, presa in accordo con l'utente, risolve i problemi di inconsistenza e bassa qualità del design riscontrati in precedenza. L'adozione di un'unica libreria professionale come fonte per tutti gli asset grafici garantisce:
  1.  **Coerenza Visiva**: Tutte le icone ora condividono lo stesso stile, peso visivo e linguaggio di design.
  2.  **Alta Qualità**: Vengono utilizzate icone professionali, eliminando ogni ambiguità o imperfezione.
  3.  **Mantenibilità**: La gestione delle icone è ora standardizzata. Tutte le icone sono SVG a traccia singola, basate su `fill`, che si integrano perfettamente con il CSS esistente senza eccezioni.
  4.  **Nessuna Dipendenza Esterna**: L'approccio mantiene l'integrità della PWA, poiché gli SVG sono inclusi direttamente nel codice, garantendo il funzionamento offline.

  Sono stati aggiornati i file HTML e le funzioni JavaScript che generano markup dinamico per riflettere la nuova libreria di icone.
