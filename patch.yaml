commit_message: "fix: Risolve condivisione backup su mobile cambiando tipo file in .txt"
rationale: |
  Questa patch risolve in modo definitivo il problema `NotAllowedError: Permission denied` che impediva il funzionamento della Web Share API su dispositivi mobili.

  1.  **Causa del Problema**: L'analisi approfondita ha rivelato che l'API non supporta la condivisione di file con il tipo MIME `application/json`. I browser applicano una policy di sicurezza restrittiva sui tipi di file condivisibili, e il JSON non è tra questi. Questo causava il rifiuto immediato della richiesta da parte del browser.

  2.  **Soluzione Implementata**: Per conformarsi a questa policy, il formato del file di backup è stato modificato. In `src/ui/interactions.js`, il file viene ora generato come `text/plain` con estensione `.txt`. Questo tipo di file è universalmente supportato dall'API Web Share, abilitando la funzionalità di condivisione nativa come previsto.

  3.  **Compatibilità per il Ripristino**: La funzione di ripristino (`handleRestoreBackup`) è stata aggiornata per accettare sia i vecchi file `.json` che i nuovi `.txt`, garantendo la retrocompatibilità per gli utenti che hanno backup precedenti.

  4.  **Documentazione**: Le User Stories `US-24` e `US-25` in `docs/01_FUNCTIONALITY.md` sono state aggiornate per riflettere il nuovo formato del file di backup.
patches:
  - file: docs/01_FUNCTIONALITY.md
    content: |
      # Funzionalità: HealtyPro (ex NutriPlan)

      ## 1. Visione Generale
      Una web app frontend-only, installabile (PWA), per creare e gestire piani alimentari flessibili per l'intera giornata (colazione, spuntini, pranzo e cena) con conteggio calorico e regole di validazione personalizzate.

      L'interfaccia utente è stata completamente rinnovata per adottare un design system unificato (ispirato a MTP), con un tema scuro, componenti moderni e un flusso di interazione migliorato per la pianificazione giornaliera.

      ## 2. User Stories
      * **US-1 (Caricamento Dati):** L'utente può caricare una configurazione da un file JSON remoto.
      * **US-2 (Visualizzazione Calendario):** L'utente vede un calendario settimanale "day-centric". Ogni giorno è una card che riassume le informazioni principali (es. calorie totali).
      * **US-3 (Pianificazione via Modale):** L'utente clicca su una card del giorno per aprire un modale di editing centralizzato, dove può gestire tutti i pasti di quella giornata.
      * **US-4 (Validazione Dinamica):** L'utente vuole che l'app applichi le regole definite nel JSON (es. blocco giornaliero per un certo tag).
      * **US-11 (Cancellazione Pasti):** L'utente può rimuovere un pasto inserito.
      * **US-15 (Layout Mobile Leggibile):** Su mobile, il calendario è una lista di card giornaliere.
      * **US-16 (Conteggio Calorie Flessibile):** L'utente vede il totale calorico per ogni giorno direttamente sulla card del calendario.
      * **US-17 (Installazione):** Come utente, voglio poter installare l'app sulla mia home screen o desktop per un accesso rapido.
      * **US-18 (Uso Offline):** Come utente, voglio poter aprire e usare l'app anche senza connessione internet, dopo averla visitata la prima volta.
      * **US-19 (Chiusura Modale Esterna):** Come utente, voglio poter chiudere qualsiasi modale cliccando sull'area scura esterna ad esso, per un'interazione più rapida.
      * **US-20 (Registro Pasti Settimanale Dettagliato):** Come utente, voglio poter passare a una vista registro per vedere l'elenco di tutti i pasti pianificati, con il dettaglio calorico per singolo pasto e il totale giornaliero.
      * **US-21 (Copia Settimana):** Come utente, voglio poter copiare il piano alimentare della settimana precedente a quella attuale con un solo click per velocizzare la pianificazione.
      * **US-22 (Visualizzazione Ricetta):** Come utente, voglio poter visualizzare la ricetta di un pasto, se disponibile, cliccando su un'icona presente sia nell'editor del giorno che nella vista registro.
      * **US-23 (Condivisione Configurazione Sicura):** Come utente, voglio poter generare un link per condividere il mio `config.json`. All'apertura del link, se la configurazione è diversa da quella in uso, l'app mi chiederà conferma prima di caricarla per evitare perdite di dati.
      * **US-24 (Backup Dati Locale Flessibile):** Come utente, voglio poter salvare un backup dei miei dati come file di testo (`.txt`) utilizzando, dove supportato, la funzione di condivisione nativa del mio dispositivo.
      * **US-25 (Ripristino da Backup Locale):** Come utente, voglio poter caricare un file di backup (`.txt` o `.json`) precedentemente salvato per ripristinare il mio `configUrl` e il mio `weeklyPlan`, con una richiesta di conferma prima di sovrascrivere i dati esistenti.
  - file: src/ui/interactions.js
    content: |
      import { resetCurrentWeek, setPlannerConfig, setConfigUrl, navigateWeek, setView, copyPreviousWeek, getState, setAppState } from '../core/state.js';
      import { fetchAndParseConfig } from '../api/configService.js';
      import { showNotification } from './notifications.js';
      import { openDayEditorModal, showConfirmModal, showRecipeModal } from './renderer.js';
      import { UI_TEXT } from '../utils/constants.js';

      async function handleLoadConfig() {
        const url = document.getElementById('config-url-input').value.trim();
        if (!url) {
          showNotification(UI_TEXT.CONFIG_URL_EMPTY_ERROR, 'error');
          return;
        }
        setConfigUrl(url);
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config);
          showNotification(UI_TEXT.CONFIG_LOAD_SUCCESS, 'success');
        } catch (error) {
          showNotification(error.message, 'error');
        }
      }

      function handleCalendarClick(e) {
        const dayCell = e.target.closest('.day-cell');
        if (dayCell) {
            openDayEditorModal(dayCell.dataset.date);
        }
      }

      function handleLogViewClick(e) {
        const btnRecipe = e.target.closest('.btn-view-recipe');
        if (btnRecipe) {
          const state = getState();
          const meal = state.masterMealList.find(m => m.id === btnRecipe.dataset.mealId);
          if (meal) {
            showRecipeModal(meal);
          }
        }
      }

      function handleShareConfig() {
        const state = getState();
        if (!state.configUrl) {
          showNotification(UI_TEXT.SHARE_NO_URL_INFO, 'info');
          return;
        }
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?configUrl=${encodeURIComponent(state.configUrl)}`;
        
        navigator.clipboard.writeText(shareUrl).then(() => {
          showNotification(UI_TEXT.SHARE_SUCCESS, 'success');
        }).catch(() => {
          showNotification(UI_TEXT.SHARE_ERROR, 'error');
        });
      }

      function triggerDownload(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification(UI_TEXT.BACKUP_SUCCESS, 'success');
      }

      async function handleSaveBackup() {
        const state = getState();
        const backupData = {
          configUrl: state.configUrl,
          weeklyPlan: state.weeklyPlan
        };
        const fileName = 'healtypro_backup.txt';
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'text/plain' });
        const file = new File([blob], fileName, { type: 'text/plain' });
        
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              title: UI_TEXT.BACKUP_SHARE_TITLE,
              files: [file],
            });
            // La notifica di successo viene mostrata solo se la condivisione non viene abortita
          } catch (error) {
            if (error.name !== 'AbortError') {
              console.warn('Web Share API failed, falling back to download:', error);
              triggerDownload(blob, fileName);
            }
          }
        } else {
          // Fallback per browser desktop o non compatibili
          triggerDownload(blob, fileName);
        }
      }

      function handleRestoreBackup() {
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.json,.txt,application/json,text/plain';
          fileInput.onchange = e => {
              const file = e.target.files[0];
              if (!file) return;

              const reader = new FileReader();
              reader.onload = readerEvent => {
                  try {
                      const content = readerEvent.target.result;
                      const backupData = JSON.parse(content);

                      if (typeof backupData.configUrl === 'string' && typeof backupData.weeklyPlan === 'object') {
                          showConfirmModal(
                              UI_TEXT.RESTORE_CONFIRM_TITLE,
                              UI_TEXT.RESTORE_CONFIRM_MSG,
                              () => {
                                  setAppState(backupData);
                                  showNotification(UI_TEXT.RESTORE_SUCCESS, 'success');
                              },
                              'danger'
                          );
                      } else {
                          throw new Error('Invalid structure');
                      }
                  } catch (err) {
                      showNotification(UI_TEXT.RESTORE_INVALID_FILE, 'error');
                  }
              };
              reader.readAsText(file);
          };
          fileInput.click();
      }

      function handleCopyWeek() {
        showConfirmModal(
          UI_TEXT.COPY_WEEK_CONFIRM_TITLE,
          UI_TEXT.COPY_WEEK_CONFIRM_MSG,
          () => {
            copyPreviousWeek();
            showNotification(UI_TEXT.COPY_WEEK_SUCCESS, 'success');
          },
          'primary'
        );
      }

      function handleResetWeek() {
        showConfirmModal(
          UI_TEXT.RESET_WEEK_CONFIRM_TITLE,
          UI_TEXT.RESET_WEEK_CONFIRM_MSG,
          () => {
            resetCurrentWeek();
            showNotification(UI_TEXT.RESET_WEEK_SUCCESS, 'info');
          },
          'danger'
        );
      }

      export function initializeEventListeners() {
        document.getElementById('reset-btn').addEventListener('click', handleResetWeek);
        document.getElementById('backup-btn').addEventListener('click', handleSaveBackup);
        document.getElementById('restore-btn').addEventListener('click', handleRestoreBackup);
        document.getElementById('load-config-btn').addEventListener('click', handleLoadConfig);
        document.getElementById('info-icon').addEventListener('click', () => document.getElementById('info-modal').classList.remove('modal-hidden'));
        
        document.querySelectorAll('.modal-close-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const modalId = e.target.dataset.target;
            if (modalId) {
              document.getElementById(modalId).classList.add('modal-hidden');
            }
          });
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
          overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
              overlay.classList.add('modal-hidden');
            }
          });
        });

        document.getElementById('calendar-grid').addEventListener('click', handleCalendarClick);
        document.getElementById('log-view').addEventListener('click', handleLogViewClick);
        document.getElementById('prev-week-btn').addEventListener('click', () => navigateWeek(-1));
        document.getElementById('next-week-btn').addEventListener('click', () => navigateWeek(1));

        document.getElementById('view-calendar-btn').addEventListener('click', () => setView('calendar'));
        document.getElementById('view-log-btn').addEventListener('click', () => setView('log'));
        document.getElementById('copy-week-btn').addEventListener('click', handleCopyWeek);
        document.getElementById('share-config-btn').addEventListener('click', handleShareConfig);

        document.getElementById('global-alert-close').addEventListener('click', () => {
            document.getElementById('global-alert').classList.add('hidden');
        });
      }
commands:
  - "echo 'Funzionalità di condivisione nativa ripristinata e resa pienamente funzionante.'"