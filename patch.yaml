commit_message: "feat(core): Implementa il calcolo dei macronutrienti (Parte 1)"
rationale: |
  Questo è il primo di due commit per implementare la funzionalità di tracciamento dei macronutrienti, come definito nelle specifiche (US-38, US-39).

  Questa patch si concentra sull'aggiornamento del modello dati, del motore di calcolo e dell'interfaccia di input:

  1.  `src/config/forms.js`: L'array `INGREDIENT_FIELDS` è stato esteso per includere `prot_per_100g`, `carb_per_100g`, e `fat_per_100g`. Questo è conforme alla struttura dati definita in `docs/02_ARCHITECTURE.md` e abilita la US-38. L'editor degli ingredienti (`ingredientEditorModal.js`) si aggiorna dinamicamente da questa configurazione.

  2.  `src/core/calorieCalculator.js`: Il modulo è stato refattorizzato per gestire i macronutrienti.
      * `calculateIngredientCaloriesRange` è stato rinominato in `calculateIngredientMacrosRange` e ora restituisce un oggetto completo (`min`, `max`, `prot`, `carb`, `fat`).
      * `processMealsWithCalories` è stato rinominato in `processMealsWithMacros`. Questa funzione ora aggrega tutti i macronutrienti (min/max) e li aggiunge all'oggetto pasto.

  3.  `src/core/state.js`: Aggiornato per importare e utilizzare la nuova funzione `processMealsWithMacros` in `setPlannerConfig`, `addMeal` e `updateMeal`. Questo assicura che qualsiasi pasto caricato o modificato nello stato dell'applicazione ora contenga i dati macro completi.

  4.  `src/ui/modals/mealEditorModal.js`: Il modal di modifica dei pasti è stato aggiornato per utilizzare il nuovo `processMealsWithMacros` nella sua funzione `updateTotals`. Ora visualizza i totali P/C/F in tempo reale durante la creazione o la modifica di un pasto.

  5.  `styles/modals.css`: Aggiunti stili per i nuovi totali macro (`.macro-p`, `.macro-c`, `.macro-f`) nel modal di modifica pasti, utilizzando la palette colori definita in `docs/03_STYLE_GUIDE.md` per un feedback visivo immediato.
