commit_message: "fix(charts): Corregge la sovrapposizione dei controlli nell'header del grafico"
rationale: |
  Questo commit risolve un bug di layout nella pagina dei grafici, dove il pulsante "Espandi" si sovrapponeva al selettore del tipo di grafico (Barre/Linee).

  Il problema era causato dall'uso del posizionamento assoluto per entrambi gli elementi, che creava un conflitto.

  La soluzione adotta un approccio più moderno e robusto basato su Flexbox:
  1.  In `templates/charts.html`, i due controlli sono stati raggruppati in un `div` contenitore (`.chart-header-controls`).
  2.  In `styles/charts.css`, sono state rimosse le regole di posizionamento assoluto e il layout dell'header del grafico è stato reimplementato utilizzando Flexbox per allineare correttamente il titolo e il nuovo gruppo di controlli.

  Questo fix garantisce che i controlli siano sempre visualizzati correttamente uno accanto all'altro, senza sovrapposizioni, indipendentemente dalla dimensione dello schermo.
patches:
