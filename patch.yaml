commit_message: "fix(planner): Corregge bug calcolo grafico e ne migliora la UI"
rationale: |
  Questo commit implementa due richieste dell'utente relative al grafico settimanale sulla pagina "Planner":

  1.  **Correzione Bug Dati Mancanti:**
      * È stato identificato un bug in `src/ui/plannerRenderer.js` (`renderPlannerWeekChart`) dove i totali delle calorie del grafico non corrispondevano a quelli delle card (es. Lunedì mostrava Kcal sulla card ma 0 sul grafico).
      * La funzione `calculateDailyCalories` (usata dalle card) controllava correttamente `if (meal && typeof meal.calories_min === 'number')`, mentre `renderPlannerWeekChart` (usata dal grafico) no.
      * Questo portava `renderPlannerWeekChart` a calcolare 0 per i giorni che avevano pasti senza calorie (es. `calories_min: undefined`).
      * Il fix aggiunge il controllo `if (meal && typeof meal.calories_min === 'number')` anche a `renderPlannerWeekChart`, allineando la logica di calcolo e risolvendo il bug.

  2.  **Miglioramento UI/UX (Richiesta Utente):**
      * **Tipo di Grafico:** In `src/ui/plannerRenderer.js`, il tipo di grafico è stato cambiato da `type: 'bar'` a `type: 'line'` per una migliore leggibilità del range. I dataset sono stati aggiornati per mostrare una linea "Max" (piena, con riempimento) e una "Min" (tratteggiata).
      * **Posizione:** In `templates/planner.html`, il widget del grafico (`#planner-week-chart-widget`) è stato spostato dalla cima della pagina a sotto il contenitore principale (`section.view-container`), dando priorità al calendario e al log.
patches:
  - file: templates/planner.html
    content: |
      <div id="global-alert" class="global-alert hidden">
          <p id="global-alert-message"></p>
          <button id="global-alert-close" class="alert-close-btn"></button>
      </div>

      <div id="planner-page" class="page-view">
          <section id="today-widget" class="today-widget"></section>
          
          <section class="view-container">
              <header class="calendar-header">
                  <button id="prev-week-btn" class="btn btn-secondary">&lt;</button>
                  <h2 id="week-title"></h2>
                  <button id="next-week-btn" class="btn btn-secondary">&gt;</button>
              </header>
               <div class="planner-controls-wrapper">
                  <div class="planner-actions">
                    <button id="copy-week-btn" class="btn btn-secondary"></button>
                    <button id="reset-btn" class="btn btn-secondary"></button>
                  </div>
              </div>
              <div id="calendar-grid" class="calendar-grid"></div>
              <h3 id="log-view-title" class="section-title">Registro Dettagliato</h3>
              <div id="log-view" class="log-view"></div>
          </section>

          <section id="planner-week-chart-widget" class="chart-card">
              <div class="chart-header">
                  <h4 id="planner-week-chart-title"></h4>
              </div>
              <div class="chart-canvas-container" style="height: 250px;">
                <canvas id="planner-week-chart-canvas"></canvas>
              </div>
          </section>
      </div>
  - file: src/ui/plannerRenderer.js
    content: |
      import { MEAL_TYPES, WEEK_STARTS_ON_MONDAY, DAYS, WORKOUT_SLOT_ID, OPTIONAL_MEAL_TYPES } from '../utils/constants.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { formatIngredientsSummary } from '../utils/formatters.js';

      let plannerWeekChart = null;

      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function formatShortDate(date) {
        return date.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
      }

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function formatMealCalories(meal) {
        if (!meal || typeof meal.calories_min !== 'number') return '';
        const minCals = Number(meal.calories_min) || 0;
        const maxCals = Number(meal.calories_max) || minCals;
        if (minCals === 0 && maxCals === 0) return '';
        const kcalLabel = UI_TEXT.KCAL_LABEL || 'Kcal';
        if (minCals === maxCals) return `${minCals} ${kcalLabel}`;
        return `${minCals} - ${maxCals} ${kcalLabel}`;
      }

      function getActiveMealSlots(userProfile) {
        const activeMealSlots = [...MEAL_TYPES];
        Object.keys(OPTIONAL_MEAL_TYPES).forEach(key => {
          if (userProfile[key]) {
            activeMealSlots.push(OPTIONAL_MEAL_TYPES[key]);
          }
        });
        return activeMealSlots;
      }

      function calculateDailyCalories(isoDate, weeklyPlan, userProfile) {
        let min = 0, max = 0;
        const activeMealSlots = getActiveMealSlots(userProfile);
        
        activeMealSlots.forEach(type => {
          const meal = weeklyPlan[`${isoDate}-${type}`];
          if (meal && typeof meal.calories_min === 'number') {
            const minCals = Number(meal.calories_min) || 0;
            const maxCals = Number(meal.calories_max) || minCals;
            min += minCals;
            max += maxCals;
          }
        });
        if (min === 0 && max === 0) return '';
        return min === max ? `${UI_TEXT.KCAL_LABEL}: ${min}` : `${UI_TEXT.KCAL_LABEL}: ${min} - ${max}`;
      }

      function getRecipeButtonHTML(meal, state) {
        const fullMeal = state.masterMealList.find(m => m.id === meal.id);
        if (state.recipeBaseUrl && fullMeal && fullMeal.recipeId) {
          return `<button class="btn-view-recipe" data-meal-id="${fullMeal.id}" title="${UI_TEXT.RECIPE_BUTTON_TITLE}">
                    ${renderIcon('RECIPE', { width: 20, height: 20 })}
                  </button>`;
        }
        return '';
      }

      function getSetDetails(setData) {
          let details = [];
          if (setData.reps) details.push(`${setData.reps} reps`);
          if (setData.weight) details.push(`${setData.weight} kg`);
          if (setData.duration) details.push(`${formatDuration(setData.duration)}`);
          return details.join(' / ');
      }

      function formatDuration(ms) {
          if (typeof ms !== 'number' || ms < 0) return '00:00';
          const totalSeconds = Math.floor(ms / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }

      function renderPlannerWeekChart(state, weekStart) {
        if (plannerWeekChart) {
          plannerWeekChart.destroy();
        }

        const plannerLabels = [];
        const plannerDataMin = [];
        const plannerDataMax = [];
        const activeMealSlots = getActiveMealSlots(state.userProfile);

        for (let i=0; i<7; i++) {
          const date = new Date(weekStart);
          date.setDate(date.getDate() + i);
          plannerLabels.push(date.toLocaleDateString('it-IT', { weekday: 'short' }));
          const isoDate = toISODateString(date);
          let min = 0, max = 0;
          
          activeMealSlots.forEach(type => {
            const meal = state.weeklyPlan[`${isoDate}-${type}`];
            // --- BUG FIX ---
            // Aggiunto controllo 'typeof number' per allineare la logica a calculateDailyCalories
            // e prevenire che pasti senza calorie (undefined) vengano contati come 0.
            if (meal && typeof meal.calories_min === 'number') {
              const minCals = Number(meal.calories_min) || 0;
              const maxCals = Number(meal.calories_max) || minCals;
              min += minCals;
              max += maxCals;
            }
            // --- FINE BUG FIX ---
          });
          plannerDataMin.push(min);
          plannerDataMax.push(max);
        }

        const plannerDatasets = [
          {
            label: UI_TEXT.CHART_KCAL_MAX_LABEL || 'Calorie Max',
            data: plannerDataMax,
            borderColor: 'rgba(149, 117, 205, 1)', // primary-color
            backgroundColor: 'rgba(149, 117, 205, 0.2)',
            fill: 'origin',
            tension: 0.1
          },
          {
            label: UI_TEXT.CHART_KCAL_MIN_LABEL || 'Calorie Min',
            data: plannerDataMin,
            borderColor: 'rgba(255, 255, 255, 0.5)',
            borderDash: [5, 5],
            fill: false,
            tension: 0.1
          }
        ];

        const ctx = document.getElementById('planner-week-chart-canvas').getContext('2d');
        plannerWeekChart = new Chart(ctx, {
          type: 'line', // Modificato da 'bar' a 'line'
          data: { labels: plannerLabels, datasets: plannerDatasets },
          options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: true,
                position: 'top',
                labels: {
                  color: '#aaa'
                }
              }
            },
            scales: {
              y: {
                ticks: { color: '#aaa' },
                grid: { color: 'rgba(255, 255, 255, 0.1)' }
              },
              x: {
                ticks: { color: '#aaa' },
                grid: { display: false }
              }
            }
          }
        });
      }

      function renderTodayWidget(state, todayISO) {
        const widget = document.getElementById('today-widget');
        const { userProfile, weeklyPlan, weeklyWorkouts } = state;
        const dailyCalories = calculateDailyCalories(todayISO, weeklyPlan, userProfile);
        
        const activeMealSlots = getActiveMealSlots(userProfile);
        const dayMeals = activeMealSlots.map(type => ({ type, meal: weeklyPlan[`${todayISO}-${type}`] })).filter(item => item.meal);
        const workoutList = weeklyWorkouts[`${todayISO}-${WORKOUT_SLOT_ID}`];

        let mealsHtml = dayMeals.map(item => `
          <div class="today-meal-item">
            <span><strong>${item.type}:</strong> ${item.meal.nomePasto}</span>
            <span>${formatMealCalories(item.meal)}</span>
          </div>
        `).join('');

        let workoutHtml = '';
        if (workoutList && workoutList.length > 0) {
          workoutHtml = `<button class="btn btn-primary btn-start-workout-day" data-date="${todayISO}">${UI_TEXT.START_WORKOUT_BTN}</button>`;
        } else {
          workoutHtml = `<p class="placeholder-text">Nessun allenamento pianificato per oggi.</p>`;
        }

        widget.innerHTML = `
          <div class="today-widget-header">
            <h3>Oggi, ${formatFullDate(todayISO)}</h3>
            <span>${dailyCalories}</span>
          </div>
          <div class="today-widget-body">
            ${mealsHtml.length > 0 ? mealsHtml : '<p class="placeholder-text">Nessun pasto pianificato per oggi.</p>'}
            ${workoutHtml}
          </div>
        `;
      }

      function renderCalendarView(state, weekStart) {
        const calendarGrid = document.getElementById('calendar-grid');
        const todayISO = toISODateString(new Date());
        const { userProfile, weeklyPlan, weeklyWorkouts } = state;
        
        calendarGrid.innerHTML = '';
        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const dayName = DAYS[i];
          const isoDate = toISODateString(dayDate);
          const dailyCalories = calculateDailyCalories(isoDate, weeklyPlan, userProfile);
          const workoutList = weeklyWorkouts[`${isoDate}-${WORKOUT_SLOT_ID}`];

          let summaryHTML = `<div class="daily-calories">${dailyCalories}</div>`;
          let workoutButtonHTML = '';

          if (workoutList && workoutList.length > 0) {
              const exerciseCount = workoutList.length;
              const plural = exerciseCount > 1 ? UI_TEXT.PLANNER_EXERCISES_MULTI_LABEL : UI_TEXT.PLANNER_EXERCISES_SINGLE_LABEL;
              summaryHTML += `<div class="daily-summary-item">${renderIcon('DUMBBELL', {width: 16, height: 16})} ${exerciseCount} ${plural}</div>`;
              workoutButtonHTML = `<button class="btn btn-primary btn-start-workout-day" data-date="${isoDate}">${UI_TEXT.START_WORKOUT_BTN}</button>`;
          }

          const dayCell = document.createElement('div');
          dayCell.className = 'day-cell';
          if (isoDate === todayISO) {
            dayCell.classList.add('is-today');
          }
          dayCell.dataset.date = isoDate;
          dayCell.innerHTML = `
            <div class="day-cell__header"><span>${dayName}</span><span>${dayDate.getDate()}</span></div>
            <div class="day-cell__body">${summaryHTML}${workoutButtonHTML}</div>`;
          calendarGrid.appendChild(dayCell);
        }
      }

      function renderLogView(state, weekStart) {
        const logView = document.getElementById('log-view');
        const todayISO = toISODateString(new Date());
        const { userProfile, weeklyPlan, workoutHistory, masterMealList, recipeBaseUrl } = state;
        
        let logViewHTML = '';
        let hasContent = false;

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          
          const activeMealSlots = getActiveMealSlots(userProfile);
          const dayMeals = activeMealSlots.map(type => ({ type, meal: weeklyPlan[`${isoDate}-${type}`] })).filter(item => item.meal);
          const completedWorkouts = workoutHistory[isoDate] || [];

          if (dayMeals.length > 0 || completedWorkouts.length > 0) {
            hasContent = true;
            let dayLogHTML = `<div class="log-day ${isoDate === todayISO ? 'is-today' : ''}">`;
            dayLogHTML += `
              <div class="log-day-header">
                <h3>${formatFullDate(isoDate)}</h3>
                <span class="log-day__total-calories">${calculateDailyCalories(isoDate, weeklyPlan, userProfile)}</span>
              </div>
              <div class="log-day-body">
            `;

            if (dayMeals.length > 0) {
              dayLogHTML += dayMeals.map(item => `
                <div class="log-item">
                  <div class="log-item__name">
                    <div>
                      <strong>${item.type}:</strong>
                      <span>${item.meal.nomePasto}</span>
                      <div class="log-item-details">${formatIngredientsSummary(item.meal)}</div>
                    </div>
                    ${getRecipeButtonHTML(item.meal, state)}
                  </div>
                  <span class="log-item__calories">${formatMealCalories(item.meal)}</span>
                </div>`).join('');
            }

            if (completedWorkouts.length > 0) {
                completedWorkouts.forEach(workout => {
                    if (workout.type === 'structured') {
                        dayLogHTML += `<div class="log-workout-summary">
                            <div class="log-workout-header">
                                <h4>${UI_TEXT.LOG_VIEW_WORKOUT_TITLE}</h4>
                                <div class="log-workout-header-actions">
                                    <button class="btn-delete-workout" data-date="${workout.date}" data-starttime="${workout.startTime}" title="Elimina Allenamento">${renderIcon('TRASH')}</button>
                                </div>
                            </div>
                            <div class="log-workout-stats">
                                <span>Durata: ${formatDuration(workout.totalTime)}</span>
                                ${workout.totalCaloriesBurned > 0 ? `<span>/</span><span>Kcal: ${workout.totalCaloriesBurned}</span>` : ''}
                                ${workout.totalTonnage > 0 ? `<span>/</span><span>Volume: ${workout.totalTonnage} kg</span>` : ''}
                                ${workout.rpe ? `<span>/</span><span>RPE: ${workout.rpe}</span>` : ''}
                            </div>
                            ${workout.exercises.map(ex => `
                            <div class="log-workout-exercise">
                                <div class="log-item">
                                  <strong>${ex.name}</strong>
                                  <div class="log-workout-header-actions">
                                    <button class="btn-edit-logged-exercise" data-date="${workout.date}" data-starttime="${workout.startTime}" data-instanceid="${ex.instanceId}" title="Modifica Esercizio">${renderIcon('EDIT')}</button>
                                  </div>
                                </div>
                                <div class="log-sets-details">
                                ${ex.setsData.map((setData, i) => `
                                    <div class="log-set-item">
                                    <span>Serie ${i + 1}</span>
                                    <span>${getSetDetails(setData)}</span>
                                    </div>
                                `).join('')}
                                </div>
                            </div>
                            `).join('')}
                        </div>`;
                    } else if (workout.type === 'manual') {
                        let detailsHTML = '';
                        if (workout.distance) detailsHTML += `<div><strong>Distanza:</strong> ${workout.distance} km</div>`;
                        if (workout.fc_avg) detailsHTML += `<div><strong>FC Media:</strong> ${workout.fc_avg} bpm</div>`;
                        if (workout.fc_max) detailsHTML += `<div><strong>FC Max:</strong> ${workout.fc_max} bpm</div>`;
                        if (workout.notes) detailsHTML += `<div class="log-item-details">${workout.notes.replace(/\n/g, '<br>')}</div>`;

                        dayLogHTML += `<div class="log-workout-summary">
                            <div class="log-workout-header">
                                <h4>${UI_TEXT.LOG_VIEW_MANUAL_ACTIVITY_TITLE}</h4>
                                <div class="log-workout-header-actions">
                                  <button class="btn-delete-workout" data-date="${workout.date}" data-starttime="${workout.startTime}" title="Elimina Allenamento">${renderIcon('TRASH')}</button>
                                </div>
                            </div>
                            <div class="log-item">
                                <strong>${workout.name}</strong>
                                <span>${workout.duration || ''}</span>
                            </div>
                            ${detailsHTML ? `<div class="log-manual-details">${detailsHTML}</div>` : ''}
                        </div>`;
                    }
                });
            }

            dayLogHTML += `</div></div>`;
            logViewHTML += dayLogHTML;
          }
        }

        if (!hasContent) {
          logView.innerHTML = `<p class="placeholder-text">${UI_TEXT.LOG_VIEW_EMPTY}</p>`;
        } else {
          logView.innerHTML = logViewHTML;
        }
      }

      export function renderPlannerPage(state) {
        const weekStart = getWeekStartDate(state.focusedDate);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        document.getElementById('week-title').textContent = `${formatShortDate(weekStart)} - ${formatShortDate(weekEnd)}`;

        const todayISO = toISODateString(new Date());
        renderTodayWidget(state, todayISO);
        renderPlannerWeekChart(state, weekStart);
        renderCalendarView(state, weekStart);
        renderLogView(state, weekStart);
      }
commands:
  - "echo 'Bugfix: Corretto il calcolo del grafico settimanale e migliorata la UI (line chart, posizione).'"