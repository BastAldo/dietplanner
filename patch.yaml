  - file: styles/charts.css
    content: |
      /* --- CHARTS PAGE --- */
      #charts-page > h3 {
          color: var(--primary-color);
          margin-bottom: 1.5rem;
      }

      .charts-controls {
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: center;
      }

      .range-filter {
        display: flex;
        gap: 0.5rem;
        background-color: var(--card-color);
        padding: 0.5rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      .range-filter .btn {
        padding: 0.5rem 1rem;
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      .range-filter .btn.active {
        background-color: var(--primary-color);
        color: var(--bg-color);
        border-color: var(--primary-color);
      }

      .charts-summary-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-bottom: 1.5rem;
        padding: 1.5rem;
        background: var(--card-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
      }
      .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .stat-value {
        font-size: 1.75rem;
        font-weight: bold;
        color: var(--primary-color);
        font-family: 'Courier New', Courier, monospace;
      }
      .stat-label {
        font-size: 0.8rem;
        color: var(--text-color-muted);
        text-transform: uppercase;
        margin-top: 0.5rem;
      }

      .charts-container {
          display: grid;
          grid-template-columns: 1fr;
          gap: 1.5rem;
      }

      .chart-card {
          background-color: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
          display: flex;
          flex-direction: column;
      }

      .chart-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1.5rem;
          flex-shrink: 0;
          gap: 1rem;
      }

      .chart-header h4 {
          color: var(--primary-color);
          margin: 0;
          text-align: left;
          flex-grow: 1;
      }

      .chart-header-controls {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-shrink: 0;
      }

      .btn-expand-chart {
        background: none;
        border: none;
        color: var(--text-color-muted);
        cursor: pointer;
        padding: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .chart-canvas-container {
          position: relative;
          height: 400px;
          width: 100%;
          flex-grow: 1;
      }

      .chart-type-switcher {
          display: flex;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          overflow: hidden;
      }

      .btn-chart-type {
          background: transparent;
          border: none;
          color: var(--text-color-muted);
          padding: 0.25rem 0.75rem;
          cursor: pointer;
          font-size: 0.8rem;
      }
      .btn-chart-type:not(:last-child) {
          border-right: 1px solid var(--border-color);
      }
      .btn-chart-type.active {
          background-color: var(--primary-color);
          color: var(--bg-color);
      }

      @media (min-width: 1024px) {
          .charts-container {
              grid-template-columns: repeat(2, 1fr);
          }
      }
commands:
  - "echo 'Bug di layout corretto. Il pulsante Espandi e il selettore del tipo di grafico ora sono allineati correttamente.'"