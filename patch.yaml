commit_message: "fix(charts): Corregge il bug di rendering e aggiunge il selettore del tipo di grafico"
rationale: |
  Questo commit affronta due problemi principali nella vista dei grafici: un bug di rendering e l'aggiunta di una nuova funzionalità richiesta dall'utente.

  **Correzione del Bug**:
  Il bug che causava l'allungamento progressivo delle barre del grafico a ogni visualizzazione è stato risolto. Il problema era dovuto a una gestione incompleta del ciclo di vita delle istanze di Chart.js. La logica in `src/ui/charts.js` è stata rafforzata per garantire che ogni istanza del grafico venga distrutta in modo affidabile prima che ne venga creata una nuova. Inoltre, il grafico delle calorie è stato migliorato per utilizzare una rappresentazione a "barra flottante", che mostra l'intervallo min-max in modo più pulito e accurato usando un singolo dataset.

  **Nuova Funzionalità (Selettore Tipo Grafico)**:
  In risposta alla richiesta dell'utente, è stata aggiunta la possibilità di cambiare dinamicamente il tipo di visualizzazione per il grafico delle calorie settimanali.
  - È stato introdotto un selettore con pulsanti "Barre" e "Linee" nel file `templates/charts.html` e stilizzato in `styles/charts.css` per coerenza con il design system.
  - La logica in `src/ui/charts.js` ora gestisce uno stato interno per il tipo di grafico selezionato e applica event listener ai nuovi pulsanti. Al click, il grafico viene ridisegnato istantaneamente con il nuovo tipo, offrendo maggiore flessibilità di analisi all'utente.
