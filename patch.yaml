  - file: src/ui/pageRenderers.js
    content: |
      import { calculateBMR } from '../core/calculations.js';
      import { BIOMETRIC_FIELDS, PROFILE_FIELDS } from '../config/forms.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { renderCharts } from './charts.js';

      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }

      function formatReadableDate(isoDate) {
          const date = new Date(isoDate);
          return date.toLocaleDateString('it-IT', {
              weekday: 'long',
              year: 'numeric',
              month: 'long',
              day: 'numeric'
          });
      }

      export function renderBiometricsPage(state) {
        const form = document.getElementById('biometrics-form');
        const listContainer = document.getElementById('biometrics-list');

        form.innerHTML = `${BIOMETRIC_FIELDS.map(field => `<div class="form-group"><label for="bio-${field.id}">${field.label}</label>${field.type === 'textarea' ? `<textarea id="bio-${field.id}" name="${field.id}"></textarea>` : `<input type="${field.type}" id="bio-${field.id}" name="${field.id}" ${field.props || ''} ${field.id === 'date' ? `value="${toISODateString(new Date())}"` : ''}>`}</div>`).join('')}<div class="form-actions"><button type="submit" class="btn btn-primary">${UI_TEXT.BIOMETRICS_SAVE_BTN}</button><button type="reset" class="btn btn-secondary">${UI_TEXT.BIOMETRICS_CLEAR_BTN}</button></div>`;

        if (state.biometricData.length > 0) {
            listContainer.innerHTML = state.biometricData.map(entry => {
                const fieldsHTML = BIOMETRIC_FIELDS.filter(field => field.id !== 'date' && entry[field.id])
                    .map(field => `
                        <div class="biometric-card__item ${field.id === 'notes' ? 'biometric-card__notes' : ''}">
                            <span class="biometric-card__label">${field.label}</span>
                            <span class="biometric-card__value">${entry[field.id]}</span>
                        </div>
                    `).join('');

                return `
                    <div class="biometric-card" data-date="${entry.date}">
                        <div class="biometric-card__header">
                            <span class="biometric-card__date">${formatReadableDate(entry.date)}</span>
                            <div class="biometrics-actions">
                                <button class="btn-actions-menu" data-date="${entry.date}" title="${UI_TEXT.BIOMETRICS_ACTIONS_TITLE}">
                                    ${renderIcon('KEBAB_MENU', { width: 24, height: 24 })}
                                </button>
                                <div class="actions-dropdown">
                                    <button class="btn-edit-biometrics" data-date="${entry.date}">${UI_TEXT.BIOMETRICS_EDIT_BTN}</button>
                                    <button class="btn-delete-biometrics delete" data-date="${entry.date}">${UI_TEXT.BIOMETRICS_DELETE_BTN}</button>
                                </div>
                            </div>
                        </div>
                        <div class="biometric-card__body">
                            ${fieldsHTML}
                        </div>
                    </div>`;
            }).join('');
        } else {
            listContainer.innerHTML = `<p class="placeholder-text">${UI_TEXT.BIOMETRICS_EMPTY_LIST}</p>`;
        }

        const weightInput = form.elements.weight;
        const bmrInput = form.elements.basalMetabolism;
        const weightForCalc = weightInput.value || (state.biometricData.length > 0 ? state.biometricData[0].weight : null);

        const bmr = calculateBMR(state.userProfile, weightForCalc);
        if (bmr !== null) {
          bmrInput.value = bmr;
        } else {
          bmrInput.placeholder = UI_TEXT.BIOMETRICS_BMR_PLACEHOLDER;
        }
      }

      export function renderProfilePage(state) {
        const form = document.getElementById('profile-form');
        form.innerHTML = `${PROFILE_FIELDS.map(field => `<div class="form-group">${field.type === 'radio' ? `<fieldset><legend>${field.label}</legend>${field.options.map(opt => `<label><input type="radio" name="${field.id}" value="${opt.value}" ${state.userProfile[field.id] === opt.value ? 'checked' : ''}> ${opt.label}</label>`).join('')}</fieldset>` : `<label for="prof-${field.id}">${field.label}</label><input type="${field.type}" id="prof-${field.id}" name="${field.id}" value="${state.userProfile[field.id] || ''}" ${field.props || ''}>`}</div>`).join('')}<div class="form-actions"><button type="submit" class="btn btn-primary">${UI_TEXT.PROFILE_SAVE_BTN}</button></div>`;
      }

      export function renderChartsPage(state) {
          const placeholder = document.getElementById('biometrics-chart-placeholder');
          const canvas = document.getElementById('biometrics-chart-canvas');
          if (state.biometricData.length < 2) {
              placeholder.textContent = UI_TEXT.BIOMETRICS_CHART_EMPTY;
              placeholder.classList.remove('hidden');
              canvas.classList.add('hidden');
          } else {
              placeholder.classList.add('hidden');
              canvas.classList.remove('hidden');
          }
          renderCharts(state);
      }

      export function renderDebriefingPage(state) {
        const summaryContainer = document.getElementById('debriefing-summary');
        const summary = state.lastWorkoutSummary;

        if (!summary || !summary.exerciseQueue) {
            summaryContainer.innerHTML = `<p class="placeholder-text">${UI_TEXT.DEBRIEFING_NO_SUMMARY}</p>`;
            return;
        }

        const summaryHTML = summary.exerciseQueue.map((exercise, index) => {
            const isCompleted = index < summary.currentExerciseIndex || (index === summary.currentExerciseIndex && summary.status === 'finished');
            const setsCompleted = isCompleted ? exercise.defaultSets : Math.max(0, summary.currentSet - 1);

            return `
                <div class="debriefing-card ${isCompleted ? 'completed' : 'incomplete'}">
                    <h4>${exercise.name}</h4>
                    <p>${UI_TEXT.DEBRIEFING_SETS_COMPLETED}: ${setsCompleted} / ${exercise.defaultSets}</p>
                    <div class="debriefing-status">
                        ${isCompleted ? UI_TEXT.DEBRIEFING_COMPLETED : UI_TEXT.DEBRIEFING_INCOMPLETE}
                    </div>
                </div>
            `;
        }).join('');

        summaryContainer.innerHTML = summaryHTML;
      }
  - file: src/ui/renderer.js
    content: |
      import { getState } from '../core/state.js';
      import { renderPlannerPage } from './plannerRenderer.js';
      import { renderBiometricsPage, renderProfilePage, renderChartsPage, renderDebriefingPage } from './pageRenderers.js';
      import { renderRecipesPage } from './recipesRenderer.js';
      import { initializeTrainerController, destroyTrainerController } from './trainerRenderer.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { log } from '../utils/logger.js';

      let isTrainerActive = false;

      function populateIcons() {
          document.querySelector('.app-title').insertAdjacentHTML('afterbegin', renderIcon('APP_LOGO', { width: 24, height: 24 }));
          document.getElementById('nav-planner').insertAdjacentHTML('afterbegin', renderIcon('PLANNER'));
          document.getElementById('nav-progress').insertAdjacentHTML('afterbegin', renderIcon('WEIGHT_SCALE'));
          document.getElementById('nav-charts').insertAdjacentHTML('afterbegin', renderIcon('BAR_CHART'));
          document.getElementById('nav-recipes').insertAdjacentHTML('afterbegin', renderIcon('BOOK'));
          document.getElementById('nav-profile').insertAdjacentHTML('afterbegin', renderIcon('PROFILE'));
          document.getElementById('share-config-btn').innerHTML = renderIcon('SHARE');
          document.getElementById('info-icon').innerHTML = renderIcon('INFO');
          document.getElementById('view-calendar-btn').innerHTML = renderIcon('PLANNER');
          document.getElementById('view-log-btn').innerHTML = renderIcon('LOG_VIEW');
          document.getElementById('global-alert-close').innerHTML = renderIcon('CLOSE', { width: 24, height: 24, classes: 'alert-icon' });
          
          document.querySelectorAll('.modal-close-btn').forEach(btn => {
              btn.innerHTML = renderIcon('CLOSE');
          });
      }

      export function populateInitialText() {
        document.title = UI_TEXT.MAIN_TITLE;
        document.getElementById('main-title').textContent = UI_TEXT.MAIN_TITLE;
        document.querySelector('#nav-planner span').textContent = UI_TEXT.NAV_PLANNER;
        document.querySelector('#nav-progress span').textContent = UI_TEXT.NAV_PROGRESS;
        document.querySelector('#nav-charts span').textContent = UI_TEXT.NAV_CHARTS;
        document.querySelector('#nav-recipes span').textContent = UI_TEXT.NAV_RECIPES;
        document.querySelector('#nav-profile span').textContent = UI_TEXT.NAV_PROFILE;
        document.getElementById('load-config-btn').textContent = UI_TEXT.LOAD_BUTTON;
        document.getElementById('reset-btn').textContent = UI_TEXT.RESET_BUTTON;
        document.getElementById('copy-week-btn').textContent = UI_TEXT.COPY_WEEK_BTN;
        document.getElementById('backup-btn').textContent = UI_TEXT.BACKUP_BTN;
        document.getElementById('restore-btn').textContent = UI_TEXT.RESTORE_BTN;
        document.getElementById('info-modal-title').textContent = UI_TEXT.INFO_MODAL_TITLE;
        document.getElementById('info-modal-desc').textContent = UI_TEXT.INFO_MODAL_DESC;
        document.getElementById('info-modal-json-example').textContent = UI_TEXT.INFO_MODAL_EXAMPLE_JSON;
        document.getElementById('biometrics-title').textContent = UI_TEXT.BIOMETRICS_FORM_TITLE;
        document.getElementById('biometrics-history-title').textContent = UI_TEXT.BIOMETRICS_HISTORY_TITLE;
        document.getElementById('profile-title').textContent = UI_TEXT.PROFILE_FORM_TITLE;
        document.getElementById('charts-title').textContent = UI_TEXT.CHARTS_TITLE;
        document.getElementById('planner-chart-title').textContent = UI_TEXT.PLANNER_CHART_TITLE;
        document.getElementById('biometrics-chart-title').textContent = UI_TEXT.BIOMETRICS_CHART_TITLE;
        document.getElementById('recipes-title').textContent = UI_TEXT.RECIPES_TITLE;
        document.querySelector('#charts-page .btn-chart-type[data-type=\"bar\"]').textContent = UI_TEXT.CHART_BAR_VIEW_BTN;
        document.querySelector('#charts-page .btn-chart-type[data-type=\"line\"]').textContent = UI_TEXT.CHART_LINE_VIEW_BTN;
        document.getElementById('debriefing-title').textContent = UI_TEXT.DEBRIEFING_TITLE;
        document.getElementById('back-to-planner-btn').textContent = UI_TEXT.DEBRIEFING_BACK_BTN;
        populateIcons();
      }

      export function renderApp() {
        const state = getState();
        const plannerPage = document.getElementById('planner-page');
        const progressPage = document.getElementById('progress-page');
        const chartsPage = document.getElementById('charts-page');
        const recipesPage = document.getElementById('recipes-page');
        const profilePage = document.getElementById('profile-page');
        const trainerPage = document.getElementById('trainer-page');
        const debriefingPage = document.getElementById('debriefing-page');

        const navPlannerBtn = document.getElementById('nav-planner');
        const navProgressBtn = document.getElementById('nav-progress');
        const navChartsBtn = document.getElementById('nav-charts');
        const navRecipesBtn = document.getElementById('nav-recipes');
        const navProfileBtn = document.getElementById('nav-profile');

        log('Renderer', 'Render triggered. Current view:', state.currentView, 'isTrainerActive:', isTrainerActive);

        if (state.currentView !== 'trainer' && isTrainerActive) {
            log('Renderer', 'View is not trainer, destroying trainer controller...');
            destroyTrainerController();
            isTrainerActive = false;
        }

        [plannerPage, progressPage, chartsPage, recipesPage, profilePage, trainerPage, debriefingPage].forEach(p => p.classList.add('hidden'));
        [navPlannerBtn, navProgressBtn, navChartsBtn, navRecipesBtn, navProfileBtn].forEach(b => b.classList.remove('active'));

        if (state.currentView === 'planner' || state.currentView === 'log') {
          plannerPage.classList.remove('hidden');
          navPlannerBtn.classList.add('active');
          renderPlannerPage(state);
        } else if (state.currentView === 'progress') {
          progressPage.classList.remove('hidden');
          navProgressBtn.classList.add('active');
          renderBiometricsPage(state);
        } else if (state.currentView === 'charts') {
          chartsPage.classList.remove('hidden');
          navChartsBtn.classList.add('active');
          renderChartsPage(state);
        } else if (state.currentView === 'recipes') {
          recipesPage.classList.remove('hidden');
          navRecipesBtn.classList.add('active');
          renderRecipesPage(state);
        } else if (state.currentView === 'profile') {
          profilePage.classList.remove('hidden');
          navProfileBtn.classList.add('active');
          renderProfilePage(state);
        } else if (state.currentView === 'trainer') {
          trainerPage.classList.remove('hidden');
          log('Renderer', 'View is trainer, checking if trainer is active...');
          if (!isTrainerActive) {
            log('Renderer', 'Trainer is not active, initializing trainer controller...');
            initializeTrainerController();
            isTrainerActive = true;
          }
        } else if (state.currentView === 'debriefing') {
          debriefingPage.classList.remove('hidden');
          renderDebriefingPage(state);
        }

        const urlInput = document.getElementById('config-url-input');
        if (document.activeElement !== urlInput) urlInput.value = state.configUrl;
      }
  - file: src/ui/viewLoader.js
    content: |
      async function fetchAndInject(url, containerId) {
          try {
              const response = await fetch(url);
              if (!response.ok) {
                  throw new Error(`Failed to load template: ${url}`);
              }
              const content = await response.text();
              document.getElementById(containerId).innerHTML += content;
          } catch (error) {
              console.error(error);
          }
      }

      export async function loadViews() {
          const appContainer = document.getElementById('app-container');
          const modalContainer = document.getElementById('modal-container');
          
          // Svuota i container per evitare duplicati in caso di ricaricamento a caldo (hot-reloading)
          appContainer.innerHTML = '';
          modalContainer.innerHTML = '';

          // Carica le viste principali
          await fetchAndInject('templates/planner.html', 'app-container');
          await fetchAndInject('templates/progress.html', 'app-container');
          await fetchAndInject('templates/charts.html', 'app-container');
          await fetchAndInject('templates/recipes.html', 'app-container');
          await fetchAndInject('templates/profile.html', 'app-container');
          await fetchAndInject('templates/trainer.html', 'app-container');
          await fetchAndInject('templates/debriefing.html', 'app-container');
          
          // Carica i modali
          await fetchAndInject('templates/modals.html', 'modal-container');
      }
  - file: styles/debriefing.css
    content: |
      /* --- DEBRIEFING VIEW STYLES --- */
      #debriefing-page {
          max-width: 800px;
          margin: 0 auto;
          padding: 1rem;
          text-align: center;
      }

      #debriefing-page h3 {
          color: var(--primary-color);
          margin-bottom: 2rem;
          font-size: 1.75rem;
      }

      #debriefing-summary {
          display: grid;
          grid-template-columns: 1fr;
          gap: 1rem;
          margin-bottom: 2rem;
      }

      .debriefing-card {
          background-color: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
          text-align: left;
          position: relative;
          overflow: hidden;
      }

      .debriefing-card h4 {
          font-size: 1.2rem;
          margin-bottom: 0.5rem;
      }

      .debriefing-card p {
          color: var(--text-color-muted);
      }

      .debriefing-status {
          position: absolute;
          top: 1rem;
          right: 1rem;
          font-size: 0.8rem;
          font-weight: bold;
          text-transform: uppercase;
          padding: 0.25rem 0.5rem;
          border-radius: 4px;
      }

      .debriefing-card.completed .debriefing-status {
          color: var(--success-color);
          background-color: rgba(102, 187, 106, 0.1);
      }

      .debriefing-card.incomplete .debriefing-status {
          color: var(--warning-color);
          background-color: rgba(253, 216, 53, 0.1);
      }

      @media (min-width: 768px) {
          #debriefing-summary {
              grid-template-columns: repeat(2, 1fr);
          }
      }
