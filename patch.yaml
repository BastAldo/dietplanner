commit_message: "fix(trainer): Resolve rendering glitches and race conditions in trainer engine"
rationale: |
  This patch provides a comprehensive fix for two critical issues identified during workout execution: a visual glitch where the timer display would show inconsistent states, and a race condition that caused the final workout completion audio cue to be skipped.

  **Problem Resolution & Implemented Solution:**

  1.  **Visual Glitch - Mixed CSS Classes:**
      * **Problem:** In `TrainerComponent.js`, the `render` function would add CSS classes (`is-timer`, `is-phase`, etc.) to the timer display element based on the current phase, but it never removed the classes from the previous phase. This resulted in class accumulation (e.g., `is-timer is-phase`) and a broken visual rendering, especially during transitions between rest and work periods.
      * **Solution:** A single line has been added at the beginning of the main rendering logic within the `render` function in `src/ui/components/TrainerComponent.js`. This line (`this.ringText.classList.remove(...)`) systematically removes all state-specific classes before new ones are applied, ensuring the UI is always in a clean state and accurately reflects the current phase.

  2.  **Audio Cutoff - Race Condition:**
      * **Problem:** In `src/core/trainer/animation.js`, the main `tick` function was not `await`-ing the completion of the `async` function `handleNonTimedPhase`, which is responsible for playing audio cues. This created a race condition where the engine would trigger the final "Workout Completed" audio cue but immediately proceed to the next instruction, find the queue empty, and call `endWorkout()` before the audio had time to play.
      * **Solution:** The `tick` function has been converted to an `async` function, and the call to `handleNonTimedPhase` is now correctly awaited (`await handleNonTimedPhase(currentPhase)`). This enforces a sequential execution flow, guaranteeing that the animation engine pauses until the audio cue is completely finished before proceeding. The previous, ineffective `isProcessing` lock has been removed, simplifying the code.

  These two fixes work in tandem to create a stable, predictable, and polished user experience within the trainer, ensuring both visual consistency and correct execution of all timed and non-timed events in the workout queue.
