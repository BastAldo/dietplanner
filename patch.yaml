              <button class="modal-close-btn" data-target="recipe-modal"></button>
            </div>
            <div id="recipe-modal-body" class="modal-body recipe-body"></div>
        </div>
      </div>
      <div id="manual-workout-modal" class="modal-overlay modal-hidden">
          <div class="modal-content">
              <div class="modal-header">
                <h3 id="manual-workout-modal-title"></h3>
                <button class="modal-close-btn" data-target="manual-workout-modal"></button>
              </div>
              <div class="modal-body">
                  <form id="manual-workout-form" class="structured-form">
                      <div class="form-group">
