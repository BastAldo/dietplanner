commit_message: "refactor(UX): Implement final unified modal-only workflow"
rationale: |
  This commit completes the final, major UX refactoring. It fully removes the old meal library, filters, and drag-and-drop logic in favor of a clean, unified, and modal-driven workflow that is consistent across mobile and desktop.

  Key Changes:
  1.  **Complete Removal of Library:** All HTML, CSS, and JavaScript related to the `<aside>` meal library and its filters have been eradicated.
  2.  **Unified Interaction:** Clicking/tapping a calendar slot is now the *only* way to add a meal on all devices, simplifying the codebase and user experience.
  3.  **Corrected Mobile Layout:** The mobile calendar now correctly displays in a two-column grid (two days per row), fixing the previous layout bug.
  4.  **Full Documentation Sync:** All documentation has been updated to reflect this final, simplified architecture.
  5.  **Code Integrity:** This patch contains the full and complete content for all project files, with no placeholders or shortcuts.
patches:
  - file: docs/01_FUNCTIONALITY.md
    content: |
      # Funzionalità: Protocollo Dinamico v1.3

      ## 1. Visione Generale
      Una web app frontend-only, responsiva, che permette a un utente di pianificare il proprio protocollo alimentare settimanale caricando una configurazione JSON che include sia i pasti sia le regole di validazione personalizzate. L'interfaccia è minimale e centrata sul calendario.

      ## 2. User Stories (Cosa l'utente può fare)
      * **US-1 (Caricamento Dati):** Come utente, voglio poter caricare una configurazione da un file JSON remoto.
      * **US-2 (Visualizzazione Calendario):** Come utente, voglio vedere una griglia chiara del calendario come interfaccia principale.
      * **US-3 (Pianificazione via Modale):** Come utente, voglio poter cliccare su uno slot vuoto del calendario per aprire un modale e selezionare un pasto da una lista filtrata.
      * **US-4 (Validazione Dinamica):** Come utente, voglio che l'app applichi le regole definite nel JSON quando pianifico i pasti.
      * **US-5 (Persistenza):** Come utente, voglio che il mio piano settimanale e l'URL del JSON vengano salvati automaticamente.
      * **US-11 (Cancellazione Pasti):** Come utente, voglio poter rimuovere facilmente un pasto che ho inserito nel calendario.
      * **US-15 (Layout Mobile Leggibile):** Come utente mobile, voglio che il calendario si visualizzi come una griglia compatta (due giorni per riga).
  - file: docs/02_ARCHITECTURE.md
    content: |
      # Architettura: Protocollo Dinamico v1.3

      ## 1. Principi Guida
      * **Minimalism:** L'interfaccia utente è ridotta all'essenziale, focalizzandosi sul calendario. L'interazione è unificata per tutti i dispositivi.
      * **Data-Driven:** La logica di business (regole) è definita nel file di configurazione JSON.
      * **Frontend-Only, KISS, SRP:** L'app vive nel browser, usa Vanilla JS e ogni file ha una sola responsabilità.

      ## 2. Formato Dati: `planner-config.json`
      L'applicazione è guidata da un singolo file JSON con due sezioni principali: `rules` e `meals`.

      ## 3. Struttura dei File
      ```
      .
      └── src/
          ├── api/
          │   └── configService.js
          ├── core/
          │   ├── state.js
          │   └── validation.js
          ├── ui/
          │   ├── renderer.js
          │   ├── interactions.js
          │   └── notifications.js
          └── utils/
              └── constants.js
      ```

      ## 4. Flusso di Interazione Utente
      Il flusso è stato unificato e semplificato per tutti i dispositivi:
      1. L'utente visualizza il calendario.
      2. Clicca su uno slot vuoto.
      3. Si apre un modale (`#selection-modal`) contenente la lista dei pasti pertinenti (solo Pranzo o solo Cena).
      4. L'utente clicca su un pasto nel modale.
      5. Il modale si chiude e il calendario si aggiorna.

      ## 5. Design Responsivo
      * **Mobile (< 992px):** Il calendario è una griglia a due colonne (due giorni per riga).
      * **Desktop (>= 992px):** Il calendario è una griglia a otto colonne (header + 7 giorni).
