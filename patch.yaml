commit_message: "fix(core): Add missing WEEK_STARTS_ON_MONDAY constant"
rationale: |
  This commit resolves a fatal JavaScript error that was preventing the application from rendering.

  The `renderer.js` module attempted to import the `WEEK_STARTS_ON_MONDAY` constant, which was used for week calculation logic but was not defined in `src/utils/constants.js`.

  I have now added the missing constant with the correct value (1), resolving the module import error and allowing the application to execute its rendering logic correctly.
patches:
  - file: src/utils/constants.js
    content: |
      export const DEFAULT_CONFIG_URL = '';
      export const LOCAL_STORAGE_KEY_PLAN = 'dynamicProtocolPlan';
      export const LOCAL_STORAGE_KEY_URL = 'dynamicConfigUrl';
      export const WEEK_STARTS_ON_MONDAY = 1;
      export const DAYS = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
      export const MEAL_TYPES = [
        'Colazione',
        'Spuntino Mattutino',
        'Pranzo',
        'Spuntino Pomeridiano',
        'Cena'
      ];

      export const UI_TEXT = {
        MAIN_TITLE: 'NutriPlan',
        SUBTITLE: 'Crea e gestisci piani alimentari flessibili. Carica la tua configurazione e inizia.',
        LOAD_BUTTON: 'Carica',
        WEEKLY_PLAN_TITLE: 'Piano Settimanale',
        CALENDAR_PLACEHOLDER: 'Carica una configurazione per visualizzare il calendario.',
        RESET_BUTTON: 'Reset Piano',
        INFO_MODAL_TITLE: 'Formato `config.json` Richiesto',
        INFO_MODAL_DESC: 'Includi `calories_min` per ogni pasto. `calories_max` è opzionale.',
        SELECT_MEAL_TITLE: 'Scegli',
        FOR_DAY_PREFIX: 'per',
        NO_MEALS_AVAILABLE: 'Nessun pasto di questo tipo disponibile.',
        KCAL_LABEL: 'Kcal'
      };
commands:
  - "echo 'Missing constant added. The application should now load correctly.'"