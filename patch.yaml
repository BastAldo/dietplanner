commit_message: "fix(trainer): Corregge il percorso di importazione errato nel facade del trainer"
rationale: |
  Questo commit risolve un errore `404 Not Found` introdotto durante il precedente refactoring del modulo `trainer`.

  La causa era un percorso di importazione relativo errato nel file facade `src/core/trainer.js`. L'istruzione `import { setView } from '../state.js';` causava un tentativo di caricamento da `src/state.js`, un percorso inesistente.

  La correzione consiste nel modificare il percorso in `import { setView } from './state.js';`, che risolve correttamente la posizione del modulo di stato in `src/core/state.js`.

  Sono stati verificati anche gli altri percorsi di importazione nei nuovi moduli del trainer, e risultano corretti.
patches:
  - file: src/core/trainer.js
    content: |
      import { setView } from './state.js';
      import { log } from '../utils/logger.js';
      import { getWorkoutState as getState, resetState, updateState } from './trainer/state.js';
      import { startAnimation, stopAnimation } from './trainer/animation.js';
      import { buildExecutionQueueForCurrentSet } from './trainer/queueBuilder.js';

      // Re-export to maintain the public API
      export { getState as getWorkoutState };

      export function resetWorkoutState() {
        log('Trainer', 'Resetting workout state.');
        stopAnimation();
        resetState();
      }

      export function initializeWorkout(plannedExercises) {
        if (!plannedExercises || plannedExercises.length === 0) {
          return;
        }
        resetWorkoutState();
        const initialState = {
          exerciseQueue: JSON.parse(JSON.stringify(plannedExercises)),
          currentExerciseIndex: 0,
          currentSet: 1,
          currentRep: 1,
        };
        updateState(initialState);
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function startWorkout() {
        const state = getState();
        log('Trainer', 'Attempting to start workout. Current status:', state.status);
        if (state.status === 'idle') {
          const executionQueue = buildExecutionQueueForCurrentSet();
          updateState({
            status: 'running',
            executionQueue: executionQueue,
            currentPhaseIndex: 0,
            phaseTimeElapsed: 0,
            currentRep: 1,
          });
          startAnimation();
          log('Trainer', 'Workout started. New status:', getState().status);
        }
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function pauseWorkout() {
        const state = getState();
        if (state.status === 'running' || state.status === 'resting') {
          updateState({
            prePauseStatus: state.status,
            status: 'paused',
          });
          stopAnimation();
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function resumeWorkout() {
        const state = getState();
        if (state.status === 'paused') {
          updateState({
            status: state.prePauseStatus,
            prePauseStatus: '',
          });
          startAnimation();
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function endWorkout() {
        updateState({ status: 'finished' });
        stopAnimation();
        setView('planner');
      }
commands:
  - "echo 'Correzione del percorso di importazione applicata. L''errore 404 dovrebbe essere risolto.'"