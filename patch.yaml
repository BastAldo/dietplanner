commit_message: "feat: Implement responsive MVP with updated documentation"
rationale: |
  This commit builds the complete and responsive Minimum Viable Product. It incorporates crucial user feedback to fix a formatting bug within a code example and introduces key architectural enhancements.

  Key features and fixes in this commit:
  - **Updated Documentation:** The `FUNCTIONALITY`, `ARCHITECTURE`, and `STYLE_GUIDE` documents have been updated to include the new requirements for a configurable data source and a responsive layout.
  - **Bug Fix:** Corrected the use of tabs instead of spaces in the example CSV code block within the informational modal.
  - **UI Polish:** Added a horizontal scrollbar to the CSV example block to prevent layout overflow.
  - **Responsive Design:** Implemented a "Mobile First" CSS strategy. The layout stacks vertically by default and transitions to a two-column grid on screens wider than 768px, ensuring usability on all devices.
