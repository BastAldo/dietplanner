commit_message: "feat(UX): Potenzia riepilogo, unifica UI trainer e corregge layout"
rationale: |
  Questo commit implementa una serie di miglioramenti significativi all'interfaccia utente, basati sul feedback ricevuto, per aumentare la coerenza, la chiarezza e il valore informativo dell'applicazione.

  1.  **Potenziamento Riepilogo Settimanale**: Il widget di riepilogo nel planner è stato completamente riprogettato. Ora mostra metriche più utili e motivazionali, come le calorie totali bruciate durante gli allenamenti della settimana e i chilogrammi mancanti per raggiungere l'obiettivo di peso impostato. Il layout è stato riorganizzato in una griglia CSS per una presentazione più pulita e ordinata.

  2.  **Unificazione Stile Trainer**: L'interfaccia del trainer è stata resa visivamente coerente tra le diverse modalità di esercizio (`tempo_guided`, `static_hold`, `manual_reps`). Le variazioni drastiche della dimensione del font sono state eliminate in favore di uno stile unificato, che utilizza il colore e il tipo di carattere per differenziare le informazioni, migliorando la leggibilità e riducendo la distrazione per l'utente.

  3.  **Correzione Layout Header Trainer**: È stato risolto un bug di layout nell'header del trainer che causava la sovrapposizione di elementi. La struttura HTML è stata resa più logica e il CSS è stato refattorizzato per utilizzare Flexbox, garantendo un allineamento corretto e robusto su tutte le risoluzioni.

  4.  **Aggiunta Testo Esplicativo**: È stato inserito il testo esplicativo mancante nella pagina "Obiettivi", guidando meglio l'utente nella comprensione e nell'utilizzo della funzionalità, come originariamente previsto.
