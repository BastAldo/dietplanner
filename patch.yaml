  - file: styles/charts.css
    content: |
      /* --- CHARTS PAGE --- */
      #charts-page > h3 {
          color: var(--primary-color);
          margin-bottom: 1.5rem;
      }

      .charts-controls {
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: center;
      }

      .range-filter {
        display: flex;
        gap: 0.5rem;
        background-color: var(--card-color);
        padding: 0.5rem;
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }

      .range-filter .btn {
        padding: 0.5rem 1rem;
        text-transform: uppercase;
        font-size: 0.8rem;
      }

      .range-filter .btn.active {
        background-color: var(--primary-color);
        color: var(--bg-color);
        border-color: var(--primary-color);
      }

      .charts-summary-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-bottom: 1.5rem;
        padding: 1.5rem;
        background: var(--card-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
      }
      .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .stat-value {
        font-size: 1.75rem;
        font-weight: bold;
        color: var(--primary-color);
        font-family: 'Courier New', Courier, monospace;
      }
      .stat-label {
        font-size: 0.8rem;
        color: var(--text-color-muted);
        text-transform: uppercase;
        margin-top: 0.5rem;
      }

      .charts-container {
          display: grid;
          grid-template-columns: 1fr;
          gap: 1.5rem;
      }

      .chart-card {
          background-color: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
          display: flex;
          flex-direction: column;
      }

      .chart-header {
          display: flex;
          justify-content: center;
          align-items: center;
          margin-bottom: 1.5rem;
          position: relative;
          flex-shrink: 0;
      }

      .chart-header h4 {
          color: var(--primary-color);
          margin: 0;
          text-align: center;
      }

      .chart-canvas-container {
          position: relative;
          height: 400px;
          width: 100%;
          flex-grow: 1;
      }

      .chart-type-switcher {
          position: absolute;
          right: 0;
          top: 50%;
          transform: translateY(-50%);
          display: flex;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          overflow: hidden;
      }

      .btn-chart-type {
          background: transparent;
          border: none;
          color: var(--text-color-muted);
          padding: 0.25rem 0.75rem;
          cursor: pointer;
          font-size: 0.8rem;
      }
      .btn-chart-type:not(:last-child) {
          border-right: 1px solid var(--border-color);
      }
      .btn-chart-type.active {
          background-color: var(--primary-color);
          color: var(--bg-color);
      }

      @media (min-width: 1024px) {
          .charts-container {
              grid-template-columns: repeat(2, 1fr);
          }
      }
  - file: src/ui/charts.js
    content: |
      import { MEAL_TYPES, DAYS, WEEK_STARTS_ON_MONDAY } from '../utils/constants.js';
      import { BIOMETRIC_FIELDS } from '../config/forms.js';
      import { UI_TEXT } from '../config/uiText.js';

      let chartInstances = {};
      let currentPlannerChartType = 'bar';
      let currentRangeFilter = '30';

      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function getChartColors() {
          const style = getComputedStyle(document.documentElement);
          return {
              primary: style.getPropertyValue('--primary-color').trim(),
              secondary: style.getPropertyValue('--secondary-color').trim(),
              textColor: style.getPropertyValue('--text-color').trim(),
              borderColor: style.getPropertyValue('--border-color').trim(),
              danger: style.getPropertyValue('--danger-color').trim(),
              success: style.getPropertyValue('--success-color').trim(),
              warning: style.getPropertyValue('--warning-color').trim()
          };
      }

      function calculateWeeklyCalorieData(state) {
        const weekStart = getWeekStartDate(state.focusedDate);
        const weeklyData = { labels: [], calories: [] };

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          weeklyData.labels.push(DAYS[i]);

          let dailyMin = 0, dailyMax = 0;
          MEAL_TYPES.forEach(type => {
            const meal = state.weeklyPlan[`${isoDate}-${type}`];
            if (meal && typeof meal.calories_min === 'number') {
              const minCals = Number(meal.calories_min) || 0;
              const maxCals = Number(meal.calories_max) || minCals;
              dailyMin += minCals;
              dailyMax += maxCals;
            }
          });
          weeklyData.calories.push([dailyMin, dailyMax]);
        }
        return weeklyData;
      }

      function destroyAllCharts() {
        Object.values(chartInstances).forEach(chart => {
          if (chart) chart.destroy();
        });
        chartInstances = {};
      }

      function renderPlannerChart(state) {
        const weeklyData = calculateWeeklyCalorieData(state);
        const colors = getChartColors();
        const isLineChart = currentPlannerChartType === 'line';
        
        const datasets = isLineChart ?
        [{
            label: UI_TEXT.CHART_KCAL_MIN_LABEL,
            data: weeklyData.calories.map(c => c[0]),
            borderColor: colors.secondary,
            fill: false,
            tension: 0.1
        },{
            label: UI_TEXT.CHART_KCAL_MAX_LABEL,
            data: weeklyData.calories.map(c => c[1]),
            borderColor: colors.primary,
            fill: '-1',
            backgroundColor: colors.primary + '33',
            tension: 0.1
        }]
        :
        [{
            label: UI_TEXT.CHART_KCAL_RANGE_LABEL,
            data: weeklyData.calories,
            backgroundColor: colors.primary,
            borderColor: colors.secondary
        }];
        
        const ctx = document.getElementById('planner-chart-canvas').getContext('2d');
        chartInstances.planner = new Chart(ctx, {
          type: currentPlannerChartType,
          data: {
            labels: weeklyData.labels,
            datasets: datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                ticks: { color: colors.textColor },
                grid: { color: colors.borderColor }
              },
              x: {
                ticks: { color: colors.textColor },
                grid: { display: false }
              }
            },
            plugins: {
              legend: {
                display: isLineChart,
                labels: { color: colors.textColor }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    if (isLineChart) {
                      return `${context.dataset.label}: ${context.parsed.y}`;
                    }
                    const value = context.raw;
                    if (value[0] === value[1]) {
                      return `${UI_TEXT.KCAL_LABEL}: ${value[0]}`;
                    }
                    return `${UI_TEXT.KCAL_LABEL}: ${value[0]} - ${value[1]}`;
                  }
                }
              }
            }
          }
        });
      }

      function filterDataByRange(data, rangeInDays) {
        if (rangeInDays === 'all') return data;
        const now = new Date();
        const cutoffDate = new Date();
        cutoffDate.setDate(now.getDate() - parseInt(rangeInDays, 10));
        return data.filter(entry => new Date(entry.date) >= cutoffDate);
      }

      function getBiometricsData(state) {
        const sortedData = [...state.biometricData].sort((a, b) => new Date(a.date) - new Date(b.date));
        const data = filterDataByRange(sortedData, currentRangeFilter);
        const labels = data.map(entry => new Date(entry.date).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }));
        
        const datasets = {};
        const numericFields = BIOMETRIC_FIELDS.filter(f => f.type === 'number');

        numericFields.forEach(field => {
            datasets[field.id] = {
                label: field.label,
                data: data.map(entry => entry[field.id] || null)
            };
        });

        return { labels, datasets, filteredData: data };
      }

      function renderBiometricsChart(state, data) {
        const { labels, datasets } = data;
        const colors = getChartColors();
        const colorCycle = [colors.primary, colors.secondary, colors.success, colors.warning, colors.danger];
        
        const chartDatasets = Object.values(datasets)
            .map((dataset, index) => ({
                label: dataset.label,
                data: dataset.data,
                fill: false,
                borderColor: colorCycle[index % colorCycle.length],
                tension: 0.1,
                pointBackgroundColor: colorCycle[index % colorCycle.length],
                pointRadius: 4
            }))
            .filter(d => d.data.some(val => val !== null));

        const ctx = document.getElementById('biometrics-chart-canvas').getContext('2d');

        chartInstances.biometrics = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: chartDatasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                ticks: { color: colors.textColor },
                grid: { color: colors.borderColor }
              },
              x: {
                ticks: { color: colors.textColor },
                grid: { display: false }
              }
            },
            plugins: {
              legend: {
                display: true,
                position: 'bottom',
                labels: { color: colors.textColor },
                onClick: (e, legendItem, legend) => {
                  const index = legendItem.datasetIndex;
                  const ci = legend.chart;
                  if (ci.isDatasetVisible(index)) {
                      ci.hide(index);
                      legendItem.hidden = true;
                  } else {
                      ci.show(index);
                      legendItem.hidden = false;
                  }
                }
              }
            }
          }
        });
      }

      function renderCorrelationChart(state, data) {
          const { filteredData } = data;
          if (filteredData.length < 2) return;

          const labels = filteredData.map(entry => new Date(entry.date).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }));
          const weightData = filteredData.map(entry => entry.weight || null);

          const calorieData = filteredData.map(entry => {
              const isoDate = entry.date;
              let dailyMin = 0;
              MEAL_TYPES.forEach(type => {
                  const meal = state.weeklyPlan[`${isoDate}-${type}`];
                  if (meal) {
                      dailyMin += Number(meal.calories_min) || 0;
                  }
              });
              return dailyMin > 0 ? dailyMin : null;
          });

          const colors = getChartColors();
          const ctx = document.getElementById('correlation-chart-canvas').getContext('2d');
          chartInstances.correlation = new Chart(ctx, {
              type: 'bar',
              data: {
                  labels: labels,
                  datasets: [
                      {
                          label: 'Peso (kg)',
                          data: weightData,
                          type: 'line',
                          borderColor: colors.secondary,
                          tension: 0.1,
                          yAxisID: 'yWeight',
                      },
                      {
                          label: 'Kcal Assunte',
                          data: calorieData,
                          backgroundColor: colors.primary + '80',
                          yAxisID: 'yKcal',
                      }
                  ]
              },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  scales: {
                      yWeight: {
                          type: 'linear',
                          position: 'left',
                          ticks: { color: colors.secondary },
                          grid: { color: colors.borderColor }
                      },
                      yKcal: {
                          type: 'linear',
                          position: 'right',
                          ticks: { color: colors.primary },
                          grid: { display: false }
                      },
                      x: {
                          ticks: { color: colors.textColor },
                          grid: { display: false }
                      }
                  },
                  plugins: {
                      legend: {
                          labels: { color: colors.textColor }
                      }
                  }
              }
          });
      }

      function renderVelocityChart(data) {
        const { filteredData } = data;
        if (filteredData.length < 2) return;

        const weeklyChanges = [];
        for (let i = 1; i < filteredData.length; i++) {
            const prev = filteredData[i - 1];
            const curr = filteredData[i];
            const daysDiff = (new Date(curr.date) - new Date(prev.date)) / (1000 * 60 * 60 * 24);
            if (daysDiff > 0) {
                const weightChange = curr.weight - prev.weight;
                const changePerWeek = (weightChange / daysDiff) * 7;
                weeklyChanges.push({
                    date: curr.date,
                    change: changePerWeek.toFixed(2)
                });
            }
        }

        const labels = weeklyChanges.map(c => new Date(c.date).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }));
        const changeData = weeklyChanges.map(c => c.change);
        const colors = getChartColors();

        const ctx = document.getElementById('velocity-chart-canvas').getContext('2d');
        chartInstances.velocity = new Chart(ctx, {
            type: 'bar',
            data: {
                labels,
                datasets: [{
                    label: 'Variazione media settimanale (kg)',
                    data: changeData,
                    backgroundColor: changeData.map(v => v < 0 ? colors.success : colors.danger),
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        ticks: { color: colors.textColor },
                        grid: { color: colors.borderColor }
                    },
                    x: {
                        ticks: { color: colors.textColor },
                        grid: { display: false }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
      }

      function renderSummaryStats(data) {
        const { filteredData } = data;
        const container = document.getElementById('charts-summary-stats');
        if (filteredData.length < 2) {
          container.innerHTML = '';
          return;
        }

        const first = filteredData[0];
        const last = filteredData[filteredData.length - 1];
        
        const weightChange = (last.weight - first.weight).toFixed(1);
        const daysDiff = (new Date(last.date) - new Date(first.date)) / (1000 * 60 * 60 * 24);
        const avgWeeklyChange = daysDiff > 0 ? ((weightChange / daysDiff) * 7).toFixed(2) : 0;

        container.innerHTML = `
          <div class="stat-item">
            <div class="stat-value">${weightChange} kg</div>
            <div class="stat-label">Variazione Peso (${currentRangeFilter}gg)</div>
          </div>
          <div class="stat-item">
            <div class="stat-value">${avgWeeklyChange} kg</div>
            <div class="stat-label">Variazione media / settimana</div>
          </div>
        `;
      }

      export function handleChartTypeChange(event, state) {
          const type = event.target.dataset.type;
          if (type && type !== currentPlannerChartType) {
              currentPlannerChartType = type;
              document.querySelectorAll('.btn-chart-type').forEach(btn => {
                  btn.classList.toggle('active', btn.dataset.type === type);
              });
              if (chartInstances.planner) {
                chartInstances.planner.destroy();
              }
              renderPlannerChart(state);
          }
      }

      export function handleRangeFilterChange(event, state) {
        const range = event.target.dataset.range;
        if (range && range !== currentRangeFilter) {
          currentRangeFilter = range;
          document.querySelectorAll('#charts-range-filter .btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.range === range);
          });
          renderCharts(state);
        }
      }

      export function renderCharts(state) {
          destroyAllCharts();
          document.getElementById('velocity-chart-title').textContent = "Andamento Variazione Peso";

          const biometricsData = getBiometricsData(state);

          const placeholder = document.getElementById('biometrics-chart-placeholder');
          const canvas = document.getElementById('biometrics-chart-canvas');
          if (biometricsData.filteredData.length < 2) {
              placeholder.textContent = UI_TEXT.BIOMETRICS_CHART_EMPTY;
              placeholder.classList.remove('hidden');
              canvas.classList.add('hidden');
              document.getElementById('charts-summary-stats').innerHTML = '';
              document.getElementById('velocity-chart-canvas').getContext('2d').clearRect(0,0,1,1); // Clear canvas
          } else {
              placeholder.classList.add('hidden');
              canvas.classList.remove('hidden');
              renderBiometricsChart(state, biometricsData);
              renderCorrelationChart(state, biometricsData);
              renderVelocityChart(biometricsData);
              renderSummaryStats(biometricsData);
          }
          
          renderPlannerChart(state);
      }
  - file: src/ui/renderer.js
    content: |
      import { getState } from '../core/state.js';
      import { renderPlannerPage } from './plannerRenderer.js';
      import { renderBiometricsPage, renderProfilePage, renderChartsPage, renderDebriefingPage, renderGoalsPage } from './pageRenderers.js';
      import { renderRecipesPage } from './recipesRenderer.js';
      import { initializeTrainerController, destroyTrainerController } from './trainerRenderer.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { log } from '../utils/logger.js';

      let isTrainerActive = false;

      function populateIcons() {
          document.querySelector('.app-title').insertAdjacentHTML('afterbegin', renderIcon('APP_LOGO', { width: 24, height: 24 }));
          document.getElementById('nav-planner').insertAdjacentHTML('afterbegin', renderIcon('PLANNER'));
          document.getElementById('nav-progress').insertAdjacentHTML('afterbegin', renderIcon('WEIGHT_SCALE'));
          document.getElementById('nav-charts').insertAdjacentHTML('afterbegin', renderIcon('BAR_CHART'));
          document.getElementById('nav-recipes').insertAdjacentHTML('afterbegin', renderIcon('BOOK'));
          document.getElementById('nav-goals').insertAdjacentHTML('afterbegin', renderIcon('GOAL'));
          document.getElementById('nav-profile').insertAdjacentHTML('afterbegin', renderIcon('PROFILE'));
          document.getElementById('share-config-btn').innerHTML = renderIcon('SHARE');
          document.getElementById('info-icon').innerHTML = renderIcon('INFO');
          document.getElementById('view-calendar-btn').innerHTML = renderIcon('PLANNER');
          document.getElementById('view-log-btn').innerHTML = renderIcon('LOG_VIEW');
          document.getElementById('global-alert-close').innerHTML = renderIcon('CLOSE', { width: 24, height: 24, classes: 'alert-icon' });
          document.getElementById('hamburger-btn').innerHTML = renderIcon('HAMBURGER', { width: 28, height: 28 });

          document.querySelectorAll('.modal-close-btn').forEach(btn => {
              btn.innerHTML = renderIcon('CLOSE');
          });
      }

      export function populateInitialText() {
        document.title = UI_TEXT.MAIN_TITLE;
        document.getElementById('main-title').textContent = UI_TEXT.MAIN_TITLE;
        document.querySelector('#nav-planner span').textContent = UI_TEXT.NAV_PLANNER;
        document.querySelector('#nav-progress span').textContent = UI_TEXT.NAV_PROGRESS;
        document.querySelector('#nav-charts span').textContent = UI_TEXT.NAV_CHARTS;
        document.querySelector('#nav-recipes span').textContent = UI_TEXT.NAV_RECIPES;
        document.querySelector('#nav-goals span').textContent = UI_TEXT.NAV_GOALS;
        document.querySelector('#nav-profile span').textContent = UI_TEXT.NAV_PROFILE;
        document.getElementById('load-config-btn').textContent = UI_TEXT.LOAD_BUTTON;
        document.getElementById('reset-btn').textContent = UI_TEXT.RESET_BUTTON;
        document.getElementById('copy-week-btn').textContent = UI_TEXT.COPY_WEEK_BTN;
        document.getElementById('backup-btn').textContent = UI_TEXT.BACKUP_BTN;
        document.getElementById('restore-btn').textContent = UI_TEXT.RESTORE_BTN;
        document.getElementById('info-modal-title').textContent = UI_TEXT.INFO_MODAL_TITLE;
        document.getElementById('info-modal-desc').textContent = UI_TEXT.INFO_MODAL_DESC;
        document.getElementById('info-modal-json-example').textContent = UI_TEXT.INFO_MODAL_EXAMPLE_JSON;
        document.getElementById('biometrics-title').textContent = UI_TEXT.BIOMETRICS_FORM_TITLE;
        document.getElementById('biometrics-history-title').textContent = UI_TEXT.BIOMETRICS_HISTORY_TITLE;
        document.getElementById('profile-title').textContent = UI_TEXT.PROFILE_FORM_TITLE;
        document.getElementById('charts-title').textContent = UI_TEXT.CHARTS_TITLE;
        document.getElementById('planner-chart-title').textContent = UI_TEXT.PLANNER_CHART_TITLE;
        document.getElementById('biometrics-chart-title').textContent = UI_TEXT.BIOMETRICS_CHART_TITLE;
        document.getElementById('recipes-title').textContent = UI_TEXT.RECIPES_TITLE;
        document.querySelector('#charts-page .btn-chart-type[data-type=\"bar\"]').textContent = UI_TEXT.CHART_BAR_VIEW_BTN;
        document.querySelector('#charts-page .btn-chart-type[data-type=\"line\"]').textContent = UI_TEXT.CHART_LINE_VIEW_BTN;
        document.getElementById('debriefing-title').textContent = UI_TEXT.DEBRIEFING_TITLE;
        document.getElementById('back-to-planner-btn').textContent = UI_TEXT.DEBRIEFING_BACK_BTN;
        populateIcons();
      }

      export function renderApp() {
        const state = getState();
        const plannerPage = document.getElementById('planner-page');
        const progressPage = document.getElementById('progress-page');
        const chartsPage = document.getElementById('charts-page');
        const recipesPage = document.getElementById('recipes-page');
        const goalsPage = document.getElementById('goals-page');
        const profilePage = document.getElementById('profile-page');
        const trainerPage = document.getElementById('trainer-page');
        const debriefingPage = document.getElementById('debriefing-page');

        const navPlannerBtn = document.getElementById('nav-planner');
        const navProgressBtn = document.getElementById('nav-progress');
        const navChartsBtn = document.getElementById('nav-charts');
        const navRecipesBtn = document.getElementById('nav-recipes');
        const navGoalsBtn = document.getElementById('nav-goals');
        const navProfileBtn = document.getElementById('nav-profile');

        log('Renderer', 'Render triggered. Current view:', state.currentView, 'isTrainerActive:', isTrainerActive);

        if (state.currentView !== 'trainer' && isTrainerActive) {
            log('Renderer', 'View is not trainer, destroying trainer controller...');
            destroyTrainerController();
            isTrainerActive = false;
        }

        [plannerPage, progressPage, chartsPage, recipesPage, goalsPage, profilePage, trainerPage, debriefingPage].forEach(p => p.classList.add('hidden'));
        [navPlannerBtn, navProgressBtn, navChartsBtn, navRecipesBtn, navGoalsBtn, navProfileBtn].forEach(b => b.classList.remove('active'));
        document.getElementById('main-nav').classList.remove('is-open', 'is-mobile');

        if (state.currentView === 'planner' || state.currentView === 'log') {
          plannerPage.classList.remove('hidden');
          navPlannerBtn.classList.add('active');
          renderPlannerPage(state);
        } else if (state.currentView === 'progress') {
          progressPage.classList.remove('hidden');
          navProgressBtn.classList.add('active');
          renderBiometricsPage(state);
        } else if (state.currentView === 'charts') {
          chartsPage.classList.remove('hidden');
          navChartsBtn.classList.add('active');
          renderChartsPage(state);
        } else if (state.currentView === 'recipes') {
          recipesPage.classList.remove('hidden');
          navRecipesBtn.classList.add('active');
          renderRecipesPage(state);
        } else if (state.currentView === 'goals') {
          goalsPage.classList.remove('hidden');
          navGoalsBtn.classList.add('active');
          renderGoalsPage(state);
        } else if (state.currentView === 'profile') {
          profilePage.classList.remove('hidden');
          navProfileBtn.classList.add('active');
          renderProfilePage(state);
        } else if (state.currentView === 'trainer') {
          trainerPage.classList.remove('hidden');
          log('Renderer', 'View is trainer, checking if trainer is active...');
          if (!isTrainerActive) {
            log('Renderer', 'Trainer is not active, initializing trainer controller...');
            initializeTrainerController();
            isTrainerActive = true;
          }
        } else if (state.currentView === 'debriefing') {
          debriefingPage.classList.remove('hidden');
          renderDebriefingPage(state);
        }

        const urlInput = document.getElementById('config-url-input');
        if (document.activeElement !== urlInput) urlInput.value = state.configUrl;
      }
  - file: src/main.js
    content: |
      import { loadStateFromLocalStorage, getState, setPlannerConfig, setConfigUrl, toggleDebugMode } from './core/state.js';
      import { renderApp, populateInitialText } from './ui/renderer.js';
      import { showConfirmModal } from './ui/modals.js';
      import { initializeGlobalListeners } from './ui/interactions/globalInteractions.js';
      import { initializePlannerListeners } from './ui/interactions/plannerInteractions.js';
      import { initializeProgressListeners } from './ui/interactions/progressInteractions.js';
      import { initializeProfileListeners } from './ui/interactions/profileInteractions.js';
      import { initializeDebriefingListeners } from './ui/interactions/debriefingInteractions.js';
      import { initializeGoalsListeners } from './ui/interactions/goalsInteractions.js';
      import { initializeChartsListeners } from './ui/interactions/chartsInteractions.js';
      import { loadViews } from './ui/viewLoader.js';
      import { DEFAULT_CONFIG_URL } from './utils/constants.js';
      import { UI_TEXT } from './config/uiText.js';
      import { fetchAndParseConfig } from './api/configService.js';
      import { showNotification } from './ui/notifications.js';

      async function loadConfig(url) {
        if (!url) {
          setPlannerConfig({}, url);
          return;
        };
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config, url);
          showNotification(UI_TEXT.CONFIG_LOAD_SUCCESS, 'success');
        } catch (error) {
          showNotification(error.message, 'error');
          setPlannerConfig({}, url);
        }
      }

      function registerServiceWorker() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/dietplanner/sw.js')
              .then(registration => console.log('ServiceWorker registration successful'))
              .catch(err => console.log('ServiceWorker registration failed: ', err));
          });
        }
      }

      async function init() {
        await loadViews();
        document.addEventListener('stateChange', renderApp);

        loadStateFromLocalStorage();
        let initialState = getState();
        document.getElementById('config-url-input').value = initialState.configUrl || DEFAULT_CONFIG_URL;

        populateInitialText();

        initializeGlobalListeners();
        initializePlannerListeners();
        initializeProgressListeners();
        initializeProfileListeners();
        initializeDebriefingListeners();
        initializeGoalsListeners();
        initializeChartsListeners();

        renderApp();

        window.toggleDebugMode = toggleDebugMode;

        const urlParams = new URLSearchParams(window.location.search);
        const configUrlFromParam = urlParams.get('configUrl');

        if (configUrlFromParam) {
          const decodedUrl = decodeURIComponent(configUrlFromParam);
          initialState = getState();
          if (decodedUrl !== initialState.configUrl) {
            showConfirmModal(
              UI_TEXT.LOAD_SHARED_CONFIG_TITLE,
              UI_TEXT.LOAD_SHARED_CONFIG_MSG,
              () => {
                setConfigUrl(decodedUrl);
                document.getElementById('config-url-input').value = decodedUrl;
                loadConfig(decodedUrl);
              },
              'primary'
            );
          } else {
            await loadConfig(initialState.configUrl);
          }
        } else {
          await loadConfig(initialState.configUrl);
        }

        registerServiceWorker();
      }

      document.addEventListener('DOMContentLoaded', init);
  - file: src/ui/interactions/chartsInteractions.js
    content: |
      import { getState } from '../../core/state.js';
      import { handleChartTypeChange, handleRangeFilterChange } from '../charts.js';

      export function initializeChartsListeners() {
        const chartsPage = document.getElementById('charts-page');
        
        chartsPage.addEventListener('click', (e) => {
          const state = getState();
          if (e.target.closest('.chart-type-switcher')) {
            handleChartTypeChange(e, state);
          }
          if (e.target.closest('#charts-range-filter')) {
            handleRangeFilterChange(e, state);
          }
        });
      }