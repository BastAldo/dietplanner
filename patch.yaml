commit_message: "fix(trainer): Correct module imports to resolve crash"
rationale: |
  Questa patch risolve un errore critico (`Uncaught SyntaxError`) che impediva l'avvio del modulo Allenamento.

  **Causa del Problema:**
  L'errore era causato da un'istruzione di importazione errata nel file `src/core/trainer/queueBuilder.js`. Il codice tentava di importare la funzione `getWorkoutState` (specifica per lo stato interno del trainer) dal file dello stato globale (`../state.js`), il quale non la esporta. Questo conflitto architetturale bloccava l'esecuzione del modulo.

  **Soluzione Implementata:**
  Le importazioni in `queueBuilder.js` sono state corrette per rispettare la separazione tra lo stato globale e lo stato locale del trainer:
  1.  `getWorkoutState` viene ora importato correttamente dal suo modulo di stato locale (`./state.js`).
  2.  `getState` continua ad essere importato dal modulo di stato globale (`../state.js`), ma è stato rinominato in `getGlobalState` per migliorare la leggibilità e prevenire ambiguità.

  Questa correzione riallinea il codice all'architettura a stati separati, risolve il crash e ripristina la piena funzionalità del modulo Allenamento.
patches:
  - file: src/core/trainer/queueBuilder.js
    content: |
      import { getWorkoutState } from './state.js';
      import { getState as getGlobalState } from '../state.js';
      import { UI_TEXT } from '../../config/uiText.js';

      export function buildExecutionQueueForCurrentSet() {
        const state = getWorkoutState();
        const currentExercise = state.exerciseQueue[state.currentExerciseIndex];
        if (!currentExercise || currentExercise.type !== 'reps') return [];

        const queue = [];
        const reps = currentExercise.defaultReps;
        const tempo = currentExercise.defaultTempo;

        queue.push({ type: 'speech', text: `${UI_TEXT.VOICE_GUIDE_SET_START}` });

        for (let i = 0; i < reps; i++) {
          if (tempo) {
            // UP
            queue.push({ type: 'speech', text: UI_TEXT.VOICE_GUIDE_PHASE_UP });
            queue.push({ name: 'pre-up', rep: i + 1, duration: 700 });
            queue.push({ name: 'up', rep: i + 1, duration: tempo.up * 1000 });
            queue.push({ type: 'audio', cue: 'tick' });

            // HOLD
            if (tempo.hold > 0) {
              queue.push({ type: 'speech', text: UI_TEXT.VOICE_GUIDE_PHASE_HOLD });
              queue.push({ name: 'pre-hold', rep: i + 1, duration: 700 });
              queue.push({ name: 'hold', rep: i + 1, duration: tempo.hold * 1000 });
              queue.push({ type: 'audio', cue: 'tick' });
            }

            // DOWN
            queue.push({ type: 'speech', text: UI_TEXT.VOICE_GUIDE_PHASE_DOWN });
            queue.push({ name: 'pre-down', rep: i + 1, duration: 700 });
            queue.push({ name: 'down', rep: i + 1, duration: tempo.down * 1000 });
            queue.push({ type: 'audio', cue: 'tick' });
          }
        }
        queue.push({ type: 'audio', cue: 'stop' });

        const { debugMode } = getGlobalState();
        if (debugMode) {
          console.groupCollapsed(`[Trainer-Queue] Execution Queue for: ${currentExercise.name} - Set ${state.currentSet}`);
          console.table(queue);
          console.groupEnd();
        }

        return queue;
      }
