    content: |
      function formatMealCalories(meal) {
        if (!meal || typeof meal.calories_min !== 'number') return '';
        const minCals = Number(meal.calories_min) || 0;
        const maxCals = Number(meal.calories_max) || minCals;
        if (minCals === 0 && maxCals === 0) return '';
        const kcalLabel = 'Kcal';
        if (minCals === maxCals) return `${minCals} ${kcalLabel}`;
        return `${minCals} - ${maxCals} ${kcalLabel}`;
      }

      export function formatDate(date) {
          const d = new Date(date);
          let month = '' + (d.getMonth() + 1);
          let day = '' + d.getDate();
          const year = d.getFullYear();

          if (month.length < 2)
              month = '0' + month;
          if (day.length < 2)
              day = '0' + day;

          return [year, month, day].join('-');
      }

      export function formatShortDate(date) {
          const d = new Date(date);
          let month = '' + (d.getMonth() + 1);
          let day = '' + d.getDate();

          if (month.length < 2)
              month = '0' + month;
          if (day.length < 2)
              day = '0' + day;

          return [day, month].join('/');
      }

      export function formatDateWithYear(date) {
          const d = new Date(date);
          let month = '' + (d.getMonth() + 1);
          let day = '' + d.getDate();
          const year = d.getFullYear();

          if (month.length < 2)
              month = '0' + month;
          if (day.length < 2)
              day = '0' + day;

          return [day, month, year].join('/');
      }

      export function formatIngredients(meal) {
          const ingredientsString = meal.ingredienti;
          if (!ingredientsString || typeof ingredientsString !== 'string') {
              return '';
          }
          const ingredients = ingredientsString.split(',').map(item => item.trim());
          if (ingredients.length === 0) {
              return '';
          }
          const details = `<div class="meal-item-details">${formatIngredientsSummary(meal)} | ${formatMealCalories(meal)}</div>`;
          return details;
      }

      export function formatIngredientsSummary(meal) {
        const ingredientsString = meal.ingredienti;
        if (!ingredientsString || typeof ingredientsString !== 'string') {
          return '';
        }
        return ingredientsString;
      }
  - file: src/ui/plannerRenderer.js
    content: |
      import { MEAL_TYPES, WEEK_STARTS_ON_MONDAY, DAYS, WORKOUT_SLOT_ID } from '../utils/constants.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { formatIngredientsSummary } from '../utils/formatters.js';

      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function formatShortDate(date) {
        return date.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
      }

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function formatMealCalories(meal) {
        if (!meal || typeof meal.calories_min !== 'number') return '';
        const minCals = Number(meal.calories_min) || 0;
        const maxCals = Number(meal.calories_max) || minCals;
        if (minCals === 0 && maxCals === 0) return '';
        const kcalLabel = UI_TEXT.KCAL_LABEL || 'Kcal';
        if (minCals === maxCals) return `${minCals} ${kcalLabel}`;
        return `${minCals} - ${maxCals} ${kcalLabel}`;
      }

      function calculateDailyCalories(isoDate, weeklyPlan) {
        let min = 0, max = 0;
        MEAL_TYPES.forEach(type => {
          const meal = weeklyPlan[`${isoDate}-${type}`];
          if (meal && typeof meal.calories_min === 'number') {
            const minCals = Number(meal.calories_min) || 0;
            const maxCals = Number(meal.calories_max) || minCals;
            min += minCals;
            max += maxCals;
          }
        });
        if (min === 0 && max === 0) return '';
        return min === max ? `${UI_TEXT.KCAL_LABEL}: ${min}` : `${UI_TEXT.KCAL_LABEL}: ${min} - ${max}`;
      }

      function getRecipeButtonHTML(meal, state) {
        const fullMeal = state.masterMealList.find(m => m.id === meal.id);
        if (state.recipeBaseUrl && fullMeal && fullMeal.recipeId) {
          return `<button class="btn-view-recipe" data-meal-id="${fullMeal.id}" title="${UI_TEXT.RECIPE_BUTTON_TITLE}">
                    ${renderIcon('RECIPE', { width: 20, height: 20 })}
                  </button>`;
        }
        return '';
      }

      function getSetDetails(setData) {
          let details = [];
          if (setData.reps) details.push(`${setData.reps} reps`);
          if (setData.weight) details.push(`${setData.weight} kg`);
          if (setData.duration) details.push(`${formatDuration(setData.duration)}`);
          return details.join(' / ');
      }

      function formatDuration(ms) {
          if (typeof ms !== 'number' || ms < 0) return '00:00';
          const totalSeconds = Math.floor(ms / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }

      function renderPlannerSummaryWidget(state, weekStart) {
        const widgetContainer = document.getElementById('planner-summary-widget');
        const { userGoals, biometricData, workoutHistory } = state;
        let totalCaloriesConsumed = 0;
        let dayCount = 0;
        let completedWorkouts = 0;
        let totalCaloriesBurned = 0;

        for (let i = 0; i < 7; i++) {
            const dayDate = new Date(weekStart);
            dayDate.setDate(dayDate.getDate() + i);
            const isoDate = toISODateString(dayDate);

            let dailyMin = 0;
            let hasMeals = false;
            MEAL_TYPES.forEach(type => {
                const meal = state.weeklyPlan[`${isoDate}-${type}`];
                if (meal) {
                    dailyMin += Number(meal.calories_min) || 0;
                    hasMeals = true;
                }
            });

            if (hasMeals) {
                totalCaloriesConsumed += dailyMin;
                dayCount++;
            }

            if (workoutHistory[isoDate]) {
                completedWorkouts += workoutHistory[isoDate].length;
                workoutHistory[isoDate].forEach(workout => {
                    totalCaloriesBurned += workout.totalCaloriesBurned || 0;
                });
            }
        }

        const avgCalories = dayCount > 0 ? Math.round(totalCaloriesConsumed / dayCount) : 0;
        const calGoal = userGoals.avg_calories || 0;
        const workoutGoal = userGoals.num_workouts || 0;
        const weightGoal = userGoals.target_weight || 0;
        const latestWeight = biometricData.length > 0 ? biometricData[0].weight : 0;
        const kgToGoal = (latestWeight && weightGoal) ? (latestWeight - weightGoal).toFixed(1) : 0;

        let weightProgressHTML = '';
        if (latestWeight > 0 && weightGoal > 0) {
            weightProgressHTML = `
            <div class="planner-summary-stat">
                <div class="stat-icon">${renderIcon('GOAL', {width: 20, height: 20})}</div>
                <div>
                    <span class="stat-value">${kgToGoal} kg</span>
                    <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_WEIGHT_PROGRESS}</span>
                </div>
            </div>`;
        }

        widgetContainer.innerHTML = `
            <h3 class="planner-summary-title">${UI_TEXT.PLANNER_SUMMARY_TITLE}</h3>
            <div class="planner-summary-stats">
                <div class="planner-summary-stat">
                    <div class="stat-icon">${renderIcon('PLANNER', {width: 20, height: 20})}</div>
                    <div>
                        <span class="stat-value">${avgCalories} ${calGoal > 0 ? `/ ${calGoal}`: ''}</span>
                        <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_AVG_KCAL}</span>
                    </div>
                </div>
                <div class="planner-summary-stat">
                    <div class="stat-icon">${renderIcon('DUMBBELL', {width: 20, height: 20})}</div>
                    <div>
                        <span class="stat-value">${completedWorkouts} ${workoutGoal > 0 ? `/ ${workoutGoal}`: ''}</span>
                        <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_WORKOUTS}</span>
                    </div>
                </div>
                <div class="planner-summary-stat">
                    <div class="stat-icon">${renderIcon('BAR_CHART', {width: 20, height: 20})}</div>
                    <div>
                        <span class="stat-value">${Math.round(totalCaloriesBurned)}</span>
                        <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_CALORIES_BURNED}</span>
                    </div>
                </div>
                ${weightProgressHTML}
            </div>
        `;
      }

      function renderCalendarView(state, weekStart) {
        const calendarGrid = document.getElementById('calendar-grid');
        const todayISO = toISODateString(new Date());
        calendarGrid.innerHTML = '';
        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const dayName = DAYS[i];
          const isoDate = toISODateString(dayDate);
          const dailyCalories = calculateDailyCalories(isoDate, state.weeklyPlan);
          const workoutList = state.weeklyWorkouts[`${isoDate}-${WORKOUT_SLOT_ID}`];

          let summaryHTML = `<div class="daily-calories">${dailyCalories}</div>`;
          let workoutButtonHTML = '';

          if (workoutList && workoutList.length > 0) {
              const exerciseCount = workoutList.length;
              const plural = exerciseCount > 1 ? UI_TEXT.PLANNER_EXERCISES_MULTI_LABEL : UI_TEXT.PLANNER_EXERCISES_SINGLE_LABEL;
              summaryHTML += `<div class="daily-summary-item">${renderIcon('DUMBBELL', {width: 16, height: 16})} ${exerciseCount} ${plural}</div>`;
              workoutButtonHTML = `<button class="btn btn-primary btn-start-workout-day" data-date="${isoDate}">${UI_TEXT.START_WORKOUT_BTN}</button>`;
          }

          const dayCell = document.createElement('div');
          dayCell.className = 'day-cell';
          if (isoDate === todayISO) {
            dayCell.classList.add('is-today');
          }
          dayCell.dataset.date = isoDate;
          dayCell.innerHTML = `
            <div class="day-cell__header"><span>${dayName}</span><span>${dayDate.getDate()}</span></div>
            <div class="day-cell__body">${summaryHTML}${workoutButtonHTML}</div>`;
          calendarGrid.appendChild(dayCell);
        }
      }

      function renderLogView(state, weekStart) {
        const logView = document.getElementById('log-view');
        const todayISO = toISODateString(new Date());
        let logViewHTML = '';
        let hasContent = false;

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          const dayMeals = MEAL_TYPES.map(type => ({ type, meal: state.weeklyPlan[`${isoDate}-${type}`] })).filter(item => item.meal);
          const completedWorkouts = state.workoutHistory[isoDate] || [];

          if (dayMeals.length > 0 || completedWorkouts.length > 0) {
            hasContent = true;
            let dayLogHTML = `<div class="log-day ${isoDate === todayISO ? 'is-today' : ''}">`;
            dayLogHTML += `<h3><span>${formatFullDate(isoDate)}</span><span class="log-day__total-calories">${calculateDailyCalories(isoDate, state.weeklyPlan)}</span></h3>`;

            if (dayMeals.length > 0) {
              dayLogHTML += dayMeals.map(item => `
                <div class="log-item">
                  <div class="log-item__name">
                    <div>
                      <strong>${item.type}:</strong>
                      <span>${item.meal.nomePasto}</span>
                      <div class="log-item-details">${formatIngredientsSummary(item.meal)}</div>
                    </div>
                    ${getRecipeButtonHTML(item.meal, state)}
                  </div>
                  <span class="log-item__calories">${formatMealCalories(item.meal)}</span>
                </div>`).join('');
            }

            if (completedWorkouts.length > 0) {
                completedWorkouts.forEach(workout => {
                    if (workout.type === 'structured') {
                        dayLogHTML += `<div class="log-workout-summary">
                            <div class="log-workout-header">
                                <h4>${UI_TEXT.LOG_VIEW_WORKOUT_TITLE}</h4>
                                <div class="log-workout-header-actions">
                                    <button class="btn-delete-workout" data-date="${workout.date}" data-starttime="${workout.startTime}" title="Elimina Allenamento">${renderIcon('TRASH')}</button>
                                </div>
                            </div>
                            <div class="log-workout-stats">
                                <span>Durata: ${formatDuration(workout.totalTime)}</span>
                                ${workout.totalCaloriesBurned > 0 ? `<span>/</span><span>Kcal: ${workout.totalCaloriesBurned}</span>` : ''}
                                ${workout.totalTonnage > 0 ? `<span>/</span><span>Volume: ${workout.totalTonnage} kg</span>` : ''}
                                ${workout.rpe ? `<span>/</span><span>RPE: ${workout.rpe}</span>` : ''}
                            </div>
                            ${workout.exercises.map(ex => `
                            <div class="log-workout-exercise">
                                <div class="log-item">
                                  <strong>${ex.name}</strong>
                                  <div class="log-workout-header-actions">
                                    <button class="btn-edit-logged-exercise" data-date="${workout.date}" data-starttime="${workout.startTime}" data-instanceid="${ex.instanceId}" title="Modifica Esercizio">${renderIcon('EDIT')}</button>
                                  </div>
                                </div>
                                <div class="log-sets-details">
                                ${ex.setsData.map((setData, i) => `
                                    <div class="log-set-item">
                                    <span>Serie ${i + 1}</span>
                                    <span>${getSetDetails(setData)}</span>
                                    </div>
                                `).join('')}
                                </div>
                            </div>
                            `).join('')}
                        </div>`;
                    } else if (workout.type === 'manual') {
                        let detailsHTML = '';
                        if (workout.distance) detailsHTML += `<div><strong>Distanza:</strong> ${workout.distance} km</div>`;
                        if (workout.fc_avg) detailsHTML += `<div><strong>FC Media:</strong> ${workout.fc_avg} bpm</div>`;
                        if (workout.fc_max) detailsHTML += `<div><strong>FC Max:</strong> ${workout.fc_max} bpm</div>`;
                        if (workout.notes) detailsHTML += `<div class="log-item-details">${workout.notes.replace(/\n/g, '<br>')}</div>`;

                        dayLogHTML += `<div class="log-workout-summary">
                            <div class="log-workout-header">
                                <h4>${UI_TEXT.LOG_VIEW_MANUAL_ACTIVITY_TITLE}</h4>
                                <div class="log-workout-header-actions">
                                  <button class="btn-delete-workout" data-date="${workout.date}" data-starttime="${workout.startTime}" title="Elimina Allenamento">${renderIcon('TRASH')}</button>
                                </div>
                            </div>
                            <div class="log-item">
                                <strong>${workout.name}</strong>
                                <span>${workout.duration || ''}</span>
                            </div>
                            ${detailsHTML ? `<div class="log-manual-details">${detailsHTML}</div>` : ''}
                        </div>`;
                    }
                });
            }

            dayLogHTML += `</div>`;
            logViewHTML += dayLogHTML;
          }
        }

        if (!hasContent) {
          logView.innerHTML = `<p class="placeholder-text">${UI_TEXT.LOG_VIEW_EMPTY}</p>`;
        } else {
          logView.innerHTML = logViewHTML;
        }
      }

      export function renderPlannerPage(state) {
        const weekStart = getWeekStartDate(state.focusedDate);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        document.getElementById('week-title').textContent = `${formatShortDate(weekStart)} - ${formatShortDate(weekEnd)}`;

        const calendarGrid = document.getElementById('calendar-grid');
        const logView = document.getElementById('log-view');
        const viewCalendarBtn = document.getElementById('view-calendar-btn');
        const viewLogBtn = document.getElementById('view-log-btn');
        const { currentView } = state.ui;

        if (currentView === 'planner' || currentView === 'log') {
            renderPlannerSummaryWidget(state, weekStart);
        }

        if (currentView === 'planner') {
            calendarGrid.classList.remove('hidden');
            logView.classList.add('hidden');
            viewCalendarBtn.classList.add('active');
            viewLogBtn.classList.remove('active');
        } else if (currentView === 'log') {
            calendarGrid.classList.add('hidden');
            logView.classList.remove('hidden');
            viewCalendarBtn.classList.remove('active');
            viewLogBtn.classList.add('active');
        }

        renderCalendarView(state, weekStart);
        renderLogView(state, weekStart);
      }
  - file: src/ui/modals/dayEditorModal.js
    content: |
      import { getState, updateWeeklyPlan, getMealsForType } from '../../core/state.js';
      import { MEAL_TYPES, WORKOUT_SLOT_ID } from '../../utils/constants.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { renderIcon } from '../icons.js';
      import { log } from '../../utils/logger.js';
      import { showRecipeModal } from './recipeModal.js';
      import { openSelectionModal } from './selectionModal.js';
      import { openWorkoutEditorModal } from './workoutEditorModal.js';
      import { openManualWorkoutModal } from './manualWorkoutModal.js';
      import { formatIngredients } from '../../utils/formatters.js';

      let currentEditingDayISO = null;

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function getRecipeButtonHTML(meal, state) {
        if (state.recipeBaseUrl && meal && meal.recipeId) {
          return `<button class="btn-view-recipe" data-meal-id="${meal.id}" title="${UI_TEXT.RECIPE_BUTTON_TITLE}">
                    ${renderIcon('RECIPE', { width: 20, height: 20 })}
                  </button>`;
        }
        return '';
      }

      export function openDayEditorModal(isoDate) {
        log('Modals', 'Opening day editor modal', { isoDate });
        currentEditingDayISO = isoDate;
        const state = getState();
        const dayEditorModal = document.getElementById('day-editor-modal');
        dayEditorModal.querySelector('#day-editor-title').textContent = `${UI_TEXT.EDITOR_MODAL_TITLE_PREFIX} ${formatFullDate(isoDate)}`;
        const body = dayEditorModal.querySelector('#day-editor-body');
        
        const mealSlotsHTML = MEAL_TYPES.map(mealType => {
          const slotId = `${isoDate}-${mealType}`;
          const plannedMeal = state.weeklyPlan[slotId];
          const meal = plannedMeal ? state.masterMealList.find(m => m.id === plannedMeal.id) : null;
          
          let mealDetailsHTML = `<button class="btn-add-meal" data-slot-id="${slotId}" data-meal-type="${mealType}">${UI_TEXT.ADD_MEAL_BTN}</button>`;
          if (meal) {
            mealDetailsHTML = `
              <div class="meal-details">
                <div>
                  <span class="meal-details__name">${meal.nomePasto}</span>
                  ${formatIngredients(meal)}
                </div>
                <div class="meal-actions">
                  ${getRecipeButtonHTML(meal, state)}
                  <button class="btn-remove-meal" data-slot-id="${slotId}">${renderIcon('TRASH', { width: 16, height: 16 })}</button>
                </div>
              </div>`;
          }
          return `<div class="day-editor-slot"><span class="meal-type-label">${mealType}</span><div class="meal-details-container">${mealDetailsHTML}</div></div>`;
        }).join('');

        const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
        const plannedWorkoutList = state.weeklyWorkouts[workoutSlotId] || [];
        
        let workoutDetailsHTML;
        if (plannedWorkoutList.length > 0) {
            const plural = plannedWorkoutList.length > 1 ? 'Esercizi' : 'Esercizio';
            workoutDetailsHTML = `<div class="workout-summary"><span>${plannedWorkoutList.length} ${plural}</span><div class="workout-summary-actions"><button class="btn-log-activity btn btn-secondary">${UI_TEXT.LOG_ACTIVITY_BTN}</button><button class="btn-manage-workout btn btn-secondary">${UI_TEXT.MANAGE_WORKOUT_BTN}</button></div></div>`;
        } else {
            workoutDetailsHTML = `<div class="workout-summary-actions"><button class="btn-log-activity btn btn-secondary">${UI_TEXT.LOG_ACTIVITY_BTN}</button><button class="btn-add-exercise" data-slot-id="${workoutSlotId}">${UI_TEXT.ADD_EXERCISE_BTN}</button></div>`;
        }
        
        const workoutSlotHTML = `<div class="day-editor-slot"><span class="meal-type-label">${WORKOUT_SLOT_ID}</span><div class="meal-details-container">${workoutDetailsHTML}</div></div>`;

        body.innerHTML = mealSlotsHTML + workoutSlotHTML;

        body.onclick = e => {
          const btnAddMeal = e.target.closest('.btn-add-meal');
          const btnRemoveMeal = e.target.closest('.btn-remove-meal');
          const btnRecipe = e.target.closest('.btn-view-recipe');
          const btnAddExercise = e.target.closest('.btn-add-exercise');
          const btnManageWorkout = e.target.closest('.btn-manage-workout');
          const btnLogActivity = e.target.closest('.btn-log-activity');

          if (btnAddMeal) {
            const mealType = btnAddMeal.dataset.mealType;
            const relevantMeals = getMealsForType(mealType);
            dayEditorModal.classList.add('modal-hidden');
            openSelectionModal(btnAddMeal.dataset.slotId, isoDate, relevantMeals);
          }
          else if (btnRemoveMeal) { updateWeeklyPlan(btnRemoveMeal.dataset.slotId, null); openDayEditorModal(isoDate); }
          else if (btnRecipe) {
            const meal = state.masterMealList.find(m => m.id === btnRecipe.dataset.mealId);
            if (meal) showRecipeModal(meal);
          }
          else if (btnAddExercise) {
            dayEditorModal.classList.add('modal-hidden');
            openWorkoutEditorModal(isoDate);
          }
          else if (btnManageWorkout) {
            dayEditorModal.classList.add('modal-hidden');
            openWorkoutEditorModal(isoDate);
          }
          else if (btnLogActivity) {
            dayEditorModal.classList.add('modal-hidden');
            openManualWorkoutModal(isoDate);
          }
        };
        dayEditorModal.classList.remove('modal-hidden');
      }
  - file: src/ui/modals/selectionModal.js
    content: |
      import { getState, updateWeeklyPlan, updateWeeklyWorkout } from '../../core/state.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';
      import { formatIngredients } from '../../utils/formatters.js';
      import { openDayEditorModal } from './dayEditorModal.js';
      import { openWorkoutEditorModal } from './workoutEditorModal.js';

      export function openSelectionModal(slotId, returnIsoDate, relevantMeals) {
        log('Modals', 'Opening meal selection modal', { slotId });
        const mealType = slotId.substring(11);
        const selectionModal = document.getElementById('selection-modal');
        selectionModal.querySelector('#selection-modal-title').textContent = `${UI_TEXT.SELECT_MEAL_TITLE} ${mealType}`;
        const list = selectionModal.querySelector('#selection-modal-list');
        list.innerHTML = relevantMeals.length > 0 ? relevantMeals.map(meal => `<div class="selection-item" data-meal-id="${meal.id}"><h4>${meal.nomePasto}</h4>${formatIngredients(meal)}</div>`).join('') : `<p>${UI_TEXT.NO_MEALS_AVAILABLE}</p>`;
        
        const closeAndReturn = () => {
          selectionModal.classList.add('modal-hidden');
          if (returnIsoDate) openDayEditorModal(returnIsoDate);
        };

        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if(item) { 
            updateWeeklyPlan(slotId, item.dataset.mealId); 
            closeAndReturn(); 
          }
        };
        selectionModal.classList.remove('modal-hidden');
      }

      export function openWorkoutSelectionModal(slotId, returnIsoDate) {
        log('Modals', 'Opening workout selection modal', { slotId });
        const state = getState();
        const workoutSelectionModal = document.getElementById('workout-selection-modal');
        workoutSelectionModal.querySelector('#workout-selection-modal-title').textContent = UI_TEXT.SELECT_EXERCISE_TITLE;
        const list = workoutSelectionModal.querySelector('#workout-selection-modal-list');
        const relevantWorkouts = state.masterWorkoutList;
        list.innerHTML = relevantWorkouts.length > 0 ? relevantWorkouts.map(ex => `<div class="selection-item" data-exercise-id="${ex.id}"><h4>${ex.name}</h4><p>${ex.description}</p></div>`).join('') : `<p>${UI_TEXT.NO_WORKOUTS_AVAILABLE}</p>`;
        
        const closeAndReturn = () => {
          workoutSelectionModal.classList.add('modal-hidden');
          if (returnIsoDate) openWorkoutEditorModal(returnIsoDate);
        };

        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if (item) {
            updateWeeklyWorkout(slotId, item.dataset.exerciseId);
            closeAndReturn();
          }
        };
        workoutSelectionModal.classList.remove('modal-hidden');
      }
  - file: styles/modals.css
    content: |
      /* --- MODALS --- */
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1001; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
      .modal-hidden { display: none !important; }
      .modal-overlay:not(.modal-hidden) { display: flex; opacity: 1; pointer-events: all; }
      .modal-content { background-color: var(--card-color); border-radius: 8px; border: 1px solid var(--border-color); width: 90%; max-width: 600px; display: flex; flex-direction: column; max-height: 90vh; position: relative; }
      .modal-content-large { max-width: 95vw; width: 95vw; height: 90vh; max-height: 90vh; }
      .modal-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); }
      .modal-header h3 { color: var(--primary-color); }
      .modal-close-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-color-muted); padding: 0; line-height: 1; width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background-color 0.2s, color 0.2s; z-index: 10; }
      .modal-close-btn svg { width: 1em; height: 1em; }
      .modal-close-btn:hover { background-color: rgba(255, 255, 255, 0.1); color: var(--text-color); }
      .modal-body { overflow-y: auto; flex-grow: 1; padding: 1.5rem; display: flex; flex-direction: column; }
      #chart-modal-body { padding: 1rem; }
      #chart-modal-canvas { max-height: 100%; }
      .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 1rem; }
      .selection-list { display: flex; flex-direction: column; gap: 0.5rem; }
      .selection-item { padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: background-color 0.2s, border-color 0.2s; }
      .selection-item:hover { background-color: var(--bg-color); border-color: var(--primary-color); }
      .meal-item-details { font-size: 0.85rem; color: var(--text-color-muted); margin-top: 0.25rem; }
      .day-editor-list { display: flex; flex-direction: column; gap: 0.5rem; }
      .day-editor-slot { display: flex; align-items: center; gap: 1rem; padding: 0.75rem; background: var(--bg-color); border-radius: 8px; }
      .day-editor-slot .meal-type-label { font-weight: bold; color: var(--text-color-muted); flex-shrink: 0; width: 150px; }
      .meal-details-container { flex-grow: 1; min-width: 0; }
      .workout-summary { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 1rem; }
      .workout-summary-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .meal-details { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.5rem; border-bottom: 1px solid var(--border-color); }
      .meal-details:last-of-type { border-bottom: none; }
      .meal-details__name { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-weight: 500;}
      .meal-actions { display: flex; align-items: center; gap: 0.25rem; flex-shrink: 0; margin-left: auto; }
      .meal-actions button { background: none; border: none; color: var(--text-color-muted); cursor: pointer; padding: 0.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
      .meal-actions button:hover { background-color: rgba(255,255,255,0.1); color: var(--text-color); }
      .meal-actions .btn-remove-exercise { color: var(--danger-color); }
      .exercise-info { display: flex; flex-direction: column; gap: 0.25rem; }
      .exercise-details-summary { font-size: 0.85rem; color: var(--text-color-muted); }
      .btn-add-meal, .btn-add-exercise { background: transparent; border: 1px dashed var(--border-color); color: var(--text-color-muted); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; width: 100%; transition: all 0.2s; }
      .btn-add-meal:hover, .btn-add-exercise:hover { background: var(--card-color); border-color: var(--secondary-color); color: var(--secondary-color); }

      #exercise-editor-form {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 1rem;
        align-items: end;
      }
      #exercise-editor-form .form-group { display: flex; flex-direction: column; }
      #exercise-editor-form label { margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-color-muted); }
      #exercise-editor-form input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; background-color: var(--bg-color); color: var(--text-color); }
      #exercise-editor-form .sets-group { grid-column: 1 / 3; }
      #exercise-editor-form .reps-group, #exercise-editor-form .duration-group { grid-column: 3 / 5; }
      #exercise-editor-form .rest-group { grid-column: 5 / 7; }
      #exercise-editor-form .weight-group { grid-column: 1 / 4; }
      #exercise-editor-form .tempo-group {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        border-top: 1px solid var(--border-color);
        padding-top: 1rem;
        margin-top: 1rem;
      }

      /* Stili per il nuovo editor dei log */
      #logged-exercise-form { display: flex; flex-direction: column; gap: 1rem; }
      .set-editor-row {
        display: grid;
        grid-template-columns: 50px 1fr 1fr;
        gap: 1rem;
        align-items: end;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      #logged-exercise-form .set-editor-row:last-child { border-bottom: none; }
      .set-editor-label {
        font-weight: bold;
        color: var(--text-color-muted);
        padding-bottom: 0.75rem;
      }

      .structured-form { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
      .structured-form .full-width { grid-column: 1 / -1; }

      .drag-handle { cursor: grab; color: var(--text-color-muted); padding: 0.5rem; }
      .draggable-item { background-color: var(--bg-color); border-radius: 8px; }
      .sortable-ghost { opacity: 0.4; background: var(--primary-color); }

      @media (min-width: 600px) {
        .structured-form {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 480px) {
        .workout-summary {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.75rem;
        }
        .workout-summary-actions {
          width: 100%;
          display: flex;
          flex-wrap: wrap;
        }
        .workout-summary-actions .btn {
          flex-grow: 1;
        }
      }
  - file: styles/planner.css
    content: |
      /* --- PLANNER PAGE --- */
      .data-source-container {
          display: flex; align-items: center; gap: 0.75rem;
          padding: 1rem; background: var(--card-color);
          border: 1px solid var(--border-color); border-radius: 8px;
          margin-bottom: 1.5rem;
      }
      #config-url-input {
          flex-grow: 1; min-width: 0; padding: 0.75rem;
          border: 1px solid var(--border-color); border-radius: 8px;
          font-size: 1rem; background-color: var(--bg-color);
          color: var(--text-color);
      }
      #config-url-input:focus { outline: none; border-color: var(--primary-color); }
      #info-icon { font-size: 1.5rem; cursor: pointer; color: var(--text-color-muted); flex-shrink: 0; }

      .planner-summary-widget {
          background: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
          margin-bottom: 1.5rem;
      }
      .planner-summary-title {
          color: var(--secondary-color);
          text-align: center;
          margin-bottom: 1.5rem;
          font-size: 1.25rem;
      }
      .planner-summary-stats {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 1.5rem;
          align-items: center;
          justify-content: center;
      }
      .planner-summary-stat {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          justify-content: center;
      }
      .planner-summary-stat .stat-icon {
          color: var(--secondary-color);
      }
      .planner-summary-stat .stat-value {
          font-size: 1.5rem;
          font-weight: bold;
          color: var(--primary-color);
      }
      .planner-summary-stat .stat-label {
          font-size: 0.8rem;
          color: var(--text-color-muted);
          text-transform: uppercase;
      }

      .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .calendar-header h2 { font-size: 1.25rem; text-align: center; color: var(--text-color); }
      .planner-controls-wrapper {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
      }
      .view-switcher { display: flex; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
      .btn-view { background: transparent; border: none; padding: 0.5rem; color: var(--text-color-muted); cursor: pointer; display: flex; align-items: center; }
      .btn-view.active { background: var(--primary-color); color: var(--bg-color); }
      .btn-view:not(:last-child) { border-right: 1px solid var(--border-color); }
      .planner-actions { display: flex; gap: 0.75rem; }
      .calendar-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
      .day-cell {
          background-color: var(--card-color); border: 1px solid var(--border-color);
          border-radius: 8px; padding: 1rem; min-height: 120px; display: flex;
          flex-direction: column; transition: all 0.2s;
      }
      .day-cell:not(:has(.btn-start-workout-day)) { cursor: pointer; }
      .day-cell:not(:has(.btn-start-workout-day)):hover { border-color: var(--primary-color); transform: translateY(-3px); }
      .day-cell.is-today {
        border-color: var(--primary-color);
        box-shadow: 0 0 10px rgba(149, 117, 205, 0.5);
      }
      .day-cell__header { display: flex; justify-content: space-between; font-weight: bold; color: var(--text-color-muted); text-transform: uppercase; font-size: 0.8rem; pointer-events: none; }
      .day-cell__body { margin-top: 0.5rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; pointer-events: none; }
      .daily-calories { font-size: 1rem; font-weight: bold; color: var(--secondary-color); }
      .daily-summary-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
      .btn-start-workout-day {
        pointer-events: all;
        width: 100%;
        margin-top: 1rem;
        padding: 0.5rem;
        font-size: 0.85rem;
      }
      .log-view { padding: 1rem; background: var(--card-color); border-radius: 8px; border: 1px solid var(--border-color); }
      .log-day { margin-bottom: 2rem; }
      .log-day:last-child { margin-bottom: 0; }
      .log-day h3 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 0.5rem; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
      .log-day.is-today h3 {
        color: var(--primary-color);
        font-weight: bold;
      }
      .log-day__total-calories { font-size: 0.9rem; font-weight: normal; color: var(--text-color-muted); }
      .log-item { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 0; font-size: 0.95rem; border-bottom: 1px solid var(--border-color); }
      .log-day .log-item:last-child { border-bottom: none; }
      .log-item__name { display: flex; align-items: center; gap: 0.5rem; }
      .log-item strong { color: var(--text-color-muted); }
      .log-item__calories { font-weight: bold; color: var(--secondary-color); flex-shrink: 0; }
      .log-item-details { font-size: 0.85rem; color: var(--text-color-muted); margin-top: 0.25rem; }

      .log-workout-summary { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border-color); }
      .log-workout-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .log-workout-header h4 { color: var(--secondary-color); font-size: 1rem; margin: 0; }
      .log-workout-header-actions { display: flex; gap: 0.5rem; }
      .btn-delete-workout, .btn-edit-logged-exercise { background: none; border: none; color: var(--text-color-muted); cursor: pointer; padding: 0.25rem; border-radius: 4px; display: flex; }
      .btn-delete-workout:hover { color: var(--danger-color); background-color: rgba(239, 83, 80, 0.1); }
      .btn-edit-logged-exercise:hover { color: var(--primary-color); background-color: rgba(149, 117, 205, 0.1); }
      .log-workout-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        font-size: 0.85rem;
        color: var(--text-color-muted);
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      .log-workout-exercise { margin-bottom: 1rem; }
      .log-workout-exercise .log-item { border-bottom: none; }
      .log-sets-details { padding-left: 1rem; border-left: 2px solid var(--border-color); margin-top: 0.5rem; }
      .log-set-item { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 0.25rem 0; }
      .log-set-item span:first-child { color: var(--text-color-muted); }

      .log-manual-details {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        padding: 0.75rem 0;
        font-size: 0.9rem;
      }
      .log-manual-details div {
        word-break: break-word;
      }
      .log-item-details {
        font-style: italic;
        color: var(--text-color-muted);
        width: 100%;
      }


      @media (min-width: 768px) {
          #app-container { padding: 2rem; }
          .calendar-grid { grid-template-columns: repeat(7, 1fr); gap: 1rem; }
      }
  - file: styles/trainer.css
    content: |
      /* --- TRAINER VIEW STYLES --- */
      #trainer-page {
          height: calc(100vh - 60px);
          display: flex;
          flex-direction: column;
          background-color: var(--bg-color);
          color: var(--text-color);
      }

      .trainer-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          background-color: var(--card-color);
          border-bottom: 1px solid var(--border-color);
          flex-shrink: 0;
          gap: 1rem;
      }

      .trainer-header h2 {
          font-size: 1.25rem;
          color: var(--primary-color);
          flex-shrink: 1;
          min-width: 0;
          text-align: center;
      }

      .trainer-header-controls {
          display: flex;
          gap: 0.5rem;
          align-items: center;
      }

      #audio-toggle-btn {
          background: none;
          border: none;
          color: var(--text-color-muted);
          cursor: pointer;
          padding: 0.5rem;
      }

      #audio-toggle-btn.active {
          color: var(--primary-color);
      }

      .trainer-body {
          flex-grow: 1;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          text-align: center;
          position: relative;
          overflow-y: auto;
      }

      .exercise-info-container {
          margin-top: 1rem;
          margin-bottom: 1rem;
      }

      #current-exercise-name {
          font-size: 2rem;
          font-weight: bold;
          min-height: 1.2em;
      }

      #current-exercise-details {
          font-size: 1.25rem;
          color: var(--text-color-muted);
          margin-bottom: 0.5rem;
          min-height: 1.2em;
      }

      #current-rep-display {
        font-size: 1rem;
        color: var(--secondary-color);
        font-weight: bold;
        min-height: 1.2em;
      }

      #current-rep-display.hidden-rep {
        visibility: hidden;
      }

      #upcoming-exercise-display {
        font-size: 0.9rem;
        color: var(--text-color-muted);
        margin-top: 0.75rem;
        font-style: italic;
      }

      #upcoming-exercise-display strong {
        color: var(--text-color);
        font-style: normal;
      }

      #trainer-display-modes {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-grow: 1;
          min-height: 280px;
      }

      .timer-ring-container {
          width: 280px;
          height: 280px;
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          margin: 1rem 0;
      }

      .timer-ring-display {
          font-size: 3rem;
          font-weight: bold;
          fill: var(--text-color);
          text-anchor: middle;
      }

      .timer-ring-display.is-timer,
      .timer-ring-display.is-rep-count {
          font-family: 'Courier New', Courier, monospace;
      }

      .timer-ring-display.is-phase {
          font-size: 2.5rem;
          text-transform: uppercase;
      }


      .timer-ring-bg {
          fill: none;
          stroke: var(--card-color);
          stroke-width: 12;
      }

      .timer-ring-progress {
          fill: none;
          stroke: var(--primary-color);
          stroke-width: 12;
          stroke-linecap: round;
          transform: rotate(-90deg);
          transform-origin: 50% 50%;
          transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
      }

      .timer-ring-progress.is-rest {
          stroke: var(--secondary-color);
      }

      @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .flashing {
        animation: flash 1.4s infinite;
        fill: var(--primary-color);
      }

      .trainer-controls {
          display: flex;
          gap: 1rem;
          justify-content: center;
          align-items: center;
          margin-top: 1rem;
          height: 80px;
          width: 100%;
          padding-bottom: 1rem;
      }

      .btn-large {
          padding: 1rem 2rem;
          font-size: 1.25rem;
      }
