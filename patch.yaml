commit_message: "feat(planner): Implement customizable meal slots"
rationale: |
  This commit implements Phase 3 of the development plan, introducing customizable meal slots to enhance the application's flexibility. Users can now enable optional meal slots (Pre-Workout, Post-Workout, Pre-Nanna) directly from their profile settings.

  The key changes are:
  1.  **Profile Preferences**: The user profile page now includes a "Planner Preferences" section with checkboxes to toggle the visibility of optional meal slots. These preferences are saved to the `userProfile` object in `localStorage`.
  2.  **Dynamic Day Editor**: The `openDayEditorModal` function has been refactored. It no longer relies on a hardcoded list of meal types. Instead, it dynamically constructs the list of slots to display by combining the standard meal types with any optional slots the user has enabled in their profile.
  3.  **Updated Constants**: A new `ALL_MEAL_TYPES` constant has been introduced to serve as the single source of truth for all possible meal types, ensuring consistency across the meal editor and the day editor.
  4.  **UI Enhancements**: The necessary UI text and form field definitions have been added to support the new profile settings, ensuring a seamless user experience.
