commit_message: "fix: Rende la navigazione dell'header responsive su mobile"
rationale: |
  Questa patch risolve un problema di layout per cui i pulsanti di navigazione nell'header ("Planner", "Progressi", "Profilo") causavano uno "spaginamento" su schermi di piccole dimensioni.

  Seguendo il piano approvato, sono state apportate le seguenti modifiche:
  1.  **HTML (`index.html`)**: Ogni pulsante di navigazione ora contiene un'icona SVG rappresentativa e il testo originale è stato avvolto in un tag `<span>`. Questa struttura permette un controllo CSS granulare sulla visibilità di icone e testo.
  2.  **CSS (`styles/base.css`)**: Sono state introdotte nuove regole e una media query. Su schermi con larghezza inferiore a 768px, solo le icone sono visibili, risolvendo il problema di overflow. Su schermi più grandi, sia le icone che le etichette di testo vengono mostrate per garantire la massima chiarezza, aderendo ai principi di un design "mobile-first".
patches:
  - file: index.html
