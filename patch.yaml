        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        border-top: 1px solid var(--border-color);
        padding-top: 1rem;
        margin-top: 1rem;
      }
      #exercise-editor-form .reps-range-group { grid-column: 3 / 7; }
      
      /* Stili per il nuovo editor dei log */
      #logged-exercise-form { display: flex; flex-direction: column; gap: 1rem; }
      .set-editor-row {
        display: grid;
        grid-template-columns: 50px 1fr 1fr;
        gap: 1rem;
        align-items: end;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      #logged-exercise-form .set-editor-row:last-child { border-bottom: none; }
      .set-editor-label {
        font-weight: bold;
        color: var(--text-color-muted);
        padding-bottom: 0.75rem;
      }
      
      .structured-form { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
      .structured-form .full-width { grid-column: 1 / -1; }
      
      .drag-handle { cursor: grab; color: var(--text-color-muted); padding: 0.5rem; }
      .sortable-ghost { opacity: 0.4; background: var(--primary-color); }
      
      /* --- MEAL EDITOR MODAL --- */
      #meal-editor-form { display: flex; flex-direction: column; gap: 1.5rem; }
      .meal-editor-form-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
      .meal-type-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .checkbox-group { /* Alias per .meal-type-group */
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .meal-type-chip {
        padding: 0.5rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
