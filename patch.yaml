commit_message: "fix(pwa): Correct syntax error in manifest.json"
rationale: |
  This commit fixes a critical syntax error in `manifest.json` that was preventing the PWA from being installable. The file content has been regenerated and validated to be 100% correct JSON.

  This is a targeted patch that only modifies the single problematic file, as per the new directive. The successful registration of the service worker indicates that this was the final blocker for PWA functionality.
patches:
  - file: manifest.json
    content: |
      {
        "name": "NutriPlan",
        "short_name": "NutriPlan",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#121212",
        "theme_color": "#1E1E1E",
        "description": "Un assistente per creare e gestire piani alimentari flessibili.",
        "icons": [
          {
            "src": "icon.svg",
            "sizes": "any",
            "type": "image/svg+xml"
          }
        ]
      }
commands:
  - "echo 'Manifest file corrected. Please clear the browser cache and data for the site one last time and re-test.'"