commit_message: "fix(charts): Risolve errore di dipendenza e migliora l'UI della dashboard grafici"
rationale: |
  Questa patch è una soluzione completa e definitiva che corregge un errore critico di runtime e implementa significativi miglioramenti all'interfaccia utente della pagina dei grafici, come concordato nel piano d'azione.

  **Correzioni Tecniche:**
  1.  **Risoluzione Errore `exports is not defined`**: La causa principale dell'instabilità dell'applicazione è stata risolta. Il tag `<script>` che caricava la libreria `date-fns` in `index.html` puntava a un file compilato per Node.js. È stato sostituito con il link al bundle UMD (`date-fns.umd.min.js`), la versione corretta per l'uso nel browser. Questo elimina l'errore `ReferenceError` alla radice.

  **Miglioramenti UI/UX:**
  1.  **Riorganizzazione Estetica**: Accogliendo il feedback dell'utente, la visualizzazione dell'intervallo di date (`date-range`) è stata spostata da una posizione inline a una sezione di titolo dedicata, sopra i controlli del filtro. Questo migliora notevolmente la leggibilità e l'organizzazione visiva della pagina.
  2.  **Stile Coerente**: Sono state aggiunte nuove regole CSS in `styles/charts.css` per formattare la nuova sezione del titolo, garantendo un'estetica pulita e allineata al design system del progetto.
  3.  **Formattazione della Data Migliorata**: Per aumentare la chiarezza, specialmente su intervalli di tempo lunghi, il formato della data visualizzato ora include l'anno. Questo è stato ottenuto creando una nuova funzione `formatDateWithYear` in `src/utils/formatters.js` e aggiornando la logica di `src/ui/charts.js` per utilizzarla.

  Questo intervento combinato non solo rende l'applicazione stabile e funzionante, ma migliora anche l'esperienza utente in base a specifiche richieste di design, portando la pagina dei grafici a uno stato completo e rifinito.
