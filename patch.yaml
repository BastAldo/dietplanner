commit_message: "feat(charts): Migliora layout e arricchisce il grafico biometrico"
rationale: |
  Questo commit implementa diversi miglioramenti alla pagina dei grafici basati sul feedback dell'utente, con l'obiettivo di aumentare la leggibilità e l'utilità dei dati visualizzati.

  Le modifiche principali sono:
  1.  **Layout a Colonna Singola**: I grafici sono ora impilati verticalmente su tutte le dimensioni dello schermo. Questo layout migliora l'uso dello spazio orizzontale, rendendo ogni grafico più largo e più facile da leggere, specialmente su tablet e schermi di medie dimensioni. La modifica è stata ottenuta rimuovendo la regola `grid-template-columns` per schermi desktop.
  2.  **Arricchimento Dati Biometrici**: Il grafico dei dati biometrici è stato potenziato per visualizzare non solo il peso, ma anche altre metriche chiave come la massa muscolare, la massa grassa e la percentuale di grasso. La funzione di rendering ora genera dinamicamente un dataset per ogni metrica disponibile, con colori distinti per una facile identificazione tramite la legenda.
  3.  **Ordinamento Cronologico Confermato**: È stato verificato che l'asse temporale del grafico biometrico sia già corretto, mostrando i dati in ordine cronologico dal più vecchio (a sinistra) al più recente (a destra).

  Questi aggiornamenti rendono la sezione dei grafici uno strumento di analisi più potente e intuitivo per l'utente.
patches:
  - file: src/ui/charts.js
    content: |
      import { MEAL_TYPES, DAYS, WEEK_STARTS_ON_MONDAY, BIOMETRIC_FIELDS } from '../utils/constants.js';

      let plannerChartInstance = null;
      let biometricsChartInstance = null;
      let currentPlannerChartType = 'bar';

      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function getChartColors() {
          const style = getComputedStyle(document.documentElement);
          return {
              primary: style.getPropertyValue('--primary-color').trim(),
              secondary: style.getPropertyValue('--secondary-color').trim(),
              textColor: style.getPropertyValue('--text-color').trim(),
              borderColor: style.getPropertyValue('--border-color').trim(),
              danger: style.getPropertyValue('--danger-color').trim(),
              success: style.getPropertyValue('--success-color').trim(),
              warning: style.getPropertyValue('--warning-color').trim()
          };
      }

      function calculateWeeklyCalorieData(state) {
        const weekStart = getWeekStartDate(state.focusedDate);
        const weeklyData = { labels: [], calories: [] };

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          weeklyData.labels.push(DAYS[i]);

          let dailyMin = 0, dailyMax = 0;
          MEAL_TYPES.forEach(type => {
            const meal = state.weeklyPlan[`${isoDate}-${type}`];
            if (meal && meal.calories_min) {
              const minCals = Number(meal.calories_min) || 0;
              const maxCals = Number(meal.calories_max) || minCals;
              dailyMin += minCals;
              dailyMax += maxCals;
            }
          });
          weeklyData.calories.push([dailyMin, dailyMax]);
        }
        return weeklyData;
      }

      function renderPlannerChart(state) {
        const weeklyData = calculateWeeklyCalorieData(state);
        const colors = getChartColors();
        const isLineChart = currentPlannerChartType === 'line';
        
        const datasets = isLineChart ?
        [{
            label: 'Kcal Min',
            data: weeklyData.calories.map(c => c[0]),
            borderColor: colors.secondary,
            fill: false,
            tension: 0.1
        },{
            label: 'Kcal Max',
            data: weeklyData.calories.map(c => c[1]),
            borderColor: colors.primary,
            fill: '-1',
            backgroundColor: colors.primary + '33',
            tension: 0.1
        }]
        :
        [{
            label: 'Kcal (Min-Max)',
            data: weeklyData.calories,
            backgroundColor: colors.primary,
            borderColor: colors.secondary
        }];
        
        const ctx = document.getElementById('planner-chart-canvas').getContext('2d');
        plannerChartInstance = new Chart(ctx, {
          type: currentPlannerChartType,
          data: {
            labels: weeklyData.labels,
            datasets: datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                ticks: { color: colors.textColor },
                grid: { color: colors.borderColor }
              },
              x: {
                ticks: { color: colors.textColor },
                grid: { display: false }
              }
            },
            plugins: {
              legend: {
                display: isLineChart,
                labels: { color: colors.textColor }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    if (isLineChart) {
                      return `${context.dataset.label}: ${context.parsed.y}`;
                    }
                    const value = context.raw;
                    if (value[0] === value[1]) {
                      return `Kcal: ${value[0]}`;
                    }
                    return `Kcal: ${value[0]} - ${value[1]}`;
                  }
                }
              }
            }
          }
        });
      }

      function getBiometricsData(state) {
        const data = [...state.biometricData].reverse(); // Assicura ordine cronologico
        const labels = data.map(entry => new Date(entry.date).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }));
        
        const datasets = {};
        const numericFields = BIOMETRIC_FIELDS.filter(f => f.type === 'number' && f.id !== 'basalMetabolism' && f.id !== 'bmi');

        numericFields.forEach(field => {
            datasets[field.id] = {
                label: field.label,
                data: data.map(entry => entry[field.id] || null) // Usa null per dati mancanti
            };
        });

        return { labels, datasets };
      }

      function renderBiometricsChart(state) {
        const { labels, datasets } = getBiometricsData(state);
        const colors = getChartColors();
        const colorCycle = [colors.primary, colors.secondary, colors.success, colors.warning, colors.danger];
        
        const chartDatasets = Object.values(datasets)
            .map((dataset, index) => ({
                label: dataset.label,
                data: dataset.data,
                fill: false,
                borderColor: colorCycle[index % colorCycle.length],
                tension: 0.1,
                pointBackgroundColor: colorCycle[index % colorCycle.length],
                pointRadius: 4
            }))
            .filter(d => d.data.some(val => val !== null)); // Mostra solo se ci sono dati

        const ctx = document.getElementById('biometrics-chart-canvas').getContext('2d');

        biometricsChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: chartDatasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                ticks: { color: colors.textColor },
                grid: { color: colors.borderColor }
              },
              x: {
                ticks: { color: colors.textColor },
                grid: { display: false }
              }
            },
            plugins: {
              legend: {
                display: true, // Mostra sempre la legenda
                labels: { color: colors.textColor }
              }
            }
          }
        });
      }
      
      function handleChartTypeChange(event, state) {
          const type = event.target.dataset.type;
          if (type && type !== currentPlannerChartType) {
              currentPlannerChartType = type;
              document.querySelectorAll('.btn-chart-type').forEach(btn => {
                  btn.classList.toggle('active', btn.dataset.type === type);
              });
              if (plannerChartInstance) {
                plannerChartInstance.destroy();
              }
              renderPlannerChart(state);
          }
      }

      export function renderCharts(state) {
          if (plannerChartInstance) {
              plannerChartInstance.destroy();
          }
          if (biometricsChartInstance) {
              biometricsChartInstance.destroy();
          }

          renderPlannerChart(state);
          renderBiometricsChart(state);

          const switcher = document.querySelector('.chart-type-switcher');
          const boundHandler = (e) => handleChartTypeChange(e, state);
          switcher.replaceWith(switcher.cloneNode(true));
          document.querySelector('.chart-type-switcher').addEventListener('click', boundHandler);
      }
  - file: styles/charts.css
    content: |
      /* --- CHARTS PAGE --- */
      .charts-container {
          display: grid;
          grid-template-columns: 1fr;
          gap: 1.5rem;
      }

      .chart-card {
          background-color: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
          display: flex;
          flex-direction: column;
      }

      .chart-header {
          display: flex;
          justify-content: center;
          align-items: center;
          margin-bottom: 1.5rem;
          position: relative;
          flex-shrink: 0;
      }

      .chart-header h4 {
          color: var(--primary-color);
          margin: 0;
      }

      /* New container to constrain the chart's height */
      .chart-canvas-container {
          position: relative;
          height: 400px; /* Essential fix for the resize loop */
          width: 100%;
          flex-grow: 1;
      }

      .chart-type-switcher {
          position: absolute;
          right: 0;
          top: 50%;
          transform: translateY(-50%);
          display: flex;
          border: 1px solid var(--border-color);
          border-radius: 8px;
          overflow: hidden;
      }

      .btn-chart-type {
          background: transparent;
          border: none;
          color: var(--text-color-muted);
          padding: 0.25rem 0.75rem;
          cursor: pointer;
          font-size: 0.8rem;
      }
      .btn-chart-type:not(:last-child) {
          border-right: 1px solid var(--border-color);
      }
      .btn-chart-type.active {
          background-color: var(--primary-color);
          color: var(--bg-color);
      }

      /* Rimuove il layout a due colonne per desktop per impilare i grafici */
      /* @media (min-width: 1024px) {
          .charts-container {
              grid-template-columns: repeat(2, 1fr);
          }
      } */
commands:
  - "echo 'Layout dei grafici aggiornato e grafico biometrico arricchito con dati multipli.'"