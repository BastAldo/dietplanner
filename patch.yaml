commit_message: "refactor(trainer): Decompone il modulo trainer monolitico in moduli SRP"
rationale: |
  In linea con il piano approvato e con la massima cautela per preservare la stabilità funzionale, questo commit refattorizza il file monolitico `src/core/trainer.js`.

  La logica è stata meticolosamente separata in moduli con responsabilità singole (SRP), rendendo le dipendenze esplicite e migliorando drasticamente la manutenibilità, la leggibilità e la testabilità del codice.

  Le modifiche principali sono:
  1.  **Creazione della directory `src/core/trainer/`** per ospitare i nuovi moduli specializzati.
  2.  **`state.js`**: Isola la definizione e la gestione dello stato del workout (`workoutState`), diventando l'unica fonte di verità.
  3.  **`queueBuilder.js`**: Contiene la funzione pura per la costruzione della coda di esecuzione delle fasi di allenamento.
  4.  **`machine.js`**: Gestisce la logica della macchina a stati, ovvero l'avanzamento tra set ed esercizi.
  5.  **`animation.js`**: Incapsula tutta la logica legata a `requestAnimationFrame` e alla funzione `tick` che gestisce gli aggiornamenti temporali.
  6.  **`trainer.js` (Facade)**: Il file originale è stato trasformato in una facade che orchestra le interazioni tra i nuovi moduli, esponendo la stessa API pubblica di prima.
  7.  **Aggiornamento Dipendenze**: Tutti i file che importavano dal vecchio modulo (`state.js`, `trainerRenderer.js`, etc.) sono stati aggiornati per utilizzare la nuova struttura.
  8.  **Service Worker**: L'elenco dei file in `sw.js` è stato aggiornato per includere i nuovi moduli e garantire il corretto funzionamento offline.
