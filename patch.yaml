commit_message: "refactor(ui): Centralize info modal content in constants"
rationale: |
  Based on user feedback, this commit resolves an omission in the info modal's example code and improves the application's architecture.

  The static JSON example, previously hardcoded and truncated in `index.html`, has been moved into a dedicated constant in `src/utils/constants.js`. The `populateInitialText` function in `renderer.js` now dynamically injects this content into the DOM at startup.

  This change adheres to the Single Responsibility Principle, making the HTML purely structural and centralizing UI text content for easier maintenance and to prevent future errors of omission.
