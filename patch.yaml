commit_message: "fix(modals): Forza l'aggiornamento di selectionModal.js alla versione con callback"
rationale: |
  Come emerso dai log forniti dall'utente (`[Modals] Opening workout selection modal {slotId: ƒ}`), il file `src/ui/modals/selectionModal.js` è rimasto a una versione precedente e non ha recepito il refactoring della "Fase 3a".

  Questo causava il bug:
  1.  Il `workoutEditorModal` passava un callback a `openWorkoutSelectionModal`.
  2.  Il vecchio `openWorkoutSelectionModal` interpretava il callback come uno `slotId`.
  3.  Al click, il vecchio `list.onclick` chiamava `updateWeeklyWorkout` con un `slotId` che in realtà era una funzione, causando il fallimento dell'operazione e la mancata aggiunta dell'esercizio all'array `localExercises`.

  Questa patch ri-applica l'intera modifica a `src/ui/modals/selectionModal.js`, correggendo la firma di `openWorkoutSelectionModal` e `openWorkoutTemplateSelectionModal` per usare `onSelectCallback`. Questo allinea il file al resto del codice e corregge il bug.
patches:
  - file: src/ui/modals/selectionModal.js
    content: |
      import { getState, updateWeeklyPlan, updateWeeklyWorkout, getPackageTags, addWorkoutTemplateToDay } from '../../core/state.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';
      import { formatIngredients } from '../../utils/formatters.js';
      import { openDayEditorModal } from './dayEditorModal.js';
      import { openWorkoutEditorModal } from './workoutEditorModal.js';
      
      export function openSelectionModal(slotId, returnIsoDate, relevantMeals) {
        log('Modals', 'Opening meal selection modal', { slotId });
        const mealType = slotId.substring(11);
        const selectionModal = document.getElementById('selection-modal');
        selectionModal.querySelector('#selection-modal-title').textContent = `${UI_TEXT.SELECT_MEAL_TITLE} ${mealType}`;
        
        const list = selectionModal.querySelector('#selection-modal-list');
        const searchInput = selectionModal.querySelector('#selection-modal-search');
        const tagsContainer = selectionModal.querySelector('#selection-modal-tag-filters');
        
        let activeTagFilter = null;
        let searchTerm = '';
      
        function renderPackageTags() {
            const pkgTags = getPackageTags();
            if (pkgTags.length === 0) {
              tagsContainer.innerHTML = '';
              return;
            }
            tagsContainer.innerHTML = `
              <button class="tag-filter-btn active" data-tag="all">${UI_TEXT.EXPLORE_FILTER_ALL}</button>
              ${pkgTags.map(tag => {
                const tagName = tag.replace('pkg:', '');
                return `<button class="tag-filter-btn" data-tag="${tag}">${tagName}</button>`;
              }).join('')}
            `;
        }
      
        function renderList() {
            const lowerCaseSearch = searchTerm.toLowerCase().trim();
            
            const filteredMeals = relevantMeals.filter(meal => {
                // Filtro Pacchetto
                if (activeTagFilter && (!meal.etichette || !meal.etichette.includes(activeTagFilter))) {
                    return false;
                }
                
                // Filtro Ricerca
                if (lowerCaseSearch !== '') {
                  const nameMatch = meal.nomePasto.toLowerCase().includes(lowerCaseSearch);
                  const tagMatch = meal.etichette && meal.etichette.some(tag => tag.toLowerCase().includes(lowerCaseSearch));
                  if (!nameMatch && !tagMatch) return false;
                }
      
                return true;
            });
            
            const noMealsText = searchTerm ? `Nessun pasto trovato per "${searchTerm}".` : UI_TEXT.NO_MEALS_AVAILABLE;
            list.innerHTML = filteredMeals.length > 0 
                ? filteredMeals.map(meal => `<div class="selection-item" data-meal-id="${meal.id}"><h4>${meal.nomePasto}</h4>${formatIngredients(meal)}</div>`).join('') 
                : `<p class="placeholder-text">${noMealsText}</p>`;
        }
      
        searchInput.value = '';
        searchInput.oninput = (e) => {
            searchTerm = e.target.value;
            renderList();
        };
      
        tagsContainer.onclick = (e) => {
          const target = e.target.closest('.tag-filter-btn');
          if (!target) return;
          
          tagsContainer.querySelectorAll('.tag-filter-btn').forEach(btn => btn.classList.remove('active'));
          target.classList.add('active');
          
          const tag = target.dataset.tag;
          activeTagFilter = tag === 'all' ? null : tag;
          renderList();
        };
        
        renderPackageTags();
        renderList();
        
        const closeAndReturn = () => {
          selectionModal.classList.add('modal-hidden');
          if (returnIsoDate) openDayEditorModal(returnIsoDate);
        };
      
        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if(item) { 
            updateWeeklyPlan(slotId, item.dataset.mealId); 
            closeAndReturn(); 
          }
        };
        selectionModal.classList.remove('modal-hidden');
      }
      
      export function openWorkoutSelectionModal(onSelectCallback) {
        log('Modals', 'Opening workout selection modal (callback mode)');
        const state = getState();
        const workoutSelectionModal = document.getElementById('workout-selection-modal');
        workoutSelectionModal.querySelector('#workout-selection-modal-title').textContent = UI_TEXT.SELECT_EXERCISE_TITLE;
        const list = workoutSelectionModal.querySelector('#workout-selection-modal-list');
        const relevantWorkouts = state.masterWorkoutList;
        list.innerHTML = relevantWorkouts.length > 0 ? relevantWorkouts.map(ex => `<div class="selection-item" data-exercise-id="${ex.id}"><h4>${ex.name}</h4><p>${ex.description}</p></div>`).join('') : `<p>${UI_TEXT.NO_WORKOUTS_AVAILABLE}</p>`;
      
        const closeAndSelect = (exercise) => {
          workoutSelectionModal.classList.add('modal-hidden');
          if (onSelectCallback) {
            onSelectCallback(exercise);
          }
        };
      
        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if (item) {
            const exercise = state.masterWorkoutList.find(ex => ex.id === item.dataset.exerciseId);
            if (exercise) {
              closeAndSelect(exercise);
            }
          }
        };
        workoutSelectionModal.classList.remove('modal-hidden');
      }
      
      export function openWorkoutTemplateSelectionModal(onSelectCallback) {
        log('Modals', 'Opening workout template selection modal (callback mode)');
        const state = getState();
        const templateSelectionModal = document.getElementById('workout-template-selection-modal');
        templateSelectionModal.querySelector('#workout-template-selection-modal-title').textContent = UI_TEXT.SELECT_TEMPLATE_TITLE;
        const list = templateSelectionModal.querySelector('#workout-template-selection-modal-list');
        const relevantTemplates = state.masterWorkoutTemplateList;
        
        list.innerHTML = relevantTemplates.length > 0 
            ? relevantTemplates.map(template => 
                `<div class="selection-item" data-template-id="${template.id}">
                    <h4>${template.name}</h4>
                    <p>${template.exercises.length} ${template.exercises.length === 1 ? 'esercizio' : 'esercizi'}</p>
                </div>`
              ).join('') 
            : `<p class="placeholder-text">${UI_TEXT.NO_TEMPLATES_AVAILABLE}</p>`;
        
        const closeAndSelect = (template) => {
          templateSelectionModal.classList.add('modal-hidden');
          if (onSelectCallback) {
            onSelectCallback(template);
          }
        };
      
        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if (item) {
            const template = state.masterWorkoutTemplateList.find(t => t.id === parseFloat(item.dataset.templateId));
            if (template) {
              closeAndSelect(template);
            }
          }
        };
        templateSelectionModal.classList.remove('modal-hidden');
      }
commands:
  - "echo 'Bugfix: selectionModal.js è stato forzato alla versione corretta con i callback.'"