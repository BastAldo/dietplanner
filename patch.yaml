commit_message: "feat(importer): Aggiunge l'importazione di dati biometrici da CSV"
rationale: |
  Questo commit introduce una nuova funzionalità che migliora significativamente l'esperienza utente, permettendo l'importazione di dati biometrici direttamente da un file CSV esportato da una bilancia.

  1. **Nuovo Parser CSV (`importer.js`)**: È stato creato un nuovo modulo dedicato, `src/core/importer.js`, la cui unica responsabilità è analizzare il formato specifico dei file CSV della bilancia. Questo parser gestisce l'intestazione del file, il delimitatore a punto e virgola, e la conversione dei formati di data (da GG/MM/AAAA a YYYY-MM-DD) e dei numeri decimali (con la virgola).

  2. **Interfaccia Utente**: È stato aggiunto un pulsante "Importa CSV" nella pagina "Progressi" (`templates/progress.html`). La logica di interazione in `progressInteractions.js` gestisce la selezione del file, la lettura tramite `FileReader`, e orchestra il processo di parsing e salvataggio.

  3. **Gestione dello Stato in Blocco**: Per ottimizzare le performance, è stata introdotta una nuova funzione `addMultipleBiometricEntries` in `src/core/state.js`. Questa funzione importa tutte le nuove misurazioni in un'unica operazione, previene l'inserimento di duplicati basati sulla data e aggiorna l'interfaccia utente una sola volta.

  4. **Flusso Utente Controllato**: Prima di salvare i dati, all'utente viene presentato un modale di conferma che riepiloga il numero di nuove misurazioni trovate, garantendo un pieno controllo sull'operazione. Vengono gestiti anche i casi di errore o di file senza nuovi dati, con notifiche appropriate.
