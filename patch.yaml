          padding: 1rem; background: var(--card-color);
          border: 1px solid var(--border-color); border-radius: 8px;
          margin-bottom: 1.5rem;
      }
      #config-url-input {
          flex-grow: 1; min-width: 0; padding: 0.75rem;
          border: 1px solid var(--border-color); border-radius: 8px;
          font-size: 1rem; background-color: var(--bg-color);
          color: var(--text-color);
      }
      #config-url-input:focus { outline: none; border-color: var(--primary-color); }
      #info-icon { font-size: 1.5rem; cursor: pointer; color: var(--text-color-muted); flex-shrink: 0; }

      .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
