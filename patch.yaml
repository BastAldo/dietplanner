commit_message: "feat(workout): Refactor workoutEditorModal per edit Schede (Fase 3b/c)"
rationale: |
  Questo è un commit_message significativo che implementa la logica per modificare le Schede (template) dalla libreria, completando la Fase 3 del piano.

  1.  **`src/config/uiText.js`**: Aggiunti i testi `WORKOUT_EDITOR_SAVE_CHANGES_BTN` (per il nuovo pulsante "Salva Modifiche") e `WORKOUT_EDITOR_UPDATE_SUCCESS` (per la notifica).
  2.  **`src/core/state.js`**:
      * Aggiunta `getTemplateById(templateId)` per recuperare una scheda.
      * Aggiunta `setWeeklyWorkout(slotId, newExercises)` per sostituire l'intero allenamento di un giorno (necessario per il salvataggio dal modal).
      * Aggiunta `updateWorkoutTemplate(templateId, newExercises)` per salvare le modifiche a una scheda esistente.
  3.  **`src/ui/pageRenderers.js` (`renderLibraryPage`)**:
      * Aggiunto il pulsante "Modifica" (`.btn-edit-template`) alla lista delle schede nel tab "Schede", necessario per avviare la modifica.
  4.  **`src/ui/modals/dayEditorModal.js`**:
      * Le chiamate a `openWorkoutEditorModal` sono state aggiornate per passare il nuovo oggetto di configurazione: `openWorkoutEditorModal({ type: 'day', isoDate: isoDate })`.
  5.  **`src/ui/interactions/libraryInteractions.js` (`handleLibraryClick`)**:
      * Nel tab "Schede", ora gestisce il click sul nuovo pulsante `.btn-edit-template`.
      * Chiama `openWorkoutEditorModal({ type: 'template', templateId: template.id })` per aprire il modal in modalità di modifica scheda.
  6.  **`src/ui/modals/workoutEditorModal.js`**:
      * **Refactoring Principale**: La funzione `openWorkoutEditorModal` ora accetta un oggetto `config` (es. `{ type: 'day', isoDate: '...' }` o `{ type: 'template', templateId: '...' }`).
      * **Stato Locale**: Il modal ora gestisce un array `localExercises` interno. All'apertura, questo array viene popolato dagli esercizi del giorno o della scheda.
      * **Interazioni Locali**: Tutte le azioni (Sortable `onEnd`, "Rimuovi", "Aggiungi esercizio") ora modificano solo l'array `localExercises`, senza toccare lo stato globale.
      * **Nuovo Pulsante "Salva Modifiche"**: È stato aggiunto un nuovo pulsante (`#workout-editor-save-btn`).
      * **Logica di Salvataggio**:
          * "Salva Modifiche" (`#workout-editor-save-btn`) ora salva `localExercises` nello stato globale chiamando `setWeeklyWorkout` (se `type === 'day'`) o `updateWorkoutTemplate` (se `type === 'template'`).
          * "Salva come Scheda" (`#workout-editor-save-template-btn`) salva `localExercises` come *nuova* scheda, come prima.
      * Questo disaccoppia il modal dallo stato globale e permette di usarlo sia per i giorni che per le schede.
