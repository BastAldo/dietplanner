  - file: styles/trainer.css
    content: |
      /* --- TRAINER VIEW STYLES --- */
      #trainer-page {
          height: calc(100vh - 60px);
          display: flex;
          flex-direction: column;
          background-color: var(--bg-color);
          color: var(--text-color);
      }

      .trainer-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          background-color: var(--card-color);
          border-bottom: 1px solid var(--border-color);
          flex-shrink: 0;
          gap: 1rem;
      }

      .trainer-header h2 {
          font-size: 1.25rem;
          color: var(--primary-color);
          flex-grow: 1;
          min-width: 0;
          text-align: center;
      }

      .trainer-header-controls, .trainer-header-placeholder {
          display: flex;
          gap: 0.5rem;
          align-items: center;
          flex-basis: 80px; /* Give side elements a basis to help centering */
      }
      .trainer-header-controls { justify-content: flex-end; }
      .trainer-header-placeholder { justify-content: flex-start; }


      .btn-icon {
        background: none;
        border: none;
        color: var(--text-color-muted);
        cursor: pointer;
        padding: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        width: 40px;
        height: 40px;
      }
      .btn-icon:hover {
        background-color: rgba(255,255,255,0.1);
        color: var(--text-color);
      }
      #trainer-end-btn {
        color: var(--danger-color);
      }
       #trainer-end-btn:hover {
        background-color: rgba(239, 83, 80, 0.1);
      }

      #audio-toggle-btn {
          background: none;
          border: none;
          color: var(--text-color-muted);
          cursor: pointer;
          padding: 0.5rem;
      }

      #audio-toggle-btn.active {
          color: var(--primary-color);
      }

      .trainer-body {
          flex-grow: 1;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          text-align: center;
          position: relative;
          overflow-y: auto;
      }

      .exercise-info-container {
          margin-top: 1rem;
          margin-bottom: 1rem;
      }

      #current-exercise-name {
          font-size: 2rem;
          font-weight: bold;
          min-height: 1.2em;
      }

      #current-exercise-details {
          font-size: 1.25rem;
          color: var(--text-color-muted);
          margin-bottom: 0.5rem;
          min-height: 1.2em;
      }

      #current-rep-display {
        font-size: 1rem;
        color: var(--secondary-color);
        font-weight: bold;
        min-height: 1.2em;
      }

      #current-rep-display.hidden-rep {
        visibility: hidden;
      }

      #upcoming-exercise-display {
        font-size: 0.9rem;
        color: var(--text-color-muted);
        margin-top: 0.75rem;
        font-style: italic;
      }

      #upcoming-exercise-display strong {
        color: var(--text-color);
        font-style: normal;
      }

      #trainer-display-modes {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-grow: 1;
          min-height: 280px;
      }

      .timer-ring-container {
          width: 280px;
          height: 280px;
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          margin: 1rem 0;
      }

      .timer-ring-display {
          font-size: 3rem;
          font-weight: bold;
          fill: var(--text-color);
          text-anchor: middle;
      }

      .timer-ring-display.is-timer,
      .timer-ring-display.is-rep-count {
          font-family: 'Courier New', Courier, monospace;
      }

      .timer-ring-display.is-phase {
          font-size: 2.5rem;
          text-transform: uppercase;
      }


      .timer-ring-bg {
          fill: none;
          stroke: var(--card-color);
          stroke-width: 12;
      }

      .timer-ring-progress {
          fill: none;
          stroke: var(--primary-color);
          stroke-width: 12;
          stroke-linecap: round;
          transform: rotate(-90deg);
          transform-origin: 50% 50%;
          transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
      }

      .timer-ring-progress.is-rest {
          stroke: var(--secondary-color);
      }

      @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .flashing {
        animation: flash 1.4s infinite;
        fill: var(--primary-color);
      }

      .trainer-controls {
          display: flex;
          gap: 1rem;
          justify-content: center;
          align-items: center;
          margin-top: 1rem;
          height: 80px;
          width: 100%;
          padding-bottom: 1rem;
      }

      .btn-large {
          padding: 1rem 2rem;
          font-size: 1.25rem;
      }
  - file: src/core/trainer.js
    content: |
      import { setView, setLastWorkoutSummary, addWorkoutToHistory, getState as getGlobalState } from './state.js';
      import { log } from '../utils/logger.js';
      import { getWorkoutState as getState, resetState, updateState } from './trainer/state.js';
      import { runTimerAnimation, stopAllAnimations } from './trainer/animation.js';
      import { buildFullWorkoutQueue } from './trainer/queueBuilder.js';
      import { calculateWorkoutCalories } from './calculations.js';
      import { speak, playStartCue, playTick } from '../utils/audioFeedback.js';
      import { UI_TEXT } from '../config/uiText.js';

      export { getState as getWorkoutState };

      // This is the "Director d'Orchestra"
      async function runWorkoutLoop() {
        const state = getState();
        if (state.status !== 'running') return;

        for (let i = state.currentQueueIndex; i < state.fullExecutionQueue.length; i++) {
            // The pause is now handled inside runTimerAnimation, so this top-level check is no longer needed
            // a while loop here would also block the main thread.
            if (getState().status !== 'running') {
                log('Trainer', 'Workout loop terminated.');
                return;
            }

            updateState({ currentQueueIndex: i });
            const phase = state.fullExecutionQueue[i];

            log('Trainer-Loop', `Executing phase ${i}:`, phase.type);

            switch (phase.type) {
                case 'speech':
                    if (state.isAudioEnabled && phase.text) {
                        if(phase.await) await speak(phase.text);
                        else speak(phase.text);
                    }
                    break;
                case 'audio':
                     if (state.isAudioEnabled) {
                        if (phase.cue === 'tick') playTick();
                     }
                    break;
                case 'movement':
                case 'rest':
                case 'static_hold':
                    await runTimerAnimation(phase.duration_ms);
                    break;
                case 'set_completed':
                    collectSetData();
                    break;
                case 'manual_rep':
                    // This phase is handled by user interaction via incrementManualRep
                    // We wait here until the rep count is met
                    await new Promise(resolve => {
                        const checkReps = () => {
                            const currentState = getState();
                            const currentPhase = currentState.fullExecutionQueue[currentState.currentQueueIndex];
                            if (!currentPhase || currentPhase.repsCompleted >= currentPhase.context.reps) {
                                document.removeEventListener('workoutStateChange', checkReps);
                                resolve();
                            }
                        };
                        document.addEventListener('workoutStateChange', checkReps);
                    });
                    break;
            }
        }
        // If the loop completes naturally, end the workout
        if (getState().status === 'running') {
            endWorkout();
        }
      }

      export function resetWorkoutState() {
        log('Trainer', 'Resetting workout state.');
        stopAllAnimations();
        resetState();
      }

      export function initializeWorkout(plannedExercises, isoDate) {
        if (!plannedExercises || plannedExercises.length === 0) {
            return;
        }
        resetWorkoutState();

        const fullExecutionQueue = buildFullWorkoutQueue(plannedExercises);

        const initialState = {
            workoutDate: isoDate,
            exerciseQueue: JSON.parse(JSON.stringify(plannedExercises)),
            fullExecutionQueue: fullExecutionQueue,
            currentQueueIndex: 0,
            status: 'idle',
            startTime: 0,
            setsData: []
        };
        updateState(initialState);
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function collectSetData() {
          const state = getState();
          const currentPhase = state.fullExecutionQueue[state.currentQueueIndex];
          if (!currentPhase || !currentPhase.context) return;

          const { exercise, set, reps, weight } = currentPhase.context;

          const setData = {
              exerciseId: exercise.instanceId,
              set: set,
              reps: reps,
              duration: state.lastTimerDuration || 0, // Duration from animation engine
              rest: exercise.defaultRest,
              weight: weight || 0
          };

          const newSetsData = [...state.setsData, setData];
          updateState({ setsData: newSetsData });
          log('Trainer', 'Set data collected', { setData });
      }

      export async function startWorkout() {
        const state = getState();
        log('Interactions', 'Start workout button clicked', { date: state.workoutDate });
        if (state.status !== 'idle') return;

        if (state.isAudioEnabled) {
            playStartCue();
        }

        // Small delay to allow the sound cue to play before any potential UI lag
        await new Promise(resolve => setTimeout(resolve, 50));
        
        if (getState().status !== 'idle') {
            log('Trainer', 'Workout start aborted, status changed during start cue.');
            return;
        }

        updateState({ status: 'running', startTime: Date.now() });
        runWorkoutLoop(); // Start the master loop
        log('Trainer', 'Workout started.');
      }

      export function pauseWorkout() {
        const state = getState();
        if (state.status === 'running') {
            updateState({ status: 'paused' });
            log('Trainer', 'Workout paused.');
        }
      }

      export function resumeWorkout() {
        const state = getState();
        if (state.status === 'paused') {
            updateState({ status: 'running' });
            log('Trainer', 'Workout resumed.');
        }
      }

      export function incrementManualRep() {
          const state = getState();
          if (state.status !== 'running') return;

          const currentPhase = state.fullExecutionQueue[state.currentQueueIndex];
          if (currentPhase && currentPhase.type === 'manual_rep') {
              const newRepCount = (currentPhase.repsCompleted || 0) + 1;
              currentPhase.repsCompleted = newRepCount;
              // Dispatch change to notify the waiting promise in the loop
              document.dispatchEvent(new CustomEvent('workoutStateChange'));
          }
      }

      function createWorkoutSummary(finalState) {
          const totalTime = Date.now() - finalState.startTime;
          let totalTonnage = 0;

          const exercisesWithDetails = finalState.exerciseQueue.map(exercise => {
              const setsForThisExercise = finalState.setsData.filter(d => d.exerciseId === exercise.instanceId);
              const setsCompleted = setsForThisExercise.length;
              const totalExerciseTime = setsForThisExercise.reduce((acc, set) => acc + (set.duration || 0), 0);
              const exerciseTonnage = setsForThisExercise.reduce((acc, set) => acc + ((set.reps || 0) * (set.weight || 0)), 0);
              totalTonnage += exerciseTonnage;

              return {
                  ...exercise,
                  setsCompleted: setsCompleted,
                  setsData: setsForThisExercise,
                  totalTime: totalExerciseTime,
                  tonnage: exerciseTonnage
              };
          });

          const totalSets = exercisesWithDetails.reduce((acc, ex) => acc + ex.setsCompleted, 0);
          const totalExerciseTime = exercisesWithDetails.reduce((acc, ex) => acc + ex.totalTime, 0);
          const totalRestTime = finalState.setsData.reduce((acc, set) => acc + (set.rest || 0) * 1000, 0);

          const summary = {
              date: finalState.workoutDate,
              totalTime,
              totalSets,
              totalExerciseTime,
              totalRestTime,
              totalTonnage,
              exercises: exercisesWithDetails,
              startTime: finalState.startTime,
              totalCaloriesBurned: 0
          };

          const globalState = getGlobalState();
          const latestWeight = globalState.biometricData.length > 0 ? globalState.biometricData[0].weight : null;
          if (latestWeight) {
            summary.totalCaloriesBurned = calculateWorkoutCalories(summary, latestWeight);
          }

          return summary;
      }

      export function endWorkout() {
        const finalState = getState();
        if (finalState.status === 'finished') {
            log('Trainer', 'Workout already finished, not saving again.');
            return;
        }
        stopAllAnimations();
        updateState({ status: 'finished' });

        if (finalState.startTime === 0) {
            log('Trainer', 'Workout ended prematurely, not saving summary.');
            setView('planner');
            return;
        }
        const summary = createWorkoutSummary(finalState);
        setLastWorkoutSummary(summary);
        addWorkoutToHistory(summary);

        setView('debriefing');
      }

      export function discardWorkout() {
        log('Trainer', 'Discarding workout.');
        stopAllAnimations();
        resetWorkoutState();
        setView('planner');
      }
  - file: src/ui/components/TrainerComponent.js
    content: |
      import { getWorkoutState, updateState, startWorkout, pauseWorkout, resumeWorkout, endWorkout, discardWorkout, incrementManualRep } from '../../core/trainer.js';
      import { setView } from '../../core/state.js';
      import { log } from '../../utils/logger.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { renderIcon } from '../icons.js';
      import { showConfirmModal } from '../modals.js';

      const RING_RADIUS = 128;
      const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

      export class TrainerComponent {
          constructor(containerElement) {
              this.container = containerElement;

              this.elements = {
                  exerciseName: this.container.querySelector('#current-exercise-name'),
                  exerciseDetails: this.container.querySelector('#current-exercise-details'),
                  repDisplay: this.container.querySelector('#current-rep-display'),
                  upcomingDisplay: this.container.querySelector('#upcoming-exercise-display'),

                  btnStart: this.container.querySelector('#trainer-start-btn'),
                  btnPause: this.container.querySelector('#trainer-pause-btn'),
                  btnResume: this.container.querySelector('#trainer-resume-btn'),
                  btnManualRep: this.container.querySelector('#trainer-manual-rep-btn'),
                  btnAudio: this.container.querySelector('#audio-toggle-btn'),
                  btnEnd: this.container.querySelector('#trainer-end-btn'),

                  ringContainer: this.container.querySelector('#timer-ring-container'),
              };

              this.ringProgress = null;
              this.ringText = null;
          }

          mount() {
              this.createTimerRing();
              this.container.addEventListener('click', this.handleControls.bind(this));
              this.elements.btnManualRep.textContent = UI_TEXT.TRAINER_MANUAL_REP_BTN_LABEL;
              this.elements.btnEnd.innerHTML = renderIcon('STOP', {width: 28, height: 28});
              this.updateAudioButton(getWorkoutState().isAudioEnabled);
          }

          destroy() {
              log('TrainerComponent', 'Destroying component and cleaning up DOM...');
              this.container.removeEventListener('click', this.handleControls.bind(this));
              if (this.elements.ringContainer) {
                  this.elements.ringContainer.innerHTML = '';
              }
              log('TrainerComponent', 'Component destroyed.');
          }

          _handleEndWorkoutFlow() {
            const promptDiscard = () => {
                showConfirmModal({
                    title: UI_TEXT.DISCARD_WORKOUT_CONFIRM_TITLE,
                    message: UI_TEXT.DISCARD_WORKOUT_CONFIRM_MSG,
                    onConfirm: discardWorkout,
                    type: 'danger',
                    confirmText: UI_TEXT.DISCARD_WORKOUT_BTN
                });
            };

            showConfirmModal({
                title: UI_TEXT.TERMINATE_WORKOUT_CONFIRM_TITLE,
                message: UI_TEXT.TERMINATE_WORKOUT_PROMPT_MSG,
                onConfirm: endWorkout,
                onCancel: promptDiscard,
                confirmText: UI_TEXT.SAVE_AND_END_BTN,
                cancelText: UI_TEXT.DISCARD_WORKOUT_BTN,
                type: 'primary'
            });
          }

          async handleControls(e) {
              const target = e.target.closest('button');
              if (!target) return;

              const targetId = target.id;
              log('TrainerComponent', `Control button clicked: ${targetId}`);
              switch (targetId) {
                  case 'trainer-start-btn':
                      target.disabled = true;
                      await startWorkout();
                      if(this.elements.btnStart) {
                        this.elements.btnStart.disabled = false;
                      }
                      break;
                  case 'trainer-pause-btn': pauseWorkout(); break;
                  case 'trainer-resume-btn': resumeWorkout(); break;
                  case 'trainer-end-btn': this._handleEndWorkoutFlow(); break;
                  case 'trainer-manual-rep-btn': incrementManualRep(); break;
                  case 'audio-toggle-btn': this.toggleAudio(); break;
              }
          }

          toggleAudio() {
              const currentState = getWorkoutState();
              const newState = !currentState.isAudioEnabled;
              updateState({ isAudioEnabled: newState });
              this.updateAudioButton(newState);
          }

          updateAudioButton(isAudioEnabled) {
              this.elements.btnAudio.innerHTML = renderIcon(isAudioEnabled ? 'AUDIO_ON' : 'AUDIO_OFF');
              this.elements.btnAudio.classList.toggle('active', isAudioEnabled);
          }

          createTimerRing() {
              if (this.elements.ringContainer.querySelector('svg')) return;
              this.elements.ringContainer.innerHTML = '';
              const svgNS = 'http://www.w3.org/2000/svg';
              const svg = document.createElementNS(svgNS, 'svg');
              const svgSize = (RING_RADIUS + 12) * 2;
              svg.setAttribute('width', svgSize);
              svg.setAttribute('height', svgSize);
              svg.setAttribute('viewBox', `0 0 ${svgSize} ${svgSize}`);
              const center = svgSize / 2;
              const backgroundCircle = document.createElementNS(svgNS, 'circle');
              backgroundCircle.setAttribute('cx', center);
              backgroundCircle.setAttribute('cy', center);
              backgroundCircle.setAttribute('r', RING_RADIUS);
              backgroundCircle.setAttribute('class', 'timer-ring-bg');
              const progressCircle = document.createElementNS(svgNS, 'circle');
              progressCircle.setAttribute('cx', center);
              progressCircle.setAttribute('cy', center);
              progressCircle.setAttribute('r', RING_RADIUS);
              progressCircle.setAttribute('class', 'timer-ring-progress');
              progressCircle.style.strokeDasharray = RING_CIRCUMFERENCE;
              const text = document.createElementNS(svgNS, 'text');
              text.setAttribute('x', '50%');
              text.setAttribute('y', '50%');
              text.setAttribute('dy', '.3em');
              text.setAttribute('class', 'timer-ring-display');
              svg.appendChild(backgroundCircle);
              svg.appendChild(progressCircle);
              svg.appendChild(text);
              this.elements.ringContainer.prepend(svg);
              this.ringProgress = progressCircle;
              this.ringText = text;
          }

          updateTimerRing(percent) {
              if (!this.ringProgress) return;
              const offset = RING_CIRCUMFERENCE - (percent / 100) * RING_CIRCUMFERENCE;
              this.ringProgress.style.strokeDashoffset = offset;
          }

          formatTime(ms) {
              const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
              const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
              const seconds = (totalSeconds % 60).toString().padStart(2, '0');
              return `${minutes}:${seconds}`;
          }

          render(state) {
              if (!this.ringText || !state.fullExecutionQueue || state.fullExecutionQueue.length === 0) {
                  // Handle pre-start or empty state
                  this.elements.exerciseName.textContent = state.exerciseQueue[0]?.name || 'Pronto per iniziare';
                  this.elements.exerciseDetails.textContent = '';
                  this.elements.repDisplay.classList.add('hidden-rep');
                  this.elements.upcomingDisplay.innerHTML = '';
                  this.updateTimerRing(0);
                  this.ringText.textContent = '';
                  this.elements.btnStart.classList.toggle('hidden', state.status !== 'idle');
                  this.elements.btnPause.classList.add('hidden');
                  this.elements.btnResume.classList.add('hidden');
                  this.elements.btnManualRep.classList.add('hidden');
                  return;
              };

              const { fullExecutionQueue, currentQueueIndex, status } = state;
              const currentPhase = fullExecutionQueue[currentQueueIndex];

              if (!currentPhase || !currentPhase.context || !currentPhase.context.exercise) {
                  this.elements.exerciseName.textContent = 'Allenamento Completato';
                  this.elements.exerciseDetails.textContent = '';
                  this.elements.repDisplay.classList.add('hidden-rep');
                  this.elements.upcomingDisplay.innerHTML = '';
                  this.elements.btnStart.classList.add('hidden');
                  this.elements.btnPause.classList.add('hidden');
                  this.elements.btnResume.classList.add('hidden');
                  return;
              }

              const { exercise } = currentPhase.context;
              this.elements.exerciseName.textContent = exercise.name;
              this.elements.exerciseDetails.textContent = this.formatExerciseDetails(currentPhase.context);

              if ((currentPhase.type === 'movement' || currentPhase.type === 'static_hold' || currentPhase.type === 'manual_rep') && currentPhase.context.rep) {
                this.elements.repDisplay.textContent = `${UI_TEXT.TRAINER_REP_LABEL} ${currentPhase.context.rep}`;
                this.elements.repDisplay.classList.remove('hidden-rep');
              } else {
                this.elements.repDisplay.classList.add('hidden-rep');
              }

              const nextExercisePhase = fullExecutionQueue.find((phase, index) => {
                  return index > currentQueueIndex && phase.context && phase.context.exercise && phase.context.exercise.instanceId !== exercise.instanceId;
              });

              if (nextExercisePhase && nextExercisePhase.context && nextExercisePhase.context.exercise) {
                this.elements.upcomingDisplay.innerHTML = `<strong>${UI_TEXT.TRAINER_UPCOMING_LABEL}</strong> ${nextExercisePhase.context.exercise.name}`;
              } else {
                this.elements.upcomingDisplay.innerHTML = '';
              }


              this.elements.btnStart.classList.toggle('hidden', status !== 'idle');
              this.elements.btnPause.classList.toggle('hidden', status !== 'running');
              this.elements.btnResume.classList.toggle('hidden', status !== 'paused');
              this.elements.btnManualRep.classList.toggle('hidden', !(status === 'running' && currentPhase.type === 'manual_rep'));

              // --- Main Render Logic ---
              this.ringText.classList.remove('is-timer', 'is-phase', 'is-rep-count', 'flashing');
              this.ringProgress.classList.remove('is-rest');


              if (status === 'running' || status === 'paused') {
                  if (currentPhase.type === 'movement') this.renderPhase(state, currentPhase);
                  else if (currentPhase.type === 'static_hold') this.renderStaticHold(state, currentPhase);
                  else if (currentPhase.type === 'manual_rep') this.renderManualReps(state, currentPhase);
                  else if (currentPhase.type === 'rest') this.renderRest(state, currentPhase);
                  else this.ringText.textContent = ''; // For audio/speech phases
              }

              if(status === 'paused') {
                this.renderPaused();
              }
          }

          renderPhase(state, phase) {
              const { phaseTimeElapsed } = state;
              const phaseNameDisplay = phase.phase.replace('pre-', '').toUpperCase();
              const isPrePhase = phase.phase.startsWith('pre-');

              this.ringText.textContent = phaseNameDisplay;
              this.ringText.classList.add('is-phase');
              this.ringText.classList.toggle('flashing', isPrePhase);

              const progressPercent = (phase.duration_ms > 0) ? (phaseTimeElapsed / phase.duration_ms) * 100 : 0;
              this.updateTimerRing(isPrePhase ? 100 : progressPercent);
          }

          renderStaticHold(state, phase) {
              const { phaseTimeElapsed } = state;
              const timeRemaining = phase.duration_ms - phaseTimeElapsed;
              const progressPercent = (phase.duration_ms > 0) ? (phaseTimeElapsed / phase.duration_ms) * 100 : 0;
              this.ringText.textContent = this.formatTime(timeRemaining);
              this.ringText.classList.add('is-timer');
              this.updateTimerRing(progressPercent);
          }

          renderManualReps(state, phase) {
              const repsCompleted = phase.repsCompleted || 0;
              const targetReps = phase.context.reps;
              const progressPercent = (targetReps > 0) ? (repsCompleted / targetReps) * 100 : 0;
              this.ringText.textContent = repsCompleted;
              this.ringText.classList.add('is-rep-count');
              this.updateTimerRing(progressPercent);
          }

          renderRest(state, phase) {
              const { phaseTimeElapsed } = state;
              const timeRemaining = phase.duration_ms - phaseTimeElapsed;
              const progressPercent = (phase.duration_ms > 0) ? (phaseTimeElapsed / phase.duration_ms) * 100 : 0;

              this.ringText.textContent = this.formatTime(timeRemaining);
              this.ringText.classList.add('is-timer');
              this.ringProgress.classList.add('is-rest');
              this.updateTimerRing(progressPercent);
          }

          renderPaused() {
              this.ringText.textContent = UI_TEXT.TRAINER_PAUSED_LABEL;
              this.ringText.classList.add('is-phase', 'flashing');
          }

          formatExerciseDetails(context) {
              const { exercise, set } = context;
              if (!exercise || !set) return '';
              let details = `${UI_TEXT.TRAINER_SET_LABEL} ${set} ${UI_TEXT.TRAINER_OF_SETS_LABEL} ${exercise.defaultSets}`;
              if (exercise.execution_mode === 'tempo_guided' || exercise.execution_mode === 'manual_reps') {
                  details += ` | ${exercise.defaultReps} ${UI_TEXT.TRAINER_REPS_LABEL}`;
              } else if (exercise.execution_mode === 'static_hold') {
                  details += ` | ${exercise.defaultDuration}s`;
              }
              if (exercise.defaultWeight) {
                  details += ` @ ${exercise.defaultWeight}kg`;
              }
              return details;
          }
      }
  - file: src/ui/modals/confirmModal.js
    content: |
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';

      export function showConfirmModal(options) {
        const {
          title,
          message,
          onConfirm,
          onCancel = null,
          type = 'secondary',
          confirmText = UI_TEXT.CONFIRM_MODAL_CONFIRM_BTN,
          cancelText = UI_TEXT.CONFIRM_MODAL_CANCEL_BTN,
        } = options;

        log('Modals', 'Showing confirm modal', { title });
        const confirmModal = document.getElementById('confirm-modal');
        confirmModal.querySelector('#confirm-modal-title').textContent = title;
        confirmModal.querySelector('#confirm-modal-message').textContent = message;
        const confirmBtn = confirmModal.querySelector('#confirm-modal-confirm-btn');
        const cancelBtn = confirmModal.querySelector('#confirm-modal-cancel-btn');

        confirmBtn.className = `btn btn-${type}`;
        confirmBtn.textContent = confirmText;
        cancelBtn.textContent = cancelText;

        const cleanup = () => {
          confirmModal.classList.add('modal-hidden');
          cancelBtn.removeEventListener('click', cancelHandler);
          confirmBtn.removeEventListener('click', confirmHandler);
        };

        const cancelHandler = () => {
          if (onCancel) {
            onCancel();
          }
          cleanup();
        };

        const confirmHandler = () => {
          if (onConfirm) {
            onConfirm();
          }
          cleanup();
        };

        cancelBtn.addEventListener('click', cancelHandler, { once: true });
        confirmBtn.addEventListener('click', confirmHandler, { once: true });

        confirmModal.classList.remove('modal-hidden');
      }
  - file: src/ui/interactions/globalInteractions.js
    content: |
      import { setView, getState, setAppState } from '../../core/state.js';
      import { showConfirmModal } from '../modals.js';
      import { showNotification } from '../notifications.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';

      function handleShareConfig() {
        log('Interactions', 'Share config button clicked');
        const state = getState();
        if (!state.configUrl) { showNotification(UI_TEXT.SHARE_NO_URL_INFO, 'info'); return; }
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?configUrl=${encodeURIComponent(state.configUrl)}`;
        navigator.clipboard.writeText(shareUrl).then(() => {
          showNotification(UI_TEXT.SHARE_SUCCESS, 'success');
        }).catch(() => { showNotification(UI_TEXT.SHARE_ERROR, 'error'); });
      }

      function triggerDownload(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification(UI_TEXT.BACKUP_SUCCESS, 'success');
      }

      async function handleSaveBackup() {
        log('Interactions', 'Save backup button clicked');
        const state = getState();
        const backupData = {
          configUrl: state.configUrl,
          weeklyPlan: state.weeklyPlan,
          weeklyWorkouts: state.weeklyWorkouts,
          workoutHistory: state.workoutHistory,
          biometricData: state.biometricData,
          userProfile: state.userProfile,
          userGoals: state.userGoals
        };
        const fileName = 'healtypro_backup.txt';
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'text/plain' });
        const file = new File([blob], fileName, { type: 'text/plain' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ title: UI_TEXT.BACKUP_SHARE_TITLE, files: [file] });
          } catch (error) {
            if (error.name !== 'AbortError') {
              console.warn('Web Share API failed, falling back to download:', error);
              triggerDownload(blob, fileName);
            }
          }
        } else { triggerDownload(blob, fileName); }
      }

      function handleRestoreBackup() {
          log('Interactions', 'Restore backup button clicked');
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.json,.txt,application/json,text/plain';
          fileInput.onchange = e => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = readerEvent => {
                  try {
                      const content = readerEvent.target.result;
                      const backupData = JSON.parse(content);
                      if (typeof backupData.configUrl === 'string' && typeof backupData.weeklyPlan === 'object') {
                          showConfirmModal({
                              title: UI_TEXT.RESTORE_CONFIRM_TITLE,
                              message: UI_TEXT.RESTORE_CONFIRM_MSG,
                              onConfirm: () => { setAppState(backupData); showNotification(UI_TEXT.RESTORE_SUCCESS, 'success'); },
                              type: 'danger'
                          });
                      } else { throw new Error('Invalid structure'); }
                  } catch (err) { showNotification(UI_TEXT.RESTORE_INVALID_FILE, 'error'); }
              };
              reader.readAsText(file);
          };
          fileInput.click();
      }

      function handleHamburgerClick() {
          const nav = document.getElementById('main-nav');
          nav.classList.toggle('is-open');
          nav.classList.toggle('is-mobile');
      }

      export function initializeGlobalListeners() {
        document.getElementById('backup-btn').addEventListener('click', handleSaveBackup);
        document.getElementById('restore-btn').addEventListener('click', handleRestoreBackup);
        document.getElementById('share-config-btn').addEventListener('click', handleShareConfig);
        document.getElementById('hamburger-btn').addEventListener('click', handleHamburgerClick);

        document.getElementById('nav-planner').addEventListener('click', () => setView('planner'));
        document.getElementById('nav-progress').addEventListener('click', () => setView('progress'));
        document.getElementById('nav-charts').addEventListener('click', () => setView('charts'));
        document.getElementById('nav-recipes').addEventListener('click', () => setView('recipes'));
        document.getElementById('nav-goals').addEventListener('click', () => setView('goals'));
        document.getElementById('nav-profile').addEventListener('click', () => setView('profile'));

        document.getElementById('info-icon').addEventListener('click', () => document.getElementById('info-modal').classList.remove('hidden'));

        document.querySelectorAll('.modal-close-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            const modalId = e.currentTarget.dataset.target;
            if (modalId) { document.getElementById(modalId).classList.add('modal-hidden'); }
          });
        });

        // Robust modal closing logic
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            let mouseDownTarget = null;
            overlay.addEventListener('mousedown', e => {
                if (e.target === overlay) {
                    mouseDownTarget = e.target;
                }
            });
            overlay.addEventListener('mouseup', e => {
                if (e.target === mouseDownTarget) {
                    overlay.classList.add('modal-hidden');
                }
                mouseDownTarget = null;
            });
        });
        
        document.getElementById('global-alert-close').addEventListener('click', () => { document.getElementById('global-alert').classList.add('hidden'); });
      }
  - file: src/ui/interactions/plannerInteractions.js
    content: |
      import {
        resetCurrentWeek, setPlannerConfig, setConfigUrl, navigateWeek, setView,
        copyPreviousWeek, getState, deleteWorkoutFromHistory, getExerciseFromHistory
      } from '../../core/state.js';
      import { initializeWorkout } from '../../core/trainer.js';
      import { fetchAndParseConfig } from '../../api/configService.js';
      import { showNotification } from '../notifications.js';
      import { openDayEditorModal, showConfirmModal, showRecipeModal, openExerciseEditorModal } from '../modals.js';
      import { WORKOUT_SLOT_ID } from '../../utils/constants.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';

      async function handleLoadConfig() {
        log('Interactions', 'Handling config load button click');
        const url = document.getElementById('config-url-input').value.trim();
        if (!url) { showNotification(UI_TEXT.CONFIG_URL_EMPTY_ERROR, 'error'); return; }
        setConfigUrl(url);
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config, url);
          showNotification(UI_TEXT.CONFIG_LOAD_SUCCESS, 'success');
        } catch (error) { showNotification(error.message, 'error'); }
      }

      function handleCalendarClick(e) {
        const startBtn = e.target.closest('.btn-start-workout-day');
        if (startBtn) {
            const isoDate = startBtn.dataset.date;
            log('Interactions', 'Start workout button clicked from calendar', { date: isoDate });
            const globalState = getState();
            const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
            const exercisesForWorkout = globalState.weeklyWorkouts[workoutSlotId];
            initializeWorkout(exercisesForWorkout, isoDate);
            setView('trainer');
            return;
        }

        const dayCell = e.target.closest('.day-cell');
        if (dayCell) {
          log('Interactions', 'Calendar cell clicked', { date: dayCell.dataset.date });
          openDayEditorModal(dayCell.dataset.date);
        }
      }

      function handleRecipeClick(e) {
        const recipeItem = e.target.closest('.recipe-list-item');
        if (recipeItem) {
          const state = getState();
          const meal = state.masterMealList.find(m => m.id === recipeItem.dataset.mealId);
          if (meal) {
            log('Interactions', 'Recipe list item clicked', { mealId: meal.id });
            showRecipeModal(meal);
          }
        }
      }

      function handleLogViewClick(e) {
        const btnRecipe = e.target.closest('.btn-view-recipe');
        if (btnRecipe) {
          const state = getState();
          const meal = state.masterMealList.find(m => m.id === btnRecipe.dataset.mealId);
          if (meal) {
            log('Interactions', 'Recipe button in log view clicked', { mealId: meal.id });
            showRecipeModal(meal);
          }
          return;
        }

        const btnDeleteWorkout = e.target.closest('.btn-delete-workout');
        if (btnDeleteWorkout) {
          const { date, starttime } = btnDeleteWorkout.dataset;
          log('Interactions', 'Delete workout button clicked', { date, starttime });
          showConfirmModal({
            title: UI_TEXT.DELETE_WORKOUT_CONFIRM_TITLE,
            message: UI_TEXT.DELETE_WORKOUT_CONFIRM_MSG,
            onConfirm: () => {
              deleteWorkoutFromHistory(date, parseInt(starttime));
              showNotification(UI_TEXT.DELETE_WORKOUT_SUCCESS, 'info');
            },
            type: 'danger'
          });
          return;
        }

        const btnEditExercise = e.target.closest('.btn-edit-logged-exercise');
        if(btnEditExercise) {
          const { date, starttime, instanceid } = btnEditExercise.dataset;
          log('Interactions', 'Edit logged exercise button clicked', { date, starttime, instanceid });
          const exercise = getExerciseFromHistory(date, parseInt(starttime, 10), parseFloat(instanceid));
          if (exercise) {
            openExerciseEditorModal({
              context: 'history',
              exercise,
              date,
              startTime: parseInt(starttime, 10)
            });
          }
          return;
        }
      }

      function handleCopyWeek() {
        log('Interactions', 'Copy week button clicked');
        showConfirmModal({
          title: UI_TEXT.COPY_WEEK_CONFIRM_TITLE,
          message: UI_TEXT.COPY_WEEK_CONFIRM_MSG,
          onConfirm: () => { copyPreviousWeek(); showNotification(UI_TEXT.COPY_WEEK_SUCCESS, 'success'); },
          type: 'primary'
        });
      }

      function handleResetWeek() {
        log('Interactions', 'Reset week button clicked');
        showConfirmModal({
          title: UI_TEXT.RESET_WEEK_CONFIRM_TITLE,
          message: UI_TEXT.RESET_WEEK_CONFIRM_MSG,
          onConfirm: () => { resetCurrentWeek(); showNotification(UI_TEXT.RESET_WEEK_SUCCESS, 'info'); },
          type: 'danger'
        });
      }

      export function initializePlannerListeners() {
        document.getElementById('load-config-btn').addEventListener('click', handleLoadConfig);
        document.getElementById('calendar-grid').addEventListener('click', handleCalendarClick);
        document.getElementById('log-view').addEventListener('click', handleLogViewClick);
        document.getElementById('recipes-page').addEventListener('click', handleRecipeClick);
        document.getElementById('prev-week-btn').addEventListener('click', () => navigateWeek(-1));
        document.getElementById('next-week-btn').addEventListener('click', () => navigateWeek(1));
        document.getElementById('view-calendar-btn').addEventListener('click', () => setView('planner'));
        document.getElementById('view-log-btn').addEventListener('click', () => setView('log'));
        document.getElementById('copy-week-btn').addEventListener('click', handleCopyWeek);
        document.getElementById('reset-btn').addEventListener('click', handleResetWeek);
      }
