commit_message: "docs: Allinea la documentazione alle funzionalità recenti"
rationale: |
  Questa patch aggiorna in modo completo la documentazione del progetto per riflettere le ultime modifiche implementate, garantendo che rimanga una fonte di verità affidabile.

  **Aggiornamenti apportati:**

  1.  **`docs/01_FUNCTIONALITY.md`**: È stata aggiunta una nuova User Story (`US-33`) che descrive in dettaglio la nuova "Dashboard Grafici", includendo tutte le sue funzionalità avanzate come il filtro temporale, la visualizzazione multi-serie, le linee di tendenza e il selettore di tipo di grafico. È stato inoltre aggiornato il punto `US-30` per includere la navigazione verso la nuova sezione.

  2.  **`docs/02_ARCHITECTURE.md`**: La sezione sull'architettura è stata estesa per documentare la nuova strategia di gestione degli errori nel `configService.js`. Viene ora spiegato il meccanismo di parsing robusto e come la `debugMode` viene sfruttata per fornire log dettagliati in console senza impattare l'esperienza utente, che riceve solo notifiche pulite.

  Questi aggiornamenti assicurano che la documentazione sia di nuovo perfettamente sincronizzata con il codice.
patches:
  - file: docs/01_FUNCTIONALITY.md
    content: |
      # Funzionalità: HealtyPro (ex NutriPlan)

      ## 1. Visione Generale
      Una web app frontend-only, installabile (PWA), per creare e gestire piani alimentari flessibili per l'intera giornata (colazione, spuntini, pranzo e cena) con conteggio calorico dinamico e regole di validazione personalizzate.

      L'interfaccia utente è stata completamente rinnovata per adottare un design system unificato (ispirato a MTP), con un tema scuro, componenti moderni e un flusso di interazione migliorato per la pianificazione giornaliera.

      ## 2. User Stories
      * **US-1 (Caricamento Dati):** L'utente può caricare una configurazione da un file `pasti.json` remoto. L'applicazione si aspetta di trovare, nella stessa directory, un file complementare chiamato `ingredienti.json`.
      * **US-2 (Visualizzazione Calendario):** L'utente vede un calendario settimanale "day-centric". Ogni giorno è una card che riassume le informazioni principali (es. calorie totali).
      * **US-3 (Pianificazione via Modale):** L'utente clicca su una card del giorno per aprire un modale di editing centralizzato, dove può gestire tutti i pasti di quella giornata.
      * **US-4 (Validazione Dinamica):** L'utente vuole che l'app applichi le regole definite nel `pasti.json` (es. blocco giornaliero per un certo tag).
      * **US-11 (Cancellazione Pasti):** L'utente può rimuovere un pasto inserito.
      * **US-15 (Layout Mobile Leggibile):** Su mobile, il calendario è una lista di card giornaliere.
      * **US-16 (Conteggio Calorie Flessibile):** L'utente vede il totale calorico per ogni giorno. Le calorie vengono calcolate dinamicamente dall'applicazione basandosi sui dati del file `ingredienti.json`. Il sistema è in grado di calcolare le calorie anche per ingredienti misurati in "pezzi" (es. `quantita_pezzi: 1`), a condizione che nel file `ingredienti.json` sia specificato il peso medio per pezzo tramite il campo opzionale `g_per_pezzo`.
      * **US-17 (Installazione):** Come utente, voglio poter installare l'app sulla mia home screen o desktop per un accesso rapido.
      * **US-18 (Uso Offline):** Come utente, voglio poter aprire e usare l'app anche senza connessione internet, dopo averla visitata la prima volta.
      * **US-19 (Chiusura Modale Esterna):** Come utente, voglio poter chiudere qualsiasi modale cliccando sull'area scura esterna ad esso, per un'interazione più rapida.
      * **US-20 (Registro Pasti Settimanale Dettagliato):** Come utente, voglio poter passare a una vista registro per vedere l'elenco di tutti i pasti pianificati, con il dettaglio calorico per singolo pasto e il totale giornaliero.
      * **US-21 (Copia Settimana):** Come utente, voglio poter copiare il piano alimentare della settimana precedente a quella attuale con un solo click per velocizzare la pianificazione.
      * **US-22 (Visualizzazione Ricetta):** Come utente, voglio poter visualizzare la ricetta di un pasto, se disponibile. L'URL della ricetta viene derivato automaticamente dal percorso del file di configurazione, cercando i file in una sottocartella `ricette/`.
      * **US-23 (Condivisione Configurazione Sicura):** Come utente, voglio poter generare un link per condividere il mio `pasti.json`. All'apertura del link, se la configurazione è diversa da quella in uso, l'app mi chiederà conferma prima di caricarla per evitare perdite di dati.
      * **US-24 (Backup Dati Locale Flessibile):** Come utente, voglio poter salvare un backup dei miei dati come file di testo (`.txt`) utilizzando, dove supportato, la funzione di condivisione nativa del mio dispositivo.
      * **US-25 (Ripristino da Backup Locale):** Come utente, voglio poter caricare un file di backup (`.txt` o `.json`) precedentemente salvato per ripristinare il mio `configUrl` e il mio `weeklyPlan`, con una richiesta di conferma prima di sovrascrivere i dati esistenti.
      * **US-26 (Inserimento Dati Biometrici):** Come utente, voglio poter inserire e modificare le mie misurazioni biometriche (peso, massa grassa, etc.) per una data specifica tramite un form dedicato.
      * **US-27 (Visualizzazione Storico Biometrico):** Come utente, voglio poter visualizzare lo storico delle mie misurazioni biometriche come una lista di card.
      * **US-29 (Profilo Utente):** L'utente può inserire e salvare i suoi dati personali (nome, data di nascita, altezza, sesso) in una pagina dedicata.
      * **US-30 (Navigazione Principale):** L'utente può navigare tra le sezioni Planner, Progressi, Grafici e Profilo tramite un menu principale nell'header.
      * **US-31 (Calcolo Automatico BMR):** L'applicazione calcola automaticamente il Metabolismo Basale (BMR) dell'utente utilizzando la formula Mifflin-St Jeor, basandosi sui dati del profilo e sull'ultimo peso inserito.
      * **US-32 (Galleria Ricette):** L'utente può accedere a una pagina che elenca tutti i pasti con ricette disponibili per una rapida consultazione.
      * **US-33 (Dashboard Grafici):** Come utente, voglio poter accedere a una dashboard di grafici per analizzare i miei dati. La dashboard include:
          * Un controllo per filtrare i dati su diversi intervalli di tempo (7, 30, 90, 365 giorni o sempre) e per navigare avanti e indietro nel tempo.
          * Un grafico "Andamento Dati Biometrici" che permette di visualizzare la linea di tendenza di un singolo parametro (es. peso, massa grassa) o di tutti i parametri contemporaneamente.
          * Un grafico "Trend del Peso" che mostra i dati del peso come nuvola di punti e sovrappone una linea di tendenza calcolata tramite regressione lineare.
          * Un grafico "Riepilogo Calorie Settimanali" che visualizza le calorie minime e massime pianificate per la settimana corrente, con un selettore per alternare la vista tra grafico a barre e a linee.
          * Un grafico "Correlazione Peso e Calorie" che mostra la relazione tra l'assunzione calorica media e la variazione di peso giornaliera, completo di linea di tendenza.
  - file: docs/02_ARCHITECTURE.md
    content: |
      # Architettura: HealtyPro (ex NutriPlan)

      ## 1. Principi Guida
      * **PWA-First:** L'applicazione è progettata per essere installabile e funzionare offline.
      * **Minimalism & Simplicity (KISS):** L'interfaccia utente è essenziale e intuitiva, basata su Vanilla JS.
      * **Data-Driven & Convention over Configuration:** La logica di business è definita in file di configurazione remoti. L'applicazione si basa su convenzioni di struttura: dato l'URL di `pasti.json`, deduce automaticamente i percorsi per `ingredienti.json` (stessa directory), `esercizi.json` (stessa directory) e per le ricette (sottodirectory `ricette/`).
      * **Maintainability (SRP):** Ogni modulo ha una singola, chiara responsabilità.

      ## 2. Architettura SPA Multi-Vista
      L'applicazione è una **Single Page Application (SPA)**. Un singolo `index.html` contiene i contenitori per ogni vista, e la logica in `renderer.js` gestisce quale vista mostrare in base allo stato.

      ## 3. Architettura PWA
      * **`manifest.json`**: Fornisce i metadati per l'installazione.
      * **`sw.js` (Service Worker)**: Mette in cache l' "app shell" per il funzionamento offline.

      ## 4. Logica di Business
      ### 4.1. Workout Builder Composizionale
      A differenza di un approccio a piani fissi, HealtyPro adotta un modello composizionale. L'utente costruisce la propria sessione di allenamento giorno per giorno aggiungendo esercizi individuali da una libreria. Questo offre massima flessibilità e allinea l'esperienza utente a quella della pianificazione pasti.

      ### 4.2. Modalità di Esecuzione e Ciclo di Ripetizione (Vista Trainer)
      La Vista Trainer opera in diverse modalità a seconda delle proprietà dell'esercizio caricato. Questo garantisce un'esperienza utente flessibile e adatta a diversi tipi di allenamento. La modalità viene scelta in base a un campo `execution_mode` nell'oggetto dell'esercizio.

      #### Modalità 1: `tempo_guided` (Default)
      Per garantire un'esperienza utente guidata e prevenire movimenti affrettati, il modulo Trainer implementa un ciclo di esecuzione dettagliato per ogni singola ripetizione di un esercizio basato sul `tempo`. Questo ciclo è "pre-compilato" in una coda di esecuzione prima dell'inizio di ogni serie.

      Ogni ripetizione è suddivisa in 6 fasi:
      1.  **`pre-up`**: Una fase di preparazione di durata fissa (es. 0.7s). L'UI (es. "time ring") lampeggia e mostra il nome della fase successiva ("UP").
      2.  **`up`**: La fase concentrica (salita). La sua durata è letta da `tempo.up`. L'UI mostra un'animazione fluida.
      3.  **`pre-hold`**: Fase di preparazione (0.7s). L'UI lampeggia e mostra "HOLD".
      4.  **`hold`**: La fase isometrica (pausa). La sua durata è letta da `tempo.hold`.
      5.  **`pre-down`**: Fase di preparazione (0.7s). L'UI lampeggia e mostra "DOWN".
      6.  **`down`**: La fase eccentrica (discesa). La sua durata è letta da `tempo.down`.

      #### Modalità 2: `static_hold`
      Utilizzata per esercizi isometrici come il Plank. L'interfaccia mostra un unico timer centrale che esegue un countdown per la durata totale della serie. Se l'esercizio è configurato per essere eseguito "a sfinimento", il timer diventa un cronometro che conta in avanti.

      #### Modalità 3: `manual_reps`
      Utilizzata per serie "a sfinimento" o con un range di ripetizioni (min/max). L'interfaccia non mostra un timer, ma un contatore e un pulsante principale per permettere all'utente di registrare manualmente ogni ripetizione completata.

      ### 4.3. Calcolo del BMR (`src/core/calculations.js`)
      Logiche complesse come il calcolo del Metabolismo Basale (BMR) sono isolate in questo modulo dedicato.

      ### 4.4. Calcolo delle Calorie (`src/core/calorieCalculator.js`)
      Questo modulo ha la sola responsabilità di calcolare le calorie dei pasti, ricevendo la lista dei pasti e degli ingredienti e arricchendo ogni pasto con `calories_min` e `calories_max`.

      ## 5. Gestione dei Dati
      ### 5.1. Caricamento Dati (`src/api/configService.js`)
      Il servizio orchestra un caricamento multi-fase per `pasti.json`, `ingredienti.json` e `esercizi.json`.

      ### 5.2. Strutture Dati Chiave
      * **Configurazione Remota**:
          * **`pasti.json`**: Array di oggetti `meals`.
          * **`ingredienti.json`**: Array di `ingredienti`.
          * **`esercizi.json`**: Un array di `esercizi`. Ogni esercizio è un oggetto che definisce le sue proprietà di base (ID, nome, descrizione) e i valori di default per serie, ripetizioni, durata, riposo, `tempo` (un oggetto con `up`, `hold`, `down`) e il nuovo campo opzionale `execution_mode`.

      * **Dati Utente Locali (`localStorage`)**:
          * **`userProfile`**: Dati anagrafici dell'utente.
          * **`weeklyPlan`**: Oggetto che mappa gli slot giornalieri (`YYYY-MM-DD-MealType`) ai pasti pianificati.
          * **`weeklyWorkouts`**: Oggetto che mappa uno slot giornaliero (`YYYY-MM-DD-Allenamento`) a un **array di oggetti esercizio**. Ogni oggetto in questo array è una copia dell'esercizio dalla libreria, arricchito con un `instanceId` univoco per permetterne la gestione individuale.
          * **`biometricData`**: Array con lo storico delle misurazioni biometriche.

      ## 6. Dipendenze di Terze Parti
      * **Marked.js & DOMPurify**: Caricate via CDN per il rendering sicuro delle ricette.
      * **Chart.js**: Caricata via CDN per la visualizzazione dei grafici.
      * **SortableJS**: Caricata via CDN per la gestione del drag-and-drop.

      ## 7. Strategia di Sviluppo e Debug
      Per garantire la manutenibilità e facilitare il troubleshooting, l'applicazione integra un sistema di logging sistematico.

      ### 7.1. Modalità Debug (`debugMode`)
      * Lo stato globale in `src/core/state.js` contiene un flag `debugMode`, impostato di default su `false`.
      * Questo flag può essere attivato o disattivato in qualsiasi momento tramite la console del browser, eseguendo la funzione globale `toggleDebugMode()`. Questo permette di attivare i log solo quando necessario, senza impattare le performance in produzione.

      ### 7.2. Logger Centralizzato (`src/utils/logger.js`)
      * Tutta la logica di logging è centralizzata in un unico modulo. La sua funzione `log()` è l'unico punto di accesso per scrivere messaggi in console.
      * Questa funzione controlla internamente lo stato di `debugMode` e scrive in console solo se è attivo.

      ### 7.3. Convenzioni di Logging
      Per garantire coerenza e leggibilità, tutti i messaggi di log seguono una convenzione standard:
      ```javascript
      log('NomeComponente', 'Azione che sta avvenendo', { datiRilevanti });
      ```
      * **`NomeComponente`**: Indica il modulo di origine (es. 'State', 'Modals', 'Trainer', 'API_SERVICE').
      * **`Azione`**: Descrive l'operazione in corso (es. 'Setting new view', 'Opening modal').
      * **`datiRilevanti`**: Un oggetto opzionale che mostra il contesto e i dati relativi all'azione.

      ### 7.4. Gestione Errori Robusta nel Caricamento Dati
      Il `configService` adotta una strategia di parsing in due fasi per migliorare il debug degli errori di caricamento dei file di configurazione (`pasti.json`, `ingredienti.json`, etc.).
      1.  La risposta della `fetch` viene prima letta come testo (`response.text()`).
      2.  Il testo viene poi esplicitamente parsato all'interno di un blocco `try...catch`.

      Questo approccio permette di:
      * **Notificare l'utente** con un messaggio di errore generico e pulito (es. "Errore nel formato di un file di configurazione") senza esporre dettagli tecnici.
      * **Fornire allo sviluppatore**, se `debugMode` è attiva, un log dettagliato in console che include l'URL del file che ha causato l'errore e un estratto del contenuto non valido, semplificando enormemente il processo di troubleshooting.
