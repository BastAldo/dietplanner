commit_message: "fix(trainer): Correct async handling in animation engine to prevent race conditions"
rationale: |
  This patch resolves a critical race condition in the Trainer's animation engine that caused premature workout termination and UI rendering glitches. The previous implementation did not correctly await asynchronous operations.

  **Problem Resolution:**

  1.  **Root Cause - Race Condition:** The `tick` function was not `await`-ing the `async` function `handleNonTimedPhase`. This caused the animation loop to continue executing while asynchronous operations (like speech synthesis) were still in progress. As a result, the engine would find the queue empty and call `endWorkout()` before the final "Workout Completed" announcement could finish.

  2.  **UI Glitch:** The premature call to `endWorkout()` would trigger a final render of the Trainer component with an inconsistent state (`currentPhase` being undefined), causing a visual glitch right before transitioning to the debriefing screen.

  **Implemented Solution:**

  1.  **Proper `async/await` in Animation Engine (`animation.js`):**
      * The main `tick` function has been converted to an `async` function.
      * The call to `handleNonTimedPhase` is now correctly awaited (`await handleNonTimedPhase(currentPhase)`). This forces the animation loop to pause until any non-timed, asynchronous actions are fully completed, guaranteeing the correct execution order.
      * The `isProcessing` lock, which was an ineffective attempt to solve this, has been removed as it is now redundant and made obsolete by the correct `async/await` implementation.

  This fix ensures the execution queue is processed sequentially and robustly, eliminating the race condition. The workout now completes only after all commands, including the final audio cue, have been fully processed, and the UI remains stable throughout the entire lifecycle.
patches:
  - file: src/core/trainer/animation.js
    content: |
      import { getWorkoutState, updateState } from './state.js';
      import { collectSetData, endWorkout } from '../trainer.js';
      import { playTick, playStartCue, playStopCue, speak } from '../../utils/audioFeedback.js';
      import { log } from '../../utils/logger.js';

      let animationFrameId = null;
      let lastTickTimestamp = 0;

      function advanceQueue() {
          const state = getWorkoutState();
          const newIndex = state.currentQueueIndex + 1;
          updateState({
              currentQueueIndex: newIndex,
              phaseStartTime: Date.now(),
              phaseTimeElapsed: 0
          });
      }

      async function handleNonTimedPhase(phase) {
        if (!phase) return;

        log('Trainer-Animation', `Handling non-timed phase:`, phase);

        if (phase.type === 'set_completed') {
            collectSetData();
        } else {
            const { isAudioEnabled } = getWorkoutState();
            if (isAudioEnabled) {
              if (phase.type === 'audio') {
                if (phase.cue === 'tick') playTick();
                else if (phase.cue === 'start') playStartCue();
                else if (phase.cue === 'stop') playStopCue();
              } else if (phase.type === 'speech') {
                if (phase.await) {
                  await speak(phase.text);
                } else {
                  speak(phase.text);
                }
              }
            }
        }

        const currentState = getWorkoutState();
        if (currentState.status === 'running') {
            advanceQueue();
        }
      }

      async function tick(timestamp) {
        if (lastTickTimestamp === 0) {
          lastTickTimestamp = timestamp;
        }
        const deltaTime = timestamp - lastTickTimestamp;
        lastTickTimestamp = timestamp;

        const state = getWorkoutState();
        if (state.status !== 'running') {
          stopAnimation();
          return;
        }

        const { fullExecutionQueue, currentQueueIndex } = state;
        const currentPhase = fullExecutionQueue[currentQueueIndex];

        if (!currentPhase) {
          log('Trainer-Animation', 'Queue finished. Ending workout.');
          endWorkout();
          return;
        }

        const phaseType = currentPhase.type;

        if (phaseType === 'movement' || phaseType === 'rest' || phaseType === 'static_hold') {
          const newPhaseTimeElapsed = state.phaseTimeElapsed + deltaTime;
          if (newPhaseTimeElapsed >= currentPhase.duration_ms) {
            advanceQueue();
          } else {
            updateState({ phaseTimeElapsed: newPhaseTimeElapsed });
          }
        } else if (phaseType === 'manual_rep') {
            // This phase is advanced by incrementManualRep(), tick does nothing.
        } else {
          await handleNonTimedPhase(currentPhase);
        }

        // Must dispatch state change for UI to update timer rings
        if (phaseType === 'movement' || phaseType === 'rest' || phaseType === 'static_hold' || phaseType === 'manual_rep') {
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }

        animationFrameId = requestAnimationFrame(tick);
      }

      export function startAnimation() {
        if (animationFrameId) return;
        lastTickTimestamp = 0;
        animationFrameId = requestAnimationFrame(tick);
        log('Trainer-Animation', 'Animation started.');
      }

      export function stopAnimation() {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        log('Trainer-Animation', 'Animation stopped.');
      }