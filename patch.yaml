commit_message: "refactor: Migliora coerenza UI, codice e documentazione"
rationale: |
  Questa patch implementa una serie di miglioramenti qualitativi in tutto il progetto, come da piano approvato.

  1.  **Icona "Progressi" Aggiornata (`index.html`)**: L'icona generica per la sezione "Progressi" è stata sostituita con una più appropriata e intuitiva icona a forma di bilancia, migliorando la coerenza tematica dell'interfaccia.

  2.  **Documentazione Allineata (`docs/01_FUNCTIONALITY.md`)**: La User Story US-27 è stata aggiornata per riflettere l'attuale implementazione dell'interfaccia a card, eliminando il riferimento obsoleto alla "tabella". La documentazione è ora allineata allo stato del prodotto.

  3.  **Centralizzazione Testi (`src/ui/pageRenderers.js`)**: L'ultima stringa di testo hardcoded ("Nessuna misurazione ancora registrata.") è stata rimossa e sostituita da una costante, completando il processo di centralizzazione.

  4.  **Refactoring Costanti (`src/utils/constants.js`)**: Per aumentare la coerenza interna del codice, la struttura della costante `UI_TEXT` è stata allineata a quella di `BIOMETRIC_FIELDS`. È stato creato un array di oggetti `UI_TEXT_CONFIG` più strutturato, dal quale l'oggetto `UI_TEXT` viene ora generato dinamicamente per garantire la retrocompatibilità con il resto dell'applicazione senza necessità di ulteriori modifiche.
