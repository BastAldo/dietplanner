commit_message: "feat(library): Add full CRUD functionality for ingredients"
rationale: |
  This commit completes Phase 1 of the content creation feature by implementing the full CRUD (Create, Read, Update, Delete) functionality for the user's personal ingredient library.

  Building on the previously established structure, this patch introduces:
  1.  **Ingredient Editor Modal**: A new, reusable modal (`ingredient-editor-modal`) has been created with a form for creating and editing ingredients. The form is dynamically generated based on `INGREDIENT_FIELDS`.
  2.  **State Management (CRUD)**: The core state logic in `state.js` now contains the `addIngredient`, `updateIngredient`, and `deleteIngredient` functions. These functions handle the modification of the `masterIngredientList` and ensure data is persisted to `localStorage`.
  3.  **Full Interaction Logic**: The `libraryInteractions.js` module is now fully implemented. It handles opening the editor modal for both creating new ingredients and editing existing ones. It also manages the deletion flow, including a confirmation modal to prevent accidental data loss.
  4.  **UI Enhancements**: The library view (`renderLibraryPage`) has been updated to display edit and delete controls for each ingredient, providing a complete management interface. New UI text strings and styles have been added to support these features.
