commit_message: "fix(UI): Aggiunge scrollbar custom e corregge lo scroll della pagina trainer"
rationale: |
  Questa patch risolve due problemi di usabilità e di estetica per migliorare la professionalità dell'applicazione.

  **1. Implementazione di una Scrollbar Personalizzata per i Modali:**
  * **Problema:** La scrollbar di default del browser era visivamente sgradevole e stonava con il tema scuro dell'applicazione, rovinando l'esperienza utente all'interno dei modali con contenuto esteso.
  * **Soluzione:** Sono state aggiunte delle regole CSS specifiche al file `styles/modals.css` utilizzando i selettori `::-webkit-scrollbar`. Queste regole personalizzano l'aspetto della scrollbar esclusivamente per il `.modal-body`, rendendola più sottile e colorandola in modo che si integri perfettamente con la palette scura dell'applicazione, come da `STYLE_GUIDE`.

  **2. Correzione della Posizione di Scroll all'Apertura della Pagina Trainer:**
  * **Problema:** Su dispositivi mobili, all'apertura della pagina di allenamento ("Trainer"), la vista risultava scorlata verso il basso, costringendo l'utente a risalire manualmente per vedere i controlli principali.
  * **Soluzione:** È stata aggiunta una logica nel file `src/ui/renderer.js`, all'interno della funzione `renderApp`. Ora, ogni volta che la `currentView` viene impostata su `'trainer'`, viene eseguito un `window.scrollTo(0, 0)`. Questo assicura che la pagina venga riportata in cima, garantendo che l'utente veda sempre la parte superiore dell'interfaccia del trainer all'avvio dell'allenamento.
patches:
  - file: styles/modals.css
    content: |
      /* --- MODALS --- */
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1001; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
      .modal-hidden { display: none !important; }
      .modal-overlay:not(.modal-hidden) { display: flex; opacity: 1; pointer-events: all; }
      .modal-content { background-color: var(--card-color); border-radius: 8px; border: 1px solid var(--border-color); width: 90%; max-width: 600px; display: flex; flex-direction: column; max-height: 90vh; position: relative; }
      .modal-content-large { max-width: 95vw; width: 95vw; height: 90vh; max-height: 90vh; }
      .modal-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); }
      .modal-header h3 { color: var(--primary-color); }
      .modal-close-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-color-muted); padding: 0; line-height: 1; width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background-color 0.2s, color 0.2s; z-index: 10; }
      .modal-close-btn svg { width: 1em; height: 1em; }
      .modal-close-btn:hover { background-color: rgba(255, 255, 255, 0.1); color: var(--text-color); }
      .modal-body { overflow-y: auto; flex-grow: 1; padding: 1.5rem; display: flex; flex-direction: column; }
      #chart-modal-body { padding: 1rem; }
      #chart-modal-canvas { max-height: 100%; }
      .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 1rem; }
      .selection-list { display: flex; flex-direction: column; gap: 0.5rem; }
      .selection-item { padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: background-color 0.2s, border-color 0.2s; }
      .selection-item:hover { background-color: var(--bg-color); border-color: var(--primary-color); }
      .meal-item-details { font-size: 0.85rem; color: var(--text-color-muted); margin-top: 0.25rem; }

      /* Custom Scrollbar for Modal Body */
      .modal-body::-webkit-scrollbar { width: 8px; }
      .modal-body::-webkit-scrollbar-track { background: var(--bg-color); }
      .modal-body::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; border: 2px solid var(--bg-color); }
      .modal-body::-webkit-scrollbar-thumb:hover { background-color: var(--text-color-muted); }

      /* --- UNIFIED EDITOR SECTION COMPONENT --- */
      .day-editor-list { display: flex; flex-direction: column; gap: 1rem; }
      .editor-section-header {
        font-weight: bold;
        color: var(--text-color-muted);
        margin-bottom: 0.5rem;
        padding-left: 0.25rem;
      }
      .editor-section-body {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 1rem;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .meal-details, .workout-summary {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      .meal-info, .exercise-info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        flex-grow: 1;
        min-width: 0;
      }
      .meal-details__name {
        font-weight: 500;
      }
      .meal-actions, .workout-summary-actions {
        display: flex;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .meal-actions button { background: none; border: none; color: var(--text-color-muted); cursor: pointer; padding: 0.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
      .meal-actions button:hover { background-color: rgba(255,255,255,0.1); color: var(--text-color); }
      .btn-add-meal, .btn-add-exercise { background: transparent; border: 1px dashed var(--border-color); color: var(--text-color-muted); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; width: 100%; transition: all 0.2s; }
      .btn-add-meal:hover, .btn-add-exercise:hover { background: var(--bg-color); border-color: var(--secondary-color); color: var(--secondary-color); }

      /* --- WORKOUT EDITOR STYLES (ISOLATED & CORRECTED) --- */
      .workout-editor-list .draggable-item {
        display: flex;
        align-items: center;
        padding: 1rem;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        min-height: 70px;
      }
      .workout-editor-list .meal-actions { margin-left: auto; }
      .meal-actions .btn-remove-exercise { color: var(--danger-color); }
      .exercise-details-summary { font-size: 0.85rem; color: var(--text-color-muted); }

      #exercise-editor-form {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 1rem;
        align-items: end;
      }
      #exercise-editor-form .form-group { display: flex; flex-direction: column; }
      #exercise-editor-form label { margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-color-muted); }
      #exercise-editor-form input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; background-color: var(--bg-color); color: var(--text-color); }
      #exercise-editor-form .sets-group { grid-column: 1 / 3; }
      #exercise-editor-form .reps-group, #exercise-editor-form .duration-group { grid-column: 3 / 5; }
      #exercise-editor-form .rest-group { grid-column: 5 / 7; }
      #exercise-editor-form .weight-group { grid-column: 1 / 4; }
      #exercise-editor-form .tempo-group {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        border-top: 1px solid var(--border-color);
        padding-top: 1rem;
        margin-top: 1rem;
      }

      /* Stili per il nuovo editor dei log */
      #logged-exercise-form { display: flex; flex-direction: column; gap: 1rem; }
      .set-editor-row {
        display: grid;
        grid-template-columns: 50px 1fr 1fr;
        gap: 1rem;
        align-items: end;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      #logged-exercise-form .set-editor-row:last-child { border-bottom: none; }
      .set-editor-label {
        font-weight: bold;
        color: var(--text-color-muted);
        padding-bottom: 0.75rem;
      }

      .structured-form { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
      .structured-form .full-width { grid-column: 1 / -1; }

      .drag-handle { cursor: grab; color: var(--text-color-muted); padding: 0.5rem; }
      .sortable-ghost { opacity: 0.4; background: var(--primary-color); }

      @media (min-width: 600px) {
        .structured-form {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 480px) {
        .workout-summary {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.75rem;
        }
        .workout-summary-actions {
          width: 100%;
          display: flex;
          flex-wrap: wrap;
        }
        .workout-summary-actions .btn {
          flex-grow: 1;
        }
      }
  - file: src/ui/renderer.js
    content: |
      import { getState } from '../core/state.js';
      import { renderPlannerPage } from './plannerRenderer.js';
      import { renderBiometricsPage, renderProfilePage, renderChartsPage, renderDebriefingPage, renderGoalsPage, renderRecipesPage } from './pageRenderers.js';
      import { initializeTrainerController, destroyTrainerController } from './trainerRenderer.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { log } from '../utils/logger.js';

      let isTrainerActive = false;

      function populateIcons() {
          document.querySelector('.app-title').insertAdjacentHTML('afterbegin', renderIcon('APP_LOGO', { width: 24, height: 24 }));
          document.getElementById('nav-planner').insertAdjacentHTML('afterbegin', renderIcon('PLANNER'));
          document.getElementById('nav-progress').insertAdjacentHTML('afterbegin', renderIcon('WEIGHT_SCALE'));
          document.getElementById('nav-charts').insertAdjacentHTML('afterbegin', renderIcon('BAR_CHART'));
          document.getElementById('nav-recipes').insertAdjacentHTML('afterbegin', renderIcon('BOOK'));
          document.getElementById('nav-goals').insertAdjacentHTML('afterbegin', renderIcon('GOAL'));
          document.getElementById('nav-profile').insertAdjacentHTML('afterbegin', renderIcon('PROFILE'));
          document.getElementById('share-config-btn').innerHTML = renderIcon('SHARE');
          document.getElementById('info-icon').innerHTML = renderIcon('INFO');
          document.getElementById('view-calendar-btn').innerHTML = renderIcon('PLANNER');
          document.getElementById('view-log-btn').innerHTML = renderIcon('LOG_VIEW');
          document.getElementById('global-alert-close').innerHTML = renderIcon('CLOSE', { width: 24, height: 24, classes: 'alert-icon' });
          document.getElementById('hamburger-btn').innerHTML = renderIcon('HAMBURGER', { width: 28, height: 28 });
          document.querySelectorAll('.btn-expand-chart').forEach(btn => {
              btn.innerHTML = renderIcon('EXPAND', { width: 20, height: 20 });
          });

          document.querySelectorAll('.modal-close-btn').forEach(btn => {
              btn.innerHTML = renderIcon('CLOSE');
          });
      }

      export function populateInitialText() {
        document.title = UI_TEXT.MAIN_TITLE;
        document.getElementById('main-title').textContent = UI_TEXT.MAIN_TITLE;
        document.querySelector('#nav-planner span').textContent = UI_TEXT.NAV_PLANNER;
        document.querySelector('#nav-progress span').textContent = UI_TEXT.NAV_PROGRESS;
        document.querySelector('#nav-charts span').textContent = UI_TEXT.NAV_CHARTS;
        document.querySelector('#nav-recipes span').textContent = UI_TEXT.NAV_RECIPES;
        document.querySelector('#nav-goals span').textContent = UI_TEXT.NAV_GOALS;
        document.querySelector('#nav-profile span').textContent = UI_TEXT.NAV_PROFILE;
        document.getElementById('load-config-btn').textContent = UI_TEXT.LOAD_BUTTON;
        document.getElementById('reset-btn').textContent = UI_TEXT.RESET_BUTTON;
        document.getElementById('copy-week-btn').textContent = UI_TEXT.COPY_WEEK_BTN;
        document.getElementById('backup-btn').textContent = UI_TEXT.BACKUP_BTN;
        document.getElementById('restore-btn').textContent = UI_TEXT.RESTORE_BTN;
        document.getElementById('info-modal-title').textContent = UI_TEXT.INFO_MODAL_TITLE;
        document.getElementById('info-modal-desc').textContent = UI_TEXT.INFO_MODAL_DESC;
        document.getElementById('info-modal-json-example').textContent = UI_TEXT.INFO_MODAL_EXAMPLE_JSON;
        document.getElementById('biometrics-title').textContent = UI_TEXT.BIOMETRICS_FORM_TITLE;
        document.getElementById('biometrics-history-title').textContent = UI_TEXT.BIOMETRICS_HISTORY_TITLE;
        document.getElementById('profile-title').textContent = UI_TEXT.PROFILE_FORM_TITLE;
        document.getElementById('charts-title').textContent = UI_TEXT.CHARTS_TITLE;
        document.getElementById('planner-chart-title').textContent = UI_TEXT.PLANNER_CHART_TITLE;
        document.getElementById('biometrics-chart-title').textContent = UI_TEXT.BIOMETRICS_CHART_TITLE;
        document.getElementById('recipes-title').textContent = UI_TEXT.RECIPES_TITLE;
        document.querySelector('#charts-page .btn-chart-type[data-type=\"bar\"]').textContent = UI_TEXT.CHART_BAR_VIEW_BTN;
        document.querySelector('#charts-page .btn-chart-type[data-type=\"line\"]').textContent = UI_TEXT.CHART_LINE_VIEW_BTN;
        document.getElementById('debriefing-title').textContent = UI_TEXT.DEBRIEFING_TITLE;
        document.getElementById('back-to-planner-btn').textContent = UI_TEXT.DEBRIEFING_BACK_BTN;
        populateIcons();
      }

      export function renderApp() {
        const state = getState();
        const { currentView } = state.ui;
        const plannerPage = document.getElementById('planner-page');
        const progressPage = document.getElementById('progress-page');
        const chartsPage = document.getElementById('charts-page');
        const recipesPage = document.getElementById('recipes-page');
        const goalsPage = document.getElementById('goals-page');
        const profilePage = document.getElementById('profile-page');
        const trainerPage = document.getElementById('trainer-page');
        const debriefingPage = document.getElementById('debriefing-page');

        const navPlannerBtn = document.getElementById('nav-planner');
        const navProgressBtn = document.getElementById('nav-progress');
        const navChartsBtn = document.getElementById('nav-charts');
        const navRecipesBtn = document.getElementById('nav-recipes');
        const navGoalsBtn = document.getElementById('nav-goals');
        const navProfileBtn = document.getElementById('nav-profile');

        log('Renderer', 'Render triggered. Current view:', currentView, 'isTrainerActive:', isTrainerActive);

        if (currentView !== 'trainer' && isTrainerActive) {
            log('Renderer', 'View is not trainer, destroying trainer controller...');
            destroyTrainerController();
            isTrainerActive = false;
        }

        [plannerPage, progressPage, chartsPage, recipesPage, goalsPage, profilePage, trainerPage, debriefingPage].forEach(p => p.classList.add('hidden'));
        [navPlannerBtn, navProgressBtn, navChartsBtn, navRecipesBtn, navGoalsBtn, navProfileBtn].forEach(b => b.classList.remove('active'));
        document.getElementById('main-nav').classList.remove('is-open', 'is-mobile');

        if (currentView === 'planner' || currentView === 'log') {
          plannerPage.classList.remove('hidden');
          navPlannerBtn.classList.add('active');
          renderPlannerPage(state);
        } else if (currentView === 'progress') {
          progressPage.classList.remove('hidden');
          navProgressBtn.classList.add('active');
          renderBiometricsPage(state);
        } else if (currentView === 'charts') {
          chartsPage.classList.remove('hidden');
          navChartsBtn.classList.add('active');
          renderChartsPage(state);
        } else if (currentView === 'recipes') {
          recipesPage.classList.remove('hidden');
          navRecipesBtn.classList.add('active');
          renderRecipesPage(state);
        } else if (currentView === 'goals') {
          goalsPage.classList.remove('hidden');
          navGoalsBtn.classList.add('active');
          renderGoalsPage(state);
        } else if (currentView === 'profile') {
          profilePage.classList.remove('hidden');
          navProfileBtn.classList.add('active');
          renderProfilePage(state);
        } else if (currentView === 'trainer') {
          trainerPage.classList.remove('hidden');
          window.scrollTo(0, 0); // Ensure view starts at the top
          log('Renderer', 'View is trainer, checking if trainer is active...');
          if (!isTrainerActive) {
            log('Renderer', 'Trainer is not active, initializing trainer controller...');
            initializeTrainerController();
            isTrainerActive = true;
          }
        } else if (currentView === 'debriefing') {
          debriefingPage.classList.remove('hidden');
          renderDebriefingPage(state);
        }

        const urlInput = document.getElementById('config-url-input');
        if (document.activeElement !== urlInput) urlInput.value = state.configUrl;
      }
commands:
