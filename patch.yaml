commit_message: "feat(workout): Aggiunge astrazione Schede Allenamento"
rationale: |
  Questo commit introduce un nuovo livello di astrazione per la pianificazione degli allenamenti, in parallelo a come i "Pasti" sono una composizione di "Ingredienti".

  La nuova struttura è: `Esercizi` -> `Schede` -> `Piano Settimanale`.

  Questa funzionalità è stata implementata in modo minimale per garantire stabilità e aderenza all'architettura esistente:

  1.  **Data Layer (`state.js`, `constants.js`):** È stato introdotto un nuovo array `masterWorkoutTemplateList` nello stato globale, salvato in localStorage. Sono state aggiunte le funzioni `addWorkoutTemplate`, `deleteWorkoutTemplate` e `addWorkoutTemplateToDay` per manipolare questi dati.
  2.  **Creazione Scheda (`workoutEditorModal.js`):** Invece di un nuovo editor, è stato aggiunto un pulsante "Salva come Scheda" al modale `workout-editor-modal` esistente. Questo riutilizza l'interfaccia corrente per creare una nuova "Scheda" (template) dall'allenamento di un giorno.
  3.  **Utilizzo Scheda (`dayEditorModal.js`, `selectionModal.js`):** Il modale "Editor Giorno" ora ha un pulsante "Aggiungi da Scheda", che apre un nuovo modale di selezione (`workout-template-selection-modal`) per applicare una scheda salvata al giorno corrente.
  4.  **Gestione Scheda (`library.html`, `pageRenderers.js`, `libraryInteractions.js`):** È stata aggiunta una nuova tab "Schede" alla Libreria. Questa vista permette di visualizzare ed eliminare le schede salvate (ma non di modificarle, per mantenere bassa la complessità).
  5.  **Testi (`uiText.js`):** Sono stati aggiunti tutti i testi necessari per le nuove interfacce e notifiche.

  Questo approccio rispetta l'architettura "composizionale" del progetto (come descritto in `docs/02_ARCHITECTURE.md`) e la richiesta di un'implementazione a basso rischio.
