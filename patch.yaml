commit_message: "feat(explore): Implement dynamic search, filter, and sort"
rationale: |
  This commit completely revamps the "Explore" section to be a dynamic, performant, and feature-rich content discovery platform, directly addressing the approved architectural plan.

  **1. Dynamic Content Loading from `biohackerhub`:**
  - The "Explore" page now fetches its content directly from the `itbiohackerhub-max/biohackerhub` repository.
  - It uses a "fetch-once, cache-many" strategy: on first load, it fetches the `package-index.json` and then all individual `manifest.json` files, caching them in the application's state (`state.ui.explorePackages`). This makes subsequent filtering, searching, and sorting operations instantaneous.
  - The static `public/explore.json` has been removed as it is now obsolete.

  **2. Feature Implementation: Search, Filter & Sort:**
  - **Search Bar**: A text input has been added to `templates/explore.html` allowing users to perform a free-text search on package titles and descriptions.
  - **Dynamic Tag Filters**: The UI now automatically generates filter buttons from the `tags` found in the cached package manifests. This ensures filters are always relevant to the available content.
  - **Sorting**: A dropdown menu allows users to sort packages by relevance (default), name (ascending/descending), or author.

  **3. State Management & Interactions:**
  - The global state in `src/core/state.js` has been extended to manage the UI state for the Explore page (`explorePackages`, `exploreSearchTerm`, `exploreActiveTags`, `exploreSortOrder`).
  - A new dedicated module, `src/ui/interactions/exploreInteractions.js`, has been created to handle all user input on this page, updating the state and triggering re-renders.

  **4. Architectural Adherence:**
  - The implementation follows the "KISS" principle and respects the existing architecture. All UI changes adhere to `docs/03_STYLE_GUIDE.md`.
  - The new interaction module is integrated into the application's lifecycle via `main.js` and cached by the Service Worker for offline availability.
