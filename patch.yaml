commit_message: "fix(css): Corregge il layout shift nel tab \"Schede\" della Libreria"
rationale: |
  Come richiesto, implemento solo la Fase 1 del piano per correggere il bug del "layout shift".

  1.  **File Modificato:** `styles/library.css`
  2.  **Problema:** Quando si passa a un tab (es. "Schede") che non mostra i filtri per pacchetto, il container dei filtri (`#library-tag-filters`) riceve la classe `.hidden`. La regola CSS `.tag-filter-container.hidden { display: none; }` rimuove l'elemento dal flusso del layout, causando un "salto" verticale del contenuto sottostante.
  3.  **Soluzione:** Ho modificato la regola `.tag-filter-container.hidden`. Invece di `display: none;`, ora usa `visibility: hidden;` per nascondere l'elemento mantenendolo nel flusso. Ho inoltre aggiunto `height: 0;`, `padding: 0;`, `margin-bottom: 0;` e `opacity: 0;` per collassare lo spazio occupato dall'elemento nascosto, eliminando così il "buco" vuoto e risolvendo il "layout shift".
patches:
  - file: styles/library.css
    content: |
      /* --- LIBRARY PAGE --- */
      #library-page > h3 {
          color: var(--primary-color);
          margin-bottom: 1.5rem;
      }
      
      .library-controls {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
      }
      
      .library-search-bar {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        background-color: var(--card-color);
        color: var(--text-color);
      }
      
      .library-search-bar:focus {
        outline: none;
        border-color: var(--primary-color);
      }
      
      .tag-filter-container {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
        transition: all 0.2s ease;
      }
      .tag-filter-container.hidden {
        visibility: hidden;
        height: 0;
        padding: 0;
        margin-bottom: 0;
        opacity: 0;
      }
      
      .tag-filter-btn {
        padding: 0.5rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.9rem;
        background-color: transparent;
        color: var(--text-color-muted);
      }
      
      .tag-filter-btn.active {
        background-color: var(--primary-color);
        color: var(--bg-color);
        border-color: var(--primary-color);
        font-weight: bold;
      }
      
      /* Stili per le Tab Orizzontali */
      .view-switcher {
        display: flex;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden; /* Per arrotondare gli angoli del container */
      }
      .view-switcher .btn-view {
        flex-grow: 1;
        border: none;
        border-radius: 0;
        padding: 0.75rem 1rem;
        background-color: transparent;
        color: var(--text-color-muted);
        font-weight: bold;
        transition: all 0.2s;
      }
      .view-switcher .btn-view:not(:last-child) {
        border-right: 1px solid var(--border-color);
      }
      .view-switcher .btn-view.active {
        background-color: var(--primary-color);
        color: var(--bg-color);
      }
      .view-switcher .btn-view:hover:not(.active) {
        background-color: var(--card-color);
        color: var(--text-color);
      }
      
      
      .library-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      
      .library-section {
        margin-bottom: 2rem;
      }
      
      .library-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 1rem;
          padding: 1rem;
          background-color: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          margin-bottom: 0.75rem;
      }
      
      .library-item-info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        flex-grow: 1;
        min-width: 0;
      }
      
      .library-item-info__name {
        font-weight: 500;
        word-break: break-word;
      }
      .library-item-info__details {
        font-size: 0.85rem;
        color: var(--text-color-muted);
        word-break: break-word;
      }
      
      .library-item-actions {
        display: flex;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      
      .library-item-actions button {
        background: none;
        border: none;
        color: var(--text-color-muted);
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .library-item-actions button:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }
      .library-item-actions .btn-edit:hover {
        color: var(--primary-color);
      }
      .library-item-actions .btn-delete:hover,
      .library-item-actions .btn-delete-template:hover {
        color: var(--danger-color);
      }
commands:
  - "echo 'Fase 1 completata: Corretto il bug del layout shift nella Libreria.'"