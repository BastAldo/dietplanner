commit_message: "feat(feature): Implement recipe viewing from Markdown files"
rationale: |
  This commit introduces a major new feature allowing users to link recipes from external Markdown files to meals within the planner, based on the approved "Diet-as-Code" strategy.

  1.  **Updated Documentation**: The official documentation (`01_FUNCTIONALITY.md` and `02_ARCHITECTURE.md`) has been updated to reflect the new system. This includes defining the new `recipeBaseUrl` and `recipeId` properties in the `config.json` structure and adding User Story US-22.

  2.  **State Management**: The core state (`src/core/state.js`) now extracts and stores the `recipeBaseUrl` from the configuration file, making it globally available to the rendering engine.

  3.  **New Recipe Modal**: A new modal has been added to `index.html` and styled in `style.css` to display the recipe content. The styling ensures good readability of the fetched Markdown content.

  4.  **Rendering Logic**: The renderer (`src/ui/renderer.js`) has been significantly enhanced. It now checks if a meal has an associated `recipeId` and if a global `recipeBaseUrl` is set. If both are present, it displays a "view recipe" button. Clicking this button fetches the corresponding `.md` file, parses it into basic HTML (supporting headers, lists, and bold text), and displays it in the new modal.
