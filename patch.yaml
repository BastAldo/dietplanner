commit_message: "fix(trainer): Ensure animation promise resolves on workout termination"
rationale: |
  This patch fixes a critical bug where terminating a workout during a timed animation phase would cause the main execution loop to hang indefinitely, preventing the application from navigating to the debriefing screen.

  **Problem Analysis:**

  1.  **The "Broken Promise":** The main workout loop (`runWorkoutLoop` in `trainer.js`) `await`s a `Promise` returned by `runTimerAnimation` (`animation.js`). When the user terminates the workout, the `endWorkout` function calls `stopAllAnimations`, which uses `cancelAnimationFrame` to halt the animation's `tick` loop.
  2.  **Root Cause:** The `cancelAnimationFrame` call stopped the animation, but it did not resolve the `Promise` that `runWorkoutLoop` was still waiting for. As a result, the "Director" loop would get stuck in a pending state forever, and subsequent UI updates (like `setView('debriefing')`) would fail to render correctly because the application's core logic was frozen.
  3.  **Inconsistent Behavior:** This explains why the bug sometimes occurred on the first run but consistently on the second. It depended on whether the termination happened during a timed animation (bug occurs) or a non-timed phase like speech (bug does not occur).

  **Implemented Solution:**

  A robust mechanism has been implemented to ensure the animation's `Promise` is always resolved upon termination:

  1.  **Shared Promise Resolver (`animation.js`):** A new module-level variable, `currentAnimationPromiseResolver`, has been introduced.
  2.  **Storing the Resolver:** When `runTimerAnimation` creates its `Promise`, it now stores the `resolve` function in this shared variable.
  3.  **Graceful Stoppage (`stopAllAnimations`):** The `stopAllAnimations` function has been updated. It now first cancels the animation frame and then immediately checks for and calls the stored `currentAnimationPromiseResolver`. This action manually resolves the pending `Promise`, instantly "un-sticking" the `runWorkoutLoop`.
  4.  **State Cleanup:** Both the normal completion path (timer finishing) and the forced termination path now ensure `currentAnimationPromiseResolver` is reset to `null`, preventing state leakage between animations.

  This architectural fix guarantees that the workout termination process is clean and reliable, regardless of when it is initiated, ensuring the application always proceeds to the debriefing view as expected.
patches:
  - file: src/core/trainer/animation.js
    content: |
      import { getWorkoutState, updateState } from './state.js';
      import { log } from '../../utils/logger.js';

      let animationFrameId = null;
      let currentAnimationPromiseResolver = null; // Shared resolver

      /**
       * The specialized "Animator" function.
       * Its only job is to run a timer for a given duration and update the UI.
       * It returns a Promise that resolves when the timer is complete.
       * @param {number} durationMs - The total duration of the animation.
       * @returns {Promise<void>}
       */
      export function runTimerAnimation(durationMs) {
        return new Promise(resolve => {
          // Store the resolver so it can be called externally to stop the animation
          currentAnimationPromiseResolver = resolve;
          let startTime = 0;

          function tick(timestamp) {
            if (startTime === 0) {
              startTime = timestamp;
            }

            const elapsed = timestamp - startTime;

            if (elapsed >= durationMs) {
              updateState({ phaseTimeElapsed: durationMs, lastTimerDuration: durationMs });
              animationFrameId = null;
              if (currentAnimationPromiseResolver) {
                currentAnimationPromiseResolver();
                currentAnimationPromiseResolver = null;
              }
            } else {
              updateState({ phaseTimeElapsed: elapsed, lastTimerDuration: elapsed });
              // Dispatch event for UI to update timer rings
              document.dispatchEvent(new CustomEvent('workoutStateChange'));
              animationFrameId = requestAnimationFrame(tick);
            }
          }

          animationFrameId = requestAnimationFrame(tick);
          log('Trainer-Animation', `Animation started for ${durationMs}ms.`);
        });
      }

      /**
       * Stops any currently active animation frame loop and resolves its promise.
       */
      export function stopAllAnimations() {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
          log('Trainer-Animation', 'Animation frame cancelled.');
        }
        // If there's a pending promise from an animation, resolve it now.
        if (currentAnimationPromiseResolver) {
          log('Trainer-Animation', 'Resolving pending animation promise.');
          currentAnimationPromiseResolver();
          currentAnimationPromiseResolver = null;
        }
      }