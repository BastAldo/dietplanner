commit_message: "feat(ui): Implement Day Editor modal interaction"
rationale: |
  This commit delivers Phase 3 of the HealtyPro specification, introducing the core 'Day Editor' modal functionality.

  1.  **`index.html`**: The basic HTML structure for the new `day-editor-modal` has been added, ensuring consistency with the existing modal components.
  
  2.  **`src/ui/renderer.js`**: A new `openDayEditorModal` function has been created. This function is responsible for dynamically rendering the content of the modal based on the selected date. It displays all meal slots for the day, showing either the planned meal with a 'remove' button or an 'add' button for empty slots. It cleverly reuses the existing `openSelectionModal` for adding meals, demonstrating code modularity.

  3.  **`src/ui/interactions.js`**: The `handleCalendarClick` function has been updated to call the new `openDayEditorModal`, effectively connecting the main calendar view to the new editing workflow.

  This change completes the primary user interaction loop for daily meal planning as envisioned in the project's documentation.
