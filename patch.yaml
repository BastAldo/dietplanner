commit_message: "feat(ui): Unify planner/log views and create 'Today' dashboard"
rationale: |
  This major UI/UX refactoring implements the user's strategic feedback to create a more fluid, actionable, and unified main page.

  Key transformations include:
  1.  **View Unification**: The separate "Calendar" and "Log" views have been merged. The Log view is now a persistent, scrollable section directly below the weekly calendar grid, eliminating the need for a view switcher and creating a seamless user flow.
  2.  **Collapsible Log Days**: To improve usability on mobile devices and reduce visual clutter, each day within the Log view is now a collapsible panel. Users can click on a day's header to expand or collapse its detailed content.
  3.  **New 'Today' Dashboard Widget**: A new, highly-visible "Today" widget has been added to the top of the planner page. This component acts as a daily dashboard, providing an actionable summary of the current day's planned meals, total calories, and a prominent "Start Workout" button if an activity is scheduled.
  4.  **Code Refactoring**: The rendering logic (`plannerRenderer.js`), interaction handlers (`plannerInteractions.js`), and associated styles (`planner.css`) have been significantly updated to support this new, more dynamic, and user-centric layout. The state management for views has been simplified accordingly.
patches:
  - file: templates/planner.html
    content: |
      <div id="global-alert" class="global-alert hidden">
          <p id="global-alert-message"></p>
          <button id="global-alert-close" class="alert-close-btn"></button>
      </div>

      <div id="planner-page" class="page-view">
          <section id="today-widget" class="today-widget"></section>
          <section id="planner-summary-widget" class="planner-summary-widget"></section>
          <section class="view-container">
              <header class="calendar-header">
                  <button id="prev-week-btn" class="btn btn-secondary">&lt;</button>
                  <h2 id="week-title"></h2>
                  <button id="next-week-btn" class="btn btn-secondary">&gt;</button>
              </header>
               <div class="planner-controls-wrapper">
                  <div class="planner-actions">
                    <button id="copy-week-btn" class="btn btn-secondary"></button>
                    <button id="reset-btn" class="btn btn-secondary"></button>
                  </div>
              </div>
              <div id="calendar-grid" class="calendar-grid"></div>
              <h3 id="log-view-title" class="section-title">Registro Dettagliato</h3>
              <div id="log-view" class="log-view"></div>
          </section>
      </div>
  - file: styles/planner.css
    content: |
      /* --- PLANNER PAGE --- */
      .section-title {
        color: var(--primary-color);
        margin-top: 2rem;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
      }

      /* --- TODAY WIDGET --- */
      .today-widget {
        background-color: var(--card-color);
        border-left: 4px solid var(--primary-color);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .today-widget-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .today-widget-header h3 {
        color: var(--text-color);
        margin: 0;
      }
      .today-widget-header span {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--secondary-color);
      }
      .today-widget-body {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .today-meal-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem;
        background-color: var(--bg-color);
        border-radius: 8px;
      }
      .today-meal-item strong {
        color: var(--text-color-muted);
      }

      .planner-summary-widget {
          background: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
          margin-bottom: 1.5rem;
      }
      .planner-summary-title {
          color: var(--secondary-color);
          text-align: center;
          margin-bottom: 1.5rem;
          font-size: 1.25rem;
      }
      .planner-summary-stats {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 1.5rem;
          align-items: center;
          justify-content: center;
      }
      .planner-summary-stat {
          display: flex;
          align-items: center;
          gap: 0.75rem;
          justify-content: center;
      }
      .planner-summary-stat .stat-icon {
          color: var(--secondary-color);
      }
      .planner-summary-stat .stat-value {
          font-size: 1.5rem;
          font-weight: bold;
          color: var(--primary-color);
      }
      .planner-summary-stat .stat-label {
          font-size: 0.8rem;
          color: var(--text-color-muted);
          text-transform: uppercase;
      }

      .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .calendar-header h2 { font-size: 1.25rem; text-align: center; color: var(--text-color); }
      .planner-controls-wrapper {
        display: flex; justify-content: flex-end; align-items: center;
        margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
      }
      .planner-actions { display: flex; gap: 0.75rem; }
      .calendar-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
      .day-cell {
          background-color: var(--card-color); border: 1px solid var(--border-color);
          border-radius: 8px; padding: 1rem; min-height: 120px; display: flex;
          flex-direction: column; transition: all 0.2s;
      }
      .day-cell:not(:has(.btn-start-workout-day)) { cursor: pointer; }
      .day-cell:not(:has(.btn-start-workout-day)):hover { border-color: var(--primary-color); transform: translateY(-3px); }
      .day-cell.is-today {
        border-color: var(--primary-color);
        box-shadow: 0 0 10px rgba(149, 117, 205, 0.5);
      }
      .day-cell__header { display: flex; justify-content: space-between; font-weight: bold; color: var(--text-color-muted); text-transform: uppercase; font-size: 0.8rem; pointer-events: none; }
      .day-cell__body { margin-top: 0.5rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; pointer-events: none; }
      .daily-calories { font-size: 1rem; font-weight: bold; color: var(--secondary-color); }
      .daily-summary-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
      .btn-start-workout-day {
        pointer-events: all;
        width: 100%;
        margin-top: 1rem;
        padding: 0.5rem;
        font-size: 0.85rem;
      }
      .log-view { padding: 0; background: transparent; border-radius: 0; border: none; }
      .log-day { margin-bottom: 1rem; background: var(--card-color); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
      .log-day-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .log-day-header:hover {
        background-color: rgba(255, 255, 255, 0.05);
      }
      .log-day h3 { color: var(--primary-color); margin: 0; font-size: 1.1rem; }
      .log-day.is-today h3 {
        color: var(--primary-color);
        font-weight: bold;
      }
      .log-day__total-calories { font-size: 0.9rem; font-weight: normal; color: var(--text-color-muted); }
      .log-day-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
        padding: 0 1.5rem;
      }
      .log-day.is-expanded .log-day-body {
        max-height: 2000px; /* Large value to allow for expansion */
        padding-bottom: 1rem;
      }
      .log-item { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 0; font-size: 0.95rem; border-top: 1px solid var(--border-color); }
      .log-item:first-child { border-top: none; }
      .log-item__name { display: flex; align-items: center; gap: 0.5rem; }
      .log-item strong { color: var(--text-color-muted); }
      .log-item__calories { font-weight: bold; color: var(--secondary-color); flex-shrink: 0; }
      .log-item-details { font-size: 0.85rem; color: var(--text-color-muted); margin-top: 0.25rem; }

      .log-workout-summary { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border-color); }
      .log-workout-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .log-workout-header h4 { color: var(--secondary-color); font-size: 1rem; margin: 0; }
      .log-workout-header-actions { display: flex; gap: 0.5rem; }
      .btn-delete-workout, .btn-edit-logged-exercise { background: none; border: none; color: var(--text-color-muted); cursor: pointer; padding: 0.25rem; border-radius: 4px; display: flex; }
      .btn-delete-workout:hover { color: var(--danger-color); background-color: rgba(239, 83, 80, 0.1); }
      .btn-edit-logged-exercise:hover { color: var(--primary-color); background-color: rgba(149, 117, 205, 0.1); }
      .log-workout-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        font-size: 0.85rem;
        color: var(--text-color-muted);
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      .log-workout-exercise { margin-bottom: 1rem; }
      .log-workout-exercise .log-item { border-bottom: none; }
      .log-sets-details { padding-left: 1rem; border-left: 2px solid var(--border-color); margin-top: 0.5rem; }
      .log-set-item { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 0.25rem 0; }
      .log-set-item span:first-child { color: var(--text-color-muted); }

      .log-manual-details {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        padding: 0.75rem 0;
        font-size: 0.9rem;
      }
      .log-manual-details div {
        word-break: break-word;
      }
      .log-item-details {
        font-style: italic;
        color: var(--text-color-muted);
        width: 100%;
      }


      @media (min-width: 768px) {
          #app-container { padding: 2rem; }
          .calendar-grid { grid-template-columns: repeat(7, 1fr); gap: 1rem; }
      }
