commit_message: "feat(dnd): Implementa il riordinamento degli esercizi con drag-and-drop"
rationale: |
  Questo commit introduce la funzionalità di riordinamento (drag-and-drop) degli esercizi all'interno del "Workout Editor", completando così tutte le funzionalità di editing richieste.

  Le modifiche principali sono:
  1.  **Integrazione di SortableJS**: La libreria `SortableJS` è stata aggiunta a `index.html` tramite CDN. Questa libreria gestisce in modo robusto tutta la complessità degli eventi di trascinamento, sia su desktop che su mobile.
  2.  **Logica di Riordinamento nello Stato**: È stata creata una nuova funzione `reorderWorkoutExercises` in `src/core/state.js`. Questa funzione riceve lo `slotId` e gli indici di partenza e arrivo dell'elemento trascinato, riordina l'array degli esercizi nello stato e salva le modifiche.
  3.  **Attivazione nell'UI**: La funzione `openWorkoutEditorModal` in `src/ui/modals.js` è stata aggiornata per inizializzare `SortableJS` sulla lista degli esercizi. All'evento `onEnd` (rilascio dell'elemento), viene chiamata la nuova funzione di stato per persistere il nuovo ordine. È stata aggiunta anche un'icona "drag handle" per indicare visivamente che gli elementi sono trascinabili.
  4.  **Icona e Stili**: È stata aggiunta la nuova icona `DRAG_HANDLE` in `src/ui/icons.js` e sono state definite nuove classi CSS in `styles/modals.css` per fornire un feedback visivo chiaro durante l'operazione di trascinamento, migliorando l'esperienza utente.

  Con questa implementazione, l'editor degli allenamenti è ora uno strumento completo e usabile, che permette all'utente di comporre, modificare e riordinare le proprie sessioni di allenamento in modo intuitivo.
