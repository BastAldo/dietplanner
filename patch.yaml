  - file: docs/01_FUNCTIONALITY.md
    content: |
      # Funzionalità: Protocollo Dinamico v1.2

      ## 1. Visione Generale
      Una web app frontend-only, responsiva, che permette a un utente di pianificare il proprio protocollo alimentare settimanale caricando una configurazione JSON che include sia i pasti sia le regole di validazione personalizzate.

      ## 2. User Stories (Cosa l'utente può fare)
      * **US-1 (Caricamento Dati):** Come utente, voglio poter caricare un elenco di pasti e un set di regole da un file di configurazione JSON remoto.
      * **US-2 (Visualizzazione):** Come utente, voglio vedere una griglia chiara del calendario settimanale e una libreria laterale con tutti i pasti disponibili.
      * **US-3 (Pianificazione):** Come utente, voglio poter trascinare un pasto dalla libreria e rilasciarlo in uno slot specifico del calendario.
      * **US-4 (Validazione Dinamica):** Come utente, voglio che l'app applichi le regole definite nel JSON (es. blocco giornaliero per un certo tag) quando pianifico i pasti.
      * **US-5 (Persistenza):** Come utente, voglio che il mio piano settimanale e l'URL del JSON vengano salvati automaticamente.
      * **US-6 (Pasto Libero):** Come utente, voglio poter contrassegnare un pasto come "Libero".
      * **US-7 (Reset):** Come utente, voglio un pulsante "Reset" per svuotare rapidamente il calendario.
      * **US-8 (Stampa):** Come utente, voglio un pulsante "Stampa" per una versione pulita del mio piano.
      * **US-9 (Data Source Configurabile):** Come utente, voglio poter inserire l'URL di un mio file JSON per caricare una configurazione personalizzata.
      * **US-10 (UI Responsiva):** Come utente, voglio poter usare l'applicazione in modo efficace sia su desktop che su dispositivi mobili.
      * **US-11 (Cancellazione Pasti):** Come utente, voglio poter rimuovere facilmente un pasto che ho inserito nel calendario per errore.
      * **US-12 (Filtro Libreria):** Come utente, voglio poter filtrare la lista dei pasti per tipo (Pranzo/Cena) per trovare più velocemente quello che cerco.
      * **US-13 (Feedback Visivo):** Come utente, voglio che l'app mi segnali con un colore diverso se inserisco un pasto di tipo "Cena" in uno slot "Pranzo" e viceversa.
      * **US-14 (Interazione Mobile Nativa):** Come utente mobile, voglio poter toccare uno slot vuoto nel calendario per aprire una finestra di selezione e scegliere un pasto, invece di usare il drag & drop.
      * **US-15 (Layout Mobile Leggibile):** Come utente mobile, voglio che il calendario si visualizzi come una lista verticale ("agenda") per una facile lettura e interazione sul mio dispositivo.
  - file: docs/02_ARCHITECTURE.md
    content: |
      # Architettura: Protocollo Dinamico v1.2

      ## 1. Principi Guida
      * **Data-Driven:** La logica di business (regole di validazione) è delegata a un file di configurazione esterno, non è hardcoded nell'applicazione.
      * **Frontend-Only, KISS, SRP:** L'app vive nel browser, usa Vanilla JS e ogni file ha una sola responsabilità.

      ## 2. Formato Dati: `planner-config.json`
      L'applicazione è guidata da un singolo file JSON con due sezioni principali:
      * **`rules`**: Un array di oggetti regola. Ogni oggetto definisce un `tag`, un `type` di regola (es. `daily-block`), un `limit` e un `message` di errore.
      * **`meals`**: Un array di oggetti pasto, che costituisce la libreria a disposizione dell'utente.

      ## 3. Struttura dei File
      ```
      .
      └── src/
          ├── api/
          │   └── configService.js
          ├── core/
          │   ├── state.js
          │   └── validation.js
          ├── ui/
          │   ├── renderer.js
          │   ├── interactions.js
          │   └── notifications.js
          └── utils/
              └── constants.js
      ```

      ## 4. Gestione dello Stato e Flusso di Rendering
      Lo stato è centralizzato in `state.js`. Ogni modifica allo stato emette un evento globale `stateChange`. In `main.js`, un "event listener" cattura questo evento e invoca `renderApp()` in `renderer.js`, che legge lo stato aggiornato e ridisegna l'UI. Questo garantisce un flusso di dati unidirezionale.

      ## 5. Design Responsivo e Interazione Utente
      L'applicazione adotta un approccio di **Progressive Enhancement**.
      * **Mobile (< 768px):** Il calendario è una lista verticale. L'interazione è "tap-to-select" tramite modale.
      * **Desktop (>= 768px):** Il calendario è una griglia. L'interazione è via drag & drop.
      
      ## 6. Convenzioni di Codice
      * **Ordine di Definizione**: All'interno dei moduli, le funzioni "handler" (che gestiscono eventi) devono essere definite prima delle funzioni (es. `initializeEventListeners`) che le assegnano agli elementi del DOM per prevenire `ReferenceError`.
  - file: docs/03_STYLE_GUIDE.md
    content: |
      # Guida di Stile: Protocollo Dinamico v1.2

      ## 1. Palette Colori
      ```css
      :root {
        --color-background: #F8F9FA; --color-surface: #FFFFFF; --color-border: #E9ECEF;
        --color-text-primary: #212529; --color-text-secondary: #6C757D;
        --color-primary: #28a745; --color-error: #dc3545; --color-warning: #ffc107;
      }
      ```

      ## 2. Tipografia
      * **Font Family:** `Roboto`, `sans-serif`
      * **Body Text:** `16px`

      ## 3. Stile dei Componenti
      ### 3.1 Card del Pasto
      * **Stato Mismatch:** Classe `.is-mismatched` con bordo giallo (`--color-warning`).
      ### 3.2 Pulsante di Cancellazione
      * Icona (`&times;`) visibile solo al passaggio del mouse sulla card.
      ### 3.3 Pulsanti Filtro
      * Classe `.is-active` per indicare lo stato corrente.
      ### 3.4 Modale di Notifica
      * Classe `.is-error` per bordo rosso, `.is-success` per bordo verde.
      
      ## 4. Breakpoints e Layout Responsivo
      * **Breakpoint principale:** `768px`.
      * **Sotto i 768px (Mobile):** Layout a colonna singola, vista ad agenda.
      * **Sopra i 768px (Desktop):** Layout a griglia a due colonne.
