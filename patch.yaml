commit_message: "fix(trainer): Rimuove il contenuto placeholder dalla UI statica"
rationale: |
  Questo commit corregge un errore nella precedente implementazione, rimuovendo tutto il contenuto hardcodato e i placeholder dal file `templates/trainer.html`.

  L'analisi ha rivelato che, oltre agli elementi `<li>` nella lista degli esercizi futuri, anche altri elementi come il nome dell'esercizio, i dettagli della serie e i valori iniziali dei timer erano stati inseriti come testo statico. Questo violava la regola fondamentale di non inventare contenuti.

  La modifica principale è la seguente:
  1.  **Pulizia di `templates/trainer.html`**: Tutti gli elementi destinati a contenere dati dinamici (nomi, contatori, dettagli) sono stati svuotati. Ora il file rappresenta una struttura HTML pura, senza alcun dato fittizio, pronta per essere gestita correttamente dal modulo di rendering.

  Questa correzione assicura che il template della Vista Trainer sia unicamente strutturale e allineato al 100% con i principi di sviluppo del progetto. Tutti gli altri file modificati nella patch precedente sono stati riesaminati e sono risultati corretti e privi di placeholder.
patches:
  - file: templates/trainer.html
    content: |
      <div id="trainer-page" class="page-view hidden">
          <header class="trainer-header">
              <button id="trainer-back-btn" class="btn btn-secondary">Indietro</button>
              <h2 id="trainer-title">Allenamento</h2>
              <button id="trainer-end-btn" class="btn btn-danger">Termina</button>
          </header>
          <div class="trainer-body">
              <div class="exercise-info-container">
                  <h3 id="current-exercise-name"></h3>
                  <p id="current-exercise-details"></p>
              </div>

              <div id="trainer-display-modes">

                  <div id="mode-tempo-guided" class="hidden">
                      <div class="timer-ring-container">
                          <div id="tempo-phase-name" class="timer-ring-display"></div>
                      </div>
                  </div>

                  <div id="mode-static-hold" class="hidden">
                      <div class="timer-ring-container">
                          <div id="static-hold-timer" class="timer-ring-display"></div>
                      </div>
                  </div>

                  <div id="mode-manual-reps" class="hidden">
                      <div class="manual-rep-counter-container">
                          <p>Ripetizioni Eseguite:</p>
                          <div id="manual-rep-count" class="manual-rep-counter"></div>
                      </div>
                  </div>
              </div>

              <div id="trainer-main-controls" class="trainer-controls">
                  </div>

              <div class="upcoming-exercises-container">
                  <h4>A seguire:</h4>
                  <ul id="upcoming-exercises-list" class="upcoming-exercises-list">
                  </ul>
              </div>
          </div>
      </div>
commands:
  - echo "File templates/trainer.html corretto. Tutti i placeholder sono stati rimossi."