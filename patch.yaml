    content: |
      export const DEFAULT_CSV_URL = '';
      export const LOCAL_STORAGE_KEY_PLAN = 'dynamicProtocolPlan';
      export const LOCAL_STORAGE_KEY_URL = 'dynamicProtocolUrl';
      export const DAYS = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
      export const MEAL_TYPES = ['Pranzo', 'Cena'];
  - file: src/ui/calendar.js
    content: |
      import { DAYS, MEAL_TYPES } from '../utils/constants.js';
      export function renderCalendar(element, state) {
        element.innerHTML = '';
        element.insertAdjacentHTML('beforeend', '<div class="grid-header"></div>' + DAYS.map(day => `<div class="grid-header">${day.substring(0,3)}</div>`).join(''));
        MEAL_TYPES.forEach(mealType => {
          element.insertAdjacentHTML('beforeend', `<div class="meal-type-label">${mealType}</div>`);
          DAYS.forEach(day => {
            const slotId = `${day}-${mealType}`;
            const mealId = state.weeklyPlan[slotId];
            const meal = mealId ? state.masterMealList.find(m => m.id === mealId) : null;
            const mealCardHTML = meal ? `<div class="meal-card" draggable="true" data-meal-id="${meal.id}"><h4>${meal.nomePasto}</h4><p>${meal.ingredienti || ''}</p></div>` : '';
            element.insertAdjacentHTML('beforeend', `<div class="calendar-slot" data-slot-id="${slotId}">${mealCardHTML}</div>`);
          });
        });
      }
  - file: src/ui/library.js
    content: |
      export function renderMealLibrary(element, state) {
        if (state.masterMealList.length === 0) {
          element.innerHTML = '<p>Nessun pasto caricato.</p>';
          return;
        }
        element.innerHTML = state.masterMealList.map(meal => `
          <div class="meal-card" draggable="true" data-meal-id="${meal.id}">
            <h4>${meal.nomePasto}</h4>
            <p>(${meal.tipoPasto})</p>
          </div>
        `).join('');
      }
  - file: src/core/validation.js
    content: |
      export function isSoyMealAllowed(day, mealToAdd, weeklyPlan, masterMealList) {
        if (!mealToAdd.etichette || !mealToAdd.etichette.includes('contiene-soia')) {
          return true;
        }
        const lunchSlotId = `${day}-Pranzo`;
        const dinnerSlotId = `${day}-Cena`;
        const lunchMealId = weeklyPlan[lunchSlotId];
        const dinnerMealId = weeklyPlan[dinnerSlotId];
        if (lunchMealId && lunchMealId !== mealToAdd.id) {
            const meal = masterMealList.find(m => m.id === lunchMealId);
            if (meal && meal.etichette && meal.etichette.includes('contiene-soia')) return false;
        }
        if (dinnerMealId && dinnerMealId !== mealToAdd.id) {
            const meal = masterMealList.find(m => m.id === dinnerMealId);
            if (meal && meal.etichette && meal.etichette.includes('contiene-soia')) return false;
        }
        return true;
      }
