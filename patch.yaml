commit_message: "feat(charts): Aggiunge la visualizzazione modale e migliora l'UX dei grafici"
rationale: |
  Questo commit introduce diversi miglioramenti significativi alla dashboard dei grafici, basati sul feedback dell'utente, per migliorare la leggibilità, l'interattività e la chiarezza delle informazioni.

  1. **Nuova Funzionalità: Visualizzazione Ingrandita (Modale)**: È stata implementata la funzionalità più richiesta: ogni grafico ora ha un'icona "Espandi" che permette di aprirlo in un modale a schermo intero. Questo migliora drasticamente la leggibilità e l'analisi dei dati, specialmente su dispositivi mobili. La logica gestisce la creazione e la distruzione dinamica dei grafici nel modale per ottimizzare le performance.

  2. **Miglioramento UX Grafico Biometrico**: Per migliorare la leggibilità del grafico "Andamento Dati Biometrici", la metrica quasi statica "M. Basale" è stata ora nascosta di default. Questo permette alle altre metriche più dinamiche, come il peso, di essere visualizzate su una scala più appropriata, senza che l'utente debba deselezionarla manualmente ogni volta.

  3. **Correzione Bug (Titolo Mancante)**: È stato corretto un bug per cui il titolo del grafico "Correlazione Peso e Calorie" non veniva visualizzato. Il titolo ora viene impostato correttamente durante il rendering.

  4. **Miglioramenti Minori**:
      - I tooltip del grafico "Velocità di Variazione" sono stati resi più descrittivi per una migliore comprensione.
      - Il pannello delle statistiche di riepilogo ora mostra un messaggio esplicito quando non ci sono dati sufficienti per il calcolo, invece di rimanere vuoto.
