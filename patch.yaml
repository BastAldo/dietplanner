      #exercise-editor-form .form-group { display: flex; flex-direction: column; }
      #exercise-editor-form label { margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-color-muted); }
      #exercise-editor-form input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; background-color: var(--bg-color); color: var(--text-color); }
      #exercise-editor-form .sets-group { grid-column: 1 / 3; }
      #exercise-editor-form .reps-group, #exercise-editor-form .duration-group { grid-column: 3 / 5; }
      #exercise-editor-form .rest-group { grid-column: 5 / 7; }
