commit_message: "fix: Rende il backup robusto con fallback e corregge la UI del footer"
rationale: |
  Questa patch risolve il bug critico sulla funzionalità di salvataggio del backup e migliora l'interfaccia utente, basandosi sull'ultima analisi approvata.

  1.  **Correzione Robusta della Web Share API**: La funzione `handleSaveBackup` in `src/ui/interactions.js` è stata riscritta per essere più resiliente. Ora implementa un meccanismo di fallback automatico. Tenta di utilizzare la Web Share API per un'esperienza nativa su mobile. In caso di qualsiasi errore (incluso il `NotAllowedError` riscontrato) che non sia un annullamento esplicito da parte dell'utente (`AbortError`), la funzione esegue silenziosamente un download diretto del file. Questo garantisce che l'utente riceva sempre il file di backup, indipendentemente dal supporto del browser o da altre restrizioni di sicurezza, risolvendo il problema alla radice.

  2.  **Correzione Stile Footer**: È stato risolto il problema di layout nel footer dell'applicazione. Aggiungendo la proprietà `gap` alla classe `.app-footer` in `style.css`, i pulsanti sono ora correttamente spaziati, migliorando la leggibilità e l'estetica generale dell'interfaccia.
