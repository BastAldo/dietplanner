commit_message: "fix(library): Overhaul Meal Editor modal to fix critical bugs and improve UI"
rationale: |
  This commit addresses several critical bugs and a significant UI/UX issue in the Meal Editor modal, as reported by the user. The previous implementation was unusable due to flawed event handling and a non-mobile-friendly design.

  The following fixes and improvements have been implemented:
  1.  **Robust Event Handling**: The entire event listener logic in `src/ui/modals/mealEditorModal.js` has been refactored. The fragile `cloneNode` approach has been replaced with a robust event delegation pattern. A single, persistent listener on the modal body now handles all actions (add/remove ingredient, save), fixing the critical bugs that prevented adding ingredients and saving the meal.
  2.  **Improved Meal Type Selector**: The vertical list of checkboxes for selecting "Meal Type" has been replaced with a modern, mobile-friendly horizontal group of selectable "chips" or "pills". This is more compact, intuitive, and improves the user experience on all screen sizes.
  3.  **CSS for New Components**: New styles have been added to `styles/modals.css` to support the new chip-based UI for the meal type selector, ensuring it aligns with the project's overall design system.
  4.  **Code Cleanup**: The logic within `mealEditorModal.js` has been streamlined and simplified as a result of the refactoring, making the component more maintainable.

  These changes resolve all reported issues, making the Meal Composer fully functional, stable, and user-friendly.
