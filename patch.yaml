commit_message: "refactor(trainer): Complete architectural refactor of the workout engine"
rationale: |
  This patch implements a fundamental architectural refactoring of the Trainer module to resolve critical race conditions and simplify the execution logic, based on the approved action plan.

  **Problem Analysis:**
  The previous architecture suffered from a race condition where the animation engine would process all non-timed events (speech, audio) in a single frame, "burning through" the execution queue for a set before any timed `movement` phases could be processed. This caused the workout to stall after the first set. The state-based logic for handling rest periods was also complex and tightly coupled with the animation loop.

  **Architectural Solution:**
  The Trainer's core logic has been redesigned around a simpler, more robust, and declarative model: a unified, pre-compiled execution queue.

  1.  **Unified Execution Queue (`queueBuilder.js`):** The logic for building the workout flow has been completely rewritten. Instead of creating a small queue for each set "just-in-time," a new `buildFullWorkoutQueue` function now generates a single, complete array representing the entire workout from start to finish *before* the workout begins. This queue explicitly includes `rest` periods as distinct timed phases, along with all movements, audio cues, and speech announcements.

  2.  **Elimination of State Machine (`machine.js`):** The state machine, previously responsible for transitioning between sets and exercises, has been removed. Its responsibilities are now implicitly handled by the sequential nature of the unified queue. This drastically reduces complexity.

  3.  **Sequential, Queue-Driven Animation Engine (`animation.js`):** The animation engine is now the sole driver of the workout. Its `tick` function is a simple, robust loop that does one thing: it reads the current item from the unified queue and executes it.
      * **Timed Phases (`movement`, `rest`):** A timer is run, and the queue index is advanced upon completion.
      * **Non-Timed/Async Phases (`speech`, `audio`):** An `isProcessing` lock prevents the engine from advancing until the asynchronous operation (e.g., `speak()`) is complete, ensuring strict sequential execution and eliminating all race conditions.

  4.  **Simplified Core Logic (`trainer.js`):** The main trainer file has been streamlined. Functions like `completeSet` and `advanceToNextSet` have been removed. The module is now primarily responsible for initializing the workout (which triggers the queue build), managing top-level state changes (pause, resume, end), and collecting set data as directed by the animation engine.

  This new architecture is more resilient, easier to debug, and aligns with modern front-end principles by making the workout's flow declarative and predictable.
