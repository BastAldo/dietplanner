commit_message: "fix(history): Ristruttura lo storico allenamenti per supportare sessioni multiple e corregge bug critici"
rationale: |
  Questo commit esegue un refactoring fondamentale del sistema di storico degli allenamenti per risolvere una serie di bug critici che causavano crash, dati corrotti e una UI incoerente.

  Le modifiche principali sono:

  1.  **Struttura Dati Robusta**: La logica in `src/core/state.js` è stata riscritta per garantire che `workoutHistory[date]` sia sempre un array. Questo risolve il `TypeError: .push is not a function` e permette di salvare correttamente più sessioni di allenamento per lo stesso giorno.

  2.  **Gestione Casi Limite**: La funzione `endWorkout` in `src/core/trainer.js` ora impedisce il salvataggio di riepiloghi corrotti se un allenamento viene interrotto prima di iniziare, risolvendo il bug che mostrava tempi assurdi nel debriefing.

  3.  **UI Multi-Sessione**: La vista "Log" (`plannerRenderer.js`) ora scorre l'array di allenamenti per ogni giorno, visualizzando correttamente tutte le sessioni completate. È stata aggiunta anche la funzionalità di cancellazione per ogni singola sessione.

  4.  **ID Univoci**: La generazione di `instanceId` è stata resa più robusta utilizzando `Math.random()`, eliminando i bug di contaminazione dei dati quando si utilizzano più volte esercizi identici nello stesso allenamento.

  5.  **Correzione Export**: La funzione `deleteWorkoutFromHistory` è stata correttamente esportata da `state.js`, risolvendo il `SyntaxError` del commit precedente.
