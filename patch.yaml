commit_message: "fix(UX): Risolve bug su modifica log e layout riepilogo"
rationale: |
  Questo commit corregge due bug critici segnalati dall'utente, migliorando la stabilità funzionale e la resa visiva dell'applicazione.

  1.  **Correzione Bug su Modifica Esercizio Registrato**: È stato risolto un errore fatale che impediva il funzionamento del pulsante "Modifica" nella vista Log. Il modale di modifica esercizio (`exerciseEditorModal`) è stato completamente refattorizzato per gestire correttamente due contesti: la modifica di un esercizio pianificato e la modifica di uno già registrato. Ora, il modale adatta dinamicamente la sua interfaccia per mostrare i campi pertinenti (valori di default vs. dati effettivi per ogni serie) e invoca la corretta funzione di salvataggio, rendendo la funzionalità di modifica dei log pienamente operativa come previsto.

  2.  **Correzione Layout Riepilogo Desktop e Mobile**: È stato risolto un problema di layout nel widget del riepilogo settimanale. L'implementazione è stata riportata a CSS Grid con `auto-fit`, garantendo che tutti gli elementi siano sempre visibili e distribuiti correttamente su qualsiasi dimensione dello schermo, sia mobile che desktop, eliminando i problemi di wrapping e di elementi nascosti.

  Questo intervento mirato ripristina le funzionalità chiave e assicura che l'interfaccia utente sia robusta e coerente su tutte le piattaforme.
