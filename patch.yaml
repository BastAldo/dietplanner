commit_message: "feat: Implementa la vista di debriefing post-allenamento"
rationale: |
  Questo commit introduce la vista di debriefing, una funzionalità critica richiesta dalle specifiche di progetto in `docs/00_HEALTYPRO_SPEC.md`.

  Seguendo il piano d'azione approvato, sono state apportate le seguenti modifiche:

  1.  **Gestione dello Stato**: È stata aggiunta una nuova proprietà `lastWorkoutSummary` allo stato globale in `src/core/state.js` per conservare i risultati dell'ultimo allenamento completato.
  2.  **Flusso del Trainer**: La funzione `endWorkout` in `src/core/trainer.js` è stata modificata. Ora cattura lo stato finale dell'allenamento, lo salva nello stato globale e reindirizza l'utente alla nuova vista di debriefing.
  3.  **Nuova Vista 'debriefing'**:
      * Creato il template `templates/debriefing.html` e gli stili associati in `styles/debriefing.css`.
      * Aggiornato il Service Worker (`sw.js`) per mettere in cache le nuove risorse.
      * Integrata la nuova vista nel `viewLoader.js` e nel renderer principale (`renderer.js`).
  4.  **Logica di Rendering**: È stata creata una nuova funzione `renderDebriefingPage` in `src/ui/pageRenderers.js` per mostrare dinamicamente i risultati dell'allenamento.
  5.  **Interazioni Utente**: È stato aggiunto un nuovo modulo `src/ui/interactions/debriefingInteractions.js` per gestire l'interazione dell'utente all'interno della vista di debriefing, come il ritorno alla pagina del planner.
