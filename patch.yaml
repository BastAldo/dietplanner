  - file: style.css
    content: |
      :root { /* ... (variabili invariate) ... */ }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Roboto', sans-serif; background-color: var(--color-background); color: var(--color-text-primary); }
      /* ... (stili header, footer, bottoni, etc. invariati) ... */
      
      /* --- Layout di Base (Mobile First) --- */
      .main-container { display: flex; flex-direction: column; gap: 1.5rem; padding: 1rem; }
      .calendar-grid { display: flex; flex-direction: column; gap: 1rem; }
      .day-card { background: var(--color-surface); border-radius: 8px; border: 1px solid var(--color-border); padding: 1rem; }
      .day-header { font-weight: 700; font-size: 1.2rem; margin-bottom: 0.75rem; }
      .day-slots { display: grid; grid-template-columns: 1fr 3fr; gap: 0.75rem; align-items: center; }
      .meal-type-label-mobile { font-weight: 500; text-align: right; }
      .calendar-slot { /* ... (stili base invariati) ... */ }
      .meal-card:hover .delete-meal-btn { opacity: 1; }
      
      .library-container { order: -1; } /* Mostra la libreria prima del calendario su mobile */
      
      /* --- Layout Desktop (Sovrascrive quello mobile) --- */
      @media (min-width: 768px) {
        .main-container { display: grid; grid-template-columns: 3fr 1fr; gap: 2rem; padding: 2rem; }
        .library-container { order: 0; }
        .calendar-grid { display: grid; grid-template-columns: 1fr repeat(7, 2fr); gap: 0.5rem; }
        .day-card, .day-header, .day-slots, .meal-type-label-mobile { display: none; } /* Nasconde la vista mobile */
        .grid-header, .meal-type-label { display: block; /* Mostra la vista desktop */ }
      }

      /* ... (altri stili invariati, inclusi i modali e le meal-card) ... */
      .selection-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 60vh; overflow-y: auto; }
      .selection-item { padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 8px; cursor: pointer; }
      .selection-item:hover { background-color: var(--color-background); }
