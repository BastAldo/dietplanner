commit_message: "feat(trainer): Implementa modalità di esecuzione multiple per gli esercizi"
rationale: |
  Questo commit introduce una funzionalità architetturale chiave come descritto in `docs/02_ARCHITECTURE.md`: le modalità di esecuzione multiple per gli esercizi nel Trainer.

  Sono state implementate tre modalità distinte:
  1.  `tempo_guided`: La modalità esistente, basata su un ciclo di tempo guidato per ogni ripetizione.
  2.  `static_hold`: Una nuova modalità per esercizi isometrici (es. Plank), che visualizza un timer centrale con un conto alla rovescia per la durata della serie.
  3.  `manual_reps`: Una nuova modalità per serie a sfinimento, che mostra un contatore e un pulsante per permettere all'utente di registrare manualmente ogni ripetizione completata.

  Per supportare ciò, sono state apportate le seguenti modifiche:
  - **`templates/trainer.html`**: Aggiunti i nuovi elementi UI per le modalità `static_hold` e `manual_reps`.
  - **`styles/trainer.css`**: Aggiunti gli stili per i nuovi elementi, garantendo un'integrazione visiva coerente.
  - **`src/config/uiText.js`**: Inserite le nuove etichette testuali necessarie per l'interfaccia.
  - **`src/core/trainer/state.js`**: Esteso lo stato del trainer per gestire le variabili specifiche delle nuove modalità (es. `setTimeRemaining`, `manualRepCount`).
  - **`src/core/trainer/animation.js`**: Aggiornato il loop di animazione per gestire il countdown del timer in modalità `static_hold`.
  - **`src/core/trainer.js`**: La logica principale del trainer è stata refattorizzata per essere polimorfica. Ora controlla la proprietà `execution_mode` dell'esercizio corrente e avvia/gestisce la logica e lo stato appropriati. È stata aggiunta una nuova funzione `incrementManualRep` per la modalità manuale.
  - **`src/ui/components/TrainerComponent.js`**: Il componente UI è stato reso dinamico. Il metodo `render` ora mostra e nasconde i contenitori UI corretti (`mode-tempo-guided`, `mode-static-hold`, `mode-manual-reps`) in base alla modalità attiva e aggiorna i relativi display (timer, contatore, etc.).
