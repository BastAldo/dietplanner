                          <input type="text" id="manual-workout-name" name="name" required>
                      </div>
                      <div class="form-group">
                          <label id="manual-workout-duration-label" for="manual-workout-duration"></label>
                          <input type="text" id="manual-workout-duration" name="duration">
                      </div>
                      <div class="form-group">
                          <label id="manual-workout-distance-label" for="manual-workout-distance"></label>
                          <input type="number" id="manual-workout-distance" name="distance" min="0" step="0.1">
                      </div>
                      <div class="form-group">
                          <label id="manual-workout-fc-avg-label" for="manual-workout-fc-avg"></label>
                          <input type="number" id="manual-workout-fc-avg" name="fc_avg" min="0">
                      </div>
                      <div class="form-group">
                          <label id="manual-workout-fc-max-label" for="manual-workout-fc-max"></label>
                          <input type="number" id="manual-workout-fc-max" name="fc_max" min="0">
                      </div>
                      <div class="form-group full-width">
                          <label id="manual-workout-notes-label" for="manual-workout-notes"></label>
                          <textarea id="manual-workout-notes" name="notes" rows="3"></textarea>
                      </div>
                  </form>
              </div>
              <div class="modal-footer">
                  <button type="submit" form="manual-workout-form" class="btn btn-primary" id="manual-workout-save-btn"></button>
              </div>
          </div>
      </div>
  - file: styles/modals.css
    content: |
      /* --- MODALS --- */
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1001; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
      .modal-hidden { display: none !important; }
      .modal-overlay:not(.modal-hidden) { display: flex; opacity: 1; pointer-events: all; }
      .modal-content { background-color: var(--card-color); border-radius: 8px; border: 1px solid var(--border-color); width: 90%; max-width: 600px; display: flex; flex-direction: column; max-height: 90vh; position: relative; }
      .modal-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); }
      .modal-header h3 { color: var(--primary-color); }
      .modal-close-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-color-muted); padding: 0; line-height: 1; width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background-color 0.2s, color 0.2s; z-index: 10; }
      .modal-close-btn svg { width: 1em; height: 1em; }
      .modal-close-btn:hover { background-color: rgba(255, 255, 255, 0.1); color: var(--text-color); }
      .modal-body { overflow-y: auto; flex-grow: 1; padding: 1.5rem; }
      .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 1rem; }
      .selection-list { display: flex; flex-direction: column; gap: 0.5rem; }
      .selection-item { padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: background-color 0.2s, border-color 0.2s; }
      .selection-item:hover { background-color: var(--bg-color); border-color: var(--primary-color); }
      .day-editor-list { display: flex; flex-direction: column; gap: 0.5rem; }
      .day-editor-slot { display: flex; align-items: center; gap: 1rem; padding: 0.75rem; background: var(--bg-color); border-radius: 8px; }
      .day-editor-slot .meal-type-label { font-weight: bold; color: var(--text-color-muted); flex-shrink: 0; width: 150px; }
      .meal-details-container { flex-grow: 1; min-width: 0; }
      .workout-summary { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 1rem; }
      .workout-summary-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .meal-details { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; border-bottom: 1px solid var(--border-color); }
      .meal-details:last-of-type { border-bottom: none; }
      .meal-details__name { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-weight: 500;}
      .meal-actions { display: flex; align-items: center; gap: 0.25rem; flex-shrink: 0; margin-left: auto; }
      .meal-actions button { background: none; border: none; color: var(--text-color-muted); cursor: pointer; padding: 0.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
      .meal-actions button:hover { background-color: rgba(255,255,255,0.1); color: var(--text-color); }
      .meal-actions .btn-remove-exercise { color: var(--danger-color); }
      .exercise-info { display: flex; flex-direction: column; gap: 0.25rem; }
      .exercise-details-summary { font-size: 0.85rem; color: var(--text-color-muted); }
      .btn-add-meal, .btn-add-exercise { background: transparent; border: 1px dashed var(--border-color); color: var(--text-color-muted); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; width: 100%; transition: all 0.2s; }
      .btn-add-meal:hover, .btn-add-exercise:hover { background: var(--card-color); border-color: var(--secondary-color); color: var(--secondary-color); }
      #exercise-editor-form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      #exercise-editor-form .form-group { display: flex; flex-direction: column; }
      #exercise-editor-form label { margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-color-muted); }
      #exercise-editor-form input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; background-color: var(--bg-color); color: var(--text-color); }
      #exercise-editor-form .tempo-group, #exercise-editor-form .weight-group { grid-column: 1 / -1; }

      .structured-form { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
      .structured-form .full-width { grid-column: 1 / -1; }

      .drag-handle { cursor: grab; color: var(--text-color-muted); padding: 0.5rem; }
      .draggable-item { background-color: var(--bg-color); border-radius: 8px; }
      .sortable-ghost { opacity: 0.4; background: var(--primary-color); }

      @media (max-width: 480px) {
        .workout-summary {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.75rem;
        }
        .workout-summary-actions {
          width: 100%;
          display: flex;
          flex-wrap: wrap;
        }
        .workout-summary-actions .btn {
          flex-grow: 1;
        }
      }
  - file: styles/trainer.css
    content: |
      /* --- TRAINER VIEW STYLES --- */
      #trainer-page {
          height: calc(100vh - 60px);
          display: flex;
          flex-direction: column;
          background-color: var(--bg-color);
          color: var(--text-color);
      }

      .trainer-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          background-color: var(--card-color);
          border-bottom: 1px solid var(--border-color);
          flex-shrink: 0;
          gap: 1rem;
      }

      .trainer-header h2 {
          font-size: 1.25rem;
          color: var(--primary-color);
          flex-grow: 1;
          text-align: center;
      }

      .trainer-header-controls {
          position: absolute;
          right: 1rem;
          display: flex;
          gap: 0.5rem;
      }

      #audio-toggle-btn {
          background: none;
          border: none;
          color: var(--text-color-muted);
          cursor: pointer;
          padding: 0.5rem;
      }

      #audio-toggle-btn.active {
          color: var(--primary-color);
      }

      .trainer-body {
          flex-grow: 1;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          text-align: center;
          position: relative;
          overflow-y: auto;
      }

      .exercise-info-container {
          margin-top: 1rem;
          margin-bottom: 1rem;
      }

      #current-exercise-name {
          font-size: 2rem;
          font-weight: bold;
      }

      #current-exercise-details {
          font-size: 1.25rem;
          color: var(--text-color-muted);
          margin-bottom: 0.5rem;
      }

      #current-rep-display {
        font-size: 1rem;
        color: var(--secondary-color);
        font-weight: bold;
        min-height: 1.2em;
      }

      #current-rep-display.hidden-rep {
        visibility: hidden;
      }

      #upcoming-exercise-display {
        font-size: 0.9rem;
        color: var(--text-color-muted);
        margin-top: 0.75rem;
        font-style: italic;
      }

      #upcoming-exercise-display strong {
        color: var(--text-color);
        font-style: normal;
      }

      #trainer-display-modes {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-grow: 1;
          min-height: 280px;
      }

      .timer-ring-container {
          width: 280px;
          height: 280px;
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          margin: 1rem 0;
      }

      .timer-ring-display {
          font-size: 2.2rem;
          font-weight: bold;
          fill: var(--text-color);
          text-transform: uppercase;
          text-anchor: middle;
          transition: font-size 0.2s ease;
      }

      .timer-ring-display.is-timer {
          font-size: 4rem;
          font-family: 'Courier New', Courier, monospace;
          text-transform: none;
      }

      .timer-ring-display.is-rep-count {
          font-size: 6rem;
          text-transform: none;
      }

      .timer-ring-bg {
          fill: none;
          stroke: var(--card-color);
          stroke-width: 12;
      }

      .timer-ring-progress {
          fill: none;
          stroke: var(--primary-color);
          stroke-width: 12;
          stroke-linecap: round;
          transform: rotate(-90deg);
          transform-origin: 50% 50%;
          transition: stroke-dashoffset 0.1s linear;
      }

      .timer-ring-progress.phase-up { stroke: var(--success-color); }
      .timer-ring-progress.phase-hold { stroke: var(--warning-color); }
      .timer-ring-progress.phase-down { stroke: var(--danger-color); }

      @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .flashing {
        animation: flash 1.4s infinite;
        fill: var(--secondary-color);
      }

      .trainer-controls {
          display: flex;
          gap: 1rem;
          justify-content: center;
          align-items: center;
          margin-top: 1rem;
          height: 80px;
          width: 100%;
          padding-bottom: 1rem;
      }

      .btn-large {
          padding: 1rem 2rem;
          font-size: 1.25rem;
      }
  - file: src/utils/audioFeedback.js
    content: |
      let audioContext = null;

      function getAudioContext() {
          if (!audioContext) {
              try {
                  audioContext = new (window.AudioContext || window.webkitAudioContext)();
              } catch (e) {
                  console.error("Web Audio API is not supported in this browser");
              }
          }
          return audioContext;
      }

      function playSound(type) {
          const ctx = getAudioContext();
          if (!ctx) return;

          const oscillator = ctx.createOscillator();
          const gainNode = ctx.createGain();

          oscillator.connect(gainNode);
          gainNode.connect(ctx.destination);

          if (type === 'start') {
              oscillator.type = 'sine';
              oscillator.frequency.setValueAtTime(440, ctx.currentTime); // A4
              gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
              gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
              oscillator.start(ctx.currentTime);
              oscillator.stop(ctx.currentTime + 0.5);
          } else if (type === 'stop') {
              oscillator.type = 'sine';
              oscillator.frequency.setValueAtTime(220, ctx.currentTime); // A3
              gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
              gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
              oscillator.start(ctx.currentTime);
              oscillator.stop(ctx.currentTime + 0.5);
          } else if (type === 'tick') {
              oscillator.type = 'triangle';
              oscillator.frequency.setValueAtTime(880, ctx.currentTime); // A5
              gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
              gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
              oscillator.start(ctx.currentTime);
              oscillator.stop(ctx.currentTime + 0.2);
          }
      }

      export function playStartCue() {
          playSound('start');
      }

      export function playStopCue() {
          playSound('stop');
      }

      export function playTick() {
          playSound('tick');
      }
