commit_message: "feat(library): Implementa creazione e modifica esercizi (Fase 2c)"
rationale: |
  Implemento la Fase 2c per completare il CRUD (Create, Read, Update, Delete) per gli Esercizi nella Libreria.

  1.  **`src/config/uiText.js`**: Aggiunti i nuovi testi necessari per il modal editor degli esercizi (`EXERCISE_NEW_TITLE`, `EXERCISE_EDIT_TITLE`, `EXERCISE_SAVE_BTN_LIB`, `EXERCISE_CREATE_SUCCESS`, `EXERCISE_UPDATE_SUCCESS`, `EXERCISE_ID_CONFLICT`) e per il form (`EXERCISE_FIELD_...`).
  2.  **`src/config/forms.js`**: Aggiunta la definizione `EXERCISE_FIELDS` per descrivere la struttura del form di un esercizio. Questo centralizza la logica del form.
  3.  **`src/ui/modals/exerciseEditorModal.js`**:
      * File refattorizzato pesantemente per gestire il nuovo `config.context: 'library'`.
      * Ora importa `addExercise`, `updateExercise` da `state.js` e `EXERCISE_FIELDS` da `forms.js`.
      * La funzione `renderPlannerForm` è stata rinominata e generalizzata in `renderExerciseForm` per costruire il form dinamicamente da `EXERCISE_FIELDS`.
      * La logica `toggleFormFields` è stata aggiornata per gestire i nuovi ID del form.
      * La funzione `openExerciseEditorModal` ora gestisce 3 contesti:
          * **`planner` (vecchio)**: Salva le modifiche (es. sets, reps) a un'istanza di esercizio in un giorno.
          * **`history` (vecchio)**: Salva le modifiche ai dati di un esercizio già registrato.
          * **`library` (nuovo)**: Permette di creare un *nuovo* esercizio (`addExercise`) o modificare un esercizio *master* (`updateExercise`) nella libreria.
      * L'handler di salvataggio ora gestisce la raccolta di *tutti* i dati dal form quando `context === 'library'` e chiama le funzioni appropriate di `state.js`.
  4.  **`src/ui/interactions/libraryInteractions.js`**:
      * Importato `openExerciseEditorModal`.
      * Nella `handleLibraryClick` (tab 'exercises'), i pulsanti `#add-exercise-btn` e `.btn-edit` sono ora collegati.
      * `#add-exercise-btn` apre il modal in modalità creazione: `openExerciseEditorModal({ context: 'library', exercise: null })`.
      * `.btn-edit` apre il modal in modalità modifica: `openExerciseEditorModal({ context: 'library', exercise: exercise })`.
  5.  **`src/ui/modals.js`**: Aggiunta `openExerciseEditorModal` all'export per renderla disponibile agli altri moduli.
