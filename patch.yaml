    content: |
      import { getWorkoutState, updateState } from './state.js';
      import { advanceToNextSet } from './machine.js';
      import { completeSet } from '../trainer.js';
      import { playTick, playStartCue, playStopCue, speak } from '../../utils/audioFeedback.js';

      let animationFrameId = null;
      let lastTickTimestamp = 0;

      function processQueue() {
        const state = getWorkoutState();
        if (state.status !== 'running') return;

        const { executionQueue, currentPhaseIndex, isAudioEnabled } = state;
        const currentPhase = executionQueue[currentPhaseIndex];

        // If it's an instantaneous command (like audio), execute and advance
        if (currentPhase && currentPhase.type) {
          if (isAudioEnabled) {
            if (currentPhase.type === 'audio') {
              if (currentPhase.cue === 'tick') playTick();
              else if (currentPhase.cue === 'start') playStartCue();
              else if (currentPhase.cue === 'stop') playStopCue();
            } else if (currentPhase.type === 'speech') {
              speak(currentPhase.text);
            }
          }
          const newPhaseIndex = currentPhaseIndex + 1;
          if (newPhaseIndex < executionQueue.length) {
            updateState({ currentPhaseIndex: newPhaseIndex });
            processQueue(); // Process next item immediately
          } else {
            completeSet();
          }
        }
      }

      function tick(timestamp) {
        if (lastTickTimestamp === 0) {
          lastTickTimestamp = timestamp;
        }
        const deltaTime = timestamp - lastTickTimestamp;
        lastTickTimestamp = timestamp;

        const state = getWorkoutState();
        if (state.status === 'finished' || state.status === 'paused' || state.status === 'idle') {
          stopAnimation();
          return;
        }

        if (state.status === 'running') {
            const { executionQueue, currentPhaseIndex } = state;
            const currentPhase = executionQueue[currentPhaseIndex];

            // It must be a timed phase (movement)
            if (currentPhase && currentPhase.duration) {
              const newPhaseTimeElapsed = state.phaseTimeElapsed + deltaTime;

              if (newPhaseTimeElapsed >= currentPhase.duration) {
                const newPhaseIndex = currentPhaseIndex + 1;
                updateState({
                  currentPhaseIndex: newPhaseIndex,
                  phaseTimeElapsed: 0,
                  currentRep: executionQueue[newPhaseIndex]?.rep || state.currentRep,
                });
                processQueue(); // Check if the next item is a command
              } else {
                updateState({ phaseTimeElapsed: newPhaseTimeElapsed });
              }
            } else if (!currentPhase) {
                // End of queue
                completeSet();
            }

        } else if (state.executionMode === 'static_hold') {
            const newSetTimeRemaining = state.setTimeRemaining - deltaTime;
            if (newSetTimeRemaining <= 0) {
                if (state.isAudioEnabled) playStopCue();
                completeSet();
            } else {
                updateState({ setTimeRemaining: newSetTimeRemaining });
            }
        } else if (state.status === 'resting') {
          const newRestTimeRemaining = state.restTimeRemaining - deltaTime;
          if (newRestTimeRemaining <= 0) {
            advanceToNextSet();
          } else {
            updateState({ restTimeRemaining: newRestTimeRemaining });
          }
        }

        document.dispatchEvent(new CustomEvent('workoutStateChange'));

        if (getWorkoutState().status !== 'paused' && getWorkoutState().status !== 'idle') {
          animationFrameId = requestAnimationFrame(tick);
        }
      }

      export function startAnimation() {
        if (animationFrameId) return;
        lastTickTimestamp = 0;
        processQueue(); // Initial check for commands at the start
        animationFrameId = requestAnimationFrame(tick);
      }

      export function stopAnimation() {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
      }
  - file: src/core/trainer/machine.js
    content: |
      import { getWorkoutState, updateState, resetState } from './state.js';
      import { buildExecutionQueueForCurrentSet } from './queueBuilder.js';
      import { speak, playStartCue } from '../../utils/audioFeedback.js';
      import { UI_TEXT } from '../../config/uiText.js';

      function startNextExercise() {
          const state = getWorkoutState();
          const nextExercise = state.exerciseQueue[state.currentExerciseIndex];
          const executionMode = nextExercise.execution_mode || 'tempo_guided';
          
          let nextState = {
              status: 'running',
              currentSet: 1,
              currentRep: 1,
              manualRepCount: 0,
              executionMode: executionMode,
              phaseStartTime: Date.now(),
          };

          if (executionMode === 'tempo_guided') {
              nextState.executionQueue = buildExecutionQueueForCurrentSet();
              nextState.currentPhaseIndex = 0;
              nextState.phaseTimeElapsed = 0;
          } else if (executionMode === 'static_hold') {
              nextState.setTimeRemaining = nextExercise.defaultDuration * 1000;
          }
          
          updateState(nextState);
      }

      export function advanceToNextSet() {
        const state = getWorkoutState();
        const newSet = state.currentSet + 1;
        const currentExercise = state.exerciseQueue[state.currentExerciseIndex];

        if (state.isAudioEnabled) {
          playStartCue();
        }

        if (newSet > currentExercise.defaultSets) {
          advanceToNextExercise();
        } else {
          let nextState = {
            status: 'running',
            currentSet: newSet,
            phaseTimeElapsed: 0,
            currentRep: 1,
            manualRepCount: 0,
            phaseStartTime: Date.now()
          };
          if (state.executionMode === 'tempo_guided') {
            nextState.executionQueue = buildExecutionQueueForCurrentSet();
            nextState.currentPhaseIndex = 0;
          } else if (state.executionMode === 'static_hold') {
            nextState.setTimeRemaining = currentExercise.defaultDuration * 1000;
          }
          updateState(nextState);
        }
      }

      export function advanceToNextExercise() {
        const state = getWorkoutState();
        const newIndex = state.currentExerciseIndex + 1;

        if (newIndex >= state.exerciseQueue.length) {
          document.dispatchEvent(new CustomEvent('workoutFinished'));
        } else {
          if (state.isAudioEnabled) {
            const nextExercise = state.exerciseQueue[newIndex];
            if (nextExercise) {
                speak(`${UI_TEXT.VOICE_GUIDE_NEXT_EXERCISE}: ${nextExercise.name}`);
            }
          }
          updateState({
            currentExerciseIndex: newIndex
          });
          startNextExercise();
        }
      }
  - file: src/core/trainer/queueBuilder.js
    content: |
      import { getWorkoutState } from './state.js';
      import { UI_TEXT } from '../../config/uiText.js';

      export function buildExecutionQueueForCurrentSet() {
        const state = getWorkoutState();
        const currentExercise = state.exerciseQueue[state.currentExerciseIndex];
        if (!currentExercise || currentExercise.type !== 'reps') return [];

        const queue = [];
        const reps = currentExercise.defaultReps;
        const tempo = currentExercise.defaultTempo;

        queue.push({ type: 'speech', text: `${UI_TEXT.VOICE_GUIDE_SET_START}` });

        for (let i = 0; i < reps; i++) {
          if (tempo) {
            // UP
            queue.push({ type: 'speech', text: UI_TEXT.VOICE_GUIDE_PHASE_UP });
            queue.push({ name: 'pre-up', rep: i + 1, duration: 700 });
            queue.push({ name: 'up', rep: i + 1, duration: tempo.up * 1000 });
            queue.push({ type: 'audio', cue: 'tick' });

            // HOLD
            if (tempo.hold > 0) {
              queue.push({ type: 'speech', text: UI_TEXT.VOICE_GUIDE_PHASE_HOLD });
              queue.push({ name: 'pre-hold', rep: i + 1, duration: 700 });
              queue.push({ name: 'hold', rep: i + 1, duration: tempo.hold * 1000 });
              queue.push({ type: 'audio', cue: 'tick' });
            }

            // DOWN
            queue.push({ type: 'speech', text: UI_TEXT.VOICE_GUIDE_PHASE_DOWN });
            queue.push({ name: 'pre-down', rep: i + 1, duration: 700 });
            queue.push({ name: 'down', rep: i + 1, duration: tempo.down * 1000 });
            queue.push({ type: 'audio', cue: 'tick' });
          }
        }
        queue.push({ type: 'audio', cue: 'stop' });
        return queue;
      }
  - file: src/ui/components/TrainerComponent.js
    content: |
      import { getWorkoutState, updateState } from '../../core/trainer/state.js';
      import { startWorkout, pauseWorkout, resumeWorkout, endWorkout, incrementManualRep } from '../../core/trainer.js';
      import { setView, getState as getGlobalState } from '../../core/state.js';
      import { log } from '../../utils/logger.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { renderIcon } from '../icons.js';
      import { showConfirmModal } from '../modals.js';

      const RING_RADIUS = 128;
      const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

      export class TrainerComponent {
          constructor(containerElement) {
              this.container = containerElement;

              this.elements = {
                  exerciseName: this.container.querySelector('#current-exercise-name'),
                  exerciseDetails: this.container.querySelector('#current-exercise-details'),
                  repDisplay: this.container.querySelector('#current-rep-display'),
                  upcomingDisplay: this.container.querySelector('#upcoming-exercise-display'),

                  btnStart: this.container.querySelector('#trainer-start-btn'),
                  btnPause: this.container.querySelector('#trainer-pause-btn'),
                  btnResume: this.container.querySelector('#trainer-resume-btn'),
                  btnManualRep: this.container.querySelector('#trainer-manual-rep-btn'),
                  btnAudio: this.container.querySelector('#audio-toggle-btn'),

                  ringContainer: this.container.querySelector('#timer-ring-container'),
                  debugView: this.container.querySelector('#debug-queue-view'),
                  debugOutput: this.container.querySelector('#debug-queue-output')
              };

              this.ringProgress = null;
              this.ringText = null;
          }

          mount() {
              this.createTimerRing();
              this.container.addEventListener('click', this.handleControls.bind(this));
              this.elements.btnManualRep.textContent = UI_TEXT.TRAINER_MANUAL_REP_BTN_LABEL;
              this.updateAudioButton(getWorkoutState().isAudioEnabled);
          }

          destroy() {
              log('TrainerComponent', 'Destroying component and cleaning up DOM...');
              this.container.removeEventListener('click', this.handleControls.bind(this));
              if (this.elements.ringContainer) {
                  this.elements.ringContainer.innerHTML = '';
              }
              log('TrainerComponent', 'Component destroyed.');
          }

          handleControls(e) {
              const target = e.target.closest('button');
              if (!target) return;

              const targetId = target.id;
              log('TrainerComponent', `Control button clicked: ${targetId}`);
              switch (targetId) {
                  case 'trainer-start-btn': startWorkout(); break;
                  case 'trainer-pause-btn': pauseWorkout(); break;
                  case 'trainer-resume-btn': resumeWorkout(); break;
                  case 'trainer-end-btn':
                      showConfirmModal(
                          UI_TEXT.TERMINATE_WORKOUT_CONFIRM_TITLE,
                          UI_TEXT.TERMINATE_WORKOUT_CONFIRM_MSG,
                          () => endWorkout(),
                          'danger'
                      );
                      break;
                  case 'trainer-back-btn': setView('planner'); break;
                  case 'trainer-manual-rep-btn': incrementManualRep(); break;
                  case 'audio-toggle-btn': this.toggleAudio(); break;
              }
          }

          toggleAudio() {
              const currentState = getWorkoutState();
              const newState = !currentState.isAudioEnabled;
              updateState({ isAudioEnabled: newState });
              this.updateAudioButton(newState);
          }

          updateAudioButton(isAudioEnabled) {
              this.elements.btnAudio.innerHTML = renderIcon(isAudioEnabled ? 'AUDIO_ON' : 'AUDIO_OFF');
              this.elements.btnAudio.classList.toggle('active', isAudioEnabled);
          }

          createTimerRing() {
              if (this.elements.ringContainer.querySelector('svg')) {
                log('TrainerComponent', 'Timer ring SVG already exists. Skipping creation.');
                return;
              }
              log('TrainerComponent', 'Creating timer ring SVG...');
              this.elements.ringContainer.innerHTML = '';
              const svgNS = 'http://www.w3.org/2000/svg';
              const svg = document.createElementNS(svgNS, 'svg');
              const svgSize = (RING_RADIUS + 12) * 2;
              svg.setAttribute('width', svgSize);
              svg.setAttribute('height', svgSize);
              svg.setAttribute('viewBox', `0 0 ${svgSize} ${svgSize}`);

              const center = svgSize / 2;

              const backgroundCircle = document.createElementNS(svgNS, 'circle');
              backgroundCircle.setAttribute('cx', center);
              backgroundCircle.setAttribute('cy', center);
              backgroundCircle.setAttribute('r', RING_RADIUS);
              backgroundCircle.setAttribute('class', 'timer-ring-bg');

              const progressCircle = document.createElementNS(svgNS, 'circle');
              progressCircle.setAttribute('cx', center);
              progressCircle.setAttribute('cy', center);
              progressCircle.setAttribute('r', RING_RADIUS);
              progressCircle.setAttribute('class', 'timer-ring-progress');
              progressCircle.style.strokeDasharray = RING_CIRCUMFERENCE;

              const text = document.createElementNS(svgNS, 'text');
              text.setAttribute('x', '50%');
              text.setAttribute('y', '50%');
              text.setAttribute('dy', '.3em');
              text.setAttribute('class', 'timer-ring-display');

              svg.appendChild(backgroundCircle);
              svg.appendChild(progressCircle);
              svg.appendChild(text);
              this.elements.ringContainer.prepend(svg);
              this.ringProgress = progressCircle;
              this.ringText = text;
              log('TrainerComponent', 'Timer ring SVG created and references set.');
          }

          updateTimerRing(percent) {
              if (!this.ringProgress) return;
              const offset = RING_CIRCUMFERENCE - (percent / 100) * RING_CIRCUMFERENCE;
              this.ringProgress.style.strokeDashoffset = offset;
          }

          formatTime(ms) {
              const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
              const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
              const seconds = (totalSeconds % 60).toString().padStart(2, '0');
              return `${minutes}:${seconds}`;
          }

          render(state) {
              if (!this.ringText) return; // Guard against rendering before mount
              const { exerciseQueue, currentExerciseIndex, status, executionMode } = state;

              this.renderDebugView(state);

              if (currentExerciseIndex < 0 || currentExerciseIndex >= exerciseQueue.length) {
                  this.elements.exerciseName.textContent = '';
                  this.elements.exerciseDetails.textContent = '';
                  this.elements.repDisplay.classList.add('hidden-rep');
                  this.elements.upcomingDisplay.innerHTML = '';
                  this.elements.btnStart.classList.add('hidden');
                  this.elements.btnPause.classList.add('hidden');
                  this.elements.btnResume.classList.add('hidden');
                  this.elements.btnManualRep.classList.add('hidden');
                  this.ringText.textContent = '';
                  this.updateTimerRing(0);
                  return;
              };

              const currentExercise = exerciseQueue[currentExerciseIndex];
              this.elements.exerciseName.textContent = currentExercise.name;
              this.elements.exerciseDetails.textContent = this.formatExerciseDetails(state);

              if (status === 'running' && executionMode === 'tempo_guided') {
                this.elements.repDisplay.textContent = `${UI_TEXT.TRAINER_REP_LABEL} ${state.currentRep}`;
                this.elements.repDisplay.classList.remove('hidden-rep');
              } else {
                this.elements.repDisplay.classList.add('hidden-rep');
              }

              const upcomingExercises = exerciseQueue.slice(currentExerciseIndex + 1, currentExerciseIndex + 3).map(ex => ex.name).join(', ');
              if (upcomingExercises) {
                this.elements.upcomingDisplay.innerHTML = `<strong>${UI_TEXT.TRAINER_UPCOMING_LABEL}</strong> ${upcomingExercises}`;
              } else {
                this.elements.upcomingDisplay.innerHTML = '';
              }

              this.elements.btnStart.classList.toggle('hidden', status !== 'idle');
              this.elements.btnPause.classList.toggle('hidden', status !== 'running' && status !== 'resting');
              this.elements.btnResume.classList.toggle('hidden', status !== 'paused');
              this.elements.btnManualRep.classList.toggle('hidden', !(status === 'running' && executionMode === 'manual_reps'));

              // --- Main Render Logic ---
              if (status === 'running') {
                  this.ringText.classList.remove('flashing');
                  if (executionMode === 'tempo_guided') this.renderPhase(state);
                  else if (executionMode === 'static_hold') this.renderStaticHold(state);
                  else if (executionMode === 'manual_reps') this.renderManualReps(state);
              } else if (status === 'resting') {
                  this.renderRest(state);
              } else if (status === 'paused') {
                  this.renderPaused(state);
              } else if (status === 'idle') {
                  this.ringText.textContent = '';
                  this.ringText.classList.remove('flashing', 'is-timer', 'is-rep-count', 'is-phase');
                  this.updateTimerRing(0);
              }
          }

          renderPhase(state) {
              const { executionQueue, currentPhaseIndex, phaseTimeElapsed } = state;
              const phase = executionQueue[currentPhaseIndex];
              if (!phase || !phase.name) return;

              const phaseNameDisplay = phase.name.replace('pre-', '').toUpperCase();
              const isPrePhase = phase.name.startsWith('pre-');

              this.ringText.textContent = phaseNameDisplay;
              this.ringText.classList.add('is-phase');
              this.ringText.classList.toggle('flashing', isPrePhase);
              this.ringText.classList.remove('is-timer', 'is-rep-count');

              if (isPrePhase) {
                  this.updateTimerRing(100);
              } else {
                  const progressPercent = Math.min(100, (phaseTimeElapsed / phase.duration) * 100);
                  this.updateTimerRing(progressPercent);
              }
          }

          renderStaticHold(state) {
              const { setTimeRemaining } = state;
              const currentExercise = state.exerciseQueue[state.currentExerciseIndex];
              const totalDuration = currentExercise.defaultDuration * 1000;
              const progressPercent = (totalDuration > 0) ? ((totalDuration - setTimeRemaining) / totalDuration) * 100 : 100;

              this.ringText.textContent = this.formatTime(setTimeRemaining);
              this.ringText.classList.add('is-timer');
              this.ringText.classList.remove('is-rep-count', 'is-phase');
              this.updateTimerRing(progressPercent);
          }

          renderManualReps(state) {
              const { manualRepCount } = state;
              const currentExercise = state.exerciseQueue[state.currentExerciseIndex];
              const targetReps = currentExercise.defaultReps;
              let progressPercent = 0;
              if (targetReps > 0) {
                  progressPercent = (manualRepCount / targetReps) * 100;
              }

              this.ringText.textContent = manualRepCount;
              this.ringText.classList.add('is-rep-count');
              this.ringText.classList.remove('is-timer', 'is-phase');
              this.updateTimerRing(progressPercent);
          }

          renderRest(state) {
              const { restTimeRemaining } = state;
              const totalRest = state.exerciseQueue[state.currentExerciseIndex].defaultRest * 1000;
              const progressPercent = (totalRest > 0) ? ((totalRest - restTimeRemaining) / totalRest) * 100 : 100;

              this.ringText.textContent = UI_TEXT.TRAINER_REST_LABEL;
              this.ringText.classList.add('is-phase');
              this.ringText.classList.remove('flashing', 'is-timer', 'is-rep-count');
              this.updateTimerRing(progressPercent);
          }

          renderPaused(state) {
              this.ringText.textContent = UI_TEXT.TRAINER_PAUSED_LABEL;
              this.ringText.classList.add('is-phase');
              this.ringText.classList.remove('flashing');
              // Mantieni la classe di stile precedente per coerenza
              if(state.executionMode === 'static_hold') this.ringText.classList.add('is-timer');
              if(state.executionMode === 'manual_reps') this.ringText.classList.add('is-rep-count');
          }

          formatExerciseDetails(state) {
              const { exerciseQueue, currentExerciseIndex, currentSet, executionMode } = state;
              const exercise = exerciseQueue[currentExerciseIndex];
              if (!exercise) return '';
              const sets = exercise.defaultSets;
              let details = `${UI_TEXT.TRAINER_SET_LABEL} ${currentSet} ${UI_TEXT.TRAINER_OF_SETS_LABEL} ${sets}`;
              if (executionMode === 'tempo_guided' || executionMode === 'manual_reps') {
                  const reps = exercise.defaultReps;
                  details += ` | ${reps} ${UI_TEXT.TRAINER_REPS_LABEL}`;
              } else if (executionMode === 'static_hold') {
                  const duration = exercise.defaultDuration;
                  details += ` | ${duration}s`;
              }
              if (exercise.defaultWeight) {
                  details += ` @ ${exercise.defaultWeight}kg`;
              }
              return details;
          }

          renderDebugView(state) {
              const { debugMode } = getGlobalState();
              this.elements.debugView.classList.toggle('hidden', !debugMode);
              if (debugMode) {
                  const { executionQueue, currentPhaseIndex } = state;
                  const queueWithHighlight = executionQueue.map((item, index) => {
                      const prefix = index === currentPhaseIndex ? '>> ' : '   ';
                      return `${prefix}${JSON.stringify(item)}`;
                  }).join('\n');
                  this.elements.debugOutput.textContent = queueWithHighlight;
              }
          }
      }
  - file: styles/trainer.css
    content: |
      /* --- TRAINER VIEW STYLES --- */
      #trainer-page {
          height: calc(100vh - 60px);
          display: flex;
          flex-direction: column;
          background-color: var(--bg-color);
          color: var(--text-color);
      }

      .trainer-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          background-color: var(--card-color);
          border-bottom: 1px solid var(--border-color);
          flex-shrink: 0;
          gap: 1rem;
      }

      .trainer-header h2 {
          font-size: 1.25rem;
          color: var(--primary-color);
      }

      .trainer-header-controls {
          display: flex;
          gap: 0.5rem;
          align-items: center;
      }

      #audio-toggle-btn {
          background: none;
          border: none;
          color: var(--text-color-muted);
          cursor: pointer;
          padding: 0.5rem;
      }

      #audio-toggle-btn.active {
          color: var(--primary-color);
      }

      .trainer-body {
          flex-grow: 1;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          align-items: center;
          padding: 1rem;
          text-align: center;
          position: relative;
          overflow-y: auto;
      }

      .exercise-info-container {
          margin-top: 1rem;
          margin-bottom: 1rem;
      }

      #current-exercise-name {
          font-size: 2rem;
          font-weight: bold;
      }

      #current-exercise-details {
          font-size: 1.25rem;
          color: var(--text-color-muted);
          margin-bottom: 0.5rem;
      }

      #current-rep-display {
        font-size: 1rem;
        color: var(--secondary-color);
        font-weight: bold;
        min-height: 1.2em;
      }

      #current-rep-display.hidden-rep {
        visibility: hidden;
      }

      #upcoming-exercise-display {
        font-size: 0.9rem;
        color: var(--text-color-muted);
        margin-top: 0.75rem;
        font-style: italic;
      }

      #upcoming-exercise-display strong {
        color: var(--text-color);
        font-style: normal;
      }

      #trainer-display-modes {
          display: flex;
          justify-content: center;
          align-items: center;
          flex-grow: 1;
          min-height: 280px;
      }

      .timer-ring-container {
          width: 280px;
          height: 280px;
          position: relative;
          display: flex;
          justify-content: center;
          align-items: center;
          margin: 1rem 0;
      }

      .timer-ring-display {
          font-size: 3rem;
          font-weight: bold;
          fill: var(--text-color);
          text-anchor: middle;
      }

      .timer-ring-display.is-timer,
      .timer-ring-display.is-rep-count {
          font-family: 'Courier New', Courier, monospace;
      }

      .timer-ring-display.is-phase {
          font-size: 2.5rem;
          text-transform: uppercase;
      }


      .timer-ring-bg {
          fill: none;
          stroke: var(--card-color);
          stroke-width: 12;
      }

      .timer-ring-progress {
          fill: none;
          stroke: var(--primary-color);
          stroke-width: 12;
          stroke-linecap: round;
          transform: rotate(-90deg);
          transform-origin: 50% 50%;
          transition: stroke-dashoffset 0.1s linear;
      }

      .timer-ring-progress.phase-up { stroke: var(--success-color); }
      .timer-ring-progress.phase-hold { stroke: var(--warning-color); }
      .timer-ring-progress.phase-down { stroke: var(--danger-color); }

      @keyframes flash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .flashing {
        animation: flash 1.4s infinite;
        fill: var(--secondary-color);
      }

      .trainer-controls {
          display: flex;
          gap: 1rem;
          justify-content: center;
          align-items: center;
          margin-top: 1rem;
          height: 80px;
          width: 100%;
          padding-bottom: 1rem;
      }

      .btn-large {
          padding: 1rem 2rem;
          font-size: 1.25rem;
      }

      .debug-view {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        max-height: 40%;
        background-color: rgba(0,0,0,0.8);
        overflow-y: auto;
        border-top: 1px solid var(--border-color);
        z-index: 100;
      }
      .debug-view pre {
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.75rem;
        color: var(--success-color);
        text-align: left;
        padding: 0.5rem;
        white-space: pre-wrap;
      }
