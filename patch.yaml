commit_message: "fix(interactions): Hoist handler functions to prevent ReferenceError"
rationale: |
  This commit fixes a `ReferenceError` in `src/ui/interactions.js`. The error occurred because event handler functions like `handleLoadConfig` were referenced in `initializeEventListeners` before they were defined in the code.

  The fix involves reordering the file to define all handler functions *before* they are assigned to event listeners. This ensures they are available in the scope when needed.

  Additionally, the architecture documentation has been updated to include a note on this coding convention to prevent similar issues in the future.
