commit_message: "fix(UX): Corregge errore modale, layout riepilogo e finalizza migliorie"
rationale: |
  Questo commit è un intervento correttivo e di completamento che risolve due bug critici e finalizza i miglioramenti dell'esperienza utente discussi.

  1.  **Correzione Errore Fatale su Modifica Log**: È stato risolto un `TypeError` che impediva la modifica degli esercizi registrati. L'errore era causato dalla mancanza della struttura HTML per il modale di modifica (`logged-exercise-editor-modal`) nel file `modals.html`. L'HTML è stato aggiunto, rendendo la funzionalità pienamente operativa.

  2.  **Correzione Layout Riepilogo Mobile**: È stato risolto un problema di layout nel widget del riepilogo settimanale (`.planner-summary-stats`) che, su alcune risoluzioni mobili, nascondeva l'ultimo elemento. Lo stile CSS è stato aggiornato per garantire una distribuzione uniforme degli elementi su tutte le dimensioni dello schermo.

  3.  **Finalizzazione Miglioramenti UX**: Questo commit include e rende definitivi i miglioramenti precedentemente approvati: l'introduzione di un modale di conferma prima di terminare un allenamento e il raffinamento della guida vocale del trainer per renderla più chiara e funzionale.
