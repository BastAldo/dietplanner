commit_message: "refactor(ui): Replace manual MD parser with Marked.js and DOMPurify"
rationale: |
  This refactoring addresses the issue where complex Markdown, such as tables, was not rendering correctly in the recipe modal. The previous manual parser was too basic for this task.

  1.  **Dependency Addition**: The `index.html` file has been updated to include `Marked.js` and `DOMPurify` from a reliable CDN. Marked.js is a robust, full-featured Markdown parser, while DOMPurify is a critical security addition to sanitize the resulting HTML and prevent XSS vulnerabilities.

  2.  **Logic Replacement**: The naive, manually-written `parseMarkdownToHTML` function in `src/ui/renderer.js` has been completely removed. It has been replaced by a call to `DOMPurify.sanitize(marked.parse(markdown))`. This new implementation correctly handles all standard Markdown syntax, including tables, lists, and headers, and ensures the output is safe before injection into the DOM.

  3.  **Documentation Update**: The `docs/02_ARCHITECTURE.md` file has been updated to officially document the inclusion of Marked.js and DOMPurify as third-party dependencies, maintaining the project's source of truth.
