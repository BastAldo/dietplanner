commit_message: "fix(core, ui): Implement date-based keys and multiple UI fixes"
rationale: |
  This is a comprehensive commit that resolves several critical bugs and implements UI improvements based on user feedback.

  1.  **Date-Based Keys**: The core data persistence bug has been fixed. The application now uses date-specific ISO strings (e.g., '2025-09-22-Pranzo') as keys for storing meals in `weeklyPlan`. This prevents meals from incorrectly appearing across different weeks. This change impacts `renderer.js` and `validation.js`.

  2.  **Modal 'X' Button Fix**: A structural HTML issue causing the close button to be misplaced has been resolved. The button has been moved inside the modal header in `index.html` for correct CSS positioning.

  3.  **Calorie Color Fix**: A typo (`class.` instead of `class=`) in `renderer.js` has been corrected, restoring the proper CSS styling for the daily calorie count.

  4.  **Click-Outside-to-Close**: A new feature has been added to `interactions.js`. Users can now close any open modal by clicking on the semi-transparent overlay, improving usability.
