commit_message: "feat(ui): Aggiunge UI per il tab Esercizi nella Libreria (Fase 2b)"
rationale: |
  Implemento la Fase 2b per aggiungere il tab "Esercizi" alla Libreria.

  1.  **`templates/library.html`**:
      * Aggiunto il pulsante "Esercizi" (`#library-tab-exercises`) nel `.view-switcher`.
      * Aggiunto il pannello corrispondente (`#library-content-exercises`) con un'intestazione, un pulsante "Nuovo" (per ora non funzionante) e la lista (`#exercise-list`).

  2.  **`src/ui/pageRenderers.js` (`renderLibraryPage`):**
      * Aggiunta la logica per gestire `activeLibraryTab === 'exercises'`.
      * Aggiornato il placeholder della barra di ricerca per includere "esercizi".
      * Implementato il rendering di `state.masterWorkoutList` nel pannello `#exercise-list`, formattando i dettagli di ogni esercizio (sets, reps, durata, modalità) in una stringa di riepilogo.
      * I filtri per pacchetto (`libraryActiveFilter`) ora si applicano anche agli esercizi.

  3.  **`src/ui/interactions/libraryInteractions.js` (`handleLibraryClick`):**
      * Aggiunto il blocco `if (state.ui.activeLibraryTab === 'exercises')`.
      * Collegato il pulsante di eliminazione (`.btn-delete`) alla funzione `deleteExercise` (creata nella Fase 2a), protetta da un `showConfirmModal`.
      * *Nota: I pulsanti "Nuovo" e "Modifica" non sono ancora stati collegati e verranno implementati nella Fase 2c.*

  4.  **`src/config/uiText.js`**:
      * Aggiunti i testi necessari per il modale di conferma eliminazione esercizio: `EXERCISE_DELETE_CONFIRM_TITLE`, `EXERCISE_DELETE_CONFIRM_MSG`, `EXERCISE_DELETE_SUCCESS`.
patches:
