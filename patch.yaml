commit_message: "fix(core): Resolve startup error by aligning with contentHubUrl refactor"
rationale: |
  This commit fixes a critical TypeError that was preventing the application from initializing correctly. The error was a direct result of an inconsistency introduced during the refactoring from `configUrl` to `contentHubUrl`.

  **Problem Analysis:**
  - The `populateInitialText` function in `src/ui/renderer.js` was still attempting to find an element with the old ID `load-config-btn`.
  - However, as part of the architectural shift, this button's ID was correctly changed to `load-content-hub-btn` in `templates/profile.html`.
  - This mismatch caused `document.getElementById('load-config-btn')` to return `null`, leading to a fatal error when trying to set its `textContent`.

  **Solution Implemented:**
  1.  **Corrected ID in Renderer:** The JavaScript in `src/ui/renderer.js` has been updated to reference the correct button ID, `load-content-hub-btn`.
  2.  **Updated UI Text:** The corresponding text label in `src/config/uiText.js` has been changed from "Carica" to "Carica Hub" to be more descriptive of the button's new function.
  3.  **Cleaned HTML:** The hardcoded text was removed from the button in `templates/profile.html`, ensuring the UI text is consistently populated from the central `uiText.js` configuration, as per the project's architecture.

  This fix resolves the startup error and eliminates the inconsistency between the HTML templates and the JavaScript that controls them.
