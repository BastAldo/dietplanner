commit_message: "feat(Trainer): Ridisegna l'header e introduce la funzione per scartare l'allenamento"
rationale: |
  Questa patch implementa un significativo miglioramento dell'esperienza utente nella schermata del trainer, basandosi su un feedback specifico per ottimizzare l'interfaccia mobile e aggiungere una funzionalità richiesta.

  **1. Riprogettazione dell'Header del Trainer:**
  * **Problema:** L'header precedente era affollato su schermi piccoli, causando problemi di layout con il titolo. Il pulsante "Indietro" era ridondante rispetto alla navigazione nativa dei dispositivi.
  * **Soluzione:**
      * Il pulsante "Indietro" è stato rimosso da `templates/trainer.html`, semplificando l'interfaccia.
      * Il pulsante "Termina" è stato trasformato in un pulsante icon-only, utilizzando una nuova icona `STOP` aggiunta a `src/ui/icons.js`.
      * Gli stili in `styles/trainer.css` sono stati aggiornati per garantire che il titolo (`h2`) si espanda correttamente (`flex-grow: 1`) e rimanga centrato, risolvendo il problema di layout.

  **2. Implementazione della Funzionalità "Scarta Allenamento":**
  * **Problema:** Non esisteva un modo per terminare un allenamento senza salvarlo. L'unica opzione era "Salva e Termina".
  * **Soluzione:** È stato introdotto un nuovo flusso di interazione:
      * È stata creata una nuova funzione `discardWorkout` in `src/core/trainer.js`. Questa funzione resetta lo stato del trainer e riporta l'utente al planner senza salvare alcun dato.
      * L'interazione nel `TrainerComponent.js` è stata modificata. Ora, cliccando sull'icona `STOP`, viene presentato un modale di conferma (`showConfirmModal`) che offre due scelte: "Salva e Termina" (che esegue la logica esistente) e "Scarta".
      * Per una maggiore sicurezza, la scelta "Scarta" apre un secondo modale di conferma per avvisare l'utente che l'azione è irreversibile, prima di chiamare `discardWorkout`.
      * Per supportare questo flusso, sono stati aggiunti nuovi testi a `src/config/uiText.js`.

  **3. Miglioramento Architetturale del `confirmModal`:**
  * Per implementare pulitamente il flusso di cui sopra, il componente `showConfirmModal` in `src/ui/modals/confirmModal.js` è stato refattorizzato. Ora accetta un singolo oggetto di configurazione che permette di personalizzare i testi dei pulsanti e di passare un callback `onCancel`, rendendolo un componente molto più flessibile e riutilizzabile in tutta l'applicazione. Tutti i file che utilizzavano la vecchia firma sono stati aggiornati di conseguenza.
