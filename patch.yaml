      export const INTRO_FLOW = [
        { "type": "speech", "text_key": "VOICE_GUIDE_NOW_STARTING", "text_value": "name", "await": true }
      ];

      export const TEMPO_GUIDED_FLOW = [
        { "type": "speech", "text_key": "VOICE_GUIDE_SET_START", "await": true },
        {
          "type": "loop",
          "target": "defaultReps",
          "actions": [
            { "type": "speech", "text_key": "VOICE_GUIDE_PHASE_UP" },
            { "type": "movement", "phase": "pre-up", "duration_ms": 700 },
            { "type": "movement", "phase": "up", "duration_from": "defaultTempo.up" },
            { "type": "audio", "cue": "tick" },
            {
              "type": "conditional",
              "condition": "defaultTempo.hold > 0",
              "actions": [
                { "type": "speech", "text_key": "VOICE_GUIDE_PHASE_HOLD" },
                { "type": "movement", "phase": "pre-hold", "duration_ms": 700 },
                { "type": "movement", "phase": "hold", "duration_from": "defaultTempo.hold" },
                { "type": "audio", "cue": "tick" }
              ]
            },
            { "type": "speech", "text_key": "VOICE_GUIDE_PHASE_DOWN" },
            { "type": "movement", "phase": "pre-down", "duration_ms": 700 },
            { "type": "movement", "phase": "down", "duration_from": "defaultTempo.down" },
            { "type": "audio", "cue": "tick" }
          ]
        },
        { "type": "set_completed" }
      ];

      export const REST_FLOW = [
          { "type": "speech", "text_key": "VOICE_GUIDE_REST_START", "await": true },
          { "type": "rest", "duration_from": "defaultRest" }
      ];

      export const NEXT_EXERCISE_ANNOUNCEMENT_FLOW = [
        { "type": "speech", "text_key": "VOICE_GUIDE_NEXT_EXERCISE", "text_value": "name", "await": true }
      ];

      export const FINAL_FLOW = [
        { "type": "speech", "text_key": "VOICE_GUIDE_WORKOUT_COMPLETED", "await": true }
      ];
  - file: src/core/trainer/queueBuilder.js
    content: |
      import { getState as getGlobalState } from '../state.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { TEMPO_GUIDED_FLOW, INTRO_FLOW, FINAL_FLOW, REST_FLOW, NEXT_EXERCISE_ANNOUNCEMENT_FLOW } from '../../config/trainerFlows.js';

      function getNestedProperty(obj, path) {
        return path.split('.').reduce((acc, part) => acc && acc[part], obj);
      }

      function interpretTemplate(template, exercise, context) {
        // Use a deep copy of the template to prevent mutation of the original object
        const deepCopiedTemplate = JSON.parse(JSON.stringify(template));
        const queue = [];

        for (const command of deepCopiedTemplate) {
          // The context for this command instance
          const instanceContext = { ...context, exercise };

          if (command.type === 'loop') {
            const loopCount = getNestedProperty(exercise, command.target) || 0;
            for (let i = 0; i < loopCount; i++) {
              const loopContext = { ...context, rep: i + 1 };
              // Recursively call with the actions part of the command
              queue.push(...interpretTemplate(command.actions, exercise, loopContext));
            }
          } else if (command.type === 'conditional') {
            const [prop, value] = command.condition.split(' > ');
            const propValue = getNestedProperty(exercise, prop);
            if (propValue > parseInt(value, 10)) {
              queue.push(...interpretTemplate(command.actions, exercise, context));
            }
          } else {
            // Resolve text keys now, during the build phase
            if (command.text_key) {
              command.text = UI_TEXT[command.text_key] || '';
            }
            if (command.text_value) {
                // Use the instance context to get the correct exercise name
                command.text = `${command.text} ${getNestedProperty(instanceContext.exercise, command.text_value)}`;
            }
            if (command.duration_from) {
              command.duration_ms = (getNestedProperty(exercise, command.duration_from) || 0) * 1000;
            }
            // Add the context to the final command object
            command.context = instanceContext;
            queue.push(command);
          }
        }
        return queue;
      }

      export function buildFullWorkoutQueue(exercisePlan) {
        const fullQueue = [];

        // Add the initial announcement
        if (exercisePlan.length > 0) {
            fullQueue.push(...interpretTemplate(INTRO_FLOW, exercisePlan[0], {}));
        }

        exercisePlan.forEach((exercise, exerciseIndex) => {
          const execution_mode = exercise.execution_mode || 'tempo_guided';

          for (let set = 1; set <= exercise.defaultSets; set++) {
            const context = {
              exercise,
              set,
              reps: exercise.defaultReps,
              weight: exercise.defaultWeight
            };

            if (execution_mode === 'tempo_guided') {
                fullQueue.push(...interpretTemplate(TEMPO_GUIDED_FLOW, exercise, context));
            } else if (execution_mode === 'static_hold') {
                fullQueue.push({ type: 'static_hold', duration_ms: exercise.defaultDuration * 1000, context });
                fullQueue.push({ type: 'set_completed', context });
            } else if (execution_mode === 'manual_reps') {
                fullQueue.push({ type: 'manual_rep', context });
                fullQueue.push({ type: 'set_completed', context });
            }

            // Add rest period
            const isLastSetOfExercise = set === exercise.defaultSets;
            const isLastExercise = exerciseIndex === exercisePlan.length - 1;

            if (!isLastSetOfExercise || !isLastExercise) {
                if (exercise.defaultRest > 0) {
                    fullQueue.push(...interpretTemplate(REST_FLOW, exercise, context));
                }
            }

            // Announce next exercise on the last rest before a new one starts
            if (isLastSetOfExercise && !isLastExercise) {
                const nextExercise = exercisePlan[exerciseIndex + 1];
                fullQueue.push(...interpretTemplate(NEXT_EXERCISE_ANNOUNCEMENT_FLOW, nextExercise, {}));
            }
          }
        });

        // Add the final announcement
        fullQueue.push(...interpretTemplate(FINAL_FLOW, exercisePlan[exercisePlan.length -1] || {}, {}));

        const { debugMode } = getGlobalState();
        if (debugMode) {
          console.groupCollapsed(`[Trainer-Queue] Full Workout Execution Queue Built`);
          console.table(fullQueue.map(item => ({...item, text: item.text, context: `Ex: ${item.context?.exercise?.name || 'N/A'} | Set: ${item.context?.set || '-'} | Rep: ${item.context?.rep || '-'}`})));
          console.groupEnd();
        }

        return fullQueue;
      }
  - file: src/core/trainer.js
    content: |
      import { setView, setLastWorkoutSummary, addWorkoutToHistory, getState as getGlobalState } from './state.js';
      import { log } from '../utils/logger.js';
      import { getWorkoutState as getState, resetState, updateState } from './trainer/state.js';
      import { runTimerAnimation, stopAllAnimations } from './trainer/animation.js';
      import { buildFullWorkoutQueue } from './trainer/queueBuilder.js';
      import { calculateWorkoutCalories } from './calculations.js';
      import { speak, playStartCue, playTick } from '../utils/audioFeedback.js';
      import { UI_TEXT } from '../config/uiText.js';

      export { getState as getWorkoutState };

      // This is the "Director d'Orchestra"
      async function runWorkoutLoop() {
        const state = getState();
        if (state.status !== 'running') return;

        for (let i = state.currentQueueIndex; i < state.fullExecutionQueue.length; i++) {
            // The pause is now handled inside runTimerAnimation, so this top-level check is no longer needed
            // a while loop here would also block the main thread.
            if (getState().status !== 'running') {
                log('Trainer', 'Workout loop terminated.');
                return;
            }

            updateState({ currentQueueIndex: i });
            const phase = state.fullExecutionQueue[i];

            log('Trainer-Loop', `Executing phase ${i}:`, phase.type);

            switch (phase.type) {
                case 'speech':
                    if (state.isAudioEnabled && phase.text) {
                        if(phase.await) await speak(phase.text);
                        else speak(phase.text);
                    }
                    break;
                case 'audio':
                     if (state.isAudioEnabled) {
                        if (phase.cue === 'tick') playTick();
                     }
                    break;
                case 'movement':
                case 'rest':
                case 'static_hold':
                    await runTimerAnimation(phase.duration_ms);
                    break;
                case 'set_completed':
                    collectSetData();
                    break;
                case 'manual_rep':
                    // This phase is handled by user interaction via incrementManualRep
                    // We wait here until the rep count is met
                    await new Promise(resolve => {
                        const checkReps = () => {
                            const currentState = getState();
                            const currentPhase = currentState.fullExecutionQueue[currentState.currentQueueIndex];
                            if (!currentPhase || currentPhase.repsCompleted >= currentPhase.context.reps) {
                                document.removeEventListener('workoutStateChange', checkReps);
                                resolve();
                            }
                        };
                        document.addEventListener('workoutStateChange', checkReps);
                    });
                    break;
            }
        }
        // If the loop completes naturally, end the workout
        if (getState().status === 'running') {
            endWorkout();
        }
      }

      export function resetWorkoutState() {
        log('Trainer', 'Resetting workout state.');
        stopAllAnimations();
        resetState();
      }

      export function initializeWorkout(plannedExercises, isoDate) {
        if (!plannedExercises || plannedExercises.length === 0) {
            return;
        }
        resetWorkoutState();

        const fullExecutionQueue = buildFullWorkoutQueue(plannedExercises);

        const initialState = {
            workoutDate: isoDate,
            exerciseQueue: JSON.parse(JSON.stringify(plannedExercises)),
            fullExecutionQueue: fullExecutionQueue,
            currentQueueIndex: 0,
            status: 'idle',
            startTime: 0,
            setsData: []
        };
        updateState(initialState);
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function collectSetData() {
          const state = getState();
          const currentPhase = state.fullExecutionQueue[state.currentQueueIndex];
          if (!currentPhase || !currentPhase.context) return;

          const { exercise, set, reps, weight } = currentPhase.context;

          const setData = {
              exerciseId: exercise.instanceId,
              set: set,
              reps: reps,
              duration: state.lastTimerDuration || 0, // Duration from animation engine
              rest: exercise.defaultRest,
              weight: weight || 0
          };

          const newSetsData = [...state.setsData, setData];
          updateState({ setsData: newSetsData });
          log('Trainer', 'Set data collected', { setData });
      }

      export async function startWorkout() {
        const state = getState();
        log('Interactions', 'Start workout button clicked', { date: state.workoutDate });
        if (state.status !== 'idle') return;

        if (state.isAudioEnabled) {
            playStartCue();
        }

        // Small delay to allow the sound cue to play before any potential UI lag
        await new Promise(resolve => setTimeout(resolve, 50));
        
        if (getState().status !== 'idle') {
            log('Trainer', 'Workout start aborted, status changed during start cue.');
            return;
        }

        updateState({ status: 'running', startTime: Date.now() });
        runWorkoutLoop(); // Start the master loop
        log('Trainer', 'Workout started.');
      }

      export function pauseWorkout() {
        const state = getState();
        if (state.status === 'running') {
            updateState({ status: 'paused' });
            log('Trainer', 'Workout paused.');
        }
      }

      export function resumeWorkout() {
        const state = getState();
        if (state.status === 'paused') {
            updateState({ status: 'running' });
            log('Trainer', 'Workout resumed.');
        }
      }

      export function incrementManualRep() {
          const state = getState();
          if (state.status !== 'running') return;

          const currentPhase = state.fullExecutionQueue[state.currentQueueIndex];
          if (currentPhase && currentPhase.type === 'manual_rep') {
              const newRepCount = (currentPhase.repsCompleted || 0) + 1;
              currentPhase.repsCompleted = newRepCount;
              // Dispatch change to notify the waiting promise in the loop
              document.dispatchEvent(new CustomEvent('workoutStateChange'));
          }
      }

      function createWorkoutSummary(finalState) {
          const totalTime = Date.now() - finalState.startTime;
          let totalTonnage = 0;

          const exercisesWithDetails = finalState.exerciseQueue.map(exercise => {
              const setsForThisExercise = finalState.setsData.filter(d => d.exerciseId === exercise.instanceId);
              const setsCompleted = setsForThisExercise.length;
              const totalExerciseTime = setsForThisExercise.reduce((acc, set) => acc + (set.duration || 0), 0);
              const exerciseTonnage = setsForThisExercise.reduce((acc, set) => acc + ((set.reps || 0) * (set.weight || 0)), 0);
              totalTonnage += exerciseTonnage;

              return {
                  ...exercise,
                  setsCompleted: setsCompleted,
                  setsData: setsForThisExercise,
                  totalTime: totalExerciseTime,
                  tonnage: exerciseTonnage
              };
          });

          const totalSets = exercisesWithDetails.reduce((acc, ex) => acc + ex.setsCompleted, 0);
          const totalExerciseTime = exercisesWithDetails.reduce((acc, ex) => acc + ex.totalTime, 0);
          const totalRestTime = finalState.setsData.reduce((acc, set) => acc + (set.rest || 0) * 1000, 0);

          const summary = {
              date: finalState.workoutDate,
              totalTime,
              totalSets,
              totalExerciseTime,
              totalRestTime,
              totalTonnage,
              exercises: exercisesWithDetails,
              startTime: finalState.startTime,
              totalCaloriesBurned: 0
          };

          const globalState = getGlobalState();
          const latestWeight = globalState.biometricData.length > 0 ? globalState.biometricData[0].weight : null;
          if (latestWeight) {
            summary.totalCaloriesBurned = calculateWorkoutCalories(summary, latestWeight);
          }

          return summary;
      }

      export function endWorkout() {
        const finalState = getState();
        if (finalState.status === 'finished') {
            log('Trainer', 'Workout already finished, not saving again.');
            return;
        }
        stopAllAnimations();
        updateState({ status: 'finished' });

        if (finalState.startTime === 0) {
            log('Trainer', 'Workout ended prematurely, not saving summary.');
            setView('planner');
            return;
        }
        const summary = createWorkoutSummary(finalState);
        setLastWorkoutSummary(summary);
        addWorkoutToHistory(summary);

        setView('debriefing');
      }
  - file: docs/02_ARCHITECTURE.md
    content: |
      # Architettura: HealtyPro (ex NutriPlan)

      ## 1. Principi Guida
      * **PWA-First:** L'applicazione è progettata per essere installabile e funzionare offline.
      * **Minimalism & Simplicity (KISS):** L'interfaccia utente è essenziale e intuitiva, basata su Vanilla JS.
      * **Data-Driven & Convention over Configuration:** La logica di business è definita in file di configurazione remoti. L'applicazione si basa su convenzioni di struttura: dato l'URL di `pasti.json`, deduce automaticamente i percorsi per `ingredienti.json` (stessa directory), `esercizi.json` (stessa directory) e per le ricette (sottodirectory `ricette/`).
      * **Maintainability (SRP):** Ogni modulo ha una singola, chiara responsabilità.

      ## 2. Architettura SPA Multi-Vista
      L'applicazione è una **Single Page Application (SPA)**. Un singolo `index.html` contiene i contenitori per ogni vista, e la logica in `renderer.js` gestisce quale vista mostrare in base allo stato.

      ## 3. Architettura PWA
      * **`manifest.json`**: Fornisce i metadati per l'installazione.
      * **`sw.js` (Service Worker)**: Mette in cache l' "app shell" per il funzionamento offline.

      ## 4. Logica di Business
      ### 4.1. Workout Builder Composizionale e Dichiarativo
      A differenza di un approccio a piani fissi, HealtyPro adotta un modello composizionale. L'utente costruisce la propria sessione di allenamento giorno per giorno aggiungendo esercizi individuali da una libreria.

      L'architettura del trainer si basa su un principio **dichiarativo**: l'intero flusso di un allenamento, inclusi esercizi, serie, ripetizioni, annunci vocali e periodi di riposo, viene pre-compilato in una singola coda di comandi immutabile (`fullExecutionQueue`) prima dell'inizio della sessione. Il modulo `queueBuilder` agisce come un assemblatore, utilizzando dei "flussi" template (`trainerFlows.js`) per ogni parte dell'allenamento. Questo garantisce che l'esecutore (`runWorkoutLoop`) sia un semplice interprete, aumentando la robustezza e la prevedibilità del sistema.

      ### 4.2. Modalità di Esecuzione e Ciclo di Ripetizione (Vista Trainer)
      La Vista Trainer opera in diverse modalità a seconda delle proprietà dell'esercizio caricato. Questo garantisce un'esperienza utente flessibile e adatta a diversi tipi di allenamento. La modalità viene scelta in base a un campo `execution_mode` nell'oggetto dell'esercizio.

      #### Modalità 1: `tempo_guided` (Default)
      Per garantire un'esperienza utente guidata e prevenire movimenti affrettati, il modulo Trainer implementa un ciclo di esecuzione dettagliato per ogni singola ripetizione di un esercizio basato sul `tempo`. Questo ciclo viene "compilato" nella coda di esecuzione usando un template specifico (`TEMPO_GUIDED_FLOW`). Ogni ripetizione è suddivisa in fasi, come la fase concentrica (`up`), isometrica (`hold`) ed eccentrica (`down`), intervallate da annunci vocali e piccoli intervalli per la preparazione.

      #### Modalità 2: `static_hold`
      Utilizzata per esercizi isometrici come il Plank. L'interfaccia mostra un unico timer centrale che esegue un countdown per la durata totale della serie. Se l'esercizio è configurato per essere eseguito "a sfinimento", il timer diventa un cronometro che conta in avanti.

      #### Modalità 3: `manual_reps`
      Utilizzata per serie "a sfinimento" o con un range di ripetizioni (min/max). L'interfaccia non mostra un timer, ma un contatore e un pulsante principale per permettere all'utente di registrare manualmente ogni ripetizione completata.

      ### 4.3. Calcolo del BMR (`src/core/calculations.js`)
      Logiche complesse come il calcolo del Metabolismo Basale (BMR) sono isolate in questo modulo dedicato.

      ### 4.4. Calcolo delle Calorie (`src/core/calorieCalculator.js`)
      Questo modulo ha la sola responsabilità di calcolare le calorie dei pasti, ricevendo la lista dei pasti e degli ingredienti e arricchendo ogni pasto con `calories_min` e `calories_max`.

      ## 5. Gestione dei Dati
      ### 5.1. Caricamento Dati (`src/api/configService.js`)
      Il servizio orchestra un caricamento multi-fase per `pasti.json`, `ingredienti.json` e `esercizi.json`.

      ### 5.2. Strutture Dati Chiave
      * **Configurazione Remota**:
          * **`pasti.json`**: Array di oggetti `meals`.
          * **`ingredienti.json`**: Array di `ingredienti`.
          * **`esercizi.json`**: Un array di `esercizi`. Ogni esercizio è un oggetto che definisce le sue proprietà di base (ID, nome, descrizione) e i valori di default per serie, ripetizioni, durata, riposo, `tempo` (un oggetto con `up`, `hold`, `down`) e il nuovo campo opzionale `execution_mode`.

      * **Dati Utente Locali (`localStorage`)**:
          * **`userProfile`**: Dati anagrafici dell'utente.
          * **`weeklyPlan`**: Oggetto che mappa gli slot giornalieri (`YYYY-MM-DD-MealType`) ai pasti pianificati.
          * **`weeklyWorkouts`**: Oggetto che mappa uno slot giornaliero (`YYYY-MM-DD-Allenamento`) a un **array di oggetti esercizio**. Ogni oggetto in questo array è una copia dell'esercizio dalla libreria, arricchito con un `instanceId` univoco per permetterne la gestione individuale.
          * **`biometricData`**: Array con lo storico delle misurazioni biometriche.

      ## 6. Dipendenze di Terze Parti
      * **Marked.js & DOMPurify**: Caricate via CDN per il rendering sicuro delle ricette.
      * **Chart.js**: Caricata via CDN per la visualizzazione dei grafici.
      * **SortableJS**: Caricata via CDN per la gestione del drag-and-drop.

      ## 7. Strategia di Sviluppo e Debug
      Per garantire la manutenibilità e facilitare il troubleshooting, l'applicazione integra un sistema di logging sistematico.

      ### 7.1. Modalità Debug (`debugMode`)
      * Lo stato globale in `src/core/state.js` contiene un flag `debugMode`, impostato di default su `false`.
      * Questo flag può essere attivato o disattivato in qualsiasi momento tramite la console del browser, eseguendo la funzione globale `toggleDebugMode()`. Questo permette di attivare i log solo quando necessario, senza impattare le performance in produzione.

      ### 7.2. Logger Centralizzato (`src/utils/logger.js`)
      * Tutta la logica di logging è centralizzata in un unico modulo. La sua funzione `log()` è l'unico punto di accesso per scrivere messaggi in console.
      * Questa funzione controlla internamente lo stato di `debugMode` e scrive in console solo se è attivo.

      ### 7.3. Convenzioni di Logging
      Per garantire coerenza e leggibilità, tutti i messaggi di log seguono una convenzione standard:
      ```javascript
      log('NomeComponente', 'Azione che sta avvenendo', { datiRilevanti });
      ```
      * **`NomeComponente`**: Indica il modulo di origine (es. 'State', 'Modals', 'Trainer', 'API_SERVICE').
      * **`Azione`**: Descrive l'operazione in corso (es. 'Setting new view', 'Opening modal').
      * **`datiRilevanti`**: Un oggetto opzionale che mostra il contesto e i dati relativi all'azione.

      ### 7.4. Gestione Errori Robusta nel Caricamento Dati
      Il `configService` adotta una strategia di parsing in due fasi per migliorare il debug degli errori di caricamento dei file di configurazione (`pasti.json`, `ingredienti.json`, etc.).
      1.  La risposta della `fetch` viene prima letta come testo (`response.text()`).
      2.  Il testo viene poi esplicitamente parsato all'interno di un blocco `try...catch`.

      Questo approccio permette di:
      * **Notificare l'utente** con un messaggio di errore generico e pulito (es. "Errore nel formato di un file di configurazione") senza esporre dettagli tecnici.
      * **Fornire allo sviluppatore**, se `debugMode` è attiva, un log dettagliato in console che include l'URL del file che ha causato l'errore e un estratto del contenuto non valido, semplificando enormemente il processo di troubleshooting.
