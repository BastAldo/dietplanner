commit_message: "feat(trainer): Implementa l'UI statica della Vista Trainer e il punto di accesso"
rationale: |
  Questo commit realizza la seconda fase dello sviluppo della Vista Trainer, come da piano approvato. Introduce l'interfaccia utente statica, gli stili di base e la logica necessaria per rendere la vista accessibile all'utente.

  Le modifiche principali sono:

  1.  **Struttura HTML (`templates/trainer.html`):**
      * È stata implementata la struttura HTML completa per la Vista Trainer, basandosi sui mockup testuali.
      * Include contenitori separati per le tre modalità di esecuzione (`tempo_guided`, `static_hold`, `manual_reps`), che verranno mostrati/nascosti dinamicamente in futuro.
      * Sono stati aggiunti tutti gli elementi UI necessari: header, area per il timer/anello, contatori, liste di esercizi e pulsanti di controllo.

  2.  **Stili CSS (`styles/trainer.css`):**
      * Sono state scritte le regole CSS essenziali per definire il layout della Vista Trainer, utilizzando le variabili di colore e i principi della `docs/03_STYLE_GUIDE.md`.
      * Questo garantisce che la nuova vista sia visivamente integrata con il resto dell'applicazione.

  3.  **Punto di Accesso (`src/ui/modals.js`):**
      * Nel modale "Editor del Giorno", è stato aggiunto un pulsante "Avvia Allenamento".
      * Questo pulsante appare dinamicamente solo se ci sono esercizi pianificati per la giornata selezionata, fornendo un punto di ingresso contestuale.
      * È stato aggiunto il gestore di eventi che, al click, cambia la vista dell'applicazione a 'trainer'.

  4.  **Integrazione nel Flusso Applicativo:**
      * Il modulo di stato (`src/core/state.js`) è stato aggiornato per includere `'trainer'` come vista valida.
      * Il renderer principale (`src/ui/renderer.js`) è stato modificato per riconoscere e visualizzare la nuova pagina quando lo stato `currentView` è impostato su `'trainer'`.
      * Il `viewLoader.js` è stato aggiornato per caricare il nuovo `trainer.html`.

  Con questo commit, la Vista Trainer è ora una parte visibile e accessibile dell'applicazione, pronta per l'implementazione della logica dinamica e della macchina a stati.
