commit_message: "fix(ui): Corregge layout e aggiunge 'Pulisci Allenamento'"
rationale: |
  Questo commit è un intervento di rifinitura e miglioramento dell'usabilità basato sul feedback ricevuto dopo l'implementazione delle "Schede Allenamento".

  Affronta quattro questioni principali:

  1.  **Fix Layout Tab Libreria (Osservazione #1):**
      * **Problema:** I pulsanti delle tab (Ingredienti, Pasti, Schede) nella pagina Libreria venivano renderizzati verticalmente.
      * **Soluzione:** È stato aggiunto del CSS a `styles/library.css` per stilizzare il contenitore `.view-switcher`, trasformandolo in un gruppo di pulsanti orizzontali unificati, in linea con la `docs/03_STYLE_GUIDE.md`.

  2.  **Fix Spaginazione Modal Giorno (Osservazione #3):**
      * **Problema:** Nel modale "Editor Giorno", l'aggiunta del pulsante "Aggiungi da Scheda" causava problemi di layout (spaginazione) su schermi piccoli quando non c'erano esercizi.
      * **Soluzione:** La causa era duplice:
          * `src/ui/modals/dayEditorModal.js`: Il pulsante "Aggiungi Esercizio" (generato dinamicamente) non aveva le classi `.btn` e `.btn-secondary`, impedendo agli stili responsive di funzionare. Questo è stato corretto.
          * `styles/modals.css`: È stato aggiunto `flex-wrap: wrap` alla classe `.workout-summary-actions` per consentire ai pulsanti di andare a capo in modo pulito.

  3.  **Nuova Feature: Pulisci Allenamento (Osservazione #4):**
      * **Problema:** Dopo aver aggiunto una scheda per errore, rimuovere tutti gli esercizi uno per uno era frustrante.
      * **Soluzione:**
          * `src/core/state.js`: È stata creata e esportata una nuova funzione `clearWeeklyWorkout(slotId)` per rimuovere tutti gli esercizi da un dato slot.
          * `templates/modals.html` e `styles/modals.css`: È stato aggiunto un pulsante "Pulisci Allenamento" (con stile "danger" secondario) al footer del `workout-editor-modal`.
          * `src/ui/modals/workoutEditorModal.js`: È stata aggiunta la logica per questo pulsante, che utilizza `showConfirmModal` prima di chiamare `clearWeeklyWorkout` e aggiornare l'interfaccia.
          * `src/config/uiText.js`: Sono stati aggiunti i testi di supporto per questa nuova azione.

  4.  **Coerenza Modale Allenamento (CSS):**
      * Il footer del `workout-editor-modal` è stato aggiornato per gestire correttamente l'allineamento dei due pulsanti ("Pulisci" a sinistra, "Salva" a destra) usando `justify-content: space-between`.
