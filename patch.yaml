commit_message: "fix: Corregge calcolo BMR al caricamento e layout del planner"
rationale: |
  In risposta al preciso feedback dell'utente, questa patch corregge due importanti dettagli nell'implementazione precedente, migliorando sia la robustezza logica che l'usabilità dell'interfaccia.

  1.  **Calcolo BMR Robusto**: La logica di calcolo del Metabolismo Basale è stata resa più robusta. In `src/ui/renderer.js`, la funzione `renderBiometricsPage` ora calcola e visualizza il BMR non solo in risposta all'input manuale, ma anche al momento del caricamento della pagina. Questo assicura che il valore sia sempre presente e aggiornato se i dati del profilo e almeno una misurazione del peso esistono, risolvendo l'inconsistenza logica segnalata.

  2.  **Riorganizzazione UI del Planner**: Il layout della pagina "Planner" è stato rifinito per una migliore usabilità. Come richiesto, lo switcher per la vista "Calendario/Registro" è stato spostato dalla barra dei controlli generica e riposizionato direttamente sopra la griglia del calendario in `index.html`. Questa modifica, supportata da aggiustamenti in `style.css`, colloca il controllo in una posizione più contestuale e intuitiva per l'utente.
