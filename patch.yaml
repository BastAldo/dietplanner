commit_message: "feat(library): Implement Meal Composer with full CRUD functionality"
rationale: |
  This commit completes Phase 2 of the content creation roadmap, introducing the "Meal Composer". Users can now create, update, and delete custom meals by assembling ingredients from their personal library.

  Key features and changes include:
  1.  **Meal Editor Modal**: A new, sophisticated modal (`meal-editor-modal`) has been introduced. It allows users to define meal properties (ID, name, type) and dynamically add, remove, and quantify ingredients from their library.
  2.  **Real-Time Calorie Calculation**: The meal editor provides immediate feedback by calculating and displaying the total minimum and maximum calories of the meal as ingredients are added or modified.
  3.  **Meal CRUD in State**: The core state management (`state.js`) now includes `addMeal`, `updateMeal`, and `deleteMeal` functions. The user's `masterMealList` is now persisted to `localStorage`, making it a personal and editable collection.
  4.  **Activated Meals Tab**: The "Meals" tab in the Library view is now fully functional. It displays the user's custom meals, integrates with the search functionality, and provides controls to edit or delete each meal.
  5.  **Decoupling from Remote Config**: The `setPlannerConfig` function has been updated to no longer overwrite the user's custom `masterMealList`, allowing for the safe importation of external meal plans without data loss.
