commit_message: "feat(arch): Centralizza la gestione delle icone in un file dedicato"
rationale: |
  Questa patch implementa una significativa miglioria architetturale, come suggerito dall'utente, centralizzando la definizione di tutte le icone SVG in un unico file dedicato (`src/ui/icons.js`).

  Questo approccio, analogo a quello utilizzato per le costanti di testo, offre numerosi vantaggi:
  1.  **Manutenibilità (SRP)**: Il design delle icone è ora separato dalla struttura HTML e dalla logica JavaScript. Qualsiasi modifica a un'icona viene effettuata in un solo punto.
  2.  **Coerenza Garantita**: Una funzione helper `renderIcon` costruisce ogni SVG, garantendo che tutte le icone condividano attributi comuni (`viewBox`, `fill`, etc.), risolvendo problemi di stile e dimensione.
  3.  **Controllo del Design**: Fornisce un unico punto di controllo per la gestione dello stile visivo di tutte le icone dell'applicazione.
  4.  **Codice Pulito**: Rimuove grandi blocchi di codice SVG da file HTML e JavaScript, migliorandone notevolmente la leggibilità.

  Sono stati refattorizzati tutti i file che utilizzavano icone SVG per adottare il nuovo sistema centralizzato. È stato creato il nuovo file `src/ui/icons.js` e il service worker è stato aggiornato per includerlo nella cache.
