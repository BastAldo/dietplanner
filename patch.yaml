      // NOTA: Questo URL è un placeholder di default.
      export const DEFAULT_CSV_URL = 'https://raw.githubusercontent.com/username/repo/main/pasti.csv';

      export const LOCAL_STORAGE_KEY_PLAN = 'dynamicProtocolPlan';
      export const LOCAL_STORAGE_KEY_URL = 'dynamicProtocolUrl';

      export const DAYS = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
      export const MEAL_TYPES = ['Pranzo', 'Cena'];
  - file: src/api/mealService.js
    content: |
      /**
       * Scarica e processa il file CSV dei pasti da un URL specifico.
       * @param {string} url - L'URL del file CSV.
       * @returns {Promise<Array<Object>>} Una promessa che risolve in un array di oggetti pasto.
       */
      export async function fetchAndParseMeals(url) {
        if (!url) {
          alert("Per favore, inserisci un URL valido.");
          return [];
        }
        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error(`Errore HTTP: ${response.status}`);
          }
          const csvText = await response.text();
          const meals = parseCSV(csvText);
          if (meals.length === 0) {
            alert("Il file CSV è vuoto o non ha un formato valido.");
            return [];
          }
          return meals;
        } catch (error) {
          console.error("Impossibile caricare i dati dei pasti:", error);
          alert(`Errore nel caricamento dei pasti dall'URL fornito.\nControlla che l'URL sia corretto e che il formato del file sia valido.`);
          return [];
        }
      }

      function parseCSV(text) {
        const lines = text.trim().split('\n');
        const headers = lines[0].split('\t').map(h => h.trim());
        
        // Validazione base dell'header
        if(!['id', 'nomePasto', 'tipoPasto'].every(h => headers.includes(h))) {
            console.error("Header del CSV non valido. Richiesti: id, nomePasto, tipoPasto, etc.");
            return [];
        }

        return lines.slice(1).map(line => {
          const values = line.split('\t').map(v => v.trim());
          const mealObject = {};
          headers.forEach((header, index) => {
            mealObject[header] = values[index];
          });
          return mealObject;
        });
      }
  - file: src/core/state.js
    content: |
      import { LOCAL_STORAGE_KEY_PLAN, LOCAL_STORAGE_KEY_URL } from '../utils/constants.js';

      let appState = {
        masterMealList: [],
        weeklyPlan: {},
        csvUrl: '',
      };

      function notifyStateChange() {
        document.dispatchEvent(new CustomEvent('stateChange'));
      }

      export function setMasterMealList(meals) {
        appState.masterMealList = meals;
        notifyStateChange();
      }

      export function updateWeeklyPlan(slotId, mealId) {
        if (mealId) { appState.weeklyPlan[slotId] = mealId; } 
        else { delete appState.weeklyPlan[slotId]; }
        saveStateToLocalStorage();
        notifyStateChange();
      }

      export function resetWeeklyPlan() {
        appState.weeklyPlan = {};
        saveStateToLocalStorage();
        notifyStateChange();
      }

      export function setCsvUrl(url) {
        appState.csvUrl = url;
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, url);
      }

      export function getState() { return { ...appState }; }

      export function saveStateToLocalStorage() {
        localStorage.setItem(LOCAL_STORAGE_KEY_PLAN, JSON.stringify(appState.weeklyPlan));
      }

      export function loadStateFromLocalStorage() {
        const savedPlan = localStorage.getItem(LOCAL_STORAGE_KEY_PLAN);
        const savedUrl = localStorage.getItem(LOCAL_STORAGE_KEY_URL);
        if (savedPlan) { appState.weeklyPlan = JSON.parse(savedPlan); }
        if (savedUrl) { appState.csvUrl = savedUrl; }
      }
  - file: src/ui/interactions.js
    content: |
      import { getState, updateWeeklyPlan, resetWeeklyPlan, setMasterMealList, setCsvUrl } from '../core/state.js';
      import { isSoyMealAllowed } from '../core/validation.js';
      import { fetchAndParseMeals } from '../api/mealService.js';

      let draggedMealId = null;

      export function initializeEventListeners() {
        // Pulsanti Principali
        document.getElementById('reset-btn').addEventListener('click', () => {
          if(confirm('Sei sicuro di voler svuotare l\'intero piano settimanale?')) resetWeeklyPlan();
        });
        document.getElementById('print-btn').addEventListener('click', () => window.print());
        document.getElementById('load-csv-btn').addEventListener('click', handleLoadCsv);
        
        // Modal
        document.getElementById('info-icon').addEventListener('click', toggleModal);
        document.getElementById('modal-close-btn').addEventListener('click', toggleModal);
        document.getElementById('info-modal').addEventListener('click', (e) => {
          if (e.target.id === 'info-modal') toggleModal(); // Chiude se si clicca sull'overlay
        });

        // Drag & Drop
        const mealLibrary = document.getElementById('meal-library');
        const calendarGrid = document.getElementById('calendar-grid');

        mealLibrary.addEventListener('dragstart', handleDragStart);
        mealLibrary.addEventListener('dragend', handleDragEnd);
        calendarGrid.addEventListener('dragover', handleDragOver);
        calendarGrid.addEventListener('dragleave', handleDragLeave);
        calendarGrid.addEventListener('drop', handleDrop);
      }
      
      async function handleLoadCsv() {
        const urlInput = document.getElementById('csv-url-input');
        const url = urlInput.value.trim();
        setCsvUrl(url);
        const meals = await fetchAndParseMeals(url);
        setMasterMealList(meals);
      }

      function toggleModal() {
        document.getElementById('info-modal').classList.toggle('modal-hidden');
      }

      function handleDragStart(e) {
        if (e.target.classList.contains('meal-card')) {
          draggedMealId = e.target.dataset.mealId;
          e.target.classList.add('dragging');
        }
      }

      function handleDragEnd(e) {
        if (e.target.classList.contains('meal-card')) {
          draggedMealId = null;
          e.target.classList.remove('dragging');
        }
      }

      function handleDragOver(e) {
        const slot = e.target.closest('.calendar-slot');
        if (slot) {
          e.preventDefault();
          slot.classList.add('drop-target');
        }
      }

      function handleDragLeave(e) {
        const slot = e.target.closest('.calendar-slot');
        if (slot) slot.classList.remove('drop-target');
      }
      
      function handleDrop(e) {
        e.preventDefault();
        const slot = e.target.closest('.calendar-slot');
        if (!slot || !draggedMealId) return;

        slot.classList.remove('drop-target');
        const { masterMealList, weeklyPlan } = getState();
        const mealToAdd = masterMealList.find(m => m.id === draggedMealId);
        const day = slot.dataset.slotId.split('-')[0];

        if (isSoyMealAllowed(day, mealToAdd, weeklyPlan, masterMealList)) {
          updateWeeklyPlan(slot.dataset.slotId, draggedMealId);
        } else {
          alert('Regola violata: Non è possibile consumare due pasti con soia nello stesso giorno.');
        }
      }
  - file: src/main.js
    content: |
      import { loadStateFromLocalStorage, getState } from './core/state.js';
      import { renderCalendar } from './ui/calendar.js';
      import { renderMealLibrary } from './ui/library.js';
      import { initializeEventListeners } from './ui/interactions.js';
      import { DEFAULT_CSV_URL } from './utils/constants.js';

      const calendarGridElement = document.getElementById('calendar-grid');
      const mealLibraryElement = document.getElementById('meal-library');
      const csvUrlInputElement = document.getElementById('csv-url-input');

      function renderApp() {
        const currentState = getState();
        renderCalendar(calendarGridElement, currentState);
        renderMealLibrary(mealLibraryElement, currentState);
        // Assicura che l'input rifletta l'URL caricato
        if (document.activeElement !== csvUrlInputElement) {
          csvUrlInputElement.value = currentState.csvUrl;
        }
      }

      async function init() {
        document.addEventListener('stateChange', renderApp);

        loadStateFromLocalStorage();
        
        // Popola l'input con l'URL salvato o quello di default
        const initialState = getState();
        csvUrlInputElement.value = initialState.csvUrl || DEFAULT_CSV_URL;

        initializeEventListeners();
        
        renderApp();
      }

      document.addEventListener('DOMContentLoaded', init);
