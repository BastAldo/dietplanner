commit_message: "feat(ui): Sposta grafico calorie settimanali da Grafici a Planner"
rationale: |
  Come discusso, ho implementato la "Proposta UI/UX" per migliorare la pagina "Planner".

  Questa modifica trasforma la pagina Planner in una dashboard più efficace, accorpando le informazioni visive rilevanti.

  **Cambiamenti implementati:**

  1.  **`templates/planner.html`**: La sezione `<section id="planner-summary-widget"...></section>` è stata rimossa. Al suo posto, è stata inserita la struttura HTML per una `.chart-card` (presa da `charts.html`). Ho usato nuovi ID univoci (`planner-week-chart-canvas`, ecc.) e impostato un'altezza fissa più bassa (250px) adatta a una dashboard.
  2.  **`templates/charts.html`**: La `.chart-card` relativa al grafico del planner (`#planner-chart-canvas`) è stata rimossa. La pagina "Grafici" ora si concentra esclusivamente sulle tendenze biometriche a lungo termine.
  3.  **`styles/planner.css`**: Gli stili per il `.planner-summary-widget` (ora eliminato) sono stati rimossi. Sono stati invece aggiunti gli stili necessari per `.chart-card`, `.chart-header`, e `.chart-canvas-container` (copiati da `styles/charts.css`) per garantire che il nuovo grafico venga renderizzato correttamente nella pagina Planner.
  4.  **`src/ui/plannerRenderer.js`**:
      * La chiamata a `renderPlannerSummaryWidget` (ora eliminata) è stata rimossa.
      * È stata aggiunta la variabile `let plannerWeekChart = null;`.
      * È stata creata una nuova funzione `renderPlannerWeekChart` che contiene la logica di rendering del grafico settimanale (precedentemente in `charts.js`).
      * `renderPlannerPage` ora chiama `renderPlannerWeekChart(state, weekStart);`.
  5.  **`src/ui/charts.js`**:
      * La variabile `plannerChart` è stata rimossa.
      * Tutta la logica di rendering per `plannerChart` è stata rimossa da `renderCharts()`.
  6.  **`src/core/state.js`**: La chiave `plannerChartType` è stata rimossa da `state.ui.charts` poiché il selettore "Barre/Linee" è stato rimosso insieme al grafico.
  7.  **`src/ui/interactions/chartsInteractions.js`**: La funzione `handlePlannerChartTypeChange` e il relativo listener di eventi sono stati rimossi.
  8.  **`src/ui/renderer.js` (`populateInitialText`)**: I riferimenti ai testi per il grafico (`planner-chart-title`) e i suoi controlli ("Barre", "Linee") sono stati rimossi dalla pagina `charts`. È stato aggiunto il riferimento per il nuovo titolo del grafico nella pagina `planner` (`planner-week-chart-title`).
