commit_message: "fix(trainer): Add fallback to default execution_mode in queueBuilder"
rationale: |
  This patch provides the definitive fix for the "instant rest" bug in the Trainer module. The root cause was not a race condition in the animation engine, but a logical failure in the queue creation process.

  **Problem Analysis:**
  The `buildExecutionQueueForCurrentSet` function in `src/core/trainer/queueBuilder.js` strictly checked for `execution_mode === 'tempo_guided'`. However, the exercise objects loaded from the configuration file did not contain this field. As a result, the condition failed, and the function returned an empty `executionQueue` array.

  The animation engine would then receive this empty queue, interpret it as an instantly completed set, and call `completeSet()`, causing the workout to immediately enter the 'resting' state.

  **Solution:**
  The `queueBuilder.js` module has been made robust to handle missing data, aligning with the architectural specification that 'tempo_guided' is the default mode.
  - A fallback has been added when reading the `execution_mode` property from the exercise object. If the property is `undefined`, it now defaults to `'tempo_guided'`.

  This ensures that a valid execution queue is always generated for tempo-based exercises, resolving the bug at its source and making the Trainer module function correctly as designed.
patches:
  - file: src/core/trainer/queueBuilder.js
    content: |
      import { getWorkoutState } from './state.js';
      import { getState as getGlobalState } from '../state.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { TEMPO_GUIDED_FLOW } from '../../config/trainerFlows.js';

      function getNestedProperty(obj, path) {
        return path.split('.').reduce((acc, part) => acc && acc[part], obj);
      }

      function interpretTemplate(template, exercise, loopContext) {
        const queue = [];
        for (const command of template) {
          if (command.type === 'loop') {
            const loopCount = getNestedProperty(exercise, command.target) || 0;
            for (let i = 0; i < loopCount; i++) {
              const newLoopContext = { ...loopContext, rep: i + 1 };
              queue.push(...interpretTemplate(command.actions, exercise, newLoopContext));
            }
          } else if (command.type === 'conditional') {
            const [prop, value] = command.condition.split(' > ');
            const propValue = getNestedProperty(exercise, prop);
            if (propValue > parseInt(value, 10)) {
              queue.push(...interpretTemplate(command.actions, exercise, loopContext));
            }
          } else {
            const newCommand = { ...command };
            if (newCommand.text_key) {
              newCommand.text = UI_TEXT[newCommand.text_key] || '';
            }
            if (newCommand.duration_from) {
              newCommand.duration_ms = (getNestedProperty(exercise, newCommand.duration_from) || 0) * 1000;
            }
            if (newCommand.phase) {
              newCommand.rep = loopContext.rep;
            }
            queue.push(newCommand);
          }
        }
        return queue;
      }

      export function buildExecutionQueueForCurrentSet() {
        const state = getWorkoutState();
        const currentExercise = state.exerciseQueue[state.currentExerciseIndex];
        const execution_mode = currentExercise.execution_mode || 'tempo_guided';

        let queue = [];
        if (execution_mode === 'tempo_guided') {
          queue = interpretTemplate(TEMPO_GUIDED_FLOW, currentExercise, { set: state.currentSet });
        }

        const { debugMode } = getGlobalState();
        if (debugMode) {
          console.groupCollapsed(`[Trainer-Queue] Execution Queue for: ${currentExercise.name} - Set ${state.currentSet}`);
          console.table(queue);
          console.groupEnd();
        }

        return queue;
      }
commands:
  - "echo 'Queue builder fixed. The trainer will now correctly generate the execution queue.'"