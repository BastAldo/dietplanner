commit_message: "feat(UI/UX): Potenzia l'interfaccia con widget di riepilogo, grafici di correlazione e terminologia corretta"
rationale: |
  Questo commit introduce una serie di importanti miglioramenti all'interfaccia utente e alla visualizzazione dei dati, basati sulla nostra ultima discussione, per rendere l'applicazione più intuitiva e potente.

  1.  **Correzione Terminologica**: È stata corretta la terminologia in tutta l'interfaccia, sostituendo "Riposo" con il più tecnico e appropriato "Recupero" sia nella schermata di debriefing che nella vista log, come da tua indicazione.

  2.  **Widget di Riepilogo Settimanale**: È stato introdotto un nuovo widget nella vista Planner. Questo componente fornisce una visione d'insieme immediata della settimana, mostrando la media calorica giornaliera e il rapporto tra allenamenti completati e pianificati, offrendo un feedback motivazionale.

  3.  **Grafico di Correlazione Peso/Calorie**: La pagina dei grafici è stata arricchita con un nuovo grafico di correlazione. Questa visualizzazione mette in relazione diretta l'andamento del peso (linea) con l'apporto calorico (barre), fornendo uno strumento di analisi fondamentale per l'utente.

  4.  **Refactoring Stili**: Sono stati aggiunti gli stili necessari in `styles/planner.css` per il nuovo widget, garantendo coerenza visiva con il resto dell'applicazione.
