  - file: src/core/state.js
    content: |
      import { LOCAL_STORAGE_KEY_PLAN, LOCAL_STORAGE_KEY_URL, MEAL_TYPES, LOCAL_STORAGE_KEY_BIOMETRICS, LOCAL_STORAGE_KEY_PROFILE, LOCAL_STORAGE_KEY_WORKOUTS, WORKOUT_SLOT_ID } from '../utils/constants.js';
      import { processMealsWithCalories } from './calorieCalculator.js';

      let state = {
        rules: [],
        masterMealList: [],
        masterWorkoutList: [],
        weeklyPlan: {},
        weeklyWorkouts: {},
        biometricData: [],
        userProfile: {},
        configUrl: '',
        recipeBaseUrl: '',
        focusedDate: new Date(),
        currentView: 'planner', // 'planner', 'log', 'progress', 'charts', 'recipes', 'profile', or 'trainer'
      };

      const notify = () => document.dispatchEvent(new CustomEvent('stateChange'));
      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);

      const getWeekStartDate = (date) => {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
      };

      export const getState = () => ({ ...state });

      export function setPlannerConfig(config, url) {
        state.rules = config.rules || [];
        const ingredients = config.ingredienti || [];
        const meals = config.meals || [];
        state.masterWorkoutList = config.esercizi || [];

        // Calcola calorie e popola la master list
        state.masterMealList = processMealsWithCalories(meals, ingredients);

        // Deriva e imposta la recipeBaseUrl
        if (url) {
            const baseUrl = new URL(url);
            const recipePath = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf('/')) + '/ricette/';
            state.recipeBaseUrl = `${baseUrl.origin}${recipePath}`;
        } else {
            state.recipeBaseUrl = '';
        }

        notify();
      }

      export function setConfigUrl(url) {
        state.configUrl = url;
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, url);
        notify();
      }

      export function saveStateToLocalStorage() {
        localStorage.setItem(LOCAL_STORAGE_KEY_PLAN, JSON.stringify(state.weeklyPlan));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUTS, JSON.stringify(state.weeklyWorkouts));
        localStorage.setItem(LOCAL_STORAGE_KEY_BIOMETRICS, JSON.stringify(state.biometricData));
        localStorage.setItem(LOCAL_STORAGE_KEY_PROFILE, JSON.stringify(state.userProfile));
      }

      export function loadStateFromLocalStorage() {
        const plan = localStorage.getItem(LOCAL_STORAGE_KEY_PLAN);
        const workouts = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUTS);
        const url = localStorage.getItem(LOCAL_STORAGE_KEY_URL);
        const biometrics = localStorage.getItem(LOCAL_STORAGE_KEY_BIOMETRICS);
        const profile = localStorage.getItem(LOCAL_STORAGE_KEY_PROFILE);

        if (plan) { try { state.weeklyPlan = JSON.parse(plan); } catch (e) { console.error("Error parsing weeklyPlan", e); state.weeklyPlan = {}; } }
        if (workouts) { try { state.weeklyWorkouts = JSON.parse(workouts); } catch (e) { console.error("Error parsing weeklyWorkouts", e); state.weeklyWorkouts = {}; } }
        if (url) { state.configUrl = url; }
        if (biometrics) { try { state.biometricData = JSON.parse(biometrics); } catch (e) { console.error("Error parsing biometricData", e); state.biometricData = []; } }
        if (profile) { try { state.userProfile = JSON.parse(profile); } catch (e) { console.error("Error parsing userProfile", e); state.userProfile = {}; } }
      }

      export function setAppState(backupData) {
        state.weeklyPlan = backupData.weeklyPlan || {};
        state.weeklyWorkouts = backupData.weeklyWorkouts || {};
        state.configUrl = backupData.configUrl || '';
        state.biometricData = backupData.biometricData || [];
        state.userProfile = backupData.userProfile || {};
        saveStateToLocalStorage();
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, state.configUrl);
        notify();
      }

      export function saveUserProfile(profile) {
        state.userProfile = profile;
        saveStateToLocalStorage();
        notify();
      }

      export function addOrUpdateBiometricEntry(entry) {
        const index = state.biometricData.findIndex(e => e.date === entry.date);
        if (index > -1) {
          state.biometricData[index] = entry;
        } else {
          state.biometricData.push(entry);
        }
        state.biometricData.sort((a, b) => new Date(b.date) - new Date(a.date));
        saveStateToLocalStorage();
        notify();
      }

      export function deleteBiometricEntry(date) {
        state.biometricData = state.biometricData.filter(e => e.date !== date);
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyPlan(slotId, mealId) {
        if (mealId) {
          const meal = state.masterMealList.find(m => m.id === mealId);
          if (meal) {
            state.weeklyPlan[slotId] = { ...meal };
          }
        } else {
          delete state.weeklyPlan[slotId];
        }
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyWorkout(slotId, exerciseId, instanceId = null) {
          if (!state.weeklyWorkouts[slotId]) {
              state.weeklyWorkouts[slotId] = [];
          }

          if (exerciseId) { // Add an exercise
              const exercise = state.masterWorkoutList.find(ex => ex.id === exerciseId);
              if (exercise) {
                  const newExerciseInstance = {
                      ...exercise,
                      instanceId: Date.now() // Unique ID for this specific instance
                  };
                  state.weeklyWorkouts[slotId].push(newExerciseInstance);
              }
          } else if (instanceId) { // Remove an exercise
              state.weeklyWorkouts[slotId] = state.weeklyWorkouts[slotId].filter(ex => ex.instanceId !== instanceId);
              if (state.weeklyWorkouts[slotId].length === 0) {
                  delete state.weeklyWorkouts[slotId];
              }
          }
          saveStateToLocalStorage();
          notify();
      }

      export function updateExerciseInstanceInWorkout(slotId, instanceId, newValues) {
          if (!state.weeklyWorkouts[slotId]) return;

          const workoutList = state.weeklyWorkouts[slotId];
          const exerciseIndex = workoutList.findIndex(ex => ex.instanceId === instanceId);

          if (exerciseIndex > -1) {
              const updatedExercise = { ...workoutList[exerciseIndex], ...newValues };
              // Ensure tempo is handled as an object
              if (newValues.defaultTempo) {
                  updatedExercise.defaultTempo = { ...workoutList[exerciseIndex].defaultTempo, ...newValues.defaultTempo };
              }
              workoutList[exerciseIndex] = updatedExercise;
              saveStateToLocalStorage();
              notify();
          }
      }

      export function reorderWorkoutExercises(slotId, oldIndex, newIndex) {
          if (!state.weeklyWorkouts[slotId] || oldIndex === newIndex) return;
          const workoutList = state.weeklyWorkouts[slotId];
          const [movedItem] = workoutList.splice(oldIndex, 1);
          workoutList.splice(newIndex, 0, movedItem);
          saveStateToLocalStorage();
          notify();
      }

      export function resetCurrentWeek() {
        const weekStart = getWeekStartDate(state.focusedDate);
        for (let i = 0; i < 7; i++) {
            const date = new Date(weekStart);
            date.setDate(date.getDate() + i);
            const isoDate = toISODateString(date);
            MEAL_TYPES.forEach(mealType => {
                const slotId = `${isoDate}-${mealType}`;
                if (state.weeklyPlan[slotId]) {
                    delete state.weeklyPlan[slotId];
                }
            });
            const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
            if (state.weeklyWorkouts[workoutSlotId]) {
                delete state.weeklyWorkouts[workoutSlotId];
            }
        }
        saveStateToLocalStorage();
        notify();
      }

      export function navigateWeek(direction) {
        const newDate = new Date(state.focusedDate);
        newDate.setDate(newDate.getDate() + (direction * 7));
        state.focusedDate = newDate;
        notify();
      }

      export function setView(view) {
        if (['planner', 'log', 'progress', 'profile', 'charts', 'recipes', 'trainer'].includes(view)) {
          state.currentView = view;
          notify();
        }
      }

      export function copyPreviousWeek() {
        const currentWeekStart = getWeekStartDate(state.focusedDate);
        const prevWeekStart = new Date(currentWeekStart);
        prevWeekStart.setDate(prevWeekStart.getDate() - 7);

        for (let i = 0; i < 7; i++) {
          const sourceDate = new Date(prevWeekStart);
          sourceDate.setDate(sourceDate.getDate() + i);
          const sourceISO = toISODateString(sourceDate);

          const destDate = new Date(currentWeekStart);
          destDate.setDate(destDate.getDate() + i);
          const destISO = toISODateString(destDate);

          MEAL_TYPES.forEach(mealType => {
            const sourceSlotId = `${sourceISO}-${mealType}`;
            const destSlotId = `${destISO}-${mealType}`;
            const mealObject = state.weeklyPlan[sourceSlotId];

            if (mealObject) {
              state.weeklyPlan[destSlotId] = { ...mealObject };
            } else {
              delete state.weeklyPlan[destSlotId];
            }
          });

          const sourceWorkoutSlot = `${sourceISO}-${WORKOUT_SLOT_ID}`;
          const destWorkoutSlot = `${destISO}-${WORKOUT_SLOT_ID}`;
          const workoutList = state.weeklyWorkouts[sourceWorkoutSlot];
          if (workoutList && Array.isArray(workoutList)) {
              state.weeklyWorkouts[destWorkoutSlot] = JSON.parse(JSON.stringify(workoutList)); // Deep copy
          } else {
              delete state.weeklyWorkouts[destWorkoutSlot];
          }
        }
        saveStateToLocalStorage();
        notify();
      }
  - file: src/ui/modals.js
    content: |
      import { getState, updateWeeklyPlan, updateWeeklyWorkout, updateExerciseInstanceInWorkout, reorderWorkoutExercises, setView } from '../core/state.js';
      import { showNotification } from './notifications.js';
      import { UI_TEXT, MEAL_TYPES, WORKOUT_SLOT_ID } from '../utils/constants.js';
      import { renderIcon } from './icons.js';

      let currentEditingDayISO = null;
      let sortableInstance = null;

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function getRecipeButtonHTML(meal, state) {
        if (state.recipeBaseUrl && meal && meal.recipeId) {
          return `<button class="btn-view-recipe" data-meal-id="${meal.id}" title="${UI_TEXT.RECIPE_BUTTON_TITLE}">
                    ${renderIcon('RECIPE', { width: 20, height: 20 })}
                  </button>`;
        }
        return '';
      }

      function formatIngredients(meal) {
          if (!meal.ingredienti || !Array.isArray(meal.ingredienti)) return '';
          
          const ingredientsList = meal.ingredienti.map(item => {
              let quantity = '';
              if (item.quantita_g) quantity = `${item.quantita_g}g`;
              else if (item.quantita_g_min && item.quantita_g_max) quantity = `${item.quantita_g_min}-${item.quantita_g_max}g`;
              else if (item.quantita_g_min) quantity = `${item.quantita_g_min}g`;
              else if (item.quantita_pezzi) quantity = `x${item.quantita_pezzi}`;
              
              return `${item.id.replace(/_/g, ' ')} ${quantity}`.trim();
          }).join(', ');
          
          return `<p>${ingredientsList}</p>`;
      }

      function formatExerciseDetails(exercise) {
        const sets = exercise.defaultSets;
        const rest = exercise.defaultRest;
        let details;

        if (exercise.type === 'reps') {
            const reps = exercise.defaultReps;
            details = `${sets} x ${reps} | Riposo: ${rest}s`;
        } else if (exercise.type === 'time') {
            const duration = exercise.defaultDuration;
            details = `${sets} x ${duration}s | Riposo: ${rest}s`;
        }

        if (exercise.defaultTempo) {
            const { up, hold, down } = exercise.defaultTempo;
            details += ` | Tempo: ${up}-${hold}-${down}`;
        }
        return details;
      }

      export async function showRecipeModal(meal) {
        if (!meal) return;
        const state = getState();
        const recipeModal = document.getElementById('recipe-modal');
        const url = `${state.recipeBaseUrl}${meal.recipeId}.md`;
        recipeModal.querySelector('#recipe-modal-title').textContent = meal.nomePasto;
        const body = recipeModal.querySelector('#recipe-modal-body');
        body.innerHTML = `<p>${UI_TEXT.RECIPE_MODAL_LOADING}</p>`;
        recipeModal.classList.remove('modal-hidden');
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Errore di rete: ${response.status}`);
          body.innerHTML = DOMPurify.sanitize(marked.parse(await response.text()));
        } catch (error) {
          body.innerHTML = `<p>${UI_TEXT.RECIPE_MODAL_LOAD_ERROR}</p>`;
          showNotification(UI_TEXT.RECIPE_LOAD_FAIL_MSG, 'error');
        }
      }

      export function showConfirmModal(title, message, onConfirm, type = 'secondary') {
        const confirmModal = document.getElementById('confirm-modal');
        confirmModal.querySelector('#confirm-modal-title').textContent = title;
        confirmModal.querySelector('#confirm-modal-message').textContent = message;
        const confirmBtn = confirmModal.querySelector('#confirm-modal-confirm-btn');
        const cancelBtn = confirmModal.querySelector('#confirm-modal-cancel-btn');
        confirmBtn.className = `btn btn-${type}`;
        confirmBtn.textContent = UI_TEXT.CONFIRM_MODAL_CONFIRM_BTN;
        cancelBtn.textContent = UI_TEXT.CONFIRM_MODAL_CANCEL_BTN;
        const cleanup = () => {
          confirmModal.classList.add('modal-hidden');
          cancelBtn.removeEventListener('click', cancelHandler);
          confirmBtn.removeEventListener('click', confirmHandler);
        };
        const cancelHandler = () => cleanup();
        const confirmHandler = () => { onConfirm(); cleanup(); };
        cancelBtn.addEventListener('click', cancelHandler, { once: true });
        confirmBtn.addEventListener('click', confirmHandler, { once: true });
        confirmModal.classList.remove('modal-hidden');
      }

      export function openSelectionModal(slotId) {
        const state = getState();
        const mealType = slotId.substring(11);
        const selectionModal = document.getElementById('selection-modal');
        selectionModal.querySelector('#selection-modal-title').textContent = `${UI_TEXT.SELECT_MEAL_TITLE} ${mealType}`;
        const list = selectionModal.querySelector('#selection-modal-list');
        const relevantMeals = state.masterMealList.filter(m => m.tipoPasto === mealType || m.tipoPasto === 'Tutti');
        list.innerHTML = relevantMeals.length > 0 ? relevantMeals.map(meal => `<div class="selection-item" data-meal-id="${meal.id}"><h4>${meal.nomePasto}</h4>${formatIngredients(meal)}</div>`).join('') : `<p>${UI_TEXT.NO_MEALS_AVAILABLE}</p>`;
        const closeAndReturn = () => {
          selectionModal.classList.add('modal-hidden');
          if (currentEditingDayISO) openDayEditorModal(currentEditingDayISO);
        };
        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if(item) { updateWeeklyPlan(slotId, item.dataset.mealId); closeAndReturn(); }
        };
        selectionModal.classList.remove('modal-hidden');
      }

      export function openWorkoutSelectionModal(slotId) {
        const state = getState();
        const workoutSelectionModal = document.getElementById('workout-selection-modal');
        workoutSelectionModal.querySelector('#workout-selection-modal-title').textContent = UI_TEXT.SELECT_EXERCISE_TITLE;
        const list = workoutSelectionModal.querySelector('#workout-selection-modal-list');
        const relevantWorkouts = state.masterWorkoutList;
        list.innerHTML = relevantWorkouts.length > 0 ? relevantWorkouts.map(ex => `<div class="selection-item" data-exercise-id="${ex.id}"><h4>${ex.name}</h4><p>${ex.description}</p></div>`).join('') : `<p>${UI_TEXT.NO_WORKOUTS_AVAILABLE}</p>`;
        
        const closeAndReturn = () => {
          workoutSelectionModal.classList.add('modal-hidden');
          if (currentEditingDayISO) openWorkoutEditorModal(currentEditingDayISO);
        };

        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if (item) {
            updateWeeklyWorkout(slotId, item.dataset.exerciseId);
            closeAndReturn();
          }
        };
        workoutSelectionModal.classList.remove('modal-hidden');
      }

      export function openExerciseEditorModal(slotId, instanceId) {
        const state = getState();
        const modal = document.getElementById('exercise-editor-modal');
        const form = modal.querySelector('form');
        const workoutList = state.weeklyWorkouts[slotId] || [];
        const exercise = workoutList.find(ex => ex.instanceId === instanceId);

        if (!exercise) return;

        modal.querySelector('#exercise-editor-title').textContent = `Modifica: ${exercise.name}`;
        modal.querySelector('#exercise-editor-save-btn').textContent = UI_TEXT.EXERCISE_SAVE_BTN;
        form.elements.sets.value = exercise.defaultSets;
        form.elements.rest.value = exercise.defaultRest;

        const repsContainer = form.querySelector('.reps-group');
        const durationContainer = form.querySelector('.duration-group');

        if (exercise.type === 'reps') {
            repsContainer.style.display = 'block';
            durationContainer.style.display = 'none';
            form.elements.reps.value = exercise.defaultReps;
        } else {
            repsContainer.style.display = 'none';
            durationContainer.style.display = 'block';
            form.elements.duration.value = exercise.defaultDuration;
        }

        const tempoContainer = form.querySelector('.tempo-group');
        if (exercise.defaultTempo) {
            tempoContainer.style.display = 'grid';
            form.elements.tempo_up.value = exercise.defaultTempo.up;
            form.elements.tempo_hold.value = exercise.defaultTempo.hold;
            form.elements.tempo_down.value = exercise.defaultTempo.down;
        } else {
            tempoContainer.style.display = 'none';
        }

        form.onsubmit = e => {
            e.preventDefault();
            const newValues = {
                defaultSets: parseInt(form.elements.sets.value),
                defaultRest: parseInt(form.elements.rest.value)
            };
            if (exercise.type === 'reps') {
                newValues.defaultReps = parseInt(form.elements.reps.value);
            } else {
                newValues.defaultDuration = parseInt(form.elements.duration.value);
            }
            if (exercise.defaultTempo) {
                newValues.defaultTempo = {
                    up: parseInt(form.elements.tempo_up.value),
                    hold: parseInt(form.elements.tempo_hold.value),
                    down: parseInt(form.elements.tempo_down.value)
                };
            }
            updateExerciseInstanceInWorkout(slotId, instanceId, newValues);
            modal.classList.add('modal-hidden');
            openWorkoutEditorModal(currentEditingDayISO);
        };
        
        modal.classList.remove('modal-hidden');
      }

      export function openWorkoutEditorModal(isoDate) {
        currentEditingDayISO = isoDate;
        const state = getState();
        const modal = document.getElementById('workout-editor-modal');
        modal.querySelector('#workout-editor-title').textContent = `${UI_TEXT.WORKOUT_EDITOR_TITLE} - ${formatFullDate(isoDate)}`;
        const body = modal.querySelector('#workout-editor-body');
        const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
        const plannedWorkoutList = state.weeklyWorkouts[workoutSlotId] || [];

        let exercisesHTML = plannedWorkoutList.map(exercise => {
            const exerciseDetails = formatExerciseDetails(exercise);
            return `<div class="meal-details draggable-item" data-instance-id="${exercise.instanceId}">
                        <div class="drag-handle">${renderIcon('DRAG_HANDLE', { width: 18, height: 18 })}</div>
                        <div class="exercise-info">
                            <span class="meal-details__name">${exercise.name}</span>
                            <span class="exercise-details-summary">${exerciseDetails}</span>
                        </div>
                        <div class="meal-actions">
                            <button class="btn-edit-exercise" title="Modifica" data-slot-id="${workoutSlotId}" data-instance-id="${exercise.instanceId}">${renderIcon('EDIT', { width: 16, height: 16 })}</button>
                            <button class="btn-remove-exercise" title="Rimuovi" data-slot-id="${workoutSlotId}" data-instance-id="${exercise.instanceId}">${renderIcon('TRASH', { width: 16, height: 16 })}</button>
                        </div>
                    </div>`;
        }).join('');

        const addExerciseButton = `<button class="btn-add-exercise" data-slot-id="${workoutSlotId}">${UI_TEXT.ADD_EXERCISE_BTN}</button>`;
        body.innerHTML = `<div class="day-editor-list workout-editor-list">${exercisesHTML}</div>${addExerciseButton}`;

        const listContainer = body.querySelector('.workout-editor-list');

        if (sortableInstance) {
            sortableInstance.destroy();
        }
        sortableInstance = new Sortable(listContainer, {
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            onEnd: function(evt) {
                reorderWorkoutExercises(workoutSlotId, evt.oldIndex, evt.newIndex);
            }
        });

        body.onclick = e => {
            const btnAddExercise = e.target.closest('.btn-add-exercise');
            const btnRemoveExercise = e.target.closest('.btn-remove-exercise');
            const btnEditExercise = e.target.closest('.btn-edit-exercise');

            if (btnAddExercise) {
                modal.classList.add('modal-hidden');
                openWorkoutSelectionModal(btnAddExercise.dataset.slotId);
            } else if (btnRemoveExercise) {
                updateWeeklyWorkout(btnRemoveExercise.dataset.slotId, null, parseInt(btnRemoveExercise.dataset.instanceId));
                openWorkoutEditorModal(isoDate); // Refresh this modal
            } else if (btnEditExercise) {
                modal.classList.add('modal-hidden');
                openExerciseEditorModal(btnEditExercise.dataset.slotId, parseInt(btnEditExercise.dataset.instanceId));
            }
        };

        modal.classList.remove('modal-hidden');
      }

      export function openDayEditorModal(isoDate) {
        currentEditingDayISO = isoDate;
        const state = getState();
        const dayEditorModal = document.getElementById('day-editor-modal');
        dayEditorModal.querySelector('#day-editor-title').textContent = `${UI_TEXT.EDITOR_MODAL_TITLE_PREFIX} ${formatFullDate(isoDate)}`;
        const body = dayEditorModal.querySelector('#day-editor-body');
        
        const mealSlotsHTML = MEAL_TYPES.map(mealType => {
          const slotId = `${isoDate}-${mealType}`;
          const plannedMeal = state.weeklyPlan[slotId];
          const meal = plannedMeal ? state.masterMealList.find(m => m.id === plannedMeal.id) : null;
          
          let mealDetailsHTML = `<button class="btn-add-meal" data-slot-id="${slotId}">${UI_TEXT.ADD_MEAL_BTN}</button>`;
          if (meal) {
            mealDetailsHTML = `<div class="meal-details"><span class="meal-details__name">${meal.nomePasto}</span><div class="meal-actions">${getRecipeButtonHTML(meal, state)}<button class="btn-remove-meal" data-slot-id="${slotId}">${renderIcon('TRASH', { width: 16, height: 16 })}</button></div></div>`;
          }
          return `<div class="day-editor-slot"><span class="meal-type-label">${mealType}</span><div class="meal-details-container">${mealDetailsHTML}</div></div>`;
        }).join('');

        const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
        const plannedWorkoutList = state.weeklyWorkouts[workoutSlotId] || [];
        
        let workoutDetailsHTML;
        if (plannedWorkoutList.length > 0) {
            const plural = plannedWorkoutList.length > 1 ? 'Esercizi' : 'Esercizio';
            const startWorkoutBtn = `<button class="btn-start-workout btn btn-primary">${UI_TEXT.START_WORKOUT_BTN}</button>`;
            workoutDetailsHTML = `<div class="workout-summary"><span>${plannedWorkoutList.length} ${plural}</span><div class="workout-summary-actions"><button class="btn-manage-workout btn btn-secondary">${UI_TEXT.MANAGE_WORKOUT_BTN}</button>${startWorkoutBtn}</div></div>`;
        } else {
            workoutDetailsHTML = `<button class="btn-add-exercise" data-slot-id="${workoutSlotId}">${UI_TEXT.ADD_EXERCISE_BTN}</button>`;
        }
        
        const workoutSlotHTML = `<div class="day-editor-slot"><span class="meal-type-label">${WORKOUT_SLOT_ID}</span><div class="meal-details-container">${workoutDetailsHTML}</div></div>`;

        body.innerHTML = mealSlotsHTML + workoutSlotHTML;

        body.onclick = e => {
          const btnAddMeal = e.target.closest('.btn-add-meal');
          const btnRemoveMeal = e.target.closest('.btn-remove-meal');
          const btnRecipe = e.target.closest('.btn-view-recipe');
          const btnAddExercise = e.target.closest('.btn-add-exercise');
          const btnManageWorkout = e.target.closest('.btn-manage-workout');
          const btnStartWorkout = e.target.closest('.btn-start-workout');

          if (btnAddMeal) { dayEditorModal.classList.add('modal-hidden'); openSelectionModal(btnAddMeal.dataset.slotId); }
          else if (btnRemoveMeal) { updateWeeklyPlan(btnRemoveMeal.dataset.slotId, null); openDayEditorModal(isoDate); }
          else if (btnRecipe) {
            const meal = state.masterMealList.find(m => m.id === btnRecipe.dataset.mealId);
            if (meal) showRecipeModal(meal);
          }
          else if (btnAddExercise) {
            dayEditorModal.classList.add('modal-hidden');
            openWorkoutEditorModal(isoDate);
          }
          else if (btnManageWorkout) {
            dayEditorModal.classList.add('modal-hidden');
            openWorkoutEditorModal(isoDate);
          }
          else if (btnStartWorkout) {
            dayEditorModal.classList.add('modal-hidden');
            setView('trainer');
          }
        };
        dayEditorModal.classList.remove('modal-hidden');
      }
  - file: src/ui/renderer.js
    content: |
      import { getState } from '../core/state.js';
      import { renderPlannerPage } from './plannerRenderer.js';
      import { renderBiometricsPage, renderProfilePage, renderChartsPage } from './pageRenderers.js';
      import { renderRecipesPage } from './recipesRenderer.js';
      import { UI_TEXT } from '../utils/constants.js';
      import { renderIcon } from './icons.js';

      function populateIcons() {
          document.querySelector('.app-title').insertAdjacentHTML('afterbegin', renderIcon('APP_LOGO', { width: 24, height: 24 }));
          document.getElementById('nav-planner').insertAdjacentHTML('afterbegin', renderIcon('PLANNER'));
          document.getElementById('nav-progress').insertAdjacentHTML('afterbegin', renderIcon('WEIGHT_SCALE'));
          document.getElementById('nav-charts').insertAdjacentHTML('afterbegin', renderIcon('BAR_CHART'));
          document.getElementById('nav-recipes').insertAdjacentHTML('afterbegin', renderIcon('BOOK'));
          document.getElementById('nav-profile').insertAdjacentHTML('afterbegin', renderIcon('PROFILE'));
          document.getElementById('share-config-btn').innerHTML = renderIcon('SHARE');
          document.getElementById('info-icon').innerHTML = renderIcon('INFO');
          document.getElementById('view-calendar-btn').innerHTML = renderIcon('PLANNER');
          document.getElementById('view-log-btn').innerHTML = renderIcon('LOG_VIEW');
          document.getElementById('global-alert-close').innerHTML = renderIcon('CLOSE', { width: 24, height: 24, classes: 'alert-icon' });
          
          document.querySelectorAll('.modal-close-btn').forEach(btn => {
              btn.innerHTML = renderIcon('CLOSE');
          });
      }

      export function populateInitialText() {
        document.title = UI_TEXT.MAIN_TITLE;
        document.getElementById('main-title').textContent = UI_TEXT.MAIN_TITLE;
        document.querySelector('#nav-planner span').textContent = UI_TEXT.NAV_PLANNER;
        document.querySelector('#nav-progress span').textContent = UI_TEXT.NAV_PROGRESS;
        document.querySelector('#nav-charts span').textContent = UI_TEXT.NAV_CHARTS;
        document.querySelector('#nav-recipes span').textContent = UI_TEXT.NAV_RECIPES;
        document.querySelector('#nav-profile span').textContent = UI_TEXT.NAV_PROFILE;
        document.getElementById('load-config-btn').textContent = UI_TEXT.LOAD_BUTTON;
        document.getElementById('reset-btn').textContent = UI_TEXT.RESET_BUTTON;
        document.getElementById('copy-week-btn').textContent = UI_TEXT.COPY_WEEK_BTN;
        document.getElementById('backup-btn').textContent = UI_TEXT.BACKUP_BTN;
        document.getElementById('restore-btn').textContent = UI_TEXT.RESTORE_BTN;
        document.getElementById('info-modal-title').textContent = UI_TEXT.INFO_MODAL_TITLE;
        document.getElementById('info-modal-desc').textContent = UI_TEXT.INFO_MODAL_DESC;
        document.getElementById('info-modal-json-example').textContent = UI_TEXT.INFO_MODAL_EXAMPLE_JSON;
        document.getElementById('biometrics-title').textContent = UI_TEXT.BIOMETRICS_FORM_TITLE;
        document.getElementById('biometrics-history-title').textContent = UI_TEXT.BIOMETRICS_HISTORY_TITLE;
        document.getElementById('profile-title').textContent = UI_TEXT.PROFILE_FORM_TITLE;
        document.getElementById('charts-title').textContent = UI_TEXT.CHARTS_TITLE;
        document.getElementById('planner-chart-title').textContent = UI_TEXT.PLANNER_CHART_TITLE;
        document.getElementById('biometrics-chart-title').textContent = UI_TEXT.BIOMETRICS_CHART_TITLE;
        document.getElementById('recipes-title').textContent = UI_TEXT.RECIPES_TITLE;
        populateIcons();
      }

      export function renderApp() {
        const state = getState();
        const plannerPage = document.getElementById('planner-page');
        const progressPage = document.getElementById('progress-page');
        const chartsPage = document.getElementById('charts-page');
        const recipesPage = document.getElementById('recipes-page');
        const profilePage = document.getElementById('profile-page');
        const trainerPage = document.getElementById('trainer-page');

        const navPlannerBtn = document.getElementById('nav-planner');
        const navProgressBtn = document.getElementById('nav-progress');
        const navChartsBtn = document.getElementById('nav-charts');
        const navRecipesBtn = document.getElementById('nav-recipes');
        const navProfileBtn = document.getElementById('nav-profile');

        [plannerPage, progressPage, chartsPage, recipesPage, profilePage, trainerPage].forEach(p => p.classList.add('hidden'));
        [navPlannerBtn, navProgressBtn, navChartsBtn, navRecipesBtn, navProfileBtn].forEach(b => b.classList.remove('active'));

        if (state.currentView === 'planner' || state.currentView === 'log') {
          plannerPage.classList.remove('hidden');
          navPlannerBtn.classList.add('active');
          renderPlannerPage(state);
        } else if (state.currentView === 'progress') {
          progressPage.classList.remove('hidden');
          navProgressBtn.classList.add('active');
          renderBiometricsPage(state);
        } else if (state.currentView === 'charts') {
          chartsPage.classList.remove('hidden');
          navChartsBtn.classList.add('active');
          renderChartsPage(state);
        } else if (state.currentView === 'recipes') {
          recipesPage.classList.remove('hidden');
          navRecipesBtn.classList.add('active');
          renderRecipesPage(state);
        } else if (state.currentView === 'profile') {
          profilePage.classList.remove('hidden');
          navProfileBtn.classList.add('active');
          renderProfilePage(state);
        } else if (state.currentView === 'trainer') {
          trainerPage.classList.remove('hidden');
        }

        const urlInput = document.getElementById('config-url-input');
        if (document.activeElement !== urlInput) urlInput.value = state.configUrl;
      }
  - file: src/ui/viewLoader.js
    content: |
      async function fetchAndInject(url, containerId) {
          try {
              const response = await fetch(url);
              if (!response.ok) {
                  throw new Error(`Failed to load template: ${url}`);
              }
              const content = await response.text();
              document.getElementById(containerId).innerHTML += content;
          } catch (error) {
              console.error(error);
          }
      }

      export async function loadViews() {
          const appContainer = document.getElementById('app-container');
          const modalContainer = document.getElementById('modal-container');
          
          // Svuota i container per evitare duplicati in caso di ricaricamento a caldo (hot-reloading)
          appContainer.innerHTML = '';
          modalContainer.innerHTML = '';

          // Carica le viste principali
          await fetchAndInject('templates/planner.html', 'app-container');
          await fetchAndInject('templates/progress.html', 'app-container');
          await fetchAndInject('templates/charts.html', 'app-container');
          await fetchAndInject('templates/recipes.html', 'app-container');
          await fetchAndInject('templates/profile.html', 'app-container');
          await fetchAndInject('templates/trainer.html', 'app-container');
          
          // Carica i modali
          await fetchAndInject('templates/modals.html', 'modal-container');
      }
