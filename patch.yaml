commit_message: "feat(ui): Refactor planner into a dashboard and move data management"
rationale: |
  This commit implements Phase 4 of the strategic UI/UX overhaul, based on direct user feedback. The primary goal is to declutter the main planner view and transform it into a more functional, user-centric dashboard.

  Key changes include:
  1.  **Data Management Consolidation**: The rarely used remote configuration loader, along with the backup and restore buttons, have been removed from the main planner page and the global footer. They are now logically consolidated into a new "Gestione Dati" section within the user's profile page, where users would expect to find such settings.
  2.  **Planner Dashboard Implementation**: The space freed up on the planner page has been repurposed for a new "Riepilogo Settimanale" (Weekly Summary) widget. This dynamic dashboard provides at-a-glance information, comparing the user's weekly planned/completed activities against their set goals (Average Calories, Number of Workouts, and Weight Progress).
  3.  **Improved User Experience**: By promoting relevant, dynamic data to the main view and moving secondary configuration tasks to a more appropriate location, the application's startup experience is now significantly more engaging and useful for the user's day-to-day activities.
  4.  **Code Refactoring**: Interaction listeners and rendering logic have been updated to reflect the relocated components, ensuring all functionality remains intact in its new location. The global footer has been removed entirely.
