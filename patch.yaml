    content: |
      import { updateExerciseInstanceInWorkout, updateExerciseSetsInHistory } from '../../core/state.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';
      import { openWorkoutEditorModal } from './workoutEditorModal.js';
      import { showNotification } from '../notifications.js';

      const EXECUTION_MODES = {
        GUIDED_TEMPO: 'guided_tempo',
        GUIDED_STATIC: 'guided_static',
        LOGGING: 'logging'
      };

      // Funzione helper per gestire la visibilità dei campi
      function toggleFormFields(form, mode) {
        form.querySelector('.reps-group').style.display = 'none';
        form.querySelector('.duration-group').style.display = 'none';
        form.querySelector('.tempo-group').style.display = 'none';
        form.querySelector('.reps-range-group').style.display = 'none';

        if (mode === EXECUTION_MODES.GUIDED_TEMPO) {
          form.querySelector('.reps-group').style.display = 'flex';
          form.querySelector('.tempo-group').style.display = 'grid';
        } else if (mode === EXECUTION_MODES.GUIDED_STATIC) {
          form.querySelector('.duration-group').style.display = 'flex';
        } else if (mode === EXECUTION_MODES.LOGGING) {
          form.querySelector('.reps-range-group').style.display = 'grid';
        }
      }

      function renderPlannerForm(body, exercise) {
        // Normalizza i dati dell'esercizio per la prima apertura
        let currentMode = exercise.execution_mode || EXECUTION_MODES.GUIDED_TEMPO;
        if (exercise.type === 'time' && !exercise.execution_mode) {
          currentMode = EXECUTION_MODES.GUIDED_STATIC;
        }
        
        body.innerHTML = `
          <form id="exercise-editor-form">
            <div class="form-group" style="grid-column: 1 / -1;">
              <label for="ex-edit-mode">Modalità Esecuzione</label>
              <select id="ex-edit-mode" name="execution_mode">
                <option value="${EXECUTION_MODES.GUIDED_TEMPO}" ${currentMode === EXECUTION_MODES.GUIDED_TEMPO ? 'selected' : ''}>Guidato (Tempo)</option>
                <option value="${EXECUTION_MODES.GUIDED_STATIC}" ${currentMode === EXECUTION_MODES.GUIDED_STATIC ? 'selected' : ''}>Guidato (Durata)</option>
                <option value="${EXECUTION_MODES.LOGGING}" ${currentMode === EXECUTION_MODES.LOGGING ? 'selected' : ''}>Logging (Manuale)</option>
              </select>
            </div>

            <div class="form-group sets-group">
              <label for="ex-edit-sets">Serie</label>
              <input type="number" id="ex-edit-sets" name="sets" min="1" value="${exercise.defaultSets}">
            </div>

            <div class="form-group reps-group">
              <label for="ex-edit-reps">Ripetizioni</label>
              <input type="number" id="ex-edit-reps" name="reps" min="1" value="${exercise.defaultReps || ''}">
            </div>

            <div class="form-group duration-group">
              <label for="ex-edit-duration">Durata (s)</label>
              <input type="number" id="ex-edit-duration" name="duration" min="1" value="${exercise.defaultDuration || ''}">
            </div>

            <div class="reps-range-group" style="grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label for="ex-edit-reps-min">Rep Min</label>
                <input type="number" id="ex-edit-reps-min" name="reps_min" min="1" value="${exercise.defaultRepsMin || ''}">
              </div>
              <div class="form-group">
                <label for="ex-edit-reps-max">Rep Max</label>
                <input type="number" id="ex-edit-reps-max" name="reps_max" min="1" value="${exercise.defaultRepsMax || ''}">
              </div>
            </div>

            <div class="form-group rest-group">
              <label for="ex-edit-rest">Riposo (s)</label>
              <input type="number" id="ex-edit-rest" name="rest" min="0" value="${exercise.defaultRest}">
            </div>
            <div class="form-group weight-group">
              <label for="ex-edit-weight" id="ex-edit-weight-label">${UI_TEXT.EXERCISE_WEIGHT_LABEL}</label>
              <input type="number" id="ex-edit-weight" name="weight" min="0" step="0.5" value="${exercise.defaultWeight || 0}">
            </div>

            <div class="tempo-group" style="display: ${exercise.defaultTempo ? 'grid' : 'none'};">
              <div class="form-group">
                <label for="ex-edit-tempo-up">Salita (s)</label>
                <input type="number" id="ex-edit-tempo-up" name="tempo_up" min="0" step="0.5" value="${exercise.defaultTempo?.up || 0}">
              </div>
              <div class="form-group">
                <label for="ex-edit-tempo-hold" id="ex-edit-tempo-hold-label">${UI_TEXT.EXERCISE_TEMPO_HOLD_LABEL}</label>
                <input type="number" id="ex-edit-tempo-hold" name="tempo_hold" min="0" step="0.5" value="${exercise.defaultTempo?.hold || 0}">
              </div>
              <div class="form-group">
                <label for="ex-edit-tempo-down">Discesa (s)</label>
                <input type="number" id="ex-edit-tempo-down" name="tempo_down" min="0" step="0.5" value="${exercise.defaultTempo?.down || 0}">
              </div>
            </div>
          </form>
        `;
        
        // Imposta la visibilità iniziale
        const form = body.querySelector('#exercise-editor-form');
        toggleFormFields(form, currentMode);
        
        // Aggiungi listener per il cambio di modalità
        form.querySelector('#ex-edit-mode').addEventListener('change', (e) => {
          toggleFormFields(form, e.target.value);
        });
      }

      function renderLogForm(body, exercise) {
        const showWeight = exercise.defaultWeight || exercise.setsData.some(s => s.weight > 0);
        let formHTML = `<form id="logged-exercise-form" class="structured-form">`;
        formHTML += exercise.setsData.map((set, index) => {
            const weightInput = showWeight ? `
                <div class="form-group">
                    <label for="set-weight-${index}">${UI_TEXT.LOGGED_EXERCISE_WEIGHT_LABEL}</label>
                    <input type="number" id="set-weight-${index}" name="weight_${index}" value="${set.weight || 0}" min="0" step="0.1">
                </div>
            ` : '';
            return `
                <div class="set-editor-row">
                    <span class="set-editor-label">${UI_TEXT.LOGGED_EXERCISE_SET_LABEL} ${index + 1}</span>
                    <div class="form-group">
                        <label for="set-reps-${index}">${UI_TEXT.LOGGED_EXERCISE_REPS_LABEL}</label>
                        <input type="number" id="set-reps-${index}" name="reps_${index}" value="${set.reps || 0}" min="0">
                    </div>
                    ${weightInput}
                </div>
            `;
        }).join('');
        formHTML += '</form>';
        body.innerHTML = formHTML;
      }

      export function openExerciseEditorModal(config) {
        const { context, exercise, date, startTime, slotId, returnIsoDate } = config;
        log('Modals', 'Opening exercise editor modal', { config });

        const modal = document.getElementById('exercise-editor-modal');
        const body = modal.querySelector('#exercise-editor-body');
        const saveBtn = modal.querySelector('#exercise-editor-save-btn');
        let form;
        let saveHandler;

        if (context === 'history') {
            modal.querySelector('#exercise-editor-title').textContent = `${UI_TEXT.LOGGED_EXERCISE_EDITOR_TITLE}: ${exercise.name}`;
            saveBtn.textContent = UI_TEXT.LOGGED_EXERCISE_SAVE_BTN;
            renderLogForm(body, exercise);
            form = body.querySelector('#logged-exercise-form');

            saveHandler = (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                const newSetsData = [...exercise.setsData].map((set, index) => ({
                    ...set,
                    reps: parseInt(formData.get(`reps_${index}`), 10) || 0,
                    weight: parseFloat(formData.get(`weight_${index}`)) || 0,
                }));

                updateExerciseSetsInHistory(date, startTime, exercise.instanceId, newSetsData);
                showNotification(UI_TEXT.WORKOUT_LOG_SAVE_SUCCESS, 'success');
                modal.classList.add('modal-hidden');
            };

        } else if (context === 'planner') {
            modal.querySelector('#exercise-editor-title').textContent = `${UI_TEXT.EXERCISE_EDITOR_TITLE}: ${exercise.name}`;
            saveBtn.textContent = UI_TEXT.EXERCISE_SAVE_BTN;
            renderPlannerForm(body, exercise);
            form = body.querySelector('#exercise-editor-form');

            saveHandler = (e) => {
                e.preventDefault();
                const newValues = {
                    execution_mode: form.elements.execution_mode.value,
                    defaultSets: parseInt(form.elements.sets.value),
                    defaultRest: parseInt(form.elements.rest.value),
                    defaultWeight: parseFloat(form.elements.weight.value),
                    // Resetta tutti i valori specifici della modalità
                    defaultReps: null,
                    defaultDuration: null,
                    defaultRepsMin: null,
                    defaultRepsMax: null
                };

                if (newValues.execution_mode === EXECUTION_MODES.GUIDED_TEMPO) {
                    newValues.defaultReps = parseInt(form.elements.reps.value);
                } else if (newValues.execution_mode === EXECUTION_MODES.GUIDED_STATIC) {
                    newValues.defaultDuration = parseInt(form.elements.duration.value);
                } else if (newValues.execution_mode === EXECUTION_MODES.LOGGING) {
                    newValues.defaultRepsMin = parseInt(form.elements.reps_min.value);
                    newValues.defaultRepsMax = parseInt(form.elements.reps_max.value);
                }
                
                if (exercise.defaultTempo) {
                    newValues.defaultTempo = {
                        up: parseInt(form.elements.tempo_up.value),
                        hold: parseInt(form.elements.tempo_hold.value),
                        down: parseInt(form.elements.tempo_down.value)
                    };
                }
                updateExerciseInstanceInWorkout(slotId, exercise.instanceId, newValues);
                modal.classList.add('modal-hidden');
                openWorkoutEditorModal(returnIsoDate);
            };
        }

        saveBtn.replaceWith(saveBtn.cloneNode(true));
        document.getElementById('exercise-editor-save-btn').addEventListener('click', saveHandler, { once: true });
        modal.classList.remove('modal-hidden');
      }
  - file: src/core/trainer/state.js
    content: |
      const initialWorkoutState = {
        workoutDate: null,
        exerciseQueue: [], // The original plan of exercises
        fullExecutionQueue: [], // The single queue for the whole workout
        currentQueueIndex: 0,
        status: 'idle', // idle, running, paused, finished
        phaseTimeElapsed: 0,
        lastTimerDuration: 0, // Stores the actual elapsed time from the last timer animation
        startTime: 0,
        setsData: [], // Array to store data for each completed set
        isAudioEnabled: true,
        resolveCurrentSetPromise: null, // Promise resolver per la modalità logging
      };

      let workoutState = { ...initialWorkoutState };

      export function getWorkoutState() {
        return workoutState;
      }

      export function updateState(newState) {
        workoutState = { ...workoutState, ...newState };
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function resetState() {
        // Mutate the existing object to ensure all references are updated,
        // and explicitly clear arrays/objects to prevent old data from persisting.
        Object.assign(workoutState, initialWorkoutState);
        workoutState.exerciseQueue = [];
        workoutState.fullExecutionQueue = [];
        workoutState.setsData = [];
      }
  - file: src/core/trainer/queueBuilder.js
    content: |
      import { getState as getGlobalState } from '../state.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { TEMPO_GUIDED_FLOW, INTRO_FLOW, FINAL_FLOW, REST_FLOW, NEXT_EXERCISE_ANNOUNCEMENT_FLOW } from '../../config/trainerFlows.js';

      function getNestedProperty(obj, path) {
        return path.split('.').reduce((acc, part) => acc && acc[part], obj);
      }

      function interpretTemplate(template, exercise, context) {
        // Use a deep copy of the template to prevent mutation of the original object
        const deepCopiedTemplate = JSON.parse(JSON.stringify(template));
        const queue = [];

        for (const command of deepCopiedTemplate) {
          // The context for this command instance
          const instanceContext = { ...context, exercise };

          if (command.type === 'loop') {
            const loopCount = getNestedProperty(exercise, command.target) || 0;
            for (let i = 0; i < loopCount; i++) {
              const loopContext = { ...context, rep: i + 1 };
              // Recursively call with the actions part of the command
              queue.push(...interpretTemplate(command.actions, exercise, loopContext));
            }
          } else if (command.type === 'conditional') {
            const [prop, value] = command.condition.split(' > ');
            const propValue = getNestedProperty(exercise, prop);
            if (propValue > parseInt(value, 10)) {
              queue.push(...interpretTemplate(command.actions, exercise, context));
            }
          } else {
            // Resolve text keys now, during the build phase
            if (command.text_key) {
              command.text = UI_TEXT[command.text_key] || '';
            }
            if (command.text_value) {
                // Use the instance context to get the correct exercise name
                command.text = `${command.text} ${getNestedProperty(instanceContext.exercise, command.text_value)}`;
            }
            if (command.duration_from) {
              command.duration_ms = (getNestedProperty(exercise, command.duration_from) || 0) * 1000;
            }
            // Add the context to the final command object
            command.context = instanceContext;
            queue.push(command);
          }
        }
        return queue;
      }

      export function buildFullWorkoutQueue(exercisePlan) {
        const fullQueue = [];

        // Add the initial announcement
        if (exercisePlan.length > 0) {
            fullQueue.push(...interpretTemplate(INTRO_FLOW, exercisePlan[0], {}));
        }

        exercisePlan.forEach((exercise, exerciseIndex) => {
          const execution_mode = exercise.execution_mode || 'guided_tempo'; // Default a 'guided_tempo'

          for (let set = 1; set <= exercise.defaultSets; set++) {
            const context = {
              exercise,
              set,
              reps: exercise.defaultReps, // Usato da guided_tempo
              repsMin: exercise.defaultRepsMin, // Usato da logging
              repsMax: exercise.defaultRepsMax, // Usato da logging
              weight: exercise.defaultWeight
            };

            if (execution_mode === 'guided_tempo') {
                fullQueue.push(...interpretTemplate(TEMPO_GUIDED_FLOW, exercise, context));
            } else if (execution_mode === 'guided_static') {
                fullQueue.push({ type: 'static_hold', duration_ms: exercise.defaultDuration * 1000, context });
                fullQueue.push({ type: 'set_completed', context });
            } else if (execution_mode === 'logging') { // Sostituisce 'manual_reps'
                fullQueue.push({ type: 'logging', context }); // Nuova fase 'logging'
                fullQueue.push({ type: 'set_completed', context });
            }

            // Add rest period
            const isLastSetOfExercise = set === exercise.defaultSets;
            const isLastExercise = exerciseIndex === exercisePlan.length - 1;

            if (!isLastSetOfExercise || !isLastExercise) {
                if (exercise.defaultRest > 0) {
                    fullQueue.push(...interpretTemplate(REST_FLOW, exercise, context));
                }
            }

            // Announce next exercise on the last rest before a new one starts
            if (isLastSetOfExercise && !isLastExercise) {
                const nextExercise = exercisePlan[exerciseIndex + 1];
                fullQueue.push(...interpretTemplate(NEXT_EXERCISE_ANNOUNCEMENT_FLOW, nextExercise, {}));
            }
          }
        });

        // Add the final announcement
        fullQueue.push(...interpretTemplate(FINAL_FLOW, exercisePlan[exercisePlan.length -1] || {}, {}));

        const { debugMode } = getGlobalState();
        if (debugMode) {
          console.groupCollapsed(`[Trainer-Queue] Full Workout Execution Queue Built`);
          console.table(fullQueue.map(item => ({...item, text: item.text, context: `Ex: ${item.context?.exercise?.name || 'N/A'} | Set: ${item.context?.set || '-'} | Rep: ${item.context?.rep || '-'}`})));
          console.groupEnd();
        }

        return fullQueue;
      }
  - file: src/core/trainer.js
    content: |
      import { setView, setLastWorkoutSummary, addWorkoutToHistory, getState as getGlobalState } from './state.js';
      import { log } from '../utils/logger.js';
      import { getWorkoutState, resetState, updateState } from './trainer/state.js';
      import { runTimerAnimation, stopAllAnimations } from './trainer/animation.js';
      import { buildFullWorkoutQueue } from './trainer/queueBuilder.js';
      import { calculateWorkoutCalories } from './calculations.js';
      import { speak, playStartCue, playTick } from '../utils/audioFeedback.js';
      import { UI_TEXT } from '../config/uiText.js';

      // This is the "Director d'Orchestra"
      async function runWorkoutLoop() {
        const initialState = getWorkoutState();
        if (initialState.status !== 'running') return;

        let i = initialState.currentQueueIndex;

        while (i < initialState.fullExecutionQueue.length) {
            let currentState = getWorkoutState();
            if (currentState.status !== 'running') {
                log('Trainer', 'Workout loop terminated (paused or finished).');
                return;
            }
            
            // Assicura che l'indice dello stato sia aggiornato
            if (i !== currentState.currentQueueIndex) {
              i = currentState.currentQueueIndex;
            }

            updateState({ currentQueueIndex: i });
            const phase = currentState.fullExecutionQueue[i];

            log('Trainer-Loop', `Executing phase ${i}:`, phase.type);

            switch (phase.type) {
                case 'speech':
                    if (getWorkoutState().isAudioEnabled && phase.text) {
                        if(phase.await) await speak(phase.text);
                        else speak(phase.text);
                    }
                    break;
                case 'audio':
                    if (getWorkoutState().isAudioEnabled) {
                        if (phase.cue === 'tick') playTick();
                    }
                    break;
                case 'movement':
                case 'rest':
                case 'static_hold':
                    await runTimerAnimation(phase.duration_ms);
                    break;
                case 'set_completed':
                    // Per le modalità guidate, raccoglie i dati pianificati
                    collectSetData();
                    break;
                case 'logging':
                    // Pausa il loop e attende la conferma manuale dalla UI
                    await new Promise(resolve => {
                        updateState({ resolveCurrentSetPromise: resolve });
                    });
                    // Quando la promise si risolve (tramite confirmCurrentSet),
                    // i dati sono GIÀ stati raccolti da confirmCurrentSet.
                    break;
            }
            
            // Avanza all'indice successivo solo se lo stato è ancora 'running'
            // Questo previene un doppio incremento se `skipPhase` è stato chiamato
            if (getWorkoutState().status === 'running' && getWorkoutState().currentQueueIndex === i) {
              i++;
            }
        }
        
        // Se il loop completa naturalmente, termina l'allenamento
        if (getWorkoutState().status === 'running') {
            endWorkout();
        }
      }

      export function resetWorkoutState() {
        log('Trainer', 'Resetting workout state.');
        stopAllAnimations();
        resetState();
      }

      export function initializeWorkout(plannedExercises, isoDate) {
        if (!plannedExercises || plannedExercises.length === 0) {
            return;
        }
        resetWorkoutState();

        const fullExecutionQueue = buildFullWorkoutQueue(plannedExercises);

        const initialState = {
            workoutDate: isoDate,
            exerciseQueue: JSON.parse(JSON.stringify(plannedExercises)),
            fullExecutionQueue: fullExecutionQueue,
            currentQueueIndex: 0,
            status: 'idle',
            startTime: 0,
            setsData: []
        };
        updateState(initialState);
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function collectSetData(setDataFromUI = null) {
          const state = getWorkoutState();
          const currentPhase = state.fullExecutionQueue[state.currentQueueIndex];
          if (!currentPhase || !currentPhase.context) return;

          const { exercise, set } = currentPhase.context;

          let setData;
          if (setDataFromUI) {
            // Modalità Logging: Dati arrivano dalla UI
            setData = {
              exerciseId: exercise.instanceId,
              set: set,
              reps: setDataFromUI.reps,
              duration: 0, // La modalità logging non è basata sul tempo
              rest: exercise.defaultRest,
              weight: setDataFromUI.weight,
              to_failure: setDataFromUI.to_failure || false
            };
          } else {
            // Modalità Guidata: Dati arrivano dal context (piano)
            setData = {
              exerciseId: exercise.instanceId,
              set: set,
              reps: currentPhase.context.reps, // Reps pianificate
              duration: state.lastTimerDuration || 0, // Durata dall'animation engine
              rest: exercise.defaultRest,
              weight: currentPhase.context.weight || 0
            };
          }

          const newSetsData = [...state.setsData, setData];
          updateState({ setsData: newSetsData, lastTimerDuration: 0 }); // Resetta lastTimerDuration
          log('Trainer', 'Set data collected', { setData });
      }

      export async function startWorkout() {
        const state = getWorkoutState();
        log('Interactions', 'Start workout button clicked', { date: state.workoutDate });
        if (state.status !== 'idle') return;

        if (getWorkoutState().isAudioEnabled) {
            playStartCue();
        }

        // Small delay to allow the sound cue to play before any potential UI lag
        await new Promise(resolve => setTimeout(resolve, 50));
        
        if (getWorkoutState().status !== 'idle') {
            log('Trainer', 'Workout start aborted, status changed during start cue.');
            return;
        }

        updateState({ status: 'running', startTime: Date.now() });
        runWorkoutLoop(); // Start the master loop
        log('Trainer', 'Workout started.');
      }

      export function pauseWorkout() {
        const state = getWorkoutState();
        if (state.status === 'running') {
            updateState({ status: 'paused' });
            log('Trainer', 'Workout paused.');
        }
      }

      export function resumeWorkout() {
        const state = getWorkoutState();
        if (state.status === 'paused') {
            updateState({ status: 'running' });
            log('Trainer', 'Workout resumed.');
            // Il loop `runWorkoutLoop` riprenderà automaticamente
            // perché `state.status` è di nuovo 'running'.
            // Ma se era in attesa di una promise (animazione),
            // l'animazione riprenderà da sola.
            // Se era in attesa della promise `logging`,
            // non fa nulla finché l'utente non conferma.
            // Se era tra le fasi, il loop `while` riprende.
            // Per sicurezza, se non è in attesa di nulla, facciamo ripartire il loop.
            if (!state.resolveCurrentSetPromise) {
              runWorkoutLoop();
            }
        }
      }

      export function confirmCurrentSet(setDataFromUI) {
          const state = getWorkoutState();
          if (state.status !== 'running') return;

          // Raccogli i dati del set appena completato
          collectSetData(setDataFromUI);

          // Sblocca il `runWorkoutLoop` che è in `await`
          if (state.resolveCurrentSetPromise) {
              state.resolveCurrentSetPromise();
              updateState({ resolveCurrentSetPromise: null });
          }
      }

      export function skipPhase(direction = 1) {
          stopAllAnimations(); // Interrompe qualsiasi timer (es. riposo)
          const state = getWorkoutState();
          if (state.status !== 'running') return;

          log('Trainer', 'Skipping phase', { direction });

          // Se siamo in attesa di conferma set, sblocca la promise
          if (state.resolveCurrentSetPromise) {
              log('Trainer', 'Skipping an awaiting set confirmation');
              state.resolveCurrentSetPromise();
              updateState({ resolveCurrentSetPromise: null });
          }

          let newIndex = state.currentQueueIndex + direction;

          // Logica per saltare al prossimo *set* o *esercizio*
          // In modalità guidata, potremmo voler saltare alla prossima fase "importante"
          // Per ora, saltiamo solo alla fase successiva/precedente
          
          if (newIndex >= state.fullExecutionQueue.length) {
              endWorkout(); // Se skippiamo l'ultima fase, finisce l'allenamento
          } else if (newIndex < 0) {
              newIndex = 0; // Non andare prima dell'inizio
              updateState({ currentQueueIndex: newIndex });
          } else {
              updateState({ currentQueueIndex: newIndex });
          }
      }


      function createWorkoutSummary(finalState) {
          const totalTime = Date.now() - finalState.startTime;
          let totalTonnage = 0;

          const exercisesWithDetails = finalState.exerciseQueue.map(exercise => {
              const setsForThisExercise = finalState.setsData.filter(d => d.exerciseId === exercise.instanceId);
              const setsCompleted = setsForThisExercise.length;
              const totalExerciseTime = setsForThisExercise.reduce((acc, set) => acc + (set.duration || 0), 0);
              const exerciseTonnage = setsForThisExercise.reduce((acc, set) => acc + ((set.reps || 0) * (set.weight || 0)), 0);
              totalTonnage += exerciseTonnage;

              return {
                  ...exercise,
                  setsCompleted: setsCompleted,
                  setsData: setsForThisExercise,
                  totalTime: totalExerciseTime,
                  tonnage: exerciseTonnage
              };
          });

          const totalSets = exercisesWithDetails.reduce((acc, ex) => acc + ex.setsCompleted, 0);
          const totalExerciseTime = exercisesWithDetails.reduce((acc, ex) => acc + ex.totalTime, 0);
          const totalRestTime = finalState.setsData.reduce((acc, set) => acc + (set.rest || 0) * 1000, 0);

          const summary = {
              date: finalState.workoutDate,
              totalTime,
              totalSets,
              totalExerciseTime,
              totalRestTime,
              totalTonnage,
              exercises: exercisesWithDetails,
              startTime: finalState.startTime,
              totalCaloriesBurned: 0
          };

          const globalState = getGlobalState();
          const latestWeight = globalState.biometricData.length > 0 ? globalState.biometricData[0].weight : null;
          if (latestWeight) {
            summary.totalCaloriesBurned = calculateWorkoutCalories(summary, latestWeight);
          }

          return summary;
      }

      export function endWorkout() {
        const finalState = getWorkoutState();
        if (finalState.status === 'finished') {
            log('Trainer', 'Workout already finished, not saving again.');
            return;
        }
        stopAllAnimations();
        updateState({ status: 'finished' });

        if (finalState.startTime === 0) {
            log('Trainer', 'Workout ended prematurely, not saving summary.');
            setView('planner');
            return;
        }
        const summary = createWorkoutSummary(finalState);
        setLastWorkoutSummary(summary);
        addWorkoutToHistory(summary);

        setView('debriefing');
      }

      export function discardWorkout() {
        log('Trainer', 'Discarding workout.');
        stopAllAnimations();
        resetWorkoutState();
        setView('planner');
      }