commit_message: "refactor(UX): Sostituisce modifica log allenamento con editor per singolo esercizio"
rationale: |
  In risposta al feedback diretto dell'utente, questo commit migliora radicalmente l'esperienza di modifica degli allenamenti registrati. L'approccio precedente, basato su un modale generico per l'intera sessione, è stato rimosso in favore di un flusso di lavoro più intuitivo e granulare.

  1.  **Rimozione del Modale Globale**: Il file `workoutLogEditorModal.js` e il relativo HTML sono stati eliminati. Questo riduce la complessità e rimuove un componente la cui interfaccia non era allineata con il design system dell'applicazione (uso di `<legend>`, layout non ottimale).

  2.  **Introduzione dell'Editing per Esercizio**:
      * Nella vista "Log", ogni esercizio registrato ora presenta una propria icona "Modifica". Questo permette all'utente di agire direttamente sull'elemento che intende correggere.
      * È stato creato un nuovo modale, `logged-exercise-editor-modal`, stilisticamente coerente con il resto dell'UI. Questo modale è focalizzato sulla modifica dei dati di un singolo esercizio (serie, ripetizioni, peso).

  3.  **Logica di Modifica Intelligente**:
      * Il nuovo modale mostra dinamicamente i campi di input, presentando il campo "peso" solo per gli esercizi che lo prevedono, evitando confusione per gli esercizi a corpo libero.
      * È stata implementata una nuova funzione nello stato (`updateExerciseSetsInHistory`) che, dopo la modifica, ricalcola automaticamente e in modo corretto il tonnellaggio sia per il singolo esercizio che per il totale dell'allenamento, garantendo la coerenza dei dati.

  Questo refactoring non solo risolve i problemi estetici e di usabilità segnalati, ma rende anche l'applicazione più robusta e semplice da manutenere, riutilizzando componenti e flussi già familiari all'utente.
