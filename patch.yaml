commit_message: "feat(debug): Generalizza il sistema di logging e aggiorna la documentazione"
rationale: |
  Questo commit estende il sistema di debug a tutta l'applicazione per renderlo uno strumento di sviluppo sistematico, come da strategia approvata.

  Le modifiche principali sono:

  1.  **Integrazione del Logger nei Moduli Chiave:**
      * Sono stati aggiunti punti di log strategici nei seguenti moduli per tracciare le azioni principali dell'utente e i cambi di stato:
          * `src/core/state.js`: Per monitorare le modifiche allo stato globale (es. cambio di vista, aggiornamenti del piano).
          * `src/ui/modals.js`: Per tracciare l'apertura delle modali principali.
          * `src/ui/interactions.js`: Per registrare le interazioni fondamentali dell'utente (click sui bottoni di navigazione, azioni sul planner).

  2.  **Aggiornamento della Documentazione Architetturale (`docs/02_ARCHITECTURE.md`):**
      * È stata aggiunta una nuova sezione "7. Strategia di Sviluppo e Debug" alla documentazione.
      * Questa sezione formalizza l'uso della `debugMode`, del logger centralizzato (`src/utils/logger.js`) e delle convenzioni di logging, trasformando il nostro approccio al troubleshooting in una pratica standard per l'intero progetto.

  Queste modifiche non alterano la funzionalità dell'applicazione ma ne aumentano notevolmente la manutenibilità e la trasparenza, facilitando l'identificazione e la risoluzione di problemi futuri.
patches:
  - file: docs/02_ARCHITECTURE.md
    content: |
      # Architettura: HealtyPro (ex NutriPlan)

      ## 1. Principi Guida
      * **PWA-First:** L'applicazione è progettata per essere installabile e funzionare offline.
      * **Minimalism & Simplicity (KISS):** L'interfaccia utente è essenziale e intuitiva, basata su Vanilla JS.
      * **Data-Driven & Convention over Configuration:** La logica di business è definita in file di configurazione remoti. L'applicazione si basa su convenzioni di struttura: dato l'URL di `pasti.json`, deduce automaticamente i percorsi per `ingredienti.json` (stessa directory), `esercizi.json` (stessa directory) e per le ricette (sottodirectory `ricette/`).
      * **Maintainability (SRP):** Ogni modulo ha una singola, chiara responsabilità.

      ## 2. Architettura SPA Multi-Vista
      L'applicazione è una **Single Page Application (SPA)**. Un singolo `index.html` contiene i contenitori per ogni vista, e la logica in `renderer.js` gestisce quale vista mostrare in base allo stato.

      ## 3. Architettura PWA
      * **`manifest.json`**: Fornisce i metadati per l'installazione.
      * **`sw.js` (Service Worker)**: Mette in cache l' "app shell" per il funzionamento offline.

      ## 4. Logica di Business
      ### 4.1. Workout Builder Composizionale
      A differenza di un approccio a piani fissi, HealtyPro adotta un modello composizionale. L'utente costruisce la propria sessione di allenamento giorno per giorno aggiungendo esercizi individuali da una libreria. Questo offre massima flessibilità e allinea l'esperienza utente a quella della pianificazione pasti.

      ### 4.2. Modalità di Esecuzione e Ciclo di Ripetizione (Vista Trainer)
      La Vista Trainer opera in diverse modalità a seconda delle proprietà dell'esercizio caricato. Questo garantisce un'esperienza utente flessibile e adatta a diversi tipi di allenamento. La modalità viene scelta in base a un campo `execution_mode` nell'oggetto dell'esercizio.

      #### Modalità 1: `tempo_guided` (Default)
      Per garantire un'esperienza utente guidata e prevenire movimenti affrettati, il modulo Trainer implementa un ciclo di esecuzione dettagliato per ogni singola ripetizione di un esercizio basato sul `tempo`. Questo ciclo è "pre-compilato" in una coda di esecuzione prima dell'inizio di ogni serie.

      Ogni ripetizione è suddivisa in 6 fasi:
      1.  **`pre-up`**: Una fase di preparazione di durata fissa (es. 0.7s). L'UI (es. "time ring") lampeggia e mostra il nome della fase successiva ("UP").
      2.  **`up`**: La fase concentrica (salita). La sua durata è letta da `tempo.up`. L'UI mostra un'animazione fluida.
      3.  **`pre-hold`**: Fase di preparazione (0.7s). L'UI lampeggia e mostra "HOLD".
      4.  **`hold`**: La fase isometrica (pausa). La sua durata è letta da `tempo.hold`.
      5.  **`pre-down`**: Fase di preparazione (0.7s). L'UI lampeggia e mostra "DOWN".
      6.  **`down`**: La fase eccentrica (discesa). La sua durata è letta da `tempo.down`.

      #### Modalità 2: `static_hold`
      Utilizzata per esercizi isometrici come il Plank. L'interfaccia mostra un unico timer centrale che esegue un countdown per la durata totale della serie. Se l'esercizio è configurato per essere eseguito "a sfinimento", il timer diventa un cronometro che conta in avanti.

      #### Modalità 3: `manual_reps`
      Utilizzata per serie "a sfinimento" o con un range di ripetizioni (min/max). L'interfaccia non mostra un timer, ma un contatore e un pulsante principale per permettere all'utente di registrare manualmente ogni ripetizione completata.

      ### 4.3. Calcolo del BMR (`src/core/calculations.js`)
      Logiche complesse come il calcolo del Metabolismo Basale (BMR) sono isolate in questo modulo dedicato.

      ### 4.4. Calcolo delle Calorie (`src/core/calorieCalculator.js`)
      Questo modulo ha la sola responsabilità di calcolare le calorie dei pasti, ricevendo la lista dei pasti e degli ingredienti e arricchendo ogni pasto con `calories_min` e `calories_max`.

      ## 5. Gestione dei Dati
      ### 5.1. Caricamento Dati (`src/api/configService.js`)
      Il servizio orchestra un caricamento multi-fase per `pasti.json`, `ingredienti.json` e `esercizi.json`.

      ### 5.2. Strutture Dati Chiave
      * **Configurazione Remota**:
          * **`pasti.json`**: Array di oggetti `meals`.
          * **`ingredienti.json`**: Array di `ingredienti`.
          * **`esercizi.json`**: Un array di `esercizi`. Ogni esercizio è un oggetto che definisce le sue proprietà di base (ID, nome, descrizione) e i valori di default per serie, ripetizioni, durata, riposo, `tempo` (un oggetto con `up`, `hold`, `down`) e il nuovo campo opzionale `execution_mode`.

      * **Dati Utente Locali (`localStorage`)**:
          * **`userProfile`**: Dati anagrafici dell'utente.
          * **`weeklyPlan`**: Oggetto che mappa gli slot giornalieri (`YYYY-MM-DD-MealType`) ai pasti pianificati.
          * **`weeklyWorkouts`**: Oggetto che mappa uno slot giornaliero (`YYYY-MM-DD-Allenamento`) a un **array di oggetti esercizio**. Ogni oggetto in questo array è una copia dell'esercizio dalla libreria, arricchito con un `instanceId` univoco per permetterne la gestione individuale.
          * **`biometricData`**: Array con lo storico delle misurazioni biometriche.

      ## 6. Dipendenze di Terze Parti
      * **Marked.js & DOMPurify**: Caricate via CDN per il rendering sicuro delle ricette.
      * **Chart.js**: Caricata via CDN per la visualizzazione dei grafici.
      * **SortableJS**: Caricata via CDN per la gestione del drag-and-drop.

      ## 7. Strategia di Sviluppo e Debug
      Per garantire la manutenibilità e facilitare il troubleshooting, l'applicazione integra un sistema di logging sistematico.

      ### 7.1. Modalità Debug (`debugMode`)
      * Lo stato globale in `src/core/state.js` contiene un flag `debugMode`, impostato di default su `false`.
      * Questo flag può essere attivato o disattivato in qualsiasi momento tramite la console del browser, eseguendo la funzione globale `toggleDebugMode()`. Questo permette di attivare i log solo quando necessario, senza impattare le performance in produzione.

      ### 7.2. Logger Centralizzato (`src/utils/logger.js`)
      * Tutta la logica di logging è centralizzata in un unico modulo. La sua funzione `log()` è l'unico punto di accesso per scrivere messaggi in console.
      * Questa funzione controlla internamente lo stato di `debugMode` e scrive in console solo se è attivo.

      ### 7.3. Convenzioni di Logging
      Per garantire coerenza e leggibilità, tutti i messaggi di log seguono una convenzione standard:
      ```javascript
      log('NomeComponente', 'Azione che sta avvenendo', { datiRilevanti });
      ```
      * **`NomeComponente`**: Indica il modulo di origine (es. 'State', 'Modals', 'Trainer').
      * **`Azione`**: Descrive l'operazione in corso (es. 'Setting new view', 'Opening modal').
      * **`datiRilevanti`**: Un oggetto opzionale che mostra il contesto e i dati relativi all'azione.
  - file: src/core/state.js
    content: |
      import { LOCAL_STORAGE_KEY_PLAN, LOCAL_STORAGE_KEY_URL, MEAL_TYPES, LOCAL_STORAGE_KEY_BIOMETRICS, LOCAL_STORAGE_KEY_PROFILE, LOCAL_STORAGE_KEY_WORKOUTS, WORKOUT_SLOT_ID } from '../utils/constants.js';
      import { processMealsWithCalories } from './calorieCalculator.js';
      import { resetWorkoutState } from './trainer.js';
      import { log } from '../utils/logger.js';

      let state = {
        rules: [],
        masterMealList: [],
        masterWorkoutList: [],
        weeklyPlan: {},
        weeklyWorkouts: {},
        biometricData: [],
        userProfile: {},
        configUrl: '',
        recipeBaseUrl: '',
        focusedDate: new Date(),
        currentView: 'planner', // 'planner', 'log', 'progress', 'charts', 'recipes', 'profile', or 'trainer'
        debugMode: false,
      };

      const notify = () => document.dispatchEvent(new CustomEvent('stateChange'));
      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);

      const getWeekStartDate = (date) => {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
      };

      export const getState = () => ({ ...state });

      export function toggleDebugMode() {
        state.debugMode = !state.debugMode;
        console.log(`%cDebug mode is now ${state.debugMode ? 'ON' : 'OFF'}`, 'color: white; background-color: #ef5350; padding: 4px; border-radius: 4px;');
      }

      export function setPlannerConfig(config, url) {
        log('State', 'Setting new planner config', { url });
        state.rules = config.rules || [];
        const ingredients = config.ingredienti || [];
        const meals = config.meals || [];
        state.masterWorkoutList = config.esercizi || [];

        // Calcola calorie e popola la master list
        state.masterMealList = processMealsWithCalories(meals, ingredients);

        // Deriva e imposta la recipeBaseUrl
        if (url) {
            const baseUrl = new URL(url);
            const recipePath = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf('/')) + '/ricette/';
            state.recipeBaseUrl = `${baseUrl.origin}${recipePath}`;
        } else {
            state.recipeBaseUrl = '';
        }

        notify();
      }

      export function setConfigUrl(url) {
        log('State', 'Setting new config URL', { url });
        state.configUrl = url;
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, url);
        notify();
      }

      export function saveStateToLocalStorage() {
        log('State', 'Saving all application state to localStorage');
        localStorage.setItem(LOCAL_STORAGE_KEY_PLAN, JSON.stringify(state.weeklyPlan));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUTS, JSON.stringify(state.weeklyWorkouts));
        localStorage.setItem(LOCAL_STORAGE_KEY_BIOMETRICS, JSON.stringify(state.biometricData));
        localStorage.setItem(LOCAL_STORAGE_KEY_PROFILE, JSON.stringify(state.userProfile));
      }

      export function loadStateFromLocalStorage() {
        log('State', 'Loading all application state from localStorage');
        const plan = localStorage.getItem(LOCAL_STORAGE_KEY_PLAN);
        const workouts = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUTS);
        const url = localStorage.getItem(LOCAL_STORAGE_KEY_URL);
        const biometrics = localStorage.getItem(LOCAL_STORAGE_KEY_BIOMETRICS);
        const profile = localStorage.getItem(LOCAL_STORAGE_KEY_PROFILE);

        if (plan) { try { state.weeklyPlan = JSON.parse(plan); } catch (e) { console.error("Error parsing weeklyPlan", e); state.weeklyPlan = {}; } }
        if (workouts) { try { state.weeklyWorkouts = JSON.parse(workouts); } catch (e) { console.error("Error parsing weeklyWorkouts", e); state.weeklyWorkouts = {}; } }
        if (url) { state.configUrl = url; }
        if (biometrics) { try { state.biometricData = JSON.parse(biometrics); } catch (e) { console.error("Error parsing biometricData", e); state.biometricData = []; } }
        if (profile) { try { state.userProfile = JSON.parse(profile); } catch (e) { console.error("Error parsing userProfile", e); state.userProfile = {}; } }
      }

      export function setAppState(backupData) {
        log('State', 'Restoring application state from backup');
        state.weeklyPlan = backupData.weeklyPlan || {};
        state.weeklyWorkouts = backupData.weeklyWorkouts || {};
        state.configUrl = backupData.configUrl || '';
        state.biometricData = backupData.biometricData || [];
        state.userProfile = backupData.userProfile || {};
        saveStateToLocalStorage();
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, state.configUrl);
        notify();
      }

      export function saveUserProfile(profile) {
        log('State', 'Saving user profile', { profile });
        state.userProfile = profile;
        saveStateToLocalStorage();
        notify();
      }

      export function addOrUpdateBiometricEntry(entry) {
        log('State', 'Adding or updating biometric entry', { entry });
        const index = state.biometricData.findIndex(e => e.date === entry.date);
        if (index > -1) {
          state.biometricData[index] = entry;
        } else {
          state.biometricData.push(entry);
        }
        state.biometricData.sort((a, b) => new Date(b.date) - new Date(a.date));
        saveStateToLocalStorage();
        notify();
      }

      export function deleteBiometricEntry(date) {
        log('State', 'Deleting biometric entry', { date });
        state.biometricData = state.biometricData.filter(e => e.date !== date);
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyPlan(slotId, mealId) {
        log('State', 'Updating weekly plan', { slotId, mealId });
        if (mealId) {
          const meal = state.masterMealList.find(m => m.id === mealId);
          if (meal) {
            state.weeklyPlan[slotId] = { ...meal };
          }
        } else {
          delete state.weeklyPlan[slotId];
        }
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyWorkout(slotId, exerciseId, instanceId = null) {
        log('State', 'Updating weekly workout', { slotId, exerciseId, instanceId });
          if (!state.weeklyWorkouts[slotId]) {
              state.weeklyWorkouts[slotId] = [];
          }

          if (exerciseId) { // Add an exercise
              const exercise = state.masterWorkoutList.find(ex => ex.id === exerciseId);
              if (exercise) {
                  const newExerciseInstance = {
                      ...exercise,
                      instanceId: Date.now() // Unique ID for this specific instance
                  };
                  state.weeklyWorkouts[slotId].push(newExerciseInstance);
              }
          } else if (instanceId) { // Remove an exercise
              state.weeklyWorkouts[slotId] = state.weeklyWorkouts[slotId].filter(ex => ex.instanceId !== instanceId);
              if (state.weeklyWorkouts[slotId].length === 0) {
                  delete state.weeklyWorkouts[slotId];
              }
          }
          saveStateToLocalStorage();
          notify();
      }

      export function updateExerciseInstanceInWorkout(slotId, instanceId, newValues) {
        log('State', 'Updating exercise instance in workout', { slotId, instanceId, newValues });
          if (!state.weeklyWorkouts[slotId]) return;

          const workoutList = state.weeklyWorkouts[slotId];
          const exerciseIndex = workoutList.findIndex(ex => ex.instanceId === instanceId);

          if (exerciseIndex > -1) {
              const updatedExercise = { ...workoutList[exerciseIndex], ...newValues };
              // Ensure tempo is handled as an object
              if (newValues.defaultTempo) {
                  updatedExercise.defaultTempo = { ...workoutList[exerciseIndex].defaultTempo, ...newValues.defaultTempo };
              }
              workoutList[exerciseIndex] = updatedExercise;
              saveStateToLocalStorage();
              notify();
          }
      }

      export function reorderWorkoutExercises(slotId, oldIndex, newIndex) {
        log('State', 'Reordering workout exercises', { slotId, oldIndex, newIndex });
          if (!state.weeklyWorkouts[slotId] || oldIndex === newIndex) return;
          const workoutList = state.weeklyWorkouts[slotId];
          const [movedItem] = workoutList.splice(oldIndex, 1);
          workoutList.splice(newIndex, 0, movedItem);
          saveStateToLocalStorage();
          notify();
      }

      export function resetCurrentWeek() {
        log('State', 'Resetting current week');
        const weekStart = getWeekStartDate(state.focusedDate);
        for (let i = 0; i < 7; i++) {
            const date = new Date(weekStart);
            date.setDate(date.getDate() + i);
            const isoDate = toISODateString(date);
            MEAL_TYPES.forEach(mealType => {
                const slotId = `${isoDate}-${mealType}`;
                if (state.weeklyPlan[slotId]) {
                    delete state.weeklyPlan[slotId];
                }
            });
            const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
            if (state.weeklyWorkouts[workoutSlotId]) {
                delete state.weeklyWorkouts[workoutSlotId];
            }
        }
        saveStateToLocalStorage();
        notify();
      }

      export function navigateWeek(direction) {
        log('State', 'Navigating week', { direction });
        const newDate = new Date(state.focusedDate);
        newDate.setDate(newDate.getDate() + (direction * 7));
        state.focusedDate = newDate;
        notify();
      }

      export function setView(view) {
        log('State', 'Setting new view', { newView: view, oldView: state.currentView });
        if (['planner', 'log', 'progress', 'profile', 'charts', 'recipes', 'trainer'].includes(view)) {
          state.currentView = view;
          notify();
        }
      }

      export function copyPreviousWeek() {
        log('State', 'Copying previous week');
        const currentWeekStart = getWeekStartDate(state.focusedDate);
        const prevWeekStart = new Date(currentWeekStart);
        prevWeekStart.setDate(prevWeekStart.getDate() - 7);

        for (let i = 0; i < 7; i++) {
          const sourceDate = new Date(prevWeekStart);
          sourceDate.setDate(sourceDate.getDate() + i);
          const sourceISO = toISODateString(sourceDate);

          const destDate = new Date(currentWeekStart);
          destDate.setDate(destDate.getDate() + i);
          const destISO = toISODateString(destDate);

          MEAL_TYPES.forEach(mealType => {
            const sourceSlotId = `${sourceISO}-${mealType}`;
            const destSlotId = `${destISO}-${mealType}`;
            const mealObject = state.weeklyPlan[sourceSlotId];

            if (mealObject) {
              state.weeklyPlan[destSlotId] = { ...mealObject };
            } else {
              delete state.weeklyPlan[destSlotId];
            }
          });

          const sourceWorkoutSlot = `${sourceISO}-${WORKOUT_SLOT_ID}`;
          const destWorkoutSlot = `${destISO}-${WORKOUT_SLOT_ID}`;
          const workoutList = state.weeklyWorkouts[sourceWorkoutSlot];
          if (workoutList && Array.isArray(workoutList)) {
              state.weeklyWorkouts[destWorkoutSlot] = JSON.parse(JSON.stringify(workoutList)); // Deep copy
          } else {
              delete state.weeklyWorkouts[destWorkoutSlot];
          }
        }
        saveStateToLocalStorage();
        notify();
      }
  - file: src/ui/interactions.js
    content: |
      import {
        resetCurrentWeek, setPlannerConfig, setConfigUrl, navigateWeek, setView,
        copyPreviousWeek, getState, setAppState, addOrUpdateBiometricEntry,
        deleteBiometricEntry, saveUserProfile
      } from '../core/state.js';
      import { calculateBMR } from '../core/calculations.js';
      import { fetchAndParseConfig } from '../api/configService.js';
      import { showNotification } from './notifications.js';
      import { openDayEditorModal, showConfirmModal, showRecipeModal } from './modals.js';
      import { UI_TEXT } from '../utils/constants.js';
      import { log } from '../utils/logger.js';

      async function handleLoadConfig() {
        log('Interactions', 'Handling config load button click');
        const url = document.getElementById('config-url-input').value.trim();
        if (!url) { showNotification(UI_TEXT.CONFIG_URL_EMPTY_ERROR, 'error'); return; }
        setConfigUrl(url);
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config);
          showNotification(UI_TEXT.CONFIG_LOAD_SUCCESS, 'success');
        } catch (error) { showNotification(error.message, 'error'); }
      }

      function handleCalendarClick(e) {
        const dayCell = e.target.closest('.day-cell');
        if (dayCell) {
          log('Interactions', 'Calendar cell clicked', { date: dayCell.dataset.date });
          openDayEditorModal(dayCell.dataset.date);
        }
      }

      function handleRecipeClick(e) {
        const recipeItem = e.target.closest('.recipe-list-item');
        if (recipeItem) {
          const state = getState();
          const meal = state.masterMealList.find(m => m.id === recipeItem.dataset.mealId);
          if (meal) {
            log('Interactions', 'Recipe list item clicked', { mealId: meal.id });
            showRecipeModal(meal);
          }
        }
      }

      function handleLogViewClick(e) {
        const btnRecipe = e.target.closest('.btn-view-recipe');
        if (btnRecipe) {
          const state = getState();
          const meal = state.masterMealList.find(m => m.id === btnRecipe.dataset.mealId);
          if (meal) {
            log('Interactions', 'Recipe button in log view clicked', { mealId: meal.id });
            showRecipeModal(meal);
          }
        }
      }

      function handleShareConfig() {
        log('Interactions', 'Share config button clicked');
        const state = getState();
        if (!state.configUrl) { showNotification(UI_TEXT.SHARE_NO_URL_INFO, 'info'); return; }
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?configUrl=${encodeURIComponent(state.configUrl)}`;
        navigator.clipboard.writeText(shareUrl).then(() => {
          showNotification(UI_TEXT.SHARE_SUCCESS, 'success');
        }).catch(() => { showNotification(UI_TEXT.SHARE_ERROR, 'error'); });
      }

      function triggerDownload(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification(UI_TEXT.BACKUP_SUCCESS, 'success');
      }

      async function handleSaveBackup() {
        log('Interactions', 'Save backup button clicked');
        const state = getState();
        const backupData = {
          configUrl: state.configUrl,
          weeklyPlan: state.weeklyPlan,
          biometricData: state.biometricData,
          userProfile: state.userProfile
        };
        const fileName = 'healtypro_backup.txt';
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'text/plain' });
        const file = new File([blob], fileName, { type: 'text/plain' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ title: UI_TEXT.BACKUP_SHARE_TITLE, files: [file] });
          } catch (error) {
            if (error.name !== 'AbortError') {
              console.warn('Web Share API failed, falling back to download:', error);
              triggerDownload(blob, fileName);
            }
          }
        } else { triggerDownload(blob, fileName); }
      }

      function handleRestoreBackup() {
          log('Interactions', 'Restore backup button clicked');
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.json,.txt,application/json,text/plain';
          fileInput.onchange = e => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = readerEvent => {
                  try {
                      const content = readerEvent.target.result;
                      const backupData = JSON.parse(content);
                      if (typeof backupData.configUrl === 'string' && typeof backupData.weeklyPlan === 'object') {
                          showConfirmModal(
                              UI_TEXT.RESTORE_CONFIRM_TITLE,
                              UI_TEXT.RESTORE_CONFIRM_MSG,
                              () => { setAppState(backupData); showNotification(UI_TEXT.RESTORE_SUCCESS, 'success'); },
                              'danger'
                          );
                      } else { throw new Error('Invalid structure'); }
                  } catch (err) { showNotification(UI_TEXT.RESTORE_INVALID_FILE, 'error'); }
              };
              reader.readAsText(file);
          };
          fileInput.click();
      }

      function handleCopyWeek() {
        log('Interactions', 'Copy week button clicked');
        showConfirmModal(
          UI_TEXT.COPY_WEEK_CONFIRM_TITLE, UI_TEXT.COPY_WEEK_CONFIRM_MSG,
          () => { copyPreviousWeek(); showNotification(UI_TEXT.COPY_WEEK_SUCCESS, 'success'); }, 'primary'
        );
      }

      function handleResetWeek() {
        log('Interactions', 'Reset week button clicked');
        showConfirmModal(
          UI_TEXT.RESET_WEEK_CONFIRM_TITLE, UI_TEXT.RESET_WEEK_CONFIRM_MSG,
          () => { resetCurrentWeek(); showNotification(UI_TEXT.RESET_WEEK_SUCCESS, 'info'); }, 'danger'
        );
      }

      function handleBiometricsForm(e) {
        e.preventDefault();
        log('Interactions', 'Biometrics form submitted');
        const formData = new FormData(e.target);
        const entry = {};
        for (let [key, value] of formData.entries()) { entry[key] = value; }
        addOrUpdateBiometricEntry(entry);
        showNotification(UI_TEXT.BIOMETRICS_SAVE_SUCCESS, 'success');
        e.target.reset();
        document.getElementById('bio-date').value = new Date().toISOString().slice(0, 10);
      }

      function handleBiometricsListClick(e) {
        const btnMenu = e.target.closest('.btn-actions-menu');
        if (btnMenu) {
            log('Interactions', 'Biometrics actions menu toggled');
            const dropdown = btnMenu.nextElementSibling;
            const allDropdowns = document.querySelectorAll('.actions-dropdown');
            allDropdowns.forEach(d => { if (d !== dropdown) d.classList.remove('show'); });
            dropdown.classList.toggle('show');
            return;
        }

        const btnEdit = e.target.closest('.btn-edit-biometrics');
        if (btnEdit) {
            const date = btnEdit.dataset.date;
            log('Interactions', 'Edit biometrics button clicked', { date });
            const entry = getState().biometricData.find(e => e.date === date);
            if (entry) {
                const form = document.getElementById('biometrics-form');
                for (const key in entry) {
                    if (form.elements[key]) { form.elements[key].value = entry[key]; }
                }
                form.scrollIntoView({ behavior: 'smooth' });
            }
            const dropdown = btnEdit.closest('.actions-dropdown');
            if (dropdown) dropdown.classList.remove('show');
            return;
        }

        const btnDelete = e.target.closest('.btn-delete-biometrics');
        if (btnDelete) {
            const date = btnDelete.dataset.date;
            log('Interactions', 'Delete biometrics button clicked', { date });
            showConfirmModal(
                UI_TEXT.BIOMETRICS_DELETE_CONFIRM_TITLE, UI_TEXT.BIOMETRICS_DELETE_CONFIRM_MSG,
                () => { deleteBiometricEntry(date); showNotification(UI_TEXT.BIOMETRICS_DELETE_SUCCESS, 'info'); }, 'danger'
            );
            const dropdown = btnDelete.closest('.actions-dropdown');
            if (dropdown) dropdown.classList.remove('show');
            return;
        }

        // Close dropdown if clicking outside
        if (!e.target.closest('.biometrics-actions')) {
            document.querySelectorAll('.actions-dropdown').forEach(d => d.classList.remove('show'));
        }
      }

      function handleProfileForm(e) {
        e.preventDefault();
        log('Interactions', 'Profile form submitted');
        const formData = new FormData(e.target);
        const profile = {};
        for (let [key, value] of formData.entries()) { profile[key] = value; }
        saveUserProfile(profile);
        showNotification(UI_TEXT.PROFILE_SAVE_SUCCESS, 'success');
      }

      function handleWeightInputChange(e) {
        const weight = e.target.value;
        const { userProfile } = getState();
        const bmrField = document.getElementById('bio-basalMetabolism');
        const bmr = calculateBMR(userProfile, weight);
        if (bmr !== null) {
          bmrField.value = bmr;
        } else {
          bmrField.value = '';
          bmrField.placeholder = UI_TEXT.BIOMETRICS_BMR_PLACEHOLDER;
        }
      }

      export function initializeEventListeners() {
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.biometrics-actions')) {
                document.querySelectorAll('.actions-dropdown').forEach(d => d.classList.remove('show'));
            }
        });
        document.getElementById('backup-btn').addEventListener('click', handleSaveBackup);
        document.getElementById('restore-btn').addEventListener('click', handleRestoreBackup);
        document.getElementById('info-icon').addEventListener('click', () => document.getElementById('info-modal').classList.remove('modal-hidden'));
        document.getElementById('nav-planner').addEventListener('click', () => setView('planner'));
        document.getElementById('nav-progress').addEventListener('click', () => setView('progress'));
        document.getElementById('nav-charts').addEventListener('click', () => setView('charts'));
        document.getElementById('nav-recipes').addEventListener('click', () => setView('recipes'));
        document.getElementById('nav-profile').addEventListener('click', () => setView('profile'));
        document.getElementById('load-config-btn').addEventListener('click', handleLoadConfig);
        document.getElementById('share-config-btn').addEventListener('click', handleShareConfig);
        document.getElementById('calendar-grid').addEventListener('click', handleCalendarClick);
        document.getElementById('log-view').addEventListener('click', handleLogViewClick);
        document.getElementById('recipes-page').addEventListener('click', handleRecipeClick);
        document.getElementById('prev-week-btn').addEventListener('click', () => navigateWeek(-1));
        document.getElementById('next-week-btn').addEventListener('click', () => navigateWeek(1));
        document.getElementById('view-calendar-btn').addEventListener('click', () => setView('planner'));
        document.getElementById('view-log-btn').addEventListener('click', () => setView('log'));
        document.getElementById('copy-week-btn').addEventListener('click', handleCopyWeek);
        document.getElementById('reset-btn').addEventListener('click', handleResetWeek);
        document.getElementById('biometrics-form').addEventListener('submit', handleBiometricsForm);
        document.getElementById('progress-page').addEventListener('click', handleBiometricsListClick);
        document.getElementById('profile-form').addEventListener('submit', handleProfileForm);

        document.getElementById('progress-page').addEventListener('input', e => {
          if (e.target.id === 'bio-weight') { handleWeightInputChange(e); }
        });

        document.querySelectorAll('.modal-close-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            const modalId = e.currentTarget.dataset.target;
            if (modalId) { document.getElementById(modalId).classList.add('modal-hidden'); }
          });
        });
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
          overlay.addEventListener('click', e => { if (e.target === overlay) { overlay.classList.add('modal-hidden'); } });
        });
        document.getElementById('global-alert-close').addEventListener('click', () => { document.getElementById('global-alert').classList.add('hidden'); });
      }
