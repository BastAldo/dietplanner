      }
      .library-item-actions button:hover {
        background-color: rgba(255, 255, 255, 0.1);
      }
      .library-item-actions .btn-edit:hover {
        color: var(--primary-color);
      }
      .library-item-actions .btn-delete:hover {
        color: var(--danger-color);
      }
