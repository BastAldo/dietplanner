    content: |
      <!DOCTYPE html>
      <html lang="it">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Protocollo Dinamico</title>
          <link rel="stylesheet" href="style.css">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
          <script src="src/main.js" type="module" defer></script>
      </head>
      <body>
          <header>
              <h1>🗓️ Protocollo Dinamico</h1>
          </header>
          
          <section class="data-source-container">
              <input type="url" id="csv-url-input" placeholder="URL del tuo file CSV...">
