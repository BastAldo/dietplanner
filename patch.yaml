commit_message: "feat(charts): Trasforma i grafici in una dashboard di analisi interattiva"
rationale: |
  Questo commit rinnova completamente la pagina dei grafici, trasformandola da una semplice visualizzazione statica a una dashboard di analisi interattiva e potente.

  1. **Filtri Temporali**: È stata introdotta la funzionalità più richiesta: la possibilità di filtrare tutti i dati visualizzati per intervalli di tempo predefiniti ("Ultimi 7g", "Ultimi 30g", "Ultimi 90g", "Anno", "Sempre"). Questo permette all'utente di analizzare le proprie performance sia nel breve che nel lungo periodo. La gestione degli eventi è stata isolata nel nuovo file `src/ui/interactions/chartsInteractions.js` per manutenibilità.

  2. **Cruscotto Statistiche Dinamiche**: Sopra i grafici, è stato aggiunto un nuovo cruscotto che mostra le statistiche chiave calcolate dinamicamente in base al periodo selezionato. Vengono visualizzate metriche immediate e di alto valore come la variazione totale del peso e la media di variazione settimanale.

  3. **Nuovo Grafico "Velocità di Variazione"**: È stato aggiunto un nuovo grafico a barre che visualizza la velocità di variazione del peso (kg/settimana). Questo strumento innovativo permette all'utente di identificare immediatamente i periodi di progresso accelerato, di rallentamento o di stallo, offrendo un livello di analisi dei trend senza precedenti.

  4. **Refactoring e Ottimizzazione**: La logica in `src/ui/charts.js` è stata profondamente rivista. Ora, un'unica funzione `renderCharts` orchestra il filtraggio dei dati e il ridisegno di tutti i componenti (statistiche e grafici), garantendo che l'intera dashboard sia sempre sincronizzata con il filtro temporale selezionato dall'utente.
