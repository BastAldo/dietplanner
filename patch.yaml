      /* --- CHARTS PAGE --- */
      .charts-container {
          display: grid;
          grid-template-columns: 1fr;
          gap: 1.5rem;
      }

      .chart-card {
          background-color: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
      }

      .chart-card h4 {
          color: var(--primary-color);
          margin-bottom: 1.5rem;
          text-align: center;
      }

      @media (min-width: 1024px) {
          .charts-container {
              grid-template-columns: repeat(2, 1fr);
          }
      }
