commit_message: "refactor(config): Separa le costanti e centralizza tutti i testi hardcoded"
rationale: |
  Questo commit completa un importante ciclo di refactoring architetturale, mettendo ordine nei dati statici dell'applicazione. L'intervento si è concentrato su due obiettivi principali:

  1.  **Refactoring del file `constants.js`**: Il file monolitico `src/utils/constants.js` è stato scomposto in moduli con responsabilità specifiche per migliorare la chiarezza e la manutenibilità.
      * `src/utils/constants.js` ora contiene solo costanti applicative pure (es. chiavi di localStorage).
      * Una nuova directory `src/config/` è stata creata.
      * `src/config/forms.js` ora ospita le definizioni delle strutture dei form (`PROFILE_FIELDS`, `BIOMETRIC_FIELDS`).
      * `src/config/uiText.js` è diventato l'unica fonte di verità per tutte le stringhe di testo dell'interfaccia utente.

  2.  **Centralizzazione dei Testi Hardcoded**: È stata eseguita una scansione completa della codebase per identificare e rimuovere le stringhe di testo "hardcoded".
      * Messaggi di errore, etichette di grafici e pulsanti precedentemente hardcoded in vari file `.js` e `.html` sono stati astratti e aggiunti a `uiText.js`.
      * Il codice è stato aggiornato per utilizzare le nuove chiavi dall'oggetto `UI_TEXT`, rendendo l'applicazione più facile da manutenere e pronta per una futura internazionalizzazione.

  Infine, il `sw.js` è stato aggiornato per includere i nuovi file nella cache. Questo commit lascia la codebase in uno stato significativamente più organizzato e robusto.
