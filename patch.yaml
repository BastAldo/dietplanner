commit_message: "refactor(state): Isolate UI state into a dedicated object"
rationale: |
  In accordance with the approved architectural improvement plan, this patch refactors the global state management to create a clear separation between application data and UI state.

  **Rationale:**
  Previously, volatile UI state properties (like `currentView` and `lastWorkoutSummary`) were mixed with persistent application data (like `weeklyPlan`, `biometricData`, etc.) at the root level of the state object. This violated the Single Responsibility Principle and could make state management more complex as the application grows.

  **Changes Implemented:**

  1.  **State Restructuring (`src/core/state.js`):** A dedicated `ui` object has been introduced within the main state object. The `currentView` and `lastWorkoutSummary` properties have been moved inside `state.ui`. This centralizes all transient UI-related state in one predictable location.

  2.  **Updating State Setters (`src/core/state.js`):** The `setView` and `setLastWorkoutSummary` functions have been updated internally to write to the new locations (`state.ui.currentView` and `state.ui.lastWorkoutSummary`), while their external function signatures remain unchanged, ensuring no breaking changes for the modules that call them.

  3.  **Updating State Consumers (`src/ui/renderer.js`, `src/ui/pageRenderers.js`):** All modules that directly read the moved properties have been updated to reference their new paths (e.g., `state.ui.currentView`).

  This refactoring improves the architectural integrity of the application, making the state more organized, predictable, and easier to debug, without any changes to the user-facing functionality.
