commit_message: "feat: Riprogetta la pagina Progressi con layout a card responsive"
rationale: |
  Questa patch implementa una riprogettazione completa della sezione 'Progressi' come da piano approvato, abbandonando la vecchia tabella in favore di un layout a card moderno e responsive.

  Le modifiche principali sono:
  1.  **Struttura HTML (`progress.html`)**: La `<table>` è stata sostituita da un contenitore `div` più flessibile.
  2.  **Stili CSS (`progress.css`)**: Sono stati aggiunti nuovi stili per creare un layout a "galleria" scorrevole su mobile e una griglia compatta su desktop, risolvendo i problemi di spaginamento. Le azioni di modifica/cancellazione sono ora in un menu a comparsa più elegante.
  3.  **Logica di Rendering (`pageRenderers.js`)**: La funzione `renderBiometricsPage` è stata riscritta per generare le nuove card al posto delle righe della tabella.
  4.  **Gestione Interazioni (`interactions.js`)**: L'event handler è stato aggiornato per funzionare con la nuova struttura a card e il menu delle azioni, garantendo che la funzionalità di modifica e cancellazione rimanga invariata.
patches:
