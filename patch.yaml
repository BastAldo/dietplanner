commit_message: "feat(core): Implement config sharing via URL parameter"
rationale: |
  This commit introduces the ability for users to share their meal planner configuration by generating a link that contains the URL to their `config.json` file. This enhances collaboration and simplifies setup for new users.

  1.  **Documentation Update**: A new User Story, US-23, has been added to `docs/01_FUNCTIONALITY.md` to formally document this new feature.

  2.  **UI Addition**: A "Condividi Config" button has been added to `index.html` within the calendar controls, providing a clear entry point for the user to access this functionality.

  3.  **Share Logic**: The `src/ui/interactions.js` file now includes a `handleShareConfig` function. This function reads the current `configUrl` from the state, constructs a shareable link with this URL as a query parameter, copies it to the user's clipboard using the `navigator.clipboard` API, and provides feedback with a success notification.

  4.  **Loading Logic**: The application's entry point, `src/main.js`, has been updated. The `init` function now prioritizes the `configUrl` from the URL's query parameters over any locally stored URL. This ensures that visiting a shared link correctly loads the intended configuration.
