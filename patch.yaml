commit_message: "docs: Align with BiohackerHub architecture and macro targets"
rationale: |
  This commit performs a complete overhaul of the application's core documentation to align it with the latest, metadata-rich architecture of the BiohackerHub content repository.

  The previous documentation was obsolete, referring to a monolithic single-file configuration system. These changes describe the current, sophisticated content discovery ecosystem.

  Key Changes:
  - **`docs/01_FUNCTIONALITY.md`**: Added new User Stories (US-34, US-35, US-36) that describe the "Explore" feature, the intelligent import process, and the ability to view protocol details.
  - **`docs/02_ARCHITECTURE.md`**: Replaced the outdated "Data Loading" and "Data Structures" sections with a detailed explanation of the new three-file architecture (`explore.json`, `package-index.json`, `manifest.json`). This now includes a full description of the enriched `manifest.json`, including the new `macroTargets` object, which is crucial for displaying nutritional strategies to the user.
  - **Future Vision**: A dedicated section has been added to `docs/02_ARCHITECTURE.md` to formally document the concept of "Parametric Protocols". It is explicitly stated that this advanced feature is currently on standby, pending further design, as requested.
patches:
  - file: docs/01_FUNCTIONALITY.md
    content: |
      # Funzionalità: HealtyPro (ex NutriPlan)

      ## 1. Visione Generale
      Una web app frontend-only, installabile (PWA), per creare e gestire piani alimentari flessibili per l'intera giornata (colazione, spuntini, pranzo e cena) con conteggio calorico dinamico e regole di validazione personalizzate.

      L'interfaccia utente è stata completamente rinnovata per adottare un design system unificato (ispirato a MTP), con un tema scuro, componenti moderni e un flusso di interazione migliorato per la pianificazione giornaliera.

      ## 2. User Stories
      * **US-1 (Caricamento Dati Legacy):** L'utente può caricare una configurazione da un file `pasti.json` remoto. Questo metodo è mantenuto per la condivisione di piani personali e per il ripristino da backup.
      * **US-2 (Visualizzazione Calendario):** L'utente vede un calendario settimanale "day-centric". Ogni giorno è una card che riassume le informazioni principali (es. calorie totali).
      * **US-3 (Pianificazione via Modale):** L'utente clicca su una card del giorno per aprire un modale di editing centralizzato, dove può gestire tutti i pasti di quella giornata.
      * **US-4 (Validazione Dinamica):** L'utente vuole che l'app applichi le regole definite nel `pasti.json` (es. blocco giornaliero per un certo tag).
      * **US-11 (Cancellazione Pasti):** L'utente può rimuovere un pasto inserito.
      * **US-15 (Layout Mobile Leggibile):** Su mobile, il calendario è una lista di card giornaliere.
      * **US-16 (Conteggio Calorie Flessibile):** L'utente vede il totale calorico per ogni giorno. Le calorie vengono calcolate dinamicamente dall'applicazione basandosi sui dati del file `ingredienti.json`.
      * **US-17 (Installazione):** Come utente, voglio poter installare l'app sulla mia home screen o desktop per un accesso rapido.
      * **US-18 (Uso Offline):** Come utente, voglio poter aprire e usare l'app anche senza connessione internet, dopo averla visitata la prima volta.
      * **US-19 (Chiusura Modale Esterna):** Come utente, voglio poter chiudere qualsiasi modale cliccando sull'area scura esterna ad esso, per un'interazione più rapida.
      * **US-20 (Registro Pasti Settimanale Dettagliato):** Come utente, voglio poter passare a una vista registro per vedere l'elenco di tutti i pasti pianificati, con il dettaglio calorico per singolo pasto e il totale giornaliero.
      * **US-21 (Copia Settimana):** Come utente, voglio poter copiare il piano alimentare della settimana precedente a quella attuale con un solo click per velocizzare la pianificazione.
      * **US-22 (Visualizzazione Ricetta):** Come utente, voglio poter visualizzare la ricetta di un pasto, se disponibile.
      * **US-23 (Condivisione Configurazione Sicura):** Come utente, voglio poter generare un link per condividere il mio `pasti.json`.
      * **US-24 (Backup Dati Locale Flessibile):** Come utente, voglio poter salvare un backup dei miei dati come file di testo (`.txt`).
      * **US-25 (Ripristino da Backup Locale):** Come utente, voglio poter caricare un file di backup (`.txt` o `.json`) precedentemente salvato.
      * **US-26 (Inserimento Dati Biometrici):** Come utente, voglio poter inserire e modificare le mie misurazioni biometriche.
      * **US-27 (Visualizzazione Storico Biometrico):** Come utente, voglio poter visualizzare lo storico delle mie misurazioni biometriche.
      * **US-29 (Profilo Utente):** L'utente può inserire e salvare i suoi dati personali.
      * **US-30 (Navigazione Principale):** L'utente può navigare tra le sezioni principali tramite un menu.
      * **US-31 (Calcolo Automatico BMR):** L'applicazione calcola automaticamente il Metabolismo Basale (BMR) dell'utente.
      * **US-32 (Galleria Ricette):** L'utente può accedere a una pagina che elenca tutti i pasti con ricette disponibili.
      * **US-33 (Dashboard Grafici):** Come utente, voglio poter accedere a una dashboard di grafici per analizzare i miei dati.

      ## 3. Ecosistema di Contenuti
      
      * **US-34 (Scoperta Pacchetti):** Come utente, voglio accedere a una sezione "Esplora" che mi mostri una galleria di pacchetti di contenuti (piani alimentari, programmi di allenamento) curati, con titoli, descrizioni, immagini e tag per aiutarmi a scegliere.
      * **US-35 (Importazione Intelligente):** Come utente, quando trovo un pacchetto che mi interessa, voglio poterlo aggiungere alla mia libreria con un click. L'importazione deve aggiungere solo i nuovi contenuti (pasti, ingredienti, esercizi) senza sovrascrivere o cancellare quelli che ho già creato.
      * **US-36 (Accesso ai Dettagli del Protocollo):** Come utente, per i pacchetti che lo prevedono, voglio poter leggere un documento di "protocollo" (`protocol.md`) che mi spieghi la filosofia, le regole e le strategie del piano alimentare o di allenamento.
      * **US-37 (Visualizzazione Obiettivi Macro):** Come utente, voglio poter vedere una sintesi degli obiettivi nutrizionali di un piano alimentare (es. range calorico, target proteico) direttamente nella card di anteprima nella sezione "Esplora".

  - file: docs/02_ARCHITECTURE.md
    content: |
      # Architettura: HealtyPro (ex NutriPlan)

      ## 1. Principi Guida
      * **PWA-First:** L'applicazione è progettata per essere installabile e funzionare offline.
      * **Minimalism & Simplicity (KISS):** L'interfaccia utente è essenziale e intuitiva, basata su Vanilla JS.
      * **Data-Driven & Convention over Configuration:** La logica di business è definita in file di configurazione remoti.
      * **Maintainability (SRP):** Ogni modulo ha una singola, chiara responsabilità.

      ## 2. Architettura SPA Multi-Vista
      L'applicazione è una **Single Page Application (SPA)**. Un singolo `index.html` contiene i contenitori per ogni vista, e la logica in `renderer.js` gestisce quale vista mostrare in base allo stato.

      ## 3. Architettura PWA
      * **`manifest.json`**: Fornisce i metadati per l'installazione.
      * **`sw.js` (Service Worker)**: Mette in cache l' "app shell" per il funzionamento offline.

      ## 4. Logica di Business

      ### 4.1. Caricamento Dati e Scoperta dei Contenuti
      
      L'applicazione adotta un'architettura ibrida per il caricamento dei dati, separando la configurazione personale dalla scoperta di nuovi contenuti.
      
      * **Configurazione Personale (Legacy)**: L'utente può ancora caricare una configurazione completa tramite un singolo URL a un file `pasti.json`.
      
      * **Ecosistema di Scoperta (Architettura Principale)**: La sezione "Esplora" si basa su un'architettura disaccoppiata ospitata su un repository esterno (es. `BiohackerHub`):
          1.  **`explore.json`**: Un file di "curation" che contiene una semplice lista di ID dei pacchetti da mettere in evidenza.
          2.  **`package-index.json`**: Un indice generato automaticamente che mappa ogni `id` di pacchetto all'URL del suo `manifest.json`. È la fonte di verità per localizzare i contenuti.
          3.  **`manifest.json`**: Ogni pacchetto contiene un manifest auto-descrittivo con tutti i metadati (titolo, descrizione, autore, tags, immagine, obiettivi macro) e i link relativi ai file di contenuto (`pasti.json`, `protocol.md`, etc.).
      
      Il `configService.js` orchestra questo flusso: scarica `explore.json` e `package-index.json`, recupera i `manifest.json` necessari per visualizzare le card "in evidenza", e infine importa i contenuti di un pacchetto tramite un'operazione di "merge intelligente" che non sovrascrive i dati esistenti.

      ### 4.2. Calcolo delle Calorie (`src/core/calorieCalculator.js`)
      Questo modulo ha la sola responsabilità di calcolare le calorie dei pasti.

      ## 5. Gestione dei Dati

      ### 5.1. Strutture Dati Chiave
      
      * **Contenuti Remoti (BiohackerHub)**:
          * **`manifest.json`**: Descrive un singolo pacchetto. Contiene `id`, `title`, `description`, `author`, `version`, `tags`, `image`, `protocolUrl`, `pastiUrl`, `ingredientiUrl`, `eserciziUrl`, e l'oggetto opzionale `macroTargets` per i piani dietetici.
          * **`pasti.json`**: Contiene un array di `meals`.
          * **`ingredienti.json`**: Contiene un array di `ingredienti`.
          * **`esercizi.json`**: Contiene un array di `esercizi`.
      
      * **Dati Utente Locali (`localStorage`)**:
          * **`masterMealList`, `masterIngredientList`, `masterWorkoutList`**: Le librerie personali dell'utente, arricchite (ma non sovrascritte) durante l'importazione.
          * Altre strutture dati: `weeklyPlan`, `userProfile`, etc.

      ## 6. Svolta Futura: Protocolli Parametrici (In Standby)
      
      Abbiamo definito una visione futura per rendere i pacchetti ancora più potenti: trasformarli in **protocolli parametrici**.
      
      L'idea è di permettere a un pacchetto di contenere **formule e regole** che l'applicazione client può usare per calcolare le quantità ottimali in base ai dati biometrici dell'utente (peso, BMR, etc.).
      
      Un `manifest.json` potrebbe contenere una sezione `protocolEngine` come questa:
      
      ```json
      "protocolEngine": {
        "constants": {
          "PROTEIN_PER_KG": 1.9,
          "ACTIVITY_MULTIPLIER": 1.25,
          "CALORIE_DEFICIT": 400
        },
        "formulas": {
          "daily_protein_target": "${user.weight_kg} * ${constants.PROTEIN_PER_KG}"
        },
        "normalizationRules": {
          "petto_pollo": { "type": "step", "value": 50 }
        }
      }
      ```
      
      > **NOTA IMPORTANTE:** Lo sviluppo di questa funzionalità è **attualmente in standby**. Sebbene l'architettura sia stata delineata, la sua implementazione richiede un'ulteriore fase di progettazione approfondita. La priorità attuale è consolidare e standardizzare l'ecosistema di contenuti statici.

      ## 7. Dipendenze di Terze Parti
      * **Marked.js & DOMPurify**: Caricate via CDN per il rendering sicuro delle ricette.
      * **Chart.js**: Caricata via CDN per la visualizzazione dei grafici.
      * **SortableJS**: Caricata via CDN per la gestione del drag-and-drop.