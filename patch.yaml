commit_message: "fix(history): Corregge l'associazione dati e la datazione dello storico allenamenti"
rationale: |
  Questo commit risolve bug critici legati alla persistenza e alla correttezza dei dati nello storico degli allenamenti, basandosi sul feedback dettagliato dell'utente. Le modifiche garantiscono che i dati siano accurati, dettagliati e salvati correttamente.

  Le correzioni principali sono:

  1.  **Datazione Corretta dello Storico**: Il trainer ora riceve e memorizza la data pianificata dell'allenamento (`workoutDate`). Lo storico viene salvato usando questa data, assicurando che un allenamento del lunedì eseguito di martedì venga registrato correttamente sotto lunedì.

  2.  **Tracciamento Robusto per Serie**: È stata introdotta una nuova funzione centralizzata `completeSet` che viene chiamata esattamente al termine di ogni serie. Questa funzione cattura e salva i dati di performance (reps, durata) associandoli in modo inequivocabile all' `instanceId` univoco dell'esercizio. Questo risolve il bug critico che mescolava i dati di esercizi simili.

  3.  **Logica di Riepilogo Affidabile**: La funzione `createWorkoutSummary` è stata riscritta. Ora si basa esclusivamente sui dati granulari e affidabili raccolti dalla funzione `completeSet`, eliminando le stime imprecise e risolvendo il bug che contrassegnava erroneamente l'ultimo esercizio come incompleto.

  4.  **UI Dettagliata e Coerente**: Le viste di Debriefing e Log sono state aggiornate per visualizzare i dati ora corretti, fornendo un riepilogo preciso e veramente utile di ogni allenamento.
