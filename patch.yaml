commit_message: "feat(charts): Aggiunge la struttura e la navigazione per la vista grafici"
rationale: |
  Questo commit introduce le fondamenta per la nuova funzionalità di visualizzazione grafica, come definito nella Fase 1 del piano approvato.

  Sono state apportate le seguenti modifiche strutturali:
  - **Architettura**: È stata aggiunta la libreria Chart.js via CDN in `index.html` per abilitare la renderizzazione dei grafici.
  - **Struttura UI**: Sono stati creati i nuovi file `templates/charts.html` per la vista e `styles/charts.css` per lo stile associato, garantendo la separazione delle responsabilità.
  - **Navigazione**: L'interfaccia principale è stata aggiornata con un nuovo pulsante "Grafici" nell'header, completo di un'icona dedicata aggiunta a `src/ui/icons.js`. La logica di navigazione e gestione dello stato in `src/core/state.js`, `src/ui/renderer.js` e `src/utils/constants.js` è stata estesa per supportare la nuova vista.
  - **Integrazione**: Il `viewLoader` è stato aggiornato per caricare il nuovo template HTML e il Service Worker (`sw.js`) ora mette in cache le nuove risorse per il funzionamento offline.

  Questa implementazione prepara l'applicazione per la Fase 2, dove verrà sviluppata la logica specifica per il rendering dei grafici.
