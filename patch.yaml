    content: |
      import { resetCurrentWeek, setPlannerConfig, setConfigUrl, navigateWeek, setView, copyPreviousWeek, getState, setAppState, addOrUpdateBiometricEntry, deleteBiometricEntry } from '../core/state.js';
      import { fetchAndParseConfig } from '../api/configService.js';
      import { showNotification } from './notifications.js';
      import { openDayEditorModal, showConfirmModal, showRecipeModal } from './renderer.js';
      import { UI_TEXT } from '../utils/constants.js';

      async function handleLoadConfig() {
        const url = document.getElementById('config-url-input').value.trim();
        if (!url) {
          showNotification(UI_TEXT.CONFIG_URL_EMPTY_ERROR, 'error');
          return;
        }
        setConfigUrl(url);
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config);
          showNotification(UI_TEXT.CONFIG_LOAD_SUCCESS, 'success');
        } catch (error) {
          showNotification(error.message, 'error');
        }
      }

      function handleCalendarClick(e) {
        const dayCell = e.target.closest('.day-cell');
        if (dayCell) {
            openDayEditorModal(dayCell.dataset.date);
        }
      }

      function handleLogViewClick(e) {
        const btnRecipe = e.target.closest('.btn-view-recipe');
        if (btnRecipe) {
          const state = getState();
          const meal = state.masterMealList.find(m => m.id === btnRecipe.dataset.mealId);
          if (meal) {
            showRecipeModal(meal);
          }
        }
      }

      function handleShareConfig() {
        const state = getState();
        if (!state.configUrl) {
          showNotification(UI_TEXT.SHARE_NO_URL_INFO, 'info');
          return;
        }
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?configUrl=${encodeURIComponent(state.configUrl)}`;
        
        navigator.clipboard.writeText(shareUrl).then(() => {
          showNotification(UI_TEXT.SHARE_SUCCESS, 'success');
        }).catch(() => {
          showNotification(UI_TEXT.SHARE_ERROR, 'error');
        });
      }

      function triggerDownload(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification(UI_TEXT.BACKUP_SUCCESS, 'success');
      }

      async function handleSaveBackup() {
        const state = getState();
        const backupData = {
          configUrl: state.configUrl,
          weeklyPlan: state.weeklyPlan,
          biometricData: state.biometricData
        };
        const fileName = 'healtypro_backup.txt';
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'text/plain' });
        const file = new File([blob], fileName, { type: 'text/plain' });
        
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({
              title: UI_TEXT.BACKUP_SHARE_TITLE,
              files: [file],
            });
            // La notifica di successo viene mostrata solo se la condivisione non viene abortita
          } catch (error) {
            if (error.name !== 'AbortError') {
              console.warn('Web Share API failed, falling back to download:', error);
              triggerDownload(blob, fileName);
            }
          }
        } else {
          // Fallback per browser desktop o non compatibili
          triggerDownload(blob, fileName);
        }
      }

      function handleRestoreBackup() {
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.json,.txt,application/json,text/plain';
          fileInput.onchange = e => {
              const file = e.target.files[0];
              if (!file) return;

              const reader = new FileReader();
              reader.onload = readerEvent => {
                  try {
                      const content = readerEvent.target.result;
                      const backupData = JSON.parse(content);

                      if (typeof backupData.configUrl === 'string' && typeof backupData.weeklyPlan === 'object') {
                          showConfirmModal(
                              UI_TEXT.RESTORE_CONFIRM_TITLE,
                              UI_TEXT.RESTORE_CONFIRM_MSG,
                              () => {
                                  setAppState(backupData);
                                  showNotification(UI_TEXT.RESTORE_SUCCESS, 'success');
                              },
                              'danger'
                          );
                      } else {
                          throw new Error('Invalid structure');
                      }
                  } catch (err) {
                      showNotification(UI_TEXT.RESTORE_INVALID_FILE, 'error');
                  }
              };
              reader.readAsText(file);
          };
          fileInput.click();
      }

      function handleCopyWeek() {
        showConfirmModal(
          UI_TEXT.COPY_WEEK_CONFIRM_TITLE,
          UI_TEXT.COPY_WEEK_CONFIRM_MSG,
          () => {
            copyPreviousWeek();
            showNotification(UI_TEXT.COPY_WEEK_SUCCESS, 'success');
          },
          'primary'
        );
      }

      function handleResetWeek() {
        showConfirmModal(
          UI_TEXT.RESET_WEEK_CONFIRM_TITLE,
          UI_TEXT.RESET_WEEK_CONFIRM_MSG,
          () => {
            resetCurrentWeek();
            showNotification(UI_TEXT.RESET_WEEK_SUCCESS, 'info');
          },
          'danger'
        );
      }
      
      function handleBiometricsForm(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        const entry = {};
        for (let [key, value] of formData.entries()) {
          entry[key] = value;
        }
        addOrUpdateBiometricEntry(entry);
        showNotification(UI_TEXT.BIOMETRICS_SAVE_SUCCESS, 'success');
      }

      function handleBiometricsTableClick(e) {
        const btnEdit = e.target.closest('.btn-edit-biometrics');
        const btnDelete = e.target.closest('.btn-delete-biometrics');

        if (btnEdit) {
            const date = btnEdit.dataset.date;
            const state = getState();
            const entry = state.biometricData.find(e => e.date === date);
            if (entry) {
                const form = document.getElementById('biometrics-form');
                for (const key in entry) {
                    if (form.elements[key]) {
                        form.elements[key].value = entry[key];
                    }
                }
                form.scrollIntoView({ behavior: 'smooth' });
            }
        } else if (btnDelete) {
            const date = btnDelete.dataset.date;
            showConfirmModal(
                UI_TEXT.BIOMETRICS_DELETE_CONFIRM_TITLE,
                UI_TEXT.BIOMETRICS_DELETE_CONFIRM_MSG,
                () => {
                    deleteBiometricEntry(date);
                    showNotification(UI_TEXT.BIOMETRICS_DELETE_SUCCESS, 'info');
                },
                'danger'
            );
        }
      }

      export function initializeEventListeners() {
        document.getElementById('reset-btn').addEventListener('click', handleResetWeek);
        document.getElementById('backup-btn').addEventListener('click', handleSaveBackup);
        document.getElementById('restore-btn').addEventListener('click', handleRestoreBackup);
        document.getElementById('load-config-btn').addEventListener('click', handleLoadConfig);
        document.getElementById('info-icon').addEventListener('click', () => document.getElementById('info-modal').classList.remove('modal-hidden'));
        
        document.querySelectorAll('.modal-close-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const modalId = e.target.dataset.target;
            if (modalId) {
              document.getElementById(modalId).classList.add('modal-hidden');
            }
          });
        });

        document.querySelectorAll('.modal-overlay').forEach(overlay => {
          overlay.addEventListener('click', (e) => {
            if (e.target === overlay) {
              overlay.classList.add('modal-hidden');
            }
          });
        });

        document.getElementById('calendar-grid').addEventListener('click', handleCalendarClick);
        document.getElementById('log-view').addEventListener('click', handleLogViewClick);
        document.getElementById('biometrics-view').addEventListener('submit', handleBiometricsForm);
        document.getElementById('biometrics-table').addEventListener('click', handleBiometricsTableClick);
        document.getElementById('prev-week-btn').addEventListener('click', () => navigateWeek(-1));
        document.getElementById('next-week-btn').addEventListener('click', () => navigateWeek(1));

        document.getElementById('view-calendar-btn').addEventListener('click', () => setView('calendar'));
        document.getElementById('view-log-btn').addEventListener('click', () => setView('log'));
        document.getElementById('view-biometrics-btn').addEventListener('click', () => setView('biometrics'));
        document.getElementById('copy-week-btn').addEventListener('click', handleCopyWeek);
        document.getElementById('share-config-btn').addEventListener('click', handleShareConfig);

        document.getElementById('global-alert-close').addEventListener('click', () => {
            document.getElementById('global-alert').classList.add('hidden');
        });
      }
  - file: src/ui/renderer.js
    content: |
      import { getState, updateWeeklyPlan } from '../core/state.js';
      import { DAYS, MEAL_TYPES, UI_TEXT, WEEK_STARTS_ON_MONDAY, BIOMETRIC_FIELDS } from '../utils/constants.js';
      import { showNotification } from './notifications.js';

      const calendarGrid = document.getElementById('calendar-grid');
      const logView = document.getElementById('log-view');
      const biometricsView = document.getElementById('biometrics-view');
      const weekTitleEl = document.getElementById('week-title');
      const viewCalendarBtn = document.getElementById('view-calendar-btn');
      const viewLogBtn = document.getElementById('view-log-btn');
      const viewBiometricsBtn = document.getElementById('view-biometrics-btn');
      const globalAlert = document.getElementById('global-alert');
      const globalAlertMessage = document.getElementById('global-alert-message');

      const selectionModal = document.getElementById('selection-modal');
      const selectionModalTitle = document.getElementById('selection-modal-title');
      const selectionModalList = document.getElementById('selection-modal-list');
      const dayEditorModal = document.getElementById('day-editor-modal');
      const dayEditorTitle = document.getElementById('day-editor-title');
      const dayEditorBody = document.getElementById('day-editor-body');

      const confirmModal = document.getElementById('confirm-modal');
      const confirmModalTitle = document.getElementById('confirm-modal-title');
      const confirmModalMessage = document.getElementById('confirm-modal-message');
      const confirmModalCancelBtn = document.getElementById('confirm-modal-cancel-btn');
      const confirmModalConfirmBtn = document.getElementById('confirm-modal-confirm-btn');

      const recipeModal = document.getElementById('recipe-modal');
      const recipeModalTitle = document.getElementById('recipe-modal-title');
      const recipeModalBody = document.getElementById('recipe-modal-body');

      let currentEditingDayISO = null;

      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function formatShortDate(date) {
        return date.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
      }

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function formatMealCalories(meal) {
        if (!meal || !meal.calories_min) return '';
        const minCals = Number(meal.calories_min) || 0;
        const maxCals = Number(meal.calories_max) || minCals;
        if (minCals === 0) return '';
        const kcalLabel = UI_TEXT.KCAL_LABEL || 'Kcal';
        if (minCals === maxCals) return `${minCals} ${kcalLabel}`;
        return `${minCals} - ${maxCals} ${kcalLabel}`;
      }

      function calculateDailyCalories(isoDate, weeklyPlan) {
        let min = 0;
        let max = 0;
        MEAL_TYPES.forEach(type => {
          const slotId = `${isoDate}-${type}`;
          const meal = weeklyPlan[slotId]; // Meal is now the full object
          if (meal && meal.calories_min) {
            const minCals = Number(meal.calories_min) || 0;
            const maxCals = Number(meal.calories_max) || minCals;
            min += minCals;
            max += maxCals;
          }
        });
        if (min === 0 && max === 0) return '';
        if (min === max) return `${UI_TEXT.KCAL_LABEL}: ${min}`;
        return `${UI_TEXT.KCAL_LABEL}: ${min} - ${max}`;
      }

      function getRecipeButtonHTML(meal, state) {
        if (state.recipeBaseUrl && meal && meal.recipeId) {
          return `<button class="btn-view-recipe" data-meal-id="${meal.id}" title="${UI_TEXT.RECIPE_BUTTON_TITLE}">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M20 3H4c-1.103 0-2 .897-2 2v14c0 1.103.897 2 2 2h16c1.103 0 2-.897 2-2V5c0-1.103-.897-2-2-2zM4 19V5h7v14H4zm9 0V5h7l.001 14H13z"></path><path d="M9 7h2v2H9z"></path></svg>
                  </button>`;
        }
        return '';
      }

      export async function showRecipeModal(meal) {
        const state = getState();
        if (!meal) return;
        const url = `${state.recipeBaseUrl}${meal.recipeId}.md`;
        recipeModalTitle.textContent = meal.nomePasto;
        recipeModalBody.innerHTML = `<p>${UI_TEXT.RECIPE_MODAL_LOADING}</p>`;
        recipeModal.classList.remove('modal-hidden');

        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Errore di rete: ${response.status}`);
          const markdown = await response.text();
          recipeModalBody.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
        } catch (error) {
          recipeModalBody.innerHTML = `<p>${UI_TEXT.RECIPE_MODAL_LOAD_ERROR}</p>`;
          showNotification(UI_TEXT.RECIPE_LOAD_FAIL_MSG, 'error');
        }
      }

      export function showConfirmModal(title, message, onConfirm, type = 'secondary') {
        confirmModalTitle.textContent = title;
        confirmModalMessage.textContent = message;
        confirmModalConfirmBtn.className = `btn btn-${type}`;
        confirmModalConfirmBtn.textContent = UI_TEXT.CONFIRM_MODAL_CONFIRM_BTN;
        confirmModalCancelBtn.textContent = UI_TEXT.CONFIRM_MODAL_CANCEL_BTN;

        const cleanup = () => {
          confirmModal.classList.add('modal-hidden');
          confirmModalCancelBtn.removeEventListener('click', cancelHandler);
          confirmModalConfirmBtn.removeEventListener('click', confirmHandler);
        };

        const cancelHandler = () => cleanup();
        const confirmHandler = () => {
          onConfirm();
          cleanup();
        };
        
        confirmModalCancelBtn.addEventListener('click', cancelHandler, { once: true });
        confirmModalConfirmBtn.addEventListener('click', confirmHandler, { once: true });
        
        confirmModal.classList.remove('modal-hidden');
      }

      export function openSelectionModal(slotId) {
        const state = getState();
        const mealType = slotId.substring(11);
        selectionModalTitle.textContent = `${UI_TEXT.SELECT_MEAL_TITLE} ${mealType}`;
        const relevantMeals = state.masterMealList.filter(m => m.tipoPasto === mealType || m.tipoPasto === 'Tutti');
        selectionModalList.innerHTML = relevantMeals.length > 0 ? relevantMeals.map(meal => `<div class="selection-item" data-meal-id="${meal.id}"><h4>${meal.nomePasto}</h4><p>${meal.ingredienti || ''}</p></div>`).join('') : `<p>${UI_TEXT.NO_MEALS_AVAILABLE}</p>`;
        const closeButton = selectionModal.querySelector('.modal-close-btn');
        const closeAndReturn = () => {
          selectionModal.classList.add('modal-hidden');
          if (currentEditingDayISO) openDayEditorModal(currentEditingDayISO);
          closeButton.removeEventListener('click', closeAndReturn);
          selectionModal.removeEventListener('click', overlayClickHandler);
        };
        const overlayClickHandler = (e) => { if (e.target === selectionModal) closeAndReturn(); };
        selectionModalList.onclick = (e) => {
          const item = e.target.closest('.selection-item');
          if(item) {
            updateWeeklyPlan(slotId, item.dataset.mealId);
            closeAndReturn();
          }
        };
        closeButton.addEventListener('click', closeAndReturn, { once: true });
        selectionModal.addEventListener('click', overlayClickHandler);
        selectionModal.classList.remove('modal-hidden');
      }

      export function openDayEditorModal(isoDate) {
        currentEditingDayISO = isoDate;
        const state = getState();
        dayEditorTitle.textContent = `${UI_TEXT.EDITOR_MODAL_TITLE_PREFIX} ${formatFullDate(isoDate)}`;
        dayEditorBody.innerHTML = MEAL_TYPES.map(mealType => {
          const slotId = `${isoDate}-${mealType}`;
          const meal = state.weeklyPlan[slotId]; // Get the full meal object directly
          
          let mealDetailsHTML = `<button class="btn-add-meal" data-slot-id="${slotId}">${UI_TEXT.ADD_MEAL_BTN}</button>`;
          if (meal) {
            const recipeButtonHTML = getRecipeButtonHTML(meal, state);
            mealDetailsHTML = `
              <div class="meal-details">
                <span class="meal-details__name">${meal.nomePasto}</span>
                <div class="meal-actions">
                  ${recipeButtonHTML}
                  <button class="btn-remove-meal" data-slot-id="${slotId}">&times;</button>
                </div>
              </div>`;
          }

          return `<div class="day-editor-slot"><span class="meal-type-label">${mealType}</span><div class="meal-details-container">${mealDetailsHTML}</div></div>`;
        }).join('');

        dayEditorBody.onclick = (e) => {
          const btnAdd = e.target.closest('.btn-add-meal');
          const btnRemove = e.target.closest('.btn-remove-meal');
          const btnRecipe = e.target.closest('.btn-view-recipe');

          if (btnAdd) {
            dayEditorModal.classList.add('modal-hidden');
            openSelectionModal(btnAdd.dataset.slotId);
          } else if (btnRemove) {
            updateWeeklyPlan(btnRemove.dataset.slotId, null);
            openDayEditorModal(isoDate);
          } else if (btnRecipe) {
            const mealId = btnRecipe.dataset.mealId;
            const meal = Object.values(state.weeklyPlan).find(m => m && m.id === mealId) || state.masterMealList.find(m => m.id === mealId);
            if (meal) showRecipeModal(meal);
          }
        };
        dayEditorModal.classList.remove('modal-hidden');
      }

      export function populateInitialText() {
        document.title = UI_TEXT.MAIN_TITLE;
        document.getElementById('main-title').textContent = UI_TEXT.MAIN_TITLE;
        document.getElementById('load-config-btn').textContent = UI_TEXT.LOAD_BUTTON;
        document.getElementById('reset-btn').textContent = UI_TEXT.RESET_BUTTON;
        document.getElementById('copy-week-btn').textContent = UI_TEXT.COPY_WEEK_BTN;
        document.getElementById('backup-btn').textContent = UI_TEXT.BACKUP_BTN;
        document.getElementById('restore-btn').textContent = UI_TEXT.RESTORE_BTN;
        document.getElementById('info-modal-title').textContent = UI_TEXT.INFO_MODAL_TITLE;
        document.getElementById('info-modal-desc').textContent = UI_TEXT.INFO_MODAL_DESC;
        document.getElementById('info-modal-json-example').textContent = UI_TEXT.INFO_MODAL_EXAMPLE_JSON;
        document.getElementById('biometrics-title').textContent = UI_TEXT.BIOMETRICS_FORM_TITLE;
        document.getElementById('biometrics-history-title').textContent = UI_TEXT.BIOMETRICS_HISTORY_TITLE;
      }

      function renderCalendarView(state, weekStart) {
        calendarGrid.innerHTML = '';
        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const dayName = DAYS[i];
          const isoDate = toISODateString(dayDate);
          const dailyCalories = calculateDailyCalories(isoDate, state.weeklyPlan);
          const dayCell = document.createElement('div');
          dayCell.className = 'day-cell';
          dayCell.dataset.date = isoDate;
          dayCell.innerHTML = `<div class="day-cell__header"><span>${dayName}</span><span>${dayDate.getDate()}</span></div><div class="day-cell__body"><div class="daily-calories">${dailyCalories}</div></div>`;
          calendarGrid.appendChild(dayCell);
        }
      }

      function renderLogView(state, weekStart) {
        logView.innerHTML = '';
        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          const dayMeals = MEAL_TYPES.map(type => {
            const slotId = `${isoDate}-${type}`;
            return { type, meal: state.weeklyPlan[slotId] };
          }).filter(item => item.meal);
          
          if (dayMeals.length > 0) {
            const dailyCalories = calculateDailyCalories(isoDate, state.weeklyPlan);
            const dayLog = document.createElement('div');
            dayLog.className = 'log-day';
            dayLog.innerHTML = `<h3><span>${formatFullDate(isoDate)}</span><span class="log-day__total-calories">${dailyCalories}</span></h3>` 
              + dayMeals.map(item => {
                const recipeButtonHTML = getRecipeButtonHTML(item.meal, state);
                return `
                  <div class="log-item">
                    <div class="log-item__name">
                      <strong>${item.type}:</strong>
                      <span>${item.meal.nomePasto}</span>
                      ${recipeButtonHTML}
                    </div>
                    <span class="log-item__calories">${formatMealCalories(item.meal)}</span>
                  </div>
                `;
              }).join('');
            logView.appendChild(dayLog);
          }
        }
        if (logView.innerHTML === '') {
          logView.innerHTML = `<p class="placeholder-text">${UI_TEXT.LOG_VIEW_EMPTY}</p>`;
        }
      }

      function renderBiometricsView(state) {
        const form = document.getElementById('biometrics-form');
        const tableBody = document.querySelector('#biometrics-table tbody');
        const tableHead = document.querySelector('#biometrics-table thead');

        const today = toISODateString(new Date());

        form.innerHTML = `
            ${BIOMETRIC_FIELDS.map(field => `
                <div class="form-group">
                    <label for="bio-${field.id}">${field.label}</label>
                    ${field.type === 'textarea' ?
                        `<textarea id="bio-${field.id}" name="${field.id}"></textarea>` :
                        `<input type="${field.type}" id="bio-${field.id}" name="${field.id}" ${field.props || ''} ${field.id === 'date' ? `value="${today}"` : ''}>`
                    }
                </div>
            `).join('')}
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">${UI_TEXT.BIOMETRICS_SAVE_BTN}</button>
                <button type="reset" class="btn btn-secondary">${UI_TEXT.BIOMETRICS_CLEAR_BTN}</button>
            </div>
        `;

        tableHead.innerHTML = `<tr>${BIOMETRIC_FIELDS.map(f => `<th>${f.label}</th>`).join('')}<th>Azioni</th></tr>`;

        tableBody.innerHTML = state.biometricData.map(entry => `
            <tr data-date="${entry.date}">
                ${BIOMETRIC_FIELDS.map(field => `<td>${entry[field.id] || ''}</td>`).join('')}
                <td class="biometrics-actions">
                    <button class="btn-edit-biometrics" data-date="${entry.date}" title="Modifica">✏️</button>
                    <button class="btn-delete-biometrics" data-date="${entry.date}" title="Elimina">🗑️</button>
                </td>
            </tr>
        `).join('');
      }

      export function renderApp() {
        const state = getState();
        if (Object.keys(state.weeklyPlan).length === 0 && state.masterMealList.length === 0 && state.currentView !== 'biometrics') {
            globalAlertMessage.textContent = UI_TEXT.CALENDAR_PLACEHOLDER;
            globalAlert.classList.remove('hidden');
        } else {
            globalAlert.classList.add('hidden');
        }
        const weekStart = getWeekStartDate(state.focusedDate);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        weekTitleEl.textContent = `${formatShortDate(weekStart)} - ${formatShortDate(weekEnd)}`;

        const planningViews = [calendarGrid, logView];
        const allViews = [...planningViews, biometricsView];
        const weekNav = document.querySelector('.calendar-header');

        allViews.forEach(v => v.classList.add('hidden'));
        [viewCalendarBtn, viewLogBtn, viewBiometricsBtn].forEach(b => b.classList.remove('active'));
        weekNav.style.visibility = 'visible';

        if (state.currentView === 'calendar') {
          calendarGrid.classList.remove('hidden');
          viewCalendarBtn.classList.add('active');
          renderCalendarView(state, weekStart);
        } else if (state.currentView === 'log') {
          logView.classList.remove('hidden');
          viewLogBtn.classList.add('active');
          renderLogView(state, weekStart);
        } else if (state.currentView === 'biometrics') {
          biometricsView.classList.remove('hidden');
          viewBiometricsBtn.classList.add('active');
          weekNav.style.visibility = 'hidden';
          renderBiometricsView(state);
        }
        
        const urlInput = document.getElementById('config-url-input');
        if (document.activeElement !== urlInput) urlInput.value = state.configUrl;
      }
  - file: src/utils/constants.js
    content: |
      export const DEFAULT_CONFIG_URL = '';
      export const LOCAL_STORAGE_KEY_PLAN = 'dynamicProtocolPlan';
      export const LOCAL_STORAGE_KEY_URL = 'dynamicConfigUrl';
      export const LOCAL_STORAGE_KEY_BIOMETRICS = 'healtyproBiometricData';
      export const WEEK_STARTS_ON_MONDAY = 1;
