commit_message: "feat(history): Arricchisce lo storico allenamenti con statistiche per serie"
rationale: |
  Questo commit rappresenta un'evoluzione significativa della funzionalità di tracciamento degli allenamenti, rispondendo alla necessità di statistiche più dettagliate e correggendo un bug critico nel conteggio finale.

  Le modifiche chiave sono:

  1.  **Tracciamento Granulare per Serie**: È stato introdotto un nuovo meccanismo di tracciamento in `src/core/trainer/state.js` e `machine.js`. L'applicazione ora registra i dettagli di ogni singola serie completata (ripetizioni o durata) in un nuovo array `setsData`.
  
  2.  **Correzione Bug Esercizio Finale**: La logica di calcolo in `createWorkoutSummary` (`src/core/trainer.js`) è stata riscritta. Ora determina correttamente lo stato di completamento anche per l'ultimo esercizio di un allenamento terminato naturalmente, risolvendo il bug che lo segnalava come incompleto.

  3.  **Riepiloghi Dettagliati**: Il riepilogo salvato nello storico (`workoutHistory`) ora include l'array `setsData` con tutte le performance registrate.

  4.  **UI Potenziata**:
      * La **Vista Debriefing** (`src/ui/pageRenderers.js`) è stata completamente riprogettata per mostrare non solo le serie completate, ma anche i dettagli di ripetizioni/durata per ciascuna di esse.
      * La **Vista Log** (`src/ui/plannerRenderer.js`) è stata allineata per visualizzare lo stesso livello di dettaglio, trasformandola in un vero e proprio diario storico degli allenamenti.
