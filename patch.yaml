commit_message: "feat: Refactor to JSON config and implement new UI features"
rationale: |
  This commit represents a major architectural evolution of the application. The data source has been refactored from CSV to a unified `planner-config.json`, which now holds both the meals list and a new, flexible validation rules engine. The hardcoded 'soy' validation has been replaced by this dynamic engine.

  Additionally, several key UI/UX features have been implemented based on user feedback:
  - Meal deletion from the calendar via a dedicated button.
  - Yellow highlighting for meals placed in mismatched slots (e.g., dinner at lunch).
  - Filtering capabilities (All, Lunch, Dinner) in the meal library.

  All documentation has been automatically updated to reflect this new, more powerful and flexible architecture, including the new JSON data structure and UI functionalities.
