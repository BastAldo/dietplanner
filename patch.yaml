commit_message: "feat(library): Implement tabbed UI, search, and ingredient CRUD"
rationale: |
  This commit delivers the complete, user-approved plan for the "Library" feature. It transforms the library from a static placeholder into a fully functional, interactive, and user-friendly management tool.

  Key enhancements include:
  1.  **Tabbed Interface**: The library view now uses a tabbed navigation system, allowing users to switch between "Ingredients" and "Meals". This addresses the usability concerns of a long scrolling page and provides a scalable structure for future content types.
  2.  **Search and Filtering**: A search bar has been implemented at the top of the library page. It provides real-time filtering of the content within the active tab, significantly improving the user's ability to find specific items in large collections.
  3.  **State Management for UI**: The application's UI state has been extended to manage the active tab and the current search term, ensuring a persistent and intuitive user experience when navigating away from and back to the library.
  4.  **Full Ingredient CRUD**: The entire workflow for creating, reading, updating, and deleting ingredients is now functional, including the editor modal and confirmation dialogues, as per the agreed plan.
patches:
  - file: styles/library.css
    content: |
      /* --- LIBRARY PAGE --- */
      #library-page > h3 {
          color: var(--primary-color);
          margin-bottom: 1.5rem;
      }

      .library-controls {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
      }

      .library-search-bar {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        background-color: var(--card-color);
        color: var(--text-color);
      }

      .library-search-bar:focus {
        outline: none;
        border-color: var(--primary-color);
      }

      .library-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .library-section {
        margin-bottom: 2rem;
      }

      .library-item {
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 1rem;
          padding: 1rem;
          background-color: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          margin-bottom: 0.75rem;
      }

      .library-item-info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        flex-grow: 1;
        min-width: 0;
      }

      .library-item-info__name {
        font-weight: 500;
        word-break: break-word;
      }
      .library-item-info__details {
        font-size: 0.85rem;
        color: var(--text-color-muted);
        word-break: break-word;
      }

      .library-item-actions {
        display: flex;
        gap: 0.5rem;
        flex-shrink: 0;
      }

      .library-item-actions button {
        background: none;
        border: none;
        color: var(--text-color-muted);
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
