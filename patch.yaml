commit_message: "fix(ui): Migliora layout e animazioni del Trainer e dell'editor modale"
rationale: |
  Questo commit implementa diverse correzioni e miglioramenti all'interfaccia utente basati sul feedback diretto, con l'obiettivo di perfezionare l'usabilità e l'estetica.

  Le modifiche principali sono:
  1.  **Animazione del Ring Corretta**: In `TrainerComponent.js`, le fasi di preparazione (`pre-`) ora mostrano istantaneamente il ring di progressione al 100%, risolvendo l'artefatto visivo del "salto" dell'animazione su durate molto brevi.
  2.  **Timer Ring Ingrandito**: Il timer ring, elemento centrale della vista Trainer, è stato notevolmente ingrandito per migliorare la leggibilità e l'impatto visivo. Questo risolve il problema del testo che precedentemente si sovrapponeva al bordo del ring. Le modifiche sono state coordinate tra `TrainerComponent.js` (logica SVG) e `trainer.css` (contenitore).
  3.  **Layout Trainer Ottimizzato**: Lo spazio verticale vuoto nella parte superiore della vista Trainer è stato ridotto in `trainer.css`, assicurando che tutti gli elementi di controllo siano visibili senza necessità di scroll, specialmente su schermi con altezza limitata.
  4.  **Fix Layout Mobile nell'Editor**: Risolto un bug di overflow in `modals.css` per cui i pulsanti "Gestisci" e "Avvia Allenamento" nel modale dell'editor del giorno "spaginavano" su schermi piccoli. Ora i pulsanti si impilano correttamente in verticale, garantendo una visualizzazione corretta su tutti i dispositivi.
patches:
