commit_message: "feat(data): Ristruttura la gestione dei pasti e calcola le calorie dinamicamente"
rationale: |
  Questo commit introduce una profonda ristrutturazione della gestione dei dati, separando la definizione dei pasti da quella degli ingredienti e introducendo un sistema di calcolo calorico dinamico. L'obiettivo è aumentare la modularità, la manutenibilità e la flessibilità dell'applicazione, come da piano approvato.

  Le modifiche principali sono:
  1.  **Struttura Dati Modulare**: La configurazione ora si basa su due file separati (`pasti.json` e `ingredienti.json`) che vengono caricati in modo orchestrato. Questo disaccoppia i dati e semplifica gli aggiornamenti.
  2.  **Calcolo Dinamico delle Calorie**: È stato introdotto un nuovo modulo, `src/core/calorieCalculator.js`, con la responsabilità esclusiva di calcolare le calorie minime e massime per ogni pasto basandosi sui suoi ingredienti. Questo elimina la necessità di avere calorie pre-calcolate e hardcoded nei dati dei pasti.
  3.  **URL di Configurazione Semplificati**: La `recipeBaseUrl` non è più un campo di configurazione manuale. Viene ora derivata automaticamente dall'URL del file dei pasti, seguendo una convenzione di struttura delle cartelle (`/ricette/`). Questo riduce la complessità e il rischio di errori.
  4.  **Refactoring del Caricamento**: Le funzioni in `configService.js` e `main.js` sono state aggiornate per gestire il nuovo flusso di caricamento multi-file.
  5.  **Aggiornamento UI**: Il modale di selezione dei pasti è stato aggiornato per visualizzare correttamente la nuova struttura dati degli ingredienti.
