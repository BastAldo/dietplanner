commit_message: "feat(tracking): Aggiunge il calcolo delle calorie bruciate e il log di attività manuali"
rationale: |
  Questo commit introduce due funzionalità strategiche che trasformano HealtyPro in un diario di benessere completo, come da nostra discussione.

  1.  **Calcolo delle Calorie Bruciate (METs)**: È stata implementata la logica per calcolare il dispendio calorico degli allenamenti strutturati.
      * `src/core/calculations.js` ora contiene la funzione `calculateWorkoutCalories` che usa la formula standard basata sui valori MET.
      * Il core del trainer (`src/core/trainer.js`) è stato aggiornato per integrare questo calcolo nel riepilogo finale dell'allenamento.
      * L'interfaccia utente (Debriefing e Vista Log) ora mostra chiaramente le calorie bruciate, fornendo un feedback cruciale sul bilancio energetico.
      * **Nota**: Questa funzionalità presuppone che il file `esercizi.json` sia stato esteso con un campo `met_value` per ogni esercizio.

  2.  **Log di Attività Manuali**: Per consentire il tracciamento di qualsiasi attività fisica, è stata introdotta la possibilità di registrare allenamenti manualmente.
      * È stato creato un nuovo modale di inserimento (`manual-workout-modal`) semplice e flessibile.
      * La struttura dati dello storico allenamenti (`workoutHistory`) è stata resa polimorfica con un campo `type` (`'structured'` o `'manual'`) per gestire i due tipi di record.
      * La Vista Log (`src/ui/plannerRenderer.js`) è stata riscritta per renderizzare dinamicamente card diverse a seconda del tipo di attività, mostrando i dettagli appropriati per ciascuna.

  3.  **Correzione Terminologica**: Come richiesto, la dicitura "Tempo di Riposo" è stata sostituita con il più corretto "Tempo di Recupero" in tutta l'applicazione per coerenza e professionalità.
