  - file: src/ui/modals/workoutEditorModal.js
    content: |
      import { getState, updateWeeklyWorkout, reorderWorkoutExercises, getExerciseForPlanner, addWorkoutTemplate } from '../../core/state.js';
      import { WORKOUT_SLOT_ID } from '../../utils/constants.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { renderIcon } from '../icons.js';
      import { log } from '../../utils/logger.js';
      import { openWorkoutSelectionModal } from './selectionModal.js';
      import { openExerciseEditorModal } from './exerciseEditorModal.js';
      import { showNotification } from '../notifications.js';

      let sortableInstance = null;

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function formatExerciseDetails(exercise) {
        const sets = exercise.defaultSets;
        const rest = exercise.defaultRest;
        let details = `${sets} x `;

        // Gestisce reps, rep-range, o durata in base alla modalità
        if (exercise.execution_mode === 'logging') {
            if (exercise.defaultRepsMin && exercise.defaultRepsMax) {
                details += `${exercise.defaultRepsMin}-${exercise.defaultRepsMax}`;
            } else if (exercise.defaultRepsMin) {
                details += `${exercise.defaultRepsMin}+`;
            } else {
                details += `Reps`; // Fallback
            }
        } else if (exercise.execution_mode === 'guided_static' || exercise.type === 'time') {
            details += `${exercise.defaultDuration}s`;
        } else {
            // Default a 'guided_tempo' o vecchio formato 'reps'
            details += `${exercise.defaultReps || 'Reps'}`;
        }
        
        details += ` | Riposo: ${rest}s`;

        if (exercise.defaultTempo && exercise.execution_mode === 'guided_tempo') {
            const { up, hold, down } = exercise.defaultTempo;
            details += ` | Tempo: ${up}-${hold}-${down}`;
        }
        return details;
      }

      export function openWorkoutEditorModal(isoDate) {
        log('Modals', 'Opening workout editor modal', { isoDate });
        const state = getState();
        const modal = document.getElementById('workout-editor-modal');
        modal.querySelector('#workout-editor-title').textContent = `${UI_TEXT.WORKOUT_EDITOR_TITLE} - ${formatFullDate(isoDate)}`;
        modal.querySelector('#workout-editor-save-template-btn').textContent = UI_TEXT.SAVE_TEMPLATE_BTN;
        const body = modal.querySelector('#workout-editor-body');
        const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
        const plannedWorkoutList = state.weeklyWorkouts[workoutSlotId] || [];

        let exercisesHTML = plannedWorkoutList.map(exercise => {
            const exerciseDetails = formatExerciseDetails(exercise);
            return `<div class="meal-details draggable-item" data-instance-id="${exercise.instanceId}">
                        <div class="drag-handle">${renderIcon('DRAG_HANDLE', { width: 18, height: 18 })}</div>
                        <div class="exercise-info">
                            <span class="meal-details__name">${exercise.name}</span>
                            <span class="exercise-details-summary">${exerciseDetails}</span>
                        </div>
                        <div class="meal-actions">
                            <button class="btn-edit-exercise" title="Modifica" data-slot-id="${workoutSlotId}" data-instance-id="${exercise.instanceId}">${renderIcon('EDIT', { width: 16, height: 16 })}</button>
                            <button class="btn-remove-exercise" title="Rimuovi" data-slot-id="${workoutSlotId}" data-instance-id="${exercise.instanceId}">${renderIcon('TRASH', { width: 16, height: 16 })}</button>
                        </div>
                    </div>`;
        }).join('');

        const addExerciseButton = `<button class="btn-add-exercise" data-slot-id="${workoutSlotId}">${UI_TEXT.ADD_EXERCISE_BTN}</button>`;
        body.innerHTML = `<div class="day-editor-list workout-editor-list">${exercisesHTML}</div>${addExerciseButton}`;

        const listContainer = body.querySelector('.workout-editor-list');

        if (sortableInstance) {
            sortableInstance.destroy();
        }
        sortableInstance = new Sortable(listContainer, {
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            onEnd: function(evt) {
                reorderWorkoutExercises(workoutSlotId, evt.oldIndex, evt.newIndex);
            }
        });

        // Rimuovi vecchi listener per evitare duplicati
        const footer = modal.querySelector('.modal-footer');
        const oldBtn = footer.querySelector('#workout-editor-save-template-btn');
        const newBtn = oldBtn.cloneNode(true);
        oldBtn.parentNode.replaceChild(newBtn, oldBtn);

        newBtn.onclick = () => {
          const currentWorkoutList = getState().weeklyWorkouts[workoutSlotId] || [];
          if (currentWorkoutList.length === 0) {
            showNotification('Aggiungi almeno un esercizio prima di salvare la scheda.', 'error');
            return;
          }
          const templateName = prompt(UI_TEXT.SAVE_TEMPLATE_PROMPT);
          if (templateName && templateName.trim() !== '') {
            addWorkoutTemplate(templateName.trim(), currentWorkoutList);
            showNotification(UI_TEXT.TEMPLATE_SAVE_SUCCESS, 'success');
          }
        };

        body.onclick = e => {
            const btnAddExercise = e.target.closest('.btn-add-exercise');
            const btnRemoveExercise = e.target.closest('.btn-remove-exercise');
            const btnEditExercise = e.target.closest('.btn-edit-exercise');

            if (btnAddExercise) {
                modal.classList.add('modal-hidden');
                openWorkoutSelectionModal(btnAddExercise.dataset.slotId, isoDate);
            } else if (btnRemoveExercise) {
                updateWeeklyWorkout(btnRemoveExercise.dataset.slotId, null, parseFloat(btnRemoveExercise.dataset.instanceId));
                openWorkoutEditorModal(isoDate); // Refresh this modal
            } else if (btnEditExercise) {
                const slotId = btnEditExercise.dataset.slotId;
                const instanceId = btnEditExercise.dataset.instanceId;
                const exercise = getExerciseForPlanner(slotId, instanceId);
                if (exercise) {
                  openExerciseEditorModal({
                    context: 'planner',
                    exercise,
                    slotId,
                    returnIsoDate: isoDate
                  });
                }
            }
        };

        modal.classList.remove('modal-hidden');
      }

  - file: src/ui/modals/selectionModal.js
    content: |
      import { getState, updateWeeklyPlan, updateWeeklyWorkout, getPackageTags, addWorkoutTemplateToDay } from '../../core/state.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { log } from '../../utils/logger.js';
      import { formatIngredients } from '../../utils/formatters.js';
      import { openDayEditorModal } from './dayEditorModal.js';
      import { openWorkoutEditorModal } from './workoutEditorModal.js';

      export function openSelectionModal(slotId, returnIsoDate, relevantMeals) {
        log('Modals', 'Opening meal selection modal', { slotId });
        const mealType = slotId.substring(11);
        const selectionModal = document.getElementById('selection-modal');
        selectionModal.querySelector('#selection-modal-title').textContent = `${UI_TEXT.SELECT_MEAL_TITLE} ${mealType}`;
        
        const list = selectionModal.querySelector('#selection-modal-list');
        const searchInput = selectionModal.querySelector('#selection-modal-search');
        const tagsContainer = selectionModal.querySelector('#selection-modal-tag-filters');
        
        let activeTagFilter = null;
        let searchTerm = '';

        function renderPackageTags() {
            const pkgTags = getPackageTags();
            if (pkgTags.length === 0) {
              tagsContainer.innerHTML = '';
              return;
            }
            tagsContainer.innerHTML = `
              <button class="tag-filter-btn active" data-tag="all">${UI_TEXT.EXPLORE_FILTER_ALL}</button>
              ${pkgTags.map(tag => {
                const tagName = tag.replace('pkg:', '');
                return `<button class="tag-filter-btn" data-tag="${tag}">${tagName}</button>`;
              }).join('')}
            `;
        }

        function renderList() {
            const lowerCaseSearch = searchTerm.toLowerCase().trim();
            
            const filteredMeals = relevantMeals.filter(meal => {
                // Filtro Pacchetto
                if (activeTagFilter && (!meal.etichette || !meal.etichette.includes(activeTagFilter))) {
                    return false;
                }
                
                // Filtro Ricerca
                if (lowerCaseSearch !== '') {
                  const nameMatch = meal.nomePasto.toLowerCase().includes(lowerCaseSearch);
                  const tagMatch = meal.etichette && meal.etichette.some(tag => tag.toLowerCase().includes(lowerCaseSearch));
                  if (!nameMatch && !tagMatch) return false;
                }

                return true;
            });
            
            const noMealsText = searchTerm ? `Nessun pasto trovato per "${searchTerm}".` : UI_TEXT.NO_MEALS_AVAILABLE;
            list.innerHTML = filteredMeals.length > 0 
                ? filteredMeals.map(meal => `<div class="selection-item" data-meal-id="${meal.id}"><h4>${meal.nomePasto}</h4>${formatIngredients(meal)}</div>`).join('') 
                : `<p class="placeholder-text">${noMealsText}</p>`;
        }

        searchInput.value = '';
        searchInput.oninput = (e) => {
            searchTerm = e.target.value;
            renderList();
        };

        tagsContainer.onclick = (e) => {
          const target = e.target.closest('.tag-filter-btn');
          if (!target) return;
          
          tagsContainer.querySelectorAll('.tag-filter-btn').forEach(btn => btn.classList.remove('active'));
          target.classList.add('active');
          
          const tag = target.dataset.tag;
          activeTagFilter = tag === 'all' ? null : tag;
          renderList();
        };
        
        renderPackageTags();
        renderList();
        
        const closeAndReturn = () => {
          selectionModal.classList.add('modal-hidden');
          if (returnIsoDate) openDayEditorModal(returnIsoDate);
        };

        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if(item) { 
            updateWeeklyPlan(slotId, item.dataset.mealId); 
            closeAndReturn(); 
          }
        };
        selectionModal.classList.remove('modal-hidden');
      }

      export function openWorkoutSelectionModal(slotId, returnIsoDate) {
        log('Modals', 'Opening workout selection modal', { slotId });
        const state = getState();
        const workoutSelectionModal = document.getElementById('workout-selection-modal');
        workoutSelectionModal.querySelector('#workout-selection-modal-title').textContent = UI_TEXT.SELECT_EXERCISE_TITLE;
        const list = workoutSelectionModal.querySelector('#workout-selection-modal-list');
        const relevantWorkouts = state.masterWorkoutList;
        list.innerHTML = relevantWorkouts.length > 0 ? relevantWorkouts.map(ex => `<div class="selection-item" data-exercise-id="${ex.id}"><h4>${ex.name}</h4><p>${ex.description}</p></div>`).join('') : `<p>${UI_TEXT.NO_WORKOUTS_AVAILABLE}</p>`;
        
        const closeAndReturn = () => {
          workoutSelectionModal.classList.add('modal-hidden');
          if (returnIsoDate) openWorkoutEditorModal(returnIsoDate);
        };

        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if (item) {
            updateWeeklyWorkout(slotId, item.dataset.exerciseId);
            closeAndReturn();
          }
        };
        workoutSelectionModal.classList.remove('modal-hidden');
      }

      export function openWorkoutTemplateSelectionModal(slotId, returnIsoDate) {
        log('Modals', 'Opening workout template selection modal', { slotId });
        const state = getState();
        const templateSelectionModal = document.getElementById('workout-template-selection-modal');
        templateSelectionModal.querySelector('#workout-template-selection-modal-title').textContent = UI_TEXT.SELECT_TEMPLATE_TITLE;
        const list = templateSelectionModal.querySelector('#workout-template-selection-modal-list');
        const relevantTemplates = state.masterWorkoutTemplateList;
        
        list.innerHTML = relevantTemplates.length > 0 
            ? relevantTemplates.map(template => 
                `<div class="selection-item" data-template-id="${template.id}">
                    <h4>${template.name}</h4>
                    <p>${template.exercises.length} ${template.exercises.length === 1 ? 'esercizio' : 'esercizi'}</p>
                </div>`
              ).join('') 
            : `<p class="placeholder-text">${UI_TEXT.NO_TEMPLATES_AVAILABLE}</p>`;
        
        const closeAndReturn = () => {
          templateSelectionModal.classList.add('modal-hidden');
          if (returnIsoDate) openDayEditorModal(returnIsoDate);
        };

        list.onclick = e => {
          const item = e.target.closest('.selection-item');
          if (item) {
            addWorkoutTemplateToDay(slotId, parseFloat(item.dataset.templateId));
            closeAndReturn();
          }
        };
        templateSelectionModal.classList.remove('modal-hidden');
      }

