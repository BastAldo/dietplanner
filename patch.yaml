commit_message: "feat(trainer): Architettura Dual Mode - Fase 1 - Logica"
rationale: |
  Questo commit implementa la Fase 1 del piano "Dual Mode" per il modulo di allenamento, come da accordi.

  L'obiettivo è introdurre la logica di base per supportare due distinte modalità di allenamento:
  1.  **Modalità Guidata (esistente):** Per allenamenti basati su tempo e rep fisse (es. `guided_tempo`).
  2.  **Modalità Logging (nuova):** Per allenamenti in stile "sala pesi", dove l'utente registra i set (reps/peso) man mano che li esegue, con supporto per rep-range e allenamento a cedimento.

  Modifiche principali:

  1.  **`src/ui/modals/exerciseEditorModal.js`:**
      * Il modulo di pianificazione degli esercizi è stato potenziato.
      * Aggiunto un `<select>` per "Modalità Esecuzione" (`execution_mode`) che permette all'utente di scegliere tra "Guidato (Tempo)", "Guidato (Durata)" e "Logging (Manuale)".
      * Aggiunti campi di input per "Rep Min" (`defaultRepsMin`) e "Rep Max" (`defaultRepsMax`) per la modalità "Logging".
      * La logica `renderPlannerForm` e `saveHandler` è stata aggiornata per mostrare/nascondere i campi corretti in base alla modalità selezionata e per salvare queste nuove proprietà (`execution_mode`, `defaultRepsMin`, `defaultRepsMax`) nell'oggetto esercizio.

  2.  **`src/core/trainer/state.js`:**
      * Aggiunta la proprietà `resolveCurrentSetPromise: null` allo stato iniziale. Questo è il "gancio" che useremo per mettere in pausa il `runWorkoutLoop` durante la modalità `logging`, in attesa che l'utente confermi manualmente il completamento di un set dalla UI.

  3.  **`src/core/trainer/queueBuilder.js`:**
      * Il `context` (linea 64) ora include `repsMin` e `repsMax` presi dall'esercizio.
      * La logica `if (execution_mode === 'manual_reps')` (linea 74) è stata aggiornata a `else if (execution_mode === 'logging')`.
      * Il `type` della fase generata è stato cambiato da `manual_rep` a `logging`.
      * Questo assicura che il `queueBuilder` generi una coda semplice (`[logging, rest, logging, rest...]`) per gli esercizi in modalità manuale, come pianificato.

  4.  **`src/core/trainer.js`:**
      * **Loop Principale:** Il `runWorkoutLoop` (linea 11) è stato rifattorizzato da un `for` loop a un `while` loop. Questo è il cambiamento architetturale fondamentale che abilita la navigazione (skip).
      * **Nuova Funzione `skipPhase(direction)`:** Aggiunta una nuova funzione (esportata) che permette di navigare la coda. Ferma qualsiasi animazione, aggiorna il `currentQueueIndex` e riavvia il loop dal nuovo indice.
      * **Nuova Logica `logging`:** La `case 'manual_rep'` (linea 42) è stata rinominata in `case 'logging'` e ora utilizza il nuovo meccanismo di "await": `await new Promise(resolve => { updateState({ resolveCurrentSetPromise: resolve }); });`. Questo mette in pausa il loop finché la UI non chiama `confirmCurrentSet`.
      * **Nuova Funzione `confirmCurrentSet(setDataFromUI)`:** Questa nuova funzione (esportata) sostituisce la vecchia `incrementManualRep`. Viene chiamata dalla UI (in Fase 2) e passa i dati *reali* del set. Chiama `collectSetData` con questi dati e poi "risolve" la Promise, facendo avanzare il `runWorkoutLoop` alla fase successiva (di solito, il riposo).
      * **`collectSetData` Aggiornata:** La funzione (linea 78) ora accetta `setDataFromUI` (opzionale). Se fornito (dalla modalità `logging`), registra i dati reali. Se non fornito, torna al comportamento precedente e registra i dati pianificati (dalla modalità `guided`).

  Questo commit completa tutta la logica "invisibile". La Fase 2 si concentrerà sull'aggiornamento della UI in `TrainerComponent.js` per chiamare le nuove funzioni `skipPhase` e `confirmCurrentSet`.
