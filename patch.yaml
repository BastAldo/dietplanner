commit_message: "refactor(trainer): Implement fully declarative queue builder and fix bugs"
rationale: |
  This patch refactors the trainer module to follow a fully declarative architecture, resolving a set of critical bugs including duplicate initial announcements, missing rest period announcements, and incorrect timer styling during rest. The changes align the implementation with the approved architectural plan.

  **Problem Analysis & Implemented Solution:**

  1.  **Mixed Imperative/Declarative Logic:** The core issue was that the `queueBuilder.js` did not treat all workout phases as pre-defined, template-based flows. Rest periods and next-exercise announcements were created imperatively ("manually"), leading to inconsistencies like missing `text` properties, which caused them to be skipped by the execution loop.

  2.  **Redundant Logic in Execution Start:** The `startWorkout` function in `trainer.js` contained redundant logic. It would manually trigger the first announcement *before* starting the main execution loop, which would then trigger the same announcement again, causing a duplicate on the first run.

  **Architectural Refactoring:**

  * **`src/config/trainerFlows.js`:** The logic has been made more granular and declarative by introducing new exported templates: `REST_FLOW` and `NEXT_EXERCISE_ANNOUNCEMENT_FLOW`. This encapsulates the entire logic for these phases into reusable, self-contained units.

  * **`src/core/trainer/queueBuilder.js`:** The builder has been significantly simplified. It no longer contains any logic for manually creating commands. When a rest period or a next-exercise announcement is needed, it now invokes `interpretTemplate` with the corresponding new flow. This ensures every single command in the final execution queue is processed uniformly, guaranteeing its integrity and fixing the root cause of the skipped announcements and subsequent UI style bugs.

  * **`src/core/trainer.js`:** The `startWorkout` function has been corrected. The redundant, manual `speak()` call has been removed. The function's sole responsibilities are now to play the initial audio cue, set the state to 'running', and start the `runWorkoutLoop`. The loop itself handles the first announcement as a natural part of the pre-built queue.

  * **`docs/02_ARCHITECTURE.md`:** The architecture documentation has been updated to reflect this more robust, declarative, and template-driven design. The description of the trainer's execution cycle now accurately represents the new, cleaner implementation.

  These changes together create a more stable, predictable, and maintainable trainer module that adheres strictly to the project's architectural principles.
