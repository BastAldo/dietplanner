commit_message: "refactor(core): Risolve errore di importazione e standardizza l'architettura degli interactions"
rationale: |
  Questa patch esegue un refactoring completo della gestione della vista "Grafici" per risolvere un errore critico di importazione e per allineare il codice a una convenzione architetturale coerente, migliorando la robustezza e la manutenibilità dell'intera applicazione.

  **Problema:**
  Il file `main.js` tentava di importare `initializeChartsListeners` da `src/ui/interactions/chartsInteractions.js`, ma questa funzione non esisteva. La logica di gestione degli eventi era invece erroneamente mescolata con la logica di rendering all'interno di `src/ui/charts.js`.

  **Soluzione Implementata:**
  1.  **Separazione delle Responsabilità (SRP):**
      - La logica di gestione degli eventi (event listeners per i filtri data, etc.) è stata spostata da `src/ui/charts.js` al file corretto, `src/ui/interactions/chartsInteractions.js`.
      - È stata creata la funzione `initializeChartsListeners` in `chartsInteractions.js` per incapsulare tutta la logica di binding degli eventi, come previsto dall'architettura generale.

  2.  **Pulizia e Specializzazione dei Moduli:**
      - Il file `src/ui/charts.js` è stato ripulito e ora contiene esclusivamente le funzioni ausiliarie per la creazione delle istanze dei grafici e la preparazione dei dati, senza più gestire le interazioni dell'utente.
      - Le funzioni per la manipolazione dei dati dei grafici, precedentemente in `chartsInteractions.js`, sono state spostate in `charts.js`, consolidando tutta la logica relativa ai dati dei grafici in un unico posto.

  3.  **Correzione delle Dipendenze:**
      - L'importazione in `main.js` è stata corretta per puntare alla nuova funzione `initializeChartsListeners`.
      - Le dipendenze tra `pageRenderers.js` e `charts.js` sono state aggiornate per riflettere la nuova struttura.

  Questo intervento non solo risolve il bug, ma previene errori futuri rafforzando un'architettura chiara e prevedibile per la gestione delle interazioni utente e del rendering.
