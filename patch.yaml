commit_message: "fix(UX): Corregge audio, flusso di uscita del trainer, scrollbar e scroll iniziale"
rationale: |
  Questa patch cumulativa risolve diversi bug critici di funzionalità e usabilità nell'interfaccia del trainer e nei modali, basandosi su un'analisi approfondita del feedback dell'utente.

  **1. Correzione della Funzionalità Audio (Mute/Unmute):**
  * **Problema:** Il pulsante per attivare/disattivare l'audio durante un allenamento non funzionava perché lo stato dell'audio veniva letto una sola volta all'inizio del loop di esecuzione.
  * **Soluzione:** La logica in `src/core/trainer.js` è stata modificata per controllare lo stato di `isAudioEnabled` in tempo reale, direttamente prima di ogni riproduzione audio o vocale, rendendo il pulsante istantaneamente reattivo.

  **2. Refactoring del Flusso di Uscita dall'Allenamento:**
  * **Problema:** Il pulsante "Scarta Allenamento" non funzionava e mancava un'opzione per annullare la decisione di terminare l'allenamento.
  * **Soluzione:** È stato implementato un nuovo flusso a due passaggi in `src/ui/components/TrainerComponent.js`:
      1. Il primo modale ora chiede se l'utente vuole terminare, con un'opzione "No, continua" per annullare e riprendere l'allenamento.
      2. Se si prosegue, un secondo modale offre la scelta finale tra "Salva" e "Scarta", risolvendo il bug precedente e rendendo il processo più chiaro e sicuro.
  * Per supportare questo, sono stati aggiunti nuovi testi a `src/config/uiText.js`.

  **3. Stilizzazione della Scrollbar dei Modali:**
  * **Problema:** La scrollbar di default del browser era esteticamente incoerente con il tema scuro dell'applicazione.
  * **Soluzione:** Sono state aggiunte regole CSS custom in `styles/modals.css` per stilizzare la scrollbar all'interno di `.modal-body`, rendendola sottile e cromaticamente integrata con il design.

  **4. Correzione Definitiva dello Scroll della Pagina Trainer:**
  * **Problema:** All'apertura su mobile, la pagina del trainer risultava scorlata verso il basso.
  * **Soluzione:** In `src/ui/renderer.js`, la chiamata `window.scrollTo(0, 0)` è stata inserita in un `setTimeout(..., 0)`. Questa tecnica standard di JavaScript posticipa l'esecuzione dello scroll alla fine del ciclo di rendering del browser, garantendo che la vista sia sempre posizionata correttamente in cima.
