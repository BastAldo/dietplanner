  - file: style.css
    content: |
      :root {
        --color-background: #121212;
        --color-surface: #1E1E1E;
        --color-border: #2E2E2E;
        --color-text-primary: #EAEAEA;
        --color-text-secondary: #8E8E8E;
        --color-primary: #28a745;
        --color-error: #cf6679;
        --color-warning: #ffc107;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Roboto', sans-serif; background-color: var(--color-background); color: var(--color-text-primary); }
      header { text-align: center; padding: 1.5rem 1rem; background-color: var(--color-surface); border-bottom: 1px solid var(--color-border); }
      header .subtitle { font-size: 1rem; color: var(--color-text-secondary); max-width: 40ch; margin: 0.5rem auto 0; }
      footer { padding: 1rem 1.5rem; background-color: var(--color-surface); border-top: 1px solid var(--color-border); text-align: center; }
      h1, h2, h3 { font-weight: 700; color: var(--color-text-primary); }
      .data-source-container { display: flex; align-items: center; gap: 0.5rem; padding: 1rem 1.5rem; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
      #config-url-input { flex-grow: 1; min-width: 0; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 8px; font-size: 1rem; background-color: #333; color: var(--color-text-primary); }
      #info-icon { font-size: 1.5rem; cursor: pointer; color: var(--color-text-secondary); flex-shrink: 0; }
      .main-container { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
      
      .calendar-grid {
        display: flex;
        overflow-x: auto;
        gap: 1rem;
        padding-bottom: 1rem;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .calendar-grid::-webkit-scrollbar { display: none; }
      .day-card { background: var(--color-surface); border-radius: 8px; border: 1px solid var(--color-border); padding: 1rem; flex: 0 0 90%; }
      .day-header { font-weight: 700; font-size: 1.2rem; margin-bottom: 0.5rem; }
      .daily-calories { font-size: 0.8rem; color: var(--color-text-secondary); margin-bottom: 0.75rem; min-height: 1.2em; }
      .day-slots { display: grid; grid-template-columns: 1fr 3fr; gap: 0.75rem; align-items: center; }
      .meal-type-label-mobile { font-weight: 500; text-align: right; color: var(--color-text-secondary); }
      .grid-header, .meal-type-label { display: none; }
      .calendar-slot { position: relative; min-height: 80px; border: 2px dashed var(--color-border); border-radius: 8px; padding: 0.5rem; background-color: var(--color-background); cursor: pointer; }
      .calendar-slot:not(:empty) { cursor: default; border-style: solid; }
      
      @media (min-width: 992px) {
        .calendar-grid { display: grid; grid-template-columns: 0.7fr repeat(7, 2fr); overflow-x: visible; }
        .day-card { display: none; }
        .grid-header, .meal-type-label { display: block; font-weight: 500; padding: 0.5rem; text-align: center; color: var(--color-text-secondary); }
        .meal-type-label { text-align: right; align-self: center; }
        .grid-header .daily-calories { text-align: center; margin-top: 0.25rem; }
      }

      .meal-card { position: relative; height: 100%; padding: 0.75rem; border: 1px solid var(--color-border); background-color: var(--color-surface); border-radius: 8px; }
      .meal-card.is-mismatched { border-color: var(--color-warning); border-width: 2px; }
      .delete-meal-btn { position: absolute; top: 2px; right: 5px; background: none; border: none; font-size: 1.5rem; color: var(--color-text-secondary); cursor: pointer; opacity: 0; transition: opacity 0.2s; }
      .calendar-slot .meal-card:hover .delete-meal-btn { opacity: 1; }
      .btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: 1px solid transparent; font-weight: 500; cursor: pointer; }
      .btn-primary { background-color: var(--color-primary); color: #121212; font-weight: bold; }
      .btn-secondary { color: var(--color-text-secondary); border-color: var(--color-border); background-color: transparent; }
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
      .modal-content { background: var(--color-surface); padding: 2rem; border-radius: 8px; max-width: 600px; width: 90%; position: relative; border: 1px solid var(--color-border); }
      .modal-close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--color-text-secondary); }
      .modal-hidden { display: none !important; }
      .modal-content pre { background: var(--color-background); padding: 1rem; border-radius: 4px; margin-top: 1rem; overflow-x: auto; }
      .notification-box { max-width: 400px; border-left: 5px solid; }
      .notification-box.is-success { border-left-color: var(--color-primary); }
      .notification-box.is-error { border-left-color: var(--color-error); }
      .selection-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 60vh; overflow-y: auto; }
      .selection-item { padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 8px; cursor: pointer; }
      .selection-item:hover { background-color: var(--color-background); }
