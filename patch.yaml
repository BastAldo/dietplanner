commit_message: "feat(trainer): Aggiunge i moduli core/trainer e ui/trainerRenderer"
rationale: |
  Questo commit introduce le fondamenta logiche per la Vista Trainer, creando i moduli per la gestione dello stato e per il rendering, in linea con il principio di Separazione delle Responsabilità.

  Le modifiche principali sono:

  1.  **Creazione Macchina a Stati (`src/core/trainer.js`):**
      * È stato creato un nuovo modulo che ospiterà la logica della sessione di allenamento.
      * Contiene una struttura per lo stato (`workoutState`) che traccerà l'esercizio corrente, la coda degli esercizi, lo stato di esecuzione (es. 'idle', 'running') e i contatori.
      * È stata implementata la funzione `initializeWorkout` che prende gli esercizi pianificati dal Global State e costruisce lo stato iniziale per la sessione di allenamento.

  2.  **Creazione Renderer (`src/ui/trainerRenderer.js`):**
      * È stato creato un nuovo modulo di rendering, `renderTrainerView`.
      * Questa funzione è responsabile di leggere lo stato da `trainer.js` e di aggiornare la UI in `templates/trainer.html`.
      * In questa fase iniziale, il renderer popola la vista con i dati statici dell'allenamento all'avvio: il nome del primo esercizio, i dettagli di serie/ripetizioni e la lista degli esercizi "A seguire".

  3.  **Integrazione nel Flusso Applicativo:**
      * Il `renderer.js` principale è stato aggiornato per importare e chiamare `renderTrainerView` quando l'utente naviga alla vista 'trainer'.
      * Il gestore di eventi in `modals.js` è stato modificato per chiamare `initializeWorkout` prima di cambiare la vista, assicurando che lo stato del trainer sia pronto prima del rendering.
      * I nuovi file sono stati aggiunti al Service Worker (`sw.js`) per il caching e l'uso offline.

  Con questo aggiornamento, l'applicazione è ora in grado di caricare i dati di un allenamento pianificato in uno stato dedicato e di visualizzare le informazioni iniziali nella Vista Trainer.
