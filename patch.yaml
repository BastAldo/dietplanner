  - file: style.css
    content: |
      :root {
        --color-background: #F8F9FA; --color-surface: #FFFFFF; --color-border: #E9ECEF;
        --color-text-primary: #212529; --color-text-secondary: #6C757D;
        --color-primary: #28a745; --color-error: #dc3545; --color-warning: #ffc107;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Roboto', sans-serif; background-color: var(--color-background); color: var(--color-text-primary); }
      header, footer { padding: 1rem 1.5rem; background-color: var(--color-surface); border-bottom: 1px solid var(--color-border); text-align: center; }
      footer { border-top: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
      h1, h2, h3 { font-weight: 700; }
      h2 { margin-bottom: 1rem; }
      .data-source-container { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.5rem; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
      #config-url-input { flex-grow: 1; padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 8px; font-size: 1rem; }
      #info-icon { font-size: 1.5rem; cursor: pointer; color: var(--color-text-secondary); }
      .main-container { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
      
      .calendar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .day-card { background: var(--color-surface); border-radius: 8px; border: 1px solid var(--color-border); padding: 1rem; }
      .day-header { font-weight: 700; font-size: 1.2rem; margin-bottom: 0.75rem; }
      .day-slots { display: grid; grid-template-columns: 1fr 3fr; gap: 0.75rem; align-items: center; }
      .meal-type-label-mobile { font-weight: 500; text-align: right; }
      .grid-header, .meal-type-label { display: none; }
      .calendar-slot { position: relative; min-height: 80px; border: 2px dashed var(--color-border); border-radius: 8px; padding: 0.5rem; background-color: var(--color-surface); cursor: pointer; }
      .calendar-slot:not(:empty) { cursor: default; border-style: solid; }
      
      @media (min-width: 992px) {
        .calendar-grid { display: grid; grid-template-columns: 1fr repeat(7, 2fr); gap: 0.5rem; }
        .day-card, .day-header, .day-slots, .meal-type-label-mobile { display: none; }
        .grid-header, .meal-type-label { display: block; font-weight: 500; padding: 0.5rem; text-align: center; }
        .meal-type-label { text-align: right; align-self: center; }
      }

      .meal-card { position: relative; height: 100%; padding: 0.75rem; border: 1px solid var(--color-border); background-color: var(--color-surface); border-radius: 8px; }
      .meal-card.is-mismatched { border-color: var(--color-warning); border-width: 2px; }
      .delete-meal-btn { position: absolute; top: 2px; right: 5px; background: none; border: none; font-size: 1.5rem; color: var(--color-text-secondary); cursor: pointer; opacity: 0; transition: opacity 0.2s; }
      .calendar-slot .meal-card:hover .delete-meal-btn { opacity: 1; }
      .btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: 1px solid transparent; font-weight: 500; cursor: pointer; }
      .btn-primary { background-color: var(--color-primary); color: white; }
      .btn-secondary { color: var(--color-text-secondary); border-color: var(--color-border); }
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
      .modal-content { background: white; padding: 2rem; border-radius: 8px; max-width: 600px; width: 90%; position: relative; }
      .modal-close-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; }
      .modal-hidden { display: none !important; }
      .modal-content pre { background: var(--color-background); padding: 1rem; border-radius: 4px; margin-top: 1rem; overflow-x: auto; }
      .notification-box { max-width: 400px; border-left: 5px solid; }
      .notification-box.is-success { border-left-color: var(--color-primary); }
      .notification-box.is-error { border-left-color: var(--color-error); }
      .selection-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 60vh; overflow-y: auto; }
      .selection-item { padding: 0.75rem; border: 1px solid var(--color-border); border-radius: 8px; cursor: pointer; }
      .selection-item:hover { background-color: var(--color-background); }
  - file: src/main.js
    content: |
      import { loadStateFromLocalStorage, getState, setPlannerConfig } from './core/state.js';
      import { renderApp } from './ui/renderer.js';
      import { initializeEventListeners } from './ui/interactions.js';
      import { DEFAULT_CONFIG_URL } from './utils/constants.js';
      import { fetchAndParseConfig } from './api/configService.js';
      import { showNotification } from './ui/notifications.js';

      async function loadInitialConfig(url) {
        if (!url) return;
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config);
        } catch (error) {
          showNotification(error.message, 'error');
        }
      }

      function init() {
        document.addEventListener('stateChange', renderApp);
        loadStateFromLocalStorage();
        const initialState = getState();
        document.getElementById('config-url-input').value = initialState.configUrl || DEFAULT_CONFIG_URL;
        initializeEventListeners();
        renderApp();
        loadInitialConfig(initialState.configUrl);
      }
      document.addEventListener('DOMContentLoaded', init);
  - file: src/api/configService.js
    content: |
      export async function fetchAndParseConfig(url) {
        if (!url) throw new Error("Per favore, inserisci un URL valido.");
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Errore di rete: ${response.status}`);
          const config = await response.json();
          if (!config.rules || !config.meals) {
            throw new Error("Il file JSON non è valido. Mancano le chiavi 'rules' o 'meals'.");
          }
          return config;
        } catch (error) {
          console.error("Fallimento fetch/parse JSON:", error);
          throw new Error(`Impossibile caricare la configurazione. Controlla la console.`);
        }
      }
  - file: src/core/state.js
    content: |
      import { LOCAL_STORAGE_KEY_PLAN, LOCAL_STORAGE_KEY_URL } from '../utils/constants.js';
      let state = { rules: [], masterMealList: [], weeklyPlan: {}, configUrl: '' };
      const notify = () => document.dispatchEvent(new CustomEvent('stateChange'));
      export const getState = () => ({ ...state });
      export function setPlannerConfig(config) {
        state.rules = config.rules || [];
        state.masterMealList = config.meals || [];
        notify();
      }
      export function setConfigUrl(url) { state.configUrl = url; localStorage.setItem(LOCAL_STORAGE_KEY_URL, url); }
      export function saveStateToLocalStorage() { localStorage.setItem(LOCAL_STORAGE_KEY_PLAN, JSON.stringify(state.weeklyPlan)); }
      export function loadStateFromLocalStorage() {
        const plan = localStorage.getItem(LOCAL_STORAGE_KEY_PLAN);
        const url = localStorage.getItem(LOCAL_STORAGE_KEY_URL);
        if (plan) { state.weeklyPlan = JSON.parse(plan); }
        if (url) { state.configUrl = url; }
      }
      export function updateWeeklyPlan(slotId, mealId) {
        if (mealId) { state.weeklyPlan[slotId] = mealId; } 
        else { delete state.weeklyPlan[slotId]; }
        saveStateToLocalStorage();
        notify();
      }
      export function resetWeeklyPlan() { state.weeklyPlan = {}; saveStateToLocalStorage(); notify(); }
  - file: src/core/validation.js
    content: |
      // Il motore di validazione è mantenuto per future regole bloccanti.
      // Attualmente non viene chiamato attivamente dall'interfaccia.
      export function isPlacementValid(mealToAdd, slotId, weeklyPlan, masterMealList, rules) {
        for (const rule of rules) {
          if (mealToAdd.etichette && mealToAdd.etichette.includes(rule.tag)) {
            const result = applyRule(rule, mealToAdd, slotId, weeklyPlan, masterMealList);
            if (!result.isValid) return result;
          }
        }
        return { isValid: true, message: null };
      }
      function applyRule(rule, mealToAdd, slotId, weeklyPlan, masterMealList) {
        if (rule.type === 'daily-block') {
          const day = slotId.split('-')[0];
          let count = 0;
          for (const key in weeklyPlan) {
            if (key.startsWith(day) && key !== slotId) {
              const meal = masterMealList.find(m => m.id === weeklyPlan[key]);
              if (meal && meal.etichette && meal.etichette.includes(rule.tag)) count++;
            }
          }
          if (count >= rule.limit) return { isValid: false, message: rule.message };
        }
        return { isValid: true, message: null };
      }
  - file: src/ui/interactions.js
    content: |
      import { updateWeeklyPlan, resetWeeklyPlan, setPlannerConfig, setConfigUrl } from '../core/state.js';
      import { fetchAndParseConfig } from '../api/configService.js';
      import { showNotification } from './notifications.js';
      import { openSelectionModal } from './renderer.js';

      async function handleLoadConfig() {
        const url = document.getElementById('config-url-input').value.trim();
        setConfigUrl(url);
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config);
          showNotification('Configurazione caricata!', 'success');
        } catch (error) {
          showNotification(error.message, 'error');
        }
      }

      function handleCalendarClick(e) {
        const slot = e.target.closest('.calendar-slot');
        if (!slot) return;
        
        const deleteButton = e.target.closest('.delete-meal-btn');
        if (deleteButton) {
          updateWeeklyPlan(deleteButton.dataset.slotId, null);
          return;
        }

        if (slot.childElementCount === 0) {
          openSelectionModal(slot.dataset.slotId);
        }
      }
      
      export function initializeEventListeners() {
        document.getElementById('reset-btn').addEventListener('click', () => { if(confirm('Sei sicuro?')) resetWeeklyPlan(); });
        document.getElementById('print-btn').addEventListener('click', () => window.print());
        document.getElementById('load-config-btn').addEventListener('click', handleLoadConfig);
        document.getElementById('info-icon').addEventListener('click', () => document.getElementById('info-modal').classList.remove('modal-hidden'));
        document.querySelectorAll('.modal-close-btn').forEach(btn => {
          btn.addEventListener('click', (e) => document.getElementById(e.target.dataset.target).classList.add('modal-hidden'));
        });
        document.getElementById('calendar-grid').addEventListener('click', handleCalendarClick);
      }
  - file: src/ui/renderer.js
    content: |
      import { getState, updateWeeklyPlan } from '../core/state.js';
      import { DAYS, MEAL_TYPES } from '../utils/constants.js';
      
      const selectionModal = document.getElementById('selection-modal');
      const selectionModalTitle = document.getElementById('selection-modal-title');
      const selectionModalList = document.getElementById('selection-modal-list');

      function createMealCardHTML(meal, slotId, mealType) {
          const isMismatched = meal.tipoPasto !== mealType ? 'is-mismatched' : '';
          return `<div class="meal-card ${isMismatched}">
              <button class="delete-meal-btn" data-slot-id="${slotId}">&times;</button>
              <h4>${meal.nomePasto}</h4>
              <p>${meal.ingredienti || ''}</p>
            </div>`;
      }

      function renderDesktopCalendar(element, state) {
        element.innerHTML = '';
        element.insertAdjacentHTML('beforeend', '<div class="meal-type-label"></div>' + DAYS.map(day => `<div class="grid-header">${day}</div>`).join(''));
        MEAL_TYPES.forEach(mealType => {
          element.insertAdjacentHTML('beforeend', `<div class="meal-type-label">${mealType}</div>`);
          DAYS.forEach(day => {
            const slotId = `${day}-${mealType}`;
            const mealId = state.weeklyPlan[slotId];
            const meal = mealId ? state.masterMealList.find(m => m.id === mealId) : null;
            const mealCardHTML = meal ? createMealCardHTML(meal, slotId, mealType) : '';
            element.insertAdjacentHTML('beforeend', `<div class="calendar-slot" data-slot-id="${slotId}">${mealCardHTML}</div>`);
          });
        });
      }
      
      function renderMobileCalendar(element, state) {
        element.innerHTML = '';
        DAYS.forEach(day => {
          const dayCard = document.createElement('div');
          dayCard.className = 'day-card';
          dayCard.innerHTML = `<div class="day-header">${day}</div><div class="day-slots"></div>`;
          const slotsContainer = dayCard.querySelector('.day-slots');
          MEAL_TYPES.forEach(mealType => {
            const slotId = `${day}-${mealType}`;
            const mealId = state.weeklyPlan[slotId];
            const meal = mealId ? state.masterMealList.find(m => m.id === mealId) : null;
            const mealCardHTML = meal ? createMealCardHTML(meal, slotId, mealType) : '';
            slotsContainer.innerHTML += `
              <div class="meal-type-label-mobile">${mealType}</div>
              <div class="calendar-slot" data-slot-id="${slotId}">${mealCardHTML}</div>
            `;
          });
          element.appendChild(dayCard);
        });
      }

      export function openSelectionModal(slotId) {
        const state = getState();
        const [day, mealType] = slotId.split('-');
        selectionModalTitle.textContent = `Scegli ${mealType} per ${day}`;
        const relevantMeals = state.masterMealList.filter(m => m.tipoPasto === mealType || m.tipoPasto === 'Tutti');
        if(relevantMeals.length > 0) {
            selectionModalList.innerHTML = relevantMeals.map(meal => 
            `<div class="selection-item" data-meal-id="${meal.id}">
                <h4>${meal.nomePasto}</h4>
                <p>${meal.ingredienti || ''}</p>
            </div>`
            ).join('');
        } else {
            selectionModalList.innerHTML = "<p>Nessun pasto di questo tipo disponibile.</p>";
        }
        
        selectionModalList.onclick = (e) => {
          const item = e.target.closest('.selection-item');
          if(item) {
            updateWeeklyPlan(slotId, item.dataset.mealId);
            selectionModal.classList.add('modal-hidden');
          }
        };
        selectionModal.classList.remove('modal-hidden');
      }

      export function renderApp() {
        const state = getState();
        const calendarGrid = document.getElementById('calendar-grid');

        if (state.masterMealList.length === 0 && Object.keys(state.weeklyPlan).length === 0) {
            calendarGrid.innerHTML = '<p>Carica una configurazione per visualizzare il calendario.</p>';
            return;
        }

        if (window.matchMedia('(min-width: 992px)').matches) {
          renderDesktopCalendar(calendarGrid, state);
        } else {
          renderMobileCalendar(calendarGrid, state);
        }
        
        const urlInput = document.getElementById('config-url-input');
        if (document.activeElement !== urlInput) { urlInput.value = state.configUrl; }
      }
  - file: src/ui/notifications.js
    content: |
      const modal = document.getElementById('notification-modal');
      const messageElement = document.getElementById('notification-message');
      const modalContent = modal.querySelector('.modal-content');

      export function showNotification(message, type = 'info') {
        messageElement.textContent = message;
        modalContent.className = 'modal-content notification-box';
        if (type === 'success' || type === 'error') {
          modalContent.classList.add(`is-${type}`);
        }
        modal.classList.remove('modal-hidden');
      }
  - file: src/utils/constants.js
