commit_message: "debug(trainer): Aggiunge log strutturati per diagnosi"
rationale: |
  Questa patch non ha lo scopo di correggere il bug, ma di instrumentare il codice per l'analisi. Vengono aggiunti dei console.log strategici per tracciare il flusso dei dati dalla macchina a stati fino al renderer del DOM.

  L'obiettivo è rispondere a due domande fondamentali:
  1.  La macchina a stati in `src/core/trainer.js` sta calcolando correttamente i progressi dell'allenamento ad ogni tick?
  2.  Il renderer in `src/ui/trainerRenderer.js` sta ricevendo questi dati e sta tentando di applicare i valori corretti all'elemento SVG?

  I log sono stati strutturati con prefissi chiari (`[STATE]`, `[RENDER]`) per rendere l'output della console facilmente leggibile e permettere di seguire il ciclo di vita di un singolo tick, dalla logica alla visualizzazione.
patches:
  - file: src/core/trainer.js
    content: |
      import { setView } from './state.js';

      let workoutState = {
        exerciseQueue: [],
        currentExerciseIndex: -1,
        status: 'idle', // idle, running, paused, resting, finished
        prePauseStatus: '',
        currentSet: 0,
        currentRep: 0,
        executionQueue: [],
        currentPhaseIndex: -1,
        phaseTimeElapsed: 0,
        restTimeRemaining: 0,
      };

      let timerInterval = null;
      const TICK_RATE_MS = 50;

      function buildExecutionQueueForCurrentSet() {
        const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
        if (!currentExercise) return [];

        const queue = [];
        const reps = currentExercise.defaultReps;
        const tempo = currentExercise.defaultTempo;

        for (let i = 0; i < reps; i++) {
          if (tempo) {
            queue.push({ name: 'pre-up', rep: i + 1, duration: 700 });
            queue.push({ name: 'up', rep: i + 1, duration: tempo.up * 1000 });
            queue.push({ name: 'pre-hold', rep: i + 1, duration: 700 });
            queue.push({ name: 'hold', rep: i + 1, duration: tempo.hold * 1000 });
            queue.push({ name: 'pre-down', rep: i + 1, duration: 700 });
            queue.push({ name: 'down', rep: i + 1, duration: tempo.down * 1000 });
          }
        }
        console.log('[STATE] Coda di esecuzione (stati pre-compilati) creata:', queue);
        return queue;
      }

      function advanceToNextSet() {
        workoutState.currentSet++;
        const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
        if (workoutState.currentSet > currentExercise.defaultSets) {
          advanceToNextExercise();
        } else {
          workoutState.status = 'running';
          workoutState.executionQueue = buildExecutionQueueForCurrentSet();
          workoutState.currentPhaseIndex = 0;
          workoutState.phaseTimeElapsed = 0;
          workoutState.currentRep = 1;
        }
      }

      function advanceToNextExercise() {
        workoutState.currentExerciseIndex++;
        if (workoutState.currentExerciseIndex >= workoutState.exerciseQueue.length) {
          endWorkout();
        } else {
          workoutState.status = 'idle';
          workoutState.currentSet = 1;
          workoutState.currentRep = 1;
          workoutState.executionQueue = [];
          workoutState.currentPhaseIndex = -1;
        }
      }

      function tick() {
        if (workoutState.status === 'running') {
          workoutState.phaseTimeElapsed += TICK_RATE_MS;
          const currentPhase = workoutState.executionQueue[workoutState.currentPhaseIndex];

          console.log(`[STATE] Tick: status=${workoutState.status}, phase=${currentPhase ? currentPhase.name : 'N/A'}, phaseTime=${workoutState.phaseTimeElapsed}`);

          if (!currentPhase) {
            pauseWorkout();
            return;
          }
          if (workoutState.phaseTimeElapsed >= currentPhase.duration) {
            workoutState.currentPhaseIndex++;
            workoutState.phaseTimeElapsed = 0;
            const nextPhase = workoutState.executionQueue[workoutState.currentPhaseIndex];
            if (nextPhase) {
              workoutState.currentRep = nextPhase.rep;
            } else {
              const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
              workoutState.status = 'resting';
              workoutState.restTimeRemaining = currentExercise.defaultRest * 1000;
            }
          }
        } else if (workoutState.status === 'resting') {
          workoutState.restTimeRemaining -= TICK_RATE_MS;
          console.log(`[STATE] Tick: status=${workoutState.status}, restTimeRemaining=${workoutState.restTimeRemaining}`);
          if (workoutState.restTimeRemaining <= 0) {
            advanceToNextSet();
          }
        }
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function getWorkoutState() {
        return workoutState;
      }

      export function initializeWorkout(plannedExercises) {
        if (!plannedExercises || plannedExercises.length === 0) {
          return;
        }
        clearInterval(timerInterval);
        timerInterval = null;

        workoutState = {
          exerciseQueue: JSON.parse(JSON.stringify(plannedExercises)),
          currentExerciseIndex: 0,
          status: 'idle',
          prePauseStatus: '',
          currentSet: 1,
          currentRep: 1,
          executionQueue: [],
          currentPhaseIndex: -1,
          phaseTimeElapsed: 0,
          restTimeRemaining: 0,
        };
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function startWorkout() {
        if (workoutState.status === 'idle') {
          workoutState.status = 'running';
          workoutState.executionQueue = buildExecutionQueueForCurrentSet();
          workoutState.currentPhaseIndex = 0;
          workoutState.phaseTimeElapsed = 0;
          workoutState.currentRep = 1;
          if (!timerInterval) {
            timerInterval = setInterval(tick, TICK_RATE_MS);
          }
        }
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function pauseWorkout() {
        if (workoutState.status === 'running' || workoutState.status === 'resting') {
          workoutState.prePauseStatus = workoutState.status;
          workoutState.status = 'paused';
          clearInterval(timerInterval);
          timerInterval = null;
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function resumeWorkout() {
        if (workoutState.status === 'paused') {
          workoutState.status = workoutState.prePauseStatus;
          workoutState.prePauseStatus = '';
          if (!timerInterval) {
            timerInterval = setInterval(tick, TICK_RATE_MS);
          }
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function endWorkout() {
        workoutState.status = 'finished';
        clearInterval(timerInterval);
        timerInterval = null;
        setView('planner');
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }
  - file: src/ui/trainerRenderer.js
    content: |
      import { getWorkoutState, startWorkout, pauseWorkout, resumeWorkout, endWorkout } from '../core/trainer.js';
      import { setView } from '../core/state.js';

      let ringProgress, ringText;
      const RING_RADIUS = 80;
      const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
      let lastRenderedStatus = '';

      function createTimerRing(container) {
          if (container.querySelector('svg')) {
              ringProgress = container.querySelector('.timer-ring-progress');
              ringProgress.style.strokeDasharray = RING_CIRCUMFERENCE;
              return;
          }
          container.innerHTML = '';
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('width', '200');
          svg.setAttribute('height', '200');
          svg.setAttribute('viewBox', '0 0 200 200');

          const backgroundCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          backgroundCircle.setAttribute('cx', '100');
          backgroundCircle.setAttribute('cy', '100');
          backgroundCircle.setAttribute('r', RING_RADIUS);
          backgroundCircle.setAttribute('class', 'timer-ring-bg');

          const progressCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          progressCircle.setAttribute('cx', '100');
          progressCircle.setAttribute('cy', '100');
          progressCircle.setAttribute('r', RING_RADIUS);
          progressCircle.setAttribute('class', 'timer-ring-progress');
          progressCircle.style.strokeDasharray = RING_CIRCUMFERENCE;

          svg.appendChild(backgroundCircle);
          svg.appendChild(progressCircle);
          container.prepend(svg);
          ringProgress = progressCircle;
      }

      function formatExerciseDetails(exercise, set) {
        if (!exercise) return '';
        const sets = exercise.defaultSets;
        let details = `Serie ${set} di ${sets}`;
        if (exercise.type === 'reps') {
          const reps = exercise.defaultReps;
          details += ` | ${reps} Ripetizioni`;
        } else if (exercise.type === 'time') {
          const duration = exercise.defaultDuration;
          details += ` | ${duration}s`;
        }
        return details;
      }

      function renderPhase(state) {
        const { executionQueue, currentPhaseIndex, phaseTimeElapsed } = state;
        const phase = executionQueue[currentPhaseIndex];
        
        console.log('[RENDER] Chiamata renderPhase.');

        if (!phase || !ringProgress || !ringText) {
          console.error('[RENDER] Errore: `renderPhase` chiamata senza fase, ring o testo disponibili.');
          return;
        }

        const phaseNameDisplay = phase.name.replace('pre-', '').toUpperCase();
        ringText.textContent = phaseNameDisplay;

        const progress = phaseTimeElapsed / phase.duration;
        const offset = RING_CIRCUMFERENCE * (1 - Math.min(progress, 1));
        
        console.log(`[RENDER] Dati per SVG: progress=${progress.toFixed(2)}, offsetCalcolato=${offset.toFixed(2)}`);
        
        ringProgress.style.strokeDashoffset = offset;
      }

      function renderRest(state) {
        console.log('[RENDER] Chiamata renderRest.');
        const { restTimeRemaining } = state;
        const secondsRemaining = Math.ceil(restTimeRemaining / 1000);
        if (!ringText || !ringProgress) return;
        ringText.textContent = secondsRemaining;
        ringProgress.style.strokeDashoffset = RING_CIRCUMFERENCE;
      }

      export function renderTrainerView() {
        const state = getWorkoutState();
        const { exerciseQueue, currentExerciseIndex, status } = state;

        if (currentExerciseIndex < 0 || currentExerciseIndex >= exerciseQueue.length) return;

        if (status !== lastRenderedStatus) {
            console.log(`[RENDER] Cambio di stato rilevato: da '${lastRenderedStatus}' a '${status}'. Aggiorno i controlli.`);
            lastRenderedStatus = status;

            const controlsContainer = document.getElementById('trainer-main-controls');
            if (status === 'idle') {
              controlsContainer.innerHTML = `<button id="trainer-start-btn" class="btn btn-primary btn-large">AVVIA</button>`;
              if(ringText) ringText.textContent = '';
              if(ringProgress) ringProgress.style.strokeDashoffset = RING_CIRCUMFERENCE;
            } else if (status === 'running' || status === 'resting') {
              controlsContainer.innerHTML = `<button id="trainer-pause-btn" class="btn btn-secondary btn-large">PAUSA</button>`;
            } else if (status === 'paused') {
              controlsContainer.innerHTML = `<button id="trainer-resume-btn" class="btn btn-primary btn-large">RIPRENDI</button>`;
            } else {
              controlsContainer.innerHTML = '';
            }
        }

        if (status === 'running') {
            renderPhase(state);
        } else if (status === 'resting') {
            renderRest(state);
        }
      }

      export function initializeTrainerUI() {
          console.log('[RENDER] Inizializzazione UI Trainer.');
          lastRenderedStatus = '';
          document.removeEventListener('workoutStateChange', renderTrainerView);
          document.addEventListener('workoutStateChange', renderTrainerView);

          const ringContainer = document.getElementById('timer-ring-container');
          createTimerRing(ringContainer);
          ringText = document.getElementById('tempo-phase-name');

          const page = document.getElementById('trainer-page');
          const newPage = page.cloneNode(true);
          page.parentNode.replaceChild(newPage, page);

          newPage.addEventListener('click', (e) => {
              if (e.target.id === 'trainer-start-btn') startWorkout();
              if (e.target.id === 'trainer-pause-btn') pauseWorkout();
              if (e.target.id === 'trainer-resume-btn') resumeWorkout();
              if (e.target.id === 'trainer-end-btn') endWorkout();
              if (e.target.id === 'trainer-back-btn') setView('planner');
          });
      }
