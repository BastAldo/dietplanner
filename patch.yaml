commit_message: "feat: Implementa tracciamento dati biometrici (Fase 1)"
rationale: |
  In linea con il piano approvato, questa patch introduce le fondamenta della nuova funzionalità di tracciamento biometrico, trasformando l'applicazione in uno strumento di monitoraggio del progresso personale.

  1.  **Aggiornamento Architetturale e Documentazione**: È stata introdotta una nuova struttura dati `biometricData` nello stato globale per memorizzare le misurazioni dell'utente. Questa modifica è stata formalizzata in `docs/02_ARCHITECTURE.md`, e le relative User Stories (US-26, US-27) sono state aggiunte a `docs/01_FUNCTIONALITY.md` per documentare le nuove capacità di inserimento e visualizzazione.

  2.  **Logica di Stato e Persistenza**: Il file `src/core/state.js` è stato esteso per gestire il ciclo di vita dei dati biometrici, includendo funzioni per aggiungere, aggiornare ed eliminare misurazioni. La persistenza è garantita tramite `localStorage` e, criticamente, la nuova struttura dati è stata integrata nelle funzioni di backup e ripristino in `src/ui/interactions.js`, assicurando la completa portabilità dei dati utente.

  3.  **Nuova Vista "Progressi"**: È stata creata una nuova vista dedicata nell'interfaccia utente. In `index.html` è stato aggiunto un pulsante allo switcher di navigazione e il contenitore per la nuova schermata. Il rendering di questa vista è gestito da `src/ui/renderer.js`, che ora include un form per l'inserimento dati e una tabella per la visualizzazione dello storico. I nuovi stili sono stati aggiunti a `style.css` e tutte le stringhe di testo sono state centralizzate in `src/utils/constants.js`.
