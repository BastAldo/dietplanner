  - file: src/api/mealService.js
    content: |
      import { CSV_URL } from '../utils/constants.js';

      /**
       * Scarica e processa il file CSV dei pasti.
       * @returns {Promise<Array<Object>>} Una promessa che risolve in un array di oggetti pasto.
       */
      export async function fetchAndParseMeals() {
        try {
          const response = await fetch(CSV_URL);
          if (!response.ok) {
            throw new Error(`Errore HTTP: ${response.status}`);
          }
          const csvText = await response.text();
          return parseCSV(csvText);
        } catch (error) {
          console.error("Impossibile caricare i dati dei pasti:", error);
          alert("Errore nel caricamento dei pasti. Controlla la console per i dettagli.");
          return [];
        }
      }

      /**
       * Funzione base per il parsing del CSV.
       * @param {string} text - Il contenuto testuale del file CSV.
       * @returns {Array<Object>}
       */
      function parseCSV(text) {
        const lines = text.trim().split('\n');
        const headers = lines[0].split('\t').map(h => h.trim());
        
        return lines.slice(1).map(line => {
          const values = line.split('\t').map(v => v.trim());
          const mealObject = {};
          headers.forEach((header, index) => {
            mealObject[header] = values[index];
          });
          return mealObject;
        });
      }
  - file: src/core/state.js
    content: |
      import { LOCAL_STORAGE_KEY } from '../utils/constants.js';

      let appState = {
        masterMealList: [],
        weeklyPlan: {}, // Es: { 'Lunedì-Pranzo': '1', 'Martedì-Cena': '3' }
      };

      /**
       * Emette un evento custom per notificare all'UI che lo stato è cambiato.
       */
      function notifyStateChange() {
        document.dispatchEvent(new CustomEvent('stateChange'));
      }

      export function setMasterMealList(meals) {
        appState.masterMealList = meals;
        notifyStateChange();
      }

      export function updateWeeklyPlan(slotId, mealId) {
        if (mealId) {
          appState.weeklyPlan[slotId] = mealId;
        } else {
          delete appState.weeklyPlan[slotId];
        }
        saveStateToLocalStorage();
        notifyStateChange();
      }

      export function resetWeeklyPlan() {
        appState.weeklyPlan = {};
        saveStateToLocalStorage();
        notifyStateChange();
      }

      export function getState() {
        return { ...appState };
      }

      export function saveStateToLocalStorage() {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(appState.weeklyPlan));
      }

      export function loadStateFromLocalStorage() {
        const savedPlan = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (savedPlan) {
          appState.weeklyPlan = JSON.parse(savedPlan);
        }
      }
  - file: src/core/validation.js
    content: |
      /**
       * Controlla se un pasto contenente soia può essere aggiunto in un dato giorno.
       * @param {string} day - Il giorno in cui si vuole aggiungere il pasto (es. 'Lunedì').
       * @param {Object} mealToAdd - L'oggetto pasto che si sta cercando di aggiungere.
       * @param {Object} weeklyPlan - Lo stato attuale del piano settimanale.
       * @param {Array<Object>} masterMealList - La lista completa dei pasti.
       * @returns {boolean} - True se il pasto può essere aggiunto, altrimenti false.
       */
      export function isSoyMealAllowed(day, mealToAdd, weeklyPlan, masterMealList) {
        // Se il pasto da aggiungere non contiene soia, è sempre permesso.
        if (!mealToAdd.etichette.includes('contiene-soia')) {
          return true;
        }

        // Cerca un altro pasto con soia nello stesso giorno.
        const lunchSlotId = `${day}-Pranzo`;
        const dinnerSlotId = `${day}-Cena`;

        const lunchMealId = weeklyPlan[lunchSlotId];
        const dinnerMealId = weeklyPlan[dinnerSlotId];

        if (lunchMealId) {
            const lunchMeal = masterMealList.find(m => m.id === lunchMealId);
            if (lunchMeal && lunchMeal.etichette.includes('contiene-soia')) return false;
        }

        if (dinnerMealId) {
            const dinnerMeal = masterMealList.find(m => m.id === dinnerMealId);
            if (dinnerMeal && dinnerMeal.etichette.includes('contiene-soia')) return false;
        }

        return true;
      }
  - file: src/ui/calendar.js
    content: |
      import { DAYS, MEAL_TYPES } from '../utils/constants.js';

      /**
       * Renderizza l'intera griglia del calendario.
       * @param {HTMLElement} element - L'elemento contenitore della griglia.
       * @param {Object} state - Lo stato corrente dell'applicazione.
       */
      export function renderCalendar(element, state) {
        element.innerHTML = ''; // Pulisce la griglia prima di ridisegnare

        // Aggiunge gli header dei giorni
        element.innerHTML += '<div class="grid-header"></div>'; // Angolo vuoto
        DAYS.forEach(day => {
          element.innerHTML += `<div class="grid-header">${day}</div>`;
        });

        // Aggiunge le righe per tipo di pasto
        MEAL_TYPES.forEach(mealType => {
          element.innerHTML += `<div class="meal-type-label">${mealType}</div>`;
          DAYS.forEach(day => {
            const slotId = `${day}-${mealType}`;
            const mealId = state.weeklyPlan[slotId];
            const meal = mealId ? state.masterMealList.find(m => m.id === mealId) : null;
            
            element.innerHTML += `
              <div class="calendar-slot" data-slot-id="${slotId}">
                ${meal ? createMealCardHTML(meal) : ''}
              </div>
            `;
          });
        });
      }

      /**
       * Crea l'HTML per una singola card di un pasto.
       * @param {Object} meal - L'oggetto pasto.
       * @returns {string} La stringa HTML della card.
       */
      function createMealCardHTML(meal) {
        return `
          <div class="meal-card" draggable="true" data-meal-id="${meal.id}">
            <h4>${meal.nomePasto}</h4>
            <p>${meal.ingredienti}</p>
          </div>
        `;
      }
  - file: src/ui/library.js
    content: |
      /**
       * Renderizza la libreria dei pasti disponibili.
       * @param {HTMLElement} element - L'elemento contenitore della libreria.
       * @param {Object} state - Lo stato corrente dell'applicazione.
       */
      export function renderMealLibrary(element, state) {
        element.innerHTML = ''; // Pulisce la libreria
        state.masterMealList.forEach(meal => {
          const card = document.createElement('div');
          card.className = 'meal-card';
          card.setAttribute('draggable', 'true');
          card.dataset.mealId = meal.id;
          
          card.innerHTML = `
            <h4>${meal.nomePasto}</h4>
            <p>(${meal.tipoPasto})</p>
          `;
          
          element.appendChild(card);
        });
      }
  - file: src/ui/interactions.js
    content: |
      import { getState, updateWeeklyPlan, resetWeeklyPlan } from '../core/state.js';
      import { isSoyMealAllowed } from '../core/validation.js';

      let draggedMealId = null;

      /**
       * Inizializza tutti gli event listener dell'interfaccia.
       */
      export function initializeEventListeners() {
        const mealLibrary = document.getElementById('meal-library');
        const calendarGrid = document.getElementById('calendar-grid');
        const resetBtn = document.getElementById('reset-btn');
        const printBtn = document.getElementById('print-btn');

        // Eventi Drag & Drop sulla libreria
        mealLibrary.addEventListener('dragstart', (e) => {
          if (e.target.classList.contains('meal-card')) {
            draggedMealId = e.target.dataset.mealId;
            e.target.classList.add('dragging');
          }
        });

        mealLibrary.addEventListener('dragend', (e) => {
          if (e.target.classList.contains('meal-card')) {
            draggedMealId = null;
            e.target.classList.remove('dragging');
          }
        });

        // Eventi Drag & Drop sul calendario
        calendarGrid.addEventListener('dragover', (e) => {
          if (e.target.classList.contains('calendar-slot')) {
            e.preventDefault();
            e.target.classList.add('drop-target');
          }
        });
        
        calendarGrid.addEventListener('dragleave', (e) => {
          if (e.target.classList.contains('calendar-slot')) {
            e.target.classList.remove('drop-target');
          }
        });

        calendarGrid.addEventListener('drop', (e) => {
          e.preventDefault();
          const slot = e.target.closest('.calendar-slot');
          if (slot && draggedMealId) {
            slot.classList.remove('drop-target');
            const { masterMealList, weeklyPlan } = getState();
            const mealToAdd = masterMealList.find(m => m.id === draggedMealId);
            const day = slot.dataset.slotId.split('-')[0];

            if (isSoyMealAllowed(day, mealToAdd, weeklyPlan, masterMealList)) {
              updateWeeklyPlan(slot.dataset.slotId, draggedMealId);
            } else {
              alert('Regola violata: Non è possibile consumare due pasti con soia nello stesso giorno.');
            }
          }
        });
        
        // Eventi Pulsanti
        resetBtn.addEventListener('click', () => {
          if(confirm('Sei sicuro di voler svuotare l\'intero piano settimanale?')) {
            resetWeeklyPlan();
          }
        });

        printBtn.addEventListener('click', () => {
          window.print();
        });
      }
  - file: src/main.js
    content: |
      import { fetchAndParseMeals } from './api/mealService.js';
      import { setMasterMealList, loadStateFromLocalStorage, getState } from './core/state.js';
      import { renderCalendar } from './ui/calendar.js';
      import { renderMealLibrary } from './ui/library.js';
      import { initializeEventListeners } from './ui/interactions.js';

      // Elementi del DOM
      const calendarGridElement = document.getElementById('calendar-grid');
      const mealLibraryElement = document.getElementById('meal-library');

      /**
       * Funzione principale di render, chiamata ogni volta che lo stato cambia.
       */
      function renderApp() {
        const currentState = getState();
        renderCalendar(calendarGridElement, currentState);
        renderMealLibrary(mealLibraryElement, currentState);
      }

      /**
       * Funzione di inizializzazione dell'applicazione.
       */
      async function init() {
        // Aggiunge un listener per l'evento custom 'stateChange'
        document.addEventListener('stateChange', renderApp);

        // Carica lo stato salvato (se presente)
        loadStateFromLocalStorage();

        // Carica i pasti dal CSV e aggiorna lo stato
        const meals = await fetchAndParseMeals();
        setMasterMealList(meals); // Questo triggererà il primo render tramite l'evento

        // Inizializza tutti gli event listener
        initializeEventListeners();
        
        // Render iniziale (potrebbe essere ridondante se setMasterMealList è sincrono, ma sicuro)
        renderApp();
      }

      // Avvia l'applicazione
      document.addEventListener('DOMContentLoaded', init);
