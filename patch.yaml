commit_message: "feat: Implement mobile-first UX with tap-to-select modal"
rationale: |
  This commit completely revamps the mobile user experience based on critical feedback. It addresses two major issues: the non-functional drag-and-drop on touch devices and the broken calendar layout on narrow viewports.

  Key Changes:
  1.  **Responsive Calendar Layout:** The calendar grid now transforms into a vertical, agenda-style list on screens smaller than 768px, fixing all horizontal overflow issues.
  2.  **Tap-to-Select Modal:** Drag-and-drop is now disabled on mobile. Instead, tapping a calendar slot opens a dedicated modal (`#selection-modal`) pre-filtered with relevant meals, providing a native touch-friendly workflow.
  3.  **Progressive Enhancement:** The drag-and-drop functionality is preserved for desktop users (screens wider than 768px), ensuring the best experience for each context.
  4.  **Documentation Update:** All relevant documentation has been updated to reflect the new mobile layout and interaction model.
