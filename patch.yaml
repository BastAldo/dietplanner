commit_message: "fix(trainer): Corregge bug debriefing e migliora UI trainer/modale"
rationale: |
  Questo commit implementa le correzioni e i miglioramenti dell'interfaccia utente come richiesto.

  1.  **Correzione Bug Debriefing "Incompleto" (`src/core/trainer.js`):**
      * È stato identificato un bug per cui gli allenamenti in modalità "logging" venivano segnati come "incompleti".
      * Causa: La funzione `collectSetData` veniva chiamata due volte: una correttamente da `confirmCurrentSet` (con i dati della UI) e una seconda volta, in modo errato, dalla fase `set_completed` (senza dati, creando un set "fantasma").
      * Soluzione: Il `case 'set_completed'` nel `runWorkoutLoop` è stato modificato. Ora include un controllo per verificare se la fase *precedente* era di tipo `logging`. Se lo era, `collectSetData` non viene chiamato, prevenendo la registrazione duplicata e risolvendo il bug del debriefing.

  2.  **Miglioramento UI Trainer (`templates/trainer.html`, `styles/trainer.css`, `src/ui/components/TrainerComponent.js`):**
      * L'interfaccia utente per la modalità "logging" (input di peso, reps e checkbox "a cedimento") è stata spostata *all'interno* del `timer-ring-container`.
      * `styles/trainer.css` è stato aggiornato per posizionare questi controlli in modo assoluto al centro del contenitore.
      * `TrainerComponent.js` è stato aggiornato:
          * Ora, invece di nascondere l'intero contenitore, nasconde selettivamente l'elemento `<svg>` del timer o i controlli di `logging` (che ora condividono lo stesso spazio).
          * `createTimerRing` ora memorizza un riferimento all'SVG (`this.elements.ringSvg`).
          * `renderPaused` è stato aggiornato per garantire che l'SVG sia visibile e i controlli di logging siano nascosti durante la pausa.

  3.  **Correzione Stile Select (`styles/modals.css`, `src/ui/modals/exerciseEditorModal.js`):**
      * Per risolvere l'incoerenza stilistica, è stato aggiunto uno stile CSS in `styles/modals.css` che si applica a tutti gli elementi `select` all'interno di un `.form-group`.
      * Questo stile uniforma l'aspetto del menu a discesa "Modalità Esecuzione" per farlo corrispondere agli altri campi di input (`--bg-color`, `--card-color`, ecc.), come richiesto dalla `docs/03_STYLE_GUIDE.md`. Non è stato necessario modificare `exerciseEditorModal.js`.
