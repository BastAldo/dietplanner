commit_message: "refactor(core): Centralize UI strings and fix module export bug"
rationale: |
  This commit addresses two critical issues: a JavaScript module export error that was breaking functionality, and a significant amount of hardcoded text that violated the project's architectural principles.

  1.  **Bug Fix**: A `SyntaxError` was occurring because the `showRecipeModal` function in `src/ui/renderer.js` was not being exported, preventing `src/ui/interactions.js` from importing it. The `export` keyword has been added to the function definition, resolving the critical bug.

  2.  **String Centralization**: In adherence to the project's single source of truth principle for UI text, all hardcoded strings from `interactions.js` and `renderer.js` have been moved into the `UI_TEXT` object in `src/utils/constants.js`. This includes notification messages, modal titles, confirmation dialogs, and button labels.

  3.  **Code Refactoring**: The `interactions.js` and `renderer.js` files have been refactored to import the `UI_TEXT` object and use these constants instead of hardcoded strings.

  4.  **UI Population**: The `index.html` file has been updated with new IDs for buttons, and the `populateInitialText` function in `renderer.js` has been expanded to set their text from the newly centralized constants, ensuring consistency.
