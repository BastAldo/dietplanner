commit_message: "feat(calendar): Implement definitive day-centric calendar view"
rationale: |
  This commit provides a complete and definitive implementation of the new day-centric calendar view, resolving the failures of previous attempts. The previous patches were incomplete, causing a conflict between the new CSS and the old JavaScript rendering logic.

  This comprehensive patch synchronizes the HTML structure, the CSS styles, the state management, and the rendering/interaction logic to deliver the fully functional new interface:

  1.  **State Management (`core/state.js`):** The application state now includes a `focusedDate` property to manage which week is currently being viewed, making the calendar dynamic. Actions for navigating (`PREV_WEEK`, `NEXT_WEEK`) have been added.

  2.  **HTML Structure (`index.html`):** The calendar view now includes the necessary header with navigation buttons (`prev-week-btn`, `next-week-btn`) and a title for the displayed week.

  3.  **Interaction Logic (`ui/interactions.js`):** Event listeners for the new week navigation buttons are now correctly initialized and dispatch the appropriate actions to the store.

  4.  **Rendering Logic (`ui/renderer.js`):** The renderer has been completely rewritten to be state-driven. It now correctly reads `focusedDate` from the state to display the appropriate week, generates the 7 "day-cell" cards, and updates the week title dynamically.

  5.  **CSS Correction (`style.css`):** All legacy/conflicting calendar styles have been removed. The stylesheet now contains the correct, simplified rules for the new responsive "day-cell" grid and the new calendar header.

  This commit finally aligns the application with the approved 'healtypro' design vision, providing a stable foundation for the next development steps.
