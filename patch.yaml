    content: |
      # Funzionalità: Protocollo Dinamico v1.1

      ## 1. Visione Generale
      Una web app frontend-only, responsiva, che permette a un utente di pianificare il proprio protocollo alimentare settimanale caricando una configurazione JSON che include sia i pasti sia le regole di validazione personalizzate.

      ## 2. User Stories (Cosa l'utente può fare)
      * **US-1 (Caricamento Dati):** Come utente, voglio poter caricare un elenco di pasti e un set di regole da un file di configurazione JSON remoto.
      * **US-2 (Visualizzazione):** ... (invariato)
      * **US-3 (Pianificazione):** ... (invariato)
      * **US-4 (Validazione Dinamica):** Come utente, voglio che l'app applichi le regole definite nel JSON (es. blocco giornaliero per un certo tag) quando pianifico i pasti.
      * **US-5 (Persistenza):** ... (invariato)
      * **US-6 (Pasto Libero):** ... (invariato)
      * **US-7 (Reset):** ... (invariato)
      * **US-8 (Stampa):** ... (invariato)
      * **US-9 (Data Source Configurabile):** Come utente, voglio poter inserire l'URL di un mio file JSON per caricare una configurazione personalizzata.
      * **US-10 (UI Responsiva):** ... (invariato)
      * **US-11 (Cancellazione Pasti):** Come utente, voglio poter rimuovere facilmente un pasto che ho inserito nel calendario per errore.
      * **US-12 (Filtro Libreria):** Come utente, voglio poter filtrare la lista dei pasti per tipo (Pranzo/Cena) per trovare più velocemente quello che cerco.
      * **US-13 (Feedback Visivo):** Come utente, voglio che l'app mi segnali con un colore diverso se inserisco un pasto di tipo "Cena" in uno slot "Pranzo" e viceversa.
  - file: docs/02_ARCHITECTURE.md
    content: |
      # Architettura: Protocollo Dinamico v1.1

      ## 1. Principi Guida
      * **Data-Driven:** La logica di business (regole di validazione) è delegata a un file di configurazione esterno, non è hardcoded nell'applicazione.
      * **Frontend-Only, KISS, SRP:** (invariati)

      ## 2. Formato Dati: `planner-config.json`
      L'applicazione è guidata da un singolo file JSON con due sezioni principali:
      * **`rules`**: Un array di oggetti regola. Ogni oggetto definisce un `tag`, un `type` di regola (es. `daily-block`), un `limit` e un `message` di errore. Questo permette di definire la logica di business senza modificare il codice.
      * **`meals`**: Un array di oggetti pasto, che costituisce la libreria a disposizione dell'utente.

      ## 3. Struttura dei File
      ```
      .
      └── src/
          ├── api/
          │   └── configService.js  # Sostituisce mealService, gestisce il JSON
          ├── core/
          │   ├── state.js        # Gestisce lo stato (inclusi filtri e regole)
          │   └── validation.js   # Motore di validazione generico basato sulle regole
          ├── ui/
          │   ├── ...
          │   └── notifications.js
          └── utils/
              └── constants.js
      ```

      ## 4. Flusso di Validazione
      Quando un utente sposta un pasto, `interactions.js` chiama il motore di validazione in `validation.js`. Il motore non conosce la "soia", ma itera sull'array `rules` presente nello stato. Per ogni regola, controlla se il pasto ha il `tag` corrispondente e, in caso affermativo, applica la logica del `type` di regola (es. `daily-block`). Se una regola fallisce, il processo si interrompe e viene mostrato il `message` di errore associato.
