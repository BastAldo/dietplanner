  - file: docs/01_FUNCTIONALITY.md
    content: |
      # Funzionalità: HealtyPro (ex NutriPlan)

      ## 1. Visione Generale
      Una web app frontend-only, installabile (PWA), per creare e gestire piani alimentari flessibili per l'intera giornata (colazione, spuntini, pranzo e cena) con conteggio calorico e regole di validazione personalizzate.

      L'interfaccia utente è stata completamente rinnovata per adottare un design system unificato (ispirato a MTP), con un tema scuro, componenti moderni e un flusso di interazione migliorato per la pianificazione giornaliera.

      ## 2. User Stories
      * **US-1 (Caricamento Dati):** L'utente può caricare una configurazione da un file JSON remoto.
      * **US-2 (Visualizzazione Calendario):** L'utente vede un calendario settimanale "day-centric". Ogni giorno è una card che riassume le informazioni principali (es. calorie totali).
      * **US-3 (Pianificazione via Modale):** L'utente clicca su una card del giorno per aprire un modale di editing centralizzato, dove può gestire tutti i pasti di quella giornata.
      * **US-4 (Validazione Dinamica):** L'utente vuole che l'app applichi le regole definite nel JSON (es. blocco giornaliero per un certo tag).
      * **US-11 (Cancellazione Pasti):** L'utente può rimuovere un pasto inserito.
      * **US-15 (Layout Mobile Leggibile):** Su mobile, il calendario è una lista di card giornaliere.
      * **US-16 (Conteggio Calorie Flessibile):** L'utente vede il totale calorico per ogni giorno direttamente sulla card del calendario.
      * **US-17 (Installazione):** Come utente, voglio poter installare l'app sulla mia home screen o desktop per un accesso rapido.
      * **US-18 (Uso Offline):** Come utente, voglio poter aprire e usare l'app anche senza connessione internet, dopo averla visitata la prima volta.
      * **US-19 (Chiusura Modale Esterna):** Come utente, voglio poter chiudere qualsiasi modale cliccando sull'area scura esterna ad esso, per un'interazione più rapida.
      * **US-20 (Registro Pasti Settimanale Dettagliato):** Come utente, voglio poter passare a una vista registro per vedere l'elenco di tutti i pasti pianificati, con il dettaglio calorico per singolo pasto e il totale giornaliero.
      * **US-21 (Copia Settimana):** Come utente, voglio poter copiare il piano alimentare della settimana precedente a quella attuale con un solo click per velocizzare la pianificazione.
      * **US-22 (Visualizzazione Ricetta):** Come utente, voglio poter visualizzare la ricetta di un pasto, se disponibile, cliccando su un'icona presente sia nell'editor del giorno che nella vista registro.
      * **US-23 (Condivisione Configurazione Sicura):** Come utente, voglio poter generare un link per condividere il mio `config.json`. All'apertura del link, se la configurazione è diversa da quella in uso, l'app mi chiederà conferma prima di caricarla per evitare perdite di dati.
      * **US-24 (Backup Dati Locale Flessibile):** Come utente, voglio poter salvare un backup dei miei dati come file di testo (`.txt`) utilizzando, dove supportato, la funzione di condivisione nativa del mio dispositivo.
      * **US-25 (Ripristino da Backup Locale):** Come utente, voglio poter caricare un file di backup (`.txt` o `.json`) precedentemente salvato per ripristinare il mio `configUrl` e il mio `weeklyPlan`, con una richiesta di conferma prima di sovrascrivere i dati esistenti.
      * **US-26 (Inserimento Dati Biometrici):** Come utente, voglio poter inserire e modificare le mie misurazioni biometriche (peso, massa grassa, etc.) per una data specifica tramite un form dedicato.
      * **US-27 (Visualizzazione Storico Biometrico):** Come utente, voglio poter visualizzare una tabella con lo storico di tutte le misurazioni biometriche che ho inserito, ordinate per data.
      * **US-29 (Profilo Utente):** L'utente può inserire e salvare i suoi dati personali (nome, data di nascita, altezza, sesso) in una pagina dedicata.
      * **US-30 (Navigazione Principale):** L'utente può navigare tra le sezioni Planner, Progressi e Profilo tramite un menu principale nell'header.
      * **US-31 (Calcolo Automatico BMR):** L'applicazione calcola automaticamente il Metabolismo Basale (BMR) dell'utente utilizzando la formula Mifflin-St Jeor, basandosi sui dati del profilo e sull'ultimo peso inserito.
  - file: docs/02_ARCHITECTURE.md
    content: |
      # Architettura: HealtyPro (ex NutriPlan)

      ## 1. Principi Guida
      * **PWA-First:** L'applicazione è progettata per essere installabile e funzionare offline.
      * **Minimalism & Simplicity (KISS):** L'interfaccia utente è stata ridisegnata per essere essenziale e intuitiva. La base di codice sottostante rimane semplice e basata su Vanilla JS.
      * **Data-Driven:** La logica di business (regole, pasti) è definita nel file JSON di configurazione.
      * **Maintainability (SRP):** I testi dell'interfaccia (stringhe) sono centralizzati e ogni file ha una sola responsabilità.

      ## 2. Architettura SPA Multi-Vista
      L'applicazione è una **Single Page Application (SPA)** strutturata in viste che emulano pagine separate per una migliore organizzazione. Un singolo file `index.html` contiene i contenitori per ogni vista, e la logica in `renderer.js` gestisce la visualizzazione della vista attiva in base allo stato `currentView`. Le viste principali sono:
      * **Planner**: Contiene la gestione della configurazione, il calendario e il registro dei pasti.
      * **Progressi**: Dedicata all'inserimento e alla visualizzazione dei dati biometrici.
      * **Profilo**: Permette all'utente di inserire i propri dati anagrafici.

      ## 3. Architettura PWA
      L'applicazione include due componenti chiave per la funzionalità PWA:
      * **`manifest.json`**: Fornisce i metadati per l'installazione (nome, icone, colori).
      * **`sw.js` (Service Worker)**: Mette in cache i file statici dell'app ("app shell") per abilitare il funzionamento offline.

      ## 4. Logica di Business (`src/core/calculations.js`)
      Le logiche di calcolo complesse, come il calcolo dell'età e del Metabolismo Basale (BMR) tramite la formula Mifflin-St Jeor, sono isolate in un modulo dedicato per mantenere il codice pulito e testabile.

      ## 5. Strutture Dati Chiave
      L'applicazione si basa su tre strutture dati principali salvate nel `localStorage`.

      ### 5.1. `userProfile`
      Un oggetto che contiene i dati anagrafici dell'utente.
      * **Esempio Oggetto:**
        ```json
        {
          "firstName": "Mario",
          "lastName": "Rossi",
          "dateOfBirth": "1988-05-20",
          "height": 180,
          "gender": "male"
        }
        ```

      ### 5.2. `weeklyPlan`
      Questa struttura contiene i pasti pianificati dall'utente. Viene salvata una copia completa dell'oggetto pasto per garantire la resilienza dei dati.

      ### 5.3. `biometricData`
      Un array che contiene lo storico delle misurazioni biometriche dell'utente.

      ## 6. Dipendenze di Terze Parti
      * **Marked.js & DOMPurify**: Caricate via CDN per il rendering sicuro delle ricette da Markdown.
  - file: src/core/calculations.js
    content: |
      export function calculateAge(dateString) {
        if (!dateString) return null;
        const birthDate = new Date(dateString);
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
          age--;
        }
        return age;
      }

      export function calculateBMR(userProfile, weight) {
        if (!userProfile || !weight || !userProfile.dateOfBirth || !userProfile.height || !userProfile.gender) {
          return null;
        }

        const age = calculateAge(userProfile.dateOfBirth);
        const height = parseFloat(userProfile.height);
        const weightFloat = parseFloat(weight);

        if (isNaN(age) || isNaN(height) || isNaN(weightFloat)) return null;

        let bmr;
        // Formula Mifflin-St Jeor: P = 10m + 6.25h - 5a + s
        // m = peso in kg, h = altezza in cm, a = età in anni, s è +5 per uomini e -161 per donne.
        if (userProfile.gender === 'male') {
          bmr = (10 * weightFloat) + (6.25 * height) - (5 * age) + 5;
        } else if (userProfile.gender === 'female') {
          bmr = (10 * weightFloat) + (6.25 * height) - (5 * age) - 161;
        } else {
          return null; // Gender not specified or invalid
        }

        return Math.round(bmr);
      }
  - file: src/ui/interactions.js
    content: |
      import {
        resetCurrentWeek, setPlannerConfig, setConfigUrl, navigateWeek, setView,
        copyPreviousWeek, getState, setAppState, addOrUpdateBiometricEntry,
        deleteBiometricEntry, saveUserProfile
      } from '../core/state.js';
      import { calculateBMR } from '../core/calculations.js';
      import { fetchAndParseConfig } from '../api/configService.js';
      import { showNotification } from './notifications.js';
      import { openDayEditorModal, showConfirmModal, showRecipeModal } from './renderer.js';
      import { UI_TEXT } from '../utils/constants.js';

      async function handleLoadConfig() {
        const url = document.getElementById('config-url-input').value.trim();
        if (!url) { showNotification(UI_TEXT.CONFIG_URL_EMPTY_ERROR, 'error'); return; }
        setConfigUrl(url);
        try {
          const config = await fetchAndParseConfig(url);
          setPlannerConfig(config);
          showNotification(UI_TEXT.CONFIG_LOAD_SUCCESS, 'success');
        } catch (error) { showNotification(error.message, 'error'); }
      }

      function handleCalendarClick(e) {
        const dayCell = e.target.closest('.day-cell');
        if (dayCell) { openDayEditorModal(dayCell.dataset.date); }
      }

      function handleLogViewClick(e) {
        const btnRecipe = e.target.closest('.btn-view-recipe');
        if (btnRecipe) {
          const state = getState();
          const meal = state.masterMealList.find(m => m.id === btnRecipe.dataset.mealId);
          if (meal) { showRecipeModal(meal); }
        }
      }

      function handleShareConfig() {
        const state = getState();
        if (!state.configUrl) { showNotification(UI_TEXT.SHARE_NO_URL_INFO, 'info'); return; }
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?configUrl=${encodeURIComponent(state.configUrl)}`;
        navigator.clipboard.writeText(shareUrl).then(() => {
          showNotification(UI_TEXT.SHARE_SUCCESS, 'success');
        }).catch(() => { showNotification(UI_TEXT.SHARE_ERROR, 'error'); });
      }

      function triggerDownload(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification(UI_TEXT.BACKUP_SUCCESS, 'success');
      }

      async function handleSaveBackup() {
        const state = getState();
        const backupData = {
          configUrl: state.configUrl,
          weeklyPlan: state.weeklyPlan,
          biometricData: state.biometricData,
          userProfile: state.userProfile
        };
        const fileName = 'healtypro_backup.txt';
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'text/plain' });
        const file = new File([blob], fileName, { type: 'text/plain' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ title: UI_TEXT.BACKUP_SHARE_TITLE, files: [file] });
          } catch (error) {
            if (error.name !== 'AbortError') {
              console.warn('Web Share API failed, falling back to download:', error);
              triggerDownload(blob, fileName);
            }
          }
        } else { triggerDownload(blob, fileName); }
      }

      function handleRestoreBackup() {
          const fileInput = document.createElement('input');
          fileInput.type = 'file';
          fileInput.accept = '.json,.txt,application/json,text/plain';
          fileInput.onchange = e => {
              const file = e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = readerEvent => {
                  try {
                      const content = readerEvent.target.result;
                      const backupData = JSON.parse(content);
                      if (typeof backupData.configUrl === 'string' && typeof backupData.weeklyPlan === 'object') {
                          showConfirmModal(
                              UI_TEXT.RESTORE_CONFIRM_TITLE,
                              UI_TEXT.RESTORE_CONFIRM_MSG,
                              () => { setAppState(backupData); showNotification(UI_TEXT.RESTORE_SUCCESS, 'success'); },
                              'danger'
                          );
                      } else { throw new Error('Invalid structure'); }
                  } catch (err) { showNotification(UI_TEXT.RESTORE_INVALID_FILE, 'error'); }
              };
              reader.readAsText(file);
          };
          fileInput.click();
      }

      function handleCopyWeek() {
        showConfirmModal(
          UI_TEXT.COPY_WEEK_CONFIRM_TITLE, UI_TEXT.COPY_WEEK_CONFIRM_MSG,
          () => { copyPreviousWeek(); showNotification(UI_TEXT.COPY_WEEK_SUCCESS, 'success'); }, 'primary'
        );
      }

      function handleResetWeek() {
        showConfirmModal(
          UI_TEXT.RESET_WEEK_CONFIRM_TITLE, UI_TEXT.RESET_WEEK_CONFIRM_MSG,
          () => { resetCurrentWeek(); showNotification(UI_TEXT.RESET_WEEK_SUCCESS, 'info'); }, 'danger'
        );
      }
      
      function handleBiometricsForm(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        const entry = {};
        for (let [key, value] of formData.entries()) { entry[key] = value; }
        addOrUpdateBiometricEntry(entry);
        showNotification(UI_TEXT.BIOMETRICS_SAVE_SUCCESS, 'success');
      }

      function handleBiometricsTableClick(e) {
        const btnEdit = e.target.closest('.btn-edit-biometrics');
        const btnDelete = e.target.closest('.btn-delete-biometrics');
        if (btnEdit) {
            const date = btnEdit.dataset.date;
            const entry = getState().biometricData.find(e => e.date === date);
            if (entry) {
                const form = document.getElementById('biometrics-form');
                for (const key in entry) {
                    if (form.elements[key]) { form.elements[key].value = entry[key]; }
                }
                form.scrollIntoView({ behavior: 'smooth' });
            }
        } else if (btnDelete) {
            const date = btnDelete.dataset.date;
            showConfirmModal(
                UI_TEXT.BIOMETRICS_DELETE_CONFIRM_TITLE, UI_TEXT.BIOMETRICS_DELETE_CONFIRM_MSG,
                () => { deleteBiometricEntry(date); showNotification(UI_TEXT.BIOMETRICS_DELETE_SUCCESS, 'info'); }, 'danger'
            );
        }
      }

      function handleProfileForm(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        const profile = {};
        for (let [key, value] of formData.entries()) { profile[key] = value; }
        saveUserProfile(profile);
        showNotification(UI_TEXT.PROFILE_SAVE_SUCCESS, 'success');
      }

      function handleWeightInputChange(e) {
        const weight = e.target.value;
        const { userProfile } = getState();
        const bmrField = document.getElementById('bio-basalMetabolism');
        const bmr = calculateBMR(userProfile, weight);
        if (bmr !== null) {
          bmrField.value = bmr;
        } else {
          bmrField.value = '';
          bmrField.placeholder = UI_TEXT.BIOMETRICS_BMR_PLACEHOLDER;
        }
      }

      export function initializeEventListeners() {
        document.getElementById('backup-btn').addEventListener('click', handleSaveBackup);
        document.getElementById('restore-btn').addEventListener('click', handleRestoreBackup);
        document.getElementById('info-icon').addEventListener('click', () => document.getElementById('info-modal').classList.remove('modal-hidden'));
        document.getElementById('nav-planner').addEventListener('click', () => setView('planner'));
        document.getElementById('nav-progress').addEventListener('click', () => setView('progress'));
        document.getElementById('nav-profile').addEventListener('click', () => setView('profile'));
        document.getElementById('load-config-btn').addEventListener('click', handleLoadConfig);
        document.getElementById('share-config-btn').addEventListener('click', handleShareConfig);
        document.getElementById('calendar-grid').addEventListener('click', handleCalendarClick);
        document.getElementById('log-view').addEventListener('click', handleLogViewClick);
        document.getElementById('prev-week-btn').addEventListener('click', () => navigateWeek(-1));
        document.getElementById('next-week-btn').addEventListener('click', () => navigateWeek(1));
        document.getElementById('view-calendar-btn').addEventListener('click', () => setView('planner'));
        document.getElementById('view-log-btn').addEventListener('click', () => setView('log'));
        document.getElementById('copy-week-btn').addEventListener('click', handleCopyWeek);
        document.getElementById('reset-btn').addEventListener('click', handleResetWeek);
        document.getElementById('biometrics-form').addEventListener('submit', handleBiometricsForm);
        document.getElementById('biometrics-table').addEventListener('click', handleBiometricsTableClick);
        document.getElementById('profile-form').addEventListener('submit', handleProfileForm);
        
        // Listener per il calcolo BMR in tempo reale
        document.getElementById('progress-page').addEventListener('input', e => {
          if (e.target.id === 'bio-weight') { handleWeightInputChange(e); }
        });

        document.querySelectorAll('.modal-close-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            const modalId = e.target.dataset.target;
            if (modalId) { document.getElementById(modalId).classList.add('modal-hidden'); }
          });
        });
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
          overlay.addEventListener('click', e => { if (e.target === overlay) { overlay.classList.add('modal-hidden'); } });
        });
        document.getElementById('global-alert-close').addEventListener('click', () => { document.getElementById('global-alert').classList.add('hidden'); });
      }
