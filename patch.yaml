commit_message: "feat(history): Implementa lo storico allenamenti con statistiche dettagliate"
rationale: |
  Questo commit introduce una delle funzionalità più richieste: la persistenza e la visualizzazione dello storico degli allenamenti completati, arricchendo l'applicazione con dati statistici dettagliati.

  Seguendo il piano d'azione, sono state apportate le seguenti modifiche strutturali:

  1.  **Persistenza dello Storico**:
      * È stata aggiunta una nuova proprietà `workoutHistory` allo stato globale in `src/core/state.js` per memorizzare tutti gli allenamenti completati.
      * Le funzioni `saveStateToLocalStorage` e `loadStateFromLocalStorage` sono state aggiornate per salvare e caricare questo storico dal `localStorage` dell'utente, garantendo la persistenza dei dati tra le sessioni.

  2.  **Salvataggio Automatico e Statistiche**:
      * Il modulo `trainer` è stato potenziato. Ora traccia l'ora di inizio dell'allenamento.
      * La funzione `endWorkout` in `src/core/trainer.js` ora calcola un riepilogo statistico completo (durata totale, serie totali, esercizi completati) e lo salva nello storico persistente.

  3.  **Debriefing Dettagliato**:
      * La vista di debriefing è stata completamente rinnovata. `templates/debriefing.html` ora include sezioni per le statistiche chiave.
      * La funzione `renderDebriefingPage` in `src/ui/pageRenderers.js` è stata riscritta per popolare questa nuova vista con i dati dettagliati, offrendo un feedback immediato e di valore all'utente.

  4.  **Integrazione nella Vista Log**:
      * La vista "Log" (`src/ui/plannerRenderer.js`) è stata estesa. Ora, per ogni giorno, controlla la presenza di un allenamento nello storico.
      * Se presente, viene visualizzata una card riassuntiva dell'allenamento completato, integrando perfettamente lo storico delle attività fisiche con quello alimentare e fornendo una visione a 360 gradi della giornata.
