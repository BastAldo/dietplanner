  - file: src/core/state.js
    content: |
      import { LOCAL_STORAGE_KEY_PLAN, LOCAL_STORAGE_KEY_URL, MEAL_TYPES, LOCAL_STORAGE_KEY_BIOMETRICS, LOCAL_STORAGE_KEY_PROFILE, LOCAL_STORAGE_KEY_WORKOUTS, WORKOUT_SLOT_ID, LOCAL_STORAGE_KEY_WORKOUT_HISTORY, LOCAL_STORAGE_KEY_GOALS, LOCAL_STORAGE_KEY_INGREDIENTS, LOCAL_STORAGE_KEY_MEALS, LOCAL_STORAGE_KEY_WORKOUT_TEMPLATES, LOCAL_STORAGE_KEY_EXERCISES } from '../utils/constants.js';
      import { processMealsWithCalories } from './calorieCalculator.js';
      import { resetWorkoutState } from './trainer.js';
      import { log } from '../utils/logger.js';
      
      let state = {
        rules: [],
        masterMealList: [],
        masterIngredientList: [],
        masterWorkoutList: [],
        masterWorkoutTemplateList: [],
        weeklyPlan: {},
        weeklyWorkouts: {},
        workoutHistory: {},
        biometricData: [],
        userProfile: {},
        userGoals: {},
        contentHubUrl: 'https://itbiohackerhub-max.github.io/BiohackerHub/',
        recipeBaseUrl: '',
        focusedDate: new Date(),
        debugMode: false,
        ui: {
          currentView: 'planner', // 'planner', 'log', 'library', 'progress', 'charts', 'recipes', 'profile', 'trainer', 'debriefing', 'goals', 'explore'
          activeLibraryTab: 'ingredients',
          librarySearchTerm: '',
          libraryActiveFilter: null,
          lastWorkoutSummary: null,
          charts: {
            currentRangeFilter: 30,
            dateOffset: 0,
            selectedBiometric: 'weight',
            plannerChartType: 'bar'
          },
          explore: {
            packages: [],
            searchTerm: '',
            activeTags: [],
            sortOrder: 'default'
          }
        }
      };
      
      const notify = () => document.dispatchEvent(new CustomEvent('stateChange'));
      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      
      const getWeekStartDate = (date) => {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
      };
      
      export const getState = () => ({ ...state });
      export const setState = (newState) => {
        state = { ...state, ...newState };
        notify();
      }
      export const setUiState = (uiChanges) => {
        state.ui = { ...state.ui, ...uiChanges };
        notify();
      }
      
      export function getPackageTags() {
        const mealTags = state.masterMealList.flatMap(meal => meal.etichette || []);
        const ingredientTags = state.masterIngredientList.flatMap(ing => ing.etichette || []);
        const allTags = [...mealTags, ...ingredientTags];
        const pkgTags = allTags.filter(tag => tag && tag.startsWith('pkg:'));
        return [...new Set(pkgTags)];
      }
      
      export function getMealsForType(mealType) {
        return state.masterMealList.filter(meal => {
          if (meal.tipoPasto === 'Tutti') return true;
          if (Array.isArray(meal.tipoPasto)) {
            return meal.tipoPasto.includes(mealType);
          }
          return meal.tipoPasto === mealType;
        });
      }
      
      export function getExerciseForPlanner(slotId, instanceId) {
        const workoutList = state.weeklyWorkouts[slotId] || [];
        return workoutList.find(ex => ex.instanceId === parseFloat(instanceId));
      }
      
      export function getExerciseFromHistory(date, startTime, instanceId) {
        const workout = state.workoutHistory[date]?.find(w => w.startTime === startTime);
        if (!workout) return null;
        return workout.exercises.find(ex => ex.instanceId === parseFloat(instanceId));
      }
      
      export function getTemplateById(templateId) {
        return state.masterWorkoutTemplateList.find(t => t.id === templateId);
      }
      
      export function toggleDebugMode() {
        state.debugMode = !state.debugMode;
        console.log(`%cDebug mode is now ${state.debugMode ? 'ON' : 'OFF'}`, 'color: white; background-color: #ef5350; padding: 4px; border-radius: 4px;');
      }
      
      export function setPlannerConfig(config, sourceId) {
        log('State', 'Merging new planner config', { sourceId });
        state.rules = config.rules || [];
        const ingredients = config.ingredienti || [];
        const meals = config.meals || [];
        const exercises = config.esercizi || [];
        
        const packageTag = sourceId ? `pkg:${sourceId}` : null; // Create tag
      
        ingredients.forEach(ing => {
          if (!state.masterIngredientList.some(existing => existing.id === ing.id)) {
            if (packageTag) { // Add tag if new and from a package
              ing.etichette = [...(ing.etichette || []), packageTag];
            }
            state.masterIngredientList.push(ing);
          }
        });
      
        meals.forEach(meal => {
          if (!state.masterMealList.some(existing => existing.id === meal.id)) {
            if (packageTag) { // Add tag if new and from a package
              meal.etichette = [...(meal.etichette || []), packageTag];
            }
            state.masterMealList.push(meal);
          }
        });
      
        exercises.forEach(ex => {
          if (!state.masterWorkoutList.some(existing => existing.id === ex.id)) {
            if (packageTag) { // Add tag if new and from a package
              ex.etichette = [...(ex.etichette || []), packageTag];
            }
            state.masterWorkoutList.push(ex);
          }
        });
      
        state.masterMealList = processMealsWithCalories(state.masterMealList, state.masterIngredientList);
        saveStateToLocalStorage();
        notify();
      }
      
      export function setContentHubUrl(url) {
        log('State', 'Setting new Content Hub URL', { url });
        state.contentHubUrl = url;
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, url);
        notify();
      }
      
      export function saveStateToLocalStorage() {
        log('State', 'Saving all application state to localStorage');
        localStorage.setItem(LOCAL_STORAGE_KEY_PLAN, JSON.stringify(state.weeklyPlan));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUTS, JSON.stringify(state.weeklyWorkouts));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUT_HISTORY, JSON.stringify(state.workoutHistory));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUT_TEMPLATES, JSON.stringify(state.masterWorkoutTemplateList));
        localStorage.setItem(LOCAL_STORAGE_KEY_BIOMETRICS, JSON.stringify(state.biometricData));
        localStorage.setItem(LOCAL_STORAGE_KEY_PROFILE, JSON.stringify(state.userProfile));
        localStorage.setItem(LOCAL_STORAGE_KEY_GOALS, JSON.stringify(state.userGoals));
        localStorage.setItem(LOCAL_STORAGE_KEY_INGREDIENTS, JSON.stringify(state.masterIngredientList));
        localStorage.setItem(LOCAL_STORAGE_KEY_MEALS, JSON.stringify(state.masterMealList));
        localStorage.setItem(LOCAL_STORAGE_KEY_EXERCISES, JSON.stringify(state.masterWorkoutList));
      }
      
      export function loadStateFromLocalStorage() {
        log('State', 'Loading all application state from localStorage');
        const plan = localStorage.getItem(LOCAL_STORAGE_KEY_PLAN);
        const workouts = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUTS);
        const history = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUT_HISTORY);
        const templates = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUT_TEMPLATES);
        let url = localStorage.getItem(LOCAL_STORAGE_KEY_URL);
        const biometrics = localStorage.getItem(LOCAL_STORAGE_KEY_BIOMETRICS);
        const profile = localStorage.getItem(LOCAL_STORAGE_KEY_PROFILE);
        const goals = localStorage.getItem(LOCAL_STORAGE_KEY_GOALS);
        const ingredients = localStorage.getItem(LOCAL_STORAGE_KEY_INGREDIENTS);
        const meals = localStorage.getItem(LOCAL_STORAGE_KEY_MEALS);
        const exercises = localStorage.getItem(LOCAL_STORAGE_KEY_EXERCISES);
      
        if (url) {
            // Migration for existing users with the old, incorrect URL without the repo name
            if (url === 'https://itbiohackerhub-max.github.io/') {
                log('State', 'Migrating incorrect legacy hub URL.');
                url = 'https://itbiohackerhub-max.github.io/BiohackerHub/';
                localStorage.setItem(LOCAL_STORAGE_KEY_URL, url); // Correct it for the future
            }
            state.contentHubUrl = url;
        }
      
        if (plan) { try { state.weeklyPlan = JSON.parse(plan); } catch (e) { console.error("Error parsing weeklyPlan", e); state.weeklyPlan = {}; } }
        if (workouts) { try { state.weeklyWorkouts = JSON.parse(workouts); } catch (e) { console.error("Error parsing weeklyWorkouts", e); state.weeklyWorkouts = {}; } }
        if (history) { try { state.workoutHistory = JSON.parse(history); } catch (e) { console.error("Error parsing workoutHistory", e); state.workoutHistory = {}; } }
        if (templates) { try { state.masterWorkoutTemplateList = JSON.parse(templates); } catch (e) { console.error("Error parsing masterWorkoutTemplateList", e); state.masterWorkoutTemplateList = []; } }
        if (biometrics) { try { state.biometricData = JSON.parse(biometrics); } catch (e) { console.error("Error parsing biometricData", e); state.biometricData = []; } }
        if (profile) { try { state.userProfile = JSON.parse(profile); } catch (e) { console.error("Error parsing userProfile", e); state.userProfile = {}; } }
        if (goals) { try { state.userGoals = JSON.parse(goals); } catch (e) { console.error("Error parsing userGoals", e); state.userGoals = {}; } }
        if (ingredients) { try { state.masterIngredientList = JSON.parse(ingredients); } catch (e) { console.error("Error parsing masterIngredientList", e); state.masterIngredientList = []; } }
        if (meals) { try { state.masterMealList = JSON.parse(meals); } catch (e) { console.error("Error parsing masterMealList", e); state.masterMealList = []; } }
        if (exercises) { try { state.masterWorkoutList = JSON.parse(exercises); } catch (e) { console.error("Error parsing masterWorkoutList", e); state.masterWorkoutList = []; } }
      }
      
      export function setAppState(backupData) {
        log('State', 'Restoring application state from backup');
        state.weeklyPlan = backupData.weeklyPlan || {};
        state.weeklyWorkouts = backupData.weeklyWorkouts || {};
        state.workoutHistory = backupData.workoutHistory || {};
        state.masterWorkoutTemplateList = backupData.masterWorkoutTemplateList || [];
        state.contentHubUrl = backupData.contentHubUrl || 'https://itbiohackerhub-max.github.io/BiohackerHub/';
        state.biometricData = backupData.biometricData || [];
        state.userProfile = backupData.userProfile || {};
        state.userGoals = backupData.userGoals || {};
        state.masterIngredientList = backupData.masterIngredientList || [];
        state.masterMealList = backupData.masterMealList || [];
        state.masterWorkoutList = backupData.masterWorkoutList || [];
        saveStateToLocalStorage();
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, state.contentHubUrl);
        notify();
      }
      
      export function saveUserProfile(profile) {
        log('State', 'Saving user profile', { profile });
        state.userProfile = profile;
        saveStateToLocalStorage();
        notify();
      }
      
      export function saveUserGoals(goals) {
          log('State', 'Saving user goals', { goals });
          state.userGoals = goals;
          saveStateToLocalStorage();
          notify();
      }
      
      export function addOrUpdateBiometricEntry(entry) {
        log('State', 'Adding or updating biometric entry', { entry });
        const index = state.biometricData.findIndex(e => e.date === entry.date);
        if (index > -1) {
          state.biometricData[index] = entry;
        } else {
          state.biometricData.push(entry);
        }
        state.biometricData.sort((a, b) => new Date(b.date) - new Date(a.date));
        saveStateToLocalStorage();
        notify();
      }
      
      export function addMultipleBiometricEntries(newEntries) {
        log('State', 'Adding multiple biometric entries', { count: newEntries.length });
        state.biometricData = [...state.biometricData, ...newEntries];
        state.biometricData.sort((a, b) => new Date(b.date) - new Date(a.date));
        saveStateToLocalStorage();
        notify();
      }
      
      export function deleteBiometricEntry(date) {
        log('State', 'Deleting biometric entry', { date });
        state.biometricData = state.biometricData.filter(e => e.date !== date);
        saveStateToLocalStorage();
        notify();
      }
      
      export function addIngredient(ingredientData) {
        log('State', 'Adding new ingredient', { ingredientData });
        state.masterIngredientList.push(ingredientData);
        state.masterIngredientList.sort((a, b) => a.nome.localeCompare(b.nome));
        saveStateToLocalStorage();
        notify();
      }
      
      export function updateIngredient(ingredientId, updatedData) {
        log('State', 'Updating ingredient', { ingredientId, updatedData });
        const index = state.masterIngredientList.findIndex(ing => ing.id === ingredientId);
        if (index > -1) {
          state.masterIngredientList[index] = { ...state.masterIngredientList[index], ...updatedData };
          state.masterIngredientList.sort((a, b) => a.nome.localeCompare(b.nome));
          saveStateToLocalStorage();
          notify();
        }
      }
      
      export function deleteIngredient(ingredientId) {
        log('State', 'Deleting ingredient', { ingredientId });
        state.masterIngredientList = state.masterIngredientList.filter(ing => ing.id !== ingredientId);
        saveStateToLocalStorage();
        notify();
      }
      
      export function addMeal(mealData) {
        log('State', 'Adding new meal', { mealData });
        state.masterMealList.push(mealData);
        state.masterMealList = processMealsWithCalories(state.masterMealList, state.masterIngredientList);
        state.masterMealList.sort((a,b) => a.nomePasto.localeCompare(b.nomePasto));
        saveStateToLocalStorage();
        notify();
      }
      
      export function updateMeal(mealId, updatedData) {
        log('State', 'Updating meal', { mealId, updatedData });
        const index = state.masterMealList.findIndex(m => m.id === mealId);
        if (index > -1) {
          state.masterMealList[index] = { ...state.masterMealList[index], ...updatedData };
          state.masterMealList = processMealsWithCalories(state.masterMealList, state.masterIngredientList);
          state.masterMealList.sort((a,b) => a.nomePasto.localeCompare(b.nomePasto));
          saveStateToLocalStorage();
          notify();
        }
      }
      
      export function deleteMeal(mealId) {
        log('State', 'Deleting meal', { mealId });
        state.masterMealList = state.masterMealList.filter(m => m.id !== mealId);
        saveStateToLocalStorage();
        notify();
      }
      
      export function addWorkoutTemplate(templateName, exercises) {
        log('State', 'Adding new workout template', { templateName });
        const newTemplate = {
          id: Date.now() + Math.random(),
          name: templateName,
          exercises: JSON.parse(JSON.stringify(exercises)) // Deep copy
        };
        state.masterWorkoutTemplateList.push(newTemplate);
        state.masterWorkoutTemplateList.sort((a, b) => a.name.localeCompare(b.name));
        saveStateToLocalStorage();
        notify();
      }
      
      export function updateWorkoutTemplate(templateId, newExercises) {
        log('State', 'Updating workout template', { templateId });
        const index = state.masterWorkoutTemplateList.findIndex(t => t.id === templateId);
        if (index > -1) {
          state.masterWorkoutTemplateList[index].exercises = JSON.parse(JSON.stringify(newExercises)); // Deep copy
          saveStateToLocalStorage();
          notify();
        }
      }
      
      export function deleteWorkoutTemplate(templateId) {
        log('State', 'Deleting workout template', { templateId });
        state.masterWorkoutTemplateList = state.masterWorkoutTemplateList.filter(t => t.id !== templateId);
        saveStateToLocalStorage();
        notify();
      }
      
      export function addExercise(exerciseData) {
        log('State', 'Adding new exercise', { exerciseData });
        state.masterWorkoutList.push(exerciseData);
        state.masterWorkoutList.sort((a, b) => a.name.localeCompare(b.name));
        saveStateToLocalStorage();
        notify();
      }
      
      export function updateExercise(exerciseId, updatedData) {
        log('State', 'Updating exercise', { exerciseId, updatedData });
        const index = state.masterWorkoutList.findIndex(ex => ex.id === exerciseId);
        if (index > -1) {
          state.masterWorkoutList[index] = { ...state.masterWorkoutList[index], ...updatedData };
          state.masterWorkoutList.sort((a, b) => a.name.localeCompare(b.name));
          saveStateToLocalStorage();
          notify();
        }
      }
      
      export function deleteExercise(exerciseId) {
        log('State', 'Deleting exercise', { exerciseId });
        state.masterWorkoutList = state.masterWorkoutList.filter(ex => ex.id !== exerciseId);
        saveStateToLocalStorage();
        notify();
      }
      
      export function addWorkoutTemplateToDay(slotId, templateId) {
        log('State', 'Adding workout template to day', { slotId, templateId });
        const template = state.masterWorkoutTemplateList.find(t => t.id === templateId);
        if (!template) return;
      
        // Deep copy exercises from template to ensure unique instanceIds
        const exercisesToAdd = JSON.parse(JSON.stringify(template.exercises));
        
        // Ensure new instanceIds for all exercises being added
        exercisesToAdd.forEach(ex => {
          ex.instanceId = Date.now() + Math.random();
        });
      
        if (!state.weeklyWorkouts[slotId]) {
            state.weeklyWorkouts[slotId] = [];
        }
        
        state.weeklyWorkouts[slotId] = [...state.weeklyWorkouts[slotId], ...exercisesToAdd];
        saveStateToLocalStorage();
        notify();
      }
      
      export function updateWeeklyPlan(slotId, mealId) {
        log('State', 'Updating weekly plan', { slotId, mealId });
        if (mealId) {
          const meal = state.masterMealList.find(m => m.id === mealId);
          if (meal) {
            state.weeklyPlan[slotId] = { ...meal };
          }
        } else {
          delete state.weeklyPlan[slotId];
        }
        saveStateToLocalStorage();
        notify();
      }
      
      export function updateWeeklyWorkout(slotId, exerciseId, instanceId = null) {
        log('State', 'Updating weekly workout', { slotId, exerciseId, instanceId });
          if (!state.weeklyWorkouts[slotId]) {
              state.weeklyWorkouts[slotId] = [];
          }
      
          if (exerciseId) {
              const exercise = state.masterWorkoutList.find(ex => ex.id === exerciseId);
              if (exercise) {
                  const newExerciseInstance = { ...exercise, instanceId: Date.now() + Math.random() };
                  state.weeklyWorkouts[slotId].push(newExerciseInstance);
              }
          } else if (instanceId) {
              state.weeklyWorkouts[slotId] = state.weeklyWorkouts[slotId].filter(ex => ex.instanceId !== instanceId);
              if (state.weeklyWorkouts[slotId].length === 0) {
                  delete state.weeklyWorkouts[slotId];
              }
          }
          saveStateToLocalStorage();
          notify();
      }
      
      export function setWeeklyWorkout(slotId, newExercises) {
        log('State', 'Setting new weekly workout for slot', { slotId });
        state.weeklyWorkouts[slotId] = JSON.parse(JSON.stringify(newExercises)); // Deep copy
        saveStateToLocalStorage();
        notify();
      }
      
      export function clearWeeklyWorkout(slotId) {
        log('State', 'Clearing weekly workout', { slotId });
        if (state.weeklyWorkouts[slotId]) {
          delete state.weeklyWorkouts[slotId];
          saveStateToLocalStorage();
          notify();
        }
      }
      
      export function updateExerciseInstanceInWorkout(slotId, instanceId, newValues) {
        log('State', 'Updating exercise instance in planner', { slotId, instanceId, newValues });
          if (!state.weeklyWorkouts[slotId]) return;
      
          const workoutList = state.weeklyWorkouts[slotId];
          const exerciseIndex = workoutList.findIndex(ex => ex.instanceId === instanceId);
      
          if (exerciseIndex > -1) {
              const updatedExercise = { ...workoutList[exerciseIndex], ...newValues };
              if (newValues.defaultTempo) {
                  updatedExercise.defaultTempo = { ...workoutList[exerciseIndex].defaultTempo, ...newValues.defaultTempo };
              }
              workoutList[exerciseIndex] = updatedExercise;
              saveStateToLocalStorage();
              notify();
          }
      }
      
      export function reorderWorkoutExercises(slotId, oldIndex, newIndex) {
        log('State', 'Reordering workout exercises', { slotId, oldIndex, newIndex });
          if (!state.weeklyWorkouts[slotId] || oldIndex === newIndex) return;
          const workoutList = state.weeklyWorkouts[slotId];
          const [movedItem] = workoutList.splice(oldIndex, 1);
          workoutList.splice(newIndex, 0, movedItem);
          saveStateToLocalStorage();
          notify();
      }
      
      export function resetCurrentWeek() {
        log('State', 'Resetting current week');
        const weekStart = getWeekStartDate(state.focusedDate);
        for (let i = 0; i < 7; i++) {
            const date = new Date(weekStart);
            date.setDate(date.getDate() + i);
            const isoDate = toISODateString(date);
      
            MEAL_TYPES.forEach(mealType => {
                const slotId = `${isoDate}-${mealType}`;
                if (state.weeklyPlan[slotId]) {
                    delete state.weeklyPlan[slotId];
                }
            });
      
            const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
            if (state.weeklyWorkouts[workoutSlotId]) {
                delete state.weeklyWorkouts[workoutSlotId];
            }
      
            if (state.workoutHistory[isoDate]) {
                delete state.workoutHistory[isoDate];
            }
        }
        saveStateToLocalStorage();
        notify();
      }
      
      export function navigateWeek(direction) {
        log('State', 'Navigating week', { direction });
        const newDate = new Date(state.focusedDate);
        newDate.setDate(newDate.getDate() + (direction * 7));
        state.focusedDate = newDate;
        notify();
      }
      
      export function setView(view) {
        log('State', 'Setting new view', { newView: view, oldView: state.ui.currentView });
        if (['planner', 'log', 'library', 'progress', 'profile', 'charts', 'recipes', 'trainer', 'debriefing', 'goals', 'explore'].includes(view)) {
          state.ui.currentView = view;
          notify();
        }
      }
      
      export function setLastWorkoutSummary(summary) {
        log('State', 'Setting last workout summary');
        state.ui.lastWorkoutSummary = summary;
        notify();
      }
      
      export function addWorkoutToHistory(summary) {
        log('State', 'Adding structured workout to history', { date: summary.date });
        if (summary && summary.date) {
            if (!state.workoutHistory[summary.date]) {
                state.workoutHistory[summary.date] = [];
            }
            state.workoutHistory[summary.date].push({ ...summary, type: 'structured' });
            saveStateToLocalStorage();
            notify();
        }
      }
      
      export function addManualWorkoutToHistory(date, activityData) {
          log('State', 'Adding manual workout to history', { date, activityData });
          if (!state.workoutHistory[date]) {
              state.workoutHistory[date] = [];
          }
          const manualWorkout = {
              type: 'manual',
              date: date,
              startTime: Date.now(),
              ...activityData
          };
          state.workoutHistory[date].push(manualWorkout);
          saveStateToLocalStorage();
          notify();
      }
      
      export function deleteWorkoutFromHistory(date, startTime) {
          log('State', 'Deleting workout from history', { date, startTime });
          if (state.workoutHistory[date]) {
              state.workoutHistory[date] = state.workoutHistory[date].filter(workout => workout.startTime !== startTime);
              if (state.workoutHistory[date].length === 0) {
                  delete state.workoutHistory[date];
              }
              saveStateToLocalStorage();
              notify();
          }
      }
      
      export function updateWorkoutInHistory(date, startTime, updates) {
          log('State', 'Updating workout in history', { date, startTime, updates });
          if (state.workoutHistory[date]) {
              const workoutIndex = state.workoutHistory[date].findIndex(w => w.startTime === startTime);
              if (workoutIndex > -1) {
                  state.workoutHistory[date][workoutIndex] = {
                      ...state.workoutHistory[date][workoutIndex],
                      ...updates
                  };
                  saveStateToLocalStorage();
                  notify();
              }
          }
      }
      
      export function updateExerciseSetsInHistory(date, startTime, exerciseInstanceId, newSetsData) {
        log('State', 'Updating exercise sets in history', { date, startTime, exerciseInstanceId });
        if (!state.workoutHistory[date]) return;
      
        const workoutIndex = state.workoutHistory[date].findIndex(w => w.startTime === startTime);
        if (workoutIndex === -1) return;
      
        const workout = state.workoutHistory[date][workoutIndex];
        const exerciseIndex = workout.exercises.findIndex(ex => ex.instanceId === exerciseInstanceId);
        if (exerciseIndex === -1) return;
      
        workout.exercises[exerciseIndex].setsData = newSetsData;
        const exerciseTonnage = newSetsData.reduce((acc, set) => acc + ((set.reps || 0) * (set.weight || 0)), 0);
        workout.exercises[exerciseIndex].tonnage = exerciseTonnage;
        workout.totalTonnage = workout.exercises.reduce((acc, ex) => acc + (ex.tonnage || 0), 0);
        saveStateToLocalStorage();
        notify();
      }
      
      export function copyPreviousWeek() {
        log('State', 'Copying previous week');
        const currentWeekStart = getWeekStartDate(state.focusedDate);
        const prevWeekStart = new Date(currentWeekStart);
        prevWeekStart.setDate(prevWeekStart.getDate() - 7);
      
        for (let i = 0; i < 7; i++) {
          const sourceDate = new Date(prevWeekStart);
          sourceDate.setDate(sourceDate.getDate() + i);
          const sourceISO = toISODateString(sourceDate);
      
          const destDate = new Date(currentWeekStart);
          destDate.setDate(destDate.getDate() + i);
          const destISO = toISODateString(destDate);
      
          MEAL_TYPES.forEach(mealType => {
            const sourceSlotId = `${sourceISO}-${mealType}`;
            const destSlotId = `${destISO}-${mealType}`;
            const mealObject = state.weeklyPlan[sourceSlotId];
            if (mealObject) {
              state.weeklyPlan[destSlotId] = { ...meal };
            } else {
              delete state.weeklyPlan[destSlotId];
            }
          });
      
          const sourceWorkoutSlot = `${sourceISO}-${WORKOUT_SLOT_ID}`;
          const destWorkoutSlot = `${destISO}-${WORKOUT_SLOT_ID}`;
          const workoutList = state.weeklyWorkouts[sourceWorkoutSlot];
          if (workoutList && Array.isArray(workoutList)) {
              state.weeklyWorkouts[destWorkoutSlot] = JSON.parse(JSON.stringify(workoutList));
          } else {
              delete state.weeklyWorkouts[destWorkoutSlot];
          }
        }
        saveStateToLocalStorage();
        notify();
      }
  - file: src/ui/pageRenderers.js
    content: |
      import { calculateBMR } from '../core/calculations.js';
      import { BIOMETRIC_FIELDS, PROFILE_FIELDS } from '../config/forms.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { renderCharts } from './charts.js';
      import { formatIngredientsSummary } from '../utils/formatters.js';
      import { fetchAndMergePackage } from '../api/configService.js';
      import { log } from '../utils/logger.js';
      import { getState, setUiState, getPackageTags } from '../core/state.js';
      import { openPackagePreviewModal } from './modals.js';
      
      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Failed to fetch ${url}`);
        return response.json();
      }
      
      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }
      
      function formatReadableDate(isoDate) {
          const date = new Date(isoDate);
          return date.toLocaleDateString('it-IT', {
              weekday: 'long',
              year: 'numeric',
              month: 'long',
              day: 'numeric'
          });
      }
      
      function formatDuration(ms) {
          if (typeof ms !== 'number' || ms < 0) return '00:00';
          const totalSeconds = Math.floor(ms / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }
      
      export function renderBiometricsPage(state) {
        const form = document.getElementById('biometrics-form');
        const listContainer = document.getElementById('biometrics-list');
        document.getElementById('import-csv-btn').textContent = UI_TEXT.IMPORT_BIOMETRICS_BTN;
      
        form.innerHTML = `${BIOMETRIC_FIELDS.map(field => `<div class="form-group"><label for="bio-${field.id}">${field.label}</label>${field.type === 'textarea' ? `<textarea id="bio-${field.id}" name="${field.id}"></textarea>` : `<input type="${field.type}" id="bio-${field.id}" name="${field.id}" ${field.props || ''} ${field.id === 'date' ? `value="${toISODateString(new Date())}"` : ''}>`}</div>`).join('')}<div class="form-actions"><button type="submit" class="btn btn-primary">${UI_TEXT.BIOMETRICS_SAVE_BTN}</button><button type="reset" class="btn btn-secondary">${UI_TEXT.BIOMETRICS_CLEAR_BTN}</button></div>`;
      
        if (state.biometricData.length > 0) {
            listContainer.innerHTML = state.biometricData.map(entry => {
                const fieldsHTML = BIOMETRIC_FIELDS.filter(field => field.id !== 'date' && entry[field.id])
                    .map(field => `
                        <div class="biometric-card__item ${field.id === 'notes' ? 'biometric-card__notes' : ''}">
                            <span class="biometric-card__label">${field.label}</span>
                            <span class="biometric-card__value">${entry[field.id]}</span>
                        </div>
                    `).join('');
      
                return `
                    <div class="biometric-card" data-date="${entry.date}">
                        <div class="biometric-card__header">
                            <span class="biometric-card__date">${formatReadableDate(entry.date)}</span>
                            <div class="biometrics-actions">
                                <button class="btn-actions-menu" data-date="${entry.date}" title="${UI_TEXT.BIOMETRICS_ACTIONS_TITLE}">
                                    ${renderIcon('KEBAB_MENU', { width: 24, height: 24 })}
                                </button>
                                <div class="actions-dropdown">
                                    <button class="btn-edit-biometrics" data-date="${entry.date}">${UI_TEXT.BIOMETRICS_EDIT_BTN}</button>
                                    <button class="btn-delete-biometrics delete" data-date="${entry.date}">${UI_TEXT.BIOMETRICS_DELETE_BTN}</button>
                                </div>
                            </div>
                        </div>
                        <div class="biometric-card__body">
                            ${fieldsHTML}
                        </div>
                    </div>`;
            }).join('');
        } else {
            listContainer.innerHTML = `<p class="placeholder-text">${UI_TEXT.BIOMETRICS_EMPTY_LIST}</p>`;
        }
      
        const weightInput = form.elements.weight;
        const bmrInput = form.elements.basalMetabolism;
        const weightForCalc = weightInput.value || (state.biometricData.length > 0 ? state.biometricData[0].weight : null);
      
        const bmr = calculateBMR(state.userProfile, weightForCalc);
        if (bmr !== null) {
          bmrInput.value = bmr;
        } else {
          bmrInput.placeholder = UI_TEXT.BIOMETRICS_BMR_PLACEHOLDER;
        }
      }
      
      export function renderProfilePage(state) {
        const form = document.getElementById('profile-form');
        let formHTML = '';
      
        PROFILE_FIELDS.forEach(field => {
          let fieldHTML = '<div class="form-group">';
          switch (field.type) {
            case 'radio':
              fieldHTML += `<fieldset><legend>${field.label}</legend>${field.options.map(opt => `<label><input type="radio" name="${field.id}" value="${opt.value}" ${state.userProfile[field.id] === opt.value ? 'checked' : ''}> ${opt.label}</label>`).join('')}</fieldset>`;
              break;
            case 'checkbox-group':
              fieldHTML += `<fieldset><legend>${field.label}</legend>${field.options.map(opt => `<label><input type="checkbox" name="${opt.id}" id="prof-${opt.id}" ${state.userProfile[opt.id] ? 'checked' : ''}> ${opt.label}</label>`).join('')}</fieldset>`;
              break;
            default:
              fieldHTML += `<label for="prof-${field.id}">${field.label}</label><input type="${field.type}" id="prof-${field.id}" name="${field.id}" value="${state.userProfile[field.id] || ''}" ${field.props || ''}>`;
          }
          fieldHTML += '</div>';
          formHTML += fieldHTML;
        });
      
        form.innerHTML = `${formHTML}<div class="form-actions"><button type="submit" class="btn btn-primary">${UI_TEXT.PROFILE_SAVE_BTN}</button></div>`;
      }
      
      export function renderGoalsPage(state) {
          const form = document.getElementById('goals-form');
          document.getElementById('goals-title').textContent = UI_TEXT.GOALS_TITLE;
          document.getElementById('goals-explanation-text').textContent = UI_TEXT.GOALS_EXPLANATION;
          document.getElementById('goals-activity-legend').textContent = UI_TEXT.GOALS_ACTIVITY_LEGEND;
          document.getElementById('goals-biometrics-legend').textContent = UI_TEXT.GOALS_BIOMETRICS_LEGEND;
          document.getElementById('goal-calories-label').textContent = UI_TEXT.GOAL_CALORIES_LABEL;
          document.getElementById('goal-workouts-label').textContent = UI_TEXT.GOAL_WORKOUTS_LABEL;
          document.getElementById('goal-weight-label').textContent = UI_TEXT.GOAL_WEIGHT_LABEL;
          document.getElementById('goals-save-btn').textContent = UI_TEXT.GOALS_SAVE_BTN;
          form.elements.avg_calories.value = state.userGoals.avg_calories || '';
          form.elements.num_workouts.value = state.userGoals.num_workouts || '';
          form.elements.target_weight.value = state.userGoals.target_weight || '';
      }
      
      export function renderChartsPage(state) {
          const placeholder = document.getElementById('biometrics-chart-placeholder');
          const canvas = document.getElementById('biometrics-chart-canvas');
          if (state.biometricData.length < 2) {
              placeholder.textContent = UI_TEXT.BIOMETRICS_CHART_EMPTY;
              placeholder.classList.remove('hidden');
              canvas.classList.add('hidden');
          } else {
              placeholder.classList.add('hidden');
              canvas.classList.remove('hidden');
          }
          renderCharts(state);
      }
      
      function getSetDetails(setData) {
          let details = [];
          if (setData.reps) {
              details.push(`${setData.reps} reps`);
          }
          if (setData.weight) {
              details.push(`${setData.weight} kg`);
          }
          if (setData.duration) {
              details.push(`${formatDuration(setData.duration)}`);
          }
          return details.join(' / ');
      }
      
      export function renderDebriefingPage(state) {
        const summaryContainer = document.getElementById('debriefing-summary');
        const statsContainer = document.getElementById('debriefing-stats');
        const summary = state.ui.lastWorkoutSummary;
      
        if (!summary || !summary.exercises) {
            summaryContainer.innerHTML = `<p class="placeholder-text">${UI_TEXT.DEBRIEFING_NO_SUMMARY}</p>`;
            statsContainer.innerHTML = '';
            document.getElementById('debriefing-feedback').classList.add('hidden');
            return;
        }
      
        document.getElementById('debriefing-feedback').classList.remove('hidden');
        document.getElementById('debriefing-stats-title').textContent = UI_TEXT.DEBRIEFING_STATS_TITLE;
        document.getElementById('debriefing-rpe-label').textContent = UI_TEXT.DEBRIEFING_RPE_LABEL;
        document.getElementById('save-rpe-btn').textContent = UI_TEXT.DEBRIEFING_SAVE_RPE_BTN;
        document.getElementById('speak-summary-btn').innerHTML = renderIcon('SPEAKER', {width: 24, height: 24});
      
        const caloriesBurnedHTML = summary.totalCaloriesBurned > 0 ? `<div class="stat-item"><span class="stat-label">${UI_TEXT.DEBRIEFING_CALORIES_BURNED}</span><span class="stat-value">${summary.totalCaloriesBurned}</span></div>` : '';
        const tonnageHTML = summary.totalTonnage > 0 ? `<div class="stat-item"><span class="stat-label">${UI_TEXT.DEBRIEFING_TONNAGE}</span><span class="stat-value">${summary.totalTonnage} kg</span></div>` : '';
      
        statsContainer.innerHTML = `
            <div class="stat-item"><span class="stat-label">${UI_TEXT.DEBRIEFING_TOTAL_TIME}</span><span class="stat-value">${formatDuration(summary.totalTime)}</span></div>
            <div class="stat-item"><span class_=("stat-label")>${UI_TEXT.DEBRIEFING_EXERCISE_TIME}</span><span class="stat-value">${formatDuration(summary.totalExerciseTime)}</span></div>
            <div class="stat-item"><span class="stat-label">${UI_TEXT.DEBRIEFING_REST_TIME}</span><span class="stat-value">${formatDuration(summary.totalRestTime)}</span></div>
            ${caloriesBurnedHTML}
            ${tonnageHTML}
        `;
      
        summaryContainer.innerHTML = summary.exercises.map(exercise => {
            const isCompleted = exercise.setsCompleted === exercise.defaultSets;
            return `
                <div class="debriefing-card ${isCompleted ? 'completed' : 'incomplete'}">
                    <div class="debriefing-card-header"><h4>${exercise.name}</h4><div class="debriefing-status">${isCompleted ? UI_TEXT.DEBRIEFING_COMPLETED : UI_TEXT.DEBRIEFING_INCOMPLETE}</div></div>
                    <div class="debriefing-card-body">
                      <div class="exercise-stats">
                        <span class="exercise-stat-item">${UI_TEXT.DEBRIEFING_SETS_COMPLETED}: ${exercise.setsCompleted}/${exercise.defaultSets}</span>
                        <span class="exercise-stat-item">${UI_TEXT.DEBRIEFING_TOTAL_TIME}: ${formatDuration(exercise.totalTime)}</span>
                      </div>
                      <div class="sets-details-container">${exercise.setsData.map((setData, i) => `<div class="set-detail-item"><span>${UI_TEXT.DEBRIEFING_SET_LABEL} ${i + 1}</span><span>${getSetDetails(setData)}</span></div>`).join('')}</div>
                    </div>
                </div>`;
        }).join('');
      }
      
      export function renderRecipesPage(state) {
        const recipesList = document.getElementById('recipes-list');
        const recipes = state.masterMealList.filter(meal => meal.recipeId);
        if (!recipes || recipes.length === 0) {
            recipesList.innerHTML = `<p class="placeholder-text">${UI_TEXT.RECIPES_EMPTY}</p>`;
            return;
        }
        recipesList.innerHTML = recipes.map(recipe => {
            const ingredientsHtml = formatIngredientsSummary(recipe);
            return `<div class="recipe-list-item" data-meal-id="${recipe.id}"><h4>${recipe.nomePasto}</h4><p><strong>Calorie:</strong> ${recipe.calories_min}${recipe.calories_max && recipe.calories_max !== recipe.calories_min ? ' - ' + recipe.calories_max : ''} kcal</p>${ingredientsHtml ? `<div><strong>Ingredienti:</strong> ${ingredientsHtml}</div>` : ''}</div>`;
        }).join('');
      }
      
      function renderPackageFilters(state) {
        const { libraryActiveFilter } = state.ui;
        const pkgTags = getPackageTags();
        const tagsContainer = document.getElementById('library-tag-filters');
        
        if (pkgTags.length === 0) {
          tagsContainer.innerHTML = '';
          return;
        }
      
        let tagsHtml = `<button class="tag-filter-btn ${!libraryActiveFilter ? 'active' : ''}" data-tag="all">${UI_TEXT.EXPLORE_FILTER_ALL}</button>`;
        tagsHtml += pkgTags.map(tag => {
          const tagName = tag.replace('pkg:', '');
          return `<button class="tag-filter-btn ${libraryActiveFilter === tag ? 'active' : ''}" data-tag="${tag}">${tagName}</button>`;
        }).join('');
        
        tagsContainer.innerHTML = tagsHtml;
      }
      
      function formatExerciseDetails(exercise) {
        const sets = exercise.defaultSets || '?';
        const rest = exercise.defaultRest || 0;
        let details = `${sets} set | Riposo: ${rest}s`;
      
        const mode = exercise.execution_mode || 'guided_tempo';
      
        if (mode === 'logging') {
            if (exercise.defaultRepsMin && exercise.defaultRepsMax) {
                details += ` | ${exercise.defaultRepsMin}-${exercise.defaultRepsMax} reps`;
            } else if (exercise.defaultRepsMin) {
                details += ` | ${exercise.defaultRepsMin}+ reps`;
            }
        } else if (mode === 'guided_static') {
            details += ` | ${exercise.defaultDuration || '?'}s`;
        } else {
            details += ` | ${exercise.defaultReps || '?'} reps`;
        }
      
        return details;
      }
      
      export function renderLibraryPage(state) {
        const { activeLibraryTab = 'ingredients', librarySearchTerm = '', libraryActiveFilter } = state.ui;
        const searchInput = document.getElementById('library-search-input');
        searchInput.value = librarySearchTerm;
        
        const tabs = {
          'ingredients': 'ingredienti (per nome o etichetta)',
          'meals': 'pasti (per nome o etichetta)',
          'exercises': 'esercizi (per nome o etichetta)',
          'templates': 'schede (per nome)'
        };
        searchInput.placeholder = `Cerca in ${tabs[activeLibraryTab] || 'ingredienti'}...`;
      
        document.querySelectorAll('#library-page .btn-view').forEach(btn => btn.classList.toggle('active', btn.dataset.view === activeLibraryTab));
        document.querySelectorAll('.library-content').forEach(panel => panel.classList.toggle('hidden', !panel.id.includes(activeLibraryTab)));
        
        document.getElementById('library-tab-ingredients').textContent = 'Ingredienti';
        document.getElementById('library-tab-meals').textContent = 'Pasti';
        document.getElementById('library-tab-exercises').textContent = 'Esercizi';
        document.getElementById('library-tab-templates').textContent = UI_TEXT.NAV_TEMPLATES;
      
        const lowerCaseSearchTerm = librarySearchTerm.toLowerCase();
      
        // Render Package Filters (solo per pasti, ingredienti, esercizi)
        const tagsContainer = document.getElementById('library-tag-filters');
        if (activeLibraryTab === 'meals' || activeLibraryTab === 'ingredients' || activeLibraryTab === 'exercises') {
          renderPackageFilters(state);
          tagsContainer.classList.remove('hidden');
        } else {
          tagsContainer.classList.add('hidden');
        }
      
        // Render Ingredients
        const ingredientList = document.getElementById('ingredient-list');
        const filteredIngredients = state.masterIngredientList.filter(ing => {
            // Filtro Pacchetto
            if (libraryActiveFilter && (!ing.etichette || !ing.etichette.includes(libraryActiveFilter))) {
              return false;
            }
            // Filtro Ricerca
            if (lowerCaseSearchTerm !== '') {
              const nameMatch = ing.nome.toLowerCase().includes(lowerCaseSearchTerm);
              const tagMatch = ing.etichette && ing.etichette.some(tag => tag.toLowerCase().includes(lowerCaseSearchTerm));
              if (!nameMatch && !tagMatch) return false;
            }
            return true;
        });
      
        if (filteredIngredients.length > 0) {
          ingredientList.innerHTML = filteredIngredients.map(ing => `<div class="library-item" data-id="${ing.id}"><div class="library-item-info"><span class="library-item-info__name">${ing.nome}</span><span class="library-item-info__details">${ing.kcal_per_100g} kcal / 100g ${ing.g_per_pezzo ? `| ${ing.g_per_pezzo}g per pezzo` : ''}</span></div><div class="library-item-actions"><button class="btn-edit" title="Modifica">${renderIcon('EDIT', { width: 18, height: 18 })}</button><button class="btn-delete" title="Elimina">${renderIcon('TRASH', { width: 18, height: 18 })}</button></div></div>`).join('');
        } else {
          ingredientList.innerHTML = `<p class="placeholder-text">Nessun ingrediente trovato.</p>`;
        }
      
        // Render Meals
        const mealList = document.getElementById('meal-list');
        const filteredMeals = state.masterMealList.filter(meal => {
            // Filtro Pacchetto
            if (libraryActiveFilter && (!meal.etichette || !meal.etichette.includes(libraryActiveFilter))) {
              return false;
            }
            
            // Filtro Ricerca
            if (lowerCaseSearchTerm !== '') {
              const nameMatch = meal.nomePasto.toLowerCase().includes(lowerCaseSearchTerm);
              const tagMatch = meal.etichette && meal.etichette.some(tag => tag.toLowerCase().includes(lowerCaseSearchTerm));
              if (!nameMatch && !tagMatch) return false;
            }
            
            return true;
        });
      
        if (filteredMeals.length > 0) {
          mealList.innerHTML = filteredMeals.map(meal => {
            const calorieText = (meal.calories_min && meal.calories_max) ? (meal.calories_min === meal.calories_max ? `${meal.calories_min} kcal` : `${meal.calories_min} - ${meal.calories_max} kcal`) : 'Calorie non calcolate';
            return `<div class="library-item" data-id="${meal.id}"><div class="library-item-info"><span class="library-item-info__name">${meal.nomePasto}</span><span class="library-item-info__details">${calorieText}</span></div><div class="library-item-actions"><button class="btn-edit" title="Modifica">${renderIcon('EDIT', { width: 18, height: 18 })}</button><button class="btn-delete" title="Elimina">${renderIcon('TRASH', { width: 18, height: 18 })}</button></div></div>`;
          }).join('');
        } else {
          mealList.innerHTML = `<p class="placeholder-text">Nessun pasto trovato. Creane uno nuovo o caricalo da una configurazione remota.</p>`;
        }
      
        // Render Exercises
        const exerciseList = document.getElementById('exercise-list');
        const filteredExercises = state.masterWorkoutList.filter(ex => {
            // Filtro Pacchetto
            if (libraryActiveFilter && (!ex.etichette || !ex.etichette.includes(libraryActiveFilter))) {
              return false;
            }
            
            // Filtro Ricerca
            if (lowerCaseSearchTerm !== '') {
              const nameMatch = ex.name.toLowerCase().includes(lowerCaseSearchTerm);
              const tagMatch = ex.etichette && ex.etichette.some(tag => tag.toLowerCase().includes(lowerCaseSearchTerm));
              if (!nameMatch && !tagMatch) return false;
            }
            
            return true;
        });
      
        if (filteredExercises.length > 0) {
          exerciseList.innerHTML = filteredExercises.map(ex => {
            return `<div class="library-item" data-id="${ex.id}">
                      <div class="library-item-info">
                        <span class="library-item-info__name">${ex.name}</span>
                        <span class="library-item-info__details">${formatExerciseDetails(ex)}</span>
                      </div>
                      <div class="library-item-actions">
                        <button class="btn-edit" title="Modifica">${renderIcon('EDIT', { width: 18, height: 18 })}</button>
                        <button class="btn-delete" title="Elimina">${renderIcon('TRASH', { width: 18, height: 18 })}</button>
                      </div>
                    </div>`;
          }).join('');
        } else {
          exerciseList.innerHTML = `<p class="placeholder-text">Nessun esercizio trovato. Creane uno nuovo o carica un pacchetto dalla sezione Esplora.</p>`;
        }
      
        // Render Templates
        const templateList = document.getElementById('template-list');
        const filteredTemplates = state.masterWorkoutTemplateList.filter(t => t.name.toLowerCase().includes(lowerCaseSearchTerm));
        if (filteredTemplates.length > 0) {
          templateList.innerHTML = filteredTemplates.map(template => {
            const exerciseCount = template.exercises.length;
            const plural = exerciseCount === 1 ? 'esercizio' : 'esercizi';
            return `<div class="library-item" data-id="${template.id}">
                      <div class="library-item-info">
                        <span class="library-item-info__name">${template.name}</span>
                        <span class="library-item-info__details">${exerciseCount} ${plural}</span>
                      </div>
                      <div class="library-item-actions">
                        <button class="btn-edit-template" title="Modifica">${renderIcon('EDIT', { width: 18, height: 18 })}</button>
                        <button class="btn-delete-template" title="Elimina">${renderIcon('TRASH', { width: 18, height: 18 })}</button>
                      </div>
                    </div>`;
          }).join('');
        } else {
          templateList.innerHTML = `<p class="placeholder-text">${UI_TEXT.NO_TEMPLATES_AVAILABLE}</p>`;
        }
      }
      
      async function cacheAllPackages() {
        log('Renderer', 'Caching all packages from Content Hub');
        const state = getState();
        if (state.ui.explore.packages.length > 0) {
          log('Renderer', 'Packages already cached.');
          return;
        }
      
        try {
          const indexUrl = new URL('package-index.json', state.contentHubUrl).href;
          const packageIndex = await fetchJson(indexUrl);
      
          const manifestPromises = Object.values(packageIndex).map(path =>
            fetchJson(new URL(path, state.contentHubUrl).href)
          );
          const manifests = await Promise.all(manifestPromises);
      
          manifests.forEach(manifest => {
            const path = packageIndex[manifest.id];
            if (path) {
              manifest.url = new URL(path, state.contentHubUrl).href;
            } else {
              log('Renderer', 'Could not find a path for manifest id:', manifest.id);
              manifest.url = null;
            }
          });
      
          const validManifests = manifests.filter(m => m.url);
      
          setUiState({
            ...state.ui,
            explore: { ...state.ui.explore, packages: validManifests }
          });
          log('Renderer', 'All packages successfully cached.');
      
        } catch (error) {
          log('Renderer', 'Error caching packages', error);
          document.getElementById('explore-grid').innerHTML = `<p class="placeholder-text">Impossibile caricare i contenuti dall'hub.</p>`;
        }
      }
      
      export async function renderExplorePage() {
        log('Renderer', 'Rendering Explore Page');
        const state = getState();
        const { packages, searchTerm, activeTags, sortOrder } = state.ui.explore;
      
        document.getElementById('explore-title').textContent = UI_TEXT.EXPLORE_TITLE;
        document.getElementById('explore-search-input').placeholder = UI_TEXT.EXPLORE_SEARCH_PLACEHOLDER;
        document.getElementById('explore-sort-label').textContent = UI_TEXT.EXPLORE_SORT_LABEL;
        document.getElementById('explore-sort-default').textContent = UI_TEXT.EXPLORE_SORT_DEFAULT;
        document.getElementById('explore-sort-name-asc').textContent = UI_TEXT.EXPLORE_SORT_NAME_ASC;
        document.getElementById('explore-sort-name-desc').textContent = UI_TEXT.EXPLORE_SORT_NAME_DESC;
        document.getElementById('explore-sort-author').textContent = UI_TEXT.EXPLORE_SORT_AUTHOR;
      
      
        if (packages.length === 0) {
          document.getElementById('explore-grid').innerHTML = '<p class="placeholder-text">Caricamento contenuti...</p>';
          await cacheAllPackages();
          return;
        }
      
        const lowerCaseSearchTerm = searchTerm.toLowerCase();
        let filteredPackages = packages.filter(pkg =>
          (pkg.title.toLowerCase().includes(lowerCaseSearchTerm) || pkg.description.toLowerCase().includes(lowerCaseSearchTerm)) &&
          (activeTags.length === 0 || activeTags.every(tag => pkg.tags && pkg.tags.includes(tag)))
        );
      
        switch (sortOrder) {
          case 'name_asc': filteredPackages.sort((a, b) => a.title.localeCompare(b.title)); break;
          case 'name_desc': filteredPackages.sort((a, b) => b.title.localeCompare(a.title)); break;
          case 'author': filteredPackages.sort((a, b) => a.author.localeCompare(b.author)); break;
          default: break;
        }
      
        const allTags = [...new Set(packages.flatMap(p => p.tags || []))].sort();
        const tagsContainer = document.getElementById('explore-tags-container');
        tagsContainer.innerHTML = `<button class="tag-filter-btn ${activeTags.length === 0 ? 'active' : ''}" data-tag="all">${UI_TEXT.EXPLORE_FILTER_ALL}</button>${allTags.map(tag => `<button class="tag-filter-btn ${activeTags.includes(tag) ? 'active' : ''}" data-tag="${tag}">${tag}</button>`).join('')}`;
      
        const gridContainer = document.getElementById('explore-grid');
        if (filteredPackages.length === 0) {
          gridContainer.innerHTML = '<p class="placeholder-text">Nessun pacchetto corrisponde ai criteri di ricerca.</p>';
        } else {
          gridContainer.innerHTML = filteredPackages.map(pkg => `
            <div class="explore-card">
              <img src="${new URL(pkg.image, pkg.url)}" alt="${pkg.title}" class="explore-card-image">
              <div class="explore-card-body">
                <h3>${pkg.title}</h3>
                <p>${pkg.description}</p>
                <div class="explore-card-actions">
                  <button class="btn btn-secondary btn-preview-package" data-url="${pkg.url}">Anteprima</button>
                  <button class="btn btn-primary btn-add-package" data-url="${pkg.url}">${UI_TEXT.EXPLORE_ADD_TO_LIBRARY}</button>
                </div>
              </div>
            </div>
          `).join('');
      
          gridContainer.querySelectorAll('.btn-add-package, .btn-preview-package').forEach(button => {
            button.addEventListener('click', (e) => {
              const packageUrl = e.currentTarget.dataset.url;
              const pkg = packages.find(p => p.url === packageUrl);
              if (!pkg) return;
      
              if (e.currentTarget.classList.contains('btn-add-package')) {
                fetchAndMergePackage(packageUrl);
              } else {
                openPackagePreviewModal(pkg);
              }
            });
          });
        }
      }
  - file: src/ui/interactions/libraryInteractions.js
    content: |
      import { log } from '../../utils/logger.js';
      import { openIngredientEditorModal, openMealEditorModal, openExerciseEditorModal, openWorkoutEditorModal } from '../modals.js';
      import { showConfirmModal } from '../modals.js';
      import { deleteIngredient, deleteMeal, getState, setUiState, deleteWorkoutTemplate, deleteExercise } from '../../core/state.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { showNotification } from '../notifications.js';
      
      function handleLibraryClick(e) {
        const state = getState();
      
        // Tab switching
        const tabBtn = e.target.closest('.btn-view');
        if (tabBtn && tabBtn.dataset.view) {
          const newView = tabBtn.dataset.view;
          log('Interactions-Library', 'Tab changed', { newView });
          setUiState({
            ...state.ui,
            activeLibraryTab: newView,
            libraryActiveFilter: null,
          });
          return;
        }
      
        // Package Tag filter
        const tagFilterBtn = e.target.closest('.tag-filter-btn');
        if (tagFilterBtn && tagFilterBtn.dataset.tag) {
          const tag = tagFilterBtn.dataset.tag;
          const newFilter = tag === 'all' ? null : tag;
          log('Interactions-Library', 'Package filter changed', { newFilter });
          setUiState({
            ...state.ui,
            libraryActiveFilter: newFilter,
          });
          return;
        }
      
        // --- Ingredient Actions ---
        if (state.ui.activeLibraryTab === 'ingredients') {
          const addBtn = e.target.closest('#add-ingredient-btn');
          if (addBtn) {
            log('Interactions-Library', 'Add new ingredient button clicked');
            openIngredientEditorModal();
            return;
          }
      
          const item = e.target.closest('.library-item');
          if (!item) return;
      
          const ingredientId = item.dataset.id;
          const ingredient = state.masterIngredientList.find(ing => ing.id === ingredientId);
          if (!ingredient) return;
      
          const editBtn = e.target.closest('.btn-edit');
          if (editBtn) {
            log('Interactions-Library', 'Edit ingredient button clicked', { ingredientId });
            openIngredientEditorModal(ingredient);
            return;
          }
      
          const deleteBtn = e.target.closest('.btn-delete');
          if (deleteBtn) {
            log('Interactions-Library', 'Delete ingredient button clicked', { ingredientId });
            showConfirmModal({
              title: UI_TEXT.INGREDIENT_DELETE_CONFIRM_TITLE,
              message: `${UI_TEXT.INGREDIENT_DELETE_CONFIRM_MSG} "${ingredient.nome}"?`,
              onConfirm: () => {
                deleteIngredient(ingredientId);
                showNotification(UI_TEXT.INGREDIENT_DELETE_SUCCESS, 'success');
              },
              type: 'danger'
            });
            return;
          }
        }
      
        // --- Meal Actions ---
        if (state.ui.activeLibraryTab === 'meals') {
          const addMealBtn = e.target.closest('#add-meal-btn');
          if (addMealBtn) {
            log('Interactions-Library', 'Add new meal button clicked');
            openMealEditorModal();
            return;
          }
      
          const mealItem = e.target.closest('.library-item');
          if (!mealItem) return;
      
          const mealId = mealItem.dataset.id;
          const meal = state.masterMealList.find(m => m.id === mealId);
          if (!meal) return;
      
          const editMealBtn = e.target.closest('.btn-edit');
          if (editMealBtn) {
            log('Interactions-Library', 'Edit meal button clicked', { mealId });
            openMealEditorModal(meal);
            return;
          }
      
          const deleteMealBtn = e.target.closest('.btn-delete');
          if (deleteMealBtn) {
            log('Interactions-Library', 'Delete meal button clicked', { mealId });
            showConfirmModal({
              title: UI_TEXT.MEAL_DELETE_CONFIRM_TITLE,
              message: `${UI_TEXT.MEAL_DELETE_CONFIRM_MSG} "${meal.nomePasto}"?`,
              onConfirm: () => {
                deleteMeal(mealId);
                showNotification(UI_TEXT.MEAL_DELETE_SUCCESS, 'success');
              },
              type: 'danger'
            });
            return;
          }
        }
      
        // --- Exercise Actions ---
        if (state.ui.activeLibraryTab === 'exercises') {
          const addBtn = e.target.closest('#add-exercise-btn');
          if (addBtn) {
            log('Interactions-Library', 'Add new exercise button clicked');
            openExerciseEditorModal({ context: 'library', exercise: null });
            return;
          }
      
          const item = e.target.closest('.library-item');
          if (!item) return;
      
          const exerciseId = item.dataset.id;
          const exercise = state.masterWorkoutList.find(ex => ex.id === exerciseId);
          if (!exercise) return;
      
          const editBtn = e.target.closest('.btn-edit');
          if (editBtn) {
            log('Interactions-Library', 'Edit exercise button clicked', { exerciseId });
            openExerciseEditorModal({ context: 'library', exercise: exercise });
            return;
          }
      
          const deleteBtn = e.target.closest('.btn-delete');
          if (deleteBtn) {
            log('Interactions-Library', 'Delete exercise button clicked', { exerciseId });
            showConfirmModal({
              title: UI_TEXT.EXERCISE_DELETE_CONFIRM_TITLE,
              message: `${UI_TEXT.EXERCISE_DELETE_CONFIRM_MSG} "${exercise.name}"?`,
              onConfirm: () => {
                deleteExercise(exerciseId);
                showNotification(UI_TEXT.EXERCISE_DELETE_SUCCESS, 'success');
              },
              type: 'danger'
            });
            return;
          }
        }
      
        // --- Template Actions ---
        if (state.ui.activeLibraryTab === 'templates') {
          const templateItem = e.target.closest('.library-item');
          if (!templateItem) return;
      
          const templateId = parseFloat(templateItem.dataset.id);
          const template = state.masterWorkoutTemplateList.find(t => t.id === templateId);
          if (!template) return;
      
          const editTemplateBtn = e.target.closest('.btn-edit-template');
          if (editTemplateBtn) {
            log('Interactions-Library', 'Edit template button clicked', { templateId });
            openWorkoutEditorModal({ type: 'template', templateId: template.id });
            return;
          }
      
          const deleteTemplateBtn = e.target.closest('.btn-delete-template');
          if (deleteTemplateBtn) {
            log('Interactions-Library', 'Delete template button clicked', { templateId });
            showConfirmModal({
              title: UI_TEXT.TEMPLATE_DELETE_CONFIRM_TITLE,
              message: `${UI_TEXT.TEMPLATE_DELETE_CONFIRM_MSG} "${template.name}"?`,
              onConfirm: () => {
                deleteWorkoutTemplate(templateId);
                showNotification(UI_TEXT.TEMPLATE_DELETE_SUCCESS, 'success');
              },
              type: 'danger'
            });
            return;
          }
        }
      }
      
      function handleSearchInput(e) {
        const searchTerm = e.target.value;
        const currentState = getState();
        setUiState({
          ...currentState.ui,
          librarySearchTerm: searchTerm
        });
      }
      
      export function initializeLibraryListeners() {
        log('Interactions', 'Initializing library listeners');
        const libraryPage = document.getElementById('library-page');
        if (libraryPage) {
          libraryPage.addEventListener('click', handleLibraryClick);
          const searchInput = document.getElementById('library-search-input');
          searchInput.addEventListener('input', handleSearchInput);
        }
      }
  - file: src/ui/modals/dayEditorModal.js
    content: |
      import { getState, updateWeeklyPlan, getMealsForType, addWorkoutTemplateToDay } from '../../core/state.js';
      import { MEAL_TYPES, WORKOUT_SLOT_ID, OPTIONAL_MEAL_TYPES } from '../../utils/constants.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { renderIcon } from '../icons.js';
      import { log } from '../../utils/logger.js';
      import { showRecipeModal } from './recipeModal.js';
      import { openSelectionModal, openWorkoutTemplateSelectionModal } from './selectionModal.js';
      import { openWorkoutEditorModal } from './workoutEditorModal.js';
      import { openManualWorkoutModal } from './manualWorkoutModal.js';
      import { formatIngredients } from '../../utils/formatters.js';
      
      let currentEditingDayISO = null;
      
      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }
      
      function getRecipeButtonHTML(meal, state) {
        if (state.recipeBaseUrl && meal && meal.recipeId) {
          return `<button class="btn-view-recipe" data-meal-id="${meal.id}" title="${UI_TEXT.RECIPE_BUTTON_TITLE}">
                    ${renderIcon('RECIPE', { width: 20, height: 20 })}
                  </button>`;
        }
        return '';
      }
      
      export function openDayEditorModal(isoDate) {
        log('Modals', 'Opening day editor modal', { isoDate });
        currentEditingDayISO = isoDate;
        const state = getState();
        const { userProfile } = state;
        const dayEditorModal = document.getElementById('day-editor-modal');
        dayEditorModal.querySelector('#day-editor-title').textContent = `${UI_TEXT.EDITOR_MODAL_TITLE_PREFIX} ${formatFullDate(isoDate)}`;
        const body = dayEditorModal.querySelector('#day-editor-body');
      
        // Build dynamic list of meal slots to show
        const activeMealSlots = [...MEAL_TYPES];
        Object.keys(OPTIONAL_MEAL_TYPES).forEach(key => {
          if (userProfile[key]) {
            activeMealSlots.push(OPTIONAL_MEAL_TYPES[key]);
          }
        });
      
        const mealSlotsHTML = activeMealSlots.map(mealType => {
          const slotId = `${isoDate}-${mealType}`;
          const plannedMeal = state.weeklyPlan[slotId];
          const meal = plannedMeal ? state.masterMealList.find(m => m.id === plannedMeal.id) : null;
      
          let mealContentHTML = `<button class="btn-add-meal" data-slot-id="${slotId}" data-meal-type="${mealType}">${UI_TEXT.ADD_MEAL_BTN}</button>`;
          if (meal) {
            mealContentHTML = `
                <div class="meal-details">
                  <div class="meal-info">
                    <span class="meal-details__name">${meal.nomePasto}</span>
                    ${formatIngredients(meal)}
                  </div>
                  <div class="meal-actions">
                    ${getRecipeButtonHTML(meal, state)}
                    <button class="btn-remove-meal" data-slot-id="${slotId}">${renderIcon('TRASH', { width: 16, height: 16 })}</button>
                  </div>
                </div>`;
          }
          return `<div class="editor-section">
                    <div class="editor-section-header">${mealType}</div>
                    <div class="editor-section-body">${mealContentHTML}</div>
                  </div>`;
        }).join('');
      
        const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
        const plannedWorkoutList = state.weeklyWorkouts[workoutSlotId] || [];
      
        let workoutDetailsHTML;
        if (plannedWorkoutList.length > 0) {
            const plural = plannedWorkoutList.length > 1 ? 'Esercizi' : 'Esercizio';
            workoutDetailsHTML = `<div class="workout-summary">
                                    <span>${plannedWorkoutList.length} ${plural}</span>
                                    <div class="workout-summary-actions">
                                      <button class="btn-log-activity btn-icon" title="${UI_TEXT.LOG_ACTIVITY_BTN}">${renderIcon('PLANNER')}</button>
                                      <button class="btn-add-from-template btn-icon" title="${UI_TEXT.ADD_FROM_TEMPLATE_BTN}">${renderIcon('BOOK')}</button>
                                      <button class="btn-manage-workout btn-icon" title="${UI_TEXT.MANAGE_WORKOUT_BTN}">${renderIcon('DUMBBELL')}</button>
                                    </div>
                                  </div>`;
        } else {
            workoutDetailsHTML = `<div class="workout-summary-actions">
                                    <button class="btn-log-activity btn-icon" title="${UI_TEXT.LOG_ACTIVITY_BTN}">${renderIcon('PLANNER')}</button>
                                    <button class="btn-add-from-template btn-icon" title="${UI_TEXT.ADD_FROM_TEMPLATE_BTN}">${renderIcon('BOOK')}</button>
                                    <button class="btn-add-exercise btn-icon" data-slot-id="${workoutSlotId}" title="${UI_TEXT.ADD_EXERCISE_BTN}">${renderIcon('DUMBBELL')}</button>
                                  </div>`;
        }
      
        const workoutSlotHTML = `<div class="editor-section">
                                  <div class="editor-section-header">${WORKOUT_SLOT_ID}</div>
                                  <div class="editor-section-body">${workoutDetailsHTML}</div>
                                </div>`;
      
        body.innerHTML = mealSlotsHTML + workoutSlotHTML;
      
        body.onclick = e => {
          const btnAddMeal = e.target.closest('.btn-add-meal');
          const btnRemoveMeal = e.target.closest('.btn-remove-meal');
          const btnRecipe = e.target.closest('.btn-view-recipe');
          const btnAddExercise = e.target.closest('.btn-add-exercise');
          const btnAddFromTemplate = e.target.closest('.btn-add-from-template');
          const btnManageWorkout = e.target.closest('.btn-manage-workout');
          const btnLogActivity = e.target.closest('.btn-log-activity');
      
          if (btnAddMeal) {
            const mealType = btnAddMeal.dataset.mealType;
            const relevantMeals = getMealsForType(mealType);
            dayEditorModal.classList.add('modal-hidden');
            openSelectionModal(btnAddMeal.dataset.slotId, isoDate, relevantMeals);
          }
          else if (btnRemoveMeal) { updateWeeklyPlan(btnRemoveMeal.dataset.slotId, null); openDayEditorModal(isoDate); }
          else if (btnRecipe) {
            const meal = state.masterMealList.find(m => m.id === btnRecipe.dataset.mealId);
            if (meal) showRecipeModal(meal);
          }
          else if (btnAddExercise) {
            dayEditorModal.classList.add('modal-hidden');
            openWorkoutEditorModal({ type: 'day', isoDate: isoDate });
          }
          else if (btnAddFromTemplate) {
            dayEditorModal.classList.add('modal-hidden');
            openWorkoutTemplateSelectionModal((template) => {
              if (template) {
                addWorkoutTemplateToDay(workoutSlotId, template.id);
              }
              openDayEditorModal(isoDate);
            });
          }
          else if (btnManageWorkout) {
            dayEditorModal.classList.add('modal-hidden');
            openWorkoutEditorModal({ type: 'day', isoDate: isoDate });
          }
          else if (btnLogActivity) {
            dayEditorModal.classList.add('modal-hidden');
            openManualWorkoutModal(isoDate);
          }
        };
        dayEditorModal.classList.remove('modal-hidden');
      }
  - file: src/ui/modals/workoutEditorModal.js
    content: |
      import { getState, updateWeeklyWorkout, reorderWorkoutExercises, getExerciseForPlanner, addWorkoutTemplate, clearWeeklyWorkout, getTemplateById, setWeeklyWorkout, updateWorkoutTemplate } from '../../core/state.js';
      import { WORKOUT_SLOT_ID } from '../../utils/constants.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { renderIcon } from '../icons.js';
      import { log } from '../../utils/logger.js';
      import { openWorkoutSelectionModal } from './selectionModal.js';
      import { openExerciseEditorModal } from './exerciseEditorModal.js';
      import { showNotification } from '../notifications.js';
      import { showConfirmModal } from './confirmModal.js';
      
      let sortableInstance = null;
      let localExercises = [];
      let currentConfig = {};
      
      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }
      
      function formatExerciseDetails(exercise) {
        const sets = exercise.defaultSets || '?';
        const rest = exercise.defaultRest || 0;
        let details = `${sets} x `;
      
        // Gestisce reps, rep-range, o durata in base alla modalità
        if (exercise.execution_mode === 'logging') {
            if (exercise.defaultRepsMin && exercise.defaultRepsMax) {
                details += `${exercise.defaultRepsMin}-${exercise.defaultRepsMax}`;
            } else if (exercise.defaultRepsMin) {
                details += `${exercise.defaultRepsMin}+`;
            } else {
                details += `Reps`; // Fallback
            }
        } else if (exercise.execution_mode === 'guided_static' || exercise.type === 'time') {
            details += `${exercise.defaultDuration || '?'}s`;
        } else {
            // Default a 'guided_tempo' o vecchio formato 'reps'
            details += `${exercise.defaultReps || '?'} reps`;
        }
        
        details += ` | Riposo: ${rest}s`;
      
        if (exercise.defaultTempo && exercise.execution_mode === 'guided_tempo') {
            const { up, hold, down } = exercise.defaultTempo;
            details += ` | Tempo: ${up}-${hold}-${down}`;
        }
        return details;
      }
      
      function renderList() {
        const body = document.getElementById('workout-editor-body');
        let exercisesHTML = localExercises.map((exercise, index) => {
            const exerciseDetails = formatExerciseDetails(exercise);
            return `<div class="meal-details draggable-item" data-index="${index}" data-instance-id="${exercise.instanceId}">
                        <div class="drag-handle">${renderIcon('DRAG_HANDLE', { width: 18, height: 18 })}</div>
                        <div class="exercise-info">
                            <span class="meal-details__name">${exercise.name}</span>
                            <span class="exercise-details-summary">${exerciseDetails}</span>
                        </div>
                        <div class="meal-actions">
                            <button class="btn-edit-exercise" title="Modifica" data-index="${index}">${renderIcon('EDIT', { width: 16, height: 16 })}</button>
                            <button class="btn-remove-exercise" title="Rimuovi" data-index="${index}">${renderIcon('TRASH', { width: 16, height: 16 })}</button>
                        </div>
                    </div>`;
        }).join('');
      
        const addExerciseButton = `<button class="btn-add-exercise">${UI_TEXT.ADD_EXERCISE_BTN}</button>`;
        body.innerHTML = `<div class="day-editor-list workout-editor-list">${exercisesHTML}</div>${addExerciseButton}`;
      
        const listContainer = body.querySelector('.workout-editor-list');
      
        if (sortableInstance) {
            sortableInstance.destroy();
        }
        sortableInstance = new Sortable(listContainer, {
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            onEnd: function(evt) {
                const [movedItem] = localExercises.splice(evt.oldIndex, 1);
                localExercises.splice(evt.newIndex, 0, movedItem);
                renderList(); // Rerender per aggiornare gli indici
            }
        });
      }
      
      function handleModalClick(e) {
          const btnAddExercise = e.target.closest('.btn-add-exercise');
          const btnRemoveExercise = e.target.closest('.btn-remove-exercise');
          const btnEditExercise = e.target.closest('.btn-edit-exercise');
      
          if (btnAddExercise) {
              document.getElementById('workout-editor-modal').classList.add('modal-hidden');
              openWorkoutSelectionModal((exercise) => {
                if (exercise) {
                  const newExerciseInstance = { ...exercise, instanceId: Date.now() + Math.random() };
                  localExercises.push(newExerciseInstance);
                }
                openWorkoutEditorModal(currentConfig); // Riapre il modal aggiornato
              });
          } else if (btnRemoveExercise) {
              const index = parseInt(btnRemoveExercise.dataset.index, 10);
              localExercises.splice(index, 1);
              renderList(); // Rerender
          } else if (btnEditExercise) {
              const index = parseInt(btnEditExercise.dataset.index, 10);
              const exercise = localExercises[index];
              if (exercise) {
                openExerciseEditorModal({
                  context: 'planner', // Usa lo stesso editor del planner
                  exercise,
                  slotId: null, // Non serve lo slotId, gestiamo localmente
                  returnIsoDate: null, // Gestito dal callback
                  // Callback custom per aggiornare localExercises
                  onSave: (updatedExercise) => {
                    localExercises[index] = updatedExercise;
                    renderList();
                    openWorkoutEditorModal(currentConfig); // Riapre il modal aggiornato
                  }
                });
              }
          }
      }
      
      // Handler per il salvataggio del planner, per mantenere la compatibilità
      function plannerSaveHandler(e) {
        e.preventDefault();
        const form = e.target.closest('.modal-content').querySelector('#exercise-editor-form');
        const { exercise, slotId, returnIsoDate, onSave } = e.target.onSaveConfig;
      
        const newValues = {
            execution_mode: form.elements.execution_mode.value,
            defaultSets: parseInt(form.elements.defaultSets.value),
            defaultRest: parseInt(form.elements.defaultRest.value),
            defaultWeight: parseFloat(form.elements.defaultWeight.value),
            defaultReps: null,
            defaultDuration: null,
            defaultRepsMin: null,
            defaultRepsMax: null,
            defaultTempo: exercise.defaultTempo
        };
      
        if (newValues.execution_mode === 'guided_tempo') {
            newValues.defaultReps = parseInt(form.elements.defaultReps.value);
            newValues.defaultTempo = {
                up: parseInt(form.elements['defaultTempo.up'].value),
                hold: parseInt(form.elements['defaultTempo.hold'].value),
                down: parseInt(form.elements['defaultTempo.down'].value)
            };
        } else if (newValues.execution_mode === 'guided_static') {
            newValues.defaultDuration = parseInt(form.elements.defaultDuration.value);
        } else if (newValues.execution_mode === 'logging') {
            newValues.defaultRepsMin = parseInt(form.elements.defaultRepsMin.value);
            newValues.defaultRepsMax = parseInt(form.elements.defaultRepsMax.value);
        }
      
        const updatedExercise = { ...exercise, ...newValues };
      
        if (onSave) {
          // Nuovo flusso per workoutEditorModal
          onSave(updatedExercise);
        } else {
          // Flusso vecchio per planner
          updateExerciseInstanceInWorkout(slotId, exercise.instanceId, newValues);
          openWorkoutEditorModal({ type: 'day', isoDate: returnIsoDate });
        }
      
        document.getElementById('exercise-editor-modal').classList.add('modal-hidden');
      }
      
      // Sovrascrive openExerciseEditorModal per intercettare il salvataggio
      // Questo è un workaround per non dover refactorizzare anche exerciseEditorModal
      function openWorkoutExerciseEditor(config) {
        if (config.context === 'planner' && config.onSave) {
          log('Modals', 'Intercepting exercise editor for workout editor');
          // Chiamata standard
          openExerciseEditorModal(config);
          // Aggiungi il nostro handler custom
          const saveBtn = document.getElementById('exercise-editor-save-btn');
          const newSaveBtn = saveBtn.cloneNode(true); // Clona
          saveBtn.parentNode.replaceChild(newSaveBtn, saveBtn); // Sostituisci
          
          newSaveBtn.onSaveConfig = config; // Allega la config al pulsante
          newSaveBtn.addEventListener('click', plannerSaveHandler, { once: true });
        } else {
          openExerciseEditorModal(config);
        }
      }
      
      export function openWorkoutEditorModal(config) {
        log('Modals', 'Opening workout editor modal (refactored)', { config });
        currentConfig = config; // Salva la configurazione corrente
        const state = getState();
        const modal = document.getElementById('workout-editor-modal');
        const body = modal.querySelector('#workout-editor-body');
        const footer = modal.querySelector('.modal-footer');
      
        let title = '';
        if (config.type === 'day') {
          const workoutSlotId = `${config.isoDate}-${WORKOUT_SLOT_ID}`;
          localExercises = JSON.parse(JSON.stringify(state.weeklyWorkouts[workoutSlotId] || []));
          title = `${UI_TEXT.WORKOUT_EDITOR_TITLE} - ${formatFullDate(config.isoDate)}`;
        } else if (config.type === 'template') {
          const template = getTemplateById(config.templateId);
          localExercises = template ? JSON.parse(JSON.stringify(template.exercises)) : [];
          title = `Modifica Scheda: ${template ? template.name : ''}`;
        }
      
        modal.querySelector('#workout-editor-title').textContent = title;
        modal.querySelector('#workout-editor-save-template-btn').textContent = UI_TEXT.SAVE_TEMPLATE_BTN;
        modal.querySelector('#workout-editor-clear-btn').textContent = UI_TEXT.CLEAR_WORKOUT_BTN;
      
        // Aggiungi il nuovo pulsante "Salva Modifiche" se non esiste
        if (!footer.querySelector('#workout-editor-save-btn')) {
          const saveBtn = document.createElement('button');
          saveBtn.id = 'workout-editor-save-btn';
          saveBtn.className = 'btn btn-primary';
          footer.appendChild(saveBtn);
        }
        footer.querySelector('#workout-editor-save-btn').textContent = UI_TEXT.WORKOUT_EDITOR_SAVE_CHANGES_BTN;
      
        renderList(); // Renderizza la lista locale
      
        // --- Gestione Listener (rimuovi e riaggiungi) ---
        body.onclick = handleModalClick; // Usa un handler dedicato
      
        const oldSaveTemplateBtn = footer.querySelector('#workout-editor-save-template-btn');
        const newSaveTemplateBtn = oldSaveTemplateBtn.cloneNode(true);
        oldSaveTemplateBtn.parentNode.replaceChild(newSaveTemplateBtn, oldSaveTemplateBtn);
        newSaveTemplateBtn.onclick = () => {
          if (localExercises.length === 0) {
            showNotification('Aggiungi almeno un esercizio prima di salvare la scheda.', 'error');
            return;
          }
          const templateName = prompt(UI_TEXT.SAVE_TEMPLATE_PROMPT);
          if (templateName && templateName.trim() !== '') {
            addWorkoutTemplate(templateName.trim(), localExercises);
            showNotification(UI_TEXT.TEMPLATE_SAVE_SUCCESS, 'success');
          }
        };
      
        const oldClearBtn = footer.querySelector('#workout-editor-clear-btn');
        const newClearBtn = oldClearBtn.cloneNode(true);
        oldClearBtn.parentNode.replaceChild(newClearBtn, oldClearBtn);
        newClearBtn.onclick = () => {
          if (localExercises.length === 0) {
            showNotification('L\'allenamento è già vuoto.', 'info');
            return;
          }
          showConfirmModal({
            title: UI_TEXT.CLEAR_WORKOUT_CONFIRM_TITLE,
            message: UI_TEXT.CLEAR_WORKOUT_CONFIRM_MSG,
            onConfirm: () => {
              localExercises = [];
              renderList();
              showNotification(UI_TEXT.CLEAR_WORKOUT_SUCCESS, 'success');
            },
            type: 'danger'
          });
        };
      
        const oldSaveBtn = footer.querySelector('#workout-editor-save-btn');
        const newSaveBtn = oldSaveBtn.cloneNode(true);
        oldSaveBtn.parentNode.replaceChild(newSaveBtn, oldSaveBtn);
        newSaveBtn.onclick = () => {
          if (config.type === 'day') {
            const workoutSlotId = `${config.isoDate}-${WORKOUT_SLOT_ID}`;
            setWeeklyWorkout(workoutSlotId, localExercises);
          } else if (config.type === 'template') {
            updateWorkoutTemplate(config.templateId, localExercises);
          }
          showNotification(UI_TEXT.WORKOUT_EDITOR_UPDATE_SUCCESS, 'success');
          modal.classList.add('modal-hidden');
        };
        // --- Fine Gestione Listener ---
      
        modal.classList.remove('modal-hidden');
      }