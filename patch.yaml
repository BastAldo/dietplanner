commit_message: "fix(trainer): Refactor animation engine to eliminate race condition"
rationale: |
  This patch implements a definitive fix for the critical race condition in the Trainer module that caused workouts to skip directly to the 'resting' state. The previous fixes addressed symptoms, but this patch refactors the core animation logic to resolve the root cause.

  **Problem Analysis:**
  The previous architecture had two functions, `processQueue` (async, for instant events) and `tick` (frame-based, for timed events), running in parallel. This created a race condition:
  1. `processQueue` would recursively execute all non-timed events (`speech`, `audio`) in a single burst of microtasks.
  2. It would reach the end of the command queue and incorrectly call `completeSet()` before the `tick` function had a chance to process the first timed `movement` command.
  3. This resulted in the workout state immediately changing to 'resting', skipping the entire exercise.

  **Architectural Solution:**
  1.  **Single Source of Truth for Advancement:** The animation engine in `src/core/trainer/animation.js` has been refactored. The `tick` function is now the *single and only* driver responsible for advancing the `currentPhaseIndex`.
  2.  **Elimination of `processQueue`:** The faulty, recursive `processQueue` function has been completely removed. Its logic for handling instant events has been merged directly into the main `tick` loop.
  3.  **Synchronous-First Loop:** The `tick` function now operates as a synchronous loop for all non-timed events. It will process an event (`speech`, `audio`) and immediately advance to the next index in the same frame, until it encounters a timed `movement` event.
  4.  **Correct Ceding of Control:** Only when a `movement` event is encountered does the `tick` function perform its time-based calculations and schedule the next frame with `requestAnimationFrame`.

  This new architecture eliminates the race condition entirely, creating a stable, predictable, and easier-to-debug execution flow. The Trainer now correctly waits for announcements and executes all phases of an exercise in the proper sequence.
