commit_message: "feat(UX): Unifica modale modifica, aggiunge conferma e migliora guida vocale"
rationale: |
  Questo commit implementa tre miglioramenti significativi all'esperienza utente, basati sul feedback dettagliato ricevuto, per aumentare la coerenza, la sicurezza e la qualità delle funzionalità principali.

  1.  **Unificazione del Modale di Modifica Esercizio**: È stata eliminata la duplicazione dei modali di modifica. Ora, un singolo componente (`exerciseEditorModal`) gestisce sia la modifica degli esercizi pianificati che di quelli registrati nel log. Il componente è stato refattorizzato per adattare dinamicamente la sua interfaccia e la sua logica di salvataggio in base al contesto, garantendo un'esperienza utente coerente e prevedibile, come richiesto.

  2.  **Introduzione della Conferma di Fine Allenamento**: Per prevenire la terminazione accidentale di una sessione di allenamento, è stato implementato un modale di conferma che appare quando l'utente clicca sul pulsante "Termina". L'allenamento termina solo dopo una conferma esplicita, salvaguardando i progressi dell'utente.

  3.  **Raffinamento della Guida Vocale del Trainer**: La funzionalità di feedback vocale è stata notevolmente migliorata. La velocità della voce è stata ridotta per una maggiore chiarezza. Gli annunci superflui sono stati rimossi; ora la guida vocale annuncia solo l'azione imminente (es. "su", "tieni") durante le brevi fasi di preparazione, fornendo un preavviso efficace e non invasivo che migliora la concentrazione durante l'esercizio.
