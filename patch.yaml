commit_message: "fix(UI): Corregge label mancante, bug layout modale e migliora widget riepilogo"
rationale: |
  Questo commit affronta e risolve tre specifiche criticità di usabilità emerse dall'analisi.

  1.  **Correzione Label Obiettivo Peso**: È stato aggiunto il testo mancante per il campo "Obiettivo Peso" nella pagina Obiettivi. La chiave `GOAL_WEIGHT_LABEL` è stata creata in `uiText.js` e implementata in `pageRenderers.js`, ripristinando la corretta visualizzazione del form.

  2.  **Fix Layout Modale Attività Manuale**: È stato risolto il bug di overflow che si verificava nel modale di registrazione attività manuale su schermi mobile. La regola CSS `.structured-form` è stata resa responsiva, adottando un layout a colonna singola su schermi piccoli e a due colonne su schermi più grandi, garantendo una visualizzazione corretta su tutti i dispositivi.

  3.  **Miglioramento Widget Riepilogo Planner**: Il widget di riepilogo settimanale è stato potenziato per includere lo stato di avanzamento verso l'obiettivo di peso. Ora mostra l'ultimo peso registrato a confronto con l'obiettivo impostato, fornendo all'utente un feedback più completo e immediato sui propri progressi.
