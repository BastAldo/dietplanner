commit_message: "fix(ui): Standardizza l'uso delle icone e corregge l'errore di importazione"
rationale: |
  Questa patch risolve un errore critico di runtime in `src/ui/recipesRenderer.js` causato da un'importazione errata del modulo delle icone.
  Il file tentava di utilizzare un'importazione di default (`import ICONS from...`) da `src/ui/icons.js`, che però esporta solo la funzione nominata `renderIcon`.

  La soluzione implementata allinea `recipesRenderer.js` allo standard utilizzato nel resto dell'applicazione:
  1. L'istruzione di importazione è stata corretta per importare la funzione `renderIcon`.
  2. Il template HTML è stato aggiornato per utilizzare `renderIcon('ICON_NAME')` invece di accedere direttamente a un oggetto `ICONS`.
  3. I nomi delle icone sono stati corretti (`'EDIT'`, `'TRASH'`) per corrispondere a quelli definiti in `icons.js`.
  4. L'icona inesistente 'add' è stata sostituita con un testo '+' per mantenere la funzionalità visiva.

  Questo approccio risolve il bug in modo definitivo e garantisce la coerenza del codice nell'intero progetto.
patches:
  - file: src/ui/recipesRenderer.js
    content: |
      import { renderIcon } from './icons.js';
      import { formatIngredients } from '../utils/formatters.js';

      export function renderRecipes(recipes) {
          if (!recipes || recipes.length === 0) {
              return '<p>Nessuna ricetta trovata. Aggiungi ricette tramite la configurazione.</p>';
          }

          let html = `
              <div class="recipes-container">
                  <div class="add-recipe-card" id="add-recipe-btn">
                      <div class="add-recipe-icon">+</div>
                      <div class="add-recipe-text">Aggiungi Ricetta</div>
                  </div>
          `;

          recipes.forEach(recipe => {
              html += `
                  <div class="recipe-card" data-recipe-id="${recipe.id}">
                      <div class="recipe-card-header">
                          <h3>${recipe.nomePasto}</h3>
                          <div class="recipe-card-actions">
                              <button class="icon-btn edit-recipe-btn" data-recipe-id="${recipe.id}">${renderIcon('EDIT')}</button>
                              <button class="icon-btn delete-recipe-btn" data-recipe-id="${recipe.id}">${renderIcon('TRASH')}</button>
                          </div>
                      </div>
                      <div class="recipe-card-body">
                          <p><strong>Tipo:</strong> ${recipe.tipoPasto}</p>
                          <p><strong>Calorie:</strong> ${recipe.calories_min}${recipe.calories_max ? ' - ' + recipe.calories_max : ''} kcal</p>
                          <div>
                              <strong>Ingredienti:</strong>
                              ${formatIngredients(recipe.ingredienti)}
                          </div>
                          <p><strong>Etichette:</strong> ${recipe.etichette ? recipe.etichette.join(', ') : 'N/A'}</p>
                      </div>
                  </div>
              `;
          });

          html += '</div>';
          return html;
      }
commands:
  - echo "Patch applicata. L'uso delle icone è stato standardizzato e l'errore di importazione è stato risolto."