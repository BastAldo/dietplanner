commit_message: "fix(trainer): Ripristina UI unificata con ring e corregge bug di transizione"
rationale: |
  Questo commit risolve due problemi critici introdotti nella precedente implementazione delle modalità di allenamento: un bug di stato che causava la visualizzazione di `NaN:NaN` e una regressione della UI che frammentava l'esperienza utente.

  **Correzione del Bug di Transizione (`NaN:NaN`)**:
  - Il problema era causato da una pulizia incompleta dello stato durante il passaggio da un esercizio all'altro.
  - È stata modificata la funzione `advanceToNextExercise` in `src/core/trainer/machine.js` per eseguire una reinizializzazione completa e robusta dello stato. Ora, prima di passare all'esercizio successivo, vengono resettate tutte le variabili specifiche delle modalità precedenti (`setTimeRemaining`, `manualRepCount`, `executionQueue`, etc.) e viene impostata correttamente la `executionMode` del nuovo esercizio. Questo garantisce che ogni esercizio parta da uno stato pulito, eliminando il bug.

  **Ripristino della UI Unificata**:
  - In risposta al feedback dell'utente, è stata abbandonata l'architettura a tre interfacce separate. L'approccio è stato refattorizzato per mantenere il "timer ring" come elemento visivo centrale e coerente per tutte le modalità di esecuzione.
  - **`templates/trainer.html`**: I contenitori specifici per le modalità `static_hold` e `manual_reps` sono stati rimossi. Ora esiste un unico contenitore principale per il trainer che ospita sempre il ring.
  - **`styles/trainer.css`**: Gli stili sono stati aggiornati per permettere al testo all'interno del ring di adattarsi dinamicamente in termini di dimensione e formato, a seconda della modalità attiva.
  - **`src/ui/components/TrainerComponent.js`**: Il componente è stato profondamente refattorizzato. Invece di alternare la visibilità di blocchi HTML, ora modifica dinamicamente il contenuto del testo SVG del ring e l'avanzamento del suo bordo per riflettere lo stato corrente:
    - `tempo_guided`: Mostra il nome della fase e il progresso della fase.
    - `static_hold`: Mostra il tempo rimanente (`mm:ss`) e il progresso totale della serie.
    - `manual_reps`: Mostra il conteggio delle ripetizioni e il progresso verso l'obiettivo.

  Questo intervento ripristina la coerenza visiva, migliora l'esperienza utente e rende la logica di stato del trainer più stabile e prevedibile.
