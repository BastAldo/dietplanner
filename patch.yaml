commit_message: "refactor: Modularizza l'architettura con CSS e template separati"
rationale: |
  In linea con il piano approvato, questo refactoring smantella i file monolitici `index.html` e `style.css` per migliorare la manutenibilità e la scalabilità del progetto.

  1. **Modularizzazione CSS**: `style.css` è stato suddiviso in file specifici per responsabilità (`base.css`, `planner.css`, `progress.css`, `modals.css`) all'interno di una nuova directory `styles/`. Questo isola gli stili e semplifica le modifiche future.

  2. **Template HTML Esterni**: Le sezioni principali dell'interfaccia (le viste `planner`, `progress`, `profile` e i modali) sono state estratte da `index.html` e collocate in file `.html` dedicati all'interno della nuova directory `templates/`. `index.html` ora funge da semplice "guscio" dell'applicazione.

  3. **Caricamento Dinamico delle Viste**: È stato introdotto un nuovo modulo `src/ui/viewLoader.js`, che si occupa di caricare dinamicamente i template HTML e di iniettarli nel DOM al momento dell'avvio. Questo approccio, orchestrato da `main.js`, mantiene il DOM pulito e carica solo ciò che è necessario.

  4. **Aggiornamento del Service Worker**: Il file `sw.js` è stato aggiornato per includere tutti i nuovi file CSS e HTML nella cache. Questo è un passo critico per garantire che l'applicazione rimanga pienamente funzionale in modalità offline.

  Questo intervento architetturale non introduce complessità superflue, ma pone le basi per uno sviluppo futuro più organizzato ed efficiente.
