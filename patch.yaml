commit_message: "fix(trainer): Final refactor of animation engine for sequential execution"
rationale: |
  This patch implements the definitive fix for the Trainer's execution logic, resolving a critical issue where the animation engine would process all non-timed events in a single frame and then stall at the beginning of the rest period. This was caused by an uncontrolled recursive execution of the async `processCurrentPhase` function.

  **Problem Analysis:**
  The previous architecture allowed the `processCurrentPhase` function to recursively call itself for every non-timed event (`speech`, `audio`). This created a chain of microtasks that executed almost instantly, "burning through" the entire queue of non-timed commands before the main `tick` function could process any timed `movement` phases. The engine would then call `completeSet()`, transition to the 'resting' state, and stall because the animation loop was not designed to handle this rapid, out-of-order state change.

  **Architectural Solution:**
  The animation engine (`src/core/trainer/animation.js`) has been completely refactored to enforce a strict, single-threaded, sequential execution model.

  1.  **Unified Control Loop:** The separate `processCurrentPhase` function has been eliminated. The `tick` function is now the sole driver of the workout's progression. It manages both timed and non-timed events.

  2.  **Sequential Event Handling with Locks:** A lock (`isProcessing`) prevents re-entrant execution. When `tick` encounters a non-timed, asynchronous event (like `speech` with `await`), it fires the event and waits. The `tick` loop continues to run but does nothing until the async operation completes and releases the lock, after which it advances the queue index. This guarantees sequential processing.

  3.  **Clear Separation of Concerns:**
      * The `tick` function handles the passage of time for `movement` phases and initiates the execution of non-timed phases.
      * A new helper function (`handleNonTimedPhase`) encapsulates the logic for `speech` and `audio`, including the `await` for spoken announcements.

  4.  **Added Rest Cue:** A `speak()` call for the rest period has been added to the `completeSet` function in `src/core/trainer.js` to provide clear user feedback.

  This new architecture eradicates all race conditions, ensuring that exactly one command is processed at a time and that the workout flows correctly through all phases, including rest periods.
