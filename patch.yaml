commit_message: "refactor(training): Passa a un modello di workout composizionale"
rationale: |
  Questo commit rappresenta un refactoring strategico fondamentale, abbandonando il modello a "piani pre-compilati" in favore di un "workout builder composizionale", come da approvazione. Questa modifica allinea l'esperienza di pianificazione degli allenamenti a quella dei pasti, offrendo massima flessibilità all'utente.

  Le modifiche principali sono:
  1.  **Aggiornamento della Documentazione**: I documenti `docs/00_HEALTYPRO_SPEC.md` e `docs/02_ARCHITECTURE.md` sono stati riscritti per riflettere il nuovo paradigma. La struttura dati di `esercizi.json` è ora formalizzata come una libreria di singoli esercizi, e `weeklyWorkouts` come un array di esercizi pianificati per giorno.
  2.  **Refactoring della Struttura Dati di Stato**: In `src/core/state.js`, `weeklyWorkouts` ora memorizza un array di esercizi per ogni slot giornaliero. La funzione `updateWeeklyWorkout` è stata completamente riscritta per gestire l'aggiunta e la rimozione di singoli esercizi (identificati da un `instanceId` univoco) da questo array.
  3.  **Refactoring dell'Interfaccia Utente**:
      * In `src/ui/modals.js`, l' "Editor del Giorno" ora renderizza una lista di esercizi pianificati e il pulsante "Aggiungi Allenamento" è diventato "Aggiungi Esercizio".
      * Il modale di selezione ora mostra i singoli esercizi dalla libreria.
  4.  **Visualizzazione Aggiornata**: Il file `src/ui/plannerRenderer.js` è stato aggiornato per visualizzare correttamente il riepilogo del workout (numero di esercizi) sulla card del giorno nel calendario.
  5.  **Nuovo Formato `esercizi.json`**: La struttura dati attesa da `configService.js` è ora un semplice array di oggetti esercizio, ognuno con i propri attributi (serie, ripetizioni, tempo, etc.).
