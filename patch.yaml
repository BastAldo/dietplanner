                <button class="modal-close-btn" data-target="ingredient-editor-modal"></button>
              </div>
              <div class="modal-body">
                  <form id="ingredient-editor-form" class="biometrics-form"></form>
              </div>
              <div class="modal-footer">
                  <button type="submit" form="ingredient-editor-form" id="ingredient-editor-save-btn" class="btn btn-primary"></button>
              </div>
          </div>
      </div>
      <div id="meal-editor-modal" class="modal-overlay modal-hidden">
        <div class="modal-content modal-content-large">
            <div class="modal-header">
              <h3 id="meal-editor-title"></h3>
              <button class="modal-close-btn" data-target="meal-editor-modal"></button>
            </div>
            <div id="meal-editor-body" class="modal-body">
