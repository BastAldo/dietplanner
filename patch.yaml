commit_message: "fix(Core): Corregge i percorsi di importazione errati nel trainerRenderer"
rationale: |
  Questa patch risolve un errore critico di caricamento (404 Not Found) che impediva il funzionamento della vista Trainer.

  **Analisi del Problema:**
  L'analisi ha rivelato che la patch precedente, pur correggendo la logica delle dipendenze, ha introdotto percorsi di importazione relativi errati nel file `src/ui/trainerRenderer.js`. Veniva utilizzato `../../` (due livelli di directory sopra) invece del corretto `../` (un livello sopra). Questo causava il fallimento del browser nel trovare i moduli richiesti, generando una cascata di errori 404 e bloccando l'esecuzione dello script.

  **Soluzione Implementata:**
  La soluzione è una correzione chirurgica dei percorsi errati:
  * In `src/ui/trainerRenderer.js`, tutti i percorsi di importazione sono stati corretti da `../../` a `../`.
  * Questo allinea le richieste dei moduli alla struttura di directory effettiva del progetto (`src/`), risolvendo gli errori 404.

  Questa patch ripristina la piena funzionalità della vista Trainer senza introdurre nuove modifiche logiche, stabilizzando l'applicazione.
patches:
  - file: src/ui/trainerRenderer.js
    content: |
      import { getWorkoutState, resetState } from '../core/trainer/state.js';
      import { TrainerComponent } from './components/TrainerComponent.js';
      import { log } from '../utils/logger.js';
      import { resetWorkoutState as resetWorkoutController } from '../core/trainer.js';

      let trainerComponent = null;

      function handleWorkoutStateChange() {
          if (trainerComponent) {
              trainerComponent.render(getWorkoutState());
          }
      }

      export function initializeTrainerController() {
          log('TrainerRenderer', 'Initializing TrainerComponent...');
          const container = document.getElementById('trainer-page');
          if (container && !trainerComponent) {
              setTimeout(() => window.scrollTo(0, 0), 0); // Defer scroll to after render cycle
              trainerComponent = new TrainerComponent(container);
              trainerComponent.mount();
              document.addEventListener('workoutStateChange', handleWorkoutStateChange);
              handleWorkoutStateChange();
              log('TrainerRenderer', 'TrainerComponent initialized.');
          }
      }

      export function destroyTrainerController() {
          log('TrainerRenderer', 'Destroying TrainerComponent...');
          if (trainerComponent) {
              trainerComponent.destroy();
              trainerComponent = null;
          }
          document.removeEventListener('workoutStateChange', handleWorkoutStateChange);
          resetWorkoutController(); // Use the controller's reset function which also handles state
          log('TrainerRenderer', 'TrainerComponent destroyed.');
      }
commands:
  - "echo 'Patch applicata. Gli errori 404 relativi ai moduli del trainer sono stati risolti correggendo i percorsi di importazione.'"