commit_message: "fix(trainer): Resolve race condition on workout termination"
rationale: |
  This patch provides a definitive fix for the bug where terminating a workout incorrectly navigates to the planner instead of the debriefing page. The root cause was identified as a race condition, not simply state mutation as previously thought.

  **Problem Analysis & Implemented Solution:**

  The issue occurred because the `endWorkout` function's execution was being interfered with by the UI rendering lifecycle. The sequence was as follows:
  1. `endWorkout` is called.
  2. Halfway through, it calls `setView('debriefing')`.
  3. This triggers `renderApp`, which detects the view change away from 'trainer'.
  4. `renderApp` then calls `destroyTrainerController` for UI cleanup.
  5. Crucially, `destroyTrainerController` contained a call to `resetWorkoutState()`, which would immediately wipe all data for the current workout session, including setting `startTime` to 0.
  6. The execution of `endWorkout` would then resume, find that `startTime` was 0, and incorrectly conclude that the workout had ended prematurely, causing a redirect to the planner view.

  The previous patch (`patch.yaml`) fixed immutability issues but did not address this critical race condition between the business logic and the UI lifecycle.

  **The Fix:**
  The fix is to remove the `resetWorkoutState()` call from the `destroyTrainerController` function in `src/ui/trainerRenderer.js`. State should only be reset when a new workout is explicitly initialized (which is handled correctly in `initializeWorkout`), not as a side effect of cleaning up the UI. This change decouples the UI lifecycle from the business logic state, resolving the race condition and ensuring the `endWorkout` function can complete its execution with the correct state, thus always navigating to the debriefing page as intended.
patches:
  - file: src/ui/trainerRenderer.js
    content: |
      import { getWorkoutState, resetWorkoutState } from '../core/trainer.js';
      import { TrainerComponent } from './components/TrainerComponent.js';
      import { log } from '../utils/logger.js';

      let trainerComponent = null;

      function handleWorkoutStateChange() {
          if (trainerComponent) {
              trainerComponent.render(getWorkoutState());
          }
      }

      export function initializeTrainerController() {
          log('TrainerRenderer', 'Initializing TrainerComponent...');
          const container = document.getElementById('trainer-page');
          if (container && !trainerComponent) {
              trainerComponent = new TrainerComponent(container);
              trainerComponent.mount();
              document.addEventListener('workoutStateChange', handleWorkoutStateChange);
              handleWorkoutStateChange();
              log('TrainerRenderer', 'TrainerComponent initialized.');
          }
      }

      export function destroyTrainerController() {
          log('TrainerRenderer', 'Destroying TrainerComponent...');
          if (trainerComponent) {
              trainerComponent.destroy();
              trainerComponent = null;
          }
          document.removeEventListener('workoutStateChange', handleWorkoutStateChange);
          // resetWorkoutState(); // <-- Ensure state is reset when leaving the view
          log('TrainerRenderer', 'TrainerComponent destroyed.');
      }
