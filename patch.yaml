commit_message: "fix(trainer): Stabilizza il componente con un ciclo di vita autonomo e robusto"
rationale: |
  Questo commit risolve in modo definitivo il bug che rendeva il trainer non responsivo dopo essere usciti e rientrati nella vista. L'errore era causato da una gestione del ciclo di vita frammentata, che non garantiva un reset completo del componente.

  Seguendo la nuova filosofia architetturale discussa, le responsabilità sono state chiarite e centralizzate:

  1.  **`src/core/trainer.js` è ora Autonomo**: Il modulo "core" del trainer è ora l'unico responsabile della gestione del proprio stato e dei processi in background.
      * La funzione `resetWorkoutState` è stata potenziata per agire da "interruttore generale": ora non solo resetta i dati, ma termina in modo affidabile qualsiasi ciclo di animazione (`requestAnimationFrame`) in corso e ne annulla l'ID. Questo garantisce che un reset sia sempre totale.

  2.  **`src/ui/trainerRenderer.js` è Semplificato**: Il "renderer" (la parte visiva) non interferisce più con la logica interna del trainer.
      * La funzione `destroyTrainerController` è stata pulita. Il suo unico compito ora è delegare la pulizia totale chiamando la funzione `resetWorkoutState` del modulo core.

  Questo refactoring elimina la causa radice dell'instabilità, rendendo il componente prevedibile e robusto, e ponendo le basi per future evoluzioni come la richiesta di conferma all'uscita.
patches:
  - file: src/core/trainer.js
    content: |
      import { setView } from './state.js';

      const initialWorkoutState = {
        exerciseQueue: [],
        currentExerciseIndex: -1,
        status: 'idle', // idle, running, paused, resting, finished
        prePauseStatus: '',
        currentSet: 0,
        currentRep: 0,
        executionQueue: [],
        currentPhaseIndex: -1,
        phaseTimeElapsed: 0,
        restTimeRemaining: 0,
      };

      let workoutState = { ...initialWorkoutState };
      let animationFrameId = null;
      let lastTickTimestamp = 0;

      function buildExecutionQueueForCurrentSet() {
        const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
        if (!currentExercise || currentExercise.type !== 'reps') return [];

        const queue = [];
        const reps = currentExercise.defaultReps;
        const tempo = currentExercise.defaultTempo;

        for (let i = 0; i < reps; i++) {
          if (tempo) {
            queue.push({ name: 'pre-up', rep: i + 1, duration: 700 });
            queue.push({ name: 'up', rep: i + 1, duration: tempo.up * 1000 });
            queue.push({ name: 'pre-hold', rep: i + 1, duration: 700 });
            queue.push({ name: 'hold', rep: i + 1, duration: tempo.hold * 1000 });
            queue.push({ name: 'pre-down', rep: i + 1, duration: 700 });
            queue.push({ name: 'down', rep: i + 1, duration: tempo.down * 1000 });
          }
        }
        return queue;
      }

      function advanceToNextSet() {
        workoutState.currentSet++;
        const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
        if (workoutState.currentSet > currentExercise.defaultSets) {
          advanceToNextExercise();
        } else {
          workoutState.status = 'running';
          workoutState.executionQueue = buildExecutionQueueForCurrentSet();
          workoutState.currentPhaseIndex = 0;
          workoutState.phaseTimeElapsed = 0;
          workoutState.currentRep = 1;
        }
      }

      function advanceToNextExercise() {
        workoutState.currentExerciseIndex++;
        if (workoutState.currentExerciseIndex >= workoutState.exerciseQueue.length) {
          endWorkout();
        } else {
          workoutState.status = 'idle';
          workoutState.currentSet = 1;
          workoutState.currentRep = 1;
          workoutState.executionQueue = [];
          workoutState.currentPhaseIndex = -1;
        }
      }

      function tick(timestamp) {
        if (lastTickTimestamp === 0) {
          lastTickTimestamp = timestamp;
        }
        const deltaTime = timestamp - lastTickTimestamp;
        lastTickTimestamp = timestamp;

        if (workoutState.status === 'running') {
          workoutState.phaseTimeElapsed += deltaTime;
          const currentPhase = workoutState.executionQueue[workoutState.currentPhaseIndex];

          if (workoutState.phaseTimeElapsed >= currentPhase.duration) {
            workoutState.currentPhaseIndex++;
            workoutState.phaseTimeElapsed = 0;
            const nextPhase = workoutState.executionQueue[workoutState.currentPhaseIndex];
            if (nextPhase) {
              workoutState.currentRep = nextPhase.rep;
            } else {
              const currentExercise = workoutState.exerciseQueue[workoutState.currentExerciseIndex];
              workoutState.status = 'resting';
              workoutState.restTimeRemaining = currentExercise.defaultRest * 1000;
            }
          }
        } else if (workoutState.status === 'resting') {
          workoutState.restTimeRemaining -= deltaTime;
          if (workoutState.restTimeRemaining <= 0) {
            advanceToNextSet();
          }
        }
        
        document.dispatchEvent(new CustomEvent('workoutStateChange'));

        if (workoutState.status !== 'paused' && workoutState.status !== 'idle' && workoutState.status !== 'finished') {
          animationFrameId = requestAnimationFrame(tick);
        }
      }

      export function getWorkoutState() {
        return workoutState;
      }

      export function resetWorkoutState() {
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
        workoutState = { ...initialWorkoutState };
      }

      export function initializeWorkout(plannedExercises) {
        if (!plannedExercises || plannedExercises.length === 0) {
          return;
        }
        resetWorkoutState();

        workoutState = {
          ...initialWorkoutState,
          exerciseQueue: JSON.parse(JSON.stringify(plannedExercises)),
          currentExerciseIndex: 0,
          currentSet: 1,
          currentRep: 1,
        };
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function startWorkout() {
        if (workoutState.status === 'idle') {
          workoutState.status = 'running';
          workoutState.executionQueue = buildExecutionQueueForCurrentSet();
          workoutState.currentPhaseIndex = 0;
          workoutState.phaseTimeElapsed = 0;
          workoutState.currentRep = 1;
          lastTickTimestamp = 0;
          animationFrameId = requestAnimationFrame(tick);
        }
        document.dispatchEvent(new CustomEvent('workoutStateChange'));
      }

      export function pauseWorkout() {
        if (workoutState.status === 'running' || workoutState.status === 'resting') {
          workoutState.prePauseStatus = workoutState.status;
          workoutState.status = 'paused';
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function resumeWorkout() {
        if (workoutState.status === 'paused') {
          workoutState.status = workoutState.prePauseStatus;
          workoutState.prePauseStatus = '';
          lastTickTimestamp = 0;
          animationFrameId = requestAnimationFrame(tick);
          document.dispatchEvent(new CustomEvent('workoutStateChange'));
        }
      }

      export function endWorkout() {
        workoutState.status = 'finished';
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
        setView('planner');
      }
  - file: src/ui/trainerRenderer.js
    content: |
      import { getWorkoutState, resetWorkoutState } from '../core/trainer.js';
      import { TrainerComponent } from './components/TrainerComponent.js';

      let trainerComponent = null;

      function handleWorkoutStateChange() {
          if (trainerComponent) {
              trainerComponent.render(getWorkoutState());
          }
      }

      export function initializeTrainerController() {
          const container = document.getElementById('trainer-page');
          if (container && !trainerComponent) {
              trainerComponent = new TrainerComponent(container);
              trainerComponent.mount();
              document.addEventListener('workoutStateChange', handleWorkoutStateChange);
              // Render iniziale
              handleWorkoutStateChange();
          }
      }

      export function destroyTrainerController() {
          if (trainerComponent) {
              trainerComponent.destroy();
              trainerComponent = null;
          }
          document.removeEventListener('workoutStateChange', handleWorkoutStateChange);
          resetWorkoutState();
      }
commands:
  - "echo 'Fase 1 completata: il bug del ciclo di vita del Trainer è stato risolto.'"