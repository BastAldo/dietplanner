commit_message: "refactor(UX): Riprogetta layout Obiettivi, Editor Esercizi e fissa bug responsive"
rationale: |
  Questo commit è un intervento mirato a risolvere specifiche criticità di usabilità e bug di layout emerse dal feedback, migliorando significativamente la coerenza e la qualità dell'interfaccia utente.

  1.  **Riprogettazione Pagina Obiettivi**: La pagina "Obiettivi" è stata trasformata da un semplice form a una sezione funzionale. È stato aggiunto un testo esplicativo per guidare l'utente e, soprattutto, è stata introdotta la possibilità di impostare un **obiettivo di peso**. Il layout è stato reso più bilanciato e gradevole. Il widget di riepilogo nel planner è stato potenziato per mostrare i progressi verso questo nuovo obiettivo, creando un ciclo di feedback completo.

  2.  **Refactoring Layout Editor Esercizio**: Il modale per la modifica degli esercizi è stato completamente ridisegnato. I campi di input ora seguono un layout a griglia compatto e logico, eliminando disallineamenti e sprechi di spazio. Il campo "Peso" è ora sempre visibile, dando all'utente pieno controllo sulla personalizzazione dell'allenamento.

  3.  **Fix Bug Responsive**: È stato risolto un bug critico di layout nella vista "Log" che causava un overflow orizzontale su dispositivi mobili quando venivano visualizzati i dettagli di un'attività manuale. L'interfaccia ora si adatta correttamente a tutte le dimensioni dello schermo, rispettando i principi di design "mobile-first".
