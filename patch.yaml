  - file: docs/01_FUNCTIONALITY.md
    content: |
      # Funzionalità: HealtyPro (ex NutriPlan)

      ## 1. Visione Generale
      Una web app frontend-only, installabile (PWA), per creare e gestire piani alimentari flessibili per l'intera giornata (colazione, spuntini, pranzo e cena) con conteggio calorico e regole di validazione personalizzate.

      L'interfaccia utente è stata completamente rinnovata per adottare un design system unificato (ispirato a MTP), con un tema scuro, componenti moderni e un flusso di interazione migliorato per la pianificazione giornaliera.

      ## 2. User Stories
      * **US-1 (Caricamento Dati):** L'utente può caricare una configurazione da un file JSON remoto.
      * **US-2 (Visualizzazione Calendario):** L'utente vede un calendario settimanale "day-centric". Ogni giorno è una card che riassume le informazioni principali (es. calorie totali).
      * **US-3 (Pianificazione via Modale):** L'utente clicca su una card del giorno per aprire un modale di editing centralizzato, dove può gestire tutti i pasti di quella giornata.
      * **US-4 (Validazione Dinamica):** L'utente vuole che l'app applichi le regole definite nel JSON (es. blocco giornaliero per un certo tag).
      * **US-11 (Cancellazione Pasti):** L'utente può rimuovere un pasto inserito.
      * **US-15 (Layout Mobile Leggibile):** Su mobile, il calendario è una lista di card giornaliere.
      * **US-16 (Conteggio Calorie Flessibile):** L'utente vede il totale calorico per ogni giorno direttamente sulla card del calendario.
      * **US-17 (Installazione):** Come utente, voglio poter installare l'app sulla mia home screen o desktop per un accesso rapido.
      * **US-18 (Uso Offline):** Come utente, voglio poter aprire e usare l'app anche senza connessione internet, dopo averla visitata la prima volta.
      * **US-19 (Chiusura Modale Esterna):** Come utente, voglio poter chiudere qualsiasi modale cliccando sull'area scura esterna ad esso, per un'interazione più rapida.
      * **US-20 (Registro Pasti Settimanale Dettagliato):** Come utente, voglio poter passare a una vista registro per vedere l'elenco di tutti i pasti pianificati, con il dettaglio calorico per singolo pasto e il totale giornaliero.
      * **US-21 (Copia Settimana):** Come utente, voglio poter copiare il piano alimentare della settimana precedente a quella attuale con un solo click per velocizzare la pianificazione.
      * **US-22 (Visualizzazione Ricetta):** Come utente, voglio poter visualizzare la ricetta di un pasto, se disponibile, cliccando su un'icona presente sia nell'editor del giorno che nella vista registro.
      * **US-23 (Condivisione Configurazione Sicura):** Come utente, voglio poter generare un link per condividere il mio `config.json`. All'apertura del link, se la configurazione è diversa da quella in uso, l'app mi chiederà conferma prima di caricarla per evitare perdite di dati.
      * **US-24 (Backup Dati Locale Flessibile):** Come utente, voglio poter salvare un backup dei miei dati come file di testo (`.txt`) utilizzando, dove supportato, la funzione di condivisione nativa del mio dispositivo.
      * **US-25 (Ripristino da Backup Locale):** Come utente, voglio poter caricare un file di backup (`.txt` o `.json`) precedentemente salvato per ripristinare il mio `configUrl` e il mio `weeklyPlan`, con una richiesta di conferma prima di sovrascrivere i dati esistenti.
      * **US-26 (Inserimento Dati Biometrici):** Come utente, voglio poter inserire e modificare le mie misurazioni biometriche (peso, massa grassa, etc.) per una data specifica tramite un form dedicato.
      * **US-27 (Visualizzazione Storico Biometrico):** Come utente, voglio poter visualizzare una tabella con lo storico di tutte le misurazioni biometriche che ho inserito, ordinate per data.
  - file: docs/02_ARCHITECTURE.md
    content: |
      # Architettura: HealtyPro (ex NutriPlan)

      ## 1. Principi Guida
      * **PWA-First:** L'applicazione è progettata per essere installabile e funzionare offline.
      * **Minimalism & Simplicity (KISS):** L'interfaccia utente è stata ridisegnata per essere essenziale e intuitiva. La base di codice sottostante rimane semplice e basata su Vanilla JS.
      * **Data-Driven:** La logica di business (regole, pasti) è definita nel file JSON di configurazione.
      * **Maintainability (SRP):** I testi dell'interfaccia (stringhe) sono centralizzati e ogni file ha una sola responsabilità.

      ## 2. Architettura PWA
      L'applicazione include due componenti chiave per la funzionalità PWA:
      * **`manifest.json`**: Fornisce i metadati per l'installazione (nome, icone, colori).
      * **`sw.js` (Service Worker)**: Mette in cache i file statici dell'app ("app shell") per abilitare il funzionamento offline. Include una logica di pulizia per le cache obsolete.

      ## 3. Refactoring dell'Interfaccia Utente (UI/UX)
      L'architettura logica (core/state.js, api/configService.js) rimane invariata per semplicità e robustezza. Lo strato di presentazione (`index.html`, `style.css`, `ui/renderer.js`) è stato invece oggetto di un refactoring completo per adottare un nuovo design system. Questo disaccoppia la logica dal suo aspetto visivo, permettendo future evoluzioni senza intaccare il nucleo funzionale.

      ## 4. Formato Dati: `planner-config.json`
      Il file JSON può contenere una chiave opzionale `recipeBaseUrl` al livello principale per specificare la directory base delle ricette. Ogni pasto può avere un `recipeId` per collegare una ricetta Markdown. L'URL finale sarà costruito come `recipeBaseUrl + recipeId + '.md'`.
      ```json
      {
        "recipeBaseUrl": "[https://raw.githubusercontent.com/user/repo/main/recipes/](https://raw.githubusercontent.com/user/repo/main/recipes/)",
        "rules": [
          {
            "tag": "contiene-soia",
            "type": "daily-block",
            "limit": 1,
            "message": "Non più di 1 pasto con soia al giorno."
          }
        ],
        "meals": [
          { "id": "1", "nomePasto": "Tofu Scrambled", "tipoPasto": "Pranzo", "calories_min": 550, "recipeId": "00001", "etichette": ["contiene-soia"] },
          { "id": "2", "nomePasto": "Insalata Greca", "tipoPasto": "Cena", "calories_min": 300, "recipeId": "00002" }
        ]
      }
      ```

      ## 5. Strutture Dati Chiave
      L'applicazione si basa su due strutture dati principali salvate nel `localStorage` per garantire la massima resilienza dei dati.

      ### 5.1. `weeklyPlan`
      Questa struttura contiene i pasti pianificati dall'utente. Per garantire la massima resilienza, **non vengono salvati solo gli ID dei pasti, ma una copia completa dell'intero oggetto del pasto** al momento della pianificazione.
      * **Formato Chiave:** `"AAAA-MM-GG-TipoPasto"` (es. `"2025-09-22-Pranzo"`)
      * **Formato Valore:** `{ "id": "1", "nomePasto": "...", ... }` (Oggetto completo del pasto)
      * **Razionale:** Questo approccio di "denormalizzazione" rende il piano settimanale dell'utente auto-consistente e indipendente dal file `config.json` originale.

      ### 5.2. `biometricData`
      Questa struttura è un array che contiene lo storico delle misurazioni biometriche dell'utente.
      * **Formato:** Un array di oggetti, dove ogni oggetto rappresenta una singola misurazione.
      * **Esempio Oggetto:**
        ```json
        {
          "date": "2025-09-26",
          "weight": 80.5,
          "muscleMass": 60.1,
          "fatMass": 15.2,
          "water": 55.0,
          "fatPercentage": 18.9,
          "bmi": 24.8,
          "basalMetabolism": 1800,
          "notes": "Misurazione mattutina a digiuno."
        }
        ```
      * **Razionale:** Un semplice array ordinabile per data è la struttura più efficiente per memorizzare e successivamente visualizzare dati cronologici, sia in forma tabellare che grafica.

      ## 6. Dipendenze di Terze Parti
      Per il rendering delle ricette da file Markdown, l'applicazione si affida a due librerie esterne caricate via CDN:
      * **Marked.js**: Una libreria veloce e completa per il parsing di Markdown in HTML.
      * **DOMPurify**: Una libreria essenziale per la sicurezza, utilizzata per sanificare l'output HTML generato da Marked.js prima di inserirlo nel DOM, prevenendo attacchi XSS.

      ## 7. Struttura dei File (Invariata)
      ```
      .
      ├── index.html
      ├── style.css
      ├── manifest.json
      ├── sw.js
      ├── icon.svg
      └── src/
          ├── api/
          │   └── configService.js
          ├── core/
          │   ├── state.js
          │   └── validation.js
          ├── ui/
          │   ├── renderer.js
          │   ├── interactions.js
          │   └── notifications.js
          └── utils/
              └── constants.js
      ```
