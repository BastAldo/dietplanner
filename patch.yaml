commit_message: "feat(trainer): Implement configurable and awaitable execution flows"
rationale: |
  This patch implements a major architectural refactoring of the Trainer module based on user specifications for a more powerful and flexible execution engine.

  **1. Configurable Execution Flows:**
  The hardcoded logic for building the exercise sequence has been completely replaced by a new data-driven system. A new configuration file, `src/config/trainerFlows.js`, now defines global templates for different execution modes (e.g., `TEMPO_GUIDED_FLOW`). The `queueBuilder.js` module has been rewritten to act as an interpreter for these templates. It dynamically builds the final `executionQueue` by taking an exercise's properties and compiling them against the appropriate global template. This makes the trainer a "stupid executor" as requested, with its behavior defined entirely by configurable data, not code.

  **2. Awaitable (Synchronous) Speech:**
  To solve the synchronization issue between audio cues and timers, the `speak` function in `audioFeedback.js` has been refactored to return a `Promise`. The trainer's animation engine (`animation.js`) has been upgraded to be `async` and now respects a new `await: true` flag in the execution queue commands. When the engine encounters a speech command with this flag, it will `await` the completion of the speech synthesis before processing the next command in the queue, ensuring perfect synchronization.

  These changes make the Trainer module significantly more robust, maintainable, and configurable, aligning it with the data-driven philosophy of the overall project.
