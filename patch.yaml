commit_message: "feat(UX): Migliora la visualizzazione dei pasti e corregge UI"
rationale: |
  Questa patch implementa la prima fase del piano d'azione approvato, introducendo significativi miglioramenti all'usabilità e correggendo diversi bug e incongruenze nell'interfaccia utente.

  **Miglioramenti Specifici:**

  1.  **Visualizzazione Dettagliata dei Pasti:** Per migliorare il processo di pianificazione, ora vengono visualizzati i dettagli degli ingredienti e il range calorico sotto il nome del pasto. Questa modifica è stata applicata in modo consistente attraverso l'applicazione: nel modale di editing del giorno, nel modale di selezione dei pasti e nella vista "Registro". Una nuova funzione `formatIngredientsSummary` è stata creata per questo scopo.

  2.  **Correzione Naming e Iconografia:**
      * La voce di menu "Progressi" è stata rinominata in "**Biometria**" per descrivere più accuratamente il suo contenuto (`uiText.js`).
      * È stata introdotta una nuova icona `DUMBBELL` (`icons.js`) e viene ora utilizzata nel riepilogo settimanale per rappresentare gli allenamenti, sostituendo l'icona fuorviante della bilancia (`plannerRenderer.js`).

  3.  **Risoluzione Layout Shift nel Trainer:** È stato corretto un bug visivo nella schermata del trainer dove il caricamento del nome e dei dettagli dell'esercizio causava un "salto" del layout. Ora viene assegnata una `min-height` a questi elementi in `styles/trainer.css` per riservare lo spazio verticalmente, garantendo un'esperienza visiva stabile.
