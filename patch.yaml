commit_message: "fix(trainer): Enforce immutability and robust state reset to fix all runtime bugs"
rationale: |
  This patch delivers a definitive and comprehensive fix for a set of critical, interconnected bugs in the trainer module. The root cause for all runtime failures (incorrect audio cues on second run, termination logic hanging) was identified as a state mutation issue: the execution engine was modifying the command queue template in-place instead of treating it as an immutable resource. This patch redesigns the process to enforce immutability and ensures a truly clean state between workout sessions.

  **Problem Analysis & Implemented Solution:**

  1.  **State Corruption via Queue Mutation (Termination & Audio Bugs):**
      * **Problem:** The fundamental flaw was that the execution logic (`runWorkoutLoop` in `trainer.js`) would resolve a `text_key` by adding a new `text` property directly onto the command object within the `fullExecutionQueue`. Since this queue was not a deep copy of the original template, this "dirtied" the template in memory. On a second run, the `queueBuilder` would reuse this mutated template, leading to incorrect audio cues (as the old `.text` property was found) and an unstable state that caused termination logic to hang. The user correctly identified this with the question: "Why is the queue being modified?".
      * **Solution (Enforcing Immutability):**
          * **`queueBuilder.js`:** The `interpretTemplate` function now strictly adheres to immutability. It creates a `deep copy` of the command templates using `JSON.parse(JSON.stringify())` at the very beginning. This guarantees that every workout starts with a pristine, isolated set of instructions that can be safely modified without any side effects.
          * **`trainer.js`:** The logic that was modifying the `phase` object has been removed from the `runWorkoutLoop`. The responsibility of resolving `text_key` to `text` now resides solely within the `queueBuilder`, which was its correct place. The `runWorkoutLoop` is now a pure "interpreter" that only reads from the queue.

  2.  **Insufficient State Reset:**
      * **Problem:** The previous `resetState` function was not robust enough to guarantee a clean slate, especially in the context of state mutation.
      * **Solution (`state.js`):** The `resetState` function has been refactored to be infallible. Instead of simply reassigning a variable, it now explicitly mutates the existing `workoutState` object back to its initial values, using `Object.assign` and explicitly clearing arrays. This ensures all parts of the application referencing the state see the reset correctly.

  3.  **UI Style Inconsistency (Timer Style Bug):**
      * **Problem:** The flashing text (`.flashing`) inside the timer ring used `--secondary-color`, which clashed with the `--primary-color` of the ring during active phases, violating the `docs/03_STYLE_GUIDE.md`.
      * **Solution (`trainer.css`):** The `.flashing` class has been updated to use `fill: var(--primary-color);`, aligning the entire component's active state with the primary brand color for a cohesive user experience.

  These three fixes, working together, create a truly stable, predictable, and visually polished trainer module, finally resolving all reported issues at their architectural root.
