commit_message: "fix(trainer): Await initial announcement and fix async race condition"
rationale: |
  This patch resolves a critical race condition that caused the Trainer to start prematurely, skip the exercise, and go directly into the final rest phase.

  **Problem Analysis:**
  The core issue was in `src/core/trainer.js`. The `startWorkout` function initiated an introductory announcement using the `speak()` utility. However, `speak()` is an asynchronous function that returns a Promise, and the code did not `await` its completion.

  This caused the following cascade of failures:
  1.  The JavaScript engine executed the rest of the `startWorkout` function immediately, without waiting for the speech synthesis to finish.
  2.  The animation engine (`startAnimation`) was therefore called prematurely.
  3.  At this point, the `executionQueue` had not been properly built and populated into the state, so the animation engine found an empty queue.
  4.  The engine's logic interpreted the empty queue as a completed set and immediately called `completeSet()`, changing the workout status to 'resting'.
  5.  The detached `speak()` call would then play out later, often after the view had already transitioned to the debriefing page, causing a desynchronized user experience.

  **Solution:**
  1.  **Made `startWorkout` asynchronous:** The `startWorkout` function in `src/core/trainer.js` has been converted to an `async` function.
  2.  **Awaited Initial Speech:** An `await` keyword has been added before the initial `speak()` call. This forces the execution to pause until the announcement is complete, ensuring the animation and timer do not start prematurely.
  3.  **Propagated `async`:** The `handleControls` method in `src/ui/components/TrainerComponent.js` has been updated to be `async` to correctly handle the awaited `startWorkout` call.
  4.  **Added Set Start Cue:** A new speech cue (`VOICE_GUIDE_SET_START`) has been added to the beginning of the `TEMPO_GUIDED_FLOW` in `src/config/trainerFlows.js` to provide clearer feedback at the start of each set.

  These changes ensure a sequential, predictable execution flow, fixing the bug and improving the overall user experience of the Trainer module.
