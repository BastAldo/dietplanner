commit_message: "feat: Implementa calcolo automatico BMR e Data di Nascita (Fase 2)"
rationale: |
  In linea con il piano approvato, questa patch completa la Fase 2, introducendo il calcolo automatico del metabolismo basale (BMR) e migliorando la robustezza del profilo utente.

  1.  **Profilo Utente Migliorato**: Il campo "Età" è stato sostituito con "Data di Nascita". Questo garantisce che l'età dell'utente sia sempre calcolata in modo accurato e non richieda aggiornamenti manuali. La modifica è stata applicata alla documentazione, alle costanti UI e alla logica di rendering.

  2.  **Logica di Calcolo Centralizzata**: È stato creato un nuovo modulo `src/core/calculations.js` per ospitare la logica di business. Questo file contiene le funzioni pure per calcolare l'età dalla data di nascita e per calcolare il BMR utilizzando la formula Mifflin-St Jeor, mantenendo il codice pulito e testabile come da principi architetturali.

  3.  **Calcolo BMR Automatico e Reattivo**: La funzionalità è stata integrata direttamente nell'interfaccia utente della pagina "Progressi".
      - Il campo del metabolismo basale nel form biometrico è ora in sola lettura (`readonly`).
      - Un nuovo event listener in `src/ui/interactions.js` monitora il campo del peso in tempo reale. Ad ogni modifica, il BMR viene ricalcolato istantaneamente utilizzando i dati del profilo e il peso corrente, fornendo un feedback immediato all'utente.
      - L'interfaccia gestisce elegantemente i casi in cui i dati del profilo sono incompleti, mostrando un messaggio indicativo nel campo BMR.

  4.  **Aggiornamento Documentazione**: La documentazione è stata allineata con una nuova User Story (US-31) per il calcolo automatico del BMR e con l'aggiornamento della struttura dati del profilo.
