  - file: styles/planner.css
    content: |
      /* --- PLANNER PAGE --- */
      .section-title {
        color: var(--primary-color);
        margin-top: 2rem;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
      }

      /* --- TODAY WIDGET --- */
      .today-widget {
        background-color: var(--card-color);
        border-left: 4px solid var(--primary-color);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .today-widget-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .today-widget-header h3 {
        color: var(--text-color);
        margin: 0;
      }
      .today-widget-header span {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--secondary-color);
      }
      .today-widget-body {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .today-meal-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem;
        background-color: var(--bg-color);
        border-radius: 8px;
      }
      .today-meal-item strong {
        color: var(--text-color-muted);
      }

      .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .calendar-header h2 { font-size: 1.25rem; text-align: center; color: var(--text-color); }
      .planner-controls-wrapper {
        display: flex; justify-content: flex-end; align-items: center;
        margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
      }
      .planner-actions { display: flex; gap: 0.75rem; }
      .calendar-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
      .day-cell {
          background-color: var(--card-color); border: 1px solid var(--border-color);
          border-radius: 8px; padding: 1rem; min-height: 120px; display: flex;
          flex-direction: column; transition: all 0.2s;
      }
      .day-cell:not(:has(.btn-start-workout-day)) { cursor: pointer; }
      .day-cell:not(:has(.btn-start-workout-day)):hover { border-color: var(--primary-color); transform: translateY(-3px); }
      .day-cell.is-today {
        border-color: var(--primary-color);
        box-shadow: 0 0 10px rgba(149, 117, 205, 0.5);
      }
      .day-cell__header { display: flex; justify-content: space-between; font-weight: bold; color: var(--text-color-muted); text-transform: uppercase; font-size: 0.8rem; pointer-events: none; }
      .day-cell__body { margin-top: 0.5rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; pointer-events: none; }
      .daily-calories { font-size: 1rem; font-weight: bold; color: var(--secondary-color); }
      .daily-summary-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
      .btn-start-workout-day {
        pointer-events: all;
        width: 100%;
        margin-top: 1rem;
        padding: 0.5rem;
        font-size: 0.85rem;
      }
      .log-view { padding: 0; background: transparent; border-radius: 0; border: none; }
      .log-day { margin-bottom: 1rem; background: var(--card-color); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
      .log-day-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .log-day-header:hover {
        background-color: rgba(255, 255, 255, 0.05);
      }
      .log-day h3 { color: var(--primary-color); margin: 0; font-size: 1.1rem; }
      .log-day.is-today h3 {
        color: var(--primary-color);
        font-weight: bold;
      }
      .log-day__total-calories { font-size: 0.9rem; font-weight: normal; color: var(--text-color-muted); }
      .log-day-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
        padding: 0 1.5rem;
      }
      .log-day.is-expanded .log-day-body {
        max-height: 2000px; /* Large value to allow for expansion */
        padding-bottom: 1rem;
      }
      .log-item { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 0; font-size: 0.95rem; border-top: 1px solid var(--border-color); }
      .log-item:first-child { border-top: none; }
      .log-item__name { display: flex; align-items: center; gap: 0.5rem; }
      .log-item strong { color: var(--text-color-muted); }
      .log-item__calories { font-weight: bold; color: var(--secondary-color); flex-shrink: 0; }
      .log-item-details { font-size: 0.85rem; color: var(--text-color-muted); margin-top: 0.25rem; }

      .log-workout-summary { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border-color); }
      .log-workout-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .log-workout-header h4 { color: var(--secondary-color); font-size: 1rem; margin: 0; }
      .log-workout-header-actions { display: flex; gap: 0.5rem; }
      .btn-delete-workout, .btn-edit-logged-exercise { background: none; border: none; color: var(--text-color-muted); cursor: pointer; padding: 0.25rem; border-radius: 4px; display: flex; }
      .btn-delete-workout:hover { color: var(--danger-color); background-color: rgba(239, 83, 80, 0.1); }
      .btn-edit-logged-exercise:hover { color: var(--primary-color); background-color: rgba(149, 117, 205, 0.1); }
      .log-workout-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        font-size: 0.85rem;
        color: var(--text-color-muted);
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      .log-workout-exercise { margin-bottom: 1rem; }
      .log-workout-exercise .log-item { border-bottom: none; }
      .log-sets-details { padding-left: 1rem; border-left: 2px solid var(--border-color); margin-top: 0.5rem; }
      .log-set-item { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 0.25rem 0; }
      .log-set-item span:first-child { color: var(--text-color-muted); }

      .log-manual-details {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        padding: 0.75rem 0;
        font-size: 0.9rem;
      }
      .log-manual-details div {
        word-break: break-word;
      }
      .log-item-details {
        font-style: italic;
        color: var(--text-color-muted);
        width: 100%;
      }

      /* --- Stili importati da charts.css per il widget grafico --- */
      .chart-card {
          background-color: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
          display: flex;
          flex-direction: column;
          margin-bottom: 1.5rem; /* Aggiunto margine per separarlo */
      }
      .chart-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 1.5rem;
          flex-shrink: 0;
          gap: 1rem;
      }
      .chart-header h4 {
          color: var(--primary-color);
          margin: 0;
          text-align: left;
          flex-grow: 1;
      }
      .chart-canvas-container {
          position: relative;
          height: 250px; /* Altezza di default per il widget */
          width: 100%;
          flex-grow: 1;
      }


      @media (min-width: 768px) {
          #app-container { padding: 2rem; }
          .calendar-grid { grid-template-columns: repeat(7, 1fr); gap: 1rem; }
      }
  - file: src/core/state.js
    content: |
      import { LOCAL_STORAGE_KEY_PLAN, LOCAL_STORAGE_KEY_URL, MEAL_TYPES, LOCAL_STORAGE_KEY_BIOMETRICS, LOCAL_STORAGE_KEY_PROFILE, LOCAL_STORAGE_KEY_WORKOUTS, WORKOUT_SLOT_ID, LOCAL_STORAGE_KEY_WORKOUT_HISTORY, LOCAL_STORAGE_KEY_GOALS, LOCAL_STORAGE_KEY_INGREDIENTS, LOCAL_STORAGE_KEY_MEALS, LOCAL_STORAGE_KEY_WORKOUT_TEMPLATES, LOCAL_STORAGE_KEY_EXERCISES } from '../utils/constants.js';
      import { processMealsWithCalories } from './calorieCalculator.js';
      import { resetWorkoutState } from './trainer.js';
      import { log } from '../utils/logger.js';

      let state = {
        rules: [],
        masterMealList: [],
        masterIngredientList: [],
        masterWorkoutList: [],
        masterWorkoutTemplateList: [],
        weeklyPlan: {},
        weeklyWorkouts: {},
        workoutHistory: {},
        biometricData: [],
        userProfile: {},
        userGoals: {},
        contentHubUrl: 'https://itbiohackerhub-max.github.io/BiohackerHub/',
        recipeBaseUrl: '',
        focusedDate: new Date(),
        debugMode: false,
        ui: {
          currentView: 'planner', // 'planner', 'log', 'library', 'progress', 'charts', 'recipes', 'profile', 'trainer', 'debriefing', 'goals', 'explore'
          activeLibraryTab: 'ingredients',
          library: {
            searchTerm: '',
            packageFilter: null,
            mealTypeFilter: 'all',
            execModeFilter: 'all'
          },
          lastWorkoutSummary: null,
          charts: {
            currentRangeFilter: 30,
            dateOffset: 0,
            selectedBiometric: 'weight'
          },
          explore: {
            packages: [],
            searchTerm: '',
            activeTags: [],
            sortOrder: 'default'
          }
        }
      };

      const notify = () => document.dispatchEvent(new CustomEvent('stateChange'));
      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);

      const getWeekStartDate = (date) => {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
      };

      export const getState = () => ({ ...state });
      export const setState = (newState) => {
        state = { ...state, ...newState };
        notify();
      }
      export const setUiState = (uiChanges) => {
        state.ui = { ...state.ui, ...uiChanges };
        notify();
      }

      export function getMealsForType(mealType) {
        return state.masterMealList.filter(meal => {
          if (meal.tipoPasto === 'Tutti') return true;
          if (Array.isArray(meal.tipoPasto)) {
            return meal.tipoPasto.includes(mealType);
          }
          return meal.tipoPasto === mealType;
        });
      }

      export function getExerciseForPlanner(slotId, instanceId) {
        const workoutList = state.weeklyWorkouts[slotId] || [];
        return workoutList.find(ex => ex.instanceId === parseFloat(instanceId));
      }

      export function getExerciseFromHistory(date, startTime, instanceId) {
        const workout = state.workoutHistory[date]?.find(w => w.startTime === startTime);
        if (!workout) return null;
        return workout.exercises.find(ex => ex.instanceId === parseFloat(instanceId));
      }

      export function getTemplateById(templateId) {
        return state.masterWorkoutTemplateList.find(t => t.id === templateId);
      }

      export function toggleDebugMode() {
        state.debugMode = !state.debugMode;
        console.log(`%cDebug mode is now ${state.debugMode ? 'ON' : 'OFF'}`, 'color: white; background-color: #ef5350; padding: 4px; border-radius: 4px;');
      }

      export function setPlannerConfig(config, sourceId) {
        log('State', 'Merging new planner config', { sourceId });
        state.rules = config.rules || [];
        const ingredients = config.ingredienti || [];
        const meals = config.meals || [];
        const exercises = config.esercizi || [];
        
        const packageTag = sourceId ? `pkg:${sourceId}` : null; // Create tag

        ingredients.forEach(ing => {
          if (!state.masterIngredientList.some(existing => existing.id === ing.id)) {
            if (packageTag) { // Add tag if new and from a package
              ing.etichette = [...(ing.etichette || []), packageTag];
            }
            state.masterIngredientList.push(ing);
          }
        });

        meals.forEach(meal => {
          if (!state.masterMealList.some(existing => existing.id === meal.id)) {
            if (packageTag) { // Add tag if new and from a package
              meal.etichette = [...(meal.etichette || []), packageTag];
            }
            state.masterMealList.push(meal);
          }
        });

        exercises.forEach(ex => {
          if (!state.masterWorkoutList.some(existing => existing.id === ex.id)) {
            if (packageTag) { // Add tag if new and from a package
              ex.etichette = [...(ex.etichette || []), packageTag];
            }
            state.masterWorkoutList.push(ex);
          }
        });

        state.masterMealList = processMealsWithCalories(state.masterMealList, state.masterIngredientList);
        saveStateToLocalStorage();
        notify();
      }

      export function setContentHubUrl(url) {
        log('State', 'Setting new Content Hub URL', { url });
        state.contentHubUrl = url;
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, url);
        notify();
      }

      export function saveStateToLocalStorage() {
        log('State', 'Saving all application state to localStorage');
        localStorage.setItem(LOCAL_STORAGE_KEY_PLAN, JSON.stringify(state.weeklyPlan));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUTS, JSON.stringify(state.weeklyWorkouts));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUT_HISTORY, JSON.stringify(state.workoutHistory));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUT_TEMPLATES, JSON.stringify(state.masterWorkoutTemplateList));
        localStorage.setItem(LOCAL_STORAGE_KEY_BIOMETRICS, JSON.stringify(state.biometricData));
        localStorage.setItem(LOCAL_STORAGE_KEY_PROFILE, JSON.stringify(state.userProfile));
        localStorage.setItem(LOCAL_STORAGE_KEY_GOALS, JSON.stringify(state.userGoals));
        localStorage.setItem(LOCAL_STORAGE_KEY_INGREDIENTS, JSON.stringify(state.masterIngredientList));
        localStorage.setItem(LOCAL_STORAGE_KEY_MEALS, JSON.stringify(state.masterMealList));
        localStorage.setItem(LOCAL_STORAGE_KEY_EXERCISES, JSON.stringify(state.masterWorkoutList));
      }

      export function loadStateFromLocalStorage() {
        log('State', 'Loading all application state from localStorage');
        const plan = localStorage.getItem(LOCAL_STORAGE_KEY_PLAN);
        const workouts = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUTS);
        const history = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUT_HISTORY);
        const templates = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUT_TEMPLATES);
        let url = localStorage.getItem(LOCAL_STORAGE_KEY_URL);
        const biometrics = localStorage.getItem(LOCAL_STORAGE_KEY_BIOMETRICS);
        const profile = localStorage.getItem(LOCAL_STORAGE_KEY_PROFILE);
        const goals = localStorage.getItem(LOCAL_STORAGE_KEY_GOALS);
        const ingredients = localStorage.getItem(LOCAL_STORAGE_KEY_INGREDIENTS);
        const meals = localStorage.getItem(LOCAL_STORAGE_KEY_MEALS);
        const exercises = localStorage.getItem(LOCAL_STORAGE_KEY_EXERCISES);

        if (url) {
            // Migration for existing users with the old, incorrect URL without the repo name
            if (url === 'https://itbiohackerhub-max.github.io/') {
                log('State', 'Migrating incorrect legacy hub URL.');
                url = 'https://itbiohackerhub-max.github.io/BiohackerHub/';
                localStorage.setItem(LOCAL_STORAGE_KEY_URL, url); // Correct it for the future
            }
            state.contentHubUrl = url;
        }

        if (plan) { try { state.weeklyPlan = JSON.parse(plan); } catch (e) { console.error("Error parsing weeklyPlan", e); state.weeklyPlan = {}; } }
        if (workouts) { try { state.weeklyWorkouts = JSON.parse(workouts); } catch (e) { console.error("Error parsing weeklyWorkouts", e); state.weeklyWorkouts = {}; } }
        if (history) { try { state.workoutHistory = JSON.parse(history); } catch (e) { console.error("Error parsing workoutHistory", e); state.workoutHistory = {}; } }
        if (templates) { try { state.masterWorkoutTemplateList = JSON.parse(templates); } catch (e) { console.error("Error parsing masterWorkoutTemplateList", e); state.masterWorkoutTemplateList = []; } }
        if (biometrics) { try { state.biometricData = JSON.parse(biometrics); } catch (e) { console.error("Error parsing biometricData", e); state.biometricData = []; } }
        if (profile) { try { state.userProfile = JSON.parse(profile); } catch (e) { console.error("Error parsing userProfile", e); state.userProfile = {}; } }
        if (goals) { try { state.userGoals = JSON.parse(goals); } catch (e) { console.error("Error parsing userGoals", e); state.userGoals = {}; } }
        if (ingredients) { try { state.masterIngredientList = JSON.parse(ingredients); } catch (e) { console.error("Error parsing masterIngredientList", e); state.masterIngredientList = []; } }
        if (meals) { try { state.masterMealList = JSON.parse(meals); } catch (e) { console.error("Error parsing masterMealList", e); state.masterMealList = []; } }
        if (exercises) { try { state.masterWorkoutList = JSON.parse(exercises); } catch (e) { console.error("Error parsing masterWorkoutList", e); state.masterWorkoutList = []; } }
      }

      export function setAppState(backupData) {
        log('State', 'Restoring application state from backup');
        state.weeklyPlan = backupData.weeklyPlan || {};
        state.weeklyWorkouts = backupData.weeklyWorkouts || {};
        state.workoutHistory = backupData.workoutHistory || {};
        state.masterWorkoutTemplateList = backupData.masterWorkoutTemplateList || [];
        state.contentHubUrl = backupData.contentHubUrl || 'https://itbiohackerhub-max.github.io/BiohackerHub/';
        state.biometricData = backupData.biometricData || [];
        state.userProfile = backupData.userProfile || {};
        state.userGoals = backupData.userGoals || {};
        state.masterIngredientList = backupData.masterIngredientList || [];
        state.masterMealList = backupData.masterMealList || [];
        state.masterWorkoutList = backupData.masterWorkoutList || [];
        saveStateToLocalStorage();
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, state.contentHubUrl);
        notify();
      }

      export function saveUserProfile(profile) {
        log('State', 'Saving user profile', { profile });
        state.userProfile = profile;
        saveStateToLocalStorage();
        notify();
      }

      export function saveUserGoals(goals) {
          log('State', 'Saving user goals', { goals });
          state.userGoals = goals;
          saveStateToLocalStorage();
          notify();
      }

      export function addOrUpdateBiometricEntry(entry) {
        log('State', 'Adding or updating biometric entry', { entry });
        const index = state.biometricData.findIndex(e => e.date === entry.date);
        if (index > -1) {
          state.biometricData[index] = entry;
        } else {
          state.biometricData.push(entry);
        }
        state.biometricData.sort((a, b) => new Date(b.date) - new Date(a.date));
        saveStateToLocalStorage();
        notify();
      }

      export function addMultipleBiometricEntries(newEntries) {
        log('State', 'Adding multiple biometric entries', { count: newEntries.length });
        state.biometricData = [...state.biometricData, ...newEntries];
        state.biometricData.sort((a, b) => new Date(b.date) - new Date(a.date));
        saveStateToLocalStorage();
        notify();
      }

      export function deleteBiometricEntry(date) {
        log('State', 'Deleting biometric entry', { date });
        state.biometricData = state.biometricData.filter(e => e.date !== date);
        saveStateToLocalStorage();
        notify();
      }

      export function addIngredient(ingredientData) {
        log('State', 'Adding new ingredient', { ingredientData });
        state.masterIngredientList.push(ingredientData);
        state.masterIngredientList.sort((a, b) => a.nome.localeCompare(b.nome));
        saveStateToLocalStorage();
        notify();
      }

      export function updateIngredient(ingredientId, updatedData) {
        log('State', 'Updating ingredient', { ingredientId, updatedData });
        const index = state.masterIngredientList.findIndex(ing => ing.id === ingredientId);
        if (index > -1) {
          state.masterIngredientList[index] = { ...state.masterIngredientList[index], ...updatedData };
          state.masterIngredientList.sort((a, b) => a.nome.localeCompare(b.nome));
          saveStateToLocalStorage();
          notify();
        }
      }

      export function deleteIngredient(ingredientId) {
        log('State', 'Deleting ingredient', { ingredientId });
        state.masterIngredientList = state.masterIngredientList.filter(ing => ing.id !== ingredientId);
        saveStateToLocalStorage();
        notify();
      }

      export function addMeal(mealData) {
        log('State', 'Adding new meal', { mealData });
        state.masterMealList.push(mealData);
        state.masterMealList = processMealsWithCalories(state.masterMealList, state.masterIngredientList);
        state.masterMealList.sort((a,b) => a.nomePasto.localeCompare(b.nomePasto));
        saveStateToLocalStorage();
        notify();
      }

      export function updateMeal(mealId, updatedData) {
        log('State', 'Updating meal', { mealId, updatedData });
        const index = state.masterMealList.findIndex(m => m.id === mealId);
        if (index > -1) {
          state.masterMealList[index] = { ...state.masterMealList[index], ...updatedData };
          state.masterMealList = processMealsWithCalories(state.masterMealList, state.masterIngredientList);
          state.masterMealList.sort((a,b) => a.nomePasto.localeCompare(b.nomePasto));
          saveStateToLocalStorage();
          notify();
        }
      }

      export function deleteMeal(mealId) {
        log('State', 'Deleting meal', { mealId });
        state.masterMealList = state.masterMealList.filter(m => m.id !== mealId);
        saveStateToLocalStorage();
        notify();
      }

      export function addWorkoutTemplate(templateName, exercises) {
        log('State', 'Adding new workout template', { templateName });
        const newTemplate = {
          id: Date.now() + Math.random(),
          name: templateName,
          exercises: JSON.parse(JSON.stringify(exercises)) // Deep copy
        };
        state.masterWorkoutTemplateList.push(newTemplate);
        state.masterWorkoutTemplateList.sort((a, b) => a.name.localeCompare(b.name));
        saveStateToLocalStorage();
        notify();
      }

      export function updateWorkoutTemplate(templateId, newExercises) {
        log('State', 'Updating workout template', { templateId });
        const index = state.masterWorkoutTemplateList.findIndex(t => t.id === templateId);
        if (index > -1) {
          state.masterWorkoutTemplateList[index].exercises = JSON.parse(JSON.stringify(newExercises)); // Deep copy
          saveStateToLocalStorage();
          notify();
        }
      }

      export function deleteWorkoutTemplate(templateId) {
        log('State', 'Deleting workout template', { templateId });
        state.masterWorkoutTemplateList = state.masterWorkoutTemplateList.filter(t => t.id !== templateId);
        saveStateToLocalStorage();
        notify();
      }

      export function addExercise(exerciseData) {
        log('State', 'Adding new exercise', { exerciseData });
        state.masterWorkoutList.push(exerciseData);
        state.masterWorkoutList.sort((a, b) => a.name.localeCompare(b.name));
        saveStateToLocalStorage();
        notify();
      }

      export function updateExercise(exerciseId, updatedData) {
        log('State', 'Updating exercise', { exerciseId, updatedData });
        const index = state.masterWorkoutList.findIndex(ex => ex.id === exerciseId);
        if (index > -1) {
          state.masterWorkoutList[index] = { ...state.masterWorkoutList[index], ...updatedData };
          state.masterWorkoutList.sort((a, b) => a.name.localeCompare(b.name));
          saveStateToLocalStorage();
          notify();
        }
      }

      export function deleteExercise(exerciseId) {
        log('State', 'Deleting exercise', { exerciseId });
        state.masterWorkoutList = state.masterWorkoutList.filter(ex => ex.id !== exerciseId);
        saveStateToLocalStorage();
        notify();
      }

      export function addWorkoutTemplateToDay(slotId, templateId) {
        log('State', 'Adding workout template to day', { slotId, templateId });
        const template = state.masterWorkoutTemplateList.find(t => t.id === templateId);
        if (!template) return;

        // Deep copy exercises from template to ensure unique instanceIds
        const exercisesToAdd = JSON.parse(JSON.stringify(template.exercises));
        
        // Ensure new instanceIds for all exercises being added
        exercisesToAdd.forEach(ex => {
          ex.instanceId = Date.now() + Math.random();
        });

        if (!state.weeklyWorkouts[slotId]) {
            state.weeklyWorkouts[slotId] = [];
        }
        
        state.weeklyWorkouts[slotId] = [...state.weeklyWorkouts[slotId], ...exercisesToAdd];
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyPlan(slotId, mealId) {
        log('State', 'Updating weekly plan', { slotId, mealId });
        if (mealId) {
          const meal = state.masterMealList.find(m => m.id === mealId);
          if (meal) {
            state.weeklyPlan[slotId] = { ...meal };
          }
        } else {
          delete state.weeklyPlan[slotId];
        }
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyWorkout(slotId, exerciseId, instanceId = null) {
        log('State', 'Updating weekly workout', { slotId, exerciseId, instanceId });
          if (!state.weeklyWorkouts[slotId]) {
              state.weeklyWorkouts[slotId] = [];
          }

          if (exerciseId) {
              const exercise = state.masterWorkoutList.find(ex => ex.id === exerciseId);
              if (exercise) {
                  const newExerciseInstance = { ...exercise, instanceId: Date.now() + Math.random() };
                  state.weeklyWorkouts[slotId].push(newExerciseInstance);
              }
          } else if (instanceId) {
              state.weeklyWorkouts[slotId] = state.weeklyWorkouts[slotId].filter(ex => ex.instanceId !== instanceId);
              if (state.weeklyWorkouts[slotId].length === 0) {
                  delete state.weeklyWorkouts[slotId];
              }
          }
          saveStateToLocalStorage();
          notify();
      }

      export function setWeeklyWorkout(slotId, newExercises) {
        log('State', 'Setting new weekly workout for slot', { slotId });
        state.weeklyWorkouts[slotId] = JSON.parse(JSON.stringify(newExercises)); // Deep copy
        saveStateToLocalStorage();
        notify();
      }

      export function clearWeeklyWorkout(slotId) {
        log('State', 'Clearing weekly workout', { slotId });
        if (state.weeklyWorkouts[slotId]) {
          delete state.weeklyWorkouts[slotId];
          saveStateToLocalStorage();
          notify();
        }
      }

      export function updateExerciseInstanceInWorkout(slotId, instanceId, newValues) {
        log('State', 'Updating exercise instance in planner', { slotId, instanceId, newValues });
          if (!state.weeklyWorkouts[slotId]) return;

          const workoutList = state.weeklyWorkouts[slotId];
          const exerciseIndex = workoutList.findIndex(ex => ex.instanceId === instanceId);

          if (exerciseIndex > -1) {
              const updatedExercise = { ...workoutList[exerciseIndex], ...newValues };
              if (newValues.defaultTempo) {
                  updatedExercise.defaultTempo = { ...workoutList[exerciseIndex].defaultTempo, ...newValues.defaultTempo };
              }
              workoutList[exerciseIndex] = updatedExercise;
              saveStateToLocalStorage();
              notify();
          }
      }

      export function reorderWorkoutExercises(slotId, oldIndex, newIndex) {
        log('State', 'Reordering workout exercises', { slotId, oldIndex, newIndex });
          if (!state.weeklyWorkouts[slotId] || oldIndex === newIndex) return;
          const workoutList = state.weeklyWorkouts[slotId];
          const [movedItem] = workoutList.splice(oldIndex, 1);
          workoutList.splice(newIndex, 0, movedItem);
          saveStateToLocalStorage();
          notify();
      }

      export function resetCurrentWeek() {
        log('State', 'Resetting current week');
        const weekStart = getWeekStartDate(state.focusedDate);
        for (let i = 0; i < 7; i++) {
            const date = new Date(weekStart);
            date.setDate(date.getDate() + i);
            const isoDate = toISODateString(date);

            MEAL_TYPES.forEach(mealType => {
                const slotId = `${isoDate}-${mealType}`;
                if (state.weeklyPlan[slotId]) {
                    delete state.weeklyPlan[slotId];
                }
            });

            const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
            if (state.weeklyWorkouts[workoutSlotId]) {
                delete state.weeklyWorkouts[workoutSlotId];
            }

            if (state.workoutHistory[isoDate]) {
                delete state.workoutHistory[isoDate];
            }
        }
        saveStateToLocalStorage();
        notify();
      }

      export function navigateWeek(direction) {
        log('State', 'Navigating week', { direction });
        const newDate = new Date(state.focusedDate);
        newDate.setDate(newDate.getDate() + (direction * 7));
        state.focusedDate = newDate;
        notify();
      }

      export function setView(view) {
        log('State', 'Setting new view', { newView: view, oldView: state.ui.currentView });
        if (['planner', 'log', 'library', 'progress', 'profile', 'charts', 'recipes', 'trainer', 'debriefing', 'goals', 'explore'].includes(view)) {
          state.ui.currentView = view;
          notify();
        }
      }

      export function setLastWorkoutSummary(summary) {
        log('State', 'Setting last workout summary');
        state.ui.lastWorkoutSummary = summary;
        notify();
      }

      export function addWorkoutToHistory(summary) {
        log('State', 'Adding structured workout to history', { date: summary.date });
        if (summary && summary.date) {
            if (!state.workoutHistory[summary.date]) {
                state.workoutHistory[summary.date] = [];
            }
            state.workoutHistory[summary.date].push({ ...summary, type: 'structured' });
            saveStateToLocalStorage();
            notify();
        }
      }

      export function addManualWorkoutToHistory(date, activityData) {
          log('State', 'Adding manual workout to history', { date, activityData });
          if (!state.workoutHistory[date]) {
              state.workoutHistory[date] = [];
          }
          const manualWorkout = {
              type: 'manual',
              date: date,
              startTime: Date.now(),
              ...activityData
          };
          state.workoutHistory[date].push(manualWorkout);
          saveStateToLocalStorage();
          notify();
      }

      export function deleteWorkoutFromHistory(date, startTime) {
          log('State', 'Deleting workout from history', { date, startTime });
          if (state.workoutHistory[date]) {
              state.workoutHistory[date] = state.workoutHistory[date].filter(workout => workout.startTime !== startTime);
              if (state.workoutHistory[date].length === 0) {
                  delete state.workoutHistory[date];
              }
              saveStateToLocalStorage();
              notify();
          }
      }

      export function updateWorkoutInHistory(date, startTime, updates) {
          log('State', 'Updating workout in history', { date, startTime, updates });
          if (state.workoutHistory[date]) {
              const workoutIndex = state.workoutHistory[date].findIndex(w => w.startTime === startTime);
              if (workoutIndex > -1) {
                  state.workoutHistory[date][workoutIndex] = {
                      ...state.workoutHistory[date][workoutIndex],
                      ...updates
                  };
                  saveStateToLocalStorage();
                  notify();
              }
          }
      }

      export function updateExerciseSetsInHistory(date, startTime, exerciseInstanceId, newSetsData) {
        log('State', 'Updating exercise sets in history', { date, startTime, exerciseInstanceId });
        if (!state.workoutHistory[date]) return;

        const workoutIndex = state.workoutHistory[date].findIndex(w => w.startTime === startTime);
        if (workoutIndex === -1) return;

        const workout = state.workoutHistory[date][workoutIndex];
        const exerciseIndex = workout.exercises.findIndex(ex => ex.instanceId === exerciseInstanceId);
        if (exerciseIndex === -1) return;

        workout.exercises[exerciseIndex].setsData = newSetsData;
        const exerciseTonnage = newSetsData.reduce((acc, set) => acc + ((set.reps || 0) * (set.weight || 0)), 0);
        workout.exercises[exerciseIndex].tonnage = exerciseTonnage;
        workout.totalTonnage = workout.exercises.reduce((acc, ex) => acc + (ex.tonnage || 0), 0);
        saveStateToLocalStorage();
        notify();
      }

      export function copyPreviousWeek() {
        log('State', 'Copying previous week');
        const currentWeekStart = getWeekStartDate(state.focusedDate);
        const prevWeekStart = new Date(currentWeekStart);
        prevWeekStart.setDate(prevWeekStart.getDate() - 7);

        for (let i = 0; i < 7; i++) {
          const sourceDate = new Date(prevWeekStart);
          sourceDate.setDate(sourceDate.getDate() + i);
          const sourceISO = toISODateString(sourceDate);

          const destDate = new Date(currentWeekStart);
          destDate.setDate(destDate.getDate() + i);
          const destISO = toISODateString(destDate);

          MEAL_TYPES.forEach(mealType => {
            const sourceSlotId = `${sourceISO}-${mealType}`;
            const destSlotId = `${destISO}-${mealType}`;
            const mealObject = state.weeklyPlan[sourceSlotId];
            if (mealObject) {
              state.weeklyPlan[destSlotId] = { ...meal };
            } else {
              delete state.weeklyPlan[destSlotId];
            }
          });

          const sourceWorkoutSlot = `${sourceISO}-${WORKOUT_SLOT_ID}`;
          const destWorkoutSlot = `${destISO}-${WORKOUT_SLOT_ID}`;
          const workoutList = state.weeklyWorkouts[sourceWorkoutSlot];
          if (workoutList && Array.isArray(workoutList)) {
              state.weeklyWorkouts[destWorkoutSlot] = JSON.parse(JSON.stringify(workoutList));
          } else {
              delete state.weeklyWorkouts[destWorkoutSlot];
          }
        }
        saveStateToLocalStorage();
        notify();
      }
  - file: src/ui/charts.js
    content: |
      import { getState } from '../core/state.js';
      import { formatDateWithYear } from '../utils/formatters.js';
      import { BIOMETRIC_FIELDS } from '../config/forms.js';
      import { MEAL_TYPES } from '../utils/constants.js';

      let biometricChart = null;
      let trendChart = null;
      let correlationChart = null;

      const CHART_COLORS = [
        'rgba(149, 117, 205, 1)', // primary
        'rgba(77, 182, 172, 1)',  // secondary
        'rgba(255, 99, 132, 1)',
        'rgba(54, 162, 235, 1)',
        'rgba(255, 206, 86, 1)',
        'rgba(153, 102, 255, 1)',
        'rgba(255, 159, 64, 1)'
      ];

      function setupChart(canvasId, config) {
          const ctx = document.getElementById(canvasId).getContext('2d');
          return new Chart(ctx, config);
      }

      function linearRegression(data) {
          const n = data.length;
          if (n < 2) return { m: 0, b: 0, r2: 0 };
          let sx = 0, sy = 0, sxy = 0, sxx = 0, syy = 0;
          data.forEach(p => {
              sx += p.x;
              sy += p.y;
              sxy += p.x * p.y;
              sxx += p.x * p.x;
              syy += p.y * p.y;
          });
          const m = (n * sxy - sx * sy) / (n * sxx - sx * sx);
          const b = (sy / n) - (m * sx / n);
          const r2 = Math.pow((n * sxy - sx * sy) / Math.sqrt((n * sxx - sx * sx) * (n * syy - sy * sy)), 2);
          return { m, b, r2 };
      }

      function getBiometricsData(appData, currentRangeFilter, dateOffset) {
          const allBiometrics = [...appData.biometricData].sort((a, b) => new Date(a.date) - new Date(b.date));
          if (allBiometrics.length === 0) return { filteredData: [], fullData: [] };

          const endDate = new Date();
          endDate.setHours(23, 59, 59, 999);
          endDate.setDate(endDate.getDate() + dateOffset);

          let startDate;
          if (currentRangeFilter === 9999) {
              startDate = new Date(allBiometrics[0].date);
          } else {
              startDate = new Date(endDate);
              startDate.setDate(startDate.getDate() - (currentRangeFilter - 1));
          }
          startDate.setHours(0, 0, 0, 0);

          const filteredData = allBiometrics.filter(item => {
              const itemDate = new Date(item.date);
              return itemDate >= startDate && itemDate <= endDate;
          });

          return { filteredData, fullData: allBiometrics };
      }

      function updateChartNavigation(appData, currentRangeFilter, dateOffset, filteredData) {
          document.querySelectorAll('.range-filter-btn').forEach(btn => {
              const range = btn.dataset.range === 'all' ? 9999 : parseInt(btn.dataset.range, 10);
              btn.classList.toggle('active', range === currentRangeFilter);
          });
          const prevBtn = document.getElementById('charts-prev-btn');
          if (filteredData.length > 0 && appData.biometricData.length > 0) {
              const firstDateVisible = new Date(filteredData[0].date).getTime();
              const firstDateEver = new Date(appData.biometricData[appData.biometricData.length - 1].date).getTime();
              prevBtn.disabled = firstDateVisible <= firstDateEver;
          } else {
              prevBtn.disabled = true;
          }
          document.getElementById('charts-next-btn').disabled = dateOffset >= 0;
          const dateRangeLabel = document.getElementById('date-range');
          if (filteredData.length > 0) {
              const start = formatDateWithYear(new Date(filteredData[0].date));
              const end = formatDateWithYear(new Date(filteredData[filteredData.length - 1].date));
              dateRangeLabel.textContent = `${start} - ${end}`;
          } else {
              dateRangeLabel.textContent = 'Nessun dato';
          }
      }

      function renderBiometricSelector(selectedKey) {
          const container = document.getElementById('biometric-selector');
          const options = BIOMETRIC_FIELDS
              .filter(f => f.type === 'number' && f.id !== 'basalMetabolism')
              .map(f => `<button class="btn-chart-type ${f.id === selectedKey ? 'active' : ''}" data-key="${f.id}">${f.label}</button>`)
              .join('');
          container.innerHTML = `<button class="btn-chart-type ${selectedKey === 'all' ? 'active' : ''}" data-key="all">Tutti</button>` + options;
      }

      function renderSummaryStats(fullData, goalWeight) {
          const container = document.getElementById('charts-summary-stats');
          if (fullData.length < 2) {
              container.innerHTML = '<p>Dati insufficienti per le statistiche.</p>';
              return;
          }
          const currentWeight = parseFloat(fullData[fullData.length - 1].weight);
          const weightData = fullData.map(d => ({ x: new Date(d.date).getTime(), y: parseFloat(d.weight) }));
          const regression = linearRegression(weightData);
          const dailyChange = regression.m * (1000 * 60 * 60 * 24);
          const weeklyChange = dailyChange * 7;

          let weeksToGoal = 'N/A';
          if (goalWeight && currentWeight !== goalWeight && Math.abs(weeklyChange) > 0.01) {
              const diff = goalWeight - currentWeight;
              if ((weeklyChange > 0 && diff > 0) || (weeklyChange < 0 && diff < 0)) {
                  weeksToGoal = Math.round(diff / weeklyChange);
              }
          }

          container.innerHTML = `
              <div class="stat-item">
                  <span class="stat-value">${currentWeight.toFixed(1)} kg</span>
                  <span class="stat-label">Peso Attuale</span>
              </div>
              <div class="stat-item">
                  <span class="stat-value">${goalWeight ? goalWeight + ' kg' : 'N/D'}</span>
                  <span class="stat-label">Obiettivo</span>
              </div>
              <div class="stat-item">
                  <span class="stat-value ${weeklyChange >= 0 ? 'positive' : 'negative'}">${weeklyChange.toFixed(2)} kg</span>
                  <span class="stat-label">Variazione Media/Sett.</span>
              </div>
              <div class="stat-item">
                  <span class="stat-value">${weeksToGoal}</span>
                  <span class="stat-label">Settimane all'Obiettivo</span>
              </div>
          `;
      }

      export function renderCharts() {
          const appData = getState();
          const { currentRangeFilter, dateOffset, selectedBiometric } = appData.ui.charts;
          const { filteredData, fullData } = getBiometricsData(appData, currentRangeFilter, dateOffset);
          
          updateChartNavigation(appData, currentRangeFilter, dateOffset, filteredData);
          renderBiometricSelector(selectedBiometric);

          if (fullData.length === 0) {
              document.getElementById('charts-summary-stats').innerHTML = '';
              document.getElementById('charts-container').innerHTML = '<p class="placeholder-text">Nessun dato biometrico disponibile. Aggiungi dati nella sezione "Progressi".</p>';
              return;
          }

          renderSummaryStats(fullData, appData.userGoals.target_weight);

          // Render Biometric Chart
          if (biometricChart) biometricChart.destroy();
          let datasets = [];
          if (selectedBiometric === 'all') {
            datasets = BIOMETRIC_FIELDS
              .filter(f => f.type === 'number' && f.id !== 'basalMetabolism')
              .map((field, index) => ({
                label: field.label,
                data: filteredData.filter(d => d[field.id]).map(d => ({ x: new Date(d.date), y: parseFloat(d[field.id]) })),
                borderColor: CHART_COLORS[index % CHART_COLORS.length],
                backgroundColor: CHART_COLORS[index % CHART_COLORS.length].replace('1)', '0.2)'),
                fill: false,
                yAxisID: field.id.includes('Percentage') ? 'yPercentage' : 'yPrimary',
              }));
          } else {
            const selectedField = BIOMETRIC_FIELDS.find(f => f.id === selectedBiometric) || BIOMETRIC_FIELDS.find(f => f.id === 'weight');
            datasets.push({
              label: selectedField.label,
              data: filteredData.filter(d => d[selectedField.id]).map(d => ({ x: new Date(d.date), y: parseFloat(d[selectedField.id]) })),
              borderColor: 'rgba(149, 117, 205, 1)',
              backgroundColor: 'rgba(149, 117, 205, 0.2)',
              fill: true,
            });
          }
          biometricChart = setupChart('biometrics-chart-canvas', {
              type: 'line',
              data: { datasets },
              options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'time', time: { unit: 'day' } }, yPrimary: { position: 'left' }, yPercentage: { position: 'right', ticks: { callback: (v) => v + '%' } } } }
          });

          // Render Trend Chart
          if (trendChart) trendChart.destroy();
          const weightDataForTrend = fullData.map(d => ({ x: new Date(d.date).getTime(), y: parseFloat(d.weight) }));
          const trendData = linearRegression(weightDataForTrend);
          trendChart = setupChart('velocity-chart-canvas', {
            type: 'line',
            data: {
                datasets: [{
                    label: 'Trend del Peso (kg)',
                    data: filteredData.map(d => ({ x: new Date(d.date), y: trendData.m * new Date(d.date).getTime() + trendData.b })),
                    borderColor: 'rgba(255, 99, 132, 1)',
                    fill: false,
                    pointRadius: 0,
                }, {
                    label: 'Peso (kg)',
                    data: filteredData.map(d => ({ x: new Date(d.date), y: parseFloat(d.weight) })),
                    type: 'scatter',
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { type: 'time', time: { unit: 'day' } } } }
          });
          
          // Render Correlation Chart
          if (correlationChart) correlationChart.destroy();
          const correlationDataPoints = [];
          for (let i = 1; i < fullData.length; i++) {
              const date1 = new Date(fullData[i - 1].date);
              const date2 = new Date(fullData[i].date);
              const weight1 = parseFloat(fullData[i - 1].weight);
              const weight2 = parseFloat(fullData[i].weight);
              const daysBetween = (date2 - date1) / (1000 * 60 * 60 * 24);
              if (daysBetween <= 0) continue;

              let totalCalories = 0, dayCount = 0;
              for (let d = new Date(date1); d < date2; d.setDate(d.getDate() + 1)) {
                  let dailyCals = 0;
                  MEAL_TYPES.forEach(type => {
                      const meal = appData.weeklyPlan[`${d.toISOString().split('T')[0]}-${type}`];
                      if(meal) dailyCals += (meal.calories_min + (meal.calories_max || meal.calories_min)) / 2;
                  });
                  if(dailyCals > 0) { totalCalories += dailyCals; dayCount++; }
              }
              if(dayCount > 0) {
                correlationDataPoints.push({ x: totalCalories / dayCount, y: (weight2 - weight1) / daysBetween });
              }
          }
          const corrTrend = linearRegression(correlationDataPoints);
          correlationChart = setupChart('correlation-chart-canvas', {
            type: 'scatter',
            data: {
              datasets: [{
                label: 'Correlazione Calorie/Variazione Peso',
                data: correlationDataPoints,
                backgroundColor: 'rgba(255, 99, 132, 0.5)'
              },{
                label: 'Linea di Tendenza',
                data: [{x: Math.min(...correlationDataPoints.map(d=>d.x)), y: corrTrend.m * Math.min(...correlationDataPoints.map(d=>d.x)) + corrTrend.b}, {x: Math.max(...correlationDataPoints.map(d=>d.x)), y: corrTrend.m * Math.max(...correlationDataPoints.map(d=>d.x)) + corrTrend.b}],
                type: 'line',
                borderColor: 'rgba(54, 162, 235, 1)',
                fill: false
              }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: { title: { display: true, text: 'Media Calorie Giornaliere' }}, y: { title: { display: true, text: 'Variazione Media Peso Giornaliera (kg)' }} }}
          });
      }
  - file: src/ui/interactions/chartsInteractions.js
    content: |
      import { getState, setUiState } from '../../core/state.js';

      function handleRangeChange(newRange) {
          const currentState = getState();
          const newUiState = {
              ...currentState.ui,
              charts: {
                  ...currentState.ui.charts,
                  currentRangeFilter: newRange,
                  dateOffset: 0
              }
          };
          setUiState(newUiState);
      }

      function handleDateNavigation(direction) {
          const currentState = getState();
          const { dateOffset, currentRangeFilter } = currentState.ui.charts;
          const step = currentRangeFilter === 9999 ? 30 : currentRangeFilter;
          const newOffset = dateOffset + (direction * step);

          if (newOffset <= 0) {
              const newUiState = {
                  ...currentState.ui,
                  charts: {
                      ...currentState.ui.charts,
                      dateOffset: newOffset
                  }
              };
              setUiState(newUiState);
          }
      }

      function handleBiometricChange(newKey) {
          const currentState = getState();
          const newUiState = {
              ...currentState.ui,
              charts: {
                  ...currentState.ui.charts,
                  selectedBiometric: newKey
              }
          };
          setUiState(newUiState);
      }

      export function initializeChartsListeners() {
          const chartsPage = document.getElementById('charts-page');
          if (!chartsPage) return;

          chartsPage.addEventListener('click', (event) => {
              const target = event.target.closest('button');
              if (!target) return;
              
              if (target.matches('.range-filter-btn')) {
                  const newRange = target.dataset.range === 'all' ? 9999 : parseInt(target.dataset.range, 10);
                  handleRangeChange(newRange);
              } else if (target.id === 'charts-prev-btn') {
                  handleDateNavigation(-1);
              } else if (target.id === 'charts-next-btn') {
                  handleDateNavigation(1);
              } else if (target.matches('.btn-chart-type') && target.dataset.key) {
                  handleBiometricChange(target.dataset.key);
              }
          });
      }
  - file: src/ui/plannerRenderer.js
    content: |
      import { MEAL_TYPES, WEEK_STARTS_ON_MONDAY, DAYS, WORKOUT_SLOT_ID, OPTIONAL_MEAL_TYPES } from '../utils/constants.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { formatIngredientsSummary } from '../utils/formatters.js';

      let plannerWeekChart = null;

      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function formatShortDate(date) {
        return date.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
      }

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function formatMealCalories(meal) {
        if (!meal || typeof meal.calories_min !== 'number') return '';
        const minCals = Number(meal.calories_min) || 0;
        const maxCals = Number(meal.calories_max) || minCals;
        if (minCals === 0 && maxCals === 0) return '';
        const kcalLabel = UI_TEXT.KCAL_LABEL || 'Kcal';
        if (minCals === maxCals) return `${minCals} ${kcalLabel}`;
        return `${minCals} - ${maxCals} ${kcalLabel}`;
      }

      function getActiveMealSlots(userProfile) {
        const activeMealSlots = [...MEAL_TYPES];
        Object.keys(OPTIONAL_MEAL_TYPES).forEach(key => {
          if (userProfile[key]) {
            activeMealSlots.push(OPTIONAL_MEAL_TYPES[key]);
          }
        });
        return activeMealSlots;
      }

      function calculateDailyCalories(isoDate, weeklyPlan, userProfile) {
        let min = 0, max = 0;
        const activeMealSlots = getActiveMealSlots(userProfile);
        
        activeMealSlots.forEach(type => {
          const meal = weeklyPlan[`${isoDate}-${type}`];
          if (meal && typeof meal.calories_min === 'number') {
            const minCals = Number(meal.calories_min) || 0;
            const maxCals = Number(meal.calories_max) || minCals;
            min += minCals;
            max += maxCals;
          }
        });
        if (min === 0 && max === 0) return '';
        return min === max ? `${UI_TEXT.KCAL_LABEL}: ${min}` : `${UI_TEXT.KCAL_LABEL}: ${min} - ${max}`;
      }

      function getRecipeButtonHTML(meal, state) {
        const fullMeal = state.masterMealList.find(m => m.id === meal.id);
        if (state.recipeBaseUrl && fullMeal && fullMeal.recipeId) {
          return `<button class="btn-view-recipe" data-meal-id="${fullMeal.id}" title="${UI_TEXT.RECIPE_BUTTON_TITLE}">
                    ${renderIcon('RECIPE', { width: 20, height: 20 })}
                  </button>`;
        }
        return '';
      }

      function getSetDetails(setData) {
          let details = [];
          if (setData.reps) details.push(`${setData.reps} reps`);
          if (setData.weight) details.push(`${setData.weight} kg`);
          if (setData.duration) details.push(`${formatDuration(setData.duration)}`);
          return details.join(' / ');
      }

      function formatDuration(ms) {
          if (typeof ms !== 'number' || ms < 0) return '00:00';
          const totalSeconds = Math.floor(ms / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }

      function renderPlannerWeekChart(state, weekStart) {
        if (plannerWeekChart) {
          plannerWeekChart.destroy();
        }

        const plannerLabels = [];
        const plannerDataMin = [];
        const plannerDataMax = [];
        const activeMealSlots = getActiveMealSlots(state.userProfile);

        for (let i=0; i<7; i++) {
          const date = new Date(weekStart);
          date.setDate(date.getDate() + i);
          plannerLabels.push(date.toLocaleDateString('it-IT', { weekday: 'short' }));
          const isoDate = toISODateString(date);
          let min = 0, max = 0;
          
          activeMealSlots.forEach(type => {
            const meal = state.weeklyPlan[`${isoDate}-${type}`];
            if (meal) {
              min += meal.calories_min || 0;
              max += meal.calories_max || meal.calories_min || 0;
            }
          });
          plannerDataMin.push(min);
          plannerDataMax.push(max);
        }

        const plannerDatasets = [{
          label: 'Calorie Pianificate (min-max)',
          data: plannerDataMin.map((min, i) => [min, plannerDataMax[i]]),
          backgroundColor: 'rgba(77, 182, 172, 0.5)', // secondary-color
          borderColor: 'rgba(77, 182, 172, 1)',
          borderWidth: 1,
          borderSkipped: false,
        }];

        const ctx = document.getElementById('planner-week-chart-canvas').getContext('2d');
        plannerWeekChart = new Chart(ctx, {
          type: 'bar',
          data: { labels: plannerLabels, datasets: plannerDatasets },
          options: { 
            responsive: true, 
            maintainAspectRatio: false,
            plugins: {
              legend: {
                display: false
              }
            },
            scales: {
              y: {
                ticks: { color: '#aaa' },
                grid: { color: 'rgba(255, 255, 255, 0.1)' }
              },
              x: {
                ticks: { color: '#aaa' },
                grid: { display: false }
              }
            }
          }
        });
      }

      function renderTodayWidget(state, todayISO) {
        const widget = document.getElementById('today-widget');
        const { userProfile, weeklyPlan, weeklyWorkouts } = state;
        const dailyCalories = calculateDailyCalories(todayISO, weeklyPlan, userProfile);
        
        const activeMealSlots = getActiveMealSlots(userProfile);
        const dayMeals = activeMealSlots.map(type => ({ type, meal: weeklyPlan[`${todayISO}-${type}`] })).filter(item => item.meal);
        const workoutList = weeklyWorkouts[`${todayISO}-${WORKOUT_SLOT_ID}`];

        let mealsHtml = dayMeals.map(item => `
          <div class="today-meal-item">
            <span><strong>${item.type}:</strong> ${item.meal.nomePasto}</span>
            <span>${formatMealCalories(item.meal)}</span>
          </div>
        `).join('');

        let workoutHtml = '';
        if (workoutList && workoutList.length > 0) {
          workoutHtml = `<button class="btn btn-primary btn-start-workout-day" data-date="${todayISO}">${UI_TEXT.START_WORKOUT_BTN}</button>`;
        } else {
          workoutHtml = `<p class="placeholder-text">Nessun allenamento pianificato per oggi.</p>`;
        }

        widget.innerHTML = `
          <div class="today-widget-header">
            <h3>Oggi, ${formatFullDate(todayISO)}</h3>
            <span>${dailyCalories}</span>
          </div>
          <div class="today-widget-body">
            ${mealsHtml.length > 0 ? mealsHtml : '<p class="placeholder-text">Nessun pasto pianificato per oggi.</p>'}
            ${workoutHtml}
          </div>
        `;
      }

      function renderCalendarView(state, weekStart) {
        const calendarGrid = document.getElementById('calendar-grid');
        const todayISO = toISODateString(new Date());
        const { userProfile, weeklyPlan, weeklyWorkouts } = state;
        
        calendarGrid.innerHTML = '';
        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const dayName = DAYS[i];
          const isoDate = toISODateString(dayDate);
          const dailyCalories = calculateDailyCalories(isoDate, weeklyPlan, userProfile);
          const workoutList = weeklyWorkouts[`${isoDate}-${WORKOUT_SLOT_ID}`];

          let summaryHTML = `<div class="daily-calories">${dailyCalories}</div>`;
          let workoutButtonHTML = '';

          if (workoutList && workoutList.length > 0) {
              const exerciseCount = workoutList.length;
              const plural = exerciseCount > 1 ? UI_TEXT.PLANNER_EXERCISES_MULTI_LABEL : UI_TEXT.PLANNER_EXERCISES_SINGLE_LABEL;
              summaryHTML += `<div class="daily-summary-item">${renderIcon('DUMBBELL', {width: 16, height: 16})} ${exerciseCount} ${plural}</div>`;
              workoutButtonHTML = `<button class="btn btn-primary btn-start-workout-day" data-date="${isoDate}">${UI_TEXT.START_WORKOUT_BTN}</button>`;
          }

          const dayCell = document.createElement('div');
          dayCell.className = 'day-cell';
          if (isoDate === todayISO) {
            dayCell.classList.add('is-today');
          }
          dayCell.dataset.date = isoDate;
          dayCell.innerHTML = `
            <div class="day-cell__header"><span>${dayName}</span><span>${dayDate.getDate()}</span></div>
            <div class="day-cell__body">${summaryHTML}${workoutButtonHTML}</div>`;
          calendarGrid.appendChild(dayCell);
        }
      }

      function renderLogView(state, weekStart) {
        const logView = document.getElementById('log-view');
        const todayISO = toISODateString(new Date());
        const { userProfile, weeklyPlan, workoutHistory, masterMealList, recipeBaseUrl } = state;
        
        let logViewHTML = '';
        let hasContent = false;

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          
          const activeMealSlots = getActiveMealSlots(userProfile);
          const dayMeals = activeMealSlots.map(type => ({ type, meal: weeklyPlan[`${isoDate}-${type}`] })).filter(item => item.meal);
          const completedWorkouts = workoutHistory[isoDate] || [];

          if (dayMeals.length > 0 || completedWorkouts.length > 0) {
            hasContent = true;
            let dayLogHTML = `<div class="log-day ${isoDate === todayISO ? 'is-today' : ''}">`;
            dayLogHTML += `
              <div class="log-day-header">
                <h3>${formatFullDate(isoDate)}</h3>
                <span class="log-day__total-calories">${calculateDailyCalories(isoDate, weeklyPlan, userProfile)}</span>
              </div>
              <div class="log-day-body">
            `;

            if (dayMeals.length > 0) {
              dayLogHTML += dayMeals.map(item => `
                <div class="log-item">
                  <div class="log-item__name">
                    <div>
                      <strong>${item.type}:</strong>
                      <span>${item.meal.nomePasto}</span>
                      <div class="log-item-details">${formatIngredientsSummary(item.meal)}</div>
                    </div>
                    ${getRecipeButtonHTML(item.meal, state)}
                  </div>
                  <span class="log-item__calories">${formatMealCalories(item.meal)}</span>
                </div>`).join('');
            }

            if (completedWorkouts.length > 0) {
                completedWorkouts.forEach(workout => {
                    if (workout.type === 'structured') {
                        dayLogHTML += `<div class="log-workout-summary">
                            <div class="log-workout-header">
                                <h4>${UI_TEXT.LOG_VIEW_WORKOUT_TITLE}</h4>
                                <div class="log-workout-header-actions">
                                    <button class="btn-delete-workout" data-date="${workout.date}" data-starttime="${workout.startTime}" title="Elimina Allenamento">${renderIcon('TRASH')}</button>
                                </div>
                            </div>
                            <div class="log-workout-stats">
                                <span>Durata: ${formatDuration(workout.totalTime)}</span>
                                ${workout.totalCaloriesBurned > 0 ? `<span>/</span><span>Kcal: ${workout.totalCaloriesBurned}</span>` : ''}
                                ${workout.totalTonnage > 0 ? `<span>/</span><span>Volume: ${workout.totalTonnage} kg</span>` : ''}
                                ${workout.rpe ? `<span>/</span><span>RPE: ${workout.rpe}</span>` : ''}
                            </div>
                            ${workout.exercises.map(ex => `
                            <div class="log-workout-exercise">
                                <div class="log-item">
                                  <strong>${ex.name}</strong>
                                  <div class="log-workout-header-actions">
                                    <button class="btn-edit-logged-exercise" data-date="${workout.date}" data-starttime="${workout.startTime}" data-instanceid="${ex.instanceId}" title="Modifica Esercizio">${renderIcon('EDIT')}</button>
                                  </div>
                                </div>
                                <div class="log-sets-details">
                                ${ex.setsData.map((setData, i) => `
                                    <div class="log-set-item">
                                    <span>Serie ${i + 1}</span>
                                    <span>${getSetDetails(setData)}</span>
                                    </div>
                                `).join('')}
                                </div>
                            </div>
                            `).join('')}
                        </div>`;
                    } else if (workout.type === 'manual') {
                        let detailsHTML = '';
                        if (workout.distance) detailsHTML += `<div><strong>Distanza:</strong> ${workout.distance} km</div>`;
                        if (workout.fc_avg) detailsHTML += `<div><strong>FC Media:</strong> ${workout.fc_avg} bpm</div>`;
                        if (workout.fc_max) detailsHTML += `<div><strong>FC Max:</strong> ${workout.fc_max} bpm</div>`;
                        if (workout.notes) detailsHTML += `<div class="log-item-details">${workout.notes.replace(/\n/g, '<br>')}</div>`;

                        dayLogHTML += `<div class="log-workout-summary">
                            <div class="log-workout-header">
                                <h4>${UI_TEXT.LOG_VIEW_MANUAL_ACTIVITY_TITLE}</h4>
                                <div class="log-workout-header-actions">
                                  <button class="btn-delete-workout" data-date="${workout.date}" data-starttime="${workout.startTime}" title="Elimina Allenamento">${renderIcon('TRASH')}</button>
                                </div>
                            </div>
                            <div class="log-item">
                                <strong>${workout.name}</strong>
                                <span>${workout.duration || ''}</span>
                            </div>
                            ${detailsHTML ? `<div class="log-manual-details">${detailsHTML}</div>` : ''}
                        </div>`;
                    }
                });
            }

            dayLogHTML += `</div></div>`;
            logViewHTML += dayLogHTML;
          }
        }

        if (!hasContent) {
          logView.innerHTML = `<p class="placeholder-text">${UI_TEXT.LOG_VIEW_EMPTY}</p>`;
        } else {
          logView.innerHTML = logViewHTML;
        }
      }

      export function renderPlannerPage(state) {
        const weekStart = getWeekStartDate(state.focusedDate);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        document.getElementById('week-title').textContent = `${formatShortDate(weekStart)} - ${formatShortDate(weekEnd)}`;

        const todayISO = toISODateString(new Date());
        renderTodayWidget(state, todayISO);
        renderPlannerWeekChart(state, weekStart);
        renderCalendarView(state, weekStart);
        renderLogView(state, weekStart);
      }
  - file: src/ui/renderer.js
    content: |
      import { getState } from '../core/state.js';
      import { renderPlannerPage } from './plannerRenderer.js';
      import { renderBiometricsPage, renderProfilePage, renderChartsPage, renderDebriefingPage, renderGoalsPage, renderRecipesPage, renderLibraryPage, renderExplorePage } from './pageRenderers.js';
      import { initializeTrainerController, destroyTrainerController } from './trainerRenderer.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { log } from '../utils/logger.js';

      let isTrainerActive = false;

      function populateIcons() {
          document.querySelector('.app-title').insertAdjacentHTML('afterbegin', renderIcon('APP_LOGO', { width: 24, height: 24 }));
          document.getElementById('nav-planner').insertAdjacentHTML('afterbegin', renderIcon('PLANNER'));
          document.getElementById('nav-library').insertAdjacentHTML('afterbegin', renderIcon('LIBRARY'));
          document.getElementById('nav-progress').insertAdjacentHTML('afterbegin', renderIcon('WEIGHT_SCALE'));
          document.getElementById('nav-charts').insertAdjacentHTML('afterbegin', renderIcon('BAR_CHART'));
          document.getElementById('nav-recipes').insertAdjacentHTML('afterbegin', renderIcon('BOOK'));
          document.getElementById('nav-goals').insertAdjacentHTML('afterbegin', renderIcon('GOAL'));
          document.getElementById('nav-explore').insertAdjacentHTML('afterbegin', renderIcon('EXPLORE'));
          document.getElementById('nav-profile').insertAdjacentHTML('afterbegin', renderIcon('PROFILE'));
          document.getElementById('global-alert-close').innerHTML = renderIcon('CLOSE', { width: 24, height: 24, classes: 'alert-icon' });
          document.getElementById('hamburger-btn').innerHTML = renderIcon('HAMBURGER', { width: 28, height: 28 });
          document.querySelectorAll('.btn-expand-chart').forEach(btn => {
              btn.innerHTML = renderIcon('EXPAND', { width: 20, height: 20 });
          });

          document.querySelectorAll('.modal-close-btn').forEach(btn => {
              btn.innerHTML = renderIcon('CLOSE');
          });
      }

      export function populateInitialText() {
        document.title = UI_TEXT.MAIN_TITLE;
        document.getElementById('main-title').textContent = UI_TEXT.MAIN_TITLE;
        document.querySelector('#nav-planner span').textContent = UI_TEXT.NAV_PLANNER;
        document.querySelector('#nav-library span').textContent = UI_TEXT.NAV_LIBRARY;
        document.querySelector('#nav-progress span').textContent = UI_TEXT.NAV_PROGRESS;
        document.querySelector('#nav-charts span').textContent = UI_TEXT.NAV_CHARTS;
        document.querySelector('#nav-recipes span').textContent = UI_TEXT.NAV_RECIPES;
        document.querySelector('#nav-goals span').textContent = UI_TEXT.NAV_GOALS;
        document.querySelector('#nav-explore span').textContent = UI_TEXT.NAV_EXPLORE;
        document.querySelector('#nav-profile span').textContent = UI_TEXT.NAV_PROFILE;
        document.getElementById('load-content-hub-btn').textContent = UI_TEXT.LOAD_BUTTON;
        document.getElementById('reset-btn').textContent = UI_TEXT.RESET_BUTTON;
        document.getElementById('copy-week-btn').textContent = UI_TEXT.COPY_WEEK_BTN;
        document.getElementById('backup-btn').textContent = UI_TEXT.BACKUP_BTN;
        document.getElementById('restore-btn').textContent = UI_TEXT.RESTORE_BTN;
        document.getElementById('info-modal-title').textContent = UI_TEXT.INFO_MODAL_TITLE;
        document.getElementById('info-modal-desc').textContent = UI_TEXT.INFO_MODAL_DESC;
        document.getElementById('info-modal-json-example').textContent = UI_TEXT.INFO_MODAL_EXAMPLE_JSON;
        document.getElementById('biometrics-title').textContent = UI_TEXT.BIOMETRICS_FORM_TITLE;
        document.getElementById('biometrics-history-title').textContent = UI_TEXT.BIOMETRICS_HISTORY_TITLE;
        document.getElementById('profile-title').textContent = UI_TEXT.PROFILE_FORM_TITLE;
        document.getElementById('data-management-title').textContent = "Gestione Dati";
        document.getElementById('charts-title').textContent = UI_TEXT.CHARTS_TITLE;
        document.getElementById('planner-week-chart-title').textContent = UI_TEXT.PLANNER_CHART_TITLE;
        document.getElementById('biometrics-chart-title').textContent = UI_TEXT.BIOMETRICS_CHART_TITLE;
        document.getElementById('recipes-title').textContent = UI_TEXT.RECIPES_TITLE;
        document.getElementById('debriefing-title').textContent = UI_TEXT.DEBRIEFING_TITLE;
        document.getElementById('back-to-planner-btn').textContent = UI_TEXT.DEBRIEFING_BACK_BTN;
        document.getElementById('log-view-title').textContent = "Registro Dettagliato";
        populateIcons();
      }

      export function renderApp() {
        const state = getState();
        const { currentView } = state.ui;
        const plannerPage = document.getElementById('planner-page');
        const libraryPage = document.getElementById('library-page');
        const progressPage = document.getElementById('progress-page');
        const chartsPage = document.getElementById('charts-page');
        const recipesPage = document.getElementById('recipes-page');
        const goalsPage = document.getElementById('goals-page');
        const explorePage = document.getElementById('explore-page');
        const profilePage = document.getElementById('profile-page');
        const trainerPage = document.getElementById('trainer-page');
        const debriefingPage = document.getElementById('debriefing-page');

        const navPlannerBtn = document.getElementById('nav-planner');
        const navLibraryBtn = document.getElementById('nav-library');
        const navProgressBtn = document.getElementById('nav-progress');
        const navChartsBtn = document.getElementById('nav-charts');
        const navRecipesBtn = document.getElementById('nav-recipes');
        const navGoalsBtn = document.getElementById('nav-goals');
        const navExploreBtn = document.getElementById('nav-explore');
        const navProfileBtn = document.getElementById('nav-profile');

        log('Renderer', 'Render triggered. Current view:', currentView, 'isTrainerActive:', isTrainerActive);

        if (currentView !== 'trainer' && isTrainerActive) {
            log('Renderer', 'View is not trainer, destroying trainer controller...');
            destroyTrainerController();
            isTrainerActive = false;
        }

        [plannerPage, libraryPage, progressPage, chartsPage, recipesPage, goalsPage, explorePage, profilePage, trainerPage, debriefingPage].forEach(p => p.classList.add('hidden'));
        [navPlannerBtn, navLibraryBtn, navProgressBtn, navChartsBtn, navRecipesBtn, navGoalsBtn, navExploreBtn, navProfileBtn].forEach(b => b.classList.remove('active'));
        document.getElementById('main-nav').classList.remove('is-open', 'is-mobile');

        if (currentView === 'planner' || currentView === 'log') {
          plannerPage.classList.remove('hidden');
          navPlannerBtn.classList.add('active');
          renderPlannerPage(state);
        } else if (currentView === 'library') {
          libraryPage.classList.remove('hidden');
          navLibraryBtn.classList.add('active');
          renderLibraryPage(state);
        } else if (currentView === 'progress') {
          progressPage.classList.remove('hidden');
          navProgressBtn.classList.add('active');
          renderBiometricsPage(state);
        } else if (currentView === 'charts') {
          chartsPage.classList.remove('hidden');
          navChartsBtn.classList.add('active');
          renderChartsPage(state);
        } else if (currentView === 'recipes') {
          recipesPage.classList.remove('hidden');
          navRecipesBtn.classList.add('active');
          renderRecipesPage(state);
        } else if (currentView === 'goals') {
          goalsPage.classList.remove('hidden');
          navGoalsBtn.classList.add('active');
          renderGoalsPage(state);
        } else if (currentView === 'explore') {
          explorePage.classList.remove('hidden');
          navExploreBtn.classList.add('active');
          renderExplorePage(state);
        } else if (currentView === 'profile') {
          profilePage.classList.remove('hidden');
          navProfileBtn.classList.add('active');
          renderProfilePage(state);
          document.getElementById('content-hub-url-input').value = state.contentHubUrl;
        } else if (currentView === 'trainer') {
          trainerPage.classList.remove('hidden');
          setTimeout(() => window.scrollTo(0, 0), 0);
          log('Renderer', 'View is trainer, checking if trainer is active...');
          if (!isTrainerActive) {
            log('Renderer', 'Trainer is not active, initializing trainer controller...');
            initializeTrainerController();
            isTrainerActive = true;
          }
        } else if (currentView === 'debriefing') {
          debriefingPage.classList.remove('hidden');
          renderDebriefingPage(state);
        }
      }
