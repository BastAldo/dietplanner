commit_message: "refactor(core): Implement self-contained weekly plan and robust loading"
rationale: |
  This is a major architectural refactoring to address critical data integrity and user experience issues. The application is now significantly more robust and resilient.

  1.  **Self-Contained Weekly Plan**: The core data architecture has been changed. Previously, the `weeklyPlan` stored only meal IDs, making it dependent on the external `config.json`. Now, as per `docs/02_ARCHITECTURE.md`, the `weeklyPlan` in `localStorage` stores a complete, denormalized copy of each meal object. This makes the user's plan self-contained and invulnerable to changes in the source `config.json`, fixing a major data loss vulnerability. The logic in `src/core/state.js` and `src/ui/renderer.js` has been updated to support this new structure.

  2.  **Robust Startup Logic**: The application's startup sequence in `src/main.js` has been completely rewritten to be more predictable and safe. It now immediately renders any locally available plan, then checks for a shared `configUrl` in the URL parameters.

  3.  **Confirmation on New Config Load**: To prevent accidental data overwrites, if a shared link's `configUrl` differs from the one currently in use, the application now presents a confirmation modal. The new configuration is only loaded after explicit user consent.

  4.  **UI/UX Enhancements**: As requested, the "Share Config" button has been moved to a more logical position next to the URL input field in `index.html`. It has also been converted from a text button to a styled SVG icon to improve visual consistency. The relevant CSS in `style.css` has been adjusted.

  5.  **Documentation Sync**: The architecture document (`docs/02_ARCHITECTURE.md`) has been updated to reflect the new, more resilient data structure of the `weeklyPlan`.
