commit_message: "feat(trainer): Refactor audio logic and add debug view"
rationale: |
  In accordance with the approved plan, this patch implements a significant architectural improvement to the Trainer module and adds a powerful new debugging tool.

  **1. Trainer Audio Refactoring:**
  The core logic for triggering audio feedback (beeps and spoken cues) has been decoupled from the animation loop and moved into the `queueBuilder`. Previously, the animation's `tick` function was responsible for deciding *when* to play a sound based on timers and state transitions. This mixed responsibilities and made the code harder to maintain.

  Now, the `queueBuilder` pre-compiles an `executionQueue` that includes not only movement phases but also explicit audio commands (e.g., `{ type: 'speech', ... }`, `{ type: 'audio', ... }`). The animation `tick` function has been simplified into a "stupid executor" that merely processes this queue sequentially. This change makes the trainer's behavior more predictable, easier to debug, and aligns with the Single Responsibility Principle.

  **2. Execution Queue Debug View:**
  To enhance transparency and debugging capabilities, a new UI component has been added to the trainer view. When the application's `debugMode` is activated, this component displays the entire pre-compiled `executionQueue` in real-time. It highlights the currently executing command, providing an exact, step-by-step view of the trainer's internal state and upcoming actions. This is invaluable for fine-tuning exercise tempos and verifying the sequence of events.
patches:
