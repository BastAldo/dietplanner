commit_message: "feat(api): Migliora il parser JSON con error handling dettagliato"
rationale: |
  In risposta alla richiesta dell'utente di migliorare le capacità di debug, questa patch potenzia il servizio di caricamento della configurazione.

  La precedente implementazione in `src/api/configService.js` utilizzava `response.json()` direttamente, il che generava errori di parsing generici e fuorvianti se uno qualsiasi dei file di configurazione (`pasti.json`, `ingredienti.json`, `esercizi.json`) era mancante, corrotto o restituiva un errore HTML.

  La nuova versione implementa un meccanismo di parsing in due fasi più robusto:
  1.  La risposta della `fetch` viene prima letta come testo semplice con `response.text()`.
  2.  Il testo viene poi esplicitamente parsato all'interno di un blocco `try...catch`.

  Questo approccio consente di intercettare gli errori di parsing in modo granulare. Se il parsing fallisce, viene generato un nuovo `Error` che include l'URL del file specifico che ha causato il problema e un estratto del contenuto non valido.

  Questo intervento risolve il problema di debug dell'utente e rende l'applicazione significativamente più manutenibile per il futuro.
patches:
  - file: src/api/configService.js
    content: |
      import { UI_TEXT } from '../config/uiText.js';

      async function fetchJson(url) {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`${UI_TEXT.API_FETCH_ERROR} ${url}: ${response.status}`);
        }
        const textContent = await response.text();
        try {
          return JSON.parse(textContent);
        } catch (e) {
          const errorMessage = `Errore nel parsing del JSON da ${url}. Contenuto ricevuto: "${textContent.substring(0, 100)}..."`;
          console.error(errorMessage, e);
          throw new Error(errorMessage);
        }
      }

      export async function fetchAndParseConfig(mealsUrl) {
          if (!mealsUrl) throw new Error(UI_TEXT.CONFIG_URL_EMPTY_ERROR);

          try {
              const mealsConfig = await fetchJson(mealsUrl);
              if (!mealsConfig.meals || !Array.isArray(mealsConfig.meals)) {
                  throw new Error(UI_TEXT.API_INVALID_MEALS_FILE);
              }

              const baseUrl = new URL(mealsUrl);
              const basePath = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf('/'));

              const ingredientsUrl = `${baseUrl.origin}${basePath}/ingredienti.json`;
              const ingredientsConfig = await fetchJson(ingredientsUrl);
              if (!ingredientsConfig.ingredienti || !Array.isArray(ingredientsConfig.ingredienti)) {
                  throw new Error(UI_TEXT.API_INVALID_INGREDIENTS_FILE);
              }

              let exercises = [];
              try {
                  const exercisesUrl = `${baseUrl.origin}${basePath}/esercizi.json`;
                  const exercisesConfig = await fetchJson(exercisesUrl);
                  if (exercisesConfig.esercizi && Array.isArray(exercisesConfig.esercizi)) {
                      exercises = exercisesConfig.esercizi;
                  }
              } catch (e) {
                  console.warn(UI_TEXT.API_EXERCISES_FILE_WARN, e.message);
              }

              return {
                  rules: mealsConfig.rules || [],
                  meals: mealsConfig.meals,
                  ingredienti: ingredientsConfig.ingredienti,
                  esercizi: exercises
              };

          } catch (error) {
              console.error("Fallimento nel caricamento della configurazione completa:", error);
              // Mostra l'errore specifico invece di uno generico
              throw new Error(error.message || UI_TEXT.API_CONFIG_LOAD_FAIL);
          }
      }
