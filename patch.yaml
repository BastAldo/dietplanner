commit_message: "feat(UX): Migliora UI, introduce editing log e feedback vocale trainer"
rationale: |
  Questo commit introduce una serie di miglioramenti sostanziali basati sulle richieste dell'utente, con l'obiettivo di elevare l'usabilità, la reattività e la completezza funzionale dell'applicazione.

  1. **Riorganizzazione dell'Interfaccia Utente**:
     - È stato implementato un menu hamburger per la navigazione su dispositivi mobili. Questo risolve il problema di leggibilità delle voci di menu su schermi di piccole dimensioni, rendendo l'app più moderna e user-friendly.
     - Il layout del riepilogo settimanale nel planner è stato corretto utilizzando Flexbox con wrapping, garantendo che tutti gli elementi siano sempre visibili e correttamente allineati, eliminando così i problemi di "spaginamento" su mobile.

  2. **Introduzione Modifica Allenamenti Registrati**:
     - È stata aggiunta la funzionalità, precedentemente assente, di modificare gli allenamenti già salvati nella cronologia (Log).
     - Al click sull'icona "Modifica", un nuovo modale permette all'utente di correggere i dati di ogni singola serie (peso, ripetizioni), offrendo un controllo completo e la possibilità di rimediare a errori di inserimento.

  3. **Integrazione Feedback Vocale nel Trainer**:
     - È stato implementato un sistema di guida vocale opzionale all'interno della vista Trainer.
     - Quando l'audio è attivo, l'applicazione ora fornisce istruzioni vocali chiare per guidare l'utente attraverso le varie fasi dell'esercizio (salita, tenuta, discesa) e i periodi di riposo, migliorando l'esperienza di allenamento a mani libere.
