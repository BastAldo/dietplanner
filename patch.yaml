        border-color: var(--primary-color);
      }
      .meal-editor-ingredients-header { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
      .meal-editor-ingredients-header h4 { color: var(--secondary-color); }
      .meal-editor-ingredient-row { display: grid; grid-template-columns: 1fr 80px 80px 40px; gap: 0.75rem; align-items: center; }
      .meal-editor-ingredient-row label { display: none; }
      .meal-editor-ingredient-row select, .meal-editor-ingredient-row input {
          width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px;
          font-size: 1rem; background-color: var(--bg-color); color: var(--text-color);
      }
      .meal-editor-ingredient-row .btn-remove-ingredient {
          background: none; border: none; color: var(--danger-color); cursor: pointer;
          display: flex; align-items: center; justify-content: center;
      }
      .meal-editor-footer { border-top: 1px solid var(--border-color); margin-top: 1.5rem; padding-top: 1rem; text-align: right; }
      .meal-editor-totals { font-weight: bold; font-size: 1.1rem; }
      .meal-editor-totals .macro-p { color: var(--danger-color); }
      .meal-editor-totals .macro-c { color: var(--success-color); }
      .meal-editor-totals .macro-f { color: var(--warning-color); }
      .meal-editor-totals span { margin-left: 0.75rem; }
      
      /* --- MODAL SEARCH BAR & FILTERS --- */
      .modal-search-bar-container {
        padding: 0 1.5rem 1rem 1.5rem;
        border-bottom: 1px solid var(--border-color);
      }
      .modal-search-bar-container .library-search-bar {
        width: 100%;
        margin: 0;
      }
      .tag-filter-container {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 1rem 1.5rem 0 1.5rem;
      }
      .tag-filter-btn {
        padding: 0.5rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.9rem;
        background-color: transparent;
        color: var(--text-color-muted);
      }
      .tag-filter-btn.active {
        background-color: var(--primary-color);
        color: var(--bg-color);
        border-color: var(--primary-color);
        font-weight: bold;
      }
      #selection-modal .modal-body {
        padding-top: 1rem;
      }
      
      /* --- PACKAGE PREVIEW MODAL --- */
      #package-preview-body {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .preview-section h4 {
        color: var(--secondary-color);
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.5rem;
        margin-bottom: 0.75rem;
