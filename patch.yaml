  - file: src/ui/charts.js
    content: |
      import { MEAL_TYPES, DAYS, WEEK_STARTS_ON_MONDAY } from '../utils/constants.js';
      import { BIOMETRIC_FIELDS } from '../config/forms.js';
      import { UI_TEXT } from '../config/uiText.js';

      let plannerChartInstance = null;
      let biometricsChartInstance = null;
      let correlationChartInstance = null;
      let currentPlannerChartType = 'bar';

      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function getChartColors() {
          const style = getComputedStyle(document.documentElement);
          return {
              primary: style.getPropertyValue('--primary-color').trim(),
              secondary: style.getPropertyValue('--secondary-color').trim(),
              textColor: style.getPropertyValue('--text-color').trim(),
              borderColor: style.getPropertyValue('--border-color').trim(),
              danger: style.getPropertyValue('--danger-color').trim(),
              success: style.getPropertyValue('--success-color').trim(),
              warning: style.getPropertyValue('--warning-color').trim()
          };
      }

      function calculateWeeklyCalorieData(state) {
        const weekStart = getWeekStartDate(state.focusedDate);
        const weeklyData = { labels: [], calories: [] };

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          weeklyData.labels.push(DAYS[i]);

          let dailyMin = 0, dailyMax = 0;
          MEAL_TYPES.forEach(type => {
            const meal = state.weeklyPlan[`${isoDate}-${type}`];
            if (meal && typeof meal.calories_min === 'number') {
              const minCals = Number(meal.calories_min) || 0;
              const maxCals = Number(meal.calories_max) || minCals;
              dailyMin += minCals;
              dailyMax += maxCals;
            }
          });
          weeklyData.calories.push([dailyMin, dailyMax]);
        }
        return weeklyData;
      }

      function renderPlannerChart(state) {
        const weeklyData = calculateWeeklyCalorieData(state);
        const colors = getChartColors();
        const isLineChart = currentPlannerChartType === 'line';
        
        const datasets = isLineChart ?
        [{
            label: UI_TEXT.CHART_KCAL_MIN_LABEL,
            data: weeklyData.calories.map(c => c[0]),
            borderColor: colors.secondary,
            fill: false,
            tension: 0.1
        },{
            label: UI_TEXT.CHART_KCAL_MAX_LABEL,
            data: weeklyData.calories.map(c => c[1]),
            borderColor: colors.primary,
            fill: '-1',
            backgroundColor: colors.primary + '33',
            tension: 0.1
        }]
        :
        [{
            label: UI_TEXT.CHART_KCAL_RANGE_LABEL,
            data: weeklyData.calories,
            backgroundColor: colors.primary,
            borderColor: colors.secondary
        }];
        
        const ctx = document.getElementById('planner-chart-canvas').getContext('2d');
        plannerChartInstance = new Chart(ctx, {
          type: currentPlannerChartType,
          data: {
            labels: weeklyData.labels,
            datasets: datasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                ticks: { color: colors.textColor },
                grid: { color: colors.borderColor }
              },
              x: {
                ticks: { color: colors.textColor },
                grid: { display: false }
              }
            },
            plugins: {
              legend: {
                display: isLineChart,
                labels: { color: colors.textColor }
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    if (isLineChart) {
                      return `${context.dataset.label}: ${context.parsed.y}`;
                    }
                    const value = context.raw;
                    if (value[0] === value[1]) {
                      return `${UI_TEXT.KCAL_LABEL}: ${value[0]}`;
                    }
                    return `${UI_TEXT.KCAL_LABEL}: ${value[0]} - ${value[1]}`;
                  }
                }
              }
            }
          }
        });
      }

      function getBiometricsData(state) {
        const data = [...state.biometricData].sort((a, b) => new Date(a.date) - new Date(b.date));
        const labels = data.map(entry => new Date(entry.date).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }));
        
        const datasets = {};
        const numericFields = BIOMETRIC_FIELDS.filter(f => f.type === 'number' && f.id !== 'basalMetabolism' && f.id !== 'bmi');

        numericFields.forEach(field => {
            datasets[field.id] = {
                label: field.label,
                data: data.map(entry => entry[field.id] || null)
            };
        });

        return { labels, datasets };
      }

      function renderBiometricsChart(state) {
        const { labels, datasets } = getBiometricsData(state);
        const colors = getChartColors();
        const colorCycle = [colors.primary, colors.secondary, colors.success, colors.warning, colors.danger];
        
        const chartDatasets = Object.values(datasets)
            .map((dataset, index) => ({
                label: dataset.label,
                data: dataset.data,
                fill: false,
                borderColor: colorCycle[index % colorCycle.length],
                tension: 0.1,
                pointBackgroundColor: colorCycle[index % colorCycle.length],
                pointRadius: 4
            }))
            .filter(d => d.data.some(val => val !== null));

        const ctx = document.getElementById('biometrics-chart-canvas').getContext('2d');

        biometricsChartInstance = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: chartDatasets
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                ticks: { color: colors.textColor },
                grid: { color: colors.borderColor }
              },
              x: {
                ticks: { color: colors.textColor },
                grid: { display: false }
              }
            },
            plugins: {
              legend: {
                display: true,
                labels: { color: colors.textColor }
              }
            }
          }
        });
      }

      function renderCorrelationChart(state) {
          const sortedBiometrics = [...state.biometricData].sort((a, b) => new Date(a.date) - new Date(b.date));
          if (sortedBiometrics.length < 2) return;

          const labels = sortedBiometrics.map(entry => new Date(entry.date).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }));
          const weightData = sortedBiometrics.map(entry => entry.weight || null);

          const calorieData = sortedBiometrics.map(entry => {
              const isoDate = entry.date;
              let dailyMin = 0;
              MEAL_TYPES.forEach(type => {
                  const meal = state.weeklyPlan[`${isoDate}-${type}`];
                  if (meal) {
                      dailyMin += Number(meal.calories_min) || 0;
                  }
              });
              return dailyMin > 0 ? dailyMin : null;
          });

          const colors = getChartColors();
          const ctx = document.getElementById('correlation-chart-canvas').getContext('2d');
          correlationChartInstance = new Chart(ctx, {
              type: 'bar',
              data: {
                  labels: labels,
                  datasets: [
                      {
                          label: 'Peso (kg)',
                          data: weightData,
                          type: 'line',
                          borderColor: colors.secondary,
                          tension: 0.1,
                          yAxisID: 'yWeight',
                      },
                      {
                          label: 'Kcal Assunte',
                          data: calorieData,
                          backgroundColor: colors.primary + '80',
                          yAxisID: 'yKcal',
                      }
                  ]
              },
              options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  scales: {
                      yWeight: {
                          type: 'linear',
                          position: 'left',
                          ticks: { color: colors.secondary },
                          grid: { color: colors.borderColor }
                      },
                      yKcal: {
                          type: 'linear',
                          position: 'right',
                          ticks: { color: colors.primary },
                          grid: { display: false }
                      },
                      x: {
                          ticks: { color: colors.textColor },
                          grid: { display: false }
                      }
                  },
                  plugins: {
                      legend: {
                          labels: { color: colors.textColor }
                      }
                  }
              }
          });
      }

      function handleChartTypeChange(event, state) {
          const type = event.target.dataset.type;
          if (type && type !== currentPlannerChartType) {
              currentPlannerChartType = type;
              document.querySelectorAll('.btn-chart-type').forEach(btn => {
                  btn.classList.toggle('active', btn.dataset.type === type);
              });
              if (plannerChartInstance) {
                plannerChartInstance.destroy();
              }
              renderPlannerChart(state);
          }
      }

      export function renderCharts(state) {
          if (plannerChartInstance) plannerChartInstance.destroy();
          if (biometricsChartInstance) biometricsChartInstance.destroy();
          if (correlationChartInstance) correlationChartInstance.destroy();

          renderPlannerChart(state);
          renderBiometricsChart(state);
          renderCorrelationChart(state);
          
          document.getElementById('correlation-chart-title').textContent = UI_TEXT.CHARTS_CORRELATION_TITLE;

          const switcher = document.querySelector('.chart-type-switcher');
          const boundHandler = (e) => handleChartTypeChange(e, state);
          switcher.replaceWith(switcher.cloneNode(true));
          document.querySelector('.chart-type-switcher').addEventListener('click', boundHandler);
      }
  - file: src/ui/pageRenderers.js
    content: |
      import { calculateBMR } from '../core/calculations.js';
      import { BIOMETRIC_FIELDS, PROFILE_FIELDS } from '../config/forms.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';
      import { renderCharts } from './charts.js';

      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }

      function formatReadableDate(isoDate) {
          const date = new Date(isoDate);
          return date.toLocaleDateString('it-IT', {
              weekday: 'long',
              year: 'numeric',
              month: 'long',
              day: 'numeric'
          });
      }

      function formatDuration(ms) {
          if (typeof ms !== 'number' || ms < 0) return '00:00';
          const totalSeconds = Math.floor(ms / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }

      export function renderBiometricsPage(state) {
        const form = document.getElementById('biometrics-form');
        const listContainer = document.getElementById('biometrics-list');

        form.innerHTML = `${BIOMETRIC_FIELDS.map(field => `<div class="form-group"><label for="bio-${field.id}">${field.label}</label>${field.type === 'textarea' ? `<textarea id="bio-${field.id}" name="${field.id}"></textarea>` : `<input type="${field.type}" id="bio-${field.id}" name="${field.id}" ${field.props || ''} ${field.id === 'date' ? `value="${toISODateString(new Date())}"` : ''}>`}</div>`).join('')}<div class="form-actions"><button type="submit" class="btn btn-primary">${UI_TEXT.BIOMETRICS_SAVE_BTN}</button><button type="reset" class="btn btn-secondary">${UI_TEXT.BIOMETRICS_CLEAR_BTN}</button></div>`;

        if (state.biometricData.length > 0) {
            listContainer.innerHTML = state.biometricData.map(entry => {
                const fieldsHTML = BIOMETRIC_FIELDS.filter(field => field.id !== 'date' && entry[field.id])
                    .map(field => `
                        <div class="biometric-card__item ${field.id === 'notes' ? 'biometric-card__notes' : ''}">
                            <span class="biometric-card__label">${field.label}</span>
                            <span class="biometric-card__value">${entry[field.id]}</span>
                        </div>
                    `).join('');

                return `
                    <div class="biometric-card" data-date="${entry.date}">
                        <div class="biometric-card__header">
                            <span class="biometric-card__date">${formatReadableDate(entry.date)}</span>
                            <div class="biometrics-actions">
                                <button class="btn-actions-menu" data-date="${entry.date}" title="${UI_TEXT.BIOMETRICS_ACTIONS_TITLE}">
                                    ${renderIcon('KEBAB_MENU', { width: 24, height: 24 })}
                                </button>
                                <div class="actions-dropdown">
                                    <button class="btn-edit-biometrics" data-date="${entry.date}">${UI_TEXT.BIOMETRICS_EDIT_BTN}</button>
                                    <button class="btn-delete-biometrics delete" data-date="${entry.date}">${UI_TEXT.BIOMETRICS_DELETE_BTN}</button>
                                </div>
                            </div>
                        </div>
                        <div class="biometric-card__body">
                            ${fieldsHTML}
                        </div>
                    </div>`;
            }).join('');
        } else {
            listContainer.innerHTML = `<p class="placeholder-text">${UI_TEXT.BIOMETRICS_EMPTY_LIST}</p>`;
        }

        const weightInput = form.elements.weight;
        const bmrInput = form.elements.basalMetabolism;
        const weightForCalc = weightInput.value || (state.biometricData.length > 0 ? state.biometricData[0].weight : null);

        const bmr = calculateBMR(state.userProfile, weightForCalc);
        if (bmr !== null) {
          bmrInput.value = bmr;
        } else {
          bmrInput.placeholder = UI_TEXT.BIOMETRICS_BMR_PLACEHOLDER;
        }
      }

      export function renderProfilePage(state) {
        const form = document.getElementById('profile-form');
        form.innerHTML = `${PROFILE_FIELDS.map(field => `<div class="form-group">${field.type === 'radio' ? `<fieldset><legend>${field.label}</legend>${field.options.map(opt => `<label><input type="radio" name="${field.id}" value="${opt.value}" ${state.userProfile[field.id] === opt.value ? 'checked' : ''}> ${opt.label}</label>`).join('')}</fieldset>` : `<label for="prof-${field.id}">${field.label}</label><input type="${field.type}" id="prof-${field.id}" name="${field.id}" value="${state.userProfile[field.id] || ''}" ${field.props || ''}>`}</div>`).join('')}<div class="form-actions"><button type="submit" class="btn btn-primary">${UI_TEXT.PROFILE_SAVE_BTN}</button></div>`;
      }

      export function renderChartsPage(state) {
          const placeholder = document.getElementById('biometrics-chart-placeholder');
          const canvas = document.getElementById('biometrics-chart-canvas');
          if (state.biometricData.length < 2) {
              placeholder.textContent = UI_TEXT.BIOMETRICS_CHART_EMPTY;
              placeholder.classList.remove('hidden');
              canvas.classList.add('hidden');
          } else {
              placeholder.classList.add('hidden');
              canvas.classList.remove('hidden');
          }
          renderCharts(state);
      }

      function getSetDetails(setData) {
          let details = [];
          if (setData.reps) {
              details.push(`${setData.reps} reps`);
          }
          if (setData.duration) {
              details.push(`${formatDuration(setData.duration)}`);
          }
          return details.join(' / ');
      }

      export function renderDebriefingPage(state) {
        const summaryContainer = document.getElementById('debriefing-summary');
        const statsContainer = document.getElementById('debriefing-stats');
        const summary = state.lastWorkoutSummary;

        if (!summary || !summary.exercises) {
            summaryContainer.innerHTML = `<p class="placeholder-text">${UI_TEXT.DEBRIEFING_NO_SUMMARY}</p>`;
            statsContainer.innerHTML = '';
            return;
        }

        const statsHTML = `
            <div class="stat-item">
                <span class="stat-label">${UI_TEXT.DEBRIEFING_TOTAL_TIME}</span>
                <span class="stat-value">${formatDuration(summary.totalTime)}</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">${UI_TEXT.DEBRIEFING_EXERCISE_TIME}</span>
                <span class="stat-value">${formatDuration(summary.totalExerciseTime)}</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">${UI_TEXT.DEBRIEFING_REST_TIME}</span>
                <span class="stat-value">${formatDuration(summary.totalRestTime)}</span>
            </div>
        `;
        statsContainer.innerHTML = statsHTML;

        const summaryHTML = summary.exercises.map(exercise => {
            const isCompleted = exercise.setsCompleted === exercise.defaultSets;
            const setsDetailsHTML = exercise.setsData.map((setData, i) => `
                <div class="set-detail-item">
                    <span>${UI_TEXT.DEBRIEFING_SET_LABEL} ${i + 1}</span>
                    <span>${getSetDetails(setData)}</span>
                </div>
            `).join('');

            return `
                <div class="debriefing-card ${isCompleted ? 'completed' : 'incomplete'}">
                    <div class="debriefing-card-header">
                        <h4>${exercise.name}</h4>
                        <div class="debriefing-status">
                            ${isCompleted ? UI_TEXT.DEBRIEFING_COMPLETED : UI_TEXT.DEBRIEFING_INCOMPLETE}
                        </div>
                    </div>
                    <div class="debriefing-card-body">
                      <div class="exercise-stats">
                        <span class="exercise-stat-item">${UI_TEXT.DEBRIEFING_SETS_COMPLETED}: ${exercise.setsCompleted}/${exercise.defaultSets}</span>
                        <span class="exercise-stat-item">${UI_TEXT.DEBRIEFING_TOTAL_TIME}: ${formatDuration(exercise.totalTime)}</span>
                      </div>
                      <div class="sets-details-container">
                          ${setsDetailsHTML}
                      </div>
                    </div>
                </div>
            `;
        }).join('');

        summaryContainer.innerHTML = summaryHTML;
      }
  - file: src/ui/plannerRenderer.js
    content: |
      import { MEAL_TYPES, WEEK_STARTS_ON_MONDAY, DAYS, WORKOUT_SLOT_ID } from '../utils/constants.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';

      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function formatShortDate(date) {
        return date.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
      }

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function formatMealCalories(meal) {
        if (!meal || typeof meal.calories_min !== 'number') return '';
        const minCals = Number(meal.calories_min) || 0;
        const maxCals = Number(meal.calories_max) || minCals;
        if (minCals === 0 && maxCals === 0) return '';
        const kcalLabel = UI_TEXT.KCAL_LABEL || 'Kcal';
        if (minCals === maxCals) return `${minCals} ${kcalLabel}`;
        return `${minCals} - ${maxCals} ${kcalLabel}`;
      }

      function calculateDailyCalories(isoDate, weeklyPlan) {
        let min = 0, max = 0;
        MEAL_TYPES.forEach(type => {
          const meal = weeklyPlan[`${isoDate}-${type}`];
          if (meal && typeof meal.calories_min === 'number') {
            const minCals = Number(meal.calories_min) || 0;
            const maxCals = Number(meal.calories_max) || minCals;
            min += minCals;
            max += maxCals;
          }
        });
        if (min === 0 && max === 0) return '';
        return min === max ? `${UI_TEXT.KCAL_LABEL}: ${min}` : `${UI_TEXT.KCAL_LABEL}: ${min} - ${max}`;
      }

      function getRecipeButtonHTML(meal, state) {
        const fullMeal = state.masterMealList.find(m => m.id === meal.id);
        if (state.recipeBaseUrl && fullMeal && fullMeal.recipeId) {
          return `<button class="btn-view-recipe" data-meal-id="${fullMeal.id}" title="${UI_TEXT.RECIPE_BUTTON_TITLE}">
                    ${renderIcon('RECIPE', { width: 20, height: 20 })}
                  </button>`;
        }
        return '';
      }

      function getSetDetails(setData) {
          let details = [];
          if (setData.reps) {
              details.push(`${setData.reps} reps`);
          }
          if (setData.duration) {
              details.push(`${formatDuration(setData.duration)}`);
          }
          return details.join(' / ');
      }

      function formatDuration(ms) {
          if (typeof ms !== 'number' || ms < 0) return '00:00';
          const totalSeconds = Math.floor(ms / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }

      function renderPlannerSummaryWidget(state, weekStart) {
        const widgetContainer = document.getElementById('planner-summary-widget');
        let totalCalories = 0;
        let dayCount = 0;
        let plannedWorkouts = 0;
        let completedWorkouts = 0;

        for (let i = 0; i < 7; i++) {
            const dayDate = new Date(weekStart);
            dayDate.setDate(dayDate.getDate() + i);
            const isoDate = toISODateString(dayDate);
            
            let dailyMin = 0;
            let hasMeals = false;
            MEAL_TYPES.forEach(type => {
                const meal = state.weeklyPlan[`${isoDate}-${type}`];
                if (meal) {
                    dailyMin += Number(meal.calories_min) || 0;
                    hasMeals = true;
                }
            });

            if (hasMeals) {
                totalCalories += dailyMin;
                dayCount++;
            }

            if (state.weeklyWorkouts[`${isoDate}-${WORKOUT_SLOT_ID}`]) {
                plannedWorkouts += state.weeklyWorkouts[`${isoDate}-${WORKOUT_SLOT_ID}`].length > 0 ? 1 : 0;
            }
            if (state.workoutHistory[isoDate]) {
                completedWorkouts += state.workoutHistory[isoDate].length;
            }
        }
        
        const avgCalories = dayCount > 0 ? Math.round(totalCalories / dayCount) : 0;

        widgetContainer.innerHTML = `
            <h3 class="planner-summary-title">${UI_TEXT.PLANNER_SUMMARY_TITLE}</h3>
            <div class="planner-summary-stats">
                <div class="planner-summary-stat">
                    <span class="stat-value">${avgCalories}</span>
                    <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_AVG_KCAL}</span>
                </div>
                <div class="planner-summary-stat">
                    <span class="stat-value">${completedWorkouts} / ${plannedWorkouts}</span>
                    <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_WORKOUTS}</span>
                </div>
            </div>
        `;
      }

      function renderCalendarView(state, weekStart) {
        const calendarGrid = document.getElementById('calendar-grid');
        const todayISO = toISODateString(new Date());
        calendarGrid.innerHTML = '';
        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const dayName = DAYS[i];
          const isoDate = toISODateString(dayDate);
          const dailyCalories = calculateDailyCalories(isoDate, state.weeklyPlan);
          const workoutList = state.weeklyWorkouts[`${isoDate}-${WORKOUT_SLOT_ID}`];
          
          let summaryHTML = `<div class="daily-calories">${dailyCalories}</div>`;
          let workoutButtonHTML = '';

          if (workoutList && workoutList.length > 0) {
              const exerciseCount = workoutList.length;
              const plural = exerciseCount > 1 ? UI_TEXT.PLANNER_EXERCISES_MULTI_LABEL : UI_TEXT.PLANNER_EXERCISES_SINGLE_LABEL;
              summaryHTML += `<div class="daily-summary-item">${renderIcon('WEIGHT_SCALE', {width: 16, height: 16})} ${exerciseCount} ${plural}</div>`;
              workoutButtonHTML = `<button class="btn btn-primary btn-start-workout-day" data-date="${isoDate}">${UI_TEXT.START_WORKOUT_BTN}</button>`;
          }

          const dayCell = document.createElement('div');
          dayCell.className = 'day-cell';
          if (isoDate === todayISO) {
            dayCell.classList.add('is-today');
          }
          dayCell.dataset.date = isoDate;
          dayCell.innerHTML = `
            <div class="day-cell__header"><span>${dayName}</span><span>${dayDate.getDate()}</span></div>
            <div class="day-cell__body">${summaryHTML}${workoutButtonHTML}</div>`;
          calendarGrid.appendChild(dayCell);
        }
      }

      function renderLogView(state, weekStart) {
        const logView = document.getElementById('log-view');
        const todayISO = toISODateString(new Date());
        let logViewHTML = '';
        let hasContent = false;

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          const dayMeals = MEAL_TYPES.map(type => ({ type, meal: state.weeklyPlan[`${isoDate}-${type}`] })).filter(item => item.meal);
          const completedWorkouts = state.workoutHistory[isoDate] || [];

          if (dayMeals.length > 0 || completedWorkouts.length > 0) {
            hasContent = true;
            let dayLogHTML = `<div class="log-day ${isoDate === todayISO ? 'is-today' : ''}">`;
            dayLogHTML += `<h3><span>${formatFullDate(isoDate)}</span><span class="log-day__total-calories">${calculateDailyCalories(isoDate, state.weeklyPlan)}</span></h3>`;

            if (dayMeals.length > 0) {
              dayLogHTML += dayMeals.map(item => `<div class="log-item"><div class="log-item__name"><strong>${item.type}:</strong><span>${item.meal.nomePasto}</span>${getRecipeButtonHTML(item.meal, state)}</div><span class="log-item__calories">${formatMealCalories(item.meal)}</span></div>`).join('');
            }
            
            if (completedWorkouts.length > 0) {
                completedWorkouts.forEach(workout => {
                    dayLogHTML += `<div class="log-workout-summary">
                        <div class="log-workout-header">
                            <h4>${UI_TEXT.LOG_VIEW_WORKOUT_TITLE}</h4>
                            <button class="btn-delete-workout" data-date="${workout.date}" data-starttime="${workout.startTime}" title="Elimina Allenamento">${renderIcon('TRASH')}</button>
                        </div>
                        <div class="log-workout-stats">
                        <span>Durata: ${formatDuration(workout.totalTime)}</span>
                        <span>/</span>
                        <span>Lavoro: ${formatDuration(workout.totalExerciseTime)}</span>
                        <span>/</span>
                        <span>Recupero: ${formatDuration(workout.totalRestTime)}</span>
                        </div>
                        ${workout.exercises.map(ex => `
                        <div class="log-workout-exercise">
                            <div class="log-item">
                            <strong>${ex.name}</strong>
                            <span>${ex.setsCompleted} / ${ex.defaultSets} serie</span>
                            </div>
                            <div class="log-sets-details">
                            ${ex.setsData.map((setData, i) => `
                                <div class="log-set-item">
                                <span>Serie ${i + 1}</span>
                                <span>${getSetDetails(setData)}</span>
                                </div>
                            `).join('')}
                            </div>
                        </div>
                        `).join('')}
                    </div>`;
                });
            }

            dayLogHTML += `</div>`;
            logViewHTML += dayLogHTML;
          }
        }

        if (!hasContent) {
          logView.innerHTML = `<p class="placeholder-text">${UI_TEXT.LOG_VIEW_EMPTY}</p>`;
        } else {
          logView.innerHTML = logViewHTML;
        }
      }

      export function renderPlannerPage(state) {
        const weekStart = getWeekStartDate(state.focusedDate);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        document.getElementById('week-title').textContent = `${formatShortDate(weekStart)} - ${formatShortDate(weekEnd)}`;
        
        const calendarGrid = document.getElementById('calendar-grid');
        const logView = document.getElementById('log-view');
        const viewCalendarBtn = document.getElementById('view-calendar-btn');
        const viewLogBtn = document.getElementById('view-log-btn');

        if (state.currentView === 'planner' || state.currentView === 'log') {
            renderPlannerSummaryWidget(state, weekStart);
        }

        if (state.currentView === 'planner') {
            calendarGrid.classList.remove('hidden');
            logView.classList.add('hidden');
            viewCalendarBtn.classList.add('active');
            viewLogBtn.classList.remove('active');
        } else if (state.currentView === 'log') {
            calendarGrid.classList.add('hidden');
            logView.classList.remove('hidden');
            viewCalendarBtn.classList.remove('active');
            viewLogBtn.classList.add('active');
        }

        renderCalendarView(state, weekStart);
        renderLogView(state, weekStart);
      }
  - file: styles/planner.css
    content: |
      /* --- PLANNER PAGE --- */
      .data-source-container {
          display: flex; align-items: center; gap: 0.75rem;
          padding: 1rem; background: var(--card-color);
          border: 1px solid var(--border-color); border-radius: 8px;
          margin-bottom: 1.5rem;
      }
      #config-url-input {
          flex-grow: 1; min-width: 0; padding: 0.75rem;
          border: 1px solid var(--border-color); border-radius: 8px;
          font-size: 1rem; background-color: var(--bg-color);
          color: var(--text-color);
      }
      #config-url-input:focus { outline: none; border-color: var(--primary-color); }
      #info-icon { font-size: 1.5rem; cursor: pointer; color: var(--text-color-muted); flex-shrink: 0; }

      .planner-summary-widget {
          background: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
          margin-bottom: 1.5rem;
      }
      .planner-summary-title {
          color: var(--secondary-color);
          text-align: center;
          margin-bottom: 1rem;
          font-size: 1.25rem;
      }
      .planner-summary-stats {
          display: flex;
          justify-content: space-around;
          text-align: center;
      }
      .planner-summary-stat .stat-value {
          font-size: 1.75rem;
          font-weight: bold;
          color: var(--primary-color);
      }
      .planner-summary-stat .stat-label {
          font-size: 0.8rem;
          color: var(--text-color-muted);
          text-transform: uppercase;
      }

      .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .calendar-header h2 { font-size: 1.25rem; text-align: center; color: var(--text-color); }
      .planner-controls-wrapper {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
      }
      .view-switcher { display: flex; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
      .btn-view { background: transparent; border: none; padding: 0.5rem; color: var(--text-color-muted); cursor: pointer; display: flex; align-items: center; }
      .btn-view.active { background: var(--primary-color); color: var(--bg-color); }
      .btn-view:not(:last-child) { border-right: 1px solid var(--border-color); }
      .planner-actions { display: flex; gap: 0.75rem; }
      .calendar-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
      .day-cell {
          background-color: var(--card-color); border: 1px solid var(--border-color);
          border-radius: 8px; padding: 1rem; min-height: 120px; display: flex;
          flex-direction: column; transition: all 0.2s;
      }
      .day-cell:not(:has(.btn-start-workout-day)) { cursor: pointer; }
      .day-cell:not(:has(.btn-start-workout-day)):hover { border-color: var(--primary-color); transform: translateY(-3px); }
      .day-cell.is-today {
        border-color: var(--primary-color);
        box-shadow: 0 0 10px rgba(149, 117, 205, 0.5);
      }
      .day-cell__header { display: flex; justify-content: space-between; font-weight: bold; color: var(--text-color-muted); text-transform: uppercase; font-size: 0.8rem; pointer-events: none; }
      .day-cell__body { margin-top: 0.5rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; pointer-events: none; }
      .daily-calories { font-size: 1rem; font-weight: bold; color: var(--secondary-color); }
      .daily-summary-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
      .btn-start-workout-day {
        pointer-events: all;
        width: 100%;
        margin-top: 1rem;
        padding: 0.5rem;
        font-size: 0.85rem;
      }
      .log-view { padding: 1rem; background: var(--card-color); border-radius: 8px; border: 1px solid var(--border-color); }
      .log-day { margin-bottom: 2rem; }
      .log-day:last-child { margin-bottom: 0; }
      .log-day h3 { color: var(--primary-color); border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 0.5rem; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
      .log-day.is-today h3 {
        color: var(--primary-color);
        font-weight: bold;
      }
      .log-day__total-calories { font-size: 0.9rem; font-weight: normal; color: var(--text-color-muted); }
      .log-item { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.75rem 0; font-size: 0.95rem; border-bottom: 1px solid var(--border-color); }
      .log-day .log-item:last-child { border-bottom: none; }
      .log-item__name { display: flex; align-items: center; gap: 0.5rem; }
      .log-item strong { color: var(--text-color-muted); }
      .log-item__calories { font-weight: bold; color: var(--secondary-color); flex-shrink: 0; }

      .log-workout-summary { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border-color); }
      .log-workout-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
      .log-workout-header h4 { color: var(--secondary-color); font-size: 1rem; margin: 0; }
      .btn-delete-workout { background: none; border: none; color: var(--text-color-muted); cursor: pointer; padding: 0.25rem; border-radius: 4px; display: flex; }
      .btn-delete-workout:hover { color: var(--danger-color); background-color: rgba(239, 83, 80, 0.1); }
      .log-workout-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        font-size: 0.85rem;
        color: var(--text-color-muted);
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      .log-workout-exercise { margin-bottom: 1rem; }
      .log-workout-exercise .log-item { border-bottom: 1px solid var(--border-color); }
      .log-sets-details { padding-left: 1rem; border-left: 2px solid var(--border-color); margin-top: 0.5rem; }
      .log-set-item { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 0.25rem 0; }
      .log-set-item span:first-child { color: var(--text-color-muted); }

      @media (min-width: 768px) {
          #app-container { padding: 2rem; }
          .calendar-grid { grid-template-columns: repeat(7, 1fr); gap: 1rem; }
      }
