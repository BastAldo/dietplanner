commit_message: "fix(UI): Corregge il layout del modale su mobile e ripristina la funzionalità del toogle audio"
rationale: |
  Questa patch risolve due bug distinti nell'interfaccia utente, migliorando la reattività e la funzionalità del componente Trainer.

  **1. Correzione del Layout del Modale di Conferma su Mobile:**
  * **Problema:** Il modale utilizzato per terminare l'allenamento, che presenta tre pulsanti, non gestiva correttamente gli schermi di piccole dimensioni. I pulsanti non andavano a capo, causando un overflow e rompendo il layout del modale.
  * **Soluzione:** È stata applicata una semplice ma efficace correzione CSS al file `styles/modals.css`. Aggiungendo `flex-wrap: wrap;` e `justify-content: center;` alla classe `.modal-footer`, i pulsanti ora si dispongono verticalmente quando lo spazio orizzontale è insufficiente, garantendo una visualizzazione corretta su tutti i dispositivi mobili.

  **2. Ripristino Funzionalità del Pulsante Audio nel Trainer:**
  * **Problema:** Il pulsante per attivare o disattivare l'audio guida nella schermata del trainer non rispondeva al click. L'analisi ha rivelato una gestione impropria dei listener di eventi nel file `src/ui/components/TrainerComponent.js`. L'uso di `.bind(this)` sia in `addEventListener` che in `removeEventListener` creava nuove istanze della funzione, impedendo la corretta rimozione del listener e causando un comportamento imprevedibile.
  * **Soluzione:** È stata implementata una best practice per la gestione degli eventi in JavaScript. La funzione di gestione `handleControls` viene ora associata (`bind`) una sola volta nel costruttore del componente e memorizzata in una proprietà (`this.boundHandleControls`). Questa proprietà viene poi utilizzata in modo coerente sia per aggiungere (`mount`) che per rimuovere (`destroy`) il listener, risolvendo il bug e rendendo il componente più robusto e privo di potenziali memory leak.
patches:
  - file: styles/modals.css
    content: |
      /* --- MODALS --- */
      .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 1001; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
      .modal-hidden { display: none !important; }
      .modal-overlay:not(.modal-hidden) { display: flex; opacity: 1; pointer-events: all; }
      .modal-content { background-color: var(--card-color); border-radius: 8px; border: 1px solid var(--border-color); width: 90%; max-width: 600px; display: flex; flex-direction: column; max-height: 90vh; position: relative; }
      .modal-content-large { max-width: 95vw; width: 95vw; height: 90vh; max-height: 90vh; }
      .modal-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color); }
      .modal-header h3 { color: var(--primary-color); }
      .modal-close-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-color-muted); padding: 0; line-height: 1; width: 2.25rem; height: 2.25rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background-color 0.2s, color 0.2s; z-index: 10; }
      .modal-close-btn svg { width: 1em; height: 1em; }
      .modal-close-btn:hover { background-color: rgba(255, 255, 255, 0.1); color: var(--text-color); }
      .modal-body { overflow-y: auto; flex-grow: 1; padding: 1.5rem; display: flex; flex-direction: column; }
      #chart-modal-body { padding: 1rem; }
      #chart-modal-canvas { max-height: 100%; }
      .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 1rem; flex-wrap: wrap; }
      .selection-list { display: flex; flex-direction: column; gap: 0.5rem; }
      .selection-item { padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: background-color 0.2s, border-color 0.2s; }
      .selection-item:hover { background-color: var(--bg-color); border-color: var(--primary-color); }
      .meal-item-details { font-size: 0.85rem; color: var(--text-color-muted); margin-top: 0.25rem; }

      /* Custom Scrollbar for Modal Body */
      .modal-body::-webkit-scrollbar { width: 8px; }
      .modal-body::-webkit-scrollbar-track { background: var(--bg-color); }
      .modal-body::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 10px; border: 2px solid var(--bg-color); }
      .modal-body::-webkit-scrollbar-thumb:hover { background-color: var(--text-color-muted); }

      /* --- UNIFIED EDITOR SECTION COMPONENT --- */
      .day-editor-list { display: flex; flex-direction: column; gap: 1rem; }
      .editor-section-header {
        font-weight: bold;
        color: var(--text-color-muted);
        margin-bottom: 0.5rem;
        padding-left: 0.25rem;
      }
      .editor-section-body {
        background: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 1rem;
        min-height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .meal-details, .workout-summary {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      .meal-info, .exercise-info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        flex-grow: 1;
        min-width: 0;
      }
      .meal-details__name {
        font-weight: 500;
      }
      .meal-actions, .workout-summary-actions {
        display: flex;
        gap: 0.5rem;
        flex-shrink: 0;
      }
      .meal-actions button { background: none; border: none; color: var(--text-color-muted); cursor: pointer; padding: 0.4rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
      .meal-actions button:hover { background-color: rgba(255,255,255,0.1); color: var(--text-color); }
      .btn-add-meal, .btn-add-exercise { background: transparent; border: 1px dashed var(--border-color); color: var(--text-color-muted); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; width: 100%; transition: all 0.2s; }
      .btn-add-meal:hover, .btn-add-exercise:hover { background: var(--bg-color); border-color: var(--secondary-color); color: var(--secondary-color); }

      /* --- WORKOUT EDITOR STYLES (ISOLATED & CORRECTED) --- */
      .workout-editor-list .draggable-item {
        display: flex;
        align-items: center;
        padding: 1rem;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        min-height: 70px;
      }
      .workout-editor-list .meal-actions { margin-left: auto; }
      .meal-actions .btn-remove-exercise { color: var(--danger-color); }
      .exercise-details-summary { font-size: 0.85rem; color: var(--text-color-muted); }

      #exercise-editor-form {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 1rem;
        align-items: end;
      }
      #exercise-editor-form .form-group { display: flex; flex-direction: column; }
      #exercise-editor-form label { margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-color-muted); }
      #exercise-editor-form input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; background-color: var(--bg-color); color: var(--text-color); }
      #exercise-editor-form .sets-group { grid-column: 1 / 3; }
      #exercise-editor-form .reps-group, #exercise-editor-form .duration-group { grid-column: 3 / 5; }
      #exercise-editor-form .rest-group { grid-column: 5 / 7; }
      #exercise-editor-form .weight-group { grid-column: 1 / 4; }
      #exercise-editor-form .tempo-group {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        border-top: 1px solid var(--border-color);
        padding-top: 1rem;
        margin-top: 1rem;
      }

      /* Stili per il nuovo editor dei log */
      #logged-exercise-form { display: flex; flex-direction: column; gap: 1rem; }
      .set-editor-row {
        display: grid;
        grid-template-columns: 50px 1fr 1fr;
        gap: 1rem;
        align-items: end;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
      }
      #logged-exercise-form .set-editor-row:last-child { border-bottom: none; }
      .set-editor-label {
        font-weight: bold;
        color: var(--text-color-muted);
        padding-bottom: 0.75rem;
      }

      .structured-form { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
      .structured-form .full-width { grid-column: 1 / -1; }

      .drag-handle { cursor: grab; color: var(--text-color-muted); padding: 0.5rem; }
      .sortable-ghost { opacity: 0.4; background: var(--primary-color); }

      @media (min-width: 600px) {
        .structured-form {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 480px) {
        .workout-summary {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.75rem;
        }
        .workout-summary-actions {
          width: 100%;
          display: flex;
          flex-wrap: wrap;
        }
        .workout-summary-actions .btn {
          flex-grow: 1;
        }
      }
  - file: src/ui/components/TrainerComponent.js
    content: |
      import { getWorkoutState, updateState } from '../../core/trainer/state.js';
      import { startWorkout, pauseWorkout, resumeWorkout, endWorkout, discardWorkout, incrementManualRep } from '../../core/trainer.js';
      import { setView } from '../../core/state.js';
      import { log } from '../../utils/logger.js';
      import { UI_TEXT } from '../../config/uiText.js';
      import { renderIcon } from '../icons.js';
      import { showConfirmModal } from '../modals.js';

      const RING_RADIUS = 128;
      const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

      export class TrainerComponent {
          constructor(containerElement) {
              this.container = containerElement;

              this.elements = {
                  exerciseName: this.container.querySelector('#current-exercise-name'),
                  exerciseDetails: this.container.querySelector('#current-exercise-details'),
                  repDisplay: this.container.querySelector('#current-rep-display'),
                  upcomingDisplay: this.container.querySelector('#upcoming-exercise-display'),

                  btnStart: this.container.querySelector('#trainer-start-btn'),
                  btnPause: this.container.querySelector('#trainer-pause-btn'),
                  btnResume: this.container.querySelector('#trainer-resume-btn'),
                  btnManualRep: this.container.querySelector('#trainer-manual-rep-btn'),
                  btnAudio: this.container.querySelector('#audio-toggle-btn'),
                  btnEnd: this.container.querySelector('#trainer-end-btn'),

                  ringContainer: this.container.querySelector('#timer-ring-container'),
              };

              this.ringProgress = null;
              this.ringText = null;

              // Bind the event handler once in the constructor
              this.boundHandleControls = this.handleControls.bind(this);
          }

          mount() {
              this.createTimerRing();
              this.container.addEventListener('click', this.boundHandleControls);
              this.elements.btnManualRep.textContent = UI_TEXT.TRAINER_MANUAL_REP_BTN_LABEL;
              this.elements.btnEnd.innerHTML = renderIcon('STOP', {width: 28, height: 28});
              this.updateAudioButton(getWorkoutState().isAudioEnabled);
          }

          destroy() {
              log('TrainerComponent', 'Destroying component and cleaning up DOM...');
              this.container.removeEventListener('click', this.boundHandleControls);
              if (this.elements.ringContainer) {
                  this.elements.ringContainer.innerHTML = '';
              }
              log('TrainerComponent', 'Component destroyed.');
          }

          _handleEndWorkoutFlow() {
            showConfirmModal({
                title: UI_TEXT.TERMINATE_WORKOUT_CONFIRM_TITLE,
                message: UI_TEXT.TERMINATE_WORKOUT_PROMPT_MSG,
                buttons: [
                    {
                        text: UI_TEXT.SAVE_AND_END_BTN,
                        className: 'btn btn-primary',
                        callback: endWorkout
                    },
                    {
                        text: UI_TEXT.DISCARD_WORKOUT_BTN,
                        className: 'btn btn-danger',
                        callback: discardWorkout
                    },
                    {
                        text: UI_TEXT.CONFIRM_MODAL_CANCEL_BTN,
                        className: 'btn btn-secondary',
                        callback: null // Just closes the modal
                    }
                ]
            });
          }

          async handleControls(e) {
              const target = e.target.closest('button');
              if (!target) return;

              const targetId = target.id;
              log('TrainerComponent', `Control button clicked: ${targetId}`);
              switch (targetId) {
                  case 'trainer-start-btn':
                      target.disabled = true;
                      await startWorkout();
                      if(this.elements.btnStart) {
                        this.elements.btnStart.disabled = false;
                      }
                      break;
                  case 'trainer-pause-btn': pauseWorkout(); break;
                  case 'trainer-resume-btn': resumeWorkout(); break;
                  case 'trainer-end-btn': this._handleEndWorkoutFlow(); break;
                  case 'trainer-manual-rep-btn': incrementManualRep(); break;
                  case 'audio-toggle-btn': this.toggleAudio(); break;
              }
          }

          toggleAudio() {
              const currentState = getWorkoutState();
              const newState = !currentState.isAudioEnabled;
              updateState({ isAudioEnabled: newState });
              this.updateAudioButton(newState);
          }

          updateAudioButton(isAudioEnabled) {
              this.elements.btnAudio.innerHTML = renderIcon(isAudioEnabled ? 'AUDIO_ON' : 'AUDIO_OFF');
              this.elements.btnAudio.classList.toggle('active', isAudioEnabled);
          }

          createTimerRing() {
              if (this.elements.ringContainer.querySelector('svg')) return;
              this.elements.ringContainer.innerHTML = '';
              const svgNS = 'http://www.w3.org/2000/svg';
              const svg = document.createElementNS(svgNS, 'svg');
              const svgSize = (RING_RADIUS + 12) * 2;
              svg.setAttribute('width', svgSize);
              svg.setAttribute('height', svgSize);
              svg.setAttribute('viewBox', `0 0 ${svgSize} ${svgSize}`);
              const center = svgSize / 2;
              const backgroundCircle = document.createElementNS(svgNS, 'circle');
              backgroundCircle.setAttribute('cx', center);
              backgroundCircle.setAttribute('cy', center);
              backgroundCircle.setAttribute('r', RING_RADIUS);
              backgroundCircle.setAttribute('class', 'timer-ring-bg');
              const progressCircle = document.createElementNS(svgNS, 'circle');
              progressCircle.setAttribute('cx', center);
              progressCircle.setAttribute('cy', center);
              progressCircle.setAttribute('r', RING_RADIUS);
              progressCircle.setAttribute('class', 'timer-ring-progress');
              progressCircle.style.strokeDasharray = RING_CIRCUMFERENCE;
              const text = document.createElementNS(svgNS, 'text');
              text.setAttribute('x', '50%');
              text.setAttribute('y', '50%');
              text.setAttribute('dy', '.3em');
              text.setAttribute('class', 'timer-ring-display');
              svg.appendChild(backgroundCircle);
              svg.appendChild(progressCircle);
              svg.appendChild(text);
              this.elements.ringContainer.prepend(svg);
              this.ringProgress = progressCircle;
              this.ringText = text;
          }

          updateTimerRing(percent) {
              if (!this.ringProgress) return;
              const offset = RING_CIRCUMFERENCE - (percent / 100) * RING_CIRCUMFERENCE;
              this.ringProgress.style.strokeDashoffset = offset;
          }

          formatTime(ms) {
              const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
              const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
              const seconds = (totalSeconds % 60).toString().padStart(2, '0');
              return `${minutes}:${seconds}`;
          }

          render(state) {
              if (!this.ringText || !state.fullExecutionQueue || state.fullExecutionQueue.length === 0) {
                  // Handle pre-start or empty state
                  this.elements.exerciseName.textContent = state.exerciseQueue[0]?.name || 'Pronto per iniziare';
                  this.elements.exerciseDetails.textContent = '';
                  this.elements.repDisplay.classList.add('hidden-rep');
                  this.elements.upcomingDisplay.innerHTML = '';
                  this.updateTimerRing(0);
                  this.ringText.textContent = '';
                  this.elements.btnStart.classList.toggle('hidden', state.status !== 'idle');
                  this.elements.btnPause.classList.add('hidden');
                  this.elements.btnResume.classList.add('hidden');
                  this.elements.btnManualRep.classList.add('hidden');
                  return;
              };

              const { fullExecutionQueue, currentQueueIndex, status } = state;
              const currentPhase = fullExecutionQueue[currentQueueIndex];

              if (!currentPhase || !currentPhase.context || !currentPhase.context.exercise) {
                  this.elements.exerciseName.textContent = 'Allenamento Completato';
                  this.elements.exerciseDetails.textContent = '';
                  this.elements.repDisplay.classList.add('hidden-rep');
                  this.elements.upcomingDisplay.innerHTML = '';
                  this.elements.btnStart.classList.add('hidden');
                  this.elements.btnPause.classList.add('hidden');
                  this.elements.btnResume.classList.add('hidden');
                  return;
              }

              const { exercise } = currentPhase.context;
              this.elements.exerciseName.textContent = exercise.name;
              this.elements.exerciseDetails.textContent = this.formatExerciseDetails(currentPhase.context);

              if ((currentPhase.type === 'movement' || currentPhase.type === 'static_hold' || currentPhase.type === 'manual_rep') && currentPhase.context.rep) {
                this.elements.repDisplay.textContent = `${UI_TEXT.TRAINER_REP_LABEL} ${currentPhase.context.rep}`;
                this.elements.repDisplay.classList.remove('hidden-rep');
              } else {
                this.elements.repDisplay.classList.add('hidden-rep');
              }

              const nextExercisePhase = fullExecutionQueue.find((phase, index) => {
                  return index > currentQueueIndex && phase.context && phase.context.exercise && phase.context.exercise.instanceId !== exercise.instanceId;
              });

              if (nextExercisePhase && nextExercisePhase.context && nextExercisePhase.context.exercise) {
                this.elements.upcomingDisplay.innerHTML = `<strong>${UI_TEXT.TRAINER_UPCOMING_LABEL}</strong> ${nextExercisePhase.context.exercise.name}`;
              } else {
                this.elements.upcomingDisplay.innerHTML = '';
              }


              this.elements.btnStart.classList.toggle('hidden', status !== 'idle');
              this.elements.btnPause.classList.toggle('hidden', status !== 'running');
              this.elements.btnResume.classList.toggle('hidden', status !== 'paused');
              this.elements.btnManualRep.classList.toggle('hidden', !(status === 'running' && currentPhase.type === 'manual_rep'));

              // --- Main Render Logic ---
              this.ringText.classList.remove('is-timer', 'is-phase', 'is-rep-count', 'flashing');
              this.ringProgress.classList.remove('is-rest');


              if (status === 'running' || status === 'paused') {
                  if (currentPhase.type === 'movement') this.renderPhase(state, currentPhase);
                  else if (currentPhase.type === 'static_hold') this.renderStaticHold(state, currentPhase);
                  else if (currentPhase.type === 'manual_rep') this.renderManualReps(state, currentPhase);
                  else if (currentPhase.type === 'rest') this.renderRest(state, currentPhase);
                  else this.ringText.textContent = ''; // For audio/speech phases
              }

              if(status === 'paused') {
                this.renderPaused();
              }
          }

          renderPhase(state, phase) {
              const { phaseTimeElapsed } = state;
              const phaseNameDisplay = phase.phase.replace('pre-', '').toUpperCase();
              const isPrePhase = phase.phase.startsWith('pre-');

              this.ringText.textContent = phaseNameDisplay;
              this.ringText.classList.add('is-phase');
              this.ringText.classList.toggle('flashing', isPrePhase);

              const progressPercent = (phase.duration_ms > 0) ? (phaseTimeElapsed / phase.duration_ms) * 100 : 0;
              this.updateTimerRing(isPrePhase ? 100 : progressPercent);
          }

          renderStaticHold(state, phase) {
              const { phaseTimeElapsed } = state;
              const timeRemaining = phase.duration_ms - phaseTimeElapsed;
              const progressPercent = (phase.duration_ms > 0) ? (phaseTimeElapsed / phase.duration_ms) * 100 : 0;
              this.ringText.textContent = this.formatTime(timeRemaining);
              this.ringText.classList.add('is-timer');
              this.updateTimerRing(progressPercent);
          }

          renderManualReps(state, phase) {
              const repsCompleted = phase.repsCompleted || 0;
              const targetReps = phase.context.reps;
              const progressPercent = (targetReps > 0) ? (repsCompleted / targetReps) * 100 : 0;
              this.ringText.textContent = repsCompleted;
              this.ringText.classList.add('is-rep-count');
              this.updateTimerRing(progressPercent);
          }

          renderRest(state, phase) {
              const { phaseTimeElapsed } = state;
              const timeRemaining = phase.duration_ms - phaseTimeElapsed;
              const progressPercent = (phase.duration_ms > 0) ? (phaseTimeElapsed / phase.duration_ms) * 100 : 0;

              this.ringText.textContent = this.formatTime(timeRemaining);
              this.ringText.classList.add('is-timer');
              this.ringProgress.classList.add('is-rest');
              this.updateTimerRing(progressPercent);
          }

          renderPaused() {
              this.ringText.textContent = UI_TEXT.TRAINER_PAUSED_LABEL;
              this.ringText.classList.add('is-phase', 'flashing');
          }

          formatExerciseDetails(context) {
              const { exercise, set } = context;
              if (!exercise || !set) return '';
              let details = `${UI_TEXT.TRAINER_SET_LABEL} ${set} ${UI_TEXT.TRAINER_OF_SETS_LABEL} ${exercise.defaultSets}`;
              if (exercise.execution_mode === 'tempo_guided' || exercise.execution_mode === 'manual_reps') {
                  details += ` | ${exercise.defaultReps} ${UI_TEXT.TRAINER_REPS_LABEL}`;
              } else if (exercise.execution_mode === 'static_hold') {
                  details += ` | ${exercise.defaultDuration}s`;
              }
              if (exercise.defaultWeight) {
                  details += ` @ ${exercise.defaultWeight}kg`;
              }
              return details;
          }
      }
