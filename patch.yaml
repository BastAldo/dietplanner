    content: |
      /* --- DEBRIEFING VIEW STYLES --- */
      #debriefing-page {
          max-width: 800px;
          margin: 0 auto;
          padding: 1rem;
          text-align: center;
      }

      #debriefing-page h3 {
          color: var(--primary-color);
          margin-bottom: 2rem;
          font-size: 1.75rem;
      }

      #debriefing-stats-container {
        margin-bottom: 2rem;
      }

      #debriefing-stats-container h4 {
        color: var(--secondary-color);
        margin-bottom: 1rem;
        font-size: 1.25rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #debriefing-stats {
        display: flex;
        justify-content: center;
        gap: 2rem;
        padding: 1rem;
        background: var(--card-color);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        margin-bottom: 2rem;
      }

      .stat-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .stat-label {
        font-size: 0.9rem;
        color: var(--text-color-muted);
        text-transform: uppercase;
        margin-bottom: 0.5rem;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: bold;
        color: var(--primary-color);
      }

      #debriefing-summary {
          display: grid;
          grid-template-columns: 1fr;
          gap: 1rem;
          margin-bottom: 2rem;
      }

      .debriefing-card {
          background-color: var(--card-color);
          border: 1px solid var(--border-color);
          border-radius: 8px;
          padding: 1.5rem;
          text-align: left;
          position: relative;
          overflow: hidden;
      }
      
      .debriefing-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 0.5rem;
      }

      .debriefing-card h4 {
          font-size: 1.2rem;
          margin: 0;
      }
      
      .sets-summary {
        font-size: 0.9rem;
        font-weight: bold;
        color: var(--text-color-muted);
        margin-bottom: 1rem;
      }

      .sets-details-container {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--border-color);
      }

      .set-detail-item {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        color: var(--text-color);
      }
      
      .set-detail-item span:first-child {
        color: var(--text-color-muted);
      }

      .debriefing-status {
          font-size: 0.8rem;
          font-weight: bold;
          text-transform: uppercase;
          padding: 0.25rem 0.5rem;
          border-radius: 4px;
          flex-shrink: 0;
      }

      .debriefing-card.completed .debriefing-status {
          color: var(--success-color);
          background-color: rgba(102, 187, 106, 0.1);
      }

      .debriefing-card.incomplete .debriefing-status {
          color: var(--warning-color);
          background-color: rgba(253, 216, 53, 0.1);
      }

      @media (min-width: 768px) {
          #debriefing-summary {
              grid-template-columns: repeat(2, 1fr);
          }
      }
