commit_message: "feat(ui): Implement global alert banner and fix editor spacing"
rationale: |
  This commit implements a superior user experience for the application's initial empty state and simultaneously fixes a persistent UI bug in the Day Editor modal, based on direct user feedback.

  1.  **Global Alert Banner**: The previous logic of hiding the entire calendar when no configuration was loaded has been replaced. A new, non-intrusive "alert banner" now appears at the top of the application, guiding the user to load a configuration. This provides a better initial experience. The implementation involved adding the component to `index.html`, styling it in `style.css` (including a new `--warning-color`), and managing its visibility in `renderer.js` and `interactions.js`.

  2.  **Day Editor Spacing Fix**: The cramped spacing between meal slots in the Day Editor modal has been corrected by replacing the `gap` property with a more robust `margin-bottom` on each slot in `style.css`, ensuring consistent spacing on all devices.
