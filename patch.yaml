commit_message: "fix: Resolve view rendering and prevent data loss on week reset"
rationale: |
  Questa patch corregge due bug critici identificati durante una revisione approfondita del codice.

  **1. Correzione del Bug di Rendering della Vista (Log View):**
  * **Problema:** L'utente non poteva passare alla vista "Log" perché il componente di rendering (`plannerRenderer.js`) stava leggendo una variabile di stato obsoleta (`state.currentView`) che non veniva più aggiornata dopo un recente refactoring.
  * **Soluzione:** Il file `src/ui/plannerRenderer.js` è stato aggiornato per leggere la posizione corretta dello stato (`state.ui.currentView`). Questo riallinea la visualizzazione dell'interfaccia con lo stato effettivo dell'applicazione, risolvendo il bug.

  **2. Correzione del Bug di Perdita Dati (Reset Week):**
  * **Problema:** La funzione "Pulisci Settimana" (`resetCurrentWeek` in `state.js`) conteneva una logica errata che cancellava l'intero storico degli allenamenti (`workoutHistory`) dell'utente, invece di limitarsi a pulire i dati della sola settimana corrente. Questo avrebbe causato una perdita di dati irreversibile.
  * **Soluzione:** La funzione `resetCurrentWeek` è stata riscritta. Ora, invece di azzerare l'intero oggetto, il codice itera specificamente sui sette giorni della settimana visualizzata e rimuove selettivamente sia i pasti pianificati (`weeklyPlan`) sia gli allenamenti pianificati (`weeklyWorkouts`) e completati (`workoutHistory`) solo per quei giorni. Questo garantisce che la funzione operi come previsto senza causare perdite di dati in altre settimane.
patches:
  - file: src/core/state.js
    content: |
      import { LOCAL_STORAGE_KEY_PLAN, LOCAL_STORAGE_KEY_URL, MEAL_TYPES, LOCAL_STORAGE_KEY_BIOMETRICS, LOCAL_STORAGE_KEY_PROFILE, LOCAL_STORAGE_KEY_WORKOUTS, WORKOUT_SLOT_ID, LOCAL_STORAGE_KEY_WORKOUT_HISTORY, LOCAL_STORAGE_KEY_GOALS } from '../utils/constants.js';
      import { processMealsWithCalories } from './calorieCalculator.js';
      import { resetWorkoutState } from './trainer.js';
      import { log } from '../utils/logger.js';

      let state = {
        rules: [],
        masterMealList: [],
        masterWorkoutList: [],
        weeklyPlan: {},
        weeklyWorkouts: {},
        workoutHistory: {},
        biometricData: [],
        userProfile: {},
        userGoals: {},
        configUrl: '',
        recipeBaseUrl: '',
        focusedDate: new Date(),
        debugMode: false,
        ui: {
          currentView: 'planner', // 'planner', 'log', 'progress', 'charts', 'recipes', 'profile', 'trainer', 'debriefing', 'goals'
          lastWorkoutSummary: null,
          charts: {
            currentRangeFilter: 30,
            dateOffset: 0,
            selectedBiometric: 'weight',
            plannerChartType: 'bar'
          }
        }
      };

      const notify = () => document.dispatchEvent(new CustomEvent('stateChange'));
      const toISODateString = (date) => date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);

      const getWeekStartDate = (date) => {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        return new Date(d.setDate(diff));
      };

      export const getState = () => ({ ...state });
      export const setState = (newState) => {
        state = { ...state, ...newState };
        notify();
      }
      export const setUiState = (uiChanges) => {
        state.ui = { ...state.ui, ...uiChanges };
        notify();
      }

      export function getMealsForType(mealType) {
        return state.masterMealList.filter(meal => {
          if (meal.tipoPasto === 'Tutti') return true;
          if (Array.isArray(meal.tipoPasto)) {
            return meal.tipoPasto.includes(mealType);
          }
          return meal.tipoPasto === mealType;
        });
      }

      export function getExerciseForPlanner(slotId, instanceId) {
        const workoutList = state.weeklyWorkouts[slotId] || [];
        return workoutList.find(ex => ex.instanceId === parseFloat(instanceId));
      }

      export function getExerciseFromHistory(date, startTime, instanceId) {
        const workout = state.workoutHistory[date]?.find(w => w.startTime === startTime);
        if (!workout) return null;
        return workout.exercises.find(ex => ex.instanceId === parseFloat(instanceId));
      }

      export function toggleDebugMode() {
        state.debugMode = !state.debugMode;
        console.log(`%cDebug mode is now ${state.debugMode ? 'ON' : 'OFF'}`, 'color: white; background-color: #ef5350; padding: 4px; border-radius: 4px;');
      }

      export function setPlannerConfig(config, url) {
        log('State', 'Setting new planner config', { url });
        state.rules = config.rules || [];
        const ingredients = config.ingredienti || [];
        const meals = config.meals || [];
        state.masterWorkoutList = config.esercizi || [];

        // Calcola calorie e popola la master list
        state.masterMealList = processMealsWithCalories(meals, ingredients);

        // Deriva e imposta la recipeBaseUrl
        if (url) {
            const baseUrl = new URL(url);
            const recipePath = baseUrl.pathname.substring(0, baseUrl.pathname.lastIndexOf('/')) + '/ricette/';
            state.recipeBaseUrl = `${baseUrl.origin}${recipePath}`;
        } else {
            state.recipeBaseUrl = '';
        }

        notify();
      }

      export function setConfigUrl(url) {
        log('State', 'Setting new config URL', { url });
        state.configUrl = url;
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, url);
        notify();
      }

      export function saveStateToLocalStorage() {
        log('State', 'Saving all application state to localStorage');
        localStorage.setItem(LOCAL_STORAGE_KEY_PLAN, JSON.stringify(state.weeklyPlan));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUTS, JSON.stringify(state.weeklyWorkouts));
        localStorage.setItem(LOCAL_STORAGE_KEY_WORKOUT_HISTORY, JSON.stringify(state.workoutHistory));
        localStorage.setItem(LOCAL_STORAGE_KEY_BIOMETRICS, JSON.stringify(state.biometricData));
        localStorage.setItem(LOCAL_STORAGE_KEY_PROFILE, JSON.stringify(state.userProfile));
        localStorage.setItem(LOCAL_STORAGE_KEY_GOALS, JSON.stringify(state.userGoals));
      }

      export function loadStateFromLocalStorage() {
        log('State', 'Loading all application state from localStorage');
        const plan = localStorage.getItem(LOCAL_STORAGE_KEY_PLAN);
        const workouts = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUTS);
        const history = localStorage.getItem(LOCAL_STORAGE_KEY_WORKOUT_HISTORY);
        const url = localStorage.getItem(LOCAL_STORAGE_KEY_URL);
        const biometrics = localStorage.getItem(LOCAL_STORAGE_KEY_BIOMETRICS);
        const profile = localStorage.getItem(LOCAL_STORAGE_KEY_PROFILE);
        const goals = localStorage.getItem(LOCAL_STORAGE_KEY_GOALS);

        if (plan) { try { state.weeklyPlan = JSON.parse(plan); } catch (e) { console.error("Error parsing weeklyPlan", e); state.weeklyPlan = {}; } }
        if (workouts) { try { state.weeklyWorkouts = JSON.parse(workouts); } catch (e) { console.error("Error parsing weeklyWorkouts", e); state.weeklyWorkouts = {}; } }
        if (history) { try { state.workoutHistory = JSON.parse(history); } catch (e) { console.error("Error parsing workoutHistory", e); state.workoutHistory = {}; } }
        if (url) { state.configUrl = url; }
        if (biometrics) { try { state.biometricData = JSON.parse(biometrics); } catch (e) { console.error("Error parsing biometricData", e); state.biometricData = []; } }
        if (profile) { try { state.userProfile = JSON.parse(profile); } catch (e) { console.error("Error parsing userProfile", e); state.userProfile = {}; } }
        if (goals) { try { state.userGoals = JSON.parse(goals); } catch (e) { console.error("Error parsing userGoals", e); state.userGoals = {}; } }
      }

      export function setAppState(backupData) {
        log('State', 'Restoring application state from backup');
        state.weeklyPlan = backupData.weeklyPlan || {};
        state.weeklyWorkouts = backupData.weeklyWorkouts || {};
        state.workoutHistory = backupData.workoutHistory || {};
        state.configUrl = backupData.configUrl || '';
        state.biometricData = backupData.biometricData || [];
        state.userProfile = backupData.userProfile || {};
        state.userGoals = backupData.userGoals || {};
        saveStateToLocalStorage();
        localStorage.setItem(LOCAL_STORAGE_KEY_URL, state.configUrl);
        notify();
      }

      export function saveUserProfile(profile) {
        log('State', 'Saving user profile', { profile });
        state.userProfile = profile;
        saveStateToLocalStorage();
        notify();
      }

      export function saveUserGoals(goals) {
          log('State', 'Saving user goals', { goals });
          state.userGoals = goals;
          saveStateToLocalStorage();
          notify();
      }

      export function addOrUpdateBiometricEntry(entry) {
        log('State', 'Adding or updating biometric entry', { entry });
        const index = state.biometricData.findIndex(e => e.date === entry.date);
        if (index > -1) {
          state.biometricData[index] = entry;
        } else {
          state.biometricData.push(entry);
        }
        state.biometricData.sort((a, b) => new Date(b.date) - new Date(a.date));
        saveStateToLocalStorage();
        notify();
      }

      export function addMultipleBiometricEntries(newEntries) {
        log('State', 'Adding multiple biometric entries', { count: newEntries.length });
        state.biometricData = [...state.biometricData, ...newEntries];
        state.biometricData.sort((a, b) => new Date(b.date) - new Date(a.date));
        saveStateToLocalStorage();
        notify();
      }

      export function deleteBiometricEntry(date) {
        log('State', 'Deleting biometric entry', { date });
        state.biometricData = state.biometricData.filter(e => e.date !== date);
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyPlan(slotId, mealId) {
        log('State', 'Updating weekly plan', { slotId, mealId });
        if (mealId) {
          const meal = state.masterMealList.find(m => m.id === mealId);
          if (meal) {
            state.weeklyPlan[slotId] = { ...meal };
          }
        } else {
          delete state.weeklyPlan[slotId];
        }
        saveStateToLocalStorage();
        notify();
      }

      export function updateWeeklyWorkout(slotId, exerciseId, instanceId = null) {
        log('State', 'Updating weekly workout', { slotId, exerciseId, instanceId });
          if (!state.weeklyWorkouts[slotId]) {
              state.weeklyWorkouts[slotId] = [];
          }

          if (exerciseId) { // Add an exercise
              const exercise = state.masterWorkoutList.find(ex => ex.id === exerciseId);
              if (exercise) {
                  const newExerciseInstance = {
                      ...exercise,
                      instanceId: Date.now() + Math.random()
                  };
                  state.weeklyWorkouts[slotId].push(newExerciseInstance);
              }
          } else if (instanceId) { // Remove an exercise
              state.weeklyWorkouts[slotId] = state.weeklyWorkouts[slotId].filter(ex => ex.instanceId !== instanceId);
              if (state.weeklyWorkouts[slotId].length === 0) {
                  delete state.weeklyWorkouts[slotId];
              }
          }
          saveStateToLocalStorage();
          notify();
      }

      export function updateExerciseInstanceInWorkout(slotId, instanceId, newValues) {
        log('State', 'Updating exercise instance in planner', { slotId, instanceId, newValues });
          if (!state.weeklyWorkouts[slotId]) return;

          const workoutList = state.weeklyWorkouts[slotId];
          const exerciseIndex = workoutList.findIndex(ex => ex.instanceId === instanceId);

          if (exerciseIndex > -1) {
              const updatedExercise = { ...workoutList[exerciseIndex], ...newValues };
              if (newValues.defaultTempo) {
                  updatedExercise.defaultTempo = { ...workoutList[exerciseIndex].defaultTempo, ...newValues.defaultTempo };
              }
              workoutList[exerciseIndex] = updatedExercise;
              saveStateToLocalStorage();
              notify();
          }
      }

      export function reorderWorkoutExercises(slotId, oldIndex, newIndex) {
        log('State', 'Reordering workout exercises', { slotId, oldIndex, newIndex });
          if (!state.weeklyWorkouts[slotId] || oldIndex === newIndex) return;
          const workoutList = state.weeklyWorkouts[slotId];
          const [movedItem] = workoutList.splice(oldIndex, 1);
          workoutList.splice(newIndex, 0, movedItem);
          saveStateToLocalStorage();
          notify();
      }

      export function resetCurrentWeek() {
        log('State', 'Resetting current week');
        const weekStart = getWeekStartDate(state.focusedDate);
        for (let i = 0; i < 7; i++) {
            const date = new Date(weekStart);
            date.setDate(date.getDate() + i);
            const isoDate = toISODateString(date);

            // Clear meals for the day
            MEAL_TYPES.forEach(mealType => {
                const slotId = `${isoDate}-${mealType}`;
                if (state.weeklyPlan[slotId]) {
                    delete state.weeklyPlan[slotId];
                }
            });

            // Clear planned workouts for the day
            const workoutSlotId = `${isoDate}-${WORKOUT_SLOT_ID}`;
            if (state.weeklyWorkouts[workoutSlotId]) {
                delete state.weeklyWorkouts[workoutSlotId];
            }

            // Clear workout history for the day
            if (state.workoutHistory[isoDate]) {
                delete state.workoutHistory[isoDate];
            }
        }
        saveStateToLocalStorage();
        notify();
      }

      export function navigateWeek(direction) {
        log('State', 'Navigating week', { direction });
        const newDate = new Date(state.focusedDate);
        newDate.setDate(newDate.getDate() + (direction * 7));
        state.focusedDate = newDate;
        notify();
      }

      export function setView(view) {
        log('State', 'Setting new view', { newView: view, oldView: state.ui.currentView });
        if (['planner', 'log', 'progress', 'profile', 'charts', 'recipes', 'trainer', 'debriefing', 'goals'].includes(view)) {
          state.ui.currentView = view;
          notify();
        }
      }

      export function setLastWorkoutSummary(summary) {
        log('State', 'Setting last workout summary');
        state.ui.lastWorkoutSummary = summary;
        notify();
      }

      export function addWorkoutToHistory(summary) {
        log('State', 'Adding structured workout to history', { date: summary.date });
        if (summary && summary.date) {
            if (!state.workoutHistory[summary.date]) {
                state.workoutHistory[summary.date] = [];
            }
            state.workoutHistory[summary.date].push({ ...summary, type: 'structured' });
            saveStateToLocalStorage();
            notify();
        }
      }

      export function addManualWorkoutToHistory(date, activityData) {
          log('State', 'Adding manual workout to history', { date, activityData });
          if (!state.workoutHistory[date]) {
              state.workoutHistory[date] = [];
          }
          const manualWorkout = {
              type: 'manual',
              date: date,
              startTime: Date.now(),
              ...activityData
          };
          state.workoutHistory[date].push(manualWorkout);
          saveStateToLocalStorage();
          notify();
      }

      export function deleteWorkoutFromHistory(date, startTime) {
          log('State', 'Deleting workout from history', { date, startTime });
          if (state.workoutHistory[date]) {
              state.workoutHistory[date] = state.workoutHistory[date].filter(workout => workout.startTime !== startTime);
              if (state.workoutHistory[date].length === 0) {
                  delete state.workoutHistory[date];
              }
              saveStateToLocalStorage();
              notify();
          }
      }

      export function updateWorkoutInHistory(date, startTime, updates) {
          log('State', 'Updating workout in history', { date, startTime, updates });
          if (state.workoutHistory[date]) {
              const workoutIndex = state.workoutHistory[date].findIndex(w => w.startTime === startTime);
              if (workoutIndex > -1) {
                  state.workoutHistory[date][workoutIndex] = {
                      ...state.workoutHistory[date][workoutIndex],
                      ...updates
                  };
                  saveStateToLocalStorage();
                  notify();
              }
          }
      }

      export function updateExerciseSetsInHistory(date, startTime, exerciseInstanceId, newSetsData) {
        log('State', 'Updating exercise sets in history', { date, startTime, exerciseInstanceId });
        if (!state.workoutHistory[date]) return;

        const workoutIndex = state.workoutHistory[date].findIndex(w => w.startTime === startTime);
        if (workoutIndex === -1) return;

        const workout = state.workoutHistory[date][workoutIndex];
        const exerciseIndex = workout.exercises.findIndex(ex => ex.instanceId === exerciseInstanceId);
        if (exerciseIndex === -1) return;

        // Update sets data for the specific exercise
        workout.exercises[exerciseIndex].setsData = newSetsData;

        // Recalculate tonnage for the exercise
        const exerciseTonnage = newSetsData.reduce((acc, set) => acc + ((set.reps || 0) * (set.weight || 0)), 0);
        workout.exercises[exerciseIndex].tonnage = exerciseTonnage;

        // Recalculate total tonnage for the entire workout
        workout.totalTonnage = workout.exercises.reduce((acc, ex) => acc + (ex.tonnage || 0), 0);

        saveStateToLocalStorage();
        notify();
      }


      export function copyPreviousWeek() {
        log('State', 'Copying previous week');
        const currentWeekStart = getWeekStartDate(state.focusedDate);
        const prevWeekStart = new Date(currentWeekStart);
        prevWeekStart.setDate(prevWeekStart.getDate() - 7);

        for (let i = 0; i < 7; i++) {
          const sourceDate = new Date(prevWeekStart);
          sourceDate.setDate(sourceDate.getDate() + i);
          const sourceISO = toISODateString(sourceDate);

          const destDate = new Date(currentWeekStart);
          destDate.setDate(destDate.getDate() + i);
          const destISO = toISODateString(destDate);

          MEAL_TYPES.forEach(mealType => {
            const sourceSlotId = `${sourceISO}-${mealType}`;
            const destSlotId = `${destISO}-${mealType}`;
            const mealObject = state.weeklyPlan[sourceSlotId];

            if (mealObject) {
              state.weeklyPlan[destSlotId] = { ...mealObject };
            } else {
              delete state.weeklyPlan[destSlotId];
            }
          });

          const sourceWorkoutSlot = `${sourceISO}-${WORKOUT_SLOT_ID}`;
          const destWorkoutSlot = `${destISO}-${WORKOUT_SLOT_ID}`;
          const workoutList = state.weeklyWorkouts[sourceWorkoutSlot];
          if (workoutList && Array.isArray(workoutList)) {
              state.weeklyWorkouts[destWorkoutSlot] = JSON.parse(JSON.stringify(workoutList));
          } else {
              delete state.weeklyWorkouts[destWorkoutSlot];
          }
        }
        saveStateToLocalStorage();
        notify();
      }
  - file: src/ui/plannerRenderer.js
    content: |
      import { MEAL_TYPES, WEEK_STARTS_ON_MONDAY, DAYS, WORKOUT_SLOT_ID } from '../utils/constants.js';
      import { UI_TEXT } from '../config/uiText.js';
      import { renderIcon } from './icons.js';

      function toISODateString(date) {
        return date.getFullYear() + '-' + ('0' + (date.getMonth() + 1)).slice(-2) + '-' + ('0' + date.getDate()).slice(-2);
      }

      function getWeekStartDate(date) {
        const d = new Date(date);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : WEEK_STARTS_ON_MONDAY);
        return new Date(d.setDate(diff));
      }

      function formatShortDate(date) {
        return date.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
      }

      function formatFullDate(isoDate) {
        const date = new Date(isoDate);
        return date.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
      }

      function formatMealCalories(meal) {
        if (!meal || typeof meal.calories_min !== 'number') return '';
        const minCals = Number(meal.calories_min) || 0;
        const maxCals = Number(meal.calories_max) || minCals;
        if (minCals === 0 && maxCals === 0) return '';
        const kcalLabel = UI_TEXT.KCAL_LABEL || 'Kcal';
        if (minCals === maxCals) return `${minCals} ${kcalLabel}`;
        return `${minCals} - ${maxCals} ${kcalLabel}`;
      }

      function calculateDailyCalories(isoDate, weeklyPlan) {
        let min = 0, max = 0;
        MEAL_TYPES.forEach(type => {
          const meal = weeklyPlan[`${isoDate}-${type}`];
          if (meal && typeof meal.calories_min === 'number') {
            const minCals = Number(meal.calories_min) || 0;
            const maxCals = Number(meal.calories_max) || minCals;
            min += minCals;
            max += maxCals;
          }
        });
        if (min === 0 && max === 0) return '';
        return min === max ? `${UI_TEXT.KCAL_LABEL}: ${min}` : `${UI_TEXT.KCAL_LABEL}: ${min} - ${max}`;
      }

      function getRecipeButtonHTML(meal, state) {
        const fullMeal = state.masterMealList.find(m => m.id === meal.id);
        if (state.recipeBaseUrl && fullMeal && fullMeal.recipeId) {
          return `<button class="btn-view-recipe" data-meal-id="${fullMeal.id}" title="${UI_TEXT.RECIPE_BUTTON_TITLE}">
                    ${renderIcon('RECIPE', { width: 20, height: 20 })}
                  </button>`;
        }
        return '';
      }

      function getSetDetails(setData) {
          let details = [];
          if (setData.reps) details.push(`${setData.reps} reps`);
          if (setData.weight) details.push(`${setData.weight} kg`);
          if (setData.duration) details.push(`${formatDuration(setData.duration)}`);
          return details.join(' / ');
      }

      function formatDuration(ms) {
          if (typeof ms !== 'number' || ms < 0) return '00:00';
          const totalSeconds = Math.floor(ms / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }

      function renderPlannerSummaryWidget(state, weekStart) {
        const widgetContainer = document.getElementById('planner-summary-widget');
        const { userGoals, biometricData, workoutHistory } = state;
        let totalCaloriesConsumed = 0;
        let dayCount = 0;
        let completedWorkouts = 0;
        let totalCaloriesBurned = 0;

        for (let i = 0; i < 7; i++) {
            const dayDate = new Date(weekStart);
            dayDate.setDate(dayDate.getDate() + i);
            const isoDate = toISODateString(dayDate);

            let dailyMin = 0;
            let hasMeals = false;
            MEAL_TYPES.forEach(type => {
                const meal = state.weeklyPlan[`${isoDate}-${type}`];
                if (meal) {
                    dailyMin += Number(meal.calories_min) || 0;
                    hasMeals = true;
                }
            });

            if (hasMeals) {
                totalCaloriesConsumed += dailyMin;
                dayCount++;
            }

            if (workoutHistory[isoDate]) {
                completedWorkouts += workoutHistory[isoDate].length;
                workoutHistory[isoDate].forEach(workout => {
                    totalCaloriesBurned += workout.totalCaloriesBurned || 0;
                });
            }
        }

        const avgCalories = dayCount > 0 ? Math.round(totalCaloriesConsumed / dayCount) : 0;
        const calGoal = userGoals.avg_calories || 0;
        const workoutGoal = userGoals.num_workouts || 0;
        const weightGoal = userGoals.target_weight || 0;
        const latestWeight = biometricData.length > 0 ? biometricData[0].weight : 0;
        const kgToGoal = (latestWeight && weightGoal) ? (latestWeight - weightGoal).toFixed(1) : 0;

        let weightProgressHTML = '';
        if (latestWeight > 0 && weightGoal > 0) {
            weightProgressHTML = `
            <div class="planner-summary-stat">
                <div class="stat-icon">${renderIcon('GOAL', {width: 20, height: 20})}</div>
                <div>
                    <span class="stat-value">${kgToGoal} kg</span>
                    <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_WEIGHT_PROGRESS}</span>
                </div>
            </div>`;
        }

        widgetContainer.innerHTML = `
            <h3 class="planner-summary-title">${UI_TEXT.PLANNER_SUMMARY_TITLE}</h3>
            <div class="planner-summary-stats">
                <div class="planner-summary-stat">
                    <div class="stat-icon">${renderIcon('PLANNER', {width: 20, height: 20})}</div>
                    <div>
                        <span class="stat-value">${avgCalories} ${calGoal > 0 ? `/ ${calGoal}`: ''}</span>
                        <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_AVG_KCAL}</span>
                    </div>
                </div>
                <div class="planner-summary-stat">
                    <div class="stat-icon">${renderIcon('WEIGHT_SCALE', {width: 20, height: 20})}</div>
                    <div>
                        <span class="stat-value">${completedWorkouts} ${workoutGoal > 0 ? `/ ${workoutGoal}`: ''}</span>
                        <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_WORKOUTS}</span>
                    </div>
                </div>
                <div class="planner-summary-stat">
                    <div class="stat-icon">${renderIcon('BAR_CHART', {width: 20, height: 20})}</div>
                    <div>
                        <span class="stat-value">${Math.round(totalCaloriesBurned)}</span>
                        <span class="stat-label">${UI_TEXT.PLANNER_SUMMARY_CALORIES_BURNED}</span>
                    </div>
                </div>
                ${weightProgressHTML}
            </div>
        `;
      }

      function renderCalendarView(state, weekStart) {
        const calendarGrid = document.getElementById('calendar-grid');
        const todayISO = toISODateString(new Date());
        calendarGrid.innerHTML = '';
        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const dayName = DAYS[i];
          const isoDate = toISODateString(dayDate);
          const dailyCalories = calculateDailyCalories(isoDate, state.weeklyPlan);
          const workoutList = state.weeklyWorkouts[`${isoDate}-${WORKOUT_SLOT_ID}`];

          let summaryHTML = `<div class="daily-calories">${dailyCalories}</div>`;
          let workoutButtonHTML = '';

          if (workoutList && workoutList.length > 0) {
              const exerciseCount = workoutList.length;
              const plural = exerciseCount > 1 ? UI_TEXT.PLANNER_EXERCISES_MULTI_LABEL : UI_TEXT.PLANNER_EXERCISES_SINGLE_LABEL;
              summaryHTML += `<div class="daily-summary-item">${renderIcon('WEIGHT_SCALE', {width: 16, height: 16})} ${exerciseCount} ${plural}</div>`;
              workoutButtonHTML = `<button class="btn btn-primary btn-start-workout-day" data-date="${isoDate}">${UI_TEXT.START_WORKOUT_BTN}</button>`;
          }

          const dayCell = document.createElement('div');
          dayCell.className = 'day-cell';
          if (isoDate === todayISO) {
            dayCell.classList.add('is-today');
          }
          dayCell.dataset.date = isoDate;
          dayCell.innerHTML = `
            <div class="day-cell__header"><span>${dayName}</span><span>${dayDate.getDate()}</span></div>
            <div class="day-cell__body">${summaryHTML}${workoutButtonHTML}</div>`;
          calendarGrid.appendChild(dayCell);
        }
      }

      function renderLogView(state, weekStart) {
        const logView = document.getElementById('log-view');
        const todayISO = toISODateString(new Date());
        let logViewHTML = '';
        let hasContent = false;

        for (let i = 0; i < 7; i++) {
          const dayDate = new Date(weekStart);
          dayDate.setDate(dayDate.getDate() + i);
          const isoDate = toISODateString(dayDate);
          const dayMeals = MEAL_TYPES.map(type => ({ type, meal: state.weeklyPlan[`${isoDate}-${type}`] })).filter(item => item.meal);
          const completedWorkouts = state.workoutHistory[isoDate] || [];

          if (dayMeals.length > 0 || completedWorkouts.length > 0) {
            hasContent = true;
            let dayLogHTML = `<div class="log-day ${isoDate === todayISO ? 'is-today' : ''}">`;
            dayLogHTML += `<h3><span>${formatFullDate(isoDate)}</span><span class="log-day__total-calories">${calculateDailyCalories(isoDate, state.weeklyPlan)}</span></h3>`;

            if (dayMeals.length > 0) {
              dayLogHTML += dayMeals.map(item => `<div class="log-item"><div class="log-item__name"><strong>${item.type}:</strong><span>${item.meal.nomePasto}</span>${getRecipeButtonHTML(item.meal, state)}</div><span class="log-item__calories">${formatMealCalories(item.meal)}</span></div>`).join('');
            }

            if (completedWorkouts.length > 0) {
                completedWorkouts.forEach(workout => {
                    if (workout.type === 'structured') {
                        dayLogHTML += `<div class="log-workout-summary">
                            <div class="log-workout-header">
                                <h4>${UI_TEXT.LOG_VIEW_WORKOUT_TITLE}</h4>
                                <div class="log-workout-header-actions">
                                    <button class="btn-delete-workout" data-date="${workout.date}" data-starttime="${workout.startTime}" title="Elimina Allenamento">${renderIcon('TRASH')}</button>
                                </div>
                            </div>
                            <div class="log-workout-stats">
                                <span>Durata: ${formatDuration(workout.totalTime)}</span>
                                ${workout.totalCaloriesBurned > 0 ? `<span>/</span><span>Kcal: ${workout.totalCaloriesBurned}</span>` : ''}
                                ${workout.totalTonnage > 0 ? `<span>/</span><span>Volume: ${workout.totalTonnage} kg</span>` : ''}
                                ${workout.rpe ? `<span>/</span><span>RPE: ${workout.rpe}</span>` : ''}
                            </div>
                            ${workout.exercises.map(ex => `
                            <div class="log-workout-exercise">
                                <div class="log-item">
                                  <strong>${ex.name}</strong>
                                  <div class="log-workout-header-actions">
                                    <button class="btn-edit-logged-exercise" data-date="${workout.date}" data-starttime="${workout.startTime}" data-instanceid="${ex.instanceId}" title="Modifica Esercizio">${renderIcon('EDIT')}</button>
                                  </div>
                                </div>
                                <div class="log-sets-details">
                                ${ex.setsData.map((setData, i) => `
                                    <div class="log-set-item">
                                    <span>Serie ${i + 1}</span>
                                    <span>${getSetDetails(setData)}</span>
                                    </div>
                                `).join('')}
                                </div>
                            </div>
                            `).join('')}
                        </div>`;
                    } else if (workout.type === 'manual') {
                        let detailsHTML = '';
                        if (workout.distance) detailsHTML += `<div><strong>Distanza:</strong> ${workout.distance} km</div>`;
                        if (workout.fc_avg) detailsHTML += `<div><strong>FC Media:</strong> ${workout.fc_avg} bpm</div>`;
                        if (workout.fc_max) detailsHTML += `<div><strong>FC Max:</strong> ${workout.fc_max} bpm</div>`;
                        if (workout.notes) detailsHTML += `<div class="log-item-details">${workout.notes.replace(/\n/g, '<br>')}</div>`;

                        dayLogHTML += `<div class="log-workout-summary">
                            <div class="log-workout-header">
                                <h4>${UI_TEXT.LOG_VIEW_MANUAL_ACTIVITY_TITLE}</h4>
                                <div class="log-workout-header-actions">
                                  <button class="btn-delete-workout" data-date="${workout.date}" data-starttime="${workout.startTime}" title="Elimina Allenamento">${renderIcon('TRASH')}</button>
                                </div>
                            </div>
                            <div class="log-item">
                                <strong>${workout.name}</strong>
                                <span>${workout.duration || ''}</span>
                            </div>
                            ${detailsHTML ? `<div class="log-manual-details">${detailsHTML}</div>` : ''}
                        </div>`;
                    }
                });
            }

            dayLogHTML += `</div>`;
            logViewHTML += dayLogHTML;
          }
        }

        if (!hasContent) {
          logView.innerHTML = `<p class="placeholder-text">${UI_TEXT.LOG_VIEW_EMPTY}</p>`;
        } else {
          logView.innerHTML = logViewHTML;
        }
      }

      export function renderPlannerPage(state) {
        const weekStart = getWeekStartDate(state.focusedDate);
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekEnd.getDate() + 6);
        document.getElementById('week-title').textContent = `${formatShortDate(weekStart)} - ${formatShortDate(weekEnd)}`;

        const calendarGrid = document.getElementById('calendar-grid');
        const logView = document.getElementById('log-view');
        const viewCalendarBtn = document.getElementById('view-calendar-btn');
        const viewLogBtn = document.getElementById('view-log-btn');
        const { currentView } = state.ui;

        if (currentView === 'planner' || currentView === 'log') {
            renderPlannerSummaryWidget(state, weekStart);
        }

        if (currentView === 'planner') {
            calendarGrid.classList.remove('hidden');
            logView.classList.add('hidden');
            viewCalendarBtn.classList.add('active');
            viewLogBtn.classList.remove('active');
        } else if (currentView === 'log') {
            calendarGrid.classList.add('hidden');
            logView.classList.remove('hidden');
            viewCalendarBtn.classList.remove('active');
            viewLogBtn.classList.add('active');
        }

        renderCalendarView(state, weekStart);
        renderLogView(state, weekStart);
      }
